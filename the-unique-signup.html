<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – Membership Registration</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- THE UNIQUE 타이틀용 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000;
    }

    .scene { position: fixed; inset: 0; overflow: hidden; }
    .scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .page-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      z-index: 10;
    }

    .gate-card {
      position: relative;
      border-radius: 26px;
      padding: 28px 26px 22px;

      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(250, 204, 21, 0.95);
      box-shadow:
        0 0 14px rgba(250, 204, 21, 0.45),
        0 26px 70px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      overflow: visible;
    }

    .gate-inner { position: relative; z-index: 1; }
    .gate-title-wrap { text-align: center; margin-bottom: 22px; }

    .gate-title {
      font-family: "Cinzel", "Times New Roman", serif;
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 8px;

      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 10px rgba(250, 204, 21, 0.9),
        0 4px 18px rgba(0,0,0,1);
    }

    .gate-subtitle-en {
      font-size: 11px;
      color: #f9fafb;
      opacity: 0.9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow:
        0 1px 3px rgba(0,0,0,0.9),
        0 0 6px rgba(0,0,0,0.6);
    }

    .form-body { max-width: 360px; margin: 0 auto; }
    .gate-input-wrap { margin-bottom: 10px; }

    .gate-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.90), rgba(3,7,18,0.96));
      color: #f9fafb;
      font-size: 13px;
      outline: none;
      box-shadow:
        0 4px 14px rgba(0,0,0,0.75) inset,
        0 0 0 1px rgba(0,0,0,0.55);
    }

    .gate-input::placeholder { color: #6b7280; }

    .gate-input:focus {
      border-color: rgba(248,181,84,0.95);
      box-shadow:
        0 0 0 1px rgba(248,181,84,0.6),
        0 6px 22px rgba(0,0,0,0.9) inset;
    }

    select.gate-input {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
    }

    select.gate-input option { background: #020617; color: #f9fafb; }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .btn-primary {
      background: radial-gradient(circle at top, #f97316, #7f1d1d);
      border-color: rgba(248,181,84,0.95);
      color: #fef2f2;
      box-shadow:
        0 10px 26px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 16px 38px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-ghost {
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-color: rgba(55,65,81,1);
      color: #e5e7eb;
      box-shadow: 0 8px 22px rgba(0,0,0,0.9);
    }

    .btn-ghost:hover {
      background: rgba(15,23,42,1);
      border-color: rgba(148,163,184,0.9);
    }

    .status {
      min-height: 18px;
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .status-error { color: #fecaca; }
    .status-ok { color: #bbf7d0; }

    @media (max-width: 768px) {
      .gate-card { padding: 24px 20px 18px; border-radius: 22px; }
      .gate-title { font-size: 32px; letter-spacing: 0.22em; }
      .form-body { max-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="scene">
    <!-- 🔥 회원가입 전용 배경 -->
    <img src="img/bg-unique-signup.jpg" class="scene-bg" alt="The Unique signup background">

    <div class="page-wrap">
      <main class="gate-card">
        <div class="gate-inner">
          <div class="gate-title-wrap">
            <div class="gate-title">THE UNIQUE</div>
            <div class="gate-subtitle-en">Membership registration for action takers</div>
          </div>

          <!-- ✅ Apps Script로 직접 시트 저장 -->
          <form id="uniqueSignupForm" class="form-body">
            <!-- 아이디 -->
            <div class="gate-input-wrap">
              <input id="signup-id" type="text" class="gate-input" placeholder="아이디" autocomplete="off" required />
            </div>

            <!-- 이름 -->
            <div class="gate-input-wrap">
              <input id="signup-name" type="text" class="gate-input" placeholder="이름" autocomplete="off" required />
            </div>

            <!-- 전화번호 -->
            <div class="gate-input-wrap">
              <input id="signup-phone" type="text" class="gate-input" placeholder="전화번호 (예: 01012345678)" autocomplete="off" required />
            </div>

            <!-- 소속 선택 -->
            <div class="gate-input-wrap">
              <select id="signup-team" class="gate-input" required>
                <option value="">소속을 선택하세요</option>
                <option value="이두연">이두연</option>
                <option value="임정애">임정애</option>
                <option value="이동연">이동연</option>
                <option value="윤지민">윤지민</option>
                <option value="한기림">한기림</option>
                <option value="이윤경">이윤경</option>
                <option value="이민율">이민율</option>
                <option value="이유송">이유송</option>
              </select>
            </div>

            <div class="btn-row">
              <button type="submit" class="btn btn-primary">가입 신청</button>
              <button type="button" class="btn btn-ghost" onclick="history.back()">뒤로가기</button>
            </div>

            <div id="status" class="status"></div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script>
    // ✅ 너의 배포 URL
    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyxWfbTszWMXI-OdtQ9dAIsixh7X8w_1v8VAwseaQfvGFzO2yr56CrS1sra_AdKoYe_/exec";

    // JSONP 호출 (GitHub Pages에서도 CORS 없이 호출 가능)
    function api(action, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
        params.action = action;
        params.callback = cb;
        params._t = Date.now();

        const qs = new URLSearchParams(params).toString();
        const s = document.createElement("script");
        s.src = GOOGLE_SCRIPT_URL + "?" + qs;

        s.onerror = () => { cleanup(); reject(new Error("API load failed")); };
        window[cb] = (data) => { cleanup(); resolve(data); };

        function cleanup() { delete window[cb]; s.remove(); }
        document.body.appendChild(s);
      });
    }

    function saveUserToLocal(u) {
      const normalized = (u.id || "").toLowerCase();

      localStorage.setItem("uniqueCurrentUser", JSON.stringify({
        id: normalized,
        name: u.name || "",
        nickname: u.nickname || "",
        team: u.team || "",
        joinedAt: u.joinedAt || "",
        balance: Number(u.balance || 0)
      }));

      localStorage.setItem("myUtPoints", Number(u.balance || 0));
      if (u.nickname) localStorage.setItem("myNickname_" + normalized, u.nickname);
    }

    const form = document.getElementById("uniqueSignupForm");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "status";

      const id = (document.getElementById("signup-id").value || "").trim();
      const name = (document.getElementById("signup-name").value || "").trim();
      const phone = (document.getElementById("signup-phone").value || "").trim();
      const team = (document.getElementById("signup-team").value || "").trim();

      if (!id || !name || !phone || !team) {
        statusEl.textContent = "모든 항목을 입력/선택해 주세요.";
        statusEl.classList.add("status-error");
        return;
      }

      statusEl.textContent = "가입 처리 중...";

      try {
        const r = await api("signup", { id, name, phone, team });

        if (!r.ok || !r.user) {
          statusEl.textContent = "가입 실패: " + (r.error || "unknown");
          statusEl.classList.add("status-error");
          return;
        }

        saveUserToLocal(r.user);

        statusEl.textContent = "가입 완료! 메인으로 이동합니다.";
        statusEl.classList.add("status-ok");

        // ✅ 원하면 gate로 보내고 싶으면 아래 줄을 gate로 바꿔도 됨.
        // window.location.href = "the-unique-gate.html";
        window.location.href = "the-unique-main.html";

      } catch (err) {
        console.error(err);
        statusEl.textContent = "가입 처리 중 오류가 발생했습니다.";
        statusEl.classList.add("status-error");
      }
    });
  </script>
</body>
</html>
