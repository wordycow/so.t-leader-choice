<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE CASINO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #050714;
            --text: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Pretendard', sans-serif;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* 상단 타이틀 */
        .header-overlay {
            position: absolute;
            top: 40px; left: 0; width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none; 
        }
        h1 {
            font-size: 3.5rem; margin: 0;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text; color: transparent;
        }
        p { 
            font-size: 1.1rem; color: rgba(255,255,255,0.7); 
            margin-top: 10px; font-weight: 400; letter-spacing: 4px;
            text-shadow: 0 2px 5px rgba(0,0,0,1);
        }
        
        /* [추가] 로그인한 유저 아이디 표시 */
        .user-greet {
            margin-top: 5px;
            font-size: 1rem; color: #ffd700;
            font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* 메인 컨테이너 */
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 공통 패널 스타일 */
        .game-panel {
            flex: 1; 
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: all 0.5s ease;
            overflow: hidden;
            cursor: pointer;
        }

        /* 배경 효과 */
        .game-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            transition: 0.5s;
            z-index: 0;
        }

        /* 1. 슬롯 배경 */
        .slot-panel::before { 
            background-image: url('games/img/slot/slot-bg.png'); 
        }

        /* 2. 룰렛 배경 */
        .roulette-panel::before {
            background-image: url('games/img/slot/roulette-bg.png');
        }

        /* 내용물 */
        .content {
            position: relative; z-index: 10;
            text-align: center;
            transition: 0.4s;
        }
        .game-panel:hover .content { transform: scale(1.1); }

        .icon {
            font-size: 8rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
            transition: 0.4s;
        }
        
        .slot-panel:hover .icon { animation: shake 0.5s infinite; filter: drop-shadow(0 0 30px #00d2ff); }
        .roulette-panel:hover .icon { animation: spin 3s infinite linear; filter: drop-shadow(0 0 30px #ff0055); }

        .title {
            font-size: 3.5rem; font-weight: 900;
            text-transform: uppercase; margin: 0;
            letter-spacing: 2px;
        }
        .desc {
            font-size: 1rem; color: #aaa; margin-top: 10px; letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slot-panel .title { color: #00d2ff; text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
        .roulette-panel .title { color: #ff0055; text-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }

        /* 나가기 버튼 */
        .back-btn {
            position: absolute;
            bottom: 50px; left: 50%;
            transform: translateX(-50%);
            padding: 14px 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: 0.3s;
        }
        .back-btn:hover { 
            background: white; color: black; 
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        @keyframes shake {
            0% { transform: translateY(0); }
            25% { transform: translateY(-3px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(3px); }
            100% { transform: translateY(0); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            h1 { font-size: 2rem; letter-spacing: 4px; }
            .header-overlay { top: 20px; }
            .game-panel { border: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .slot-panel:hover, .roulette-panel:hover { flex: 1; }
            .icon { font-size: 5rem; margin-bottom: 5px;}
            .title { font-size: 2.5rem; }
            .back-btn { bottom: 30px; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div class="header-overlay">
        <h1>THE CASINO</h1>
        <p>SELECT YOUR GAME</p>
        <div id="welcome-msg" class="user-greet"></div>
    </div>

    <div class="split-container">
        
        <a id="link-slot" href="#" class="game-panel slot-panel">
            <div class="content">
                <div class="icon">🎰</div>
                <div class="title">SLOT</div>
                <div class="desc">Jackpot Machine</div>
            </div>
        </a>

        <a id="link-roulette" href="#" class="game-panel roulette-panel">
            <div class="content">
                <div class="icon">🎡</div>
                <div class="title">ROULETTE</div>
                <div class="desc">Equity Spin</div>
            </div>
        </a>

    </div>

    <a href="the-unique-main.html" class="back-btn">EXIT LOBBY</a>

    <script>
        window.onload = function() {
            // 1. 저장된 아이디 가져오기 (메인화면에서 저장한 키값들을 다 뒤져봄)
            const myId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');

            // 2. 아이디가 없으면 경고하고 메인으로 쫓아냄 (보안)
            if (!myId) {
                alert("로그인이 필요합니다. 메인화면으로 이동합니다.");
                location.href = "the-unique-main.html";
                return;
            }

            // 3. 화면에 환영 메시지 띄우기
            document.getElementById('welcome-msg').innerText = "PLAYER: " + myId;

            // 4. 게임 버튼들에 아이디 심어주기 (이게 핵심!)
            // 이렇게 하면 slot.html?id=아이디 형식으로 넘어가서, 게임방이 '아! 얘구나' 하고 알아먹습니다.
            document.getElementById('link-slot').href = "games/slot.html?id=" + myId;
            document.getElementById('link-roulette').href = "games/roulette.html?id=" + myId;
        };
    </script>

</body>
</html>
