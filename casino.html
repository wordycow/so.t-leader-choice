<!DOCTYPE html>
<html lang="ko"> 
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE CASINO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #050714;
            --text: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Pretendard', sans-serif;
            height: 100vh;
            overflow: hidden; /* 스크롤 없애고 화면 꽉 채움 */
            display: flex;
            flex-direction: column;
        }

        /* 상단 타이틀 (화면 위에 띄움) */
        .header-overlay {
            position: absolute;
            top: 40px; left: 0; width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none; /* 클릭 통과 */
        }
        h1 {
            font-size: 3.5rem; margin: 0;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text; color: transparent;
        }
        p { 
            font-size: 1.1rem; color: rgba(255,255,255,0.7); 
            margin-top: 10px; font-weight: 400; letter-spacing: 4px;
            text-shadow: 0 2px 5px rgba(0,0,0,1);
        }

        /* 메인 컨테이너 (화면 분할) */
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 공통 카드 스타일 */
        .game-panel {
            flex: 1; /* 50:50 분할 */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: all 0.5s ease;
            overflow: hidden;
            cursor: pointer;
        }

        /* 배경 효과 */
        .game-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            transition: 0.5s;
            z-index: 0;
        }

        /* 1. 슬롯 배경 */
        .slot-panel::before { 
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            
            /* ▼▼▼ 여기 경로 수정됨 ▼▼▼ */
            background-image: url('games/img/slot/slot-bg.png'); 
            
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            transition: 0.5s;
            z-index: 0;
        }

        /* 2. 룰렛 배경 */
        .roulette-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;

            /* ▼▼▼ 여기 경로 수정됨 ▼▼▼ */
            background-image: url('games/img/slot/roulette-bg.png');

            background-size: cover;
            background-position: center;
            opacity: 0.6;
            transition: 0.5s;
            z-index: 0;
        }

        /* 내용물 (아이콘, 텍스트) */
        .content {
            position: relative; z-index: 10;
            text-align: center;
            transition: 0.4s;
        }
        .game-panel:hover .content { transform: scale(1.1); }

        .icon {
            font-size: 8rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
            transition: 0.4s;
        }
        
        /* 호버 시 아이콘 애니메이션 */
        .slot-panel:hover .icon { animation: shake 0.5s infinite; filter: drop-shadow(0 0 30px #00d2ff); }
        .roulette-panel:hover .icon { animation: spin 3s infinite linear; filter: drop-shadow(0 0 30px #ff0055); }

        .title {
            font-size: 3.5rem; font-weight: 900;
            text-transform: uppercase; margin: 0;
            letter-spacing: 2px;
        }
        .desc {
            font-size: 1rem; color: #aaa; margin-top: 10px; letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 색상 포인트 */
        .slot-panel .title { color: #00d2ff; text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
        .roulette-panel .title { color: #ff0055; text-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }

        /* 나가기 버튼 (하단 중앙) */
        .back-btn {
            position: absolute;
            bottom: 50px; left: 50%;
            transform: translateX(-50%);
            padding: 14px 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: 0.3s;
        }
        .back-btn:hover { 
            background: white; color: black; 
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        /* 애니메이션 키프레임 */
        @keyframes shake {
            0% { transform: translateY(0); }
            25% { transform: translateY(-3px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(3px); }
            100% { transform: translateY(0); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 모바일 대응 (세로 배치) */
        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            h1 { font-size: 2rem; letter-spacing: 4px; }
            .header-overlay { top: 20px; }
            
            .game-panel { border: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .slot-panel:hover, .roulette-panel:hover { flex: 1; } /* 모바일은 크기 변화 X */
            
            .icon { font-size: 5rem; margin-bottom: 5px;}
            .title { font-size: 2.5rem; }
            .back-btn { bottom: 30px; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div class="header-overlay">
        <h1>THE CASINO</h1>
        <p>SELECT YOUR GAME</p>
    </div>

    <div class="split-container">
        
        <a href="games/slot.html" class="game-panel slot-panel">
            <div class="content">
                <div class="icon">🎰</div>
                <div class="title">SLOT</div>
                <div class="desc">Jackpot Machine</div>
            </div>
        </a>

        <a href="games/roulette.html" class="game-panel roulette-panel">
            <div class="content">
                <div class="icon">🎡</div>
                <div class="title">ROULETTE</div>
                <div class="desc">Equity Spin</div>
            </div>
        </a>

    </div>

    <a href="the-unique-main.html" class="back-btn">EXIT LOBBY</a>

</body>
</html>
