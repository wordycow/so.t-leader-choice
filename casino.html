<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE CASINO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #050714;
            --text: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Pretendard', sans-serif;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* 상단 타이틀 (더 얇고 세련되게 변경) */
        .header-overlay {
            position: absolute;
            top: 40px; left: 0; width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 2.5rem; margin: 0;
            font-weight: 300; /* 얇은 폰트로 변경 */
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #fff;
            opacity: 0.9;
        }
        .user-greet {
            margin-top: 10px;
            font-size: 0.9rem; color: #ffd700;
            font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 메인 컨테이너 */
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 공통 패널 스타일 */
        .game-panel {
            flex: 1; 
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            overflow: hidden;
            cursor: pointer;
            border-right: 1px solid rgba(255,255,255,0.05); /* 경계선 아주 얇게 */
        }
        .game-panel:last-child { border-right: none; }

        /* 배경 이미지 설정 */
        .game-panel-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            
            /* 평소엔 약간 어둡게 (텍스트 잘 보이게) */
            filter: brightness(0.6) grayscale(20%);
            transform: scale(1);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 0;
        }

        /* 배경 이미지 경로 */
        .slot-bg { background-image: url('games/img/slot/slot-bg.png'); }
        .roulette-bg { background-image: url('games/img/slot/roulette-bg.png'); }

        /* 마우스 올렸을 때 효과 (밝아지면서 확대) */
        .game-panel:hover .game-panel-bg {
            filter: brightness(1.1) grayscale(0%);
            transform: scale(1.05);
        }

        /* 텍스트 내용물 */
        .content {
            position: relative; z-index: 10;
            text-align: center;
            transition: 0.4s;
            mix-blend-mode: overlay; /* 배경이랑 자연스럽게 섞임 */
        }
        
        /* 텍스트 스타일: 배경을 가리지 않도록 심플하게 */
        .title {
            font-size: 5rem; 
            font-weight: 900;
            text-transform: uppercase; 
            margin: 0;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.8);
            /* 텍스트 테두리만 남기고 속은 비움 (고급짐) */
            -webkit-text-stroke: 2px rgba(255,255,255,0.8);
            color: transparent; 
            transition: 0.4s;
        }

        .desc {
            font-size: 1rem; color: #fff; margin-top: 15px; letter-spacing: 6px;
            text-transform: uppercase; opacity: 0;
            transition: 0.4s;
            transform: translateY(20px);
        }

        /* 마우스 올렸을 때 텍스트 변화 */
        .game-panel:hover .title {
            color: #fff; /* 속 채우기 */
            text-shadow: 0 0 30px rgba(255,255,255,0.8);
            -webkit-text-stroke: 0px;
            transform: scale(1.1);
        }
        .game-panel:hover .desc {
            opacity: 1;
            transform: translateY(0);
        }

        /* 나가기 버튼 (유리 질감) */
        .back-btn {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 3px;
            backdrop-filter: blur(5px);
            z-index: 100;
            transition: 0.3s;
        }
        .back-btn:hover { 
            background: rgba(255,255,255,0.1); 
            color: #fff; border-color: #fff;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            h1 { font-size: 1.5rem; letter-spacing: 6px; }
            .header-overlay { top: 20px; }
            
            .game-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            
            .title { font-size: 3.5rem; -webkit-text-stroke: 1px rgba(255,255,255,0.8); }
            .game-panel-bg { filter: brightness(0.8) grayscale(0%); } /* 모바일은 항상 좀 밝게 */
            .desc { opacity: 1; transform: translateY(0); font-size: 0.8rem; letter-spacing: 2px;}
        }
    </style>
</head>
<body>

    <div class="header-overlay">
        <h1>THE CASINO</h1>
        <div id="welcome-msg" class="user-greet"></div>
    </div>

    <div class="split-container">
        
        <a id="link-slot" href="#" class="game-panel">
            <div class="game-panel-bg slot-bg"></div>
            <div class="content">
                <div class="title">SLOT</div>
                <div class="desc">Jackpot Machine</div>
            </div>
        </a>

        <a id="link-roulette" href="#" class="game-panel" target="_blank">
            <div class="game-panel-bg roulette-bg"></div>
            <div class="content">
                <div class="title">ROULETTE</div>
                <div class="desc">Equity Spin</div>
            </div>
        </a>

    </div>

    <a href="the-unique-main.html" class="back-btn">EXIT LOBBY</a>

    <script>
        window.onload = function() {
            const myId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');

            if (!myId) {
                alert("로그인이 필요합니다. 메인화면으로 이동합니다.");
                location.href = "the-unique-main.html";
                return;
            }

            document.getElementById('welcome-msg').innerText = "PLAYER: " + myId;
            document.getElementById('link-slot').href = "games/slot.html?id=" + myId;
            document.getElementById('link-roulette').href = "games/roulette.html?id=" + myId;
        };
    </script>

</body>
</html>
