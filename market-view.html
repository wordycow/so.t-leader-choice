<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNIQUE 마켓 – 게시글</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Pretendard",sans-serif;
      color:#e5e7eb;
      background:#0b1220 url("img/bg-market.jpg") center/cover fixed no-repeat; /* ✅ market와 동일 */
      position:relative;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background: radial-gradient(circle at top,
        rgba(2,6,23,.10),
        rgba(2,6,23,.45) 65%,
        rgba(2,6,23,.55)
      );
      z-index:-1;
    }

    .wrap{max-width:980px;margin:0 auto;padding:16px;position:relative;z-index:1}
    .topbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .brand{font-weight:900;letter-spacing:.12em;font-size:18px}
    .who{opacity:.9;font-size:12px;margin-top:4px}

    .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{cursor:pointer}
    .btn{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.12);
      color:#e5e7eb;font-weight:800
    }
    .btn.primary{background:rgba(255,255,255,.18)}
    .btn.danger{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.45)}

    .pill{
      padding:8px 12px;border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      font-size:12px;
      margin-bottom:12px;
      display:none;
      white-space:pre-line;
    }

    .muted{opacity:.85;font-size:12px}

    .card{
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      padding:14px;
      backdrop-filter: blur(6px);
      margin-bottom:12px;
    }

    .title{font-size:18px;font-weight:900;margin:0 0 8px}
    .meta{font-size:12px;opacity:.85;line-height:1.5}
    .desc{margin-top:10px;font-size:13px;line-height:1.65;white-space:pre-line}

    .mainImg{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:#0a1020;margin-bottom:10px}
    .mainImg img{width:100%;height:100%;object-fit:cover;display:block}

    .thumbs{display:flex;gap:8px;flex-wrap:wrap}
    .thumb{width:96px;height:64px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:#0a1020;cursor:pointer;opacity:.9}
    .thumb:hover{opacity:1}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}

    textarea{
      width:100%;min-height:90px;resize:vertical;
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      color:#e5e7eb;outline:none
    }

    .comment{
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      padding:10px 12px;
      margin-top:10px;
    }
    .commentTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .commentName{font-weight:900;font-size:13px}
    .commentTime{font-size:11px;opacity:.75}
    .commentBody{margin-top:6px;font-size:13px;line-height:1.6;white-space:pre-line}
    .commentDel{font-size:11px;padding:6px 8px;border-radius:10px;border:1px solid rgba(248,113,113,.45);background:rgba(127,29,29,.35);color:#fee2e2}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">UNIQUE 마켓 – 게시글</div>
      <div id="who" class="who">로그인 확인 중...</div>
    </div>
    <div class="btns">
      <button class="btn" id="btnBack" type="button">← 마켓</button>
      <button class="btn danger" id="btnExit" type="button">나가기</button>
      <button class="btn primary" id="btnLogin" type="button">구글 로그인</button>
      <button class="btn" id="btnReset" type="button">초기화</button>
    </div>
  </div>

  <div id="status" class="pill"></div>

  <div class="card" id="postCard">
    <div id="postTitle" class="title">로딩 중...</div>
    <div id="postMeta" class="meta"></div>
    <div id="imgBox" style="margin-top:10px;"></div>
    <div id="postDesc" class="desc"></div>
  </div>

  <div class="card" id="comments">
    <div style="font-weight:900;margin-bottom:8px;">댓글</div>
    <textarea id="cBody" placeholder="댓글을 입력하세요"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <button class="btn primary" id="btnComment" type="button">댓글 등록</button>
      <button class="btn" id="btnReload" type="button">댓글 새로고침</button>
    </div>
    <div id="commentList"></div>
    <div id="commentHint" class="muted" style="margin-top:10px;"></div>
  </div>
</div>

<script>
(() => {
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";

  const VIEW_PAGE = "market-view.html";   // 현재 파일명(참고용)
  const MARKET_PAGE = "market.html";
  const TOKEN_KEY = "market_access_token";
  const REFRESH_KEY = "market_refresh_token";
  const RETURN_TO_KEY = "market_return_to";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");

  let accessToken = null;
  let refreshToken = null;
  let user = null;

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: {
      fetch: async (url, init = {}) => {
        const headers = new Headers(init.headers || {});
        if (!headers.has("apikey")) headers.set("apikey", SUPABASE_ANON_KEY);

        const u = String(url);
        if (accessToken && (u.includes("/rest/v1/") || u.includes("/storage/v1/"))) {
          headers.set("Authorization", "Bearer " + accessToken);
        }
        return fetch(url, { ...init, headers });
      }
    },
    auth: {
      flowType: "implicit",
      detectSessionInUrl: false,
      persistSession: false,
      autoRefreshToken: false,
      storageKey: "sb-market-view"
    }
  });

  function setStatus(msg, isErr=false){
    if (!msg){ statusEl.style.display="none"; return; }
    statusEl.style.display="";
    statusEl.textContent = msg;
    statusEl.style.borderColor = isErr ? "rgba(248,113,113,.6)" : "rgba(255,255,255,.18)";
    statusEl.style.background = isErr ? "rgba(127,29,29,.25)" : "rgba(0,0,0,.18)";
  }

  function safeLSSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function safeLSGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeLSRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

  function cleanUrlAll(){
    const u = new URL(location.href);
    u.searchParams.delete("code");
    u.searchParams.delete("state");
    history.replaceState({}, document.title, u.pathname + u.search);
  }

  function base64UrlToJson(b64url){
    const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
    const pad = "=".repeat((4 - (b64.length % 4)) % 4);
    const binary = atob(b64 + pad);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
  }

  function decodeJwtPayload(token){
    try{
      const parts = (token || "").split(".");
      if (parts.length < 2) return null;
      return base64UrlToJson(parts[1]);
    }catch(e){ return null; }
  }

  function decodeUserFromAccessToken(token){
    const payload = decodeJwtPayload(token);
    if (!payload) return null;
    return {
      id: payload.sub || "",
      email: payload.email || "",
      name: payload.user_metadata?.full_name || payload.user_metadata?.name || payload.name || ""
    };
  }

  function tokenExpiringSoon(token, skewSec = 120){
    const payload = decodeJwtPayload(token);
    const exp = payload?.exp ? payload.exp * 1000 : 0;
    if (!exp) return true;
    return Date.now() > (exp - skewSec*1000);
  }

  async function refreshTokens(){
    if (!refreshToken) return false;

    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 12000);

    try{
      setStatus("로그인 갱신 중...");

      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        signal: controller.signal,
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: refreshToken })
      });

      const json = await res.json().catch(() => ({}));
      if (!res.ok){
        const msg = json?.error_description || json?.error || ("HTTP " + res.status);
        throw new Error(msg);
      }

      accessToken = json.access_token;
      refreshToken = json.refresh_token || refreshToken;
      safeLSSet(TOKEN_KEY, accessToken);
      safeLSSet(REFRESH_KEY, refreshToken);

      user = decodeUserFromAccessToken(accessToken);
      setWho();
      setStatus("");
      return true;
    }catch(e){
      setStatus("로그인 만료: 다시 '구글 로그인' 해주세요.\n(" + (e?.message || e) + ")", true);
      return false;
    }finally{
      clearTimeout(t);
    }
  }

  async function ensureValidAuth(){
    if (!accessToken || !refreshToken) return false;
    if (tokenExpiringSoon(accessToken, 120)){
      return await refreshTokens();
    }
    return true;
  }

  function loadTokenFromHashOrStorage(){
    const hash = (location.hash || "").replace(/^#/, "");
    if (hash.includes("access_token=")){
      const p = new URLSearchParams(hash);
      const at = p.get("access_token");
      const rt = p.get("refresh_token");
      if (at){
        accessToken = at;
        refreshToken = rt || null;
        safeLSSet(TOKEN_KEY, accessToken);
        if (refreshToken) safeLSSet(REFRESH_KEY, refreshToken);
        cleanUrlAll();
      }
    }
    if (!accessToken){
      accessToken = safeLSGet(TOKEN_KEY);
      refreshToken = safeLSGet(REFRESH_KEY);
    }
  }

  function escapeHtml(s){
    return (s||"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  function formatTime(iso){
    try{ return new Date(iso).toLocaleString(); }
    catch(e){ return iso || ""; }
  }

  function getPostId(){
    const u = new URL(location.href);
    return u.searchParams.get("id") || "";
  }

  function setWho(){
    if (!user?.id){
      $("who").textContent = "로그인 안됨(읽기만 가능할 수 있음)";
      $("commentHint").textContent = "댓글 작성/삭제는 로그인 후 가능합니다.";
      return;
    }
    const label = user.name || user.email || user.id.slice(0,8);
    $("who").textContent = `로그인: ${label}`;
    $("commentHint").textContent = "";
  }

  function marketHtmlUrl(){
    const base = location.pathname.replace(/\/[^\/]*$/, "");
    return location.origin + base + "/" + MARKET_PAGE;
  }

  // UI 버튼
  $("btnBack").onclick = () => location.href = MARKET_PAGE;
  $("btnExit").onclick = () => location.replace("the-unique-gate.html");
  $("btnReset").onclick = () => {
    safeLSRemove(TOKEN_KEY);
    safeLSRemove(REFRESH_KEY);
    safeLSRemove(RETURN_TO_KEY);
    location.href = MARKET_PAGE + "?autologin=1";
  };

  $("btnLogin").onclick = async () => {
    // ✅ 로그인 후 다시 이 페이지로 돌아오게 저장
    safeLSSet(RETURN_TO_KEY, location.href);
    setStatus("구글 로그인 이동 중...");

    const { data, error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: marketHtmlUrl(), skipBrowserRedirect: true }
    });

    if (error) return setStatus("구글 로그인 시작 실패: " + error.message, true);
    if (data?.url) location.assign(data.url);
    else setStatus("로그인 URL 생성 실패", true);
  };

  async function loadPost(){
    const postId = getPostId();
    if (!postId) {
      setStatus("잘못된 접근: id가 없습니다.", true);
      $("postTitle").textContent = "ID 없음";
      return null;
    }
    const { data, error } = await sb.from("market_posts").select("*").eq("id", postId).single();
    if (error) {
      setStatus("게시글 불러오기 실패: " + error.message + "\n(권한 문제면 로그인 필요)", true);
      $("postTitle").textContent = "불러오기 실패";
      return null;
    }
    return data;
  }

  function renderImages(urls){
    const box = $("imgBox");
    box.innerHTML = "";
    if (!urls || !urls.length) return;

    const main = document.createElement("div");
    main.className = "mainImg";
    main.innerHTML = `<img id="mainImg" src="${urls[0]}" alt="">`;
    box.appendChild(main);

    if (urls.length > 1){
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      urls.forEach((u) => {
        const t = document.createElement("div");
        t.className = "thumb";
        t.innerHTML = `<img src="${u}" alt="">`;
        t.onclick = () => { const img = document.getElementById("mainImg"); if (img) img.src = u; };
        thumbs.appendChild(t);
      });
      box.appendChild(thumbs);
    }
  }

  function renderPost(p){
    $("postTitle").textContent = p.title || "(제목 없음)";
    $("postMeta").innerHTML =
      `수량: <b>${escapeHtml(p.qty ?? "-")}</b> · 지역: <b>${escapeHtml(p.region || "-")}</b><br>` +
      `연락: <b>${escapeHtml(p.contact || "-")}</b><br>` +
      `작성자: <b>${escapeHtml(p.owner_name || "-")}</b> · ${formatTime(p.created_at)}`;
    $("postDesc").textContent = p.description || "";
    renderImages(Array.isArray(p.images) ? p.images : []);
  }

  async function loadComments(){
    const postId = getPostId();
    const { data, error } = await sb
      .from("market_comments")
      .select("*")
      .eq("post_id", postId)
      .order("created_at", { ascending: false });

    if (error) {
      setStatus("댓글 불러오기 실패: " + error.message + "\n(권한 문제면 로그인 필요)", true);
      return [];
    }
    return data || [];
  }

  function renderComments(list){
    const box = $("commentList");
    if (!list.length) {
      box.innerHTML = `<div class="muted" style="margin-top:10px;">아직 댓글이 없습니다.</div>`;
      return;
    }

    box.innerHTML = list.map(c => {
      const canDelete = user?.id && c.owner === user.id;
      return `
        <div class="comment">
          <div class="commentTop">
            <div>
              <div class="commentName">${escapeHtml(c.owner_name || "익명")}</div>
              <div class="commentTime">${formatTime(c.created_at)}</div>
            </div>
            ${canDelete ? `<button class="commentDel" data-id="${c.id}" type="button">삭제</button>` : ``}
          </div>
          <div class="commentBody">${escapeHtml(c.body || "")}</div>
        </div>
      `;
    }).join("");

    box.querySelectorAll(".commentDel").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-id");
        if (!id) return;
        const ok = await ensureValidAuth();
        if (!ok) return setStatus("삭제는 로그인 후 가능합니다.", true);

        if (!confirm("이 댓글을 삭제할까요?")) return;
        const { error } = await sb.from("market_comments").delete().eq("id", id);
        if (error) return setStatus("댓글 삭제 실패: " + error.message, true);

        setStatus("댓글 삭제 완료");
        const again = await loadComments();
        renderComments(again);
      });
    });
  }

  async function addComment(){
    const postId = getPostId();
    const body = ($("cBody").value || "").trim();
    if (!body) return setStatus("댓글 내용을 입력하세요.", true);

    const ok = await ensureValidAuth();
    if (!ok) return setStatus("댓글 작성은 로그인 후 가능합니다.", true);

    user = decodeUserFromAccessToken(accessToken);
    if (!user?.id) return setStatus("유저 정보를 못 읽었습니다. ‘초기화’ 후 재로그인", true);

    setStatus("댓글 등록 중...");
    const owner_name = user.name || user.email || "";

    const { error } = await sb.from("market_comments").insert({
      post_id: postId,
      owner: user.id,
      owner_name,
      body
    });

    if (error) return setStatus("댓글 등록 실패: " + error.message, true);

    $("cBody").value = "";
    setStatus("댓글 등록 완료!");
    const again = await loadComments();
    renderComments(again);
  }

  function scrollToCommentsIfNeeded(){
    if (location.hash === "#comments"){
      setTimeout(() => {
        document.getElementById("comments")?.scrollIntoView({ behavior:"smooth", block:"start" });
        if (user?.id) document.getElementById("cBody")?.focus();
      }, 80);
    }
  }

  $("btnComment").onclick = () => addComment();
  $("btnReload").onclick = async () => renderComments(await loadComments());

  // Boot
  (async () => {
    loadTokenFromHashOrStorage();

    if (accessToken && refreshToken){
      await ensureValidAuth();
      user = decodeUserFromAccessToken(accessToken);
    }

    setWho();

    const post = await loadPost();
    if (post) renderPost(post);

    const comments = await loadComments();
    renderComments(comments);

    scrollToCommentsIfNeeded();

    setInterval(async () => {
      if (!accessToken || !refreshToken) return;
      if (tokenExpiringSoon(accessToken, 120)){
        await refreshTokens();
      }
    }, 60_000);
  })();
})();
</script>
</body>
</html>
