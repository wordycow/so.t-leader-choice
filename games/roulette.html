<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050508;
      --panel: rgba(12, 14, 20, 0.92);
      --panel2: rgba(12, 14, 20, 0.72);
      --line: rgba(255, 215, 0, 0.25);
      --gold1:#ffd700;
      --gold2:#d4af37;
      --text:#f3f4f6;
      --muted: rgba(243,244,246,0.65);
      --danger:#ff0044;
      --ok:#22c55e;
      --shadow: 0 18px 60px rgba(0,0,0,0.55);

      --wheelSize: min(76vh, 640px);
      --wheelViewportH: calc(var(--wheelSize) * 0.56); /* 부분 노출 높이 */
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      background: radial-gradient(circle at 30% 10%, rgba(255,215,0,0.08), transparent 45%),
                  radial-gradient(circle at 70% 20%, rgba(0,240,255,0.06), transparent 40%),
                  var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      overflow-x:hidden;
    }

    /* ===== Top Ticker (2 lines) ===== */
    .topTicker{
      position:sticky;
      top:0;
      z-index:50;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,215,0,0.18);
    }
    .tickerRow{
      position:relative;
      overflow:hidden;
      height:34px;
      display:flex;
      align-items:center;
      border-bottom: 1px solid rgba(255,215,0,0.10);
    }
    .tickerRow:last-child{ border-bottom:none; }
    .marquee{
      white-space:nowrap;
      display:inline-block;
      padding-left:100%;
      animation: marquee 20s linear infinite;
      font-family:"Cinzel", serif;
      letter-spacing: .06em;
      font-size: 13px;
      color: rgba(255,215,0,0.92);
      text-shadow: 0 0 12px rgba(255,215,0,0.16);
    }
    .marquee.m2{
      animation-duration: 26s;
      color: rgba(243,244,246,0.88);
      font-family: "Playfair Display", serif;
      letter-spacing: .03em;
      font-size: 13px;
    }
    @keyframes marquee{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-100%); }
    }

    /* ===== Winner Toast (top popup) ===== */
    .toast{
      position:fixed;
      top:72px;
      left:50%;
      transform: translateX(-50%);
      z-index:80;
      background: rgba(10,10,14,0.92);
      border:1px solid rgba(255,215,0,0.28);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      border-radius: 14px;
      min-width: min(680px, calc(100vw - 28px));
      display:none;
    }
    .toast.show{ display:block; }
    .toast .t1{
      font-family:"Cinzel", serif;
      font-weight:900;
      letter-spacing:.08em;
      color: var(--gold1);
      font-size: 14px;
      margin-bottom: 6px;
    }
    .toast .t2{
      display:flex;
      gap:10px;
      align-items:baseline;
      flex-wrap:wrap;
    }
    .toast .name{
      font-family:"Playfair Display", serif;
      font-weight:900;
      font-size: 22px;
      letter-spacing:.04em;
    }
    .toast .amt{
      font-family:"Cinzel", serif;
      font-weight:900;
      color: rgba(255,215,0,0.92);
      font-size: 18px;
    }
    .toast .sub{
      margin-top:6px;
      color: rgba(243,244,246,0.72);
      font-size: 12px;
    }

    /* ===== Layout ===== */
    .wrap{
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 14px 22px;
    }
    .grid{
      display:grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      align-items:start;
      margin-top: 10px;
    }

    /* ===== Wheel Area ===== */
    .stage{
      background: linear-gradient(180deg, rgba(18,20,28,0.72), rgba(6,7,10,0.72));
      border: 1px solid rgba(255,215,0,0.14);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      position:relative;
      overflow:hidden;
      min-height: 560px;
    }

    .stageTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .audioBar{
      display:flex;
      align-items:center;
      gap:10px;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 8px 10px;
    }
    .btnIcon{
      width:34px;
      height:34px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.35);
      color: rgba(243,244,246,0.92);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
    }
    .btnIcon:active{ transform: translateY(1px); }
    .vol{
      width:140px;
      accent-color: var(--gold1);
    }
    .hint{
      font-size:12px;
      color: rgba(243,244,246,0.55);
    }

    /* 부분 룰렛 뷰포트 */
    .wheelViewport{
      width: var(--wheelSize);
      max-width: 100%;
      height: var(--wheelViewportH);
      margin: 8px auto 6px;
      position:relative;
      overflow:hidden;             /* ✅ 반만 보여주기 */
      border-radius: 22px;
    }
    .wheelWrap{
      width: var(--wheelSize);
      height: var(--wheelSize);
      position:absolute;
      left:50%;
      bottom: calc(var(--wheelSize) * -0.44); /* ✅ 아래로 내려서 윗부분만 노출 */
      transform: translateX(-50%);
      filter: drop-shadow(0 24px 80px rgba(0,0,0,0.65));
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,0,0,0.0) 58%, rgba(0,0,0,0.65) 78%, rgba(0,0,0,0.9) 100%),
        radial-gradient(circle at 50% 50%, rgba(255,215,0,0.25), rgba(255,215,0,0.0) 55%),
        radial-gradient(circle at 50% 50%, rgba(255,215,0,0.12) 0, rgba(0,0,0,0.0) 62%);
      border: 10px solid rgba(255,215,0,0.62);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.55);
    }

    canvas#wheelCanvas{
      width:100%;
      height:100%;
      border-radius:50%;
      display:block;
      transform: rotate(0deg);
    }

    /* ✅ 화살표 12시 고정 + 끝이 살짝 걸치게 */
    .pointer{
      position:absolute;
      top: -8px;                 /* 너무 깊게 내려오지 않게 */
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      z-index: 5;
      pointer-events:none;
    }
    .pointer:before{
      content:"";
      position:absolute;
      left:50%;
      top: 6px;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 16px solid transparent;
      border-right:16px solid transparent;
      border-top: 32px solid #ff7a00;        /* 오렌지 포인트 */
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.55));
    }
    .pointer:after{
      content:"";
      position:absolute;
      left:50%;
      top: 34px;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #fff2, #0000 60%), linear-gradient(180deg, var(--gold1), var(--gold2));
      box-shadow: 0 8px 18px rgba(0,0,0,0.6);
      border: 1px solid rgba(0,0,0,0.35);
    }

    /* ✅ 중심 축(UNIQUE) 글씨 줄여서 축 안에 */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: 86px;
      height: 86px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.16), rgba(0,0,0,0.0) 55%),
                  radial-gradient(circle at 50% 50%, rgba(255,215,0,0.18), rgba(0,0,0,0.85) 70%);
      border: 2px solid rgba(255,215,0,0.55);
      box-shadow: 0 14px 40px rgba(0,0,0,0.65);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 4;
      pointer-events:none;
    }
    .hub span{
      font-family:"Cinzel", serif;
      font-weight:900;
      letter-spacing:.10em;
      font-size: 14px; /* ✅ 줄임 */
      color: rgba(255,215,0,0.95);
      text-shadow: 0 0 18px rgba(255,215,0,0.18);
    }

    .wheelMeta{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 10px;
    }
    .pill{
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 999px;
      padding: 10px 12px;
      min-width: 200px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .pill .k{
      font-family:"Cinzel", serif;
      letter-spacing:.10em;
      font-weight:900;
      font-size: 11px;
      color: rgba(255,215,0,0.85);
      margin-bottom: 6px;
    }
    .pill .v{
      font-family:"Playfair Display", serif;
      font-weight:900;
      font-size: 24px;
      letter-spacing:.04em;
    }
    .pill .v small{
      font-family:"Cinzel", serif;
      font-weight:900;
      font-size: 16px;
      color: rgba(255,215,0,0.9);
      margin-left: 6px;
    }

    /* ===== Right Panel ===== */
    .side{
      background: var(--panel);
      border: 1px solid rgba(255,215,0,0.14);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      position:sticky;
      top: 90px;
    }

    .sideHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sideHead .block{
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 12px 12px;
      flex:1;
    }
    .sideHead .title{
      font-family:"Cinzel", serif;
      letter-spacing:.10em;
      font-weight:900;
      font-size: 11px;
      color: rgba(255,215,0,0.85);
      margin-bottom: 6px;
    }
    .sideHead .big{
      font-family:"Playfair Display", serif;
      font-weight:900;
      font-size: 30px;
      letter-spacing:.04em;
    }
    .timeBig{
      font-variant-numeric: tabular-nums; /* ✅ 숫자 흔들림 제거 */
      min-width: 110px;
      text-align:right;
    }

    .controls{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .cbtn{
      padding: 10px 0;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.35);
      color: rgba(243,244,246,0.92);
      font-weight:900;
      cursor:pointer;
      font-family:"Cinzel", serif;
      letter-spacing:.05em;
    }
    .cbtn.active{
      border-color: rgba(255,215,0,0.45);
      box-shadow: inset 0 0 0 1px rgba(255,215,0,0.24);
      color: rgba(255,215,0,0.95);
    }

    .betBox{
      margin-top: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 12px;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 8px;
    }
    .label{
      color: rgba(243,244,246,0.65);
      font-size: 12px;
      letter-spacing:.02em;
    }
    .wallet{
      font-family:"Cinzel", serif;
      font-weight:900;
      letter-spacing:.06em;
      color: rgba(255,215,0,0.90);
      font-variant-numeric: tabular-nums;
    }

    .betNow{
      margin-top: 12px;
      width:100%;
      padding: 14px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,215,0,0.28);
      background: linear-gradient(90deg, rgba(255,215,0,0.18), rgba(255,215,0,0.06));
      color: rgba(243,244,246,0.92);
      font-family:"Cinzel", serif;
      font-weight:900;
      letter-spacing:.10em;
      cursor:pointer;
      box-shadow: 0 12px 26px rgba(0,0,0,0.45);
    }
    .betNow[disabled]{
      opacity: 0.45;
      cursor:not-allowed;
      filter: grayscale(0.3);
    }

    .statusLine{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(243,244,246,0.62);
      line-height:1.35;
    }
    .statusLine b{ color: rgba(255,215,0,0.92); font-family:"Cinzel", serif; letter-spacing:.05em; }

    /* ===== Responsive ===== */
    @media (max-width: 980px){
      :root{ --wheelSize: min(72vh, 560px); }
      .grid{ grid-template-columns: 1fr; }
      .side{ position:relative; top:auto; }
      .stage{ min-height: 520px; }
    }
  </style>
</head>

<body>
  <!-- Top ticker -->
  <div class="topTicker">
    <div class="tickerRow">
      <div id="ticker1" class="marquee">🏆 오늘 최고 수익자: 로딩중…</div>
    </div>
    <div class="tickerRow">
      <div id="ticker2" class="marquee m2">당신도 행운의 주인공이 될 수있습니다.</div>
    </div>

  <!-- Winner popup -->
  <div id="winnerToast" class="toast" aria-live="polite">

  <div class="wrap">

      <!-- Left: Wheel -->
      <div class="stage">

        </div>

        <div class="wheelViewport">

          <div id="wheelWrap" class="wheelWrap">

            <div class="hub"><span>UNIQUE</span></div>
          </div>
        </div>

        <div class="wheelMeta">
          <div class="pill">
            <div class="k">ROUND</div>

          <div class="pill">

      <!-- Right: Controls -->
      <div class="side">

          <div class="block">
            <div class="title">TOTAL POOL</div>
            <div class="big"><span id="totalPool">0</span> <span style="font-family:'Cinzel',serif;color:rgba(255,215,0,.9);font-weight:900">UT</span></div>

        <div class="controls" aria-label="Bet amount controls">
          <button class="cbtn" id="btnMin">MIN</button>
          <button class="cbtn" id="btnMinus">-100</button>
          <button class="cbtn active" id="btnCur">100</button>
          <button class="cbtn" id="btnPlus">+100</button>
          <button class="cbtn" id="btnMax">MAX</button>

        <div class="betBox">
          <div class="row">
            <div class="label">MY WALLET</div>

          <div class="row">

            <div class="wallet" id="myName">-</div>

          <div class="row">
            <div class="label">BET AMOUNT</div>
            <div class="wallet"><span id="betAmt">100</span> UT</div>

          <button id="betNow" class="betNow">BET NOW</button>

          <div class="statusLine" id="statusLine">

  <!-- BGM audio (optional) -->
  <audio id="bgm" preload="auto" loop>

  </audio>

<script>
/* =========================================================
   [A] CONFIG
   ========================================================= */
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec"; // ✅ 여기에 /exec 주소 넣기
const USER_ID = new URLSearchParams(location.search).get("id") || "guest";

/* 회차(20분) 구성:
   - 전체 1200s (20분)
   - 마지막 30s 정지(위너 표시)
   - 베팅 마감: 남은 60s (1분 전)
   - 스핀 구간 1170s (정지 30초 제외)
   - 속도 스케줄:
       0~4:30  (270s)  1rpm
       4:30~9:30 (300s) 2rpm
       9:30~14:30(300s) 4rpm
       14:30~19:25(295s) 8rpm
       19:25~19:30(5s)   감속 6→4→3→2→1rpm
*/
const ROUND_SEC = 20*60;
const STOP_SEC  = 30;
const SPIN_END  = ROUND_SEC - STOP_SEC; // 1170
const BET_CLOSE_REMAIN_SEC = 60;         // 남은 60초부터 베팅 금지

const SPEED_SEG = [
  { end: 270, rpm: 1 },
  { end: 570, rpm: 2 },
  { end: 870, rpm: 4 },
  { end: 1165, rpm: 8 }, // 감속 시작 직전
];

/* =========================================================
   [B] STATE
   ========================================================= */
let serverOffsetMs = 0;   // serverNow - localNow
let lastSecondShown = null;

let roundState = {
  roundStartMs: 0,
  roundNo: 1,
  entries: [],
  totalPool: 0,
  myWallet: 0,
  myName: USER_ID,
  winnerIndex: 0,
  winnerName: "",
  winnerProfit: 0,
  dailyTop: null,     // {roundNo,name,profit}
  lastWinner: null,   // {roundNo,name,profit}
};

let betAmount = 100;

const el = (id)=>document.getElementById(id);

/* =========================================================
   [C] TIME / ROUND KEY (Seoul)
   ========================================================= */
function nowMs(){ return Date.now() + serverOffsetMs; }

function seoulYMD(ms){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
  }).format(new Date(ms)); // "YYYY-MM-DD"
}
function seoulHMSToParts(ms){
  const parts = new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).formatToParts(new Date(ms));
  const map = {};
  parts.forEach(p=>{ if(p.type!=="literal") map[p.type]=p.value; });
  return { h:+map.hour, m:+map.minute, s:+map.second };
}
function seoulMidnightEpoch(ms){
  const ymd = seoulYMD(ms);
  return new Date(`${ymd}T00:00:00+09:00`).getTime();
}
function computeRoundStartMs(ms){
  const mid = seoulMidnightEpoch(ms);
  const {h,m,s} = seoulHMSToParts(ms);
  const since = (h*60+m)*60 + s;
  const block = Math.floor(since / ROUND_SEC);
  return mid + block*ROUND_SEC*1000;
}
function computeRoundNo(ms){
  const mid = seoulMidnightEpoch(ms);
  return Math.floor((ms - mid) / (ROUND_SEC*1000)) + 1;
}

/* =========================================================
   [D] RPM SCHEDULE + INTEGRATION
   ========================================================= */
function rpmAt(tSec){
  if(tSec >= SPIN_END) return 0;

  // 감속(마지막 5초)
  if(tSec >= (SPIN_END - 5)){
    const rem = SPIN_END - tSec; // (0~5]
    if(rem <= 1) return 1;
    if(rem <= 2) return 2;
    if(rem <= 3) return 3;
    if(rem <= 4) return 4;
    return 6; // 5초 전
  }

  // 일반 구간
  for(const seg of SPEED_SEG){
    if(tSec < seg.end) return seg.rpm;
  }
  return 8;
}

// rpm → deg/sec : rpm * 360 / 60 = rpm*6
function baseRotationDeg(tSec){
  // 빠르고 정확하게: 구간별로 적분(초 단위)
  if(tSec <= 0) return 0;

  let rot = 0;
  let prev = 0;

  // 일반 구간
  for(const seg of SPEED_SEG){
    const end = Math.min(tSec, seg.end);
    if(end > prev){
      rot += (end - prev) * (seg.rpm * 6);
      prev = end;
    }
    if(tSec <= seg.end) return rot;
  }

  // 8rpm 구간 (감속 시작 전)
  const decelStart = SPIN_END - 5;
  if(tSec > prev){
    const end = Math.min(tSec, decelStart);
    if(end > prev){
      rot += (end - prev) * (8 * 6);
      prev = end;
    }
  }
  if(tSec <= decelStart) return rot;

  // 감속 5초 구간(6,4,3,2,1 rpm 각 1초)
  // t in [decelStart, SPIN_END)
  const steps = [
    {from: decelStart, to: decelStart+1, rpm:6},
    {from: decelStart+1, to: decelStart+2, rpm:4},
    {from: decelStart+2, to: decelStart+3, rpm:3},
    {from: decelStart+3, to: decelStart+4, rpm:2},
    {from: decelStart+4, to: decelStart+5, rpm:1},
  ];
  for(const st of steps){
    const a = Math.max(st.from, 0);
    const b = Math.min(st.to, tSec);
    if(b > a) rot += (b - a) * (st.rpm * 6);
  }
  return rot;
}

/* =========================================================
   [E] WHEEL DRAWING
   ========================================================= */
const canvas = el("wheelCanvas");
const ctx = canvas.getContext("2d");

let wheelMeta = {
  sectors: [], // {name,amount,startRad,endRad,midRad,color}
  total: 0,
  targetDeg: 0,
  startOffsetDeg: 0,
};

function pickColor(i, n){
  // 네온/럭셔리 느낌: HSL로 균등 분배
  const hue = (i * (360 / Math.max(1,n))) % 360;
  return `hsl(${hue} 85% 55%)`;
}

function drawWheel(entries){
  const list = (entries && entries.length) ? entries : [{name:"COMPANY", amount:100}];
  const total = list.reduce((a,b)=>a+(+b.amount||0),0) || 1;

  wheelMeta.total = total;
  wheelMeta.sectors = [];

  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const r  = W*0.44;

  ctx.clearRect(0,0,W,H);

  // 배경
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.03)";
  ctx.fill();

  let start = -Math.PI/2; // 12시 방향 기준
  list.forEach((e, i)=>{
    const amt = (+e.amount||0);
    const ang = (amt/total) * Math.PI*2;
    const end = start + ang;

    const mid = start + ang/2;
    const color = pickColor(i, list.length);

    // sector
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    // separator
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // text
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(mid);

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "800 28px Cinzel";
    ctx.shadowColor = "rgba(0,0,0,0.45)";
    ctx.shadowBlur = 8;
    ctx.fillText(String(e.name).toUpperCase(), r*0.18, 0);

    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,215,0,0.92)";
    ctx.font = "900 22px Cinzel";
    ctx.fillText(`${amt}`, r*0.18, 30);

    ctx.restore();

    wheelMeta.sectors.push({ name:e.name, amount:amt, startRad:start, endRad:end, midRad:mid, color });
    start = end;
  });

  // inner circle to give depth
  ctx.beginPath();
  ctx.arc(cx,cy,r*0.60,0,Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,215,0,0.10)";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function computeTargetDegByWinnerIndex(idx){
  const s = wheelMeta.sectors;
  if(!s.length) return 0;
  const i = Math.max(0, Math.min(idx, s.length-1));
  const mid = s[i].midRad;
  // midRad + rotRad = -PI/2  => rotRad = -PI/2 - midRad
  const rotRad = (-Math.PI/2) - mid;
  let deg = rotRad * 180/Math.PI;
  deg = ((deg % 360) + 360) % 360;
  return deg;
}

/* =========================================================
   [F] SYNC + API (JSONP)
   ========================================================= */
function jsonp(url){
  return new Promise((resolve, reject)=>{
    const cb = `__cb_${Math.random().toString(36).slice(2)}`;
    const script = document.createElement("script");
    const sep = url.includes("?") ? "&" : "?";
    const full = `${url}${sep}callback=${cb}`;

    const timer = setTimeout(()=>{
      cleanup();
      reject(new Error("JSONP timeout"));
    }, 8000);

    function cleanup(){
      clearTimeout(timer);
      script.remove();
      try{ delete window[cb]; }catch(_){}
    }

    window[cb] = (data)=>{
      cleanup();
      resolve(data);
    };

    script.onerror = ()=>{
      cleanup();
      reject(new Error("JSONP load error"));
    };

    script.src = full;
    document.head.appendChild(script);
  });
}

async function apiSync(){
  // 서버 규격: action=sync&id=...
  // 응답 예:
  // { ok:true, serverNowMs, roundStartMs, roundNo, myName, myWallet, entries:[{name,amount}], totalPool,
  //   winnerIndex, winnerName, winnerProfit, dailyTop:{roundNo,name,profit}, lastWinner:{...} }
  const url = `${APP_SCRIPT_URL}?action=sync&id=${encodeURIComponent(USER_ID)}`;
  return await jsonp(url);
}

async function apiBet(amount){
  // 서버 규격: action=bet&id=...&amount=...
  const url = `${APP_SCRIPT_URL}?action=bet&id=${encodeURIComponent(USER_ID)}&amount=${encodeURIComponent(amount)}`;
  return await jsonp(url);
}

async function hardSync(){
  try{
    const res = await apiSync();
    if(res && res.serverNowMs){
      serverOffsetMs = res.serverNowMs - Date.now();
      el("syncHint").textContent = "동기화: OK";
      el("syncState").textContent = "OK";
    }else{
      el("syncHint").textContent = "동기화: 로컬(서버 응답 없음)";
      el("syncState").textContent = "LOCAL";
    }

    const nms = nowMs();
    roundState.roundStartMs = res.roundStartMs || computeRoundStartMs(nms);
    roundState.roundNo = res.roundNo || computeRoundNo(nms);

    roundState.myName = res.myName || res.name || USER_ID; // ✅ 이름(구글시트) 우선
    roundState.myWallet = +res.myWallet || 0;

    roundState.entries = Array.isArray(res.entries) ? res.entries : (Array.isArray(res.players) ? res.players : []);
    roundState.totalPool = +res.totalPool || roundState.entries.reduce((a,b)=>a+(+b.amount||0),0) || 0;

    roundState.winnerIndex = Number.isFinite(+res.winnerIndex) ? +res.winnerIndex : 0;
    roundState.winnerName  = res.winnerName || (res.winner && res.winner.name) || "";
    roundState.winnerProfit= +res.winnerProfit || (res.winner && +res.winner.profit) || 0;

    roundState.dailyTop = res.dailyTop || null;
    roundState.lastWinner = res.lastWinner || null;

    // UI 반영
    el("myName").textContent = roundState.myName;
    el("myWallet").textContent = formatInt(roundState.myWallet);
    el("roundNo").textContent = roundState.roundNo;
    el("totalPool").textContent = formatInt(roundState.totalPool);

    drawWheel(roundState.entries);
    wheelMeta.targetDeg = computeTargetDegByWinnerIndex(roundState.winnerIndex);

    // startOffset = target - baseRotation(SPIN_END)
    const baseEnd = baseRotationDeg(SPIN_END) % 360;
    wheelMeta.startOffsetDeg = ((wheelMeta.targetDeg - baseEnd) % 360 + 360) % 360;

    updateTickerTexts();

  }catch(err){
    console.error(err);
    el("syncHint").textContent = "동기화: 실패(서버 연결)";
    el("syncState").textContent = "ERR";
  }
}

function updateTickerTexts(){
  // 1줄: 오늘 최고 수익자(하루 종일)
  // 방금전판 우승자가 있으면 같이 보여주기
  const daily = roundState.dailyTop;
  const last  = roundState.lastWinner;

  const dailyTxt = daily
    ? `🏆 오늘 최고 수익자: ${daily.roundNo}회차 ${daily.name} (+${formatInt(daily.profit)} UT)`
    : `🏆 오늘 최고 수익자: 집계중…`;

  const lastTxt = last
    ? `🥇 방금 전 ${last.roundNo}회차 우승: ${last.name} (+${formatInt(last.profit)} UT)`
    : "";

  el("ticker1").textContent = lastTxt ? `${lastTxt}   •   ${dailyTxt}` : dailyTxt;
  el("ticker2").textContent = "당신도 행운의 주인공이 될 수있습니다.";
}

function formatInt(n){
  const x = Math.floor(+n||0);
  return x.toLocaleString("en-US");
}

/* =========================================================
   [G] BETTING RULES + UI
   ========================================================= */
function setBetControlsEnabled(on){
  el("betNow").disabled = !on;
  el("btnMin").disabled = !on;
  el("btnMinus").disabled = !on;
  el("btnPlus").disabled = !on;
  el("btnMax").disabled = !on;
}

function updateBetStateUI(remainingSec){
  const bettingOpen = remainingSec > BET_CLOSE_REMAIN_SEC && remainingSec > STOP_SEC;
  el("betState").textContent = bettingOpen ? "OPEN" : "CLOSED";
  setBetControlsEnabled(bettingOpen);
}

/* =========================================================
   [H] TIMER + WHEEL ANIMATION (SYNCED)
   ========================================================= */
const wheelWrap = el("wheelWrap");
let rafId = null;

function tickSecond(){
  const ms = nowMs();
  const start = roundState.roundStartMs || computeRoundStartMs(ms);
  const elapsed = (ms - start) / 1000;
  const remain = Math.max(0, Math.floor(ROUND_SEC - elapsed));

  // ✅ timeLeft가 "갔다왔다" 하지 않게: 절대 증가 금지
  if(lastSecondShown !== null && remain > lastSecondShown){
    // 이전보다 커지면 이전값 유지 (서버 오프셋 튐 방지)
  }else{
    lastSecondShown = remain;
  }

  const showRemain = lastSecondShown ?? remain;

  // 표시
  el("timeLeft").textContent = `${String(Math.floor(showRemain/60)).padStart(2,"0")}:${String(showRemain%60).padStart(2,"0")}`;
  el("roundNo").textContent = roundState.roundNo;

  updateBetStateUI(showRemain);

  // 위너 팝업(정지 구간 30초)
  const inStop = (elapsed >= SPIN_END) && (elapsed < ROUND_SEC);
  if(inStop){
    showWinnerToast();
  }else{
    hideWinnerToast();
  }

  // 라운드 넘어가면 리셋 + 강제 sync
  if(elapsed >= ROUND_SEC){
    lastSecondShown = null;
    hardSync(); // 다음 회차 정보/우승자/entries 갱신
  }

  // 다음 1초 경계에 맞춰 재호출(흔들림/드리프트 최소화)
  const next = 1000 - (nowMs() % 1000);
  setTimeout(tickSecond, Math.max(30, next));
}

function animateWheel(){
  const ms = nowMs();
  const start = roundState.roundStartMs || computeRoundStartMs(ms);
  const tSec = (ms - start) / 1000;

  let rot;
  if(tSec >= SPIN_END){
    rot = wheelMeta.targetDeg;
  }else{
    const base = baseRotationDeg(Math.max(0,tSec));
    rot = (wheelMeta.startOffsetDeg + base) % 360;
  }

  // wheelWrap 전체를 회전 (부분 노출/화살표는 고정)
  wheelWrap.style.transform = `translateX(-50%) rotate(${rot}deg)`;

  rafId = requestAnimationFrame(animateWheel);
}

function showWinnerToast(){
  // winnerName/Profit 없으면 표시 안 함
  if(!roundState.winnerName) return;
  el("winnerName").textContent = roundState.winnerName;
  el("winnerAmt").textContent  = `${formatInt(roundState.winnerProfit)} UT`;
  el("winnerSub").textContent  = "30초 정지 후 다음 회차가 시작됩니다. (운영 10% 승자이익 기준)";
  el("winnerToast").classList.add("show");
}
function hideWinnerToast(){
  el("winnerToast").classList.remove("show");
}

/* =========================================================
   [I] EVENTS
   ========================================================= */
function clampBet(){
  betAmount = Math.max(10, Math.min(1000000, betAmount));
  el("betAmt").textContent = formatInt(betAmount);
  el("btnCur").textContent = formatInt(betAmount);
}

el("btnMin").addEventListener("click", ()=>{ betAmount = 10; clampBet(); });
el("btnMinus").addEventListener("click", ()=>{ betAmount -= 100; clampBet(); });
el("btnPlus").addEventListener("click", ()=>{ betAmount += 100; clampBet(); });
el("btnMax").addEventListener("click", ()=>{ betAmount = 1000; clampBet(); }); // 원하면 바꿔

el("betNow").addEventListener("click", async ()=>{
  try{
    el("betNow").disabled = true;
    const res = await apiBet(betAmount);

    // 성공 시 화면 갱신
    if(res && res.ok){
      // wallet/name/entries/totalPool 갱신
      if(res.serverNowMs) serverOffsetMs = res.serverNowMs - Date.now();
      if(res.myWallet!=null) roundState.myWallet = +res.myWallet || 0;
      if(res.myName) roundState.myName = res.myName;

      if(Array.isArray(res.entries)) roundState.entries = res.entries;
      if(res.totalPool!=null) roundState.totalPool = +res.totalPool||0;

      el("myWallet").textContent = formatInt(roundState.myWallet);
      el("myName").textContent = roundState.myName;
      el("totalPool").textContent = formatInt(roundState.totalPool);

      drawWheel(roundState.entries);
      // winnerIndex는 라운드 시작 시 고정이라고 가정 → 여기선 재계산만
      wheelMeta.targetDeg = computeTargetDegByWinnerIndex(roundState.winnerIndex);
      const baseEnd = baseRotationDeg(SPIN_END) % 360;
      wheelMeta.startOffsetDeg = ((wheelMeta.targetDeg - baseEnd) % 360 + 360) % 360;
    }else{
      alert((res && res.msg) ? res.msg : "베팅 실패(서버 응답)");
    }
  }catch(err){
    console.error(err);
    alert("베팅 실패(연결 오류)");
  }finally{
    // 상태에 따라 다시 활성화는 tickSecond에서 처리
  }
});

/* BGM (목소리 없음) */
const bgm = el("bgm");
const bgmToggle = el("bgmToggle");
const bgmVol = el("bgmVol");
bgm.volume = +bgmVol.value;

bgmVol.addEventListener("input", ()=>{ bgm.volume = +bgmVol.value; });

bgmToggle.addEventListener("click", async ()=>{
  try{
    if(bgm.paused){
      await bgm.play();
      bgmToggle.textContent = "⏸";
    }else{
      bgm.pause();
      bgmToggle.textContent = "▶";
    }
  }catch(e){
    // 자동재생 제한 케이스
    alert("브라우저 자동재생 제한으로 BGM은 사용자가 한번 눌러야 재생됩니다.");
  }
});

/* =========================================================
   [J] BOOT
   ========================================================= */
(async function boot(){
  // 초기 UI
  el("myName").textContent = USER_ID;
  clampBet();

  // 첫 sync
  await hardSync();

  // 타이머/애니메이션 시작
  tickSecond();
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(animateWheel);

  // entries 실시간 갱신(너무 잦지 않게): 5초마다(정지/마감 구간 제외)
  setInterval(async ()=>{
    const ms = nowMs();
    const start = roundState.roundStartMs || computeRoundStartMs(ms);
    const elapsed = (ms - start)/1000;
    const remain = ROUND_SEC - elapsed;
    if(remain <= 65) return; // 마감~정지 구간엔 불필요 갱신 금지
    try{
      const res = await apiSync();
      if(res && Array.isArray(res.entries)){
        roundState.entries = res.entries;
        roundState.totalPool = +res.totalPool || roundState.entries.reduce((a,b)=>a+(+b.amount||0),0) || 0;
        el("totalPool").textContent = formatInt(roundState.totalPool);
        drawWheel(roundState.entries);
      }
      if(res && (res.dailyTop || res.lastWinner)){
        roundState.dailyTop = res.dailyTop || roundState.dailyTop;
        roundState.lastWinner = res.lastWinner || roundState.lastWinner;
        updateTickerTexts();
      }
    }catch(_){}
  }, 5000);
})();
</script>
