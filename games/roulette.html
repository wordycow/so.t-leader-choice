<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UNIQUE ROYAL ROULETTE</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#05070f;
      --bg1:#070b18;
      --panel: rgba(10,12,18,0.72);
      --panel2: rgba(8,10,16,0.88);
      --line: rgba(255, 208, 80, 0.18);
      --line2: rgba(255, 208, 80, 0.28);

      --gold1:#ffd36b;
      --gold2:#f7b500;
      --gold3:#ffcc00;
      --muted:#a8b0c6;
      --txt:#e9edf7;

      --pink:#ff0a78;

      --radius:22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --glow: 0 0 18px rgba(255, 200, 70, 0.18);

      --roundSec: 900;      /* 15분(원하면 바꿔) */
      --lockSec: 60;        /* 60초 남으면 베팅 잠금 */
      --freezeSec: 30;      /* 승자 표시 30초 유지 */
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 208, 80, 0.10), transparent 60%),
        radial-gradient(900px 500px at 15% 30%, rgba(255,255,255,0.05), transparent 55%),
        radial-gradient(900px 500px at 90% 40%, rgba(255, 30, 120, 0.06), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    /* Top ticker */
    .ticker{
      position:sticky; top:0; z-index:50;
      width:100%;
      border-bottom:1px solid rgba(255, 208, 80, 0.10);
      background: linear-gradient(180deg, rgba(0,0,0,0.76), rgba(0,0,0,0.35));
      backdrop-filter: blur(10px);
    }
    .ticker .inner{
      display:flex; gap:14px; align-items:center;
      white-space:nowrap;
      padding:10px 14px;
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.06em;
      color: rgba(255, 208, 80, 0.85);
      font-size:12px;
      overflow:hidden;
    }
    .marquee{
      display:inline-block;
      animation: scroll 22s linear infinite;
      padding-left:100%;
    }
    @keyframes scroll{ 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }

    /* Layout */
    .wrap{
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 14px 28px;
    }
    .grid{
      display:grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 14px;
      align-items:start;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border:1px solid rgba(255, 208, 80, 0.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cardInner{ padding: 14px; }

    /* Stage (wheel area) */
    .stage{
      position:relative;
      min-height: 680px;
      background:
        radial-gradient(900px 700px at 45% 35%, rgba(0,0,0,0.0), rgba(0,0,0,0.55)),
        linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.6));
      border-right:1px solid rgba(255, 208, 80, 0.10);
    }

    /* Wheel viewport (for mobile crop) */
    .wheelViewport{
      position:relative;
      width:100%;
      height: 640px;
      overflow:hidden;
      border-bottom:1px solid rgba(255, 208, 80, 0.10);
      background:
        radial-gradient(800px 500px at 50% 25%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(1200px 900px at 50% 70%, rgba(0,0,0,0.75), rgba(0,0,0,0.15));
    }

    .wheelDock{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: 640px;
      height: 640px; /* ✅ 무조건 정사각 = 원형 유지 */
      max-width: 92vw;
      max-height: 92vw;
    }

    canvas#wheel{
      width:100%;
      height:100%;
      display:block;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,0.55));
    }

    /* Pointer (triangle only, no dot) */
    .pointer{
      position:absolute;
      left:50%;
      top:10px;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 26px solid var(--gold2); /* ✅ 뾰족한 부분이 아래(룰렛) */
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55));
      z-index:20;
      opacity:0.95;
    }

    /* HUD under wheel */
    .hud{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
    }
    .hudBox{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.22));
      border:1px solid rgba(255, 208, 80, 0.12);
      border-radius: 16px;
      padding: 12px 12px;
    }
    .hudLabel{
      font-family:"Cinzel", serif;
      letter-spacing:.08em;
      font-size:11px;
      color: rgba(255,255,255,0.60);
      margin-bottom:6px;
    }
    .hudValue{
      font-family:"Cinzel", serif;
      font-size:34px;
      font-weight:700;
      color: var(--gold3);
      text-shadow: 0 0 18px rgba(255, 208, 80, 0.18);
      line-height:1.1;
    }
    .hudValue.small{
      font-size:28px;
      color:#fff;
      text-shadow:none;
      font-family:"Rajdhani", sans-serif;
      letter-spacing:.04em;
    }

    /* Countdown pretty */
    .countBig{
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      font-size:34px;
      letter-spacing:.06em;
      color: #fff;
    }
    .countWarn{
      color: var(--gold3);
      text-shadow: 0 0 18px rgba(255, 208, 80, 0.24);
    }
    .countFinal{
      color: var(--pink);
      text-shadow: 0 0 18px rgba(255, 10, 120, 0.25);
      animation: blink 0.65s steps(2, end) infinite;
    }
    @keyframes blink{ 50%{opacity:0.25} }

    /* Right panel */
    .sideTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 208, 80, 0.10);
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.12));
    }
    .sideTitle{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      font-size:12px;
      color: rgba(255, 208, 80, 0.9);
    }
    .sideStatus{
      font-size:11px;
      color: rgba(255,255,255,0.60);
    }

    /* Player Bar (BGM) */
    .playerBar{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 8px 10px;
      border:1px solid rgba(255, 208, 80, 0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.25));
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      max-width: 100%;
      overflow:hidden;
    }
    .pBtn{
      width:34px;height:34px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
    }
    .pBtn:active{ transform: translateY(1px); }
    .pMeta{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap:2px;
      flex: 1;
    }
    .pName{
      font-family:"Cinzel", serif;
      font-weight:700;
      font-size:12px;
      letter-spacing:.06em;
      color: rgba(255, 208, 80, 0.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pSub{
      font-size:11px;
      color: rgba(255,255,255,0.55);
    }
    .volWrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
    }
    .volLabel{
      font-family:"Cinzel", serif;
      font-size:11px;
      letter-spacing:.07em;
      color: rgba(255,255,255,0.62);
      white-space:nowrap;
    }
    input[type="range"]{ width: 120px; max-width: 24vw; }

    /* Bet panel */
    .betBox{
      padding: 14px;
    }
    .row{
      display:flex; align-items:center; justify-content:space-between; gap: 10px;
      margin-bottom: 10px;
    }
    .kv{
      font-size:12px;
      color: rgba(255,255,255,0.65);
      letter-spacing:.02em;
    }
    .kv b{ color:#fff; font-weight:700; }
    .pill{
      padding:6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255, 208, 80, 0.14);
      background: rgba(0,0,0,0.25);
      color: rgba(255, 208, 80, 0.88);
      font-size:12px;
      white-space:nowrap;
    }

    .amountBox{
      border:1px solid rgba(255, 208, 80, 0.22);
      background: rgba(0,0,0,0.28);
      border-radius: 14px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      letter-spacing:.06em;
      color: var(--gold3);
      font-size:22px;
      box-shadow: var(--glow);
      margin-bottom: 10px;
    }

    .btnRow{
      display:flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn{
      flex:1;
      height: 42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.28);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
      font-weight:700;
    }
    .btn.gold{
      border:1px solid rgba(255, 208, 80, 0.35);
      color: var(--gold3);
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .betNow{
      width:100%;
      height: 54px;
      border-radius: 999px;
      border:1px solid rgba(255, 208, 80, 0.22);
      background:
        linear-gradient(90deg,
          rgba(0,0,0,0.35),
          rgba(255, 208, 80, 0.20),
          rgba(255, 10, 120, 0.14),
          rgba(0,0,0,0.35));
      color:#fff;
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.12em;
      cursor:pointer;
      box-shadow: 0 16px 50px rgba(0,0,0,0.55);
      margin-bottom: 10px;
    }
    .betNow:disabled{ opacity:.45; cursor:not-allowed; }

    /* Lists */
    .list{
      padding: 10px 14px 14px;
      border-top:1px solid rgba(255, 208, 80, 0.10);
    }
    .listTitle{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 8px;
    }
    .listTitle span{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      font-size:12px;
      color: rgba(255,255,255,0.70);
    }
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.22);
      margin-bottom: 8px;
    }
    .nameWrap{
      display:flex; align-items:center; gap:10px;
      min-width:0;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background: var(--pink);
      box-shadow: 0 0 14px rgba(255, 10, 120, 0.25);
      flex: 0 0 auto;
    }
    .nm{
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 220px;
    }
    .amt{
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      letter-spacing:.05em;
      color: var(--gold3);
      white-space:nowrap;
    }

    /* Winner overlay */
    .winner{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: radial-gradient(600px 420px at 50% 35%, rgba(0,0,0,0.25), rgba(0,0,0,0.88));
      z-index:40;
    }
    .winnerCard{
      width:min(520px, 92vw);
      border-radius: 22px;
      border:1px solid rgba(255, 208, 80, 0.22);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.55));
      box-shadow: 0 26px 80px rgba(0,0,0,0.65);
      padding: 16px 16px 14px;
      text-align:center;
    }
    .winnerTop{
      font-family:"Cinzel", serif;
      letter-spacing:.12em;
      color: rgba(255, 208, 80, 0.9);
      font-weight:700;
      font-size:13px;
      margin-bottom: 10px;
    }
    .winnerName{
      font-family:"Cinzel", serif;
      font-size:34px;
      font-weight:700;
      color:#fff;
      text-shadow: 0 0 18px rgba(255,255,255,0.12);
      margin-bottom: 6px;
      word-break:break-word;
    }
    .winnerSub{
      font-family:"Rajdhani", sans-serif;
      font-size:18px;
      letter-spacing:.08em;
      color: var(--gold3);
    }

    /* Mobile rules */
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .stage{ min-height: unset; }
      .wheelViewport{ height: 72vw; max-height: 420px; }

      /* ✅ 모바일: 룰렛 크게 만들고 크롭(부분만 보이게) */
      .wheelDock{
        width: 140vw;
        height: 140vw;
        max-width: 760px;
        max-height: 760px;
        left:50%;
        top: 6px; /* 위로 붙임 */
        transform: translateX(-50%);
      }

      .pointer{ top: 8px; }

      /* ✅ 모바일: BGM 바는 BET 버튼 밑으로 내려감(동적 이동도 JS에서 처리) */
      input[type="range"]{ width: 100px; max-width: 30vw; }
      .pBtn{ width:30px; height:30px; border-radius: 11px; }
      .pName{ font-size:11px; }
      .volLabel{ font-size:10px; }
    }

    @media (max-width: 420px){
      .nm{ max-width: 170px; }
      .hudValue{ font-size:30px; }
      .hudValue.small{ font-size:26px; }
    }
  </style>

  <!-- ✅ 네가 만든 플레이리스트 파일 (필수) -->
  <script src="./roulette.playlist.js"></script>
  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
  <div class="ticker">
    <div class="inner">
      <span class="marquee" id="tickerText">
        UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎  ·  LAST WINNER: (WAITING) 🏆  ·  UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎
      </span>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <!-- LEFT: STAGE -->
      <div class="card stage">
        <div class="wheelViewport" id="wheelViewport">
          <div class="pointer" id="pointer"></div>
          <div class="wheelDock">
            <canvas id="wheel"></canvas>
          </div>

          <div class="winner" id="winnerOverlay">
            <div class="winnerCard">
              <div class="winnerTop">WINNER</div>
              <div class="winnerName" id="winnerName">—</div>
              <div class="winnerSub" id="winnerSub">—</div>
            </div>
          </div>
        </div>

        <div class="hud">
          <div class="hudBox">
            <div class="hudLabel">TOTAL POOL</div>
            <div class="hudValue" id="totalPool">0 UT</div>
          </div>
          <div class="hudBox">
            <div class="hudLabel">TIME LEFT</div>
            <div class="hudValue small">
              <span class="countBig" id="timeLeft">--:--</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: PANEL -->
      <div class="card" id="sideCard">
        <div class="sideTop" id="sideTop">
          <div>
            <div class="sideTitle">ROYAL CONTROL</div>
            <div class="sideStatus" id="syncStatus">동기화: LOCAL</div>
          </div>
          <!-- ✅ PC: BGM 컨트롤은 여기 -->
          <div id="bgmDock"></div>
        </div>

        <div class="betBox" id="betBox">
          <div class="row">
            <div class="kv">MY NAME: <b id="myId">—</b></div>
            <div class="pill" id="betStatePill">BETTING OPEN</div>
          </div>

          <div class="row">
            <div class="kv">MY WALLET</div>
            <div class="amt" id="myWallet">0 UT</div>
          </div>

          <div class="amountBox" id="betAmountBox">100</div>

          <!-- ✅ 모바일에서 버튼 한칸 내려주는 구조 이미 반영 -->
          <div class="btnRow" id="btnRow1">
            <button class="btn" id="btnMin">MIN</button>
            <button class="btn" id="btnMinus">-100</button>
            <button class="btn gold" id="btnMid">100</button>
            <button class="btn" id="btnPlus">+100</button>
            <button class="btn" id="btnMax">MAX</button>
          </div>

          <button class="betNow" id="btnBet">UNIQUE  &nbsp; BET NOW</button>

          <!-- ✅ 모바일: BGM 컨트롤은 BET 버튼 밑으로 이동됨(JS가 자동 이동) -->
          <div id="bgmDockMobile" style="margin-top:10px;"></div>

          <div class="row" style="margin-top: 10px;">
            <div class="kv">MY TOTAL BET</div>
            <div class="amt" id="myTotalBet">0 UT</div>
          </div>
        </div>

        <div class="list">
          <div class="listTitle">
            <span>PLAYERS</span>
            <span class="sideStatus" id="playersCount">0</span>
          </div>
          <div id="playersList"></div>

          <div class="listTitle" style="margin-top:12px;">
            <span>MY BET DETAIL</span>
            <span class="sideStatus" id="myDetailHint">자동 합산</span>
          </div>
          <div id="myBetsList"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ==========================
   0) User / Storage
========================== */
const qs = new URLSearchParams(location.search);
const MY_ID = (qs.get("id") || "GUEST").trim();
document.getElementById("myId").textContent = MY_ID;

/* ==========================
   1) Playlist (네가 만든 파일 사용)
========================== */
const PLAYLIST = (Array.isArray(window.UNIQUE_YT_PLAYLIST) && window.UNIQUE_YT_PLAYLIST.length)
  ? window.UNIQUE_YT_PLAYLIST
  : []; // 없으면 조용히 빈값

/* ==========================
   2) YouTube Player UI (턴테이블 느낌, 반응형)
========================== */
let ytPlayer = null;
let ytIndex = 0;

function buildPlayerBar(){
  const bar = document.createElement("div");
  bar.className = "playerBar";
  bar.id = "playerBar";

  bar.innerHTML = `
    <button class="pBtn" id="pPrev" title="Prev">⏮</button>
    <button class="pBtn" id="pPlay" title="Play/Pause">▶</button>
    <button class="pBtn" id="pNext" title="Next">⏭</button>

    <div class="pMeta">
      <div class="pName" id="pTitle">ROYAL BGM</div>
      <div class="pSub" id="pSub">0/0</div>
    </div>

    <div class="volWrap">
      <div class="volLabel">VOL</div>
      <input id="pVol" type="range" min="0" max="100" value="35" />
    </div>
  `;
  return bar;
}

function dockBgmBar(){
  const isMobile = matchMedia("(max-width: 980px)").matches;
  const bar = document.getElementById("playerBar");
  if(!bar) return;

  const pcDock = document.getElementById("bgmDock");
  const moDock = document.getElementById("bgmDockMobile");

  if(isMobile){
    if(moDock && bar.parentElement !== moDock) moDock.appendChild(bar);
  }else{
    if(pcDock && bar.parentElement !== pcDock) pcDock.appendChild(bar);
  }
}

function onYouTubeIframeAPIReady(){
  // UI 먼저 만든다
  const bar = buildPlayerBar();
  document.getElementById("bgmDock").appendChild(bar);
  dockBgmBar();

  if(!PLAYLIST.length){
    document.getElementById("pTitle").textContent = "BGM 없음";
    document.getElementById("pSub").textContent = "0/0";
    // 버튼 비활성
    ["pPrev","pPlay","pNext","pVol"].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.disabled=true;
    });
    return;
  }

  ytPlayer = new YT.Player(document.createElement("div"), {
    height: "0",
    width: "0",
    videoId: PLAYLIST[0],
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => {
        setTimeout(()=> {
          ytPlayer.setVolume(+document.getElementById("pVol").value || 35);
          ytPlayer.playVideo();
          updateBgmMeta();
        }, 120);
      },
      onStateChange: (e) => {
        // 끝나면 다음곡
        if(e.data === YT.PlayerState.ENDED){
          nextTrack();
        }
        updatePlayBtnIcon();
      }
    }
  });

  document.body.appendChild(ytPlayer.getIframe());

  // controls
  document.getElementById("pPlay").onclick = () => {
    const st = ytPlayer.getPlayerState();
    if(st === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
    updatePlayBtnIcon();
  };
  document.getElementById("pPrev").onclick = prevTrack;
  document.getElementById("pNext").onclick = nextTrack;
  document.getElementById("pVol").oninput = (e)=> ytPlayer.setVolume(+e.target.value);

  window.addEventListener("resize", dockBgmBar);
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function updatePlayBtnIcon(){
  if(!ytPlayer) return;
  const st = ytPlayer.getPlayerState();
  document.getElementById("pPlay").textContent = (st === YT.PlayerState.PLAYING) ? "⏸" : "▶";
}
function updateBgmMeta(){
  const titleEl = document.getElementById("pTitle");
  const subEl = document.getElementById("pSub");
  titleEl.textContent = `ROYAL BGM ${String(ytIndex+1).padStart(2,"0")}`;
  subEl.textContent = `${ytIndex+1}/${PLAYLIST.length}`;
}
function nextTrack(){
  if(!ytPlayer) return;
  ytIndex = (ytIndex + 1) % PLAYLIST.length;
  ytPlayer.loadVideoById(PLAYLIST[ytIndex]);
  updateBgmMeta();
}
function prevTrack(){
  if(!ytPlayer) return;
  ytIndex = (ytIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
  ytPlayer.loadVideoById(PLAYLIST[ytIndex]);
  updateBgmMeta();
}

/* ==========================
   3) Round Timer (60초 잠금, 10~0 깜빡임, 0초 정지+승자 30초)
========================== */
const ROUND_SEC = +getComputedStyle(document.documentElement).getPropertyValue("--roundSec") || 900;
const LOCK_SEC  = +getComputedStyle(document.documentElement).getPropertyValue("--lockSec") || 60;
const FREEZE_SEC= +getComputedStyle(document.documentElement).getPropertyValue("--freezeSec") || 30;

let roundKey = "";
let roundEndAt = 0;
let bettingLocked = false;
let showingWinner = false;

/* ==========================
   4) Bets / Aggregation
========================== */
const STORE_KEY = "unique_roulette_bets_v1";
const WALLET_KEY = "unique_wallet_v1";

function loadWallet(){
  const raw = localStorage.getItem(WALLET_KEY);
  const base = raw ? JSON.parse(raw) : {};
  if(typeof base[MY_ID] !== "number") base[MY_ID] = 6983; // 기본값(원하면 바꿔)
  localStorage.setItem(WALLET_KEY, JSON.stringify(base));
  return base;
}
function setWalletAll(obj){
  localStorage.setItem(WALLET_KEY, JSON.stringify(obj));
}
function getWallet(){
  const all = loadWallet();
  return all[MY_ID] || 0;
}
function setWallet(me){
  const all = loadWallet();
  all[MY_ID] = me;
  setWalletAll(all);
}
function loadBets(){
  const raw = localStorage.getItem(STORE_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveBets(arr){
  localStorage.setItem(STORE_KEY, JSON.stringify(arr));
}

/* 같은 아이디 합산 */
function aggregateById(bets){
  const map = new Map();
  for(const b of bets){
    const key = (b.id || "").trim();
    if(!key) continue;
    map.set(key, (map.get(key)||0) + (b.amount||0));
  }
  return [...map.entries()]
    .map(([id, amount])=>({id, amount}))
    .sort((a,b)=> b.amount - a.amount);
}

/* ==========================
   5) Wheel Drawing (라벨 방향 보정: 왼쪽도 “→오른쪽” 읽히게)
========================== */
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
let wheelAngle = 0;        // current angle
let wheelTarget = null;    // stop angle at 0 sec
let wheelRunning = true;

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height= Math.floor(rect.height * dpr);
  drawWheel();
}
window.addEventListener("resize", ()=>{ resizeCanvas(); dockBgmBar(); });

function drawWheel(players = null){
  const list = players || getCurrentAggregatedPlayers();
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H)*0.46;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(wheelAngle);

  // base shadow ring
  ctx.beginPath();
  ctx.arc(0,0,R*1.08,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,0.28)";
  ctx.fill();

  // outer gold ring
  const grd = ctx.createLinearGradient(-R, -R, R, R);
  grd.addColorStop(0, "#8b6a00");
  grd.addColorStop(0.35, "#ffd36b");
  grd.addColorStop(0.65, "#f7b500");
  grd.addColorStop(1, "#4a3400");
  ctx.beginPath();
  ctx.arc(0,0,R*1.03,0,Math.PI*2);
  ctx.lineWidth = R*0.08;
  ctx.strokeStyle = grd;
  ctx.stroke();

  // inner disc base
  ctx.beginPath();
  ctx.arc(0,0,R*0.94,0,Math.PI*2);
  ctx.fillStyle = "#0b0b10";
  ctx.fill();

  // segments
  const total = Math.max(1, list.reduce((s,p)=>s+p.amount,0));
  let start = -Math.PI/2; // top is pointer
  for(let i=0;i<list.length;i++){
    const p = list[i];
    const frac = Math.max(0.001, p.amount/total);
    const ang = frac * Math.PI*2;

    // vivid luxury palette (pink/gold/black variations)
    const segGrd = ctx.createRadialGradient(0,0,R*0.2, 0,0,R*1.05);
    if(i%2===0){
      segGrd.addColorStop(0, "#ff2e96");
      segGrd.addColorStop(0.55, "#ff0a78");
      segGrd.addColorStop(1, "#8a0037");
    }else{
      segGrd.addColorStop(0, "#ff1c84");
      segGrd.addColorStop(0.6, "#ff0a78");
      segGrd.addColorStop(1, "#5a0023");
    }

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R*0.92, start, start+ang);
    ctx.closePath();
    ctx.fillStyle = segGrd;
    ctx.fill();

    // separator line
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(start)*R*0.92, Math.sin(start)*R*0.92);
    ctx.strokeStyle = "rgba(255, 208, 80, 0.14)";
    ctx.lineWidth = 2*dpr;
    ctx.stroke();

    // label (radial, flip for readability)
    const mid = start + ang/2;
    drawLabelRadial(p.id, p.amount, mid, R);

    start += ang;
  }

  // inner highlight rings
  ctx.beginPath();
  ctx.arc(0,0,R*0.90,0,Math.PI*2);
  ctx.strokeStyle="rgba(255,255,255,0.06)";
  ctx.lineWidth=2*dpr;
  ctx.stroke();

  // ✅ center black bigger + UNIQUE inside (wheel rotates with it)
  const cR = R*0.22; // bigger than before
  const ring = ctx.createLinearGradient(-cR, -cR, cR, cR);
  ring.addColorStop(0, "#3c2a00");
  ring.addColorStop(0.5, "#ffd36b");
  ring.addColorStop(1, "#5a3b00");

  ctx.beginPath();
  ctx.arc(0,0,cR*1.02,0,Math.PI*2);
  ctx.fillStyle="#000";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,0,cR*1.02,0,Math.PI*2);
  ctx.lineWidth = cR*0.22;
  ctx.strokeStyle = ring;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0,0,cR*0.78,0,Math.PI*2);
  ctx.fillStyle="#07070b";
  ctx.fill();

  ctx.font = `${Math.floor(cR*0.55)}px Cinzel`;
  ctx.fillStyle = "#ffd36b";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="rgba(255, 208, 80, 0.28)";
  ctx.shadowBlur=18*dpr;
  ctx.fillText("UNIQUE", 0, 0);
  ctx.shadowBlur=0;

  ctx.restore();
}

function drawLabelRadial(name, amt, midAngle, R){
  // radial orientation
  ctx.save();
  ctx.rotate(midAngle);

  // flip when on left side so it reads left->right from rim inward
  const leftSide = (midAngle > Math.PI/2 && midAngle < 3*Math.PI/2);
  if(leftSide) ctx.rotate(Math.PI);

  const label = String(name||"").trim();
  const small = `${amt}`;
  const x = R*0.58;
  const maxW = R*0.30;

  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 10*dpr;

  ctx.font = `${Math.floor(R*0.055)}px Cinzel`;
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.textAlign = "left";

  // ellipsis if too long
  let t = label;
  while(ctx.measureText(t).width > maxW && t.length>3) t = t.slice(0,-1);
  if(t !== label) t = t.slice(0, Math.max(2, t.length-1)) + "…";

  ctx.fillText(t, x, -R*0.08);

  ctx.font = `${Math.floor(R*0.05)}px Rajdhani`;
  ctx.fillStyle = "rgba(255,208,80,0.95)";
  ctx.fillText(small, x, R*0.03);

  ctx.shadowBlur = 0;
  ctx.restore();
}

/* ==========================
   6) Round + UI
========================== */
let betAmount = 100;

function setBetAmount(v){
  betAmount = Math.max(0, Math.min(1000000, v|0));
  document.getElementById("betAmountBox").textContent = betAmount;
  document.getElementById("btnMid").textContent = betAmount;
}
setBetAmount(100);

document.getElementById("btnMin").onclick = ()=> setBetAmount(0);
document.getElementById("btnMinus").onclick= ()=> setBetAmount(Math.max(0, betAmount-100));
document.getElementById("btnPlus").onclick = ()=> setBetAmount(betAmount+100);
document.getElementById("btnMax").onclick  = ()=> setBetAmount(1000); // 필요하면 바꿔
document.getElementById("btnMid").onclick  = ()=> setBetAmount(betAmount); // 그대로

document.getElementById("btnBet").onclick = ()=>{
  if(bettingLocked || showingWinner) return;
  if(betAmount <= 0) return;

  // wallet check
  const w = getWallet();
  if(w < betAmount) return;

  // store bet
  const bets = loadBets();
  bets.push({
    round: roundKey,
    id: MY_ID,
    amount: betAmount,
    ts: Date.now()
  });
  saveBets(bets);
  setWallet(w - betAmount);

  refreshUI();
};

function getRoundKey(now = new Date()){
  // 15분 단위 라운드
  const ms = now.getTime();
  const slot = Math.floor(ms / (ROUND_SEC*1000)) * (ROUND_SEC*1000);
  return String(slot);
}

function computeRoundTimes(){
  const now = Date.now();
  const slot = Math.floor(now / (ROUND_SEC*1000)) * (ROUND_SEC*1000);
  roundKey = String(slot);
  roundEndAt = slot + ROUND_SEC*1000;
}

function fmtMMSS(sec){
  sec = Math.max(0, sec|0);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function getCurrentRoundBets(){
  const bets = loadBets();
  return bets.filter(b => b.round === roundKey);
}

function getCurrentAggregatedPlayers(){
  const rb = getCurrentRoundBets();

  // 회사가 항상 보이게 (원하면 0으로 바꿔)
  const company = { round: roundKey, id: "COMPANY", amount: 100, ts: Date.now() };

  const merged = aggregateById([company, ...rb]);
  return merged;
}

function refreshUI(){
  // wallet
  document.getElementById("myWallet").textContent = `${getWallet().toLocaleString()} UT`;

  // players
  const players = getCurrentAggregatedPlayers();
  const total = players.reduce((s,p)=>s+p.amount,0);
  document.getElementById("totalPool").textContent = `${total.toLocaleString()} UT`;

  // list render
  const listEl = document.getElementById("playersList");
  listEl.innerHTML = "";
  players.forEach((p, i)=>{
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div class="nameWrap">
        <div class="dot" style="opacity:${i===0?1:0.85}"></div>
        <div class="nm" title="${p.id}">${p.id}</div>
      </div>
      <div class="amt">${p.amount.toLocaleString()}</div>
    `;
    listEl.appendChild(row);
  });
  document.getElementById("playersCount").textContent = `${players.length}`;

  // my bets
  const bets = getCurrentRoundBets().filter(b => b.id === MY_ID);
  const myTotal = bets.reduce((s,b)=>s+b.amount,0);
  document.getElementById("myTotalBet").textContent = `${myTotal.toLocaleString()} UT`;

  const myList = document.getElementById("myBetsList");
  myList.innerHTML = "";
  if(!bets.length){
    const row = document.createElement("div");
    row.className="item";
    row.innerHTML = `<div class="nm" style="opacity:.8;">(아직 베팅 없음)</div><div class="amt">—</div>`;
    myList.appendChild(row);
  }else{
    // 최근 6개만
    bets.slice(-6).reverse().forEach(b=>{
      const row = document.createElement("div");
      row.className="item";
      row.innerHTML = `
        <div class="nm" style="opacity:.9;">${new Date(b.ts).toLocaleTimeString()}</div>
        <div class="amt">${b.amount.toLocaleString()}</div>
      `;
      myList.appendChild(row);
    });
  }

  // redraw wheel
  drawWheel(players);
}

/* ==========================
   7) Winner logic (0초 정지 후 30초 표시)
========================== */
function pickWinner(players){
  const total = players.reduce((s,p)=>s+p.amount,0);
  if(total <= 0) return { id: "NO BETS", amount: 0, index: 0 };

  // deterministic-ish seed: roundKey 기반
  let seed = 0;
  for(let i=0;i<roundKey.length;i++) seed = (seed*31 + roundKey.charCodeAt(i)) >>> 0;
  // xorshift
  seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
  const r = (seed >>> 0) / 4294967296;

  let acc = 0;
  for(let i=0;i<players.length;i++){
    acc += players[i].amount / total;
    if(r <= acc) return { ...players[i], index: i };
  }
  return { ...players[players.length-1], index: players.length-1 };
}

function computeStopAngle(players, winIndex){
  // segments accumulated from -PI/2
  const total = Math.max(1, players.reduce((s,p)=>s+p.amount,0));
  let start = -Math.PI/2;
  for(let i=0;i<players.length;i++){
    const ang = Math.max(0.001, players[i].amount/total) * Math.PI*2;
    const mid = start + ang/2;
    if(i === winIndex){
      // pointer is at top => want wheelAngle such that mid aligns to -PI/2 (top)
      // currently wheel is rotated by wheelAngle. We need wheelAngle so that (mid + wheelAngle) == -PI/2
      return (-Math.PI/2) - mid;
    }
    start += ang;
  }
  return 0;
}

function showWinnerOverlay(name, amount){
  const ov = document.getElementById("winnerOverlay");
  const n = document.getElementById("winnerName");
  const s = document.getElementById("winnerSub");
  n.textContent = name;
  s.textContent = amount ? `${amount.toLocaleString()} UT` : "—";
  ov.style.display = "flex";

  // ticker update
  const tick = document.getElementById("tickerText");
  tick.textContent = `UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎  ·  LAST WINNER: ${name} (${amount||0} UT) 🏆  ·  UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎`;
}

function hideWinnerOverlay(){
  document.getElementById("winnerOverlay").style.display = "none";
}

/* ==========================
   8) Animation Loop
========================== */
function tick(){
  computeRoundTimes();

  const now = Date.now();
  const leftSec = Math.ceil((roundEndAt - now)/1000);
  const timeEl = document.getElementById("timeLeft");
  const pill = document.getElementById("betStatePill");
  const btnBet = document.getElementById("btnBet");

  // time display rules:
  // - 60초 이하: 초만 크게(예쁜 숫자)
  // - 10~0: 깜빡임
  if(leftSec <= 60){
    timeEl.textContent = String(Math.max(0,leftSec));
    timeEl.className = "countBig countWarn";
    if(leftSec <= 10) timeEl.className = "countBig countFinal";
  }else{
    timeEl.textContent = fmtMMSS(leftSec);
    timeEl.className = "countBig";
  }

  // lock betting
  bettingLocked = (leftSec <= LOCK_SEC);
  pill.textContent = bettingLocked ? "BETTING CLOSED" : "BETTING OPEN";
  pill.style.color = bettingLocked ? "rgba(255,255,255,0.88)" : "rgba(255, 208, 80, 0.88)";
  pill.style.borderColor = bettingLocked ? "rgba(255,255,255,0.14)" : "rgba(255, 208, 80, 0.18)";
  btnBet.disabled = bettingLocked || showingWinner;

  // wheel motion:
  if(!showingWinner){
    if(leftSec > 0){
      // open phase: subtle rotation
      wheelRunning = true;
      wheelAngle += 0.0022; // 천천히 도는 느낌
    }else{
      // 0초: 정지 + winner
      if(wheelRunning){
        wheelRunning = false;
        const players = getCurrentAggregatedPlayers();
        const win = pickWinner(players);

        // stop exact
        wheelTarget = computeStopAngle(players, win.index);
        wheelAngle = wheelTarget;

        // show
        showingWinner = true;
        showWinnerOverlay(win.id, win.amount);

        // 30초 유지 후 다음 라운드로
        setTimeout(()=>{
          hideWinnerOverlay();
          showingWinner = false;
          wheelTarget = null;
          // 다음 라운드로 넘어가면 로컬 베팅은 남아도 roundKey가 바뀌어 자동 분리됨
          refreshUI();
        }, FREEZE_SEC*1000);
      }
    }
  }

  refreshUI();

  requestAnimationFrame(tick);
}

/* init */
function init(){
  document.getElementById("syncStatus").textContent = "동기화: LOCAL (서버 응답 없음)";
  resizeCanvas();
  refreshUI();
  requestAnimationFrame(tick);
}
init();

</script>
