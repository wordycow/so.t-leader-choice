<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: So.T ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    :root{
      /* So.T Branding Colors */
      --bg-dark: #050510;
      --bg-panel: rgba(20, 20, 35, 0.65);
      --so-gradient: linear-gradient(135deg, #00f260 0%, #0575e6 100%); /* Green to Blue */
      --accent-gold: #ffd700;
      --accent-pink: #ff0055;
      --text-main: #ffffff;
      --text-muted: rgba(255,255,255,0.6);
      --stroke-light: rgba(255,255,255,0.1);
      --danger: #ff4757;
    }

    /* Reset & Base */
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{
      margin:0; padding:0; width:100%; height:100%; overflow:hidden;
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
    }
    
    /* Background Aurora Effect */
    body::before {
      content:""; position:fixed; inset:0; z-index:-1;
      background: 
        radial-gradient(circle at 10% 20%, rgba(5, 117, 230, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 242, 96, 0.1), transparent 40%);
    }

    /* Top Marquee */
    .marquee-wrap{
      position:fixed; left:0; right:0; top:0; z-index:100;
      height:44px; display:flex; align-items:center;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid var(--stroke-light);
      backdrop-filter: blur(10px);
    }
    .marquee-text{
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      font-weight:700; font-size:14px; color: #fff;
      padding: 0 16px; width: 100%; text-align: center;
      text-shadow: 0 0 10px rgba(0,242,96,0.5);
    }

    /* Main Layout */
    .layout{
      position:fixed; inset:44px 0 0 0;
      display:grid; 
      grid-template-columns: 1fr; 
      grid-template-rows: 1fr auto;
    }

    /* PC Layout override */
    @media (min-width: 1024px){
      .layout{
        grid-template-columns: 1fr 400px;
        grid-template-rows: 1fr;
      }
    }

    /* GAME STAGE (Wheel Area) */
    .stage{
      position:relative; width:100%; height:100%;
      overflow:hidden;
      /* Remove random borders */
      border:none; 
    }
    
    canvas{ display:block; width:100%; height:100%; }

    /* Premium Pointer (Stopper Style) - Pointing INWARD */
    .pointer-wrap {
      position:absolute; left:0; top:50%;
      transform:translateY(-50%);
      width: 60px; height: 80px;
      z-index: 20;
      display:flex; align-items:center;
    }
    .pointer-body {
      width: 50px; height: 30px;
      background: linear-gradient(90deg, #ffd700, #b8860b);
      clip-path: polygon(0% 0%, 80% 0%, 100% 50%, 80% 100%, 0% 100%);
      box-shadow: 0 0 20px rgba(255,215,0,0.6);
      border-radius: 4px 0 0 4px;
    }
    .pointer-glow {
      position:absolute; left:40px; top:50%; transform:translateY(-50%);
      width:10px; height:10px; background:#fff; border-radius:50%;
      box-shadow: 0 0 15px #fff;
    }

    /* Center Countdown (Last 10s) */
    .center-countdown{
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.5);
      width:120px; height:120px;
      display:flex; align-items:center; justify-content:center;
      border-radius:50%;
      background: rgba(0,0,0,0.6);
      border: 2px solid var(--danger);
      color: var(--danger);
      font-size: 50px; font-weight:900;
      opacity:0; pointer-events:none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 50;
    }
    .center-countdown.active{ opacity:1; transform:translate(-50%,-50%) scale(1); }

    /* SIDE PANEL (UI) */
    .side{
      position:relative;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      padding: 16px;
      display:flex; flex-direction:column; gap:12px;
      border-left: none; /* Removed ugly border */
      box-shadow: -10px 0 30px rgba(0,0,0,0.3);
      z-index: 30;
    }

    /* Total Equity HUD - Bigger & Better */
    .hud-main {
      text-align:center; padding: 15px;
      background: rgba(0,0,0,0.3); border-radius:16px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .hud-label { font-size:12px; color:var(--text-muted); margin-bottom:4px; font-weight:700; letter-spacing:1px; }
    .hud-value { 
      font-size:32px; font-weight:900; 
      background: linear-gradient(to right, #fff, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    .timer-bar {
      display:flex; justify-content:space-between; align-items:center;
      background: rgba(0,0,0,0.3); padding: 10px 16px; border-radius:12px;
    }
    .timer-val { font-size:20px; font-weight:800; color:var(--text-main); font-variant-numeric: tabular-nums; }
    .timer-val.urgent { color: var(--danger); animation: pulse 1s infinite; }

    @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.5;} 100%{opacity:1;} }

    /* Participant List */
    .list-panel {
      flex: 1; min-height: 150px;
      background: rgba(0,0,0,0.2); border-radius:16px;
      display:flex; flex-direction:column;
      overflow:hidden; border: 1px solid rgba(255,255,255,0.05);
    }
    .list-header { 
      padding:12px; font-size:13px; font-weight:700; color:var(--text-muted); 
      background:rgba(255,255,255,0.03); display:flex; justify-content:space-between;
    }
    .list-content { flex:1; overflow-y:auto; padding:8px; }
    
    .p-row {
      display:flex; align-items:center; gap:10px; padding:8px;
      margin-bottom:4px; border-radius:8px;
      background: rgba(255,255,255,0.02); transition:0.2s;
    }
    .p-row:hover { background: rgba(255,255,255,0.05); }
    .p-dot { width:8px; height:8px; border-radius:50%; box-shadow:0 0 8px currentColor;}
    .p-name { flex:1; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .p-amt { font-size:14px; font-weight:700; color: var(--accent-gold); }

    /* CONTROLS - FIXED LAYOUT */
    .controls {
      background: rgba(0,0,0,0.4); padding:16px; border-radius:20px 20px 0 0;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    @media (min-width:1024px){ .controls { border-radius:16px; border: 1px solid rgba(255,255,255,0.1); } }

    .bet-grid {
      display:grid; 
      grid-template-columns: auto auto 1fr auto auto; 
      gap: 6px; 
      margin-bottom: 12px;
    }

    .btn-ctrl {
      background: rgba(255,255,255,0.1); border:none; color:#fff;
      border-radius: 8px; font-weight:700; font-size:12px;
      padding: 0 10px; height: 44px; cursor:pointer;
      transition: all 0.1s;
      min-width: 48px;
    }
    .btn-ctrl:active { transform:scale(0.96); background:rgba(255,255,255,0.2); }
    
    .inp-bet {
      background: rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2);
      color: #fff; text-align:center; font-size:16px; font-weight:700;
      border-radius: 8px; width:100%; height:44px; outline:none;
    }

    .btn-action {
      width:100%; height:50px; border:none; border-radius:12px;
      background: var(--so-gradient);
      color:#fff; font-size:16px; font-weight:800;
      cursor:pointer; box-shadow: 0 4px 15px rgba(0, 242, 96, 0.3);
      transition: filter 0.2s, transform 0.1s;
    }
    .btn-action:disabled { background: #333; color:#777; box-shadow:none; cursor:not-allowed; }
    .btn-action:active { transform:scale(0.98); }

    .my-asset { 
      text-align:right; font-size:12px; color:var(--text-muted); margin-top:8px; 
    }
    .my-asset span { color:#fff; font-weight:700; margin-left:4px; }

    /* MODAL */
    .modal-overlay {
      position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.8);
      display:none; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.active { display:flex; }
    .modal-box {
      width:100%; max-width:400px;
      background: #12121c; border:1px solid rgba(255,255,255,0.1);
      border-radius:20px; padding:24px; text-align:center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-title { font-size:22px; font-weight:800; margin-bottom:8px; color:#fff; }
    .modal-desc { font-size:14px; color:var(--text-muted); margin-bottom:20px; }
    
    .color-grid { display:grid; grid-template-columns: repeat(5,1fr); gap:8px; margin-bottom:20px; }
    .c-btn {
      aspect-ratio:1; border-radius:8px; cursor:pointer; 
      border:2px solid transparent; transition:transform 0.1s;
    }
    .c-btn.selected { border-color:#fff; transform:scale(1.1); box-shadow:0 0 10px rgba(255,255,255,0.5); }
    .c-btn.disabled { opacity:0.2; pointer-events:none; }

    .result-amt { font-size:36px; font-weight:900; color:var(--accent-gold); margin:10px 0; }
  </style>
</head>
<body>

  <div class="marquee-wrap">
    <div class="marquee-text" id="marqueeText">So.T 프리미엄 룰렛에 오신 것을 환영합니다!</div>
  </div>

  <div class="layout">
    <div class="stage">
      <canvas id="canvas"></canvas>
      
      <div class="pointer-wrap">
        <div class="pointer-body"></div>
        <div class="pointer-glow"></div>
      </div>
      
      <div id="centerCount" class="center-countdown"></div>
    </div>

    <aside class="side">
      
      <div class="hud-main">
        <div class="hud-label">TOTAL EQUITY</div>
        <div class="hud-value" id="poolDisplay">0 UT</div>
      </div>

      <div class="timer-bar">
        <div class="hud-label" style="margin:0;">TIME LEFT</div>
        <div class="timer-val" id="timerDisplay">--:--</div>
      </div>

      <div class="list-panel">
        <div class="list-header">
          <span>LIVE RANK</span>
          <span id="roundBadge">ROUND Loading...</span>
        </div>
        <div class="list-content" id="participantList">
          </div>
      </div>

      <div class="controls">
        <div class="bet-grid">
          <button class="btn-ctrl" id="btnMin">MIN</button>
          <button class="btn-ctrl" id="btnM100">-100</button>
          <input type="number" id="inpBet" class="inp-bet" value="100" readonly />
          <button class="btn-ctrl" id="btnP100">+100</button>
          <button class="btn-ctrl" id="btnMax">MAX</button>
        </div>
        <button id="btnJoin" class="btn-action">참여하기 (BET)</button>
        <div class="my-asset">내 자산: <span id="myBalance">Loading...</span></div>
      </div>
    </aside>
  </div>

  <div id="modalColor" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">CHOOSE YOUR COLOR</div>
      <div class="modal-desc">당신을 상징할 컬러를 선택하세요.</div>
      <div class="color-grid" id="colorGrid"></div>
      <button id="btnColorConfirm" class="btn-action" disabled>START GAME</button>
    </div>
  </div>

  <div id="modalResult" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" style="color:var(--accent-gold);">ROUND FINISHED</div>
      <div class="modal-desc">WINNER IS</div>
      <div id="resWinnerName" style="font-size:24px; font-weight:800; color:#fff; margin-bottom:5px;">-</div>
      <div id="resPrize" class="result-amt">- UT</div>
      <div id="resMsg" style="font-size:14px; margin-top:10px; color:#aaa;">-</div>
      <button id="btnCloseResult" class="btn-action" style="margin-top:20px; background:#444;">NEXT ROUND</button>
    </div>
  </div>

  <script>
    // ============================
    // ⚙️ CONFIG & STATE
    // ============================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec"; // 본인 URL 확인 필요
    
    const BET_UNIT = 100;
    const MIN_BET = 100;
    const WHEEL_RPM = 2.5;

    let myId = "";
    let myWallet = 0;
    let myColor = null;

    let currentRoundKey = null;
    let gameState = { participants: [], totalPool: 0, rotation: 0 };
    let isBettingProcessing = false;
    let isLocked = false;

    // Server Sync
    let serverOffsetMs = 0;
    let serverNextRoundAtMs = 0;

    const synth = window.speechSynthesis;
    const colors = [
      '#ff0055', '#00ff44', '#00ccff', '#ffdd00', '#aa00ff',
      '#ff6600', '#ffffff', '#ff99cc', '#99ff99', '#6666ff',
      '#cc0000', '#006600', '#000099', '#663300', '#0575e6',
      '#00ff99', '#ff3399', '#ccff00', '#9900cc', '#33ccff'
    ];

    // ============================
    // 🛠 UTILS
    // ============================
    const $ = (id) => document.getElementById(id);
    const safeText = (id, txt) => { const el=$(id); if(el) el.innerText=txt; };

    function speak(text) {
      if(!synth) return;
      if(synth.speaking) synth.cancel(); // 말하고 있으면 끊고 새말
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      synth.speak(utter);
    }

    // ============================
    // 🎨 COLOR PICKER
    // ============================
    function initColorPicker(){
      const grid = $("colorGrid");
      grid.innerHTML = "";
      colors.forEach(c => {
        const btn = document.createElement("div");
        btn.className = "c-btn";
        btn.style.backgroundColor = c;
        btn.style.boxShadow = `0 0 10px ${c}`;
        btn.onclick = () => {
          document.querySelectorAll(".c-btn").forEach(b=>b.classList.remove("selected"));
          btn.classList.add("selected");
          myColor = c;
          $("btnColorConfirm").disabled = false;
        };
        grid.appendChild(btn);
      });
    }

    // ============================
    // 📡 API & LOGIC
    // ============================
    async function fetchUserData(){
      try {
        const url = `${GAS_URL}?action=getUserInfo&id=${encodeURIComponent(myId)}&_=${Date.now()}`;
        const res = await fetch(url);
        const data = await res.json();
        if(data.result === "success"){
          myWallet = Number(data.balance||0);
          $("myBalance").innerHTML = myWallet.toLocaleString() + " <span>UT</span>";
        }
      } catch(e){ console.error(e); }
    }

    async function fetchGameState(){
      if(isBettingProcessing) return; // 배팅중엔 동기화 스킵
      try {
        const url = `${GAS_URL}?action=getRouletteState&_=${Date.now()}`;
        const res = await fetch(url);
        const data = await res.json();
        if(data.result !== "success") return;

        // 시간 동기화
        if(data.serverTs) serverOffsetMs = data.serverTs - Date.now();
        if(data.nextRoundAtMs) serverNextRoundAtMs = data.nextRoundAtMs;

        // 라운드 변경 감지
        const newKey = String(data.roundKey || "");
        if(currentRoundKey && newKey !== currentRoundKey){
          // 라운드 바뀜 -> 결과 확인 로직 (간단히 리로드 유도하거나 모달 띄움)
          if(!$("modalResult").classList.contains("active")) checkResult(currentRoundKey);
        }
        currentRoundKey = newKey;
        safeText("roundBadge", `ROUND ${newKey.slice(-5)}`); // HH:mm 표시

        // 참가자 & 지분 데이터
        gameState.participants = (data.participants||[]).map(p => ({
          name: p.name,
          amount: Number(p.amount||0),
          color: p.color || "#fff"
        })).sort((a,b)=>b.amount - a.amount);

        gameState.totalPool = gameState.participants.reduce((acc,p)=>acc+p.amount,0);
        safeText("poolDisplay", gameState.totalPool.toLocaleString() + " UT");

        updateListUI();

        // 지난 우승자 Marquee
        if(data.lastWinner && data.lastWinner.name){
          const w = data.lastWinner;
          $("marqueeText").innerText = `🏆 이전 라운드 승자: ${w.name} (${w.prize.toLocaleString()} UT) 🏆`;
        }

      } catch(e){ console.error(e); }
    }

    function updateListUI(){
      const list = $("participantList");
      list.innerHTML = "";
      gameState.participants.forEach(p => {
        const row = document.createElement("div");
        row.className = "p-row";
        row.innerHTML = `
          <div class="p-dot" style="background:${p.color}; box-shadow:0 0 8px ${p.color}"></div>
          <div class="p-name">${p.name === myId ? `<span style="color:${myColor}">[ME]</span> ` : ''}${p.name}</div>
          <div class="p-amt">${p.amount.toLocaleString()}</div>
        `;
        list.appendChild(row);
      });
    }

    // ============================
    // 🎮 ACTIONS
    // ============================
    function setBet(val) { $("inpBet").value = val; }
    
    $("btnMin").onclick = () => setBet(MIN_BET);
    $("btnM100").onclick = () => {
      let v = parseInt($("inpBet").value) - BET_UNIT;
      setBet(v < MIN_BET ? MIN_BET : v);
    };
    $("btnP100").onclick = () => {
      let v = parseInt($("inpBet").value) + BET_UNIT;
      setBet(v > myWallet ? myWallet : v);
    };
    $("btnMax").onclick = () => setBet(Math.floor(myWallet / 100) * 100); // 100단위 끊기

    $("btnJoin").onclick = async () => {
      if(isLocked) return alert("현재 배팅이 마감되었습니다.");
      const amount = parseInt($("inpBet").value);
      if(amount > myWallet) return alert("잔액이 부족합니다.");
      if(amount < MIN_BET) return alert(`최소 배팅액은 ${MIN_BET} UT 입니다.`);

      isBettingProcessing = true;
      const btn = $("btnJoin");
      const orgTxt = btn.innerText;
      btn.disabled = true; btn.innerText = "처리중...";

      try {
        const url = `${GAS_URL}?action=rouletteResult&type=bet&id=${encodeURIComponent(myId)}&amount=${amount}&color=${encodeURIComponent(myColor)}&_=${Date.now()}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if(data.result === "success"){
          myWallet = data.newBalance;
          $("myBalance").innerHTML = myWallet.toLocaleString() + " <span>UT</span>";
          alert("배팅 성공!");
          fetchGameState(); // 즉시 갱신
        } else {
          alert("배팅 실패: " + data.msg);
        }
      } catch(e){ alert("통신 오류"); }
      
      isBettingProcessing = false;
      btn.disabled = false; btn.innerText = orgTxt;
    };

    $("btnColorConfirm").onclick = () => {
      if(!myColor) return;
      localStorage.setItem(`rouletteColor_${myId}`, myColor);
      $("modalColor").classList.remove("active");
    };

    $("btnCloseResult").onclick = () => {
      $("modalResult").classList.remove("active");
      location.reload(); // 새 라운드를 위해 상쾌하게 리로드
    };

    // 결과 확인 (서버에서 가져오기)
    async function checkResult(roundKey){
      // (간략화) 서버에 lastWinner가 떴는지 반복 체크 후 모달 표시
      // 실제로는 fetchGameState안에서 lastWinner가 내 라운드와 맞는지 보고 띄움
      $("modalResult").classList.add("active");
      $("resWinnerName").innerText = "확인 중...";
      
      // 잠시 후 다시 로드해서 결과 표시 (fetchGameState가 해줌)
      setTimeout(async ()=>{
        await fetchGameState();
        const mq = $("marqueeText").innerText;
        if(mq.includes("승자")){
           // Marquee 텍스트 파싱해서 보여주거나 서버 데이터 이용
           $("resMsg").innerText = "결과가 집계되었습니다.";
           // (상세 내용은 marqueeText 참고하거나 별도 API 호출)
           $("resWinnerName").innerText = mq; 
        }
      }, 3000);
    }

    // ============================
    // ⏱ TIMER & LOOP
    // ============================
    function startTimer(){
      setInterval(() => {
        if(!serverNextRoundAtMs) return;
        const now = Date.now() + serverOffsetMs;
        const diff = Math.floor((serverNextRoundAtMs - now)/1000);
        
        const safeDiff = diff > 0 ? diff : 0;
        const mm = Math.floor(safeDiff / 60);
        const ss = safeDiff % 60;
        
        const tDisp = $("timerDisplay");
        tDisp.innerText = `${mm}:${ss<10?'0'+ss:ss}`;

        // 마감 1분전 (60초)
        if(safeDiff <= 60 && !isLocked){
          isLocked = true;
          $("btnJoin").disabled = true;
          $("btnJoin").innerText = "배팅 마감 (CLOSED)";
          tDisp.classList.add("urgent");
          speak("Betting Closed");
        }
        
        // 마지막 10초 카운트다운 & 음성
        if(safeDiff <= 10 && safeDiff > 0){
          const c = $("centerCount");
          c.innerText = safeDiff;
          c.classList.add("active");
          speak(String(safeDiff));
        } else {
          $("centerCount").classList.remove("active");
        }

        if(safeDiff === 0 && currentRoundKey && !$("modalResult").classList.contains("active")){
           // 라운드 종료 -> 서버 집계 기다림
           checkResult(currentRoundKey);
        }

      }, 1000);
    }

    // ============================
    // 🎡 CANVAS RENDERING
    // ============================
    function drawWheel(){
      const cvs = $("canvas");
      const ctx = cvs.getContext("2d");
      
      // Resize
      const w = cvs.clientWidth;
      const h = cvs.clientHeight;
      cvs.width = w; cvs.height = h;

      ctx.clearRect(0,0,w,h);

      // Wheel Setting
      const cx = 0; // 왼쪽 벽에 붙음
      const cy = h/2;
      const r = h * 0.9; // 화면 꽉 차게

      // Rotation
      gameState.rotation += (WHEEL_RPM * Math.PI / 1800); // 느린 회전

      const total = gameState.totalPool;
      let startAngle = gameState.rotation;

      if(total > 0){
        gameState.participants.forEach(p => {
          const slice = (p.amount / total) * 2 * Math.PI;
          const endAngle = startAngle + slice;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = p.color;
          ctx.fill();
          
          // Slice Border
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.stroke();

          // Text (ID) - 원 안쪽에 그리기
          if(slice > 0.1){
             const mid = startAngle + slice/2;
             const tx = cx + Math.cos(mid) * (r*0.8);
             const ty = cy + Math.sin(mid) * (r*0.8);
             
             ctx.save();
             ctx.translate(tx, ty);
             ctx.rotate(mid);
             ctx.fillStyle = "#fff";
             ctx.font = "bold 14px sans-serif";
             ctx.shadowColor="black"; ctx.shadowBlur=4;
             ctx.fillText(p.name.substring(0,6), 0, 0);
             ctx.restore();
          }

          startAngle = endAngle;
        });
      } else {
        // Empty Wheel
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = "#222";
        ctx.fill();
        ctx.strokeStyle = "#444";
        ctx.stroke();
      }

      // Wheel Gloss/Shadow (Overlay)
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fillStyle = "radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent)";
      ctx.fill();

      // Border Ring
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(255,215,0,0.5)"; // Gold Ring
      ctx.stroke();

      requestAnimationFrame(drawWheel);
    }

    // ============================
    // 🚀 INIT
    // ============================
    window.onload = async () => {
      const p = new URLSearchParams(location.search);
      myId = p.get("id") || "TestUser"; // 실제 연동시 수정

      if(!myId) return alert("ID가 필요합니다.");
      
      const savedC = localStorage.getItem(`rouletteColor_${myId}`);
      if(savedC){
        myColor = savedC;
      } else {
        initColorPicker();
        $("modalColor").classList.add("active");
      }

      await fetchUserData();
      await fetchGameState();
      
      setInterval(fetchGameState, 2000); // 2초마다 갱신
      startTimer();
      drawWheel();
    };
  </script>
