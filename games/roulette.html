<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: ROYAL CASINO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    :root{
      --bg-dark: #090909;
      --bg-panel: rgba(20, 20, 20, 0.90);
      --gold-1: #ffd700;
      --gold-2: #bf953f;
      --gold-3: #fbf5b7;
      --gold-4: #aa771c; /* Antique Gold */
      --text-main: #ffffff;
      --danger: #ff0044;
    }

    /* 폰트: 카지노 느낌의 명조/세리프 계열 or 깔끔한 고딕 */
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-dark);
      /* 고급스러운 가죽 질감 배경 패턴 */
      background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
      color: var(--text-main);
      font-family: 'Cinzel', serif, system-ui; /* 없다면 시스템 폰트 */
      overflow: hidden;
    }

    /* 상단 전광판 */
    .marquee-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 40px;
      background: linear-gradient(to bottom, #333, #111);
      border-bottom: 2px solid var(--gold-4);
      display: flex; align-items: center; z-index: 100;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .marquee-text {
      width: 100%; text-align: center;
      font-weight: 700; color: var(--gold-1);
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
      font-size: 14px; letter-spacing: 1px;
    }

    /* 레이아웃: 캔버스(배경) + UI(오버레이) */
    .layout {
      position: fixed; top: 40px; bottom: 0; left: 0; right: 0;
      display: flex;
    }

    /* CANVAS AREA */
    .stage {
      position: relative;
      flex: 1; height: 100%;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* 포인터 (왼쪽 배치) */
    .pointer-container {
      position: absolute;
      right: 20px; /* 휠이 오른쪽에 있으므로 포인터는 휠의 왼쪽면(화면 중앙쯤)을 가리켜야 함... 
                      아니, "휠 중심이 오른쪽"이면 휠의 왼쪽 가장자리가 보임. 
                      따라서 포인터는 화면 중앙~오른쪽 사이에 위치해야 함. 
                      아래 JS에서 휠 위치 잡고, CSS로 포인터 위치 잡음. */
      top: 50%; transform: translateY(-50%);
      z-index: 50;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
    }
    /* 실제 포인터 모양 (금속 팁 + 가죽 몸통) */
    .pointer-body {
      width: 60px; height: 14px;
      background: linear-gradient(to right, #8b0000, #300000);
      border: 1px solid #ffcc00;
      border-radius: 4px;
    }
    .pointer-tip {
      width: 0; height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 20px solid var(--gold-1); /* 오른쪽을 가리킴 */
      position: absolute; right: -18px; top: 50%;
      transform: translateY(-50%);
      filter: drop-shadow(0 0 5px var(--gold-1));
    }

    /* 중앙 카운트다운 */
    .countdown-box {
      position: absolute; top: 50%; left: 100px; /* 왼쪽에 배치 */
      transform: translateY(-50%);
      text-align: center; pointer-events: none; z-index: 40;
    }
    .cd-num {
      font-size: 80px; font-weight: 900; color: var(--danger);
      text-shadow: 0 0 20px rgba(255,0,0,0.8);
      font-variant-numeric: tabular-nums;
      opacity: 0; transition: transform 0.2s;
    }
    .cd-num.active { opacity: 1; transform: scale(1.2); }

    /* RIGHT SIDE PANEL (UI) */
    .ui-panel {
      width: 380px;
      background: var(--bg-panel);
      border-left: 2px solid var(--gold-4);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      display: flex; flex-direction: column;
      z-index: 60;
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .ui-panel { width: 100%; height: 40%; border-left: none; border-top: 2px solid var(--gold-4); }
      .stage { height: 60%; }
      .countdown-box { left: 50%; top: 20%; transform: translate(-50%, -50%); }
    }

    /* HUD Elements */
    .hud-row {
      padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .label { font-size: 11px; color: #888; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .value-lg { font-size: 24px; font-weight: 900; color: var(--gold-1); }
    .timer { font-size: 20px; font-weight: 700; color: #fff; font-family: monospace; }
    .timer.alert { color: var(--danger); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }

    /* List */
    .list-wrap { flex: 1; overflow-y: auto; padding: 10px; }
    .rank-item {
      display: flex; align-items: center; padding: 8px;
      margin-bottom: 5px; background: rgba(255,255,255,0.03); border-radius: 6px;
      border: 1px solid transparent;
    }
    .rank-item.me { border-color: var(--gold-2); background: rgba(255,215,0,0.1); }
    .p-col { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; border: 1px solid rgba(255,255,255,0.3); }
    .p-name { flex: 1; font-size: 13px; font-weight: 600; color: #ddd; }
    .p-amt { font-size: 13px; color: var(--gold-1); font-weight: 700; }

    /* Controls */
    .ctrl-area { padding: 15px; background: rgba(0,0,0,0.5); }
    .bet-inputs {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px;
    }
    .btn-chip {
      background: linear-gradient(to bottom, #444, #222);
      border: 1px solid #555; color: #fff; border-radius: 4px;
      height: 40px; font-size: 11px; font-weight: 700; cursor: pointer;
      box-shadow: 0 2px 0 #000;
    }
    .btn-chip:active { transform: translateY(2px); box-shadow: none; }
    .inp-amt {
      background: #111; border: 1px solid var(--gold-4); color: var(--gold-1);
      text-align: center; font-size: 14px; font-weight: 700; border-radius: 4px;
    }
    
    .btn-main {
      width: 100%; height: 50px; border: none; border-radius: 6px;
      background: linear-gradient(to bottom, var(--gold-2), var(--gold-4));
      color: #000; font-size: 18px; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 0 #664400; text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      transition: filter 0.2s;
    }
    .btn-main:hover { filter: brightness(1.1); }
    .btn-main:active { transform: translateY(4px); box-shadow: none; }
    .btn-main:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

    /* Modal */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
      display: none; justify-content: center; align-items: center;
      backdrop-filter: blur(5px);
    }
    .modal-mask.on { display: flex; }
    .modal-body {
      width: 90%; max-width: 400px; background: #1a1a1a;
      border: 2px solid var(--gold-2); border-radius: 12px; padding: 20px;
      text-align: center; box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
    }
    .color-opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
    .c-pick { height: 40px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
    .c-pick.sel { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px #fff; }
    
  </style>
</head>
<body>

  <div class="marquee-wrap">
    <div class="marquee-text" id="mqText">♠ ROYAL CASINO에 오신 것을 환영합니다 ♠</div>
  </div>

  <div class="layout">
    <div class="stage">
      <canvas id="cvs"></canvas>
      
      <div id="pointer" class="pointer-container">
        <div class="pointer-body"></div>
        <div class="pointer-tip"></div>
      </div>

      <div class="countdown-box">
        <div id="cdNum" class="cd-num"></div>
      </div>
    </div>

    <aside class="ui-panel">
      <div class="hud-row">
        <div>
          <div class="label">TOTAL POOL</div>
          <div class="value-lg" id="poolDisp">0</div>
        </div>
        <div style="text-align:right;">
          <div class="label">TIME LEFT</div>
          <div class="timer" id="timerDisp">--:--</div>
        </div>
      </div>

      <div class="list-wrap" id="pList">
        <div style="text-align:center; padding:20px; color:#555;">대기 중...</div>
      </div>

      <div class="ctrl-area">
        <div class="bet-inputs">
          <button class="btn-chip" id="bMin">MIN</button>
          <button class="btn-chip" id="bM100">-100</button>
          <input type="number" id="inpBet" class="inp-amt" value="100" readonly />
          <button class="btn-chip" id="bP100">+100</button>
          <button class="btn-chip" id="bMax">MAX</button>
        </div>
        <button id="bJoin" class="btn-main">BET NOW</button>
        <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:#aaa;">
          <span>MY WALLET</span>
          <span style="color:#fff; font-weight:700;" id="myBal">Loading...</span>
        </div>
      </div>
    </aside>
  </div>

  <div id="mdColor" class="modal-mask">
    <div class="modal-body">
      <h2 style="color:var(--gold-1); margin:0;">SELECT COLOR</h2>
      <p style="color:#888; font-size:12px;">당신의 행운 컬러를 선택하세요.</p>
      <div class="color-opts" id="cGrid"></div>
      <button id="bColorOk" class="btn-main" disabled style="height:40px; font-size:14px;">CONFIRM</button>
    </div>
  </div>

  <div id="mdRes" class="modal-mask">
    <div class="modal-body">
      <h2 style="color:var(--gold-1); font-size:28px; margin:0;">RESULT</h2>
      <div style="color:#aaa; font-size:12px; margin-top:10px;">WINNER</div>
      <div id="resName" style="font-size:32px; font-weight:900; color:#fff; margin:5px 0;">-</div>
      <div id="resAmt" style="font-size:20px; color:var(--gold-2); font-weight:700;">-</div>
      <div id="resDesc" style="margin-top:15px; color:#ccc; font-size:14px;"></div>
      <button id="bResClose" class="btn-main" style="margin-top:20px; background:#333; color:#fff; box-shadow:none;">NEXT ROUND</button>
    </div>
  </div>

  <script>
    // ============================================
    // ⚙️ 설정 & 상태
    // ============================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";
    const MIN_BET = 100;
    
    // 리얼한 휠 회전 (매우 느리고 묵직하게)
    const RPM = 0.8; 

    let myId = "", myWallet = 0, myColor = null;
    let roundKey = null, participants = [], totalPool = 0;
    let rotation = 0;
    let isLocked = false, isBetting = false;

    // 서버 시간 동기화
    let serverOffset = 0, nextRoundMs = 0;

    const synth = window.speechSynthesis;
    const colors = [
      '#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6',
      '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000', '#aaffc3'
    ];

    // ============================================
    // 🛠 유틸
    // ============================================
    const $ = (id) => document.getElementById(id);
    const toMoney = (n) => Number(n).toLocaleString();

    function speak(txt){
      if(!synth) return;
      if(synth.speaking) synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'en-US';
      synth.speak(u);
    }

    // ============================================
    // 🎨 캔버스 드로잉 (하이퀄리티)
    // ============================================
    function draw() {
      const cvs = $("cvs");
      const ctx = cvs.getContext("2d");
      
      const w = cvs.clientWidth;
      const h = cvs.clientHeight;
      if(cvs.width !== w || cvs.height !== h){
        cvs.width = w; cvs.height = h;
      }

      ctx.clearRect(0, 0, w, h);

      // 1. 휠 위치 계산 (중심을 오른쪽 화면 밖으로)
      // 화면 너비의 90% 지점이 중심. 반지름은 높이의 80% 정도
      const r = h * 0.85; 
      const cx = w + (r * 0.2); // 중심을 오른쪽으로 밀어냄
      const cy = h / 2;

      // 포인터 위치 동기화 (휠의 왼쪽 가장자리)
      // 실제 포인터 DOM 위치를 여기서 계산하지 않고 CSS로 잡되, 
      // 휠의 왼쪽 끝 좌표: cx - r
      // 포인터는 대략 이 위치에 있어야 함.
      // (CSS right:20px 등 사용했으므로 시각적으로 맞춤)

      // 회전값 업데이트
      rotation += (RPM * Math.PI / 1800); 

      // 2. 휠 본체 (나무 질감 베이스)
      // 바깥 림 (골드)
      const gradRim = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
      gradRim.addColorStop(0, '#ffd700');
      gradRim.addColorStop(0.2, '#aa771c');
      gradRim.addColorStop(0.4, '#ffffaa');
      gradRim.addColorStop(0.6, '#aa771c');
      gradRim.addColorStop(1, '#ffd700');

      ctx.beginPath();
      ctx.arc(cx, cy, r + 15, 0, Math.PI*2);
      ctx.fillStyle = gradRim;
      ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.fill();
      ctx.shadowBlur = 0; // 리셋

      // 안쪽 우드 텍스처 (진한 갈색)
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fillStyle = '#2a1a10'; // Dark Wood
      ctx.fill();

      // 3. 파이 조각 (Slices)
      let startAng = rotation;
      const total = totalPool || 1; // 0 방지

      if(participants.length > 0) {
        participants.forEach(p => {
          const slice = (p.amount / total) * 2 * Math.PI;
          const endAng = startAng + slice;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r - 10, startAng, endAng);
          ctx.fillStyle = p.color;
          ctx.fill();

          // 조각 경계선 (금색)
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(255, 215, 0, 0.5)";
          ctx.stroke();

          // 텍스트 (ID, 금액) - 중요!!
          // 조각이 너무 작으면 생략
          if(slice > 0.08) {
            const mid = startAng + slice/2;
            const tx = cx + Math.cos(mid) * (r * 0.75); // 텍스트 위치 (반지름의 75% 지점)
            const ty = cy + Math.sin(mid) * (r * 0.75);

            ctx.save();
            ctx.translate(tx, ty);
            // 텍스트 회전: 휠 중심을 바라보게 (mid + PI)
            ctx.rotate(mid + Math.PI); 

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // ID
            ctx.fillStyle = "#fff";
            ctx.shadowColor="black"; ctx.shadowBlur=4;
            ctx.font = "bold 16px sans-serif";
            let dName = p.name;
            if(dName.length > 8) dName = dName.slice(0,6)+"..";
            ctx.fillText(dName, 0, -8);

            // 금액
            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 12px monospace";
            ctx.fillText(toMoney(p.amount), 0, 10);

            ctx.restore();
          }

          startAng = endAng;
        });
      } else {
        // 데이터 없을 때 빈 화면
        ctx.beginPath();
        ctx.arc(cx, cy, r-10, 0, Math.PI*2);
        ctx.fillStyle = "#111";
        ctx.fill();
      }

      // 4. 중앙 장식 (Center Cap) - 휠의 중심
      // 3D 금속 느낌
      const capR = r * 0.15;
      const gradCap = ctx.createRadialGradient(cx, cy, 0, cx, cy, capR);
      gradCap.addColorStop(0, '#fff');
      gradCap.addColorStop(0.3, '#ffd700');
      gradCap.addColorStop(1, '#aa771c');

      ctx.beginPath();
      ctx.arc(cx, cy, capR, 0, Math.PI*2);
      ctx.fillStyle = gradCap;
      ctx.shadowBlur = 15; ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.fill();
      ctx.shadowBlur = 0;

      // 휠 안쪽 테두리 하이라이트
      ctx.beginPath();
      ctx.arc(cx, cy, r-10, 0, Math.PI*2);
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.stroke();

      requestAnimationFrame(draw);
    }

    // ============================================
    // 📡 데이터 통신
    // ============================================
    async function api(act, params={}){
      const qs = new URLSearchParams({ action: act, ...params, _:Date.now() });
      const res = await fetch(GAS_URL + "?" + qs);
      return await res.json();
    }

    async function updateState(){
      if(isBetting) return;
      try {
        const d = await api("getRouletteState");
        if(d.result !== "success") return;

        if(d.serverTs) serverOffset = d.serverTs - Date.now();
        if(d.nextRoundAtMs) nextRoundMs = d.nextRoundAtMs;

        const nk = String(d.roundKey);
        if(roundKey && nk !== roundKey && !$("mdRes").classList.contains("on")){
          // 라운드 바뀜 -> 결과 확인
          checkResult(roundKey);
        }
        roundKey = nk;

        // 참여자 매핑
        participants = (d.participants||[]).map(p => ({
          name: p.name,
          amount: Number(p.amount),
          color: p.color || "#ccc"
        })).sort((a,b)=>b.amount-a.amount);

        totalPool = participants.reduce((a,c)=>a+c.amount, 0);
        $("poolDisp").innerText = toMoney(totalPool) + " UT";

        renderList();

        // 전광판
        if(d.lastWinner){
           const w = d.lastWinner;
           $("mqText").innerText = `🏆 이전 승자: ${w.name} - 상금 ${toMoney(w.prize)} UT 🏆`;
        }

      } catch(e){ console.error(e); }
    }

    function renderList(){
      const el = $("pList");
      el.innerHTML = "";
      participants.forEach(p => {
        const div = document.createElement("div");
        div.className = `rank-item ${p.name===myId ? 'me':''}`;
        div.innerHTML = `
          <div class="p-col" style="background:${p.color}; box-shadow:0 0 5px ${p.color}"></div>
          <div class="p-name">${p.name}</div>
          <div class="p-amt">${toMoney(p.amount)}</div>
        `;
        el.appendChild(div);
      });
    }

    async function checkResult(targetKey){
      $("mdRes").classList.add("on");
      $("resName").innerText = "집계 중...";
      $("resAmt").innerText = "";
      $("resDesc").innerText = "서버 결과를 확인하고 있습니다.";

      // 3초 후 재조회
      setTimeout(async () => {
        await updateState();
        const mq = $("mqText").innerText;
        if(mq.includes("승자")){
          $("resName").innerText = mq.split(":")[1].split("-")[0].trim();
          $("resDesc").innerText = "축하합니다! (혹은 아쉽네요)";
        } else {
           $("resName").innerText = "???";
        }
      }, 3000);
    }

    // ============================================
    // 🎮 액션 & 타이머
    // ============================================
    $("bJoin").onclick = async () => {
      if(isLocked) return alert("배팅이 마감되었습니다.");
      const amt = Number($("inpBet").value);
      if(amt > myWallet) return alert("잔액 부족");
      if(amt < MIN_BET) return alert("최소 금액 부족");

      isBetting = true;
      const btn = $("bJoin");
      const old = btn.innerText;
      btn.innerText = "처리 중..."; btn.disabled = true;

      try {
        const r = await api("rouletteResult", {
          type: "bet", id: myId, amount: amt, color: myColor
        });
        if(r.result==="success"){
           myWallet = r.newBalance;
           $("myBal").innerText = toMoney(myWallet) + " UT";
           alert("참여 완료!");
           updateState();
        } else {
           alert(r.msg);
        }
      } catch(e){ alert("오류 발생"); }
      
      isBetting = false;
      btn.innerText = old; btn.disabled = false;
    };

    function startTimer(){
      setInterval(() => {
        if(!nextRoundMs) return;
        const now = Date.now() + serverOffset;
        let diff = Math.floor((nextRoundMs - now)/1000);
        if(diff < 0) diff = 0;

        const mm = Math.floor(diff/60);
        const ss = diff % 60;
        const disp = $("timerDisp");
        disp.innerText = `${mm}:${ss<10?'0'+ss:ss}`;

        if(diff <= 60 && !isLocked) {
          isLocked = true;
          $("bJoin").disabled = true;
          $("bJoin").innerText = "마감 (CLOSED)";
          disp.classList.add("alert");
          speak("Betting Closed");
        }

        const cd = $("cdNum");
        if(diff <= 10 && diff > 0){
           cd.innerText = diff;
           cd.classList.add("active");
           speak(String(diff));
        } else {
           cd.classList.remove("active");
           cd.innerText = "";
        }
      }, 1000);
    }

    // 배팅 컨트롤
    const setB = v => $("inpBet").value = v;
    $("bMin").onclick = ()=> setB(MIN_BET);
    $("bMax").onclick = ()=> setB(Math.floor(myWallet/100)*100);
    $("bM100").onclick = ()=> { let v=Number($("inpBet").value)-100; if(v<MIN_BET)v=MIN_BET; setB(v); };
    $("bP100").onclick = ()=> { let v=Number($("inpBet").value)+100; if(v>myWallet)v=myWallet; setB(v); };

    // 컬러 선택
    $("bColorOk").onclick = () => {
      if(!myColor) return;
      localStorage.setItem("myColor_"+myId, myColor);
      $("mdColor").classList.remove("on");
    };
    $("bResClose").onclick = () => {
      $("mdRes").classList.remove("on");
      location.reload();
    };

    // 초기화
    window.onload = async () => {
      const p = new URLSearchParams(location.search);
      myId = p.get("id") || "Guest"; 

      if(myId === "Guest") alert("ID 파라미터가 없습니다. 테스트 모드입니다.");

      // 컬러 팝업
      const svC = localStorage.getItem("myColor_"+myId);
      if(svC) { myColor = svC; }
      else {
        const grid = $("cGrid");
        colors.forEach(c => {
          const d = document.createElement("div");
          d.className = "c-pick";
          d.style.backgroundColor = c;
          d.onclick = () => {
            document.querySelectorAll(".c-pick").forEach(e=>e.classList.remove("sel"));
            d.classList.add("sel");
            myColor = c;
            $("bColorOk").disabled = false;
          }
          grid.appendChild(d);
        });
        $("mdColor").classList.add("on");
      }

      // 내 정보 로드
      try {
        const u = await api("getUserInfo", {id: myId});
        if(u.result==="success") myWallet = u.balance;
        $("myBal").innerText = toMoney(myWallet) + " UT";
      } catch(e){}

      await updateState();
      setInterval(updateState, 2000);
      startTimer();
      draw(); // 캔버스 루프 시작
    };
  </script>
</body>
</html>
