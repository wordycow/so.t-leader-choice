<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-dark:#050508;
      --panel-bg:rgba(12,14,20,.95);
      --gold-1:#ffd700; --gold-2:#d4af37;
      --accent:#00f0ff;
      --danger:#ff0044;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg-dark);color:#fff;font-family:'Cinzel',serif}

    body{
      background-image: radial-gradient(circle at 70% 40%, #150a20 0%, #000000 90%);
      overflow:hidden;
    }
    @media (max-width:1023px){
      body{overflow-y:auto; overflow-x:hidden;}
    }

    /* ===== Top Marquee ===== */
    .marquee-wrap{
      position:sticky; top:0; z-index:300;
      width:100%; height:40px; display:flex; align-items:center;
      background:rgba(0,0,0,.95);
      border-bottom:1px solid rgba(255,215,0,.2);
      overflow:hidden;
    }
    .marquee-content{display:flex; animation:scroll 60s linear infinite;}
    .marquee-text{
      white-space:nowrap;
      font-weight:700; color:var(--gold-2); font-size:14px; letter-spacing:2px;
      padding:0 60px;
      text-shadow:0 0 5px rgba(0,0,0,.8);
    }
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

    /* ===== Stage (wheel area) ===== */
    .stage{
      position:fixed;
      top:40px; left:0; bottom:0;
      right:420px; /* PC: right panel width */
      z-index:0;
      overflow:hidden;
    }
    @media (max-width:1023px){
      .stage{
        position:relative;
        top:auto; left:auto; right:auto; bottom:auto;
        width:100%;
        height:520px; /* 모바일: 여기 안에서 원형 유지 */
        margin-top:0;
      }
    }

    canvas{
      position:absolute; inset:0;
      width:100%; height:100%;
      display:block;
    }

    /* ===== Pointer (same PC/Mobile) ===== */
    .pointer-wrap{
      position:absolute;
      z-index:50;
      filter: drop-shadow(0 0 18px rgba(255, 200, 0, .65));
      pointer-events:none;
    }
    .pointer-real{
      width:0; height:0;
      border-left:18px solid transparent;
      border-right:18px solid transparent;
      border-bottom:26px solid var(--gold-1); /* downward triangle */
      filter: drop-shadow(0 0 10px rgba(255,215,0,.45));
    }

    /* ===== Countdown center ===== */
    .countdown-box{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      z-index:60;
    }
    .cd-num{
      font-family:'Playfair Display',serif;
      font-weight:900;
      font-size:180px;
      letter-spacing:2px;
      opacity:0;
      transform:scale(.98);
      color:#fff;
      -webkit-text-stroke:4px rgba(255,215,0,.45);
      text-shadow:0 0 50px rgba(255,215,0,.35), 0 0 24px rgba(255,0,68,.25);
      transition:opacity .12s, transform .12s;
    }
    .cd-num.on{opacity:1; transform:scale(1.02);}
    .cd-num.blink{animation:blink .5s infinite alternate;}
    @keyframes blink{from{opacity:1}to{opacity:.25}}

    /* ===== Music Bar (PC fixed) ===== */
    .music-bar{
      position:fixed;
      top:52px; left:18px;
      z-index:400;
      display:flex; align-items:center; gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(18,18,26,.75);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      box-shadow:0 10px 30px rgba(0,0,0,.75);
      max-width:520px;
    }
    .mb-btn{
      width:40px; height:40px;
      border-radius:50%;
      border:0;
      background:rgba(255,255,255,.06);
      color:#ddd;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:18px;
      transition:.15s;
    }
    .mb-btn:hover{background:rgba(255,255,255,.14); transform:scale(1.06); color:#fff}
    .track{
      display:flex; flex-direction:column; gap:2px;
      min-width:140px;
      line-height:1.05;
    }
    .track .t1{font-weight:900; color:var(--gold-1); font-size:14px; letter-spacing:1px;}
    .track .t2{font-weight:700; color:#b9b9c6; font-size:12px; font-family:monospace;}
    .vol{
      display:flex; align-items:center; gap:10px;
      margin-left:6px;
      color:#cfcfe0; font-weight:800; font-size:12px; letter-spacing:1px;
    }
    .vol input[type="range"]{width:140px}
    .music-bar-inline{display:none;}

    @media (max-width:1023px){
      #musicBarPC{display:none;}
      .music-bar-inline{
        display:flex;
        position:relative;
        top:auto; left:auto;
        width:100%;
        margin-top:14px;
        max-width:none;
      }
      .music-bar-inline .vol input[type="range"]{width:120px}
    }

    /* ===== UI Panel ===== */
    .ui-container{
      position:fixed;
      top:40px; right:0; bottom:0;
      width:420px;
      z-index:200;
      display:flex; flex-direction:column;
      background:var(--panel-bg);
      border-left:1px solid rgba(255,215,0,.25);
      box-shadow:-10px 0 80px rgba(0,0,0,.9);
      backdrop-filter: blur(18px);
    }
    @media (max-width:1023px){
      .ui-container{
        position:relative;
        top:auto; right:auto; bottom:auto;
        width:100%;
        min-height: calc(100vh - 40px);
        border-left:none;
        border-top:1px solid rgba(255,215,0,.25);
        background:#050508;
      }
    }

    .hud-row{
      padding:20px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex; justify-content:space-between; align-items:center;
    }
    .label{
      font-size:11px; color:#888; font-weight:800;
      letter-spacing:2px; text-transform:uppercase;
    }
    .value-lg{font-size:32px; font-weight:900; color:var(--gold-1);}
    .timer{font-size:26px; font-weight:800; color:#fff; font-family:monospace;}
    .timer.alert{color:var(--danger); text-shadow:0 0 18px rgba(255,0,68,.35);}

    .ctrl-area{padding:22px 20px; background:rgba(0,0,0,.45);}
    .bet-inputs{
      display:grid;
      gap:10px;
      grid-template-columns: repeat(5, 1fr);
      grid-template-areas: "min m100 amt p100 max";
      align-items:center;
      margin-bottom:14px;
    }
    #bMin{grid-area:min}
    #bM100{grid-area:m100}
    #inpBet{grid-area:amt}
    #bP100{grid-area:p100}
    #bMax{grid-area:max}

    @media (max-width:1023px){
      .bet-inputs{
        grid-template-columns: repeat(4, 1fr);
        grid-template-areas:
          "amt amt amt amt"
          "min m100 p100 max";
      }
    }

    .btn-chip{
      background: linear-gradient(180deg, #2a2a35, #14141a);
      border:1px solid #3b3b46;
      color:#d4d4dc;
      border-radius:12px;
      height:48px;
      font-weight:900;
      cursor:pointer;
      width:100%;
      transition:.12s;
    }
    .btn-chip:hover{border-color:rgba(255,215,0,.55); color:#fff; transform:translateY(-1px)}
    .inp-amt{
      height:48px;
      border-radius:12px;
      width:100%;
      text-align:center;
      font-size:18px;
      font-weight:900;
      color:var(--gold-1);
      background:#07070b;
      border:2px solid rgba(255,215,0,.55);
      outline:none;
    }

    /* Bet Button (keep effect, tune color to turntable vibe) */
    .action-btn{
      position:relative; overflow:hidden;
      border:0; padding:0;
      min-height:58px; width:100%;
      border-radius:999px;
      cursor:pointer;
      background: linear-gradient(90deg, #0b1020 0%, #1a213b 40%, #2b3a1f 100%);
      box-shadow: 0 14px 46px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08) inset;
      transition:.18s;
      display:flex; align-items:center; justify-content:center;
    }
    .action-btn::before{
      content:"";
      position:absolute; inset:-12px;
      background: conic-gradient(from 180deg,
        rgba(255,215,0,.85),
        rgba(0,240,255,.65),
        rgba(255,215,0,.9),
        rgba(0,240,255,.65),
        rgba(255,215,0,.85)
      );
      filter: blur(18px);
      opacity:.35;
      animation:spinGlow 3.2s linear infinite;
      pointer-events:none;
    }
    .action-btn::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.18) 28%, transparent 60%);
      transform: translateX(-140%);
      animation:shine 2.8s ease-in-out infinite;
      mix-blend-mode:screen;
      opacity:.85;
      pointer-events:none;
    }
    @keyframes spinGlow{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    @keyframes shine{
      0%{transform:translateX(-140%)}
      45%{transform:translateX(140%)}
      100%{transform:translateX(140%)}
    }
    .action-btn:hover{transform:translateY(-2px)}
    .action-btn:active{transform:translateY(0) scale(.995)}
    .action-btn:disabled{filter:grayscale(1) brightness(.55); cursor:not-allowed; animation:none}

    .unique-inner{
      position:relative; z-index:2;
      display:flex; align-items:center; justify-content:center;
      gap:10px;
      font-weight:900;
      font-size:20px;
      letter-spacing:2px;
      color:#fff;
    }
    .unique-logo-text{
      font-family:'Cinzel',serif;
      font-weight:900;
      letter-spacing:2px;
      background: linear-gradient(to bottom, #fff, #ffd700);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      filter: drop-shadow(0 0 6px rgba(255,215,0,.65));
    }

    .wallet-row{
      display:flex; justify-content:space-between;
      margin-top:16px;
      font-size:13px;
      color:#aaa;
      font-weight:700;
      letter-spacing:1px;
    }

    .list-wrap{flex:1; overflow-y:auto; padding:14px;}
    .rank-item{
      display:flex; align-items:center;
      padding:12px 14px;
      margin-bottom:8px;
      background: rgba(255,255,255,.04);
      border-radius:12px;
      border:1px solid rgba(255,255,255,.06);
    }
    .rank-item.me{
      background: linear-gradient(90deg, rgba(255,215,0,.13), transparent);
      border:1px solid rgba(255,215,0,.35);
    }
    .p-col{width:12px;height:12px;border-radius:50%;margin-right:12px;box-shadow:0 0 10px currentColor;}
    .p-name{flex:1;font-size:15px;font-weight:900;color:#e6e6ee;}
    .p-amt{font-size:15px;color:var(--gold-1);font-weight:900;}

    /* Hide old modals (not used) */
    .modal-mask{display:none !important;}
  </style>
</head>

<body>
  <div class="marquee-wrap">
    <div class="marquee-content">
      <span class="marquee-text" id="mqText1">💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎</span>
      <span class="marquee-text" id="mqText2">💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎</span>
    </div>
  </div>

  <!-- PC Music Bar -->
  <div class="music-bar" id="musicBarPC">
    <button class="mb-btn" data-act="prev" title="Prev">⏮</button>
    <button class="mb-btn" data-act="toggle" title="Play/Pause">▶</button>
    <button class="mb-btn" data-act="next" title="Next">⏭</button>

    <div class="track">
      <div class="t1" id="trackNamePC">ROYAL BGM</div>
      <div class="t2" id="trackIndexPC">0/0</div>
    </div>

    <div class="vol">
      <span>VOL</span>
      <input type="range" min="0" max="100" value="20" data-act="vol">
    </div>
  </div>

  <!-- Stage (Wheel) -->
  <div class="stage" id="stage">
    <canvas id="cvs"></canvas>
    <div id="pointer" class="pointer-wrap"><div class="pointer-real"></div></div>
    <div class="countdown-box"><div id="cdNum" class="cd-num"></div></div>
  </div>

  <!-- UI Panel -->
  <aside class="ui-container">
    <div class="hud-row">
      <div>
        <div class="label">TOTAL POOL</div>
        <div class="value-lg" id="poolDisp">0 UT</div>
      </div>
      <div style="text-align:right;">
        <div class="label">TIME LEFT</div>
        <div class="timer" id="timerDisp">--:--</div>
      </div>
    </div>

    <div class="ctrl-area">
      <div class="bet-inputs">
        <button class="btn-chip" id="bMin">MIN</button>
        <button class="btn-chip" id="bM100">-100</button>
        <input type="number" id="inpBet" class="inp-amt" value="100" readonly />
        <button class="btn-chip" id="bP100">+100</button>
        <button class="btn-chip" id="bMax">MAX</button>
      </div>

      <button id="bJoin" class="action-btn" type="button">
        <span class="unique-inner" id="btnText">
          <span class="unique-logo-text">UNIQUE</span>&nbsp;BET NOW
        </span>
      </button>

      <!-- Mobile Music Bar (under bet button) -->
      <div class="music-bar music-bar-inline" id="musicBarM">
        <button class="mb-btn" data-act="prev" title="Prev">⏮</button>
        <button class="mb-btn" data-act="toggle" title="Play/Pause">▶</button>
        <button class="mb-btn" data-act="next" title="Next">⏭</button>

        <div class="track" style="min-width:120px;">
          <div class="t1" id="trackNameM">ROYAL BGM</div>
          <div class="t2" id="trackIndexM">0/0</div>
        </div>

        <div class="vol">
          <span>VOL</span>
          <input type="range" min="0" max="100" value="20" data-act="vol">
        </div>
      </div>

      <div class="wallet-row">
        <span>MY WALLET</span>
        <span style="color:var(--gold-1); font-size:16px;" id="myBal">Loading...</span>
      </div>
    </div>

    <div class="list-wrap" id="pList">
      <div style="text-align:center; padding:30px; color:#555;">Waiting for bets...</div>
    </div>
  </aside>

  <!-- Playlist file (YOU SAID: MUST USE THIS) -->
  <script src="./roulette.playlist.js"></script>

  <div id="ytPlayer" style="display:none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const toMoney = (n) => Number(n || 0).toLocaleString();

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";
    const MIN_BET = 100;
    const ROUND_SEC = 20 * 60;        // 20분
    const BET_CLOSE_SEC = 60;         // 60초 남으면 베팅 종료
    const RESULT_HOLD_MS = 30000;     // 당첨 화면 정지 30초

    let myId = "";
    let myWallet = 0;

    let roundKey = null;
    let participants = [];
    let totalPool = 0;

    // draw states
    let rotation = 0;
    let wheelState = "SPINNING"; // SPINNING | FROZEN | RESULT
    let lastFrameTs = 0;

    // synced time
    let serverOffset = 0;
    let nextRoundMs = 0;

    // freeze snapshot for fairness at close
    let closedRoundKey = null;
    let frozenParticipants = null;
    let frozenTotalPool = 0;

    // winner info
    let pendingWinner = null; // {round,name,prize}
    let shownWinnerRound = null;

    // stable color (no modal)
    const colors = ['#ff0055','#ffdd00','#00ffaa','#00ccff','#ff4400','#aa00ff','#ffffff','#ff00aa','#ccff00','#0055ff'];
    function hashColor(id){
      let h=0; const s=String(id||"guest");
      for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))>>>0;
      return colors[h % colors.length];
    }
    let myColor = "#ff0055";

    // ===== YouTube Playlist (from roulette.playlist.js) =====
    const ytPlaylist = (window.UNIQUE_YT_PLAYLIST && window.UNIQUE_YT_PLAYLIST.length)
      ? window.UNIQUE_YT_PLAYLIST
      : ["-jdZKf-xSpA"]; // fallback (should never be used)

    let ytPlayer = null;
    let curVol = 20;
    let isPlaying = false;

    function onYouTubeIframeAPIReady(){
      ytPlayer = new YT.Player('ytPlayer', {
        height:'0', width:'0',
        playerVars:{
          autoplay:1,
          controls:0,
          loop:1,
          playlist: ytPlaylist.join(',')
        },
        events:{
          onReady: (e)=> {
            e.target.setVolume(curVol);
            e.target.playVideo();
            isPlaying = true;
            syncMusicUI();
            startTrackTicker();
          }
        }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function syncMusicUI(){
      document.querySelectorAll('[data-act="toggle"]').forEach(btn=>{
        btn.textContent = isPlaying ? "⏸" : "▶";
      });
      document.querySelectorAll('[data-act="vol"]').forEach(sl=>{
        if(Number(sl.value) !== curVol) sl.value = curVol;
      });
    }

    function setTrackText(name, idxText){
      if($("trackNamePC")) $("trackNamePC").textContent = name;
      if($("trackIndexPC")) $("trackIndexPC").textContent = idxText;
      if($("trackNameM")) $("trackNameM").textContent = name;
      if($("trackIndexM")) $("trackIndexM").textContent = idxText;
    }

    function startTrackTicker(){
      setInterval(()=>{
        if(!ytPlayer || !ytPlayer.getPlaylist || !ytPlayer.getPlaylistIndex) return;
        const list = ytPlayer.getPlaylist() || [];
        const idx = (ytPlayer.getPlaylistIndex() ?? 0);
        const total = list.length || ytPlaylist.length || 0;
        const n = String(idx+1).padStart(2,"0");
        setTrackText(`ROYAL BGM ${n}`, `${idx+1}/${total}`);
      }, 700);
    }

    function bindMusicControls(){
      document.querySelectorAll('[data-act="prev"]').forEach(btn=>{
        btn.onclick = ()=>{ if(ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo(); };
      });
      document.querySelectorAll('[data-act="next"]').forEach(btn=>{
        btn.onclick = ()=>{ if(ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo(); };
      });
      document.querySelectorAll('[data-act="toggle"]').forEach(btn=>{
        btn.onclick = ()=>{
          if(!ytPlayer || !ytPlayer.getPlayerState) return;
          const st = ytPlayer.getPlayerState();
          if(st === 1){ ytPlayer.pauseVideo(); isPlaying=false; }
          else { ytPlayer.playVideo(); isPlaying=true; }
          syncMusicUI();
        };
      });
      document.querySelectorAll('[data-act="vol"]').forEach(sl=>{
        sl.oninput = ()=>{
          curVol = Math.max(0, Math.min(100, Number(sl.value||0)));
          if(ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(curVol);
        };
      });

      // 모바일 자동재생 막힘 대응
      document.body.addEventListener('click', ()=>{
        if(ytPlayer && ytPlayer.playVideo){
          ytPlayer.playVideo(); isPlaying=true; syncMusicUI();
        }
      }, { once:true });
    }

    // ===== API =====
    async function api(act, p={}){
      const r = await fetch(GAS_URL + "?" + new URLSearchParams({action:act, ...p, _:Date.now()}));
      return await r.json();
    }

    function renderList(){
      const el = $("pList");
      el.innerHTML = "";
      (participants || []).forEach(p=>{
        el.innerHTML += `
          <div class="rank-item ${String(p.name).toLowerCase()===String(myId).toLowerCase() ? 'me':''}">
            <div class="p-col" style="background:${p.color};"></div>
            <div class="p-name">${p.name}</div>
            <div class="p-amt">${toMoney(p.amount)}</div>
          </div>
        `;
      });
      el.scrollTop = el.scrollHeight;
    }

    async function updateState(){
      // RESULT 상태에서도 서버 동기화는 하되, 화면 휠 참가자 스냅샷은 유지
      try{
        const d = await api("getRouletteState");
        if(d.result !== "success") return;

        if(d.serverTs) serverOffset = d.serverTs - Date.now();
        if(d.nextRoundAtMs) nextRoundMs = d.nextRoundAtMs;

        // roundKey update (active)
        const nk = String(d.roundKey || "");
        roundKey = nk;

        // participants (current round)
        const serverParts = (d.participants || []).map(p=>({
          name: p.name,
          amount: Number(p.amount||0),
          color: String(p.color||"#999")
        }));

        // lastWinner (prev settled)
        pendingWinner = d.lastWinner ? {
          round: String(d.lastWinner.round || ""),
          name: String(d.lastWinner.name || ""),
          prize: Number(d.lastWinner.prize || 0)
        } : null;

        // show in marquee
        const winTxt = pendingWinner ? `🏆 LAST WINNER: ${pendingWinner.name} (${toMoney(pendingWinner.prize)} UT) 🏆` : "";
        $("mqText1").innerHTML = `💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎 <span>${winTxt}</span>`;
        $("mqText2").innerHTML = $("mqText1").innerHTML;

        // if not frozen/result, update live participants
        if(wheelState === "SPINNING"){
          participants = serverParts;
          totalPool = participants.reduce((a,c)=>a + (c.amount||0), 0);
          $("poolDisp").innerText = `${toMoney(totalPool)} UT`;
          renderList();
        }
      }catch(_){}
    }

    // ===== Layout metrics (keep perfect circle on mobile) =====
    function getStageRect(){
      const st = $("stage").getBoundingClientRect();
      return { w: Math.max(1, st.width), h: Math.max(1, st.height) };
    }

    function updateLayoutMetrics(){
      const isPC = window.innerWidth >= 1024;
      const { w, h } = getStageRect();

      let r, cx, cy;

      if(isPC){
        const size = Math.min(w, h) * 0.98;
        r = size * 0.48;
        cx = w/2;
        cy = h/2;
      }else{
        // 모바일: 위쪽에 배치 + 절대 원형 유지 (찌그러짐 방지)
        const topPad = 34;
        const size = Math.min(w, h - topPad - 10) * 0.98;
        r = Math.max(140, size * 0.48);
        cx = w/2;
        cy = topPad + r;
        // 그래도 넘치면 중앙으로
        if(cy + r > h - 10) cy = h/2;
      }

      // pointer position (top center of wheel)
      const ptr = $("pointer");
      ptr.style.left = `${cx}px`;
      ptr.style.top  = `${cy - r - 20}px`;
      ptr.style.transform = `translate(-50%, -50%)`;

      return { w, h, cx, cy, r, pointerAngle: -Math.PI/2 };
    }

    // ===== RPM schedule (as you requested earlier) =====
    // 4분30초(270s): 1rpm, 다음 5분: 2rpm, 다음 5분: 3rpm, 다음 5분: 6rpm
    function getCurrentRPM(timeLeft){
      if(timeLeft > 930) return 1;   // 1200~930 (270s)
      if(timeLeft > 630) return 2;   // 930~630
      if(timeLeft > 330) return 3;   // 630~330
      if(timeLeft > 0)   return 6;   // 330~0
      return 0;
    }

    // ===== Countdown voice (Korean) =====
    const synth = window.speechSynthesis;
    let koVoice = null;
    function pickKoVoice(){
      const vs = synth ? synth.getVoices() : [];
      // ko-KR 우선
      koVoice = vs.find(v=>String(v.lang).toLowerCase().includes("ko")) || null;
    }
    if(synth){
      pickKoVoice();
      window.speechSynthesis.onvoiceschanged = pickKoVoice;
    }
    let lastSpoken = null;
    function speakKo(n){
      if(!synth || synth.speaking) return;
      const map = {5:"오",4:"사",3:"삼",2:"이",1:"일",0:"영"};
      const txt = map[n];
      if(!txt) return;
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = "ko-KR";
      if(koVoice) u.voice = koVoice;
      u.rate = 1.0;
      u.pitch = 0.9;
      synth.speak(u);
    }

    // ===== Winner stop: snap at 0 with frozen snapshot =====
    function spinSnapToWinner(winnerName){
      const snapParts = frozenParticipants || participants;
      const snapTotal = frozenTotalPool || totalPool || 1;
      if(!snapParts || snapParts.length === 0) return;

      // find winner slice (if multiple, random pick)
      const winIdxs = [];
      snapParts.forEach((p,i)=>{ if(String(p.name)===String(winnerName)) winIdxs.push(i); });
      if(winIdxs.length === 0) return;
      const targetIndex = winIdxs[Math.floor(Math.random()*winIdxs.length)];

      // compute mid angle of that slice
      let sum = 0, mid = 0;
      for(let i=0;i<snapParts.length;i++){
        const s = (Number(snapParts[i].amount||0)/snapTotal) * Math.PI*2;
        if(i === targetIndex){ mid = sum + s/2; break; }
        sum += s;
      }

      const m = updateLayoutMetrics();
      // make pointerAngle hit mid: rotation ≡ pointerAngle - mid (mod 2π)
      let dest = m.pointerAngle - mid;
      // normalize into [0, 2π)
      dest = ((dest % (Math.PI*2)) + (Math.PI*2)) % (Math.PI*2);

      rotation = dest;
    }

    function showWinnerModal(name, prize){
      // 30초 동안 중앙에 크게
      const cd = $("cdNum");
      cd.classList.add("on");
      cd.classList.remove("blink");
      cd.style.fontSize = "92px";
      cd.style.webkitTextStroke = "3px rgba(255,215,0,.45)";
      cd.innerText = `WINNER\n${name}`;
      setTimeout(()=>{
        cd.classList.remove("on");
        cd.style.fontSize = "";
        cd.innerText = "";
      }, RESULT_HOLD_MS);
    }

    // ===== Draw =====
    function draw(ts){
      if(!lastFrameTs) lastFrameTs = ts;
      const dt = ts - lastFrameTs;
      lastFrameTs = ts;

      const cvs = $("cvs");
      const ctx = cvs.getContext("2d");
      const m = updateLayoutMetrics();

      if(cvs.width !== Math.floor(m.w) || cvs.height !== Math.floor(m.h)){
        cvs.width = Math.floor(m.w);
        cvs.height = Math.floor(m.h);
      }

      // background fill (no white)
      ctx.fillStyle = "#050508";
      ctx.fillRect(0,0,m.w,m.h);

      // timeLeft (server synced)
      const now = Date.now() + serverOffset;
      const timeLeft = nextRoundMs ? Math.max(0, Math.floor((nextRoundMs - now)/1000)) : 0;

      // rotation step only in SPINNING (not RESULT)
      if(wheelState === "SPINNING"){
        const rpm = getCurrentRPM(timeLeft);
        const radPerMs = (rpm * 2 * Math.PI) / 60000;
        rotation += radPerMs * dt;
      }

      const drawParts = (wheelState === "SPINNING") ? participants : (frozenParticipants || participants);
      const drawTotal = (wheelState === "SPINNING") ? (totalPool||1) : (frozenTotalPool||totalPool||1);

      // Rim
      const {cx,cy,r} = m;
      const gradRim = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
      gradRim.addColorStop(0, '#fbf5b7');
      gradRim.addColorStop(0.3, '#d4af37');
      gradRim.addColorStop(0.5, '#ffd700');
      gradRim.addColorStop(0.8, '#aa771c');
      gradRim.addColorStop(1, '#fbf5b7');

      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(cx,cy,r+18,0,Math.PI*2);
      ctx.fillStyle = gradRim; ctx.fill();
      ctx.restore();

      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = "#110000"; ctx.fill();

      // Slices
      let startAng = rotation;
      if(drawParts && drawParts.length){
        drawParts.forEach(p=>{
          const slice = (Number(p.amount||0)/drawTotal) * Math.PI*2;
          const endAng = startAng + slice;

          ctx.beginPath();
          ctx.moveTo(cx,cy);
          ctx.arc(cx,cy,r-5,startAng,endAng);
          ctx.fillStyle = p.color || "#999";
          ctx.fill();

          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(255,255,255,0.12)";
          ctx.stroke();

          // label (only if enough width)
          if(slice > 0.035){
            const mid = startAng + slice/2;
            const tx = cx + Math.cos(mid)*(r*0.80);
            const ty = cy + Math.sin(mid)*(r*0.80);
            ctx.save();
            ctx.translate(tx,ty);
            ctx.rotate(mid + Math.PI);
            ctx.textAlign="center";
            ctx.textBaseline="middle";
            ctx.shadowColor="rgba(0,0,0,1)";
            ctx.shadowBlur=8;

            let n = String(p.name||"");
            if(n.length > 12) n = n.slice(0,10)+"..";
            ctx.fillStyle="#fff";
            ctx.font = `900 ${Math.max(16, r*0.05)}px 'Cinzel', serif`;
            ctx.fillText(n, 0, -14);

            ctx.fillStyle="#ffd700";
            ctx.font = `900 ${Math.max(12, r*0.04)}px monospace`;
            ctx.fillText(toMoney(p.amount), 0, 14);
            ctx.restore();
          }

          startAng = endAng;
        });
      }

      // ===== Center Cap (요청: 검은 부분 키우고, UNIQUE 글자도 판 회전과 같이 회전) =====
      const capR = Math.min(r*0.15, 170);           // 전체 캡 조금 키움
      const innerR = capR * 0.84;                  // ✅ 검은 부분 더 크게
      const ringR  = capR * 0.96;

      // gold outer cap
      const gradCap = ctx.createRadialGradient(cx,cy,capR*0.1, cx,cy,capR);
      gradCap.addColorStop(0,'#fff');
      gradCap.addColorStop(0.25,'#ffd700');
      gradCap.addColorStop(0.9,'#b8860b');
      gradCap.addColorStop(1,'#5e4b25');

      ctx.save();
      ctx.shadowColor="rgba(0,0,0,0.85)";
      ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(cx,cy,capR,0,Math.PI*2);
      ctx.fillStyle=gradCap; ctx.fill();
      ctx.restore();

      // inner black disc + ring
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,innerR,0,Math.PI*2);
      ctx.fillStyle="#09090d";
      ctx.fill();
      ctx.lineWidth = Math.max(3, capR*0.06);
      ctx.strokeStyle = "rgba(255,215,0,.85)";
      ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();

      // UNIQUE text rotates with wheel (same rotation)
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rotation); // ✅ 판과 같이 회전
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      const fs = Math.max(18, capR*0.38);
      ctx.font = `900 ${fs}px 'Cinzel', serif`;
      ctx.shadowColor="rgba(0,0,0,0.85)";
      ctx.shadowBlur=10;
      ctx.fillStyle = "#ffd700";
      ctx.fillText("UNIQUE", 0, 2);
      ctx.restore();

      // ===== Countdown center (60->0) =====
      const cd = $("cdNum");
      if(nextRoundMs){
        if(timeLeft <= 60 && timeLeft >= 0){
          cd.classList.add("on");
          cd.style.fontSize = (timeLeft > 10) ? "170px" : "190px";
          cd.style.whiteSpace = "nowrap";
          cd.innerText = String(timeLeft);
          if(timeLeft <= 10) cd.classList.add("blink"); else cd.classList.remove("blink");

          // 5..0 voice
          if(timeLeft <= 5 && timeLeft >= 0 && lastSpoken !== timeLeft){
            lastSpoken = timeLeft;
            speakKo(timeLeft);
          }
        }else{
          cd.classList.remove("on","blink");
          cd.innerText="";
          lastSpoken = null;
        }
      }

      requestAnimationFrame(draw);
    }

    // ===== Timer + Locking + Result =====
    let betClosed = false;

    function tickTimer(){
      setInterval(async ()=>{
        if(!nextRoundMs) return;
        const now = Date.now() + serverOffset;
        const timeLeft = Math.max(0, Math.floor((nextRoundMs - now)/1000));

        const mm = Math.floor(timeLeft/60);
        const ss = timeLeft%60;
        $("timerDisp").innerText = `${mm}:${ss<10?'0'+ss:ss}`;

        // close betting at 60s
        if(!betClosed && timeLeft <= BET_CLOSE_SEC){
          betClosed = true;
          $("bJoin").disabled = true;
          $("btnText").innerText = "CLOSED";
          $("timerDisp").classList.add("alert");

          // ✅ freeze snapshot for fair stop at 0
          closedRoundKey = roundKey;
          frozenParticipants = (participants || []).map(p=>({...p}));
          frozenTotalPool = totalPool || frozenParticipants.reduce((a,c)=>a+(c.amount||0),0);
          wheelState = "FROZEN";
        }

        // at 0: wait until server settles winner for closedRoundKey, then snap stop + show 30s
        if(timeLeft === 0 && closedRoundKey && shownWinnerRound !== closedRoundKey){
          // pull state until lastWinner round matches closedRoundKey
          try{
            const d = await api("getRouletteState");
            const lw = d.lastWinner ? { round:String(d.lastWinner.round||""), name:String(d.lastWinner.name||""), prize:Number(d.lastWinner.prize||0) } : null;
            if(lw && lw.round === closedRoundKey){
              shownWinnerRound = closedRoundKey;

              // stop snap
              spinSnapToWinner(lw.name);
              wheelState = "RESULT";

              // show winner
              showWinnerModal(lw.name, lw.prize);

              // hold 30s, then reopen for new round
              setTimeout(()=>{
                betClosed = false;
                closedRoundKey = null;
                frozenParticipants = null;
                frozenTotalPool = 0;
                wheelState = "SPINNING";
                $("bJoin").disabled = false;
                $("btnText").innerHTML = '<span class="unique-logo-text">UNIQUE</span>&nbsp;BET NOW';
                $("timerDisp").classList.remove("alert");
              }, RESULT_HOLD_MS);
            }
          }catch(_){}
        }
      }, 250);
    }

    // ===== Betting controls =====
    const setB = (v)=> $("inpBet").value = v;

    $("bMin").onclick = ()=> setB(MIN_BET);
    $("bMax").onclick = ()=> setB(Math.floor(myWallet/100)*100);

    $("bM100").onclick = ()=>{
      let v = Number($("inpBet").value) - 100;
      if(v < MIN_BET) v = MIN_BET;
      setB(v);
    };
    $("bP100").onclick = ()=>{
      let v = Number($("inpBet").value) + 100;
      if(v > myWallet) v = myWallet;
      setB(v);
    };

    $("bJoin").onclick = async ()=>{
      if(betClosed) return alert("Closed.");
      const amt = Number($("inpBet").value);
      if(amt > myWallet) return alert("No Money");

      const btn = $("bJoin");
      const bt = $("btnText");
      btn.disabled = true;
      bt.innerText = "...";

      try{
        const r = await api("rouletteResult", { type:"bet", id:myId, amount:amt, color:myColor });
        if(r.result === "success"){
          myWallet = r.newBalance;
          $("myBal").innerText = `${toMoney(myWallet)} UT`;
          await updateState(); // refresh
        }else{
          alert(r.msg || "fail");
        }
      }catch(_){}
      btn.disabled = false;
      bt.innerHTML = '<span class="unique-logo-text">UNIQUE</span>&nbsp;BET NOW';
    };

    // ===== Boot =====
    window.onload = async ()=>{
      const p = new URLSearchParams(location.search);
      myId = (p.get("id") || "Guest").trim();
      myColor = hashColor(myId);

      bindMusicControls();

      try{
        const u = await api("getUserInfo", { id: myId });
        if(u.result === "success") myWallet = Number(u.balance||0);
        $("myBal").innerText = `${toMoney(myWallet)} UT`;
      }catch(_){
        $("myBal").innerText = "0 UT";
      }

      await updateState();
      setInterval(updateState, 1500);
      tickTimer();
      requestAnimationFrame(draw);
      window.addEventListener("resize", ()=>{ lastFrameTs = 0; });
    };
  </script>
</body>
</html>
