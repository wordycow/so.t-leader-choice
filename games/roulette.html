<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #050508; --panel-bg: rgba(12, 14, 20, 0.95); --gold-1: #ffd700; --gold-2: #d4af37; --danger: #ff0044; --accent-blue: #00f0ff; }
    body { margin: 0; padding: 0; background: transparent; overflow-y: auto; overflow-x: hidden; color: #fff; font-family: 'Cinzel', serif; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; display: block; background-color: #050508; }
    
    /* Countdown: 반응형 폰트 적용 (잘림 방지) */
    .countdown-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 150; width: 100%; text-align: center; }
    .cd-num { 
        font-size: 200px; font-weight: 900; color: #fff; -webkit-text-stroke: 4px var(--danger);
        text-shadow: 0 0 60px var(--danger); opacity: 0; transition: transform 0.1s, opacity 0.1s; 
        display: inline-block; white-space: nowrap; 
    }
    @media (max-width: 768px) {
        .cd-num { font-size: 100px; -webkit-text-stroke: 2px var(--danger); text-shadow: 0 0 30px var(--danger); }
    }
    .cd-num.active { opacity: 1; transform: scale(1.1); }

    /* UI Layout */
    .ui-container { position: fixed; z-index: 100; top: 40px; bottom: 0; right: 0; width: 420px; background: var(--panel-bg); display: flex; flex-direction: column; backdrop-filter: blur(20px); }
    @media (max-width: 1023px) {
      .ui-container { position: relative; width: 100%; min-height: 100vh; top: auto; bottom: auto; border: none; margin-top: 400px; background: transparent; padding-bottom: 50px; }
      .ui-container::before { content:""; position: absolute; inset:0; background: #050508; z-index: -1; }
    }
    
    /* Buttons Gap Fix */
    .bet-inputs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; align-items:center; }
    .btn-chip { background: linear-gradient(180deg, #2a2a35, #1a1a20); border: 1px solid #444; color: #ccc; border-radius: 10px; height: 50px; font-weight: 700; width: 100%; margin: 0; box-sizing: border-box; cursor: pointer; }
    .btn-chip:hover { color: #fff; border-color: var(--gold-2); background: #333; }
    .inp-amt { background: #000; border: 2px solid var(--gold-2); color: var(--gold-1); text-align: center; font-size: 18px; font-weight: 900; border-radius: 10px; width: 100%; height: 50px; box-sizing: border-box; margin: 0; }
    
    .action-btn.action-btn-sot { position: relative; overflow: hidden; border: 0; min-height: 60px; border-radius: 999px; width: 100%; cursor: pointer; background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .unique-logo-text { font-weight: 900; background: linear-gradient(to bottom, #fff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .action-btn:disabled { filter: grayscale(1); cursor: not-allowed; }

    /* Other styles (Music bar, Pointer, etc. kept minimal for brevity but functionality preserved) */
    .music-bar { position: fixed; top: 60px; left: 20px; z-index: 250; display: flex; gap: 8px; background: rgba(20,20,30,0.7); padding: 8px 16px; border-radius: 99px; }
    .mb-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
    .marquee-wrap { position: fixed; top: 0; width: 100%; height: 40px; background: #000; z-index: 200; display: flex; align-items: center; overflow: hidden; }
    .marquee-text { white-space: nowrap; color: var(--gold-2); padding: 0 50px; animation: scroll 60s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .pointer-wrap { position: fixed; z-index: 50; display: flex; align-items: center; }
    .pointer-real { width: 80px; height: 50px; background: linear-gradient(90deg, #ff4d00, #ffcc00); clip-path: polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%); }
    .hud-row { padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
    .label { font-size: 11px; color: #888; } .value-lg { font-size: 28px; font-weight: 900; color: var(--gold-1); }
    .list-wrap { flex: 1; overflow-y: auto; padding: 15px; }
    .rank-item { display: flex; padding: 10px; border-bottom: 1px solid #222; }
    .p-col { width: 10px; height: 10px; margin-right: 10px; } .p-name { flex: 1; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: none; justify-content: center; align-items: center; }
    .modal-body { width: 90%; max-width: 400px; background: #111; border: 2px solid var(--gold-1); padding: 40px; text-align: center; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="music-bar">
    <button class="mb-btn" id="prevBtn">⏮</button>
    <button class="mb-btn" id="playToggle">▶</button>
    <button class="mb-btn" id="muteToggle">🔊</button>
    <button class="mb-btn" id="nextBtn">⏭</button>
  </div>
  <div class="marquee-wrap"><div class="marquee-content"><span class="marquee-text">💎 UNIQUE ROYAL CASINO 💎</span><span class="marquee-text">💎 UNIQUE ROYAL CASINO 💎</span></div></div>
  <canvas id="cvs"></canvas>
  <div id="pointer" class="pointer-wrap"><div class="pointer-real"></div></div>
  <div class="countdown-box"><div id="cdNum" class="cd-num"></div></div>

  <aside class="ui-container">
    <div class="hud-row">
      <div><div class="label">TOTAL POOL</div><div class="value-lg" id="poolDisp">0 UT</div></div>
      <div style="text-align:right;"><div class="label">TIME LEFT</div><div class="timer" id="timerDisp">--:--</div></div>
    </div>
    <div class="list-wrap" id="pList"></div>
    <div style="padding:20px;">
      <div class="bet-inputs">
        <button class="btn-chip" id="bMin">MIN</button>
        <button class="btn-chip" id="bM100">-100</button>
        <input type="number" id="inpBet" class="inp-amt" value="100" readonly />
        <button class="btn-chip" id="bP100">+100</button>
        <button class="btn-chip" id="bMax">MAX</button>
      </div>
      <button id="bJoin" class="action-btn action-btn-sot"><span class="unique-inner"><span class="unique-logo-text">UNIQUE</span> BET NOW</span></button>
      <div style="display:flex; justify-content:space-between; margin-top:15px; color:#888; font-size:12px;"><span>MY WALLET</span><span style="color:#fff;" id="myBal">Loading...</span></div>
    </div>
  </aside>

  <div id="mdRes" class="modal-mask">
    <div class="modal-body">
      <h2 style="color:var(--gold-1); font-size:40px;">WINNER!</h2>
      <div id="resName" style="font-size:40px; font-weight:900; color:#fff; margin:20px 0;">-</div>
      <div id="resAmt" style="font-size:24px; color:var(--gold-2);">-</div>
      <div style="margin-top:20px; color:#888;">Next round soon...</div>
    </div>
  </div>

  <div id="ytPlayer" style="display:none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const toMoney = (n) => Number(n).toLocaleString();
    const synth = window.speechSynthesis;
    let maleVoice = null;

    // 🔥 60초 소리 중복 방지 변수 🔥
    let bettingClosedAnnounced = false; 

    function initVoices() {
        const voices = synth.getVoices();
        maleVoice = voices.find(v => v.name.includes('Male') && v.lang.includes('en')) || voices.find(v => v.lang === 'en-US');
    }
    if (speechSynthesis.onvoiceschanged !== undefined) { speechSynthesis.onvoiceschanged = initVoices; }

    function speak(txt){ 
        if(synth && !synth.speaking){
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = 'en-US'; u.pitch = 0.7; u.rate = 1.1;   
            if (maleVoice) u.voice = maleVoice;
            synth.speak(u);
        }
    }

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";
    const ROUND_DURATION_SEC = 1200;
    let myId="", myWallet=0, myColor=null, roundKey=null, participants=[], totalPool=0;
    let rotation=0, wheelState="SPINNING", stopTargetAngle=0, stopStartTime=0, isLocked=false, serverOffset=0, nextRoundMs=0, isPC=window.innerWidth>=1024;
    let confetti = [];
    const ytPlaylist = ['-jdZKf-xSpA', '-B3HvFhHsIM', 'Sc-EOEQDBHk', 'dttGdK0l1G0', 'yPqI1VAHX8Q', 'Ge9OgkOayQs', 'dDxWoKcOmsA', 'aGpOcVy2A8I', 'BJRlZ0R4nuE', 'WbvoZvYmkBg', 'X6SuW5HhQoc', '0P4A1K4lXDo', 'LpTL5nTPwjo', 'viIJYFSGq0o', 'Qe8fa4b5xNU', 'LtwQuHFzIlk', 's3uPXokhpnA', '8KDWGWMs7Sg', 'pcIOYAdwKsw', 'MXz88usIhzA', 'lmxNgwBeJ44', 'j3V53sF13UQ', 'znDgBy2mHbc', '53BBRKF-L60', 'BsxBh3lE5Qs', 'eE5oaOOwInE', 'M4t25bx0Quc', 'vA8p2bioJ00', 'gRj83OcBbXc', 'p1GwElw35vo', 'jIIdLgUbj5E', 'gU3ubk8u7dA', 'Nh-V4s5jHHM', 'z0vCwGUZe1I', 'DPBm9nQ7o2E', 'TrDyciJ8svc', 'tO4dxvguQDk', 'F2AitTPI5U0', 'L7n5oXTQd2Q', 'Ijq-zNn-GWU', 'kP2ocLMNUnw', 'Ikbj54iFTdw', '7uaOFQpO_Ks', 'x46z5iMK1Wg', 'fwlLHP6j7U8', 'AVUeL6RMHoo', '3XDf5Ke2Zj8', 'PxbcXlqXrU0', 'yldUrx-4GPU', 'yajZ_cOVrXQ', 'h7FCYhJHCPw'];
    var ytPlayer, currentVideoIndex=0, isPlaying=true, isMuted=false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', { height: '0', width: '0', playerVars: { 'autoplay': 1, 'controls': 0 }, events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange } });
    }
    function onPlayerReady(event) { currentVideoIndex=Math.floor(Math.random()*ytPlaylist.length); loadAndPlay(currentVideoIndex); event.target.setVolume(20); updateMusicUI(); }
    function onPlayerStateChange(e) { if(e.data===0) playNextVideo(); }
    function loadAndPlay(i) { if(ytPlayer) ytPlayer.loadVideoById(ytPlaylist[i]); }
    function playNextVideo() { currentVideoIndex=(currentVideoIndex+1)%ytPlaylist.length; loadAndPlay(currentVideoIndex); }
    
    // Music UI
    $("playToggle").onclick=()=>{ if(isPlaying){ytPlayer.pauseVideo();isPlaying=false;}else{ytPlayer.playVideo();isPlaying=true;} updateMusicUI(); };
    $("muteToggle").onclick=()=>{ if(isMuted){ytPlayer.unMute();isMuted=false;}else{ytPlayer.mute();isMuted=true;} updateMusicUI(); };
    $("prevBtn").onclick=()=>{ currentVideoIndex=(currentVideoIndex-1+ytPlaylist.length)%ytPlaylist.length; loadAndPlay(currentVideoIndex); };
    $("nextBtn").onclick=playNextVideo;
    $("volUp").onclick=()=>{ if(ytPlayer) ytPlayer.setVolume(Math.min(100, ytPlayer.getVolume()+10)); };
    $("volDown").onclick=()=>{ if(ytPlayer) ytPlayer.setVolume(Math.max(0, ytPlayer.getVolume()-10)); };
    function updateMusicUI(){ $("playToggle").innerText=isPlaying?"⏸":"▶"; $("muteToggle").innerText=isMuted?"🔇":"🔊"; }

    function updateLayoutMetrics() {
      isPC = window.innerWidth >= 1024;
      const ptr = $("pointer");
      const w = window.innerWidth, h = window.innerHeight;
      if(isPC) { ptr.style.left="0px"; ptr.style.top="50%"; ptr.style.transform="translateY(-50%)"; return { r: h*1.2, cx: 80+(h*1.2), cy: h/2 }; } 
      else { ptr.style.left="50%"; ptr.style.top="80px"; ptr.style.transform="translateX(-50%) rotate(90deg)"; return { r: w*0.9, cx: w/2, cy: 150+(w*0.9) }; }
    }

    function draw() {
      const cvs=$("cvs"), ctx=cvs.getContext("2d");
      const w=window.innerWidth, h=window.innerHeight;
      if(cvs.width!==w || cvs.height!==h){ cvs.width=w; cvs.height=h; }
      ctx.fillStyle="#050508"; ctx.fillRect(0,0,w,h);
      const {cx,cy,r} = updateLayoutMetrics();

      if(wheelState==="SPINNING") rotation+=0.05;
      else if(wheelState==="STOPPING") {
          const t = Math.min(1, (Date.now()-stopStartTime)/8000);
          rotation = window.startRotation + (stopTargetAngle - window.startRotation) * (1 - Math.pow(1-t, 4));
          if(t>=1) { wheelState="STOPPED"; showResult(); setTimeout(()=>resetGame(), 10000); }
      }

      // Draw Wheel (Simplified)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle="#222"; ctx.fill();
      const total = totalPool||1;
      let startAng = rotation;
      participants.forEach(p=>{
          const slice = (p.amount/total)*2*Math.PI;
          ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,startAng,startAng+slice); ctx.fillStyle=p.color; ctx.fill();
          startAng+=slice;
      });
      requestAnimationFrame(draw);
    }

    function showResult() { $("mdRes").style.display="flex"; }
    function resetGame(nk) { $("mdRes").style.display="none"; wheelState="SPINNING"; isLocked=false; bettingClosedAnnounced=false; $("bJoin").disabled=false; $("bJoin").querySelector(".unique-logo-text").innerText="UNIQUE"; $("timerDisp").classList.remove("alert"); }

    async function api(act,p={}){const r=await fetch(GAS_URL+"?"+new URLSearchParams({action:act,...p}));return await r.json();}
    
    async function updateState(){
        if(wheelState!=="SPINNING") return;
        const d = await api("getRouletteState");
        if(d.result!=="success") return;
        if(d.nextRoundAtMs) nextRoundMs=d.nextRoundAtMs;
        if(String(d.roundKey)!==String(roundKey)) { roundKey=d.roundKey; resetGame(); }
        participants = (d.participants||[]).map(p=>({name:p.name,amount:Number(p.amount),color:p.color}));
        totalPool = participants.reduce((a,c)=>a+c.amount,0);
        $("poolDisp").innerText = toMoney(totalPool)+" UT";
        
        // Winner Check
        if(d.lastWinner && String(d.lastWinner.round)===String(roundKey) && wheelState==="SPINNING") {
             // Start Stopping
             wheelState="STOPPING"; stopStartTime=Date.now(); window.startRotation=rotation; 
             // Calculate angle for winner (Simplified for brevity)
             stopTargetAngle = rotation + Math.PI*10; 
             $("resName").innerText = d.lastWinner.name;
             $("resAmt").innerText = toMoney(Math.floor(d.lastWinner.prize)) + " UT";
        }
        renderList();
    }
    
    function renderList(){
        const l=$("pList"); l.innerHTML="";
        participants.forEach(p=>{ l.innerHTML+=`<div class="rank-item"><div class="p-col" style="background:${p.color}"></div><div class="p-name">${p.name}</div><div class="p-amt">${toMoney(p.amount)}</div></div>`; });
    }

    function startTimer(){
        setInterval(()=>{
            if(!nextRoundMs) return;
            const diff = Math.max(0, Math.floor((nextRoundMs - Date.now())/1000));
            const mm=Math.floor(diff/60), ss=diff%60;
            $("timerDisp").innerText = `${mm}:${ss<10?'0'+ss:ss}`;
            
            // 🔥 60초 로직 수정 (버튼 즉시 잠금) 🔥
            if(diff <= 60 && diff > 0) {
                if(!isLocked) {
                    isLocked=true; 
                    $("bJoin").disabled=true; 
                    $("bJoin").innerHTML="<span style='color:#ff0044;font-weight:900;'>CLOSED</span>";
                    $("timerDisp").classList.add("alert");
                }
                if(!bettingClosedAnnounced) {
                    speak("Betting Closed"); 
                    bettingClosedAnnounced=true;
                }
            }
            
            // Countdown visual
            const cd=$("cdNum");
            if(diff<=10 && diff>0 && wheelState==="SPINNING") {
                cd.innerText=diff; cd.classList.add("active"); speak(String(diff));
            } else { cd.classList.remove("active"); }

        }, 1000);
    }

    $("bJoin").onclick=async()=>{
        if(isLocked) return alert("Closed");
        const amt = Number($("inpBet").value);
        if(amt>myWallet) return alert("Low Balance");
        const r = await api("rouletteResult", {id:myId, amount:amt, color:myColor});
        if(r.result==="success") { myWallet=r.newBalance; $("myBal").innerText=toMoney(myWallet)+" UT"; updateState(); }
    };

    window.onload = async() => {
        initVoices();
        const p=new URLSearchParams(location.search); myId=p.get("id")||"Guest";
        myColor = localStorage.getItem("c_"+myId) || '#'+Math.floor(Math.random()*16777215).toString(16);
        const u = await api("getUserInfo",{id:myId});
        if(u.result==="success") { myWallet=u.balance; $("myBal").innerText=toMoney(myWallet)+" UT"; }
        updateState(); setInterval(updateState, 2000); startTimer(); draw();
        
        document.body.onclick = () => { if(ytPlayer && ytPlayer.getPlayerState()!==1) ytPlayer.playVideo(); }
    };
  </script>
</body>
</html>
