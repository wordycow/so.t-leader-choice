<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE: GIANT ROULETTE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* =========================================
           CSS STYLES (Titanium Theme)
           ========================================= */
        :root {
            --bg-color: #050714;
            --gold: #ffd700;
            --company-color: #ff0055;
            --panel-bg: rgba(20, 20, 35, 0.9);
            --text-gray: #aaa;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 상단 정보창 (플로팅) --- */
        .top-hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none; /* 클릭 통과 */
        }

        .hud-box {
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hud-label { font-size: 0.8rem; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 5px; }
        .hud-value { font-size: 1.8rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .hud-timer { font-size: 1.5rem; font-weight: bold; color: #ff4757; font-family: monospace; }

        /* --- 메인 게임 영역 (거대 룰렛) --- */
        .game-stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* 캔버스 (전체 화면) */
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* 룰렛 포인터 (화면 왼쪽 중앙 고정) */
        .pointer {
            position: absolute;
            top: 50%; left: 40px; /* 왼쪽에서 약간 떨어짐 */
            transform: translateY(-50%);
            width: 0; height: 0;
            z-index: 50;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 50px solid #fff; /* 흰색 화살표 */
            filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.8));
        }
        /* 포인터 장식 (보석 느낌) */
        .pointer::after {
            content: ''; position: absolute;
            top: -10px; left: -60px;
            width: 20px; height: 20px;
            background: var(--company-color);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--company-color);
        }

        /* --- 하단 컨트롤 패널 --- */
        .controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, #000, transparent);
            padding: 20px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }

        .bet-box {
            display: flex; gap: 10px; align-items: center;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-bet {
            background: #333; color: white; border: none;
            padding: 10px 15px; border-radius: 8px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        .btn-bet:hover { background: #555; }
        
        .input-bet {
            width: 100px; background: transparent; border: none;
            color: var(--gold); text-align: center; font-size: 1.5rem; font-weight: bold;
        }

        .btn-join {
            width: 100%; max-width: 400px;
            padding: 18px; font-size: 1.4rem; font-weight: 900;
            background: linear-gradient(90deg, #ff9f43, #ff6b6b);
            color: white; border: none; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            cursor: pointer; text-transform: uppercase;
            transition: transform 0.1s;
        }
        .btn-join:active { transform: scale(0.98); }
        .btn-join:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        /* 참여자 리스트 (오른쪽 하단 플로팅) */
        .list-panel {
            position: absolute;
            right: 20px; bottom: 120px;
            width: 220px; max-height: 300px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 90;
        }
        .list-item {
            display: flex; align-items: center; padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem;
        }
        .p-color { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; }
        .p-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; }
        .p-amt { font-weight: bold; color: var(--gold); }

        /* 반응형 */
        @media (max-width: 600px) {
            .hud-value { font-size: 1.4rem; }
            .pointer { left: 20px; }
            .list-panel { bottom: 160px; right: 10px; width: 180px; }
        }
    </style>
</head>
<body>

    <div class="top-hud">
        <div class="hud-box">
            <div class="hud-label">TOTAL EQUITY</div>
            <div class="hud-value" id="poolDisplay">0 UT</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">TIME LEFT</div>
            <div class="hud-timer" id="timerDisplay">30:00</div>
        </div>
    </div>

    <div class="game-stage">
        <div class="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="list-panel" id="participantList">
        <div style="text-align:center; color:#888; font-size:0.8rem; padding:5px;">참여자 대기중...</div>
    </div>

    <div class="controls">
        <div class="bet-box">
            <button class="btn-bet" onclick="changeBet(-10)">-10</button>
            <input type="number" id="betInput" class="input-bet" value="10" readonly>
            <button class="btn-bet" onclick="changeBet(10)">+10</button>
            <button class="btn-bet" style="color:var(--gold)" onclick="setMaxBet()">MAX</button>
        </div>
        <button id="joinBtn" class="btn-join" onclick="joinGame()">참여하기 (BET)</button>
        <div style="font-size:0.9rem; color:#aaa;">내 보유 자산: <span id="myBalance" style="color:white; font-weight:bold;">Loading...</span></div>
    </div>

    <script>
        // === 설정값 ===
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";
        const ROUND_TIME = 30 * 60; // 30분
        const SPIN_SPEED = (Math.PI * 4) / 60; // 1분에 2바퀴 (약 0.0035 rad/frame)

        // === 상태 변수 ===
        let myId = "";
        let myWallet = 0;
        
        let gameState = {
            participants: [],
            totalPool: 0,
            timeLeft: ROUND_TIME,
            rotation: 0,
            isRunning: true
        };

        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#34495e'];

        // === 초기화 ===
        window.onload = async function() {
            // 1. URL에서 ID 파싱
            const params = new URLSearchParams(window.location.search);
            myId = params.get('id');

            // ID 없으면 로컬스토리지 확인
            if (!myId) myId = localStorage.getItem('user_id') || localStorage.getItem('loginId');

            if (!myId) {
                alert("로그인이 필요합니다.");
                window.location.href = "../the-unique-main.html"; // 메인으로 쫓아냄
                return;
            }

            console.log("Logged in as:", myId);

            // 2. 내 잔액 불러오기
            await fetchUserData();

            // 3. 게임 시작 (Company 자동 참여)
            addParticipant("Company", 100, "#ff0055"); 
            
            // 4. 애니메이션 & 타이머 시작
            requestAnimationFrame(drawGiantWheel);
            startTimer();
        };

        async function fetchUserData() {
            try {
                const res = await fetch(`${GAS_URL}?action=getUserInfo&id=${myId}`);
                const data = await res.json();
                if (data.result === "success") {
                    myWallet = Number(data.balance);
                    document.getElementById('myBalance').innerText = myWallet.toLocaleString() + " UT";
                } else {
                    document.getElementById('myBalance').innerText = "0 UT";
                }
            } catch (e) {
                console.error("Data Load Error:", e);
                document.getElementById('myBalance').innerText = "Error";
            }
        }

        // === 게임 로직 ===
        function addParticipant(name, amount, color) {
            gameState.participants.push({ name, amount, color });
            calculatePool();
            updateListUI();
        }

        function calculatePool() {
            gameState.totalPool = gameState.participants.reduce((acc, p) => acc + p.amount, 0);
            document.getElementById('poolDisplay').innerText = gameState.totalPool.toLocaleString() + " UT";
        }

        function changeBet(val) {
            const el = document.getElementById('betInput');
            let v = parseInt(el.value) + val;
            if (v < 10) v = 10;
            el.value = v;
        }

        function setMaxBet() { document.getElementById('betInput').value = myWallet; }

        function joinGame() {
            const amount = parseInt(document.getElementById('betInput').value);
            if (amount > myWallet) return alert("잔액이 부족합니다!");
            if (amount <= 0) return alert("금액을 확인해주세요.");

            // 서버 통신 (돈 차감)
            fetch(`${GAS_URL}?action=rouletteResult&type=bet&id=${myId}&amount=${amount}`)
                .then(res => res.json())
                .then(data => {
                    if (data.result === "success") {
                        myWallet = data.newBalance;
                        document.getElementById('myBalance').innerText = myWallet.toLocaleString() + " UT";
                        
                        // 게임 참여
                        const color = colors[gameState.participants.length % colors.length];
                        addParticipant(myId, amount, color);
                        alert("배팅 완료!");
                    } else {
                        alert("배팅 실패: " + data.msg);
                    }
                });
        }

        function startTimer() {
            setInterval(() => {
                if(gameState.timeLeft > 0) gameState.timeLeft--;
                const min = Math.floor(gameState.timeLeft / 60);
                const sec = gameState.timeLeft % 60;
                document.getElementById('timerDisplay').innerText = `${min}:${sec < 10 ? '0'+sec : sec}`;
            }, 1000);
        }

        function updateListUI() {
            const list = document.getElementById('participantList');
            list.innerHTML = "";
            gameState.participants.forEach(p => {
                list.innerHTML += `
                    <div class="list-item">
                        <div class="p-color" style="background:${p.color}"></div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-amt">${p.amount}</div>
                    </div>`;
            });
        }

        // === ✨ 핵심: 거대 룰렛 그리기 (Giant Wheel Render) ===
        function drawGiantWheel() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // 캔버스 크기 맞춤
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const w = canvas.width;
            const h = canvas.height;

            // 1. 거대한 룰렛 설정
            // 화면 오른쪽 바깥 멀리에 중심점을 둡니다.
            // 반지름을 엄청 크게(화면 높이의 2배 정도) 잡아서 곡선이 완만하게 보이게 합니다.
            const radius = h * 1.5; 
            const centerX = w + radius - 100; // 오른쪽 바깥으로 밀어냄 (100px 정도만 화면에 들어오게)
            const centerY = h / 2; // 세로 중앙

            // 2. 회전 업데이트 (1분에 2바퀴)
            // 60fps 기준 프레임당 회전각
            gameState.rotation += 0.0035; 

            ctx.clearRect(0, 0, w, h);
            ctx.save();

            // 3. 룰렛 그리기
            let startAngle = gameState.rotation;

            // 배경 원 (어두운 판)
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#111";
            ctx.fill();
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 10;
            ctx.stroke();

            // 파이 조각 그리기
            if (gameState.participants.length > 0) {
                gameState.participants.forEach(p => {
                    const sliceAngle = (p.amount / gameState.totalPool) * 2 * Math.PI;
                    const endAngle = startAngle + sliceAngle;

                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius - 20, startAngle, endAngle); // 테두리 안쪽
                    ctx.closePath();
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    
                    // 경계선
                    ctx.strokeStyle = "rgba(0,0,0,0.5)";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    startAngle = endAngle;
                });
            } else {
                // 참여자 없을 때 기본 회색 판
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 20, 0, Math.PI * 2);
                ctx.fillStyle = "#222";
                ctx.fill();
            }

            // 4. 광택 효과 (Gradient Overlay) - 입체감
            const grad = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius);
            grad.addColorStop(0, "rgba(0,0,0,0)");
            grad.addColorStop(1, "rgba(0,0,0,0.6)");
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.restore();
            requestAnimationFrame(drawGiantWheel);
        }

    </script>
</body>
</html>
