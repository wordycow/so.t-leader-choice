<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE: 2D GIANT ROULETTE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* =========================================
           CSS STYLES (Titanium Theme)
           ========================================= */
        :root {
            --bg-color: #050714;
            --gold: #ffd700;
            --company-color: #ff0055;
            --panel-bg: rgba(20, 20, 35, 0.9);
            --text-gray: #aaa;
        }

        body {
            margin: 0; font-family: 'Pretendard', sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
            background: linear-gradient(-45deg, #050714, #1a0b2e, #2b0000, #0f0c29);
            background-size: 400% 400%; animation: gradientBG 20s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* UI 요소들 */
        .marquee-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 35px; background: rgba(255, 0, 85, 0.15); border-bottom: 1px solid var(--company-color); overflow: hidden; white-space: nowrap; z-index: 150; display: flex; align-items: center; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: scroll-left 25s linear infinite; color: #fff; font-weight: bold; font-size: 0.9rem; text-shadow: 0 0 5px var(--company-color); }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .top-hud { position: absolute; top: 50px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 100; pointer-events: none; }
        .hud-box { background: var(--panel-bg); padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; backdrop-filter: blur(10px); pointer-events: auto; }
        .hud-label { font-size: 0.7rem; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 3px; }
        .hud-value { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .hud-timer { font-size: 1.4rem; font-weight: bold; color: #ff4757; font-family: monospace; }

        .center-countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 25rem; font-weight: 900; color: rgba(255, 0, 85, 0.1); z-index: 80; pointer-events: none; text-shadow: 0 0 100px rgba(255, 0, 85, 0.8); display: none; line-height: 1; }
        .center-countdown.active { display: block; animation: pulseCount 1s infinite; }
        @keyframes pulseCount { 0% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1); opacity: 1; color: #ff0055; } 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } }

        /* 게임 스테이지 */
        .game-stage { position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 화살표 포인터 */
        .pointer { 
            position: absolute; top: 50%; left: 30px; transform: translateY(-50%);
            width: 0; height: 0; z-index: 50; 
            border-top: 15px solid transparent; border-bottom: 15px solid transparent; 
            border-left: 50px solid #fff; 
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
        }
        .pointer::after { content: ''; position: absolute; top: -8px; left: -60px; width: 16px; height: 16px; background: var(--company-color); border-radius: 50%; box-shadow: 0 0 15px var(--company-color); }

        /* 리스트 패널 */
        .list-panel { position: absolute; top: 140px; right: 20px; width: 220px; max-height: 300px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); border-radius: 12px; padding: 10px; overflow-y: auto; border: 1px solid rgba(255, 215, 0, 0.3); z-index: 90; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .list-panel::-webkit-scrollbar { width: 4px; }
        .list-panel::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .list-header { text-align: center; color: #ddd; font-weight:bold; font-size: 0.8rem; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }
        .list-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
        .p-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.8); }
        .p-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight:500; }
        .p-amt { font-weight: bold; color: var(--gold); }

        /* 컨트롤 패널 */
        .controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #000, transparent); padding: 20px 20px 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 100; }
        .bet-box { display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); }
        .btn-bet { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn-bet:hover { background: #555; }
        .btn-min { color: #ff9f43; } .btn-max { color: var(--gold); }
        .input-bet { width: 90px; background: transparent; border: none; color: var(--gold); text-align: center; font-size: 1.4rem; font-weight: bold; }
        .btn-join { width: 100%; max-width: 400px; padding: 16px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(90deg, #ff9f43, #ff6b6b); color: white; border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4); cursor: pointer; text-transform: uppercase; }
        .btn-join:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; background: #333; }

        /* 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); display: none; }
        .modal-overlay.active { display: flex; animation: popIn 0.4s ease; }
        .modal-box { background: linear-gradient(135deg, #1a0b2e, #050714); border: 2px solid var(--gold); border-radius: 20px; padding: 30px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 60px rgba(255, 215, 0, 0.3); }
        .modal-title { font-size: 1.8rem; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
        .modal-sub { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; max-height: 200px; overflow-y: auto; }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; position: relative; }
        .color-btn:hover { transform: scale(1.1); border-color: #fff; }
        .color-btn.selected { border: 3px solid #fff; box-shadow: 0 0 15px currentColor; transform: scale(1.2); }
        .color-btn.disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }
        .btn-confirm { background: var(--gold); color: #000; border: none; padding: 12px 40px; font-size: 1.2rem; font-weight: 900; border-radius: 50px; cursor: pointer; transition: 0.2s; margin-top: 10px; width: 100%; }
        .btn-confirm:disabled { background: #555; cursor: not-allowed; }
        .btn-close { background: var(--gold); color: #000; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 10px; }
        #resWinner { font-size: 2.5rem; color: #fff; margin: 10px 0; text-shadow: 0 0 20px var(--company-color); }

        @media (max-width: 600px) {
            body { overflow-y: auto; height: auto; padding-bottom: 250px; }
            .game-stage { height: 60vh; margin-top: 80px; }
            .pointer { left: 5px; } 
            .list-panel { position: relative; top: auto; bottom: auto; left: auto; right: auto; width: 90%; margin: 0 auto 180px auto; transform: none; background: rgba(255,255,255,0.05); }
            .controls { position: fixed; bottom: 0; left: 0; background: linear-gradient(to top, #000 80%, transparent); padding-bottom: 20px; }
            .center-countdown { font-size: 10rem; top: 40%; }
            .modal-box { padding: 20px; width: 85%; }
        }
    </style>
</head>
<body>
    <div id="centerCount" class="center-countdown">60</div>

    <div id="ruleModal" class="modal-overlay active">
        <div class="modal-box">
            <div class="modal-title">WELCOME TO CASINO</div>
            <div class="modal-sub">30분마다 진행되는 승부! 당신의 컬러를 선택하세요.</div>
            <div style="text-align:left; font-size:0.9rem; color:#ddd; margin-bottom:10px;">
                🎨 <strong>CHOOSE YOUR COLOR</strong>
            </div>
            <div id="colorGrid" class="color-grid"></div>
            <div id="selectedColorName" style="height:20px; color:#fff; font-weight:bold; margin-bottom:15px; font-size:0.9rem;"></div>
            <button id="btnStart" class="btn-confirm" onclick="selectColorAndStart()" disabled>GAME START</button>
        </div>
    </div>

    <div id="resultModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:2rem; font-weight:900; color:#ffd700;">ROUND FINISHED</div>
            <div style="font-size:0.9rem; color:#aaa; margin-top:10px;">WINNER</div>
            <div id="resWinner">USER</div>
            <div id="resAmount">1,000 UT</div>
            <div id="resMsg" style="font-size:1.2rem; margin-top:15px; font-weight:bold;">축하합니다!</div>
            <button class="btn-close" onclick="closeModal('resultModal'); resetGame();">NEXT ROUND</button>
        </div>
    </div>

    <div class="marquee-wrap"><div class="marquee-text" id="marqueeText">🔥 THE UNIQUE CASINO에 오신 것을 환영합니다! 대박의 기회를 잡으세요! 🔥</div></div>
    
    <div class="top-hud">
        <div class="hud-box"><div class="hud-label">TOTAL EQUITY</div><div class="hud-value" id="poolDisplay">0 UT</div></div>
        <div class="hud-box"><div class="hud-label">TIME LEFT</div><div class="hud-timer" id="timerDisplay">30:00</div></div>
    </div>
    
    <div class="game-stage">
        <div class="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="list-panel">
        <div class="list-header">실시간 지분 현황 (Live Rank)</div>
        <div id="participantList"><div style="text-align:center; color:#ddd; font-size:0.8rem; padding:5px;">대기중...</div></div>
    </div>
    
    <div class="controls">
        <div class="bet-box">
            <button class="btn-bet btn-min" onclick="setMinBet()">MIN</button>
            <button class="btn-bet" onclick="changeBet(-10)">-10</button>
            <input type="number" id="betInput" class="input-bet" value="10" readonly>
            <button class="btn-bet" onclick="changeBet(10)">+10</button>
            <button class="btn-bet btn-max" onclick="setMaxBet()">MAX</button>
        </div>
        <button id="joinBtn" class="btn-join" onclick="joinGame()">참여하기 (BET)</button>
        <div style="font-size:0.8rem; color:#aaa;">내 자산: <span id="myBalance" style="color:white;">Loading...</span></div>
    </div>
    
   <script>
  // ✅ GAS URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

  let myId = "";
  let myWallet = 0;
  let myColor = null;

  // 서버 roundKey 추적 (라운드가 바뀌면 로컬 잔상 제거)
  let currentRoundKey = null;

  // 동기화 지연 보정용(같은 라운드에서만 10초 유지)
  let pendingBet = null; // { roundKey, potAmount, ts }

  let gameState = { participants: [], totalPool: 0, timeLeft: 1800, rotation: 0 };
  let isBettingProcessing = false;

  let lastWinnerMsg = "🏆 지난 라운드 우승자가 없습니다.";
  const warningMsg = "🚨 [안내] 마감 1분 전까지만 배팅 참여가 가능합니다! 서두르세요! 🚨";
  const synth = window.speechSynthesis;

  const availableColors = [
    '#ff0055', '#00ff44', '#00ccff', '#ffdd00', '#aa00ff',
    '#ff6600', '#ffffff', '#ff99cc', '#99ff99', '#6666ff',
    '#cc0000', '#006600', '#000099', '#663300', '#666666',
    '#00ff99', '#ff3399', '#ccff00', '#9900cc', '#33ccff'
  ];

  function el(id){ return document.getElementById(id); }

  function generateRandomNeonColor() {
    const hue = Math.floor(Math.random() * 360);
    return `hsl(${hue}, 100%, 60%)`;
  }

  function speak(text) {
    if (synth.speaking) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 1.0;
    utter.pitch = 1.0;
    synth.speak(utter);
  }

  function updateMarquee(text, color="#fff"){
    const marquee = el('marqueeText');
    marquee.innerText = text;
    marquee.style.color = color;
  }

  function formatRoundKeyClient(dateObj){
    const d = new Date(dateObj.getTime());
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const min = d.getMinutes();
    const roundMin = (min < 30) ? "00" : "30";
    return `${yyyy}-${mm}-${dd} ${hh}:${roundMin}`;
  }

  function getPreviousRoundKeyClient(){
    const now = new Date();
    const prev = new Date(now.getTime() - 30*60*1000);
    return formatRoundKeyClient(prev);
  }

  window.onload = async function() {
    const params = new URLSearchParams(window.location.search);
    myId = params.get('id') || localStorage.getItem('user_id') || localStorage.getItem('loginId');
    if (!myId) { alert("로그인이 필요합니다."); window.location.href = "../the-unique-main.html"; return; }

    // 1) 내 지갑
    await fetchUserData();

    // 2) 서버 상태 먼저 로드(usedColor 계산/라운드키 세팅)
    await fetchGameState(true);

    // 3) 내 컬러
    const savedColor = localStorage.getItem('rouletteColor_' + myId);
    if (savedColor) {
      myColor = savedColor;
      el('ruleModal').style.display = 'none';
    } else {
      initColorPicker();
    }

    requestAnimationFrame(drawGiantWheel);
    startTimer();
    startMarqueeScheduler();

    // 5초마다 동기화
    setInterval(fetchGameState, 5000);
  };

  function initColorPicker() {
    const grid = el('colorGrid');
    grid.innerHTML = "";

    const usedColors = (gameState.participants || [])
      .map(p => p.color)
      .filter(Boolean);

    availableColors.forEach(color => {
      const btn = document.createElement('div');
      btn.className = 'color-btn';
      btn.style.backgroundColor = color;
      btn.style.boxShadow = `0 0 10px ${color}`;

      if (usedColors.includes(color)) {
        btn.classList.add('disabled');
      } else {
        btn.onclick = () => pickColor(btn, color);
      }
      grid.appendChild(btn);
    });
  }

  function pickColor(btn, color) {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    myColor = color;
    el('selectedColorName').innerText = "SELECTED: " + color;
    el('btnStart').disabled = false;
  }

  function selectColorAndStart() {
    if (!myColor) return;
    localStorage.setItem('rouletteColor_' + myId, myColor);

    // 컬러 선택 후 바로 서버 동기화 한번 더
    fetchGameState();

    closeModal('ruleModal');
  }

  function closeModal(id) { el(id).classList.remove('active'); }

  async function fetchUserData() {
    try {
      const res = await fetch(`${GAS_URL}?action=getUserInfo&id=${encodeURIComponent(myId)}`);
      const data = await res.json();
      if (data.result === "success") {
        myWallet = Number(data.balance || 0);
        el('myBalance').innerText = myWallet.toLocaleString() + " UT";
      }
    } catch (e) { console.error(e); }
  }

  // ✅ 서버 상태 동기화 (핵심 수정)
  async function fetchGameState(isInitial=false) {
    if (isBettingProcessing) return;
    if (el('resultModal').classList.contains('active')) return;

    try {
      const res = await fetch(`${GAS_URL}?action=getRouletteState`);
      const data = await res.json();
      if (data.result !== "success") return;

      // lastWinner 표시(서버 기준)
      if (data.lastWinner && data.lastWinner.name) {
        lastWinnerMsg = `🏆 지난 라운드 승자: ${data.lastWinner.name} (상금: ${Number(data.lastWinner.prize||0).toLocaleString()} UT) 🏆`;
      } else {
        lastWinnerMsg = "🏆 지난 라운드 우승자가 없습니다.";
      }
      if (isInitial) updateMarquee(lastWinnerMsg, "#fff");

      const rk = String(data.roundKey || "").trim();
      const roundChanged = (currentRoundKey && rk && rk !== currentRoundKey);
      if (!currentRoundKey && rk) currentRoundKey = rk;

      // 라운드 바뀌었으면: 로컬 잔상 싹 정리
      if (roundChanged) {
        currentRoundKey = rk;
        pendingBet = null;
        // 라운드 바뀌면 베팅 입력도 기본값으로
        el('betInput').value = 10;
      } else {
        if (rk) currentRoundKey = rk;
      }

      // 서버 참가자 -> 로컬 참가자 (색 보정)
      let serverParticipants = (data.participants || []).map(sp => {
        const name = sp.name;
        let color = sp.color;

        // Company 색 고정
        if (name === "Company") color = "#ff0055";

        // 내 컬러가 있으면 내 색 우선
        if (name === myId && myColor) color = myColor;

        // 색 없으면 네온 랜덤
        if (!color) color = generateRandomNeonColor();

        return {
          name,
          amount: Number(sp.amount || 0),
          color
        };
      });

      // 같은 라운드에서만 “내 배팅 임시 표시” (최대 10초)
      if (pendingBet && pendingBet.roundKey === currentRoundKey && (Date.now() - pendingBet.ts) < 10000) {
        if (!serverParticipants.find(p => p.name === myId)) {
          serverParticipants.push({ name: myId, amount: pendingBet.potAmount, color: myColor || generateRandomNeonColor() });
        }
      }

      gameState.participants = serverParticipants;
      updateGameState();

      // 라운드가 바뀌면 마키도 lastWinner로 갱신
      if (roundChanged) updateMarquee(lastWinnerMsg, "#00f3ff");

    } catch (e) {
      console.error("Sync Error:", e);
    }
  }

  function updateGameState() {
    gameState.totalPool = gameState.participants.reduce((acc, p) => acc + (Number(p.amount)||0), 0);
    el('poolDisplay').innerText = gameState.totalPool.toLocaleString() + " UT";
    gameState.participants.sort((a, b) => b.amount - a.amount);
    updateListUI();
  }

  function updateListUI() {
    const list = el('participantList');
    list.innerHTML = "";

    if (!gameState.participants.length) {
      list.innerHTML = `<div style="text-align:center; color:#ddd; font-size:0.8rem; padding:5px;">대기중...</div>`;
      return;
    }

    gameState.participants.forEach((p, index) => {
      const highlight = (p.name === myId && myColor) ? `color:${myColor}; font-weight:900;` : '';
      list.innerHTML += `
        <div class="list-item">
          <div class="p-color" style="background:${p.color}; box-shadow: 0 0 5px ${p.color};"></div>
          <div class="p-name" style="${highlight}">${p.name}</div>
          <div class="p-amt">${Number(p.amount).toLocaleString()}</div>
        </div>`;
    });
  }

  function changeBet(val) {
    const e = el('betInput');
    let v = parseInt(e.value || "10", 10) + val;
    if (v < 10) v = 10;
    e.value = v;
  }
  function setMinBet() { el('betInput').value = 10; }
  function setMaxBet() { el('betInput').value = Math.max(10, myWallet); }

  // ✅ 베팅: 서버 응답의 potAmount를 UI에 반영 (수수료/정산 구조와 맞춤)
  function joinGame() {
    if (isBettingProcessing) return;

    const amountGross = parseInt(el('betInput').value || "0", 10);
    if (amountGross > myWallet) return alert("잔액이 부족합니다.");
    if (amountGross <= 0) return alert("금액 확인 필요");
    if (gameState.timeLeft <= 60) return alert("마감되었습니다.");

    if (!myColor) {
      // 컬러 선택 안 했으면 강제
      el('ruleModal').classList.add('active');
      el('ruleModal').style.display = '';
      return;
    }

    isBettingProcessing = true;
    const btn = el('joinBtn');
    const originalText = btn.innerText;
    btn.disabled = true;
    btn.innerText = "처리중...";

    const url = `${GAS_URL}?action=rouletteResult&type=bet&id=${encodeURIComponent(myId)}&amount=${encodeURIComponent(amountGross)}&color=${encodeURIComponent(myColor || "")}`;

    fetch(url)
      .then(res => res.json())
      .then(async data => {
        if (data.result === "success") {
          myWallet = Number(data.newBalance || 0);
          el('myBalance').innerText = myWallet.toLocaleString() + " UT";

          // 서버가 potAmount(수수료 제외 판돈)를 주면 그걸로 표시
         const gross = Number(data.gross != null ? data.gross : amountGross);
pendingBet = { roundKey: (data.roundKey || currentRoundKey), potAmount: gross, ts: Date.now() };


          btn.innerText = "배팅 성공!";
          await fetchGameState(); // 즉시 동기화
        } else {
          alert(data.msg || "베팅 실패");
          btn.innerText = originalText;
        }
      })
      .catch(err => {
        console.error(err);
        alert("통신 오류");
        btn.innerText = originalText;
      })
      .finally(() => {
        isBettingProcessing = false;
        btn.disabled = false;
        setTimeout(() => {
          if (!isBettingProcessing && gameState.timeLeft > 60) btn.innerText = originalText;
        }, 800);
      });
  }

  // ✅ 타이머: 마감 시 “로컬 랜덤 추첨” 금지. 서버 정산 결과를 기다림.
  function startTimer() {
    setInterval(async () => {
      const now = new Date();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const targetMinute = minutes < 30 ? 30 : 60;
      const remainMinutes = targetMinute - minutes - 1;
      const remainSeconds = 60 - seconds;
      gameState.timeLeft = (remainMinutes * 60) + remainSeconds;

      const displayMin = Math.floor(gameState.timeLeft / 60);
      const displaySec = gameState.timeLeft % 60;
      el('timerDisplay').innerText = `${displayMin}:${displaySec < 10 ? '0'+displaySec : displaySec}`;

      const countEl = el('centerCount');

      if (gameState.timeLeft <= 60 && gameState.timeLeft > 0) {
        countEl.innerText = gameState.timeLeft;
        countEl.classList.add('active');

        const btn = el('joinBtn');
        if (!btn.disabled) {
          btn.disabled = true;
          btn.innerText = "마감됨 (CLOSED)";
          el('timerDisplay').style.color = "red";
        }
      } else {
        const btn = el('joinBtn');
        if (btn.disabled && !isBettingProcessing && gameState.timeLeft > 60) {
          btn.disabled = false;
          btn.innerText = "참여하기 (BET)";
          el('timerDisplay').style.color = "#ff4757";
          countEl.classList.remove('active');
        }
      }

      if (gameState.timeLeft <= 10 && gameState.timeLeft > 0) {
        const words = ["Ten","Nine","Eight","Seven","Six","Five","Four","Three","Two","One"];
        speak(words[10 - gameState.timeLeft]);
      }

      // 라운드 종료 시: 서버 정산/결과 표시
      if (gameState.timeLeft <= 0 || (minutes % 30 === 0 && seconds === 0)) {
        if (!el('resultModal').classList.contains('active')) {
          countEl.classList.remove('active');
          speak("Time's up!");
          await finishRoundServerBased();
        }
      }
    }, 1000);
  }

  // ✅ 서버 정산 기반 결과 표시
  async function finishRoundServerBased() {
    const prevKey = getPreviousRoundKeyClient();

    // 1) (있으면) 서버에 정산 요청 한번 시도 (없으면 무시됨)
    try { await fetch(`${GAS_URL}?action=settleRoulettePrev`); } catch(_) {}

    // 2) 서버 lastWinner가 prevKey로 나올 때까지 잠깐 폴링
    let winnerData = null;
    for (let i=0; i<8; i++) { // 약 8초
      try {
        const res = await fetch(`${GAS_URL}?action=getRouletteState`);
        const data = await res.json();
        if (data && data.result === "success" && data.lastWinner && data.lastWinner.round) {
          if (String(data.lastWinner.round) === String(prevKey)) {
            winnerData = data.lastWinner;
            break;
          }
        }
      } catch(_) {}
      await new Promise(r => setTimeout(r, 1000));
    }

    // 3) 결과 모달 표시
    const modal = el('resultModal');
    modal.classList.add('active');

    if (!winnerData) {
      el('resWinner').innerText = "SETTLING...";
      el('resAmount').innerText = "-";
      el('resMsg').innerText = "서버 정산 중입니다. 잠시 후 NEXT ROUND를 눌러주세요.";
      el('resMsg').style.color = "#aaa";
      return;
    }

    const winnerName = winnerData.name;
    const prize = Number(winnerData.prize || 0);

    el('resWinner').innerText = winnerName;
    el('resAmount').innerText = prize.toLocaleString() + " UT";

    const color = (gameState.participants.find(p => p.name === winnerName)?.color)
      || (winnerName === "Company" ? "#ff0055" : "#fff");

    el('resWinner').style.textShadow = `0 0 30px ${color}`;

    const msgEl = el('resMsg');
    if (winnerName === myId) {
      msgEl.innerText = "축하합니다! 당신이 승자입니다! 🎉";
      msgEl.style.color = myColor || "#fff";
      speak("Congratulations! You won!");
      await fetchUserData(); // 지급 반영
    } else if (winnerName === "Company") {
      msgEl.innerText = "이번 라운드는 본사가 승리했습니다.";
      msgEl.style.color = "#ff0055";
      speak("The House Wins.");
    } else {
      msgEl.innerText = `아쉽네요... 승자는 ${winnerName}님 입니다.`;
      msgEl.style.color = "#aaa";
      speak("Better luck next time.");
    }

    // 마키 업데이트
    updateMarquee(`🏆 지난 라운드 승자: ${winnerName} (상금: ${prize.toLocaleString()} UT) 🏆`, "#00f3ff");
  }

  function resetGame() { location.reload(); }

  function startMarqueeScheduler() {
    setInterval(() => {
      updateMarquee(warningMsg, "#ffdd59");
      setTimeout(() => updateMarquee(lastWinnerMsg, "#fff"), 15000);
    }, 120000);
  }

  function drawGiantWheel() {
    const canvas = el('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const w = canvas.width;
    const h = canvas.height;

    const radius = h * 2.5;
    const centerX = radius + 50;
    const centerY = h / 2;

    gameState.rotation += 0.0035;
    ctx.clearRect(0, 0, w, h);
    ctx.save();

    let startAngle = gameState.rotation;

    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fillStyle = "#0a0a0a";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (gameState.participants.length > 0 && gameState.totalPool > 0) {
      gameState.participants.forEach(p => {
        const sliceAngle = (p.amount / gameState.totalPool) * 2 * Math.PI;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius - 20, startAngle, endAngle);
        ctx.closePath();

        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = 2;
        ctx.stroke();

        if (sliceAngle > 0.05) {
          const midAngle = startAngle + sliceAngle / 2;
          const textRadius = radius - 120;
          const tx = centerX + Math.cos(midAngle) * textRadius;
          const ty = centerY + Math.sin(midAngle) * textRadius;

          ctx.save();
          ctx.translate(tx, ty);
          ctx.rotate(midAngle + Math.PI);

          ctx.textAlign = "right";
          ctx.textBaseline = "middle";

          ctx.fillStyle = "#fff";
          ctx.font = "bold 40px Pretendard";
          ctx.shadowColor = "rgba(0,0,0,0.8)";
          ctx.shadowBlur = 4;
          ctx.fillText(p.name, 0, -20);

          ctx.fillStyle = "#ffd700";
          ctx.font = "bold 24px monospace";
          ctx.fillText(p.amount.toLocaleString() + " UT", 0, 20);

          ctx.restore();
        }
        startAngle = endAngle;
      });
    } else {
      ctx.font = "bold 50px Pretendard";
      ctx.fillStyle = "#333";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText("WAITING FOR PLAYERS...", centerX - radius + 400, centerY);
    }

    const grad = ctx.createRadialGradient(centerX, centerY, radius * 0.95, centerX, centerY, radius);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.3)");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
    requestAnimationFrame(drawGiantWheel);
  }
</script>
