<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: So.T ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    /* =========================================
       1. So.T Button Style (User Provided)
       ========================================= */
    .action-btn.action-btn-sot{
      position: relative; overflow: hidden; border: 0; padding: 0;
      min-height: 64px; border-radius: 999px; cursor: pointer; width: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(0,247,255,0.18), transparent 45%),
                  radial-gradient(circle at 70% 70%, rgba(251,191,36,0.16), transparent 48%),
                  linear-gradient(180deg, rgba(2,6,23,0.82), rgba(2,6,23,0.55));
      box-shadow: 0 18px 40px rgba(0,0,0,0.95), 0 0 0 1px rgba(15,23,42,0.9) inset;
      transform: translateZ(0); transition: all 0.2s;
    }
    .action-btn.action-btn-sot::before{
      content:""; position:absolute; inset:-10px;
      background: conic-gradient(from 180deg, rgba(0,247,255,0.95), rgba(168,85,247,0.95), rgba(251,191,36,0.95), rgba(0,247,255,0.95));
      filter: blur(16px); opacity: .55; animation: sotGlowSpin 3.2s linear infinite; pointer-events:none;
    }
    .action-btn.action-btn-sot::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.22) 28%, transparent 60%);
      transform: translateX(-140%); animation: sotShine 2.6s ease-in-out infinite; pointer-events:none; mix-blend-mode: screen; opacity: .9;
    }
    .action-btn.action-btn-sot .sot-inner{
      position: relative; z-index: 2; display:flex; align-items:center; justify-content:center;
      gap:10px; width:100%; height: 100%; color: #fff; font-weight: 900; font-size: 18px;
      text-shadow: 0 0 10px rgba(251,191,36,0.5);
    }
    .sot-text-logo {
        font-family: 'Cinzel', serif; background: linear-gradient(to right, #ffd700, #fff, #ffd700);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 5px rgba(255,215,0,0.5));
    }
    .action-btn.action-btn-sot:hover{ transform: translateY(-2px) scale(1.01); filter: brightness(1.06); box-shadow: 0 22px 48px rgba(0,0,0,0.98), 0 0 0 1px rgba(251,191,36,0.55) inset; }
    .action-btn.action-btn-sot:active{ transform: translateY(0) scale(0.995); }
    .action-btn.action-btn-sot:disabled { filter: grayscale(1) brightness(0.5); cursor: not-allowed; animation: none; }

    @keyframes sotGlowSpin{ 0%{ transform: rotate(0deg); } 100%{ transform: rotate(360deg); } }
    @keyframes sotShine{ 0%{ transform: translateX(-140%); } 45%{ transform: translateX(140%); } 100%{ transform: translateX(140%); } }

    /* =========================================
       2. Base & Layout
       ========================================= */
    :root{
      --bg-dark: #050510;
      --panel-bg: rgba(10, 10, 15, 0.85); /* PC 패널 배경 */
      --gold-1: #ffd700; --gold-2: #bf953f; --danger: #ff0044;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg-dark);
      /* 전체 화면 그라디언트 */
      background: radial-gradient(circle at 30% 50%, #1a1a2e 0%, #000000 100%);
      color: #fff; font-family: 'Cinzel', serif, system-ui; overflow: hidden;
    }

    /* Marquee (Top) */
    .marquee-wrap {
      position: fixed; top: 0; width: 100%; height: 40px;
      background: rgba(0,0,0,0.9); border-bottom: 1px solid rgba(255,215,0,0.3);
      display: flex; align-items: center; z-index: 200;
      backdrop-filter: blur(5px);
    }
    .marquee-text {
      width: 100%; text-align: center; font-weight: 700; color: var(--gold-1);
      font-size: 14px; letter-spacing: 1px;
    }

    /* Canvas (Full Screen Background) */
    canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; display: block;
    }

    /* =========================================
       3. Responsive Layout (PC vs Mobile)
       ========================================= */
    
    /* [공통] UI 컨테이너 */
    .ui-container {
      position: fixed; z-index: 100;
      /* PC 기본값 */
      top: 40px; bottom: 0; right: 0; width: 420px;
      background: var(--panel-bg);
      border-left: 1px solid rgba(255,215,0,0.2);
      backdrop-filter: blur(15px);
      display: flex; flex-direction: column;
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
    }

    /* [공통] 포인터 (화살표) */
    .pointer-wrap {
      position: absolute; z-index: 50;
      /* JS로 위치 미세조정하지만 CSS로 기본 잡아둠 */
      display: flex; align-items: center;
      filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.8));
    }
    /* 화살표 이미지 대체 (CSS Shape) - 심플하고 명확하게 */
    .pointer-arrow {
      width: 0; height: 0;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-left: 50px solid linear-gradient(to right, #ffdd00, #ffaa00); /* Not working on border */
      /* 보더 그라디언트 흉내 */
      border-left: 50px solid #ffd700; 
    }
    /* 조금 더 고급진 화살표 (CSS Gradient) */
    .pointer-shape {
      width: 80px; height: 50px;
      background: linear-gradient(90deg, #ff8c00, #ffd700);
      clip-path: polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
    }

    /* [모바일] 레이아웃 오버라이드 */
    @media (max-width: 1023px) {
      .ui-container {
        width: 100%; height: 45%; /* 화면 하단 45% 차지 */
        top: auto; bottom: 0; right: 0; left: 0;
        border-left: none; border-top: 1px solid rgba(255,215,0,0.2);
      }
      /* 모바일 포인터 위치: 상단 휠 영역의 중앙 하단? 아니면 오른쪽? 
         보통 모바일 세로모드는 휠이 위쪽에 있고 포인터가 아래(6시)나 위(12시)에 있음.
         JS에서 다시 잡겠지만, 일단 숨김 처리 후 JS 제어 */
    }

    /* UI 요소들 */
    .hud-row { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .label { font-size: 12px; color: #888; font-weight: 700; letter-spacing: 1px; }
    .value-lg { font-size: 28px; font-weight: 900; color: var(--gold-1); }
    .timer { font-size: 24px; font-weight: 700; color: #fff; font-family: monospace; }
    .timer.alert { color: var(--danger); animation: blink 0.8s infinite; }
    
    .list-wrap { flex: 1; overflow-y: auto; padding: 10px; min-height: 100px; }
    .rank-item { display: flex; align-items: center; padding: 8px 12px; margin-bottom: 6px; background: rgba(255,255,255,0.03); border-radius: 8px; }
    .rank-item.me { background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent); border: 1px solid rgba(255,215,0,0.2); }
    .p-col { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 8px currentColor; }
    .p-name { flex: 1; font-size: 14px; font-weight: 600; color: #e0e0e0; }
    .p-amt { font-size: 14px; color: var(--gold-1); font-weight: 700; }

    /* 컨트롤 (버튼 안 짤리게 패딩 조정) */
    .ctrl-area { padding: 20px; background: rgba(0,0,0,0.4); }
    .bet-inputs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .btn-chip {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff;
      border-radius: 8px; height: 48px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .btn-chip:hover { background: rgba(255,255,255,0.2); }
    .btn-chip:active { transform: scale(0.96); }
    .inp-amt {
      background: #000; border: 1px solid var(--gold-2); color: var(--gold-1);
      text-align: center; font-size: 16px; font-weight: 700; border-radius: 8px; outline: none; width: 100%;
    }

    /* 카운트다운 (중앙) */
    .countdown-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 150;
    }
    .cd-num {
      font-size: 120px; font-weight: 900; color: #fff;
      text-shadow: 0 0 30px var(--danger); opacity: 0; transition: transform 0.2s;
    }
    .cd-num.active { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }

    /* 모달 */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300;
      display: none; justify-content: center; align-items: center;
    }
    .modal-mask.on { display: flex; }
    .modal-body {
      width: 90%; max-width: 400px; background: #151515; border: 2px solid var(--gold-2);
      border-radius: 12px; padding: 30px; text-align: center;
    }
    .c-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
    .c-btn { height: 45px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .c-btn.sel { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 15px #fff; }

    @keyframes blink { 50% { opacity: 0.5; } }

  </style>
</head>
<body>
  <div class="marquee-wrap"><div class="marquee-text" id="mqText">♠ So.T ROYAL CASINO - High Stakes ♠</div></div>

  <canvas id="cvs"></canvas>

  <div id="pointer" class="pointer-wrap">
    <div class="pointer-shape"></div>
  </div>

  <div class="countdown-box"><div id="cdNum" class="cd-num"></div></div>

  <aside class="ui-container">
    <div class="hud-row">
      <div><div class="label">TOTAL POOL</div><div class="value-lg" id="poolDisp">0 UT</div></div>
      <div style="text-align:right;"><div class="label">TIME LEFT</div><div class="timer" id="timerDisp">--:--</div></div>
    </div>
    
    <div class="list-wrap" id="pList">
      <div style="text-align:center; padding:20px; color:#555;">Waiting...</div>
    </div>
    
    <div class="ctrl-area">
      <div class="bet-inputs">
        <button class="btn-chip" id="bMin">MIN</button>
        <button class="btn-chip" id="bM100">-100</button>
        <input type="number" id="inpBet" class="inp-amt" value="100" readonly />
        <button class="btn-chip" id="bP100">+100</button>
        <button class="btn-chip" id="bMax">MAX</button>
      </div>

      <button id="bJoin" class="action-btn action-btn-sot" type="button">
        <span class="sot-inner" id="btnText">
          <span class="sot-text-logo">So.T</span> BET NOW
        </span>
      </button>

      <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:13px; color:#aaa;">
        <span>MY WALLET</span><span style="color:#fff; font-weight:700;" id="myBal">Loading...</span>
      </div>
    </div>
  </aside>

  <div id="mdColor" class="modal-mask">
    <div class="modal-body">
      <h2 style="color:var(--gold-1); margin:0;">SELECT COLOR</h2>
      <div class="c-grid" id="cGrid"></div>
      <button id="bColorOk" class="action-btn action-btn-sot" style="min-height:50px; font-size:14px;" disabled><span class="sot-inner">CONFIRM</span></button>
    </div>
  </div>

  <div id="mdRes" class="modal-mask">
    <div class="modal-body">
      <h2 style="color:var(--gold-1); font-size:30px; margin-bottom:10px;">RESULT</h2>
      <div style="color:#888; font-size:12px;">WINNER</div>
      <div id="resName" style="font-size:32px; font-weight:900; color:#fff; margin:10px 0;">-</div>
      <div id="resAmt" style="font-size:24px; color:var(--gold-1); font-weight:900;">-</div>
      <div id="resDesc" style="margin-top:20px; color:#ccc;">다음 라운드 대기중...</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";
    const MIN_BET = 100;
    const RPM_BASE = 2.0;

    let myId = "", myWallet = 0, myColor = null;
    let roundKey = null, participants = [], totalPool = 0;
    
    let rotation = 0, wheelState = "SPINNING";
    let stopTargetAngle = 0, stopStartTime = 0;
    const STOP_DURATION = 7000;

    let isLocked = false, isBetting = false;
    let serverOffset = 0, nextRoundMs = 0;
    
    // PC/Mobile 구분 플래그
    let isPC = window.innerWidth >= 1024;

    const synth = window.speechSynthesis;
    const colors = ['#ff0055','#00ffaa','#ffdd00','#00ccff','#ff3300','#aa00ff','#ffffff','#ff00cc','#33ff00','#0055ff','#ffaa00','#cc00ff','#0099ff','#ff6600','#aaaaaa'];

    const $ = (id) => document.getElementById(id);
    const toMoney = (n) => Number(n).toLocaleString();
    function speak(txt){ if(synth && !synth.speaking){ const u = new SpeechSynthesisUtterance(txt); u.lang='en-US'; u.rate=1.1; synth.speak(u); }}

    // ============================================
    // 🎨 캔버스 & 레이아웃 로직 (핵심)
    // ============================================
    function updateLayoutMetrics() {
      isPC = window.innerWidth >= 1024;
      const ptr = $("pointer");
      const w = window.innerWidth;
      const h = window.innerHeight;

      if(isPC) {
        // [PC] 화살표: 왼쪽 중앙 고정 (left: 50px)
        ptr.style.left = "50px";
        ptr.style.top = "50%";
        ptr.style.transform = "translateY(-50%)"; // 회전 없음 (오른쪽 가리킴)
        ptr.style.right = "auto";
        ptr.style.bottom = "auto";
        
        // 휠 중심점 계산 (화살표 끝과 휠 왼쪽이 닿게)
        // 화살표 너비 약 80px + 여백 50px = 130px 지점이 접점.
        // 휠 반지름을 엄청 크게 해서(화면 꽉 차게) 접점이 130px에 오도록 함.
        return {
          r: h * 1.1, // 반지름을 화면 높이보다 크게
          cx: 130 + (h * 1.1), // 접점(130) + 반지름 = 중심점 X
          cy: h / 2,
          pointerAngle: Math.PI // 휠 입장에선 9시 방향(PI)이 화살표 위치
        };
      } else {
        // [Mobile] 화살표: 상단 휠 영역 중앙 상단 (top: 90px)
        // 12시 방향에서 아래를 가리키게
        ptr.style.left = "50%";
        ptr.style.top = "80px"; // 마키바 아래
        ptr.style.transform = "translateX(-50%) rotate(90deg)"; // 아래 가리킴
        ptr.style.right = "auto";
        ptr.style.bottom = "auto";

        return {
          r: w * 0.85,
          cx: w / 2,
          cy: w * 0.85 + 100, // 화면 위쪽 밖으로 중심을 밀어서 아랫부분만 보이게? 
                              // 아니면 아래에 휠 두고 위를 보게?
                              // 보통 모바일은 휠 전체가 보이거나, 위에 반원.
                              // 여기선 화살표가 위에 있으므로, 휠 중심은 화살표보다 아래에 있어야 함.
                              // 접점 Y = 80px + 화살표 길이(80) = 160px.
                              // cy = 160 + r.
          cy: 130 + (w * 0.85),
          pointerAngle: -Math.PI / 2 // 12시 방향 (270도 = -90도)
        };
      }
    }

    function draw() {
      const cvs = $("cvs");
      const ctx = cvs.getContext("2d");
      const w = window.innerWidth, h = window.innerHeight;
      if(cvs.width !== w || cvs.height !== h){ cvs.width = w; cvs.height = h; }

      ctx.clearRect(0, 0, w, h);

      // 레이아웃 수치 계산
      const m = updateLayoutMetrics(); 
      const { cx, cy, r } = m;

      // 회전
      if (wheelState === "SPINNING") {
        rotation += (RPM_BASE * Math.PI / 180);
      } else if (wheelState === "STOPPING") {
        const now = Date.now();
        const t = Math.min(1, (now - stopStartTime) / STOP_DURATION);
        const ease = 1 - Math.pow(1 - t, 4);
        rotation = window.startRotation + (stopTargetAngle - window.startRotation) * ease;
        if (t >= 1) { wheelState = "STOPPED"; showResultModal(); }
      } 

      // 1. 휠 테두리 (골드)
      ctx.save();
      ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=30;
      const gradRim = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
      gradRim.addColorStop(0, '#ffd700'); gradRim.addColorStop(0.5, '#b8860b'); gradRim.addColorStop(1, '#ffd700');
      ctx.beginPath(); ctx.arc(cx, cy, r+15, 0, Math.PI*2); ctx.fillStyle = gradRim; ctx.fill();
      ctx.restore();

      // 2. 휠 배경 (어두운 색)
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fillStyle = '#1a1005'; ctx.fill();

      // 3. 조각 (Slices)
      let startAng = rotation;
      const total = totalPool || 1; 
      
      if(participants.length > 0) {
        participants.forEach(p => {
          const slice = (p.amount / total) * 2 * Math.PI;
          const endAng = startAng + slice;

          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r-5, startAng, endAng);
          ctx.fillStyle = p.color; ctx.fill();
          ctx.lineWidth=2; ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.stroke();

          // 텍스트 (바깥쪽에 가깝게)
          if(slice > 0.05) {
            const mid = startAng + slice/2;
            const tx = cx + Math.cos(mid) * (r*0.85);
            const ty = cy + Math.sin(mid) * (r*0.85);
            ctx.save(); ctx.translate(tx, ty); 
            // 텍스트 각도: 중심에서 뻗어나가게 + 90도 (가로로 읽기 편하게)
            // 혹은 중심을 바라보게: mid + Math.PI
            ctx.rotate(mid + Math.PI); 
            
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillStyle = "#fff"; ctx.font = "800 16px sans-serif"; ctx.shadowColor="#000"; ctx.shadowBlur=4;
            
            let n = p.name; if(n.length>6) n=n.slice(0,5)+"..";
            ctx.fillText(n, 0, -10);
            ctx.fillStyle = "#ffd700"; ctx.font = "700 12px monospace";
            ctx.fillText(toMoney(p.amount), 0, 10);
            ctx.restore();
          }
          startAng = endAng;
        });
      }

      // 4. 중앙 캡
      const capR = r * 0.15; // 너무 크면 내용 가림. 비율 조정.
      // PC 모드에서 캡이 너무 크면 화면 다 가릴 수 있음. max값 제한.
      const safeCapR = Math.min(capR, 150);
      
      const gradCap = ctx.createRadialGradient(cx, cy, 0, cx, cy, safeCapR);
      gradCap.addColorStop(0, '#fff'); gradCap.addColorStop(0.3, '#ffd700'); gradCap.addColorStop(1, '#aa771c');
      ctx.save(); ctx.shadowBlur=20; ctx.shadowColor="black";
      ctx.beginPath(); ctx.arc(cx, cy, safeCapR, 0, Math.PI*2); ctx.fillStyle = gradCap; ctx.fill();
      ctx.restore();

      requestAnimationFrame(draw);
    }

    // 멈춤 로직
    function spinToWin(winnerName) {
      if (wheelState !== "SPINNING") return;
      const winIndices = [];
      participants.forEach((p, i) => { if(p.name === winnerName) winIndices.push(i); });
      if(winIndices.length === 0) return; // 당첨자 없음 (혹은 시드)

      const targetIndex = winIndices[Math.floor(Math.random() * winIndices.length)];
      let currentAngleSum = 0, targetSliceMid = 0;
      const total = totalPool || 1;
      for(let i=0; i<participants.length; i++){
        const slice = (participants[i].amount / total) * 2 * Math.PI;
        if(i === targetIndex) { targetSliceMid = currentAngleSum + slice/2; break; }
        currentAngleSum += slice;
      }

      const currentRot = rotation;
      const extraSpins = Math.PI * 2 * 3; 
      
      // 멈춰야 할 포인터 각도 가져오기
      const m = updateLayoutMetrics();
      // 공식: (최종회전각 + 조각중심각) % 2PI = 포인터각도
      // => 최종회전각 = 포인터각도 - 조각중심각
      let dest = m.pointerAngle - targetSliceMid;
      
      while(dest < currentRot + extraSpins) dest += Math.PI * 2;
      
      stopTargetAngle = dest; window.startRotation = currentRot;
      stopStartTime = Date.now(); wheelState = "STOPPING";
    }

    // API & State
    async function api(act, p={}){ const r=await fetch(GAS_URL+"?"+new URLSearchParams({action:act,...p,_:Date.now()})); return await r.json(); }
    async function updateState(){
      if(wheelState === "STOPPING" || wheelState === "STOPPED") return;
      try {
        const d = await api("getRouletteState");
        if(d.result!=="success") return;
        if(d.serverTs) serverOffset = d.serverTs - Date.now();
        if(d.nextRoundAtMs) nextRoundMs = d.nextRoundAtMs;
        const nk = String(d.roundKey);
        if(roundKey && nk !== roundKey) resetGame(nk);
        roundKey = nk;
        participants = (d.participants||[]).map(p=>({name:p.name, amount:Number(p.amount), color:p.color}));
        totalPool = participants.reduce((a,c)=>a+c.amount,0);
        $("poolDisp").innerText = toMoney(totalPool) + " UT";
        renderList();
      } catch(e){}
    }
    function renderList(){
      const el=$("pList"); el.innerHTML="";
      participants.forEach(p=>{
        el.innerHTML += `<div class="rank-item ${p.name===myId?'me':''}"><div class="p-col" style="background:${p.color}"></div><div class="p-name">${p.name}</div><div class="p-amt">${toMoney(p.amount)}</div></div>`;
      });
      el.scrollTop = el.scrollHeight;
    }
    function resetGame(nk) {
      wheelState = "SPINNING"; $("mdRes").style.display="none"; 
      isLocked = false; $("bJoin").disabled = false; $("btnText").innerHTML = '<span class="sot-text-logo">So.T</span> BET NOW';
      $("timerDisp").classList.remove("alert"); $("pList").innerHTML = "<div style='text-align:center;padding:20px;color:#777;'>Waiting...</div>";
      participants = []; totalPool = 0;
    }
    async function checkWinnerAndStop(){
       if(wheelState !== "SPINNING") return;
       const d = await api("getRouletteState");
       if(d.lastWinner && String(d.lastWinner.round) === String(roundKey)) {
         spinToWin(d.lastWinner.name);
         $("resName").innerText = d.lastWinner.name;
         $("resAmt").innerText = toMoney(d.lastWinner.prize) + " UT";
       }
    }
    function showResultModal(){ $("mdRes").style.display="flex"; }

    // Timer & Ctrl
    function startTimer(){
      setInterval(() => {
        if(!nextRoundMs) return;
        const now = Date.now() + serverOffset;
        let diff = Math.floor((nextRoundMs - now)/1000);
        if(diff < 0) diff = 0;
        const mm=Math.floor(diff/60), ss=diff%60;
        $("timerDisp").innerText = `${mm}:${ss<10?'0'+ss:ss}`;

        if(diff <= 0 && !isLocked) {
          isLocked = true; $("bJoin").disabled = true; 
          $("btnText").innerText = "CLOSED";
          $("timerDisp").classList.add("alert"); speak("Betting Closed");
          setTimeout(checkWinnerAndStop, 2000); setTimeout(checkWinnerAndStop, 6000);
        }
        const cd=$("cdNum");
        if(diff<=10 && diff>0 && wheelState==="SPINNING"){ cd.innerText=diff; cd.classList.add("active"); speak(String(diff)); }
        else { cd.classList.remove("active"); }
      }, 1000);
    }

    const setB=v=>$("inpBet").value=v;
    $("bMin").onclick=()=>setB(MIN_BET); $("bMax").onclick=()=>setB(Math.floor(myWallet/100)*100);
    $("bM100").onclick=()=>{let v=Number($("inpBet").value)-100; if(v<MIN_BET)v=MIN_BET; setB(v);};
    $("bP100").onclick=()=>{let v=Number($("inpBet").value)+100; if(v>myWallet)v=myWallet; setB(v);};

    $("bJoin").onclick = async () => {
      if(isLocked) return alert("마감되었습니다.");
      const amt=Number($("inpBet").value);
      if(amt>myWallet)return alert("잔액 부족");
      
      const btn=$("bJoin"); const btnTxt=$("btnText");
      btn.disabled=true; btnTxt.innerText="PROCESSING...";
      try{
        const r=await api("rouletteResult",{type:"bet",id:myId,amount:amt,color:myColor});
        if(r.result==="success"){
          myWallet=r.newBalance; $("myBal").innerText=toMoney(myWallet)+" UT"; updateState();
        } else alert(r.msg);
      }catch(e){}
      btn.disabled=false; btnTxt.innerHTML='<span class="sot-text-logo">So.T</span> BET NOW';
    };

    $("bColorOk").onclick=()=>{ if(!myColor)return; localStorage.setItem("c_"+myId,myColor); $("mdColor").style.display="none"; };

    window.onload = async () => {
      const p = new URLSearchParams(location.search); myId = p.get("id") || "Guest";
      const sc = localStorage.getItem("c_"+myId);
      if(sc) myColor=sc; 
      else {
        const g=$("cGrid"); colors.forEach(c=>{ const d=document.createElement("div"); d.className="c-btn"; d.style.backgroundColor=c; d.style.boxShadow=`0 0 10px ${c}`; d.onclick=()=>{document.querySelectorAll(".c-btn").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");myColor=c; $("bColorOk").disabled=false;}; g.appendChild(d); }); $("mdColor").style.display="flex";
      }
      try{ const u=await api("getUserInfo",{id:myId}); if(u.result==="success") myWallet=u.balance; $("myBal").innerText=toMoney(myWallet)+" UT"; }catch(e){}
      updateState(); setInterval(updateState, 2000); startTimer(); draw();
      window.addEventListener('resize', draw);
    };
  </script>
</body>
</html>
