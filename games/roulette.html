<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050508;
      --panel-bg: rgba(12, 14, 20, 0.95);
      --gold-1: #ffd700;
      --gold-2: #d4af37;
      --gold-3: #ffdf7a;
      --danger: #ff0044;
      --accent-blue: #00f0ff;
      --neon-orange: #ff6600;
      --line: rgba(255,215,0,0.25);

      /* ✅ 휠 크기 조절은 여기만! (1.0 기본, 0.9 작게, 1.1 크게) */
      --wheel-scale: 1.00;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(circle at 70% 40%, #150a20 0%, #000000 90%);
      background-color: var(--bg-dark);
      color:#fff;
      font-family:'Cinzel', serif;
    }

    /* ====== 상단 마퀴 ====== */
    .marquee-wrap{
      position:fixed; top:0; left:0; right:0;
      height:40px; z-index:300;
      background: rgba(0,0,0,0.95);
      border-bottom: 1px solid rgba(255,215,0,0.2);
      overflow:hidden;
      display:flex; align-items:center;
    }
    .marquee-content{ display:flex; animation: scroll 60s linear infinite; }
    .marquee-text{
      white-space: nowrap;
      font-weight: 700;
      color: var(--gold-2);
      font-size: 14px;
      letter-spacing: 2px;
      padding: 0 60px;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ====== 음악 바(예전 버전 유지) ====== */
    .music-bar{
      position:fixed; top:48px; left:16px; z-index:290;
      display:flex; align-items:center; gap:8px;
      background: rgba(20, 20, 30, 0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.7);
      user-select:none;
    }
    .mb-btn{
      width:40px; height:40px; border-radius:50%;
      border:none; cursor:pointer;
      background: rgba(255,255,255,0.06);
      color:#ddd;
      display:flex; align-items:center; justify-content:center;
      font-size:18px;
      transition: .18s;
    }
    .mb-btn:hover{ transform: scale(1.08); background: rgba(255,255,255,0.18); color:#fff; }
    .v-sep{ width:1px; height:22px; background: rgba(255,255,255,0.22); margin:0 4px; }
    .track-label{
      font-family: monospace;
      font-size: 12px;
      color:#bbb;
      margin-left:4px;
      min-width:72px;
      text-align:right;
    }

    /* ====== 동기화 배지 ====== */
    .sync-badge{
      position:fixed;
      top: 98px;
      left: 18px;
      z-index: 295;
      font-family: monospace;
      font-size: 12px;
      color: #bbb;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 6px 10px;
      backdrop-filter: blur(10px);
    }
    .sync-badge b{ color: var(--gold-1); }

    /* ====== 레이아웃 ====== */
    .layout{ padding-top:40px; }
    .wheel-section{ position:relative; width:100%; background: transparent; }
    canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

    /* ✅ 포인터(12시 고정, PC/모바일 통일) */
    #pointer{
      position:absolute;
      z-index: 80;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0;
      pointer-events:none;
      filter: drop-shadow(0 0 18px rgba(255, 140, 0, 0.8));
    }
    .pointer-tri{
      width:0; height:0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 34px solid #ff8a00;
      filter: drop-shadow(0 0 10px rgba(255,140,0,0.8));
    }
    .pointer-ball{
      width:22px; height:22px;
      border-radius:50%;
      margin-top:-10px;
      background: radial-gradient(circle at 30% 30%, #fff6b0 0%, #ffd700 25%, #b8860b 70%, #3a2b12 100%);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 20px rgba(0,0,0,0.55);
    }

    /* 중앙 카운트다운 */
    .countdown-box{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none;
      z-index:150;
    }
    #cdNum{
      font-size: 180px;
      font-weight: 900;
      color:#fff;
      -webkit-text-stroke: 4px var(--danger);
      text-shadow: 0 0 60px var(--danger);
      opacity:0;
      transform: scale(0.98);
      transition: opacity .12s, transform .12s;
    }
    #cdNum.on{ opacity:1; transform: scale(1.05); }
    #cdNum.blink{ animation: cdBlink .45s infinite alternate; }
    @keyframes cdBlink{ from{ opacity:1 } to{ opacity:.25 } }

    /* 배팅 이펙트 */
    .betfx{ position:absolute; z-index:160; pointer-events:none; }
    .betfx .chip{
      position:absolute;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-family: monospace;
      color:#111;
      background: #ffd700;
      box-shadow: 0 8px 22px rgba(0,0,0,0.65);
      opacity:0;
      transform: translateY(12px) scale(.95);
      animation: chipPop .9s ease-out forwards;
      white-space:nowrap;
    }
    @keyframes chipPop{
      0%{ opacity:0; transform: translateY(12px) scale(.95); }
      25%{ opacity:1; transform: translateY(0) scale(1.05); }
      100%{ opacity:0; transform: translateY(-26px) scale(1.0); }
    }

    /* 우측 패널 */
    .ui-container{
      background: var(--panel-bg);
      border-left: 1px solid var(--line);
      display:flex; flex-direction:column;
      backdrop-filter: blur(18px);
      box-shadow: -10px 0 80px rgba(0,0,0,0.9);
    }

    .hud-row{
      padding:18px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display:flex; justify-content:space-between; align-items:flex-end;
      gap:14px;
    }
    .label{
      font-size:11px;
      color:#8a8a8a;
      font-weight:700;
      letter-spacing:2px;
      text-transform:uppercase;
    }
    .value-lg{
      font-size:34px;
      font-weight:900;
      color: var(--gold-1);
      line-height:1;
    }
    .timer{
      font-size:26px;
      font-weight:800;
      color:#fff;
      font-family: monospace;
      line-height:1;
    }

    .ctrl-area{
      padding:18px;
      background: rgba(0,0,0,0.48);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .bet-inputs{
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:16px;
    }
    .btn-chip, .inp-amt{ height:50px; border-radius: 12px; width:100%; }
    .btn-chip{
      background: linear-gradient(180deg, #2a2a35, #16161d);
      border: 1px solid rgba(255,255,255,0.22);
      color:#d6d6d6;
      font-weight: 800;
      cursor:pointer;
      transition:.15s;
    }
    .btn-chip:hover{
      color:#fff;
      border-color: rgba(255,215,0,0.55);
      background: linear-gradient(180deg, #343445, #1b1b24);
    }
    .inp-amt{
      background: rgba(0,0,0,0.72);
      border: 2px solid rgba(255,215,0,0.75);
      color: var(--gold-1);
      text-align:center;
      font-size: 18px;
      font-weight: 900;
      outline:none;
      font-family: monospace;
    }

    /* ✅ 예전 화려한 버튼 유지 */
    .action-btn.action-btn-sot{
      position: relative; overflow: hidden; border: 0; padding: 0;
      min-height: 60px; border-radius: 999px; width: 100%; cursor: pointer;
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1) inset;
      transform: translateZ(0); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .action-btn.action-btn-sot::before{
      content:""; position:absolute; inset:-10px;
      background: conic-gradient(from 180deg, rgba(0,247,255,0.95), rgba(168,85,247,0.95), rgba(251,191,36,0.95), rgba(0,247,255,0.95));
      filter: blur(16px); opacity: .55; animation: sotGlowSpin 3.2s linear infinite; pointer-events:none;
    }
    .action-btn.action-btn-sot::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.22) 28%, transparent 60%);
      transform: translateX(-140%); animation: sotShine 2.6s ease-in-out infinite; pointer-events:none; mix-blend-mode: screen; opacity: .9;
    }
    .action-btn.action-btn-sot:hover{ transform: translateY(-2px); box-shadow: 0 15px 40px rgba(0,255,170,0.2); }
    .action-btn.action-btn-sot:active{ transform: translateY(0) scale(0.995); }
    .action-btn.action-btn-sot:disabled { filter: grayscale(1) brightness(0.5); cursor: not-allowed; animation: none; }

    .unique-inner{
      position: relative; z-index:2;
      display:flex; align-items:center; justify-content:center;
      gap:10px; width:100%;
      color:#fff; font-weight: 900; font-size: 20px; letter-spacing: 1px;
    }
    .unique-logo-text{
      font-family: 'Cinzel', serif;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(to bottom, #fff, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(255,215,0,0.8));
    }
    @keyframes sotGlowSpin{ 0%{ transform: rotate(0deg); } 100%{ transform: rotate(360deg); } }
    @keyframes sotShine{ 0%{ transform: translateX(-140%); } 45%{ transform: translateX(140%); } 100%{ transform: translateX(140%); } }

    .wallet-row{
      display:flex; justify-content:space-between;
      margin-top:14px;
      font-size:13px;
      color:#aaa;
      font-weight:700;
      letter-spacing:.5px;
    }
    .wallet-row #myBal{
      color: var(--gold-1);
      font-size:16px;
      font-family: monospace;
    }

    .list-wrap{ flex:1; overflow:auto; padding:14px; }
    .rank-item{
      display:flex; align-items:center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .rank-item.me{
      background: linear-gradient(90deg, rgba(255,215,0,0.16), transparent);
      border-color: rgba(255,215,0,0.35);
    }
    .p-col{ width:12px; height:12px; border-radius:50%; margin-right: 12px; box-shadow: 0 0 10px currentColor; }
    .p-name{ flex:1; font-size: 14px; font-weight: 800; color:#e8e8e8; }
    .p-amt{ font-size: 14px; color: var(--gold-1); font-weight: 900; font-family: monospace; }

    /* 모달 */
    .modal-mask{
      position:fixed; inset:0;
      background: rgba(0,0,0,0.92);
      z-index:400;
      display:none;
      justify-content:center; align-items:center;
      backdrop-filter: blur(16px);
      padding: 18px;
    }
    .modal-mask.on{ display:flex; }
    .modal-body{
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      border: 2px solid rgba(255,215,0,0.55);
      background: radial-gradient(circle, #2a1a3a 0%, #111 100%);
      box-shadow: 0 0 80px rgba(0,0,0,0.8);
      padding: 34px 26px 26px;
      text-align:center;
    }
    .win-title{
      font-size: 40px;
      font-weight: 900;
      color: var(--gold-1);
      margin: 0 0 10px;
      text-shadow: 0 0 26px rgba(255,215,0,0.7);
    }
    #resName{
      font-size: 46px;
      font-weight: 900;
      color:#fff;
      margin: 10px 0 6px;
      text-shadow: 0 6px 18px rgba(0,0,0,0.85);
      word-break: break-word;
    }
    #resAmt{
      font-size: 28px;
      color: var(--gold-3);
      font-weight: 900;
      font-family: monospace;
      margin-bottom: 10px;
    }
    #resHint{
      color:#cfcfcf;
      font-weight: 700;
      letter-spacing:.5px;
      font-size: 13px;
      margin-top: 8px;
    }

    /* PC / 모바일 */
    @media (min-width: 1024px){
      body{ overflow:hidden; }
      .wheel-section{
        position:fixed;
        top:40px; left:0; right:0; bottom:0;
      }
      .ui-container{
        position:fixed;
        top:40px; right:0; bottom:0;
        width:420px;
      }
      .layout{ padding-top:40px; }
      .wheel-section{ padding-right:420px; }
      .music-bar{ top:56px; left:18px; }
      .sync-badge{ top:108px; left:18px; }
    }

    @media (max-width: 1023px){
      body{ overflow-y:auto; overflow-x:hidden; }
      .layout{ padding-top:40px; }
      .wheel-section{
        height: min(72vh, 560px);
        margin-top: 0;
      }
      .ui-container{
        position:relative;
        width:100%;
        border-left:none;
        border-top: 1px solid var(--line);
        box-shadow:none;
        min-height: calc(100vh - 40px);
      }
      .music-bar{ top:48px; left:12px; }
      .sync-badge{ top:98px; left:12px; }
    }
  </style>
</head>

<body>
  <div class="marquee-wrap">
    <div class="marquee-content">
      <span class="marquee-text" id="mqText1">💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎</span>
      <span class="marquee-text" id="mqText2">💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎</span>
    </div>
  </div>

  <div class="music-bar">
    <button class="mb-btn" id="prevBtn" title="Prev">⏮</button>
    <button class="mb-btn" id="playBtn" title="Play">▶</button>
    <button class="mb-btn" id="pauseBtn" title="Pause">⏸</button>

  <div class="sync-badge" id="syncBadge">동기화: <b>LOCAL</b> (서버 응답 없음)</div>

  <div class="layout">
    <!-- 휠 영역 -->
    <section class="wheel-section" id="wheelSection">
      <canvas id="cvs"></canvas>
      <div id="pointer"><div class="pointer-tri"></div><div class="pointer-ball"></div></div>
      <div class="countdown-box"><div id="cdNum"></div></div>
      <div class="betfx" id="betFx"></div>
    </section>

    <!-- UI 패널 -->
    <aside class="ui-container" id="uiPanel">
      <div class="hud-row">
        <div>
          <div class="label">TOTAL POOL</div>
          <div class="value-lg" id="poolDisp">0 UT</div>
        </div>
        <div style="text-align:right;">

      </div>

      <div class="ctrl-area">
        <div class="bet-inputs">
          <button class="btn-chip" id="bMin">MIN</button>
          <button class="btn-chip" id="bM100">-100</button>

          <button class="btn-chip" id="bP100">+100</button>
          <button class="btn-chip" id="bMax">MAX</button>
        </div>

        <button id="bJoin" class="action-btn action-btn-sot" type="button">
          <span class="unique-inner" id="btnText">
            <span class="unique-logo-text">UNIQUE</span>&nbsp; BET NOW
          </span>
        </button>

        <div class="wallet-row">
          <span>MY WALLET</span>
          <span id="myBal">Loading...</span>
        </div>
      </div>

      <div class="list-wrap" id="pList">
        <div style="text-align:center; padding:30px; color:#555;">Waiting for bets...</div>
      </div>
    </aside>
  </div>

  <!-- 승자 모달 -->
  <div id="mdRes" class="modal-mask">
    <div class="modal-body">
      <div class="win-title">WINNER</div>
      <div id="resName">-</div>
      <div id="resAmt">-</div>
      <div id="resHint">30초 동안 화면이 고정됩니다.</div>
    </div>
  </div>

  <!-- ✅ 플레이리스트 분리 -->
  <script src="./roulette.playlist.js"></script>

  <!-- 유튜브 플레이어 -->
  <div id="ytPlayer" style="display:none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const toMoney = (n) => Number(n || 0).toLocaleString();

    /* ====== 서버 ====== */
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

    /* ✅ CORS 100% 회피: JSONP */
    async function api(act, p = {}) {
      return new Promise((resolve, reject) => {
        const cb = "__cb_" + Math.random().toString(36).slice(2);
        const qs = new URLSearchParams({ action: act, ...p, callback: cb, _: Date.now() });
        const s = document.createElement("script");
        let done = false;

        function cleanup() {
          if (s.parentNode) s.parentNode.removeChild(s);
          try { delete window[cb]; } catch (_) { window[cb] = undefined; }
          clearTimeout(t);
        }

        window[cb] = (data) => {
          done = true;
          cleanup();
          resolve(data);
        };

        s.src = GAS_URL + "?" + qs.toString();
        s.onerror = () => {
          if (done) return;
          cleanup();
          reject(new Error("JSONP load failed"));
        };

        const t = setTimeout(() => {
          if (done) return;
          cleanup();
          reject(new Error("JSONP timeout"));
        }, 8000);

        document.head.appendChild(s);
      });
    }

    /* ====== 기본 ====== */
    const MIN_BET = 100;
    const HOLD_MS = 30000;

    let myId = "", myWallet = 0, myColor = "#999";
    let participants = [], totalPool = 0;

    let serverOffset = 0;
    let nextRoundMs = 0;
    let activeRoundKey = null;
    let lastSettledShown = null;
    let holdUntilServerMs = 0;

    // 동기화 상태
    let lastSyncOk = false;
    let lastSyncAt = 0;

    // 휠/애니메이션
    let rotation = 0;
    let wheelState = "SPINNING"; // SPINNING | STOPPING | STOPPED
    let stopTargetAngle = 0, stopStartTime = 0;
    const STOP_DURATION = 3500;
    let lastFrame = 0;

    function updateSyncBadge(ok){
      lastSyncOk = !!ok;
      if(ok) lastSyncAt = Date.now();
      const el = $("syncBadge");
      if(!el) return;
      if(lastSyncOk){
        el.innerHTML = `동기화: <b>SERVER</b>`;
      }else{
        el.innerHTML = `동기화: <b>LOCAL</b> (서버 응답 없음)`;
      }
    }

    // 캔버스/레이아웃
    function setPointerPosition(mx) {
      const ptr = $("pointer");
      ptr.style.left = mx.px + "px";
      ptr.style.top  = mx.py + "px";
      ptr.style.transform = mx.ptrTransform;
    }

    function getWheelScale_(){
      const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--wheel-scale"));
      return Number.isFinite(v) ? v : 1;
    }

    function getMetrics() {
      const sec = $("wheelSection");
      const w = sec.clientWidth;
      const h = sec.clientHeight;
      const isPC = window.innerWidth >= 1024;
      const scale = getWheelScale_();

      if (isPC) {
        const panelW = $("uiPanel").getBoundingClientRect().width || 420;
        const availW = Math.max(320, window.innerWidth - panelW);
        const availH = Math.max(320, window.innerHeight - 40);
        const r = Math.min(availW, availH) * 0.46 * scale;

        const cx = availW * 0.5;
        const cy = (window.innerHeight - 40) * 0.52;

        // ✅ 포인터 12시 고정
        const px = cx;
        const py = Math.max(14, cy - r - 42);
        setPointerPosition({ px, py, ptrTransform: "translateX(-50%)" });

        return { cx, cy, r, pointerAngle: -Math.PI / 2, isPC };
      } else {
        const r = Math.min(w, h) * 0.42 * scale;
        const cx = w / 2;
        const cy = h / 2 + 10;

        const px = cx;
        const py = Math.max(10, cy - r - 42);
        setPointerPosition({ px, py, ptrTransform: "translateX(-50%)" });

        return { cx, cy, r, pointerAngle: -Math.PI / 2, isPC };
      }
    }

    // RPM 스케줄
    function rpmByRemaining(remSec) {
      if (remSec > 15 * 60 + 30) return 1;
      if (remSec > 10 * 60 + 30) return 2;
      if (remSec > 5  * 60 + 30) return 3;
      return 6;
    }

    /* ====== 카운트다운(TTS 유지) ====== */
    const synth = window.speechSynthesis;
    let koVoice = null;
    function pickKoreanVoice() {
      const vs = synth ? synth.getVoices() : [];
      const ko = vs.filter(v => (v.lang || "").toLowerCase().includes("ko"));
      koVoice = ko.find(v => /male|남|man/i.test(v.name)) || ko[0] || null;
    }
    if (synth) {
      pickKoreanVoice();
      window.speechSynthesis.onvoiceschanged = () => pickKoreanVoice();
    }
    let lastSpoken = null;
    const KO_NUM = { 5:"오", 4:"사", 3:"삼", 2:"이", 1:"일", 0:"영" };
    function speakKo(n) {
      if (!synth) return;
      if (lastSpoken === n) return;
      lastSpoken = n;
      const u = new SpeechSynthesisUtterance(KO_NUM[n] ?? String(n));
      u.lang = "ko-KR";
      if (koVoice) u.voice = koVoice;
      u.rate = 1.0;
      u.pitch = 0.9;
      try { synth.cancel(); } catch(_){}
      synth.speak(u);
    }

    function setCountdownUI(remSec) {
      const cd = $("cdNum");
      if (remSec <= 60 && remSec > 0) {
        cd.textContent = remSec;
        cd.classList.add("on");
        if (remSec <= 10) cd.classList.add("blink");
        else cd.classList.remove("blink");
        if (remSec <= 5) speakKo(remSec);
      } else {
        cd.classList.remove("on");
        cd.classList.remove("blink");
      }
      if (remSec === 0) speakKo(0);
    }

    /* ====== 배팅 이펙트(포인터 근처 = 12시) ====== */
    function spawnBetFx(amount, color) {
      const fx = $("betFx");
      const m = getMetrics();

      const chip = document.createElement("div");
      chip.className = "chip";
      chip.style.background = color || "#ffd700";
      chip.style.color = "#111";
      chip.textContent = `+${toMoney(amount)} UT`;

      const x = (m.cx - 60);
      const y = (m.cy - m.r + 52);

      chip.style.left = x + "px";
      chip.style.top  = y + "px";

      fx.appendChild(chip);
      setTimeout(() => chip.remove(), 950);
    }

    /* ====== 리스트 렌더 ====== */
    function renderList() {
      const el = $("pList");
      if (!participants.length) {
        el.innerHTML = "<div style='text-align:center;padding:30px;color:#555;'>Waiting for bets...</div>";
        return;
      }
      el.innerHTML = "";
      participants.forEach(p => {
        el.innerHTML += `
          <div class="rank-item ${p.name === myId ? "me" : ""}">
            <div class="p-col" style="background:${p.color};"></div>
            <div class="p-name">${p.name}</div>
            <div class="p-amt">${toMoney(p.amount)}</div>
          </div>
        `;
      });
      el.scrollTop = el.scrollHeight;
    }

    /* ====== 휠 드로잉 ====== */
    function resizeCanvas(ctx) {
      const sec = $("wheelSection");
      const w = sec.clientWidth;
      const h = sec.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      const cvs = $("cvs");
      const need = (cvs.width !== Math.floor(w * dpr) || cvs.height !== Math.floor(h * dpr));
      if (need) {
        cvs.width = Math.floor(w * dpr);
        cvs.height = Math.floor(h * dpr);
        cvs.style.width = w + "px";
        cvs.style.height = h + "px";
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w, h };
    }

    function draw(ts) {
      const cvs = $("cvs");
      const ctx = cvs.getContext("2d");

      const { w, h } = resizeCanvas(ctx);
      const m = getMetrics();

      if (!lastFrame) lastFrame = ts;
      const dt = ts - lastFrame;
      lastFrame = ts;

      ctx.fillStyle = "#050508";
      ctx.fillRect(0, 0, w, h);

      let remSec = 0;
      if (nextRoundMs) {
        const nowServer = Date.now() + serverOffset;
        remSec = Math.max(0, Math.floor((nextRoundMs - nowServer) / 1000));
      }

      if (wheelState === "SPINNING") {
        const rpm = rpmByRemaining(remSec);
        const radPerMs = (rpm * 2 * Math.PI) / 60000;
        rotation += radPerMs * dt;
      } else if (wheelState === "STOPPING") {
        const t = Math.min(1, (Date.now() - stopStartTime) / STOP_DURATION);
        const ease = 1 - Math.pow(1 - t, 4);
        rotation = window.__startRot + (stopTargetAngle - window.__startRot) * ease;
        if (t >= 1) wheelState = "STOPPED";
      }

      const { cx, cy, r } = m;

      const gradRim = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
      gradRim.addColorStop(0, "#fbf5b7");
      gradRim.addColorStop(0.3, "#d4af37");
      gradRim.addColorStop(0.5, "#ffd700");
      gradRim.addColorStop(0.8, "#aa771c");
      gradRim.addColorStop(1, "#fbf5b7");

      ctx.beginPath();
      ctx.arc(cx, cy, r + 16, 0, Math.PI * 2);
      ctx.fillStyle = gradRim;
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 28;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = "#110000";
      ctx.fill();

      let startAng = rotation;
      const total = totalPool || 1;

      if (participants.length > 0) {
        participants.forEach(p => {
          const slice = (p.amount / total) * 2 * Math.PI;
          const endAng = startAng + slice;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r - 5, startAng, endAng);
          ctx.fillStyle = p.color || "#999";
          ctx.fill();

          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(255,255,255,0.15)";
          ctx.stroke();

          if (slice > 0.05) {
            const mid = startAng + slice / 2;
            const tx = cx + Math.cos(mid) * (r * 0.70);
            const ty = cy + Math.sin(mid) * (r * 0.70);
            ctx.save();
            ctx.translate(tx, ty);
            ctx.rotate(mid + Math.PI);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillStyle = "#fff";
            ctx.font = "900 18px 'Cinzel', sans-serif";
            ctx.shadowColor = "rgba(0,0,0,1)";
            ctx.shadowBlur = 6;

            let n = p.name || "";
            if (n.length > 12) n = n.slice(0, 10) + "..";
            ctx.fillText(n, 0, -12);

            ctx.fillStyle = "#ffd700";
            ctx.font = "900 14px monospace";
            ctx.fillText(toMoney(p.amount), 0, 12);
            ctx.restore();
          }

          startAng = endAng;
        });
      }

      const capR = Math.min(r * 0.14, 150);
      const gradCap = ctx.createRadialGradient(cx, cy, capR * 0.1, cx, cy, capR);
      gradCap.addColorStop(0, "#fff");
      gradCap.addColorStop(0.3, "#ffd700");
      gradCap.addColorStop(0.9, "#b8860b");
      gradCap.addColorStop(1, "#5e4b25");

      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(cx, cy, capR, 0, Math.PI * 2);
      ctx.fillStyle = gradCap;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-rotation * 0.45);
      ctx.beginPath();
      ctx.arc(0, 0, capR * 0.70, 0, Math.PI * 2);
      ctx.fillStyle = "#1a0b0b";
      ctx.fill();
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = "#ffd700";
      ctx.font = "900 22px 'Cinzel'";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("UNIQUE", 0, 2);
      ctx.restore();

      setCountdownUI(remSec);

      requestAnimationFrame(draw);
    }

    function spinToWinner(winnerName) {
      if (!participants.length) return;

      const winIndices = [];
      participants.forEach((p, i) => {
        if (String(p.name) === String(winnerName)) winIndices.push(i);
      });
      if (!winIndices.length) return;

      const targetIndex = winIndices[Math.floor(Math.random() * winIndices.length)];

      let sum = 0, mid = 0;
      const total = totalPool || 1;
      for (let i = 0; i < participants.length; i++) {
        const s = (participants[i].amount / total) * 2 * Math.PI;
        if (i === targetIndex) { mid = sum + s / 2; break; }
        sum += s;
      }

      const cur = rotation;
      const extra = Math.PI * 2 * 3;
      const m = getMetrics();

      // ✅ 포인터 12시(-PI/2)
      let dest = m.pointerAngle - mid;
      while (dest < cur + extra) dest += Math.PI * 2;

      stopTargetAngle = dest;
      window.__startRot = cur;
      stopStartTime = Date.now();
      wheelState = "STOPPING";
    }

    /* ====== 음악(플레이리스트 고정) ====== */
    const ytPlaylist = (window.UNIQUE_YT_PLAYLIST && Array.isArray(window.UNIQUE_YT_PLAYLIST))
      ? window.UNIQUE_YT_PLAYLIST
      : [];
    let ytPlayer = null;
    let curTrack = 0;
    let curVol = 20;
    let userInteracted = false;

    function setTrackLabel() {
      $("trackLabel").textContent = `${String(curTrack+1).padStart(2,"0")}/${String(ytPlaylist.length).padStart(2,"0")}`;
    }
    function loadTrack(i, autoplay = false) {
      if (!ytPlayer || ytPlaylist.length === 0) return;
      curTrack = (i + ytPlaylist.length) % ytPlaylist.length;
      setTrackLabel();
      const vid = ytPlaylist[curTrack];
      ytPlayer.loadVideoById({ videoId: vid, startSeconds: 0, suggestedQuality: "small" });
      if (!autoplay) ytPlayer.pauseVideo();
      ytPlayer.setVolume(curVol);
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '0', width: '0',
        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          origin: location.origin
        },
        events: { onReady: onPlayerReady }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function onPlayerReady() {
      setTrackLabel();
      loadTrack(curTrack, false);
    }

    $("playBtn").onclick = () => { userInteracted = true; if (ytPlayer) ytPlayer.playVideo(); };
    $("pauseBtn").onclick = () => { if (ytPlayer) ytPlayer.pauseVideo(); };
    $("prevBtn").onclick = () => { userInteracted = true; loadTrack(curTrack - 1, true); };
    $("nextBtn").onclick = () => { userInteracted = true; loadTrack(curTrack + 1, true); };
    $("volUp").onclick = () => { if (!ytPlayer) return; curVol = Math.min(100, curVol + 10); ytPlayer.setVolume(curVol); };
    $("volDown").onclick = () => { if (!ytPlayer) return; curVol = Math.max(0, curVol - 10); ytPlayer.setVolume(curVol); };

    document.addEventListener("click", () => {
      if (userInteracted) return;
      userInteracted = true;
      if (ytPlayer && typeof ytPlayer.playVideo === "function") ytPlayer.playVideo();
    }, { once: true });

    /* ====== 자동 색상 ====== */
    const colors = ['#ff0055','#ffdd00','#00ffaa','#00ccff','#ff4400','#aa00ff','#ffffff','#ff00aa','#ccff00','#0055ff'];
    function hashToColor(str){
      let h = 0;
      for (let i=0;i<str.length;i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return colors[h % colors.length];
    }

    /* ====== 상태 업데이트 ====== */
    function applyCurrentParticipants(list){
      participants = (list || []).map(p => ({
        name: String(p.name || ""),
        amount: Number(p.amount || 0),
        color: String(p.color || "#999")
      }));
      totalPool = participants.reduce((a,c) => a + (Number(c.amount)||0), 0);
      $("poolDisp").textContent = `${toMoney(totalPool)} UT`;
      renderList();
    }

    function showWinnerModal(winnerName, prize){
      $("resName").textContent = winnerName || "-";
      $("resAmt").textContent  = `${toMoney(prize)} UT`;
      $("mdRes").classList.add("on");
    }
    function hideWinnerModal(){
      $("mdRes").classList.remove("on");
    }

    async function updateState() {
      try {
        const d = await api("getRouletteState");
        if (!d || d.result !== "success") { updateSyncBadge(false); return; }

        updateSyncBadge(true);

        if (d.serverTs) serverOffset = Number(d.serverTs) - Date.now();
        if (d.nextRoundAtMs) nextRoundMs = Number(d.nextRoundAtMs);
        activeRoundKey = String(d.roundKey || "");

        const winTxt = d.lastWinner ? `🏆 LAST WINNER: ${d.lastWinner.name} (${toMoney(d.lastWinner.prize)} UT) 🏆` : "";
        $("mqText1").innerHTML = `💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎 <span>${winTxt}</span>`;
        $("mqText2").innerHTML = $("mqText1").innerHTML;

        if (d.phase === "HOLD" && d.settledRound && d.settledRound.roundKey) {
          const sk = String(d.settledRound.roundKey);
          holdUntilServerMs = Number(d.settledRound.holdUntilMs || 0);

          if (lastSettledShown !== sk) {
            lastSettledShown = sk;

            applyCurrentParticipants(d.settledRound.participants || []);
            totalPool = participants.reduce((a,c)=>a + (Number(c.amount)||0),0);
            $("poolDisp").textContent = `${toMoney(totalPool)} UT`;

            wheelState = "SPINNING";
            spinToWinner(d.settledRound.winnerName);
            showWinnerModal(d.settledRound.winnerName, d.settledRound.prize);
          }
          return;
        }

        hideWinnerModal();
        wheelState = "SPINNING";
        applyCurrentParticipants(d.participants || []);

      } catch (e) {
        updateSyncBadge(false);
      }
    }

    function tickHoldEnd() {
      const nowServer = Date.now() + serverOffset;
      if (holdUntilServerMs && nowServer >= holdUntilServerMs) {
        holdUntilServerMs = 0;
        hideWinnerModal();
      }
    }

    function startTimerUI() {
      setInterval(() => {
        if (!nextRoundMs) return;

        const nowServer = Date.now() + serverOffset;
        const rem = Math.max(0, Math.floor((nextRoundMs - nowServer)/1000));
        const mm = Math.floor(rem/60);
        const ss = rem%60;
        $("timerDisp").textContent = `${mm}:${ss<10 ? "0"+ss : ss}`;

        tickHoldEnd();
        if (rem === 0) updateState();
      }, 250);
    }

    /* ====== 배팅 버튼 ====== */
    const setB = v => $("inpBet").value = v;
    $("bMin").onclick  = () => setB(MIN_BET);
    $("bMax").onclick  = () => setB(Math.max(MIN_BET, Math.floor(myWallet/100)*100));
    $("bM100").onclick = () => { let v = Number($("inpBet").value) - 100; if (v < MIN_BET) v = MIN_BET; setB(v); };
    $("bP100").onclick = () => { let v = Number($("inpBet").value) + 100; if (v > myWallet) v = myWallet; setB(Math.max(MIN_BET, v)); };

    $("bJoin").onclick = async () => {
      const amt = Number($("inpBet").value);
      if (amt > myWallet) return alert("잔액 부족");
      const btn = $("bJoin");
      const bt = $("btnText");

      btn.disabled = true;
      bt.textContent = "...";

      try {
        const r = await api("rouletteResult", { type:"bet", id: myId, amount: amt, color: myColor });
        if (r.result === "success") {
          myWallet = r.newBalance;
          $("myBal").textContent = `${toMoney(myWallet)} UT`;
          spawnBetFx(amt, myColor);
          updateState();
        } else {
          alert(r.msg || "실패");
        }
      } catch (e) {
        alert("서버 응답 없음");
      }

      btn.disabled = false;
      bt.innerHTML = `<span class="unique-logo-text">UNIQUE</span>&nbsp; BET NOW`;
    };

    /* ====== 시작 ====== */
    window.onload = async () => {
      const p = new URLSearchParams(location.search);
      myId = (p.get("id") || "guest").toLowerCase();

      myColor = hashToColor(myId);

      try {
        const u = await api("getUserInfo", { id: myId });
        if (u.result === "success") myWallet = Number(u.balance || 0);
        $("myBal").textContent = `${toMoney(myWallet)} UT`;
      } catch (e) {
        $("myBal").textContent = `0 UT`;
      }

      setB(MIN_BET);

      await updateState();
      setInterval(updateState, 1200);
      startTimerUI();

      requestAnimationFrame(draw);
      window.addEventListener("resize", () => { lastFrame = 0; });
    };
  </script>
</body>
</html>
