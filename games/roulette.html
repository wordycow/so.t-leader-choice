<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>THE UNIQUE: 2D GIANT ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ CSS 복구 (이게 빠져서 화면이 무너졌음) -->
  <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; padding:0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      background: radial-gradient(circle at top, #050817 0, #020617 55%, #000 100%);
      color:#fff;
      overflow:hidden; /* 스크롤로 하얀 빈공간 나오는 거 방지 */
    }

    /* 상단 마키 */
    .marquee-wrap{
      position:fixed; left:0; top:0; width:100%;
      z-index:6;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow:hidden;
      padding: 8px 0;
      backdrop-filter: blur(6px);
    }
    .marquee-text{
      white-space: nowrap;
      display:inline-block;
      padding-left: 100%;
      animation: marquee 18s linear infinite;
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 13px;
      opacity:.95;
    }
    @keyframes marquee{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-100%); }
    }

    /* 타이머 중앙 카운트다운 */
    .center-countdown{
      position:fixed;
      z-index:7;
      top: 52px;
      left: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: scale(.9);
      transition: .2s;
      pointer-events:none;
    }
    .center-countdown.active{
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 0 22px rgba(255, 80, 80, .35);
    }

    /* 상단 HUD */
    .top-hud{
      position: fixed;
      z-index:6;
      top: 52px;
      right: 12px;
      display:flex;
      gap:10px;
    }
    .hud-box{
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(6px);
      padding: 10px 12px;
      border-radius: 14px;
      min-width: 140px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .hud-label{
      font-size: 11px;
      opacity:.75;
      font-weight: 800;
      letter-spacing: .4px;
    }
    .hud-value{
      margin-top: 6px;
      font-size: 18px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 18px rgba(255, 215, 0, .25);
    }
    .hud-timer{
      margin-top: 6px;
      font-size: 18px;
      font-weight: 900;
      color: #ff4757;
      text-shadow: 0 0 18px rgba(255, 71, 87, .25);
    }

    /* 캔버스 스테이지 */
    .game-stage{
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }
    #canvas{
      position:absolute;
      inset:0;
      display:block;
    }
    .pointer{
      position:absolute;
      z-index:2;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 28px solid #ffd700;
      filter: drop-shadow(0 0 10px rgba(255,215,0,.35));
    }

    /* 실시간 지분 패널 */
    .list-panel{
      position: fixed;
      z-index:6;
      left: 12px;
      bottom: 132px;
      width: min(420px, calc(100% - 24px));
      max-height: 240px;
      overflow: hidden;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .list-header{
      padding: 10px 12px;
      font-weight: 900;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content: space-between;
      opacity:.95;
    }
    #participantList{
      padding: 8px 10px;
      max-height: 190px;
      overflow:auto;
    }
    .list-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 7px 6px;
      border-bottom: 1px dashed rgba(255,255,255,0.06);
      font-size: 12px;
    }
    .list-item:last-child{ border-bottom:none; }
    .p-color{
      width: 10px; height: 10px; border-radius: 999px;
      border:1px solid rgba(255,255,255,0.18);
      flex: 0 0 auto;
    }
    .p-name{
      flex: 1 1 auto;
      font-weight: 800;
      opacity: .95;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .p-amt{
      flex: 0 0 auto;
      font-weight: 900;
      color:#ffd700;
      opacity:.95;
    }

    /* 하단 컨트롤 */
    .controls{
      position: fixed;
      z-index:6;
      left: 12px;
      bottom: 12px;
      width: min(420px, calc(100% - 24px));
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .bet-box{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn-bet{
      border:none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      background: rgba(255,255,255,0.10);
      color:#fff;
      transition: .15s;
      min-width: 64px;
    }
    .btn-bet:hover{ transform: translateY(-1px); background: rgba(255,255,255,0.14); }
    .btn-min, .btn-max{ background: rgba(255,215,0,0.18); }
    .input-bet{
      flex: 1 1 auto;
      min-width: 120px;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color:#fff;
      font-weight: 900;
      text-align:center;
    }
    .btn-join{
      width: 100%;
      border:none;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      font-size: 14px;
      cursor:pointer;
      background: linear-gradient(90deg, rgba(0,243,255,.85), rgba(255,215,0,.85));
      color:#000;
      box-shadow: 0 0 26px rgba(0,243,255,.18);
      transition: .15s;
    }
    .btn-join:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(0.4);
    }

    /* 모달(오버레이) */
    .modal-overlay{
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;           /* 기본 숨김 */
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.68);
      backdrop-filter: blur(8px);
      padding: 18px;
    }
    .modal-overlay.active{ display:flex; }

    .modal-box{
      width: min(420px, 100%);
      background: rgba(10,10,18,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .modal-title{
      font-weight: 900;
      font-size: 20px;
      color: #ffd700;
      text-shadow: 0 0 18px rgba(255,215,0,.25);
    }
    .modal-sub{
      margin-top: 10px;
      font-size: 13px;
      opacity:.85;
      line-height: 1.4;
    }
    .color-grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 12px 0 14px;
    }
    .color-btn{
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.10);
      cursor:pointer;
      transition: .12s;
    }
    .color-btn:hover{ transform: translateY(-1px); }
    .color-btn.disabled{
      opacity: .25;
      cursor:not-allowed;
      filter: grayscale(0.8);
    }
    .color-btn.selected{
      border-color: rgba(255,215,0,0.85);
      box-shadow: 0 0 20px rgba(255,215,0,.25);
    }
    .btn-confirm, .btn-close{
      width: 100%;
      margin-top: 10px;
      border:none;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      cursor:pointer;
    }
    .btn-confirm{
      background: rgba(255,215,0,0.9);
      color:#000;
    }
    .btn-confirm:disabled{
      opacity:.35;
      cursor:not-allowed;
    }
    .btn-close{
      background: rgba(255,255,255,0.10);
      color:#fff;
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>

  <script>
    // ✅ GAS URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

    // ✅ 튜닝 값
    const SYNC_INTERVAL_MS = 1000;   // 1초 갱신
    const WHEEL_RPM = 3;             // 3바퀴/분

    let myId = "";
    let myWallet = 0;
    let myColor = null;

    let currentRoundKey = null;
    let pendingBet = null; // { roundKey, potAmount, ts }

    let gameState = { participants: [], totalPool: 0, timeLeft: 1800, rotation: 0 };

    let isBettingProcessing = false;
    let isFinishing = false;

    let lastWinnerMsg = "🏆 지난 라운드 우승자가 없습니다.";
    const warningMsg = "🚨 [안내] 마감 1분 전까지만 배팅 참여가 가능합니다! 서두르세요! 🚨";

    let serverOffsetMs = 0; // serverTs - Date.now()
    const synth = window.speechSynthesis;

    const availableColors = [
      '#ff0055', '#00ff44', '#00ccff', '#ffdd00', '#aa00ff',
      '#ff6600', '#ffffff', '#ff99cc', '#99ff99', '#6666ff',
      '#cc0000', '#006600', '#000099', '#663300', '#666666',
      '#00ff99', '#ff3399', '#ccff00', '#9900cc', '#33ccff'
    ];

    function el(id){ return document.getElementById(id); }

    function generateRandomNeonColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 100%, 60%)`;
    }

    function speak(text) {
      try{
        if (!synth || synth.speaking) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 1.0;
        utter.pitch = 1.0;
        synth.speak(utter);
      }catch(_){}
    }

    function updateMarquee(text, color="#fff"){
      const marquee = el('marqueeText');
      if (!marquee) return;
      marquee.innerText = text;
      marquee.style.color = color;
    }

    function closeModal(id) { el(id)?.classList.remove('active'); }
    function openModal(id)  { el(id)?.classList.add('active'); }

    function applyServerClock_(data){
      if (typeof data.serverTs === "number") {
        serverOffsetMs = data.serverTs - Date.now();
      }
    }

    function calcRoundKeyFromServerishMs_(msServerish){
      const d = new Date(msServerish);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      const hh = String(d.getHours()).padStart(2,'0');
      const min = d.getMinutes();
      const roundMin = (min < 30) ? "00" : "30";
      return `${yyyy}-${mm}-${dd} ${hh}:${roundMin}`;
    }

    function getTimeLeftSec_(){
      const nowServerish = Date.now() + serverOffsetMs;
      const now = new Date(nowServerish);

      const next = new Date(nowServerish);
      next.setMilliseconds(0);
      next.setSeconds(0);

      const m = next.getMinutes();
      if (m < 30) {
        next.setMinutes(30);
      } else {
        next.setMinutes(0);
        next.setHours(next.getHours() + 1);
      }

      const diff = Math.floor((next.getTime() - now.getTime()) / 1000);
      return Math.max(0, diff);
    }

    function initColorPicker() {
      const grid = el('colorGrid');
      if (!grid) return;
      grid.innerHTML = "";

      const usedColors = (gameState.participants || [])
        .map(p => p.color)
        .filter(Boolean);

      availableColors.forEach(color => {
        const btn = document.createElement('div');
        btn.className = 'color-btn';
        btn.style.backgroundColor = color;
        btn.style.boxShadow = `0 0 10px ${color}`;

        if (usedColors.includes(color)) {
          btn.classList.add('disabled');
        } else {
          btn.onclick = () => pickColor(btn, color);
        }
        grid.appendChild(btn);
      });
    }

    function pickColor(btn, color) {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      myColor = color;
      el('selectedColorName').innerText = "SELECTED: " + color;
      el('btnStart').disabled = false;
    }

    function selectColorAndStart() {
      if (!myColor) return;
      localStorage.setItem('rouletteColor_' + myId, myColor);
      closeModal('ruleModal');
      fetchGameState(true);
    }

    async function fetchUserData() {
      try {
        const url = `${GAS_URL}?action=getUserInfo&id=${encodeURIComponent(myId)}&_=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();
        if (data.result === "success") {
          myWallet = Number(data.balance || 0);
          el('myBalance').innerText = myWallet.toLocaleString() + " UT";
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function fetchGameState(isInitial=false) {
      if (el('resultModal')?.classList.contains('active')) return;

      try {
        const url = `${GAS_URL}?action=getRouletteState&_=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();
        if (data.result !== "success") return;

        applyServerClock_(data);

        if (data.lastWinner && data.lastWinner.name) {
          lastWinnerMsg = `🏆 지난 라운드 승자: ${data.lastWinner.name} (상금: ${Number(data.lastWinner.prize||0).toLocaleString()} UT) 🏆`;
        } else {
          lastWinnerMsg = "🏆 지난 라운드 우승자가 없습니다.";
        }
        if (isInitial) updateMarquee(lastWinnerMsg, "#fff");

        const rk = String(data.roundKey || "").trim();
        const prevKey = currentRoundKey;
        const roundChanged = (prevKey && rk && rk !== prevKey);

        if (!currentRoundKey && rk) currentRoundKey = rk;

        if (roundChanged) {
          currentRoundKey = rk;
          pendingBet = null;
          el('betInput').value = 10;

          if (!isFinishing && !el('resultModal').classList.contains('active')) {
            finishRoundServerBased(prevKey);
          }
          updateMarquee(lastWinnerMsg, "#00f3ff");
        } else {
          if (rk) currentRoundKey = rk;
        }

        let serverParticipants = (data.participants || []).map(sp => {
          const name = sp.name;
          let color = sp.color;

          if (name === "Company") color = "#ff0055";
          if (name === myId && myColor) color = myColor;
          if (!color) color = generateRandomNeonColor();

          return { name, amount: Number(sp.amount || 0), color };
        });

        if (pendingBet && pendingBet.roundKey === currentRoundKey && (Date.now() - pendingBet.ts) < 10000) {
          if (!serverParticipants.find(p => p.name === myId)) {
            serverParticipants.push({ name: myId, amount: pendingBet.potAmount, color: myColor || generateRandomNeonColor() });
          }
        }

        gameState.participants = serverParticipants;
        updateGameState();

      } catch (e) {
        console.error("Sync Error:", e);
      }
    }

    function updateGameState() {
      gameState.totalPool = gameState.participants.reduce((acc, p) => acc + (Number(p.amount)||0), 0);
      el('poolDisplay').innerText = gameState.totalPool.toLocaleString() + " UT";

      gameState.participants.sort((a, b) => (b.amount - a.amount) || String(a.name).localeCompare(String(b.name)));
      updateListUI();
    }

    function updateListUI() {
      const list = el('participantList');
      if (!list) return;
      list.innerHTML = "";

      if (!gameState.participants.length) {
        list.innerHTML = `<div style="text-align:center; color:#ddd; font-size:0.8rem; padding:5px;">대기중...</div>`;
        return;
      }

      gameState.participants.forEach((p) => {
        const highlight = (p.name === myId && myColor) ? `color:${myColor}; font-weight:900;` : '';
        list.innerHTML += `
          <div class="list-item">
            <div class="p-color" style="background:${p.color}; box-shadow: 0 0 5px ${p.color};"></div>
            <div class="p-name" style="${highlight}">${p.name}</div>
            <div class="p-amt">${Number(p.amount).toLocaleString()}</div>
          </div>
        `;
      });
    }

    function changeBet(val) {
      const e = el('betInput');
      let v = parseInt(e.value || "10", 10) + val;
      if (v < 10) v = 10;
      e.value = v;
    }
    function setMinBet() { el('betInput').value = 10; }
    function setMaxBet() { el('betInput').value = Math.max(10, myWallet); }

    async function requestBet_(amountGross){
      const q = `id=${encodeURIComponent(myId)}&amount=${encodeURIComponent(amountGross)}&color=${encodeURIComponent(myColor || "")}&_=${Date.now()}`;

      try{
        let r1 = await fetch(`${GAS_URL}?action=rouletteBet&${q}`, { cache:"no-store" });
        let j1 = await r1.json();
        if (j1 && j1.result === "success") return j1;
      }catch(_){}

      let r2 = await fetch(`${GAS_URL}?action=rouletteResult&type=bet&${q}`, { cache:"no-store" });
      return await r2.json();
    }

    async function joinGame() {
      if (isBettingProcessing) return;

      const amountGross = parseInt(el('betInput').value || "0", 10);
      if (amountGross > myWallet) return alert("잔액이 부족합니다.");
      if (amountGross <= 0) return alert("금액 확인 필요");
      if (getTimeLeftSec_() <= 60) return alert("마감되었습니다.");

      if (!myColor) {
        openModal('ruleModal');
        initColorPicker();
        return;
      }

      isBettingProcessing = true;

      const btn = el('joinBtn');
      const originalText = btn.innerText;
      btn.disabled = true;
      btn.innerText = "처리중...";

      try{
        const data = await requestBet_(amountGross);

        if (data.result === "success") {
          myWallet = Number(data.newBalance || 0);
          el('myBalance').innerText = myWallet.toLocaleString() + " UT";

          const gross = Number(data.gross != null ? data.gross : amountGross);
          pendingBet = { roundKey: (data.roundKey || currentRoundKey), potAmount: gross, ts: Date.now() };

          btn.innerText = "배팅 성공!";
          await fetchGameState(true);
        } else {
          alert(data.msg || "베팅 실패");
          btn.innerText = originalText;
        }
      }catch(err){
        console.error(err);
        alert("통신 오류");
        btn.innerText = originalText;
      }finally{
        isBettingProcessing = false;
        btn.disabled = false;
        setTimeout(() => {
          if (!isBettingProcessing && getTimeLeftSec_() > 60) btn.innerText = originalText;
        }, 800);
      }
    }

    async function finishRoundServerBased(targetRoundKey) {
      if (isFinishing) return;
      isFinishing = true;

      try {
        openModal('resultModal');

        el('resWinner').innerText = "SETTLING...";
        el('resAmount').innerText = "-";
        el('resMsg').innerText = "서버 정산/동기화 중...";
        el('resMsg').style.color = "#aaa";

        let winnerData = null;

        for (let i=0; i<12; i++) {
          try {
            const url = `${GAS_URL}?action=getRouletteState&_=${Date.now()}`;
            const res = await fetch(url, { cache: "no-store" });
            const data = await res.json();

            if (data && data.result === "success") {
              applyServerClock_(data);

              if (data.lastWinner && data.lastWinner.round) {
                if (String(data.lastWinner.round).trim() === String(targetRoundKey).trim()) {
                  winnerData = data.lastWinner;
                  break;
                }
              }
            }
          } catch(_) {}
          await new Promise(r => setTimeout(r, 1000));
        }

        if (!winnerData) {
          el('resWinner').innerText = "SETTLING...";
          el('resAmount').innerText = "-";
          el('resMsg').innerText = "정산 반영이 늦습니다. 잠시 후 NEXT ROUND를 눌러주세요.";
          el('resMsg').style.color = "#aaa";
          return;
        }

        const winnerName = winnerData.name;
        const prize = Number(winnerData.prize || 0);

        el('resWinner').innerText = winnerName;
        el('resAmount').innerText = prize.toLocaleString() + " UT";

        const color = (gameState.participants.find(p => p.name === winnerName)?.color) || (winnerName === "Company" ? "#ff0055" : "#fff");
        el('resWinner').style.textShadow = `0 0 30px ${color}`;

        const msgEl = el('resMsg');
        if (winnerName === myId) {
          msgEl.innerText = "축하합니다! 당신이 승자입니다! 🎉";
          msgEl.style.color = myColor || "#fff";
          speak("Congratulations! You won!");
          await fetchUserData();
        } else if (winnerName === "Company") {
          msgEl.innerText = "이번 라운드는 본사가 승리했습니다.";
          msgEl.style.color = "#ff0055";
          speak("The House Wins.");
        } else {
          msgEl.innerText = `아쉽네요... 승자는 ${winnerName}님 입니다.`;
          msgEl.style.color = "#aaa";
          speak("Better luck next time.");
        }

        updateMarquee(`🏆 지난 라운드 승자: ${winnerName} (상금: ${prize.toLocaleString()} UT) 🏆`, "#00f3ff");

      } finally {
        isFinishing = false;
      }
    }

    function resetGame() { location.reload(); }

    function startMarqueeScheduler() {
      setInterval(() => {
        updateMarquee(warningMsg, "#ffdd59");
        setTimeout(() => updateMarquee(lastWinnerMsg, "#fff"), 15000);
      }, 120000);
    }

    function startTimer() {
      setInterval(() => {
        gameState.timeLeft = getTimeLeftSec_();

        const displayMin = Math.floor(gameState.timeLeft / 60);
        const displaySec = gameState.timeLeft % 60;
        el('timerDisplay').innerText = `${displayMin}:${displaySec < 10 ? '0'+displaySec : displaySec}`;

        const countEl = el('centerCount');
        const btn = el('joinBtn');

        if (gameState.timeLeft <= 60 && gameState.timeLeft > 0) {
          countEl.innerText = gameState.timeLeft;
          countEl.classList.add('active');

          if (!btn.disabled && !isBettingProcessing) {
            btn.disabled = true;
            btn.innerText = "마감됨 (CLOSED)";
            el('timerDisplay').style.color = "red";
          }
        } else {
          if (btn.disabled && !isBettingProcessing && gameState.timeLeft > 60 && !el('resultModal').classList.contains('active')) {
            btn.disabled = false;
            btn.innerText = "참여하기 (BET)";
            el('timerDisplay').style.color = "#ff4757";
            countEl.classList.remove('active');
          }
        }

        if (gameState.timeLeft <= 10 && gameState.timeLeft > 0) {
          const words = ["Ten","Nine","Eight","Seven","Six","Five","Four","Three","Two","One"];
          speak(words[10 - gameState.timeLeft]);
        }

        if (gameState.timeLeft === 0 && !el('resultModal').classList.contains('active') && !isFinishing) {
          const nowServerish = Date.now() + serverOffsetMs;
          const justFinishedKey = calcRoundKeyFromServerishMs_(nowServerish - 1000);
          speak("Time's up!");
          finishRoundServerBased(justFinishedKey);
        }
      }, 1000);
    }

    let lastFrameTs = 0;
    function drawGiantWheel(ts) {
      if (!lastFrameTs) lastFrameTs = ts;
      const dt = Math.min(0.05, (ts - lastFrameTs) / 1000);
      lastFrameTs = ts;

      const canvas = el('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const w = canvas.width;
      const h = canvas.height;

      const radius = h * 2.5;
      const centerX = radius + 50;
      const centerY = h / 2;

      const radPerSec = (WHEEL_RPM * 2 * Math.PI) / 60;
      gameState.rotation += radPerSec * dt;

      ctx.clearRect(0, 0, w, h);
      ctx.save();

      let startAngle = gameState.rotation;

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = "#0a0a0a";
      ctx.fill();
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 15;
      ctx.stroke();

      if (gameState.participants.length > 0 && gameState.totalPool > 0) {
        gameState.participants.forEach(p => {
          const sliceAngle = (p.amount / gameState.totalPool) * 2 * Math.PI;
          const endAngle = startAngle + sliceAngle;

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius - 20, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = p.color;
          ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,0.3)";
          ctx.lineWidth = 2;
          ctx.stroke();

          if (sliceAngle > 0.05) {
            const midAngle = startAngle + sliceAngle / 2;
            const textRadius = radius - 120;
            const tx = centerX + Math.cos(midAngle) * textRadius;
            const ty = centerY + Math.sin(midAngle) * textRadius;

            ctx.save();
            ctx.translate(tx, ty);
            ctx.rotate(midAngle + Math.PI);
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";

            ctx.fillStyle = "#fff";
            ctx.font = "bold 40px Arial";
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 4;
            ctx.fillText(p.name, 0, -20);

            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 24px monospace";
            ctx.fillText(p.amount.toLocaleString() + " UT", 0, 20);

            ctx.restore();
          }

          startAngle = endAngle;
        });
      } else {
        ctx.font = "bold 44px Arial";
        ctx.fillStyle = "#333";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText("WAITING FOR PLAYERS...", centerX - radius + 420, centerY);
      }

      const grad = ctx.createRadialGradient(centerX, centerY, radius * 0.95, centerX, centerY, radius);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(1, "rgba(0,0,0,0.3)");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.restore();
      requestAnimationFrame(drawGiantWheel);
    }

    window.onload = async function() {
      const params = new URLSearchParams(window.location.search);
      myId = params.get('id') || localStorage.getItem('user_id') || localStorage.getItem('loginId');

      if (!myId) {
        alert("로그인이 필요합니다.");
        window.location.href = "../the-unique-main.html";
        return;
      }

      await fetchUserData();
      await fetchGameState(true);

      const savedColor = localStorage.getItem('rouletteColor_' + myId);
      if (savedColor) {
        myColor = savedColor;
        closeModal('ruleModal');
      } else {
        openModal('ruleModal');
        initColorPicker();
      }

      requestAnimationFrame(drawGiantWheel);
      startTimer();
      startMarqueeScheduler();

      setInterval(() => fetchGameState(false), SYNC_INTERVAL_MS);
    };
  </script>
</head>

<body>
  <div class="marquee-wrap"><div class="marquee-text" id="marqueeText">🔥 THE UNIQUE CASINO에 오신 것을 환영합니다! 대박의 기회를 잡으세요! 🔥</div></div>

  <div id="centerCount" class="center-countdown">60</div>

  <div class="top-hud">

      <div class="hud-label">TOTAL EQUITY</div>
      <div class="hud-value" id="poolDisplay">0 UT</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">TIME LEFT</div>
      <div class="hud-timer" id="timerDisplay">30:00</div>
    </div>
  </div>

  <div class="game-stage">
    <div class="pointer"></div>

  </div>

  <div class="list-panel">
    <div class="list-header">실시간 지분 현황 (Live Rank)</div>
    <div id="participantList"><div style="text-align:center; color:#ddd; font-size:0.8rem;
