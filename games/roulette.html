<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE: LIVE ROULETTE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* =========================================
           CSS STYLES (Titanium Theme)
           ========================================= */
        :root {
            --bg-color: #050714;
            --gold: #ffd700;
            --company-color: #ff0055;
            --panel-bg: rgba(20, 20, 35, 0.95);
            --text-gray: #aaa;
        }

        body {
            margin: 0; font-family: 'Pretendard', sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
            background: linear-gradient(-45deg, #050714, #1a0b2e, #2b0000, #0f0c29);
            background-size: 400% 400%; animation: gradientBG 20s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* UI: Marquee */
        .marquee-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 35px; background: rgba(255, 0, 85, 0.15); border-bottom: 1px solid var(--company-color); overflow: hidden; white-space: nowrap; z-index: 150; display: flex; align-items: center; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: scroll-left 25s linear infinite; color: #fff; font-weight: bold; font-size: 0.9rem; text-shadow: 0 0 5px var(--company-color); }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* UI: Top HUD */
        .top-hud { position: absolute; top: 50px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 100; pointer-events: none; }
        .hud-box { background: var(--panel-bg); padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; backdrop-filter: blur(10px); pointer-events: auto; }
        .hud-label { font-size: 0.7rem; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 3px; }
        .hud-value { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .hud-timer { font-size: 1.4rem; font-weight: bold; color: #ff4757; font-family: monospace; }

        /* UI: Countdown */
        .center-countdown { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 20rem; font-weight: 900; color: rgba(255, 0, 85, 0.1); z-index: 80; pointer-events: none; text-shadow: 0 0 100px rgba(255, 0, 85, 0.8); display: none; line-height: 1; }
        .center-countdown.active { display: block; animation: pulseCount 1s infinite; }
        @keyframes pulseCount { 0% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1); opacity: 1; color: #ff0055; } 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } }

        /* GAME STAGE */
        .game-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
        canvas { display: block; width: 100%; height: 100%; }

        .pointer { 
            position: absolute; top: 50%; left: 30px; transform: translateY(-50%);
            width: 0; height: 0; z-index: 50; 
            border-top: 15px solid transparent; border-bottom: 15px solid transparent; 
            border-left: 50px solid #fff; 
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
        }
        .pointer::after { content: ''; position: absolute; top: -8px; left: -60px; width: 16px; height: 16px; background: var(--company-color); border-radius: 50%; box-shadow: 0 0 15px var(--company-color); }

        /* --- [LAYOUT CONTAINER] --- */
        .bottom-container { z-index: 100; }

        .controls { 
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 20px; 
        }

        /* 쥬크박스 */
        .jukebox-container {
            width: 100%; max-width: 400px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; margin-bottom: 5px;
            background: rgba(0,0,0,0.6); padding: 10px 0; border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
        }
        .jukebox-icon { font-size: 20px; }
        .jukebox-label { font-size: 1rem; color: #ffd700; font-weight: bold; letter-spacing: 2px; }
        .jukebox-container.playing { border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); background: rgba(255, 0, 85, 0.15); }
        .jukebox-container.playing .jukebox-label { color: #ff0055; }
        .jukebox-container.playing .jukebox-icon { animation: beat 0.8s infinite alternate; }
        @keyframes beat { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }

        /* 배팅 박스 (버튼 연결) */
        .bet-box { 
            display: flex; gap: 0; width: 100%; max-width: 400px;
            align-items: stretch; justify-content: center;
            background: rgba(20, 20, 35, 0.9); 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            overflow: hidden; 
            height: 50px;
        }
        .btn-bet { 
            flex: 1; background: #333; color: white; border: none; 
            cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; 
            border-right: 1px solid rgba(255,255,255,0.1); border-radius: 0; 
        }
        .btn-bet:last-child { border-right: none; }
        .btn-bet:hover { background: #444; }
        .btn-min { color: #ff9f43; } .btn-max { color: var(--gold); }
        .input-bet { 
            flex: 1; width: auto; background: #222; border: none; 
            color: var(--gold); text-align: center; font-size: 1.3rem; font-weight: bold; 
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .btn-join { width: 100%; max-width: 400px; padding: 16px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(90deg, #ff9f43, #ff6b6b); color: white; border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4); cursor: pointer; text-transform: uppercase; }
        .btn-join:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; background: #333; }

        /* --- [LIST STYLE] --- */
        .list-panel { 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(5px); border-radius: 12px; 
            padding: 10px; 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            display: flex; flex-direction: column;
        }
        .list-header { text-align: center; color: #ddd; font-weight:bold; font-size: 0.8rem; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; flex-shrink: 0; }
        
        .list-content { overflow-y: auto; flex-grow: 1; }
        .list-content::-webkit-scrollbar { width: 4px; }
        .list-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        
        .list-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        .p-color { width: 12px; height: 12px; border-radius: 3px; margin-right: 10px; box-shadow: 0 0 5px rgba(0,0,0,0.8); }
        .p-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight:500; }
        .p-amt { font-weight: bold; color: var(--gold); }

        /* =========================================
           [LAYOUT - PC VERSION]
           리스트: 우측 상단 고정
           컨트롤: 하단 중앙 고정
           ========================================= */
        @media (min-width: 769px) {
            .list-panel { 
                position: absolute; top: 140px; right: 20px; 
                width: 250px; max-height: 400px;
            }
            .bottom-container {
                position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
                padding-bottom: 20px;
                background: linear-gradient(to top, #000 80%, transparent);
                border-radius: 20px 20px 0 0;
                width: auto; max-width: 500px;
            }
        }

        /* =========================================
           [LAYOUT - MOBILE VERSION]
           컨테이너 하단 고정, 리스트는 버튼 아래 붙음 (스크롤)
           ========================================= */
        @media (max-width: 768px) {
            .pointer { left: 10px; }
            
            .bottom-container {
                position: absolute; bottom: 0; left: 0; width: 100%;
                max-height: 70vh; /* 화면의 70% 차지 */
                display: flex; flex-direction: column; align-items: center;
                background: linear-gradient(to top, #050714 95%, transparent);
                padding-bottom: 20px;
                overflow-y: auto; /* 전체 스크롤 */
                -webkit-overflow-scrolling: touch;
            }

            .controls { 
                width: 100%; flex-shrink: 0; 
                padding-bottom: 0;
            }

            .list-panel {
                width: 90%; 
                margin-top: 15px; 
                position: relative; 
                flex-shrink: 0; 
                max-height: 250px; /* 리스트 너무 길어지면 내부 스크롤 */
            }
        }

        /* 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); display: none; }
        .modal-overlay.active { display: flex; animation: popIn 0.4s ease; }
        .modal-box { background: linear-gradient(135deg, #1a0b2e, #050714); border: 2px solid var(--gold); border-radius: 20px; padding: 30px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 60px rgba(255, 215, 0, 0.3); }
        .modal-title { font-size: 1.8rem; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
        .modal-sub { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; max-height: 200px; overflow-y: auto; }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; position: relative; }
        .color-btn:hover { transform: scale(1.1); border-color: #fff; }
        .color-btn.selected { border: 3px solid #fff; box-shadow: 0 0 15px currentColor; transform: scale(1.2); }
        .color-btn.disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }
        .btn-confirm { background: var(--gold); color: #000; border: none; padding: 12px 40px; font-size: 1.2rem; font-weight: 900; border-radius: 50px; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn-confirm:disabled { background: #555; cursor: not-allowed; }
        .btn-close { background: var(--gold); color: #000; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 10px; }
        #resWinner { font-size: 2.5rem; color: #fff; margin: 10px 0; text-shadow: 0 0 20px var(--company-color); }
        
        /* 유튜브 플레이어 (숨김) */
        #player { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; }
    </style>
</head>
<body>
    <div id="centerCount" class="center-countdown">60</div>

    <div id="player"></div>

    <div id="ruleModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">PICK YOUR COLOR</div>
            <div class="modal-sub">이 색상으로 게임판에 표시됩니다.<br>(이미 선택된 색상은 사용할 수 없습니다)</div>
            <div id="colorGrid" class="color-grid"></div>
            <div id="selectedColorName" style="height:20px; color:#fff; font-weight:bold; margin-bottom:15px; font-size:0.9rem;"></div>
            <button id="btnStart" class="btn-confirm" onclick="confirmColorAndBet()" disabled>CONFIRM & BET</button>
        </div>
    </div>

    <div id="resultModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:2rem; font-weight:900; color:#ffd700;">ROUND FINISHED</div>
            <div style="font-size:0.9rem; color:#aaa; margin-top:10px;">WINNER</div>
            <div id="resWinner">Checking...</div>
            <div id="resAmount">Calculating...</div>
            <div id="resMsg" style="font-size:1.2rem; margin-top:15px; font-weight:bold;">결과를 불러오는 중입니다.</div>
            <button class="btn-close" onclick="closeModal('resultModal'); resetGame();">NEXT ROUND</button>
        </div>
    </div>

    <div class="marquee-wrap"><div class="marquee-text" id="marqueeText">🔥 THE UNIQUE CASINO에 오신 것을 환영합니다! 실시간 접속 유저들과 승부하세요! 🔥</div></div>
    
    <div class="top-hud">
        <div class="hud-box"><div class="hud-label">TOTAL EQUITY</div><div class="hud-value" id="poolDisplay">100 UT</div></div>
        <div class="hud-box"><div class="hud-label">TIME LEFT</div><div class="hud-timer" id="timerDisplay">30:00</div></div>
    </div>
    
    <div class="game-stage">
        <div class="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="bottom-container">
        <div class="controls">
            <div id="jukebox" class="jukebox-container" onclick="toggleAudio()">
                <div class="jukebox-icon">🎵</div>
                <div class="jukebox-label">JUKEBOX OFF</div>
            </div>

            <div class="bet-box">
                <button class="btn-bet btn-min" onclick="setMinBet()">MIN</button>
                <button class="btn-bet" onclick="changeBet(-10)">-10</button>
                <input type="number" id="betInput" class="input-bet" value="10" readonly>
                <button class="btn-bet" onclick="changeBet(10)">+10</button>
                <button class="btn-bet btn-max" onclick="setMaxBet()">MAX</button>
            </div>
            
            <button id="joinBtn" class="btn-join" onclick="joinGame()">참여하기 (BET)</button>
            <div style="font-size:0.8rem; color:#aaa;">내 자산: <span id="myBalance" style="color:white;">Loading...</span></div>
        </div>

        <div class="list-panel">
            <div class="list-header">실시간 지분 현황 (Live)</div>
            <div class="list-content">
                <div id="participantList"><div style="text-align:center; color:#ddd; font-size:0.8rem; padding:5px;">로딩중...</div></div>
            </div>
        </div>
    </div>
    
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // [중요] 배포 URL 확인
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec"; 
        
        let myId = ""; let myWallet = 0; let myColor = null;
        
        // [핵심] Company 기본값 (빨강) - 초기화 시 무조건 설정
        let gameState = { 
            participants: [{ name: "Company", amount: 100, color: "#ff0055" }], 
            totalPool: 100, 
            timeLeft: 1800, 
            rotation: 0 
        };
        let isBettingProcessing = false;
        let lastDisplayedWinner = ""; 

        const availableColors = [
            '#ff0055', '#00ff44', '#00ccff', '#ffdd00', '#aa00ff', '#ff6600', '#ffffff', '#ff99cc', '#99ff99', '#6666ff',
            '#cc0000', '#006600', '#000099', '#663300', '#666666', '#00ff99', '#ff3399', '#ccff00', '#9900cc', '#33ccff'
        ];

        var player;
        var isPlaying = false;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '315', width: '560',
                videoId: '',
                playerVars: { 'listType': 'playlist', 'list': 'PLFq6335YyVBsKhW_W7WjXgTPlV4UjZ6sF', 'autoplay': 0, 'controls': 0, 'loop': 1 },
                events: { 'onReady': onPlayerReady }
            });
        }
        function onPlayerReady(event) { event.target.setVolume(50); }
        function toggleAudio() {
            if (!player) return;
            const juke = document.getElementById('jukebox');
            const label = juke.querySelector('.jukebox-label');
            if (isPlaying) {
                player.pauseVideo(); juke.classList.remove('playing'); label.innerText = "JUKEBOX OFF"; isPlaying = false;
            } else {
                player.playVideo(); juke.classList.add('playing'); label.innerText = "JUKEBOX ON ♫"; isPlaying = true;
            }
        }

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            myId = params.get('id') || localStorage.getItem('user_id') || localStorage.getItem('loginId');
            if (!myId) { alert("로그인이 필요합니다."); window.location.href = "../the-unique-main.html"; return; }
            
            await fetchUserData();
            const savedColor = localStorage.getItem('rouletteColor_' + myId);
            if (savedColor) myColor = savedColor;

            updateGameState(); // 초기 Company 그리기
            requestAnimationFrame(drawGiantWheel);
            startTimer();
            startMarqueeScheduler();
            startPolling(); 
        };

        async function syncGameState() {
            try {
                const res = await fetch(`${GAS_URL}?action=getRouletteState`);
                const data = await res.json();
                if (data.result === "success") {
                    if (data.participants && data.participants.length > 0) {
                        gameState.participants = data.participants;
                    } else {
                        // 데이터가 비었어도 Company 기본값 유지 (빨강)
                        gameState.participants = [{ name: "Company", amount: 100, color: "#ff0055" }];
                    }
                    updateGameState();
                    if (data.lastWinner && data.lastWinner.round !== lastDisplayedWinner) {
                        lastDisplayedWinner = data.lastWinner.round; 
                        showWinnerModal(data.lastWinner);
                    }
                }
            } catch (e) { 
                console.error("Sync Error:", e);
                // 에러시에도 Company 유지
                if(gameState.participants.length === 0) {
                    gameState.participants = [{ name: "Company", amount: 100, color: "#ff0055" }];
                    updateGameState();
                }
            }
        }

        function startPolling() { syncGameState(); setInterval(syncGameState, 3000); }

        function openColorPicker() {
            const grid = document.getElementById('colorGrid');
            grid.innerHTML = "";
            const usedColors = gameState.participants.map(p => p.color);
            availableColors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn';
                btn.style.backgroundColor = color;
                btn.style.boxShadow = `0 0 10px ${color}`;
                if (usedColors.includes(color)) btn.classList.add('disabled');
                else {
                    btn.onclick = () => {
                        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        myColor = color;
                        document.getElementById('selectedColorName').innerText = "SELECTED";
                        document.getElementById('btnStart').disabled = false;
                    };
                }
                grid.appendChild(btn);
            });
            document.getElementById('ruleModal').classList.add('active');
        }

        function confirmColorAndBet() {
            if (!myColor) return;
            localStorage.setItem('rouletteColor_' + myId, myColor);
            closeModal('ruleModal');
            joinGame(); 
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        async function fetchUserData() {
            try {
                const res = await fetch(`${GAS_URL}?action=getUserInfo&id=${myId}`);
                const data = await res.json();
                if (data.result === "success") {
                    myWallet = Number(data.balance);
                    document.getElementById('myBalance').innerText = myWallet.toLocaleString() + " UT";
                }
            } catch (e) { console.error(e); }
        }

        function updateGameState() {
            gameState.totalPool = gameState.participants.reduce((acc, p) => acc + p.amount, 0);
            document.getElementById('poolDisplay').innerText = gameState.totalPool.toLocaleString() + " UT";
            gameState.participants.sort((a, b) => b.amount - a.amount);
            
            const list = document.getElementById('participantList');
            list.innerHTML = "";
            gameState.participants.forEach((p, index) => {
                const isMe = p.name.toLowerCase() === myId.toLowerCase();
                const displayColor = isMe && myColor ? myColor : (p.color || '#999');
                p.color = displayColor; 

                list.innerHTML += `
                    <div class="list-item">
                        <div class="p-color" style="background:${displayColor}; box-shadow: 0 0 8px ${displayColor};"></div>
                        <div class="p-name" style="${isMe ? `color:${displayColor}; font-weight:bold;` : ''}">${p.name}</div>
                        <div class="p-amt">${p.amount.toLocaleString()}</div>
                    </div>`;
            });
        }

        function changeBet(val) {
            let v = parseInt(document.getElementById('betInput').value) + val;
            if (v < 10) v = 10;
            document.getElementById('betInput').value = v;
        }
        function setMinBet() { document.getElementById('betInput').value = 10; }
        function setMaxBet() { document.getElementById('betInput').value = myWallet; }

        function joinGame() {
            if (isBettingProcessing) return;
            if (!myColor) { openColorPicker(); return; }
            const amount = parseInt(document.getElementById('betInput').value);
            if (amount > myWallet) return alert("잔액이 부족합니다.");
            if (amount <= 0) return alert("금액 확인 필요");
            if (gameState.timeLeft <= 60) return alert("마감되었습니다.");
            
            isBettingProcessing = true;
            const btn = document.getElementById('joinBtn');
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = "처리중...";
            
            fetch(`${GAS_URL}?action=rouletteResult&type=bet&id=${myId}&amount=${amount}&color=${encodeURIComponent(myColor)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.result === "success") {
                        myWallet = data.newBalance;
                        document.getElementById('myBalance').innerText = myWallet.toLocaleString() + " UT";
                        btn.innerText = "배팅 성공!";
                        syncGameState(); // 즉시 동기화
                    } else { alert(data.msg); btn.innerText = originalText; }
                })
                .catch(err => { console.error(err); alert("통신 오류"); btn.innerText = originalText; })
                .finally(() => { isBettingProcessing = false; btn.disabled = false; setTimeout(() => { if(!isBettingProcessing && gameState.timeLeft > 60) btn.innerText = originalText; }, 2000); });
        }

        function showWinnerModal(winnerData) {
            const modal = document.getElementById('resultModal');
            document.getElementById('resWinner').innerText = winnerData.name;
            document.getElementById('resAmount').innerText = parseInt(winnerData.prize).toLocaleString() + " UT";
            const msgEl = document.getElementById('resMsg');
            if (winnerData.name.toLowerCase() === myId.toLowerCase()) {
                msgEl.innerText = "축하합니다! 당신이 승자입니다! 🎉"; msgEl.style.color = "#00ff44";
            } else if (winnerData.name === "Company") {
                msgEl.innerText = "이번 라운드는 본사가 승리했습니다."; msgEl.style.color = "#ff0055";
            } else {
                msgEl.innerText = `아쉽네요... 승자는 ${winnerData.name}님 입니다.`; msgEl.style.color = "#aaa";
            }
            modal.classList.add('active');
        }

        function startTimer() {
            setInterval(() => {
                const now = new Date();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const target = minutes < 30 ? 30 : 60;
                const remain = ((target - minutes - 1) * 60) + (60 - seconds);
                gameState.timeLeft = remain;
                
                const dMin = Math.floor(remain / 60);
                const dSec = remain % 60;
                document.getElementById('timerDisplay').innerText = `${dMin}:${dSec < 10 ? '0'+dSec : dSec}`;
                
                const countEl = document.getElementById('centerCount');
                if (remain <= 10 && remain > 0) {
                    countEl.innerText = remain; countEl.classList.add('active');
                } else {
                    countEl.classList.remove('active'); 
                }
            }, 1000);
        }
        function resetGame() { location.reload(); }
        function startMarqueeScheduler() { const marquee = document.getElementById('marqueeText'); setInterval(() => { marquee.innerText = "🚨 [안내] 마감 1분 전까지만 배팅 참여가 가능합니다! 서두르세요! 🚨"; marquee.style.color = "#ffdd59"; setTimeout(() => { marquee.innerText = "🔥 THE UNIQUE CASINO에 오신 것을 환영합니다! 🔥"; marquee.style.color = "#fff"; }, 15000); }, 60000); }

        function drawGiantWheel() {
            const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const w = canvas.width; const h = canvas.height;
            const radius = h * 2.5; const centerX = radius + 50; const centerY = h / 2;

            gameState.rotation += 0.0035; 
            ctx.clearRect(0, 0, w, h); ctx.save();
            ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#0a0a0a"; ctx.fill(); ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 15; ctx.stroke(); ctx.shadowBlur = 0;

            if (gameState.participants.length > 0) {
                gameState.participants.forEach(p => {
                    const sliceAngle = (p.amount / gameState.totalPool) * 2 * Math.PI; 
                    const endAngle = startAngle + sliceAngle;
                    ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius - 20, startAngle, endAngle); ctx.closePath(); 
                    ctx.fillStyle = p.color || '#555'; ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 2; ctx.stroke();
                    
                    if (sliceAngle > 0.05) {
                        const midAngle = startAngle + sliceAngle / 2;
                        const textRadius = radius - 150; 
                        const tx = centerX + Math.cos(midAngle) * textRadius;
                        const ty = centerY + Math.sin(midAngle) * textRadius;
                        
                        ctx.save(); ctx.translate(tx, ty); ctx.rotate(midAngle + Math.PI); 
                        ctx.textAlign = "right"; ctx.textBaseline = "middle";
                        
                        // [텍스트 가독성 강화]
                        ctx.shadowColor = "rgba(0,0,0,1)"; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                        ctx.fillStyle = "#fff"; ctx.font = "bold 50px Pretendard"; ctx.fillText(p.name, 0, -25); 
                        ctx.fillStyle = "#ffd700"; ctx.font = "bold 30px monospace"; ctx.fillText(p.amount.toLocaleString() + " UT", 0, 25); 
                        
                        ctx.restore();
                    }
                    startAngle = endAngle;
                });
            }
            
            const grad = ctx.createRadialGradient(centerX, centerY, radius * 0.95, centerX, centerY, radius);
            grad.addColorStop(0, "rgba(0,0,0,0)"); grad.addColorStop(1, "rgba(0,0,0,0.3)");
            ctx.fillStyle = grad; ctx.fill();
            ctx.restore(); requestAnimationFrame(drawGiantWheel);
        }
    </script>
