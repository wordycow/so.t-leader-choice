<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UNIQUE ROYAL ROULETTE</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">

  <!-- ✅ FIX: Supabase는 반드시 여기서 로드(스크립트 깨짐 방지) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg0:#05070f;
      --bg1:#070b18;
      --gold1:#ffd36b;
      --gold2:#f7b500;
      --gold3:#ffcc00;
      --muted:#a8b0c6;
      --txt:#e9edf7;
      --pink:#ff0a78;

      --radius:22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --glow: 0 0 18px rgba(255, 200, 70, 0.18);

      --roundSec: 900;      /* 15분 */
      --lockSec: 60;        /* 60초 남으면 베팅 잠금 */
      --freezeSec: 30;      /* 승자 표시 30초 유지 */

      --themeBarH: 44px;    /* 하단 테마바 높이 */
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      overflow-x:hidden;
      padding-bottom: calc(var(--themeBarH) + env(safe-area-inset-bottom)); /* ✅ 고정바가 화면 가리지 않게 */
    }

    /* ==========================
       럭셔리 배경 3종 (MARBLE/CARBON/VELVET)
       ========================== */
    body[data-bg="0"]{
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 208, 80, 0.10), transparent 60%),
        radial-gradient(900px 500px at 15% 30%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(900px 500px at 90% 40%, rgba(255, 30, 120, 0.06), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }
    body[data-bg="1"]{
      background:
        radial-gradient(1100px 700px at 50% -10%, rgba(255, 208, 80, 0.09), transparent 60%),
        repeating-linear-gradient(135deg,
          rgba(255,255,255,0.03) 0 2px,
          rgba(0,0,0,0.00) 2px 10px),
        repeating-linear-gradient(45deg,
          rgba(255,255,255,0.02) 0 1px,
          rgba(0,0,0,0.00) 1px 8px),
        linear-gradient(180deg, #04060d, #070b18);
    }
    body[data-bg="2"]{
      background:
        radial-gradient(900px 500px at 50% 0%, rgba(255, 208, 80, 0.09), transparent 60%),
        radial-gradient(900px 600px at 20% 35%, rgba(140, 60, 255, 0.09), transparent 55%),
        radial-gradient(900px 600px at 85% 55%, rgba(255, 10, 120, 0.08), transparent 60%),
        linear-gradient(180deg, #04040a, #090818);
    }

    /* Top ticker */
    .ticker{
      position:sticky; top:0; z-index:60;
      width:100%;
      border-bottom:1px solid rgba(255, 208, 80, 0.10);
      background: linear-gradient(180deg, rgba(0,0,0,0.76), rgba(0,0,0,0.35));
      backdrop-filter: blur(10px);
    }
    .ticker .inner{
      display:flex; gap:14px; align-items:center;
      white-space:nowrap;
      padding:10px 14px;
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.06em;
      color: rgba(255, 208, 80, 0.85);
      font-size:12px;
      overflow:hidden;
    }
    .marquee{
      display:inline-block;
      animation: scroll 22s linear infinite;
      padding-left:100%;
    }
    @keyframes scroll{ 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }

    /* Layout */
    .wrap{
      width:100%;
      max-width: 1800px;   /* ✅ PC 꽉차게 크게 */
      margin: 0 auto;
      padding: 14px 14px 18px;
      min-height: calc(100vh - 44px);
    }
    .grid{
      display:grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 14px;
      align-items:stretch;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border:1px solid rgba(255, 208, 80, 0.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    /* Stage (wheel area) */
    .stage{
      display:flex;
      flex-direction:column;
      height: calc(100vh - 70px - var(--themeBarH));
      min-height: 680px;
      background:
        radial-gradient(900px 700px at 45% 35%, rgba(0,0,0,0.0), rgba(0,0,0,0.55)),
        linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.6));
      border-right:1px solid rgba(255, 208, 80, 0.10);
    }

    /* Wheel viewport */
    .wheelViewport{
      position:relative;
      width:100%;
      flex: 1 1 auto;
      min-height: 520px;
      overflow:hidden;
      border-bottom:1px solid rgba(255, 208, 80, 0.10);
      background:
        radial-gradient(800px 500px at 50% 25%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(1200px 900px at 50% 70%, rgba(0,0,0,0.75), rgba(0,0,0,0.15));
    }

    .wheelDock{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: min(78vh, 820px);
      height: min(78vh, 820px);
      max-width: 92vw;
      max-height: 92vw;
    }

    canvas#wheel{
      width:100%;
      height:100%;
      display:block;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,0.55));
    }

    /* ✅ Pointer (triangle only) - 찐한 금색 */
    .pointer{
      position:absolute;
      left:50%;
      top:10px;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 26px solid var(--gold3);
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55)) drop-shadow(0 0 10px rgba(255,204,0,0.22));
      z-index:20;
      opacity:0.98;
    }

    /* HUD under wheel */
    .hud{
      flex: 0 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
    }
    .hudBox{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.22));
      border:1px solid rgba(255, 208, 80, 0.12);
      border-radius: 16px;
      padding: 12px 12px;
    }
    .hudLabel{
      font-family:"Cinzel", serif;
      letter-spacing:.08em;
      font-size:11px;
      color: rgba(255,255,255,0.60);
      margin-bottom:6px;
    }
    .hudValue{
      font-family:"Cinzel", serif;
      font-size:34px;
      font-weight:700;
      color: var(--gold3);
      text-shadow: 0 0 18px rgba(255, 208, 80, 0.18);
      line-height:1.1;
    }
    .hudValue.small{
      font-size:28px;
      color:#fff;
      text-shadow:none;
      font-family:"Rajdhani", sans-serif;
      letter-spacing:.04em;
    }

    /* Countdown pretty */
    .countBig{
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      font-size:34px;
      letter-spacing:.06em;
      color: #fff;
    }
    .countWarn{
      color: var(--gold3);
      text-shadow: 0 0 18px rgba(255, 208, 80, 0.24);
    }
    .countFinal{
      color: var(--pink);
      text-shadow: 0 0 18px rgba(255, 10, 120, 0.25);
      animation: blink 0.65s steps(2, end) infinite;
    }
    @keyframes blink{ 50%{opacity:0.25} }

    /* Right panel */
    #sideCard{
      display:flex;
      flex-direction:column;
      height: calc(100vh - 70px - var(--themeBarH));
      min-height: 680px;
    }
    .sideTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 208, 80, 0.10);
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.12));
    }
    .sideTitle{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      font-size:12px;
      color: rgba(255, 208, 80, 0.9);
      line-height:1.1;
    }
    .sideStatus{
      font-size:11px;
      color: rgba(255,255,255,0.60);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 210px;
    }

    /* Player Bar (BGM) */
    .playerBar{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 8px 10px;
      border:1px solid rgba(255, 208, 80, 0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.25));
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      max-width: 100%;
      overflow:hidden;
    }
    .pBtn{
      width:34px;height:34px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
      flex: 0 0 auto;
    }
    .pBtn:active{ transform: translateY(1px); }

    .pMeta{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap:2px;
      flex: 1 1 auto;
    }
    .pName{
      font-family:"Cinzel", serif;
      font-weight:700;
      font-size:12px;
      letter-spacing:.06em;
      color: rgba(255, 208, 80, 0.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pSub{
      font-size:11px;
      color: rgba(255,255,255,0.55);
    }
    .volWrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
      justify-content:flex-end;
    }
    .volLabel{
      font-family:"Cinzel", serif;
      font-size:11px;
      letter-spacing:.07em;
      color: rgba(255,255,255,0.62);
      white-space:nowrap;
    }
    input[type="range"]{ width: 120px; max-width: 24vw; }

    /* Bet panel */
    .betBox{ padding: 14px; }
    .row{
      display:flex; align-items:center; justify-content:space-between; gap: 10px;
      margin-bottom: 10px;
    }
    .kv{
      font-size:12px;
      color: rgba(255,255,255,0.65);
      letter-spacing:.02em;
    }
    .kv b{ color:#fff; font-weight:700; }
    .pill{
      padding:6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255, 208, 80, 0.14);
      background: rgba(0,0,0,0.25);
      color: rgba(255, 208, 80, 0.88);
      font-size:12px;
      white-space:nowrap;
    }
    .pill.open{ color: rgba(255, 208, 80, 0.88); border-color: rgba(255, 208, 80, 0.18); }
    .pill.closed{ color: rgba(255,255,255,0.88); border-color: rgba(255,255,255,0.14); }

    .amountBox{
      border:1px solid rgba(255, 208, 80, 0.22);
      background: rgba(0,0,0,0.28);
      border-radius: 14px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      letter-spacing:.06em;
      color: var(--gold3);
      font-size:22px;
      box-shadow: var(--glow);
      margin-bottom: 10px;
    }

    .btnRow{
      display:flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn{
      flex:1;
      height: 42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.28);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
      font-weight:700;
    }
    .btn.gold{
      border:1px solid rgba(255, 208, 80, 0.35);
      color: var(--gold3);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    /* BET NOW 버튼: OPEN(번쩍) / CLOSED(크로스) */
    .betNow{
      position: relative;
      width:100%;
      height: 54px;
      border-radius: 999px;
      border:1px solid rgba(255, 208, 80, 0.22);
      background:
        radial-gradient(120% 180% at 50% 0%, rgba(255,255,255,0.06), transparent 62%),
        linear-gradient(90deg, rgba(10,12,20,0.95), rgba(12,14,24,0.92));
      color: rgba(255, 230, 160, .95);
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.12em;
      cursor:pointer;
      overflow:hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,.04);
      margin-bottom: 10px;
    }
    .betNow.is-open{
      border-color: rgba(255, 208, 80, 0.55);
      box-shadow:
        0 0 0 1px rgba(255, 208, 80, .12),
        0 16px 50px rgba(0,0,0,.58),
        0 0 28px rgba(255, 10, 120, .22);
    }
    .betNow.is-open::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        linear-gradient(110deg,
          transparent 0%,
          rgba(255, 208, 80, 0.00) 35%,
          rgba(255, 208, 80, 0.35) 45%,
          rgba(255, 10, 120, 0.25) 55%,
          rgba(255, 208, 80, 0.00) 65%,
          transparent 100%);
      transform: translateX(-60%);
      animation: betShine 1.35s linear infinite;
      mix-blend-mode: screen;
      pointer-events:none;
    }
    .betNow.is-open::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(80% 140% at 15% 50%, rgba(255, 20, 120, .30), transparent 60%),
        radial-gradient(80% 140% at 85% 50%, rgba(255, 60, 120, .16), transparent 62%);
      opacity: .90;
      pointer-events:none;
    }
    @keyframes betShine{
      0%{ transform: translateX(-70%); opacity:.65; }
      65%{ opacity: .98; }
      100%{ transform: translateX(70%); opacity:.65; }
    }

    .betNow.is-closed,
    .betNow:disabled{
      cursor:not-allowed;
      color: rgba(255,255,255,0.35);
      border-color: rgba(255,255,255,0.10);
      background:
        radial-gradient(120% 180% at 50% 0%, rgba(255,255,255,0.04), transparent 62%),
        linear-gradient(90deg, rgba(8,10,18,0.95), rgba(8,10,18,0.88));
      box-shadow: 0 12px 30px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .betNow.is-closed::before,
    .betNow:disabled::before{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(135deg,
          transparent 0 46%,
          rgba(255, 60, 120, 0.85) 46% 49%,
          transparent 49% 100%);
      opacity: .55;
      pointer-events:none;
      animation:none;
    }
    .betNow.is-closed::after,
    .betNow:disabled::after{
      content:"";
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(0deg,
          rgba(255,255,255,0.05) 0 1px,
          transparent 1px 6px);
      opacity:.18;
      pointer-events:none;
    }

    /* Lists */
    .list{
      flex:1 1 auto;
      overflow:auto;
      padding: 10px 14px 14px;
      border-top:1px solid rgba(255, 208, 80, 0.10);
    }
    .listTitle{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 8px;
    }
    .listTitle span{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      font-size:12px;
      color: rgba(255,255,255,0.70);
    }
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.22);
      margin-bottom: 8px;
    }
    .nameWrap{
      display:flex; align-items:center; gap:10px;
      min-width:0;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background: var(--pink);
      box-shadow: 0 0 14px rgba(255, 10, 120, 0.25);
      flex: 0 0 auto;
    }
    .nm{
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 220px;
    }
    .amt{
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      letter-spacing:.05em;
      color: var(--gold3);
      white-space:nowrap;
    }

    /* Winner overlay */
    .winner{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: radial-gradient(600px 420px at 50% 35%, rgba(0,0,0,0.25), rgba(0,0,0,0.88));
      z-index:40;
    }
    .winnerCard{
      width:min(520px, 92vw);
      border-radius: 22px;
      border:1px solid rgba(255, 208, 80, 0.22);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.55));
      box-shadow: 0 26px 80px rgba(0,0,0,0.65);
      padding: 16px 16px 14px;
      text-align:center;
    }
    .winnerTop{
      font-family:"Cinzel", serif;
      letter-spacing:.12em;
      color: rgba(255, 208, 80, 0.9);
      font-weight:700;
      font-size:13px;
      margin-bottom: 10px;
    }
    .winnerName{
      font-family:"Cinzel", serif;
      font-size:34px;
      font-weight:700;
      color:#fff;
      text-shadow: 0 0 18px rgba(255,255,255,0.12);
      margin-bottom: 6px;
      word-break:break-word;
    }
    .winnerSub{
      font-family:"Rajdhani", sans-serif;
      font-size:18px;
      letter-spacing:.08em;
      color: var(--gold3);
    }

    /* ==========================
       ✅ 테마 버튼: 얇고 세련된 하단 바
       ========================== */
    .themeBar{
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      transform: translateX(-50%);
      z-index: 90;
      width: min(720px, 94vw);
      height: var(--themeBarH);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 208, 80, 0.16);
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .themeBar .seg{
      width:100%;
      height: 100%;
      display:flex;
      gap: 6px;
    }
    .themeBar button{
      flex:1;
      height: 100%;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.22);
      color: rgba(255,255,255,0.78);
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      cursor:pointer;
      font-size:11px;
      white-space:nowrap;
    }
    .themeBar button.active{
      border-color: rgba(255, 208, 80, 0.45);
      color: rgba(255, 208, 80, 0.92);
      box-shadow: inset 0 0 0 1px rgba(255, 208, 80, 0.10), 0 8px 22px rgba(0,0,0,0.45);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.18));
    }

    /* Mobile rules */
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .stage{ height: auto; min-height: unset; }
      #sideCard{ height:auto; min-height: unset; }

      .wheelViewport{ height: 72vw; max-height: 420px; flex: 0 0 auto; }

      .wheelDock{
        width: 140vw;
        height: 140vw;
        max-width: 760px;
        max-height: 760px;
        left:50%;
        top: 6px;
        transform: translateX(-50%);
      }

      .pointer{ top: 8px; }

      .playerBar{ flex-wrap: wrap; row-gap: 8px; }
      .pMeta{ flex: 1 1 160px; }
      .volWrap{ width:100%; justify-content:flex-end; }
      input[type="range"]{ width: 130px; max-width: 52vw; }
      .pBtn{ width:30px; height:30px; border-radius: 11px; }
      .pName{ font-size:11px; }
      .volLabel{ font-size:10px; }
    }

    @media (max-width: 420px){
      .nm{ max-width: 170px; }
      .hudValue{ font-size:30px; }
      .hudValue.small{ font-size:26px; }
    }
  </style>

  <!-- ✅ 네가 만든 플레이리스트 파일 (필수) -->
  <script src="./roulette.playlist.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body data-bg="0">
  <div class="ticker">
    <div class="inner">
      <span class="marquee" id="tickerText">
        UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎  ·  LAST WINNER: (WAITING) 🏆  ·  UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎
      </span>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <!-- LEFT: STAGE -->
      <div class="card stage">
        <div class="wheelViewport" id="wheelViewport">
          <div class="pointer" id="pointer"></div>
          <div class="wheelDock">
            <canvas id="wheel"></canvas>
          </div>

          <div class="winner" id="winnerOverlay">
            <div class="winnerCard">

async function sbFetchRoundBets(rk){
  if(!sb) return [];
  const { data, error } = await sb
    .from("roulette_bets")
    .select("id, round, player_id, amount, created_at")
    .eq("round", rk)
    .order("created_at", { ascending: true });

  if(error){
    console.warn("[SB] fetch error", error);
    sbLiveOk = false;
    setSyncText(false);
    return [];
  }

  return (data || []).map(x => ({
    round: x.round,
    row_id: x.id,
    id: x.player_id,
    amount: x.amount,
    ts: new Date(x.created_at).getTime()
  }));
}

async function sbInsertBet(rk, playerId, amount){
  if(!sb) return null;

  // ✅ insert 성공하면 row를 바로 받아서 cache에 넣어 “즉시” 보이게 함
  const { data, error } = await sb
    .from("roulette_bets")
    .insert({ round: rk, player_id: playerId, amount })
    .select("id, round, player_id, amount, created_at")
    .single();

  if(error){
    console.warn("[SB] insert error", error);
    sbLiveOk = false;
    setSyncText(false);
    return null;
  }

  const row = {
    round: data.round,
    row_id: data.id,
    id: data.player_id,
    amount: data.amount,
    ts: new Date(data.created_at).getTime()
  };

  // 중복 방지
  if(!serverBetsCache.some(b => b.row_id === row.row_id)){
    serverBetsCache.push(row);
  }

  sbLiveOk = true;
  setSyncText(true);
  return row;
}

async function sbResubscribeRound(rk){
  if(!sb) return;

  // 1) 현재 라운드 전체를 먼저 받아서 캐시 채움
  serverBetsCache = await sbFetchRoundBets(rk);

  // fetch가 실패했다면 로컬 모드로
  if(!serverBetsCache){
    sbLiveOk = false;
    setSyncText(false);
    return;
  }

  sbLiveOk = true;
  setSyncText(true);

  // 2) 라운드 채널 재구독
  if(sbChannel){
    try{ await sb.removeChannel(sbChannel); }catch(e){}
    sbChannel = null;
  }

  sbChannel = sb.channel("roulette_bets_" + rk)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "roulette_bets",
      filter: `round=eq.${rk}`
    }, (payload) => {
      const n = payload.new;
      const row = {
        round: n.round,
        row_id: n.id,
        id: n.player_id,
        amount: n.amount,
        ts: new Date(n.created_at).getTime()
      };
      if(!serverBetsCache.some(b => b.row_id === row.row_id)){
        serverBetsCache.push(row);
      }
      sbLiveOk = true;
      setSyncText(true);
    })
    .subscribe((status)=>{
      // subscribed / closed / channel_error 등
      if(status === "SUBSCRIBED"){
        sbLiveOk = true;
        setSyncText(true);
      }
    });
}

/* ==========================
   5) Wheel Drawing
   ✅ 글씨가 “판에 붙어서 같이 도는 느낌”으로 수정
   - 네 코드 문제: ctx가 이미 wheelAngle만큼 rotate된 상태인데
     라벨 함수에서 midAngle + wheelAngle을 또 더해서 “따로 노는” 현상 발생했음.
   ✅ “9시 기준 옆으로” = 라벨을 조각의 각도(midAngle) 기준으로 회전해서 표시
========================== */
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
let wheelAngle = 0;
let wheelRunning = true;

function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }

function hashStr(s){
  s = String(s||"");
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h>>>0);
}

const SEG_PALETTES = [
  {a:"#0b0f1a", b:"#39445e", c:"#05060b"},
  {a:"#081b3a", b:"#2f6bff", c:"#040a16"},
  {a:"#063426", b:"#19c7a1", c:"#041a13"},
  {a:"#2a0a2a", b:"#a76bff", c:"#120514"},
  {a:"#3a0018", b:"#d4145a", c:"#16000a"},
  {a:"#1a0f00", b:"#ffd36b", c:"#080500"},
];

function pickPalette(name){
  const idx = hashStr(name) % SEG_PALETTES.length;
  return SEG_PALETTES[idx];
}

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height= Math.floor(rect.height * dpr);
  drawWheel();
}
window.addEventListener("resize", ()=>{ resizeCanvas(); dockBgmBar(); });

function drawWheel(players = null){
  const list = players || getCurrentAggregatedPlayers();
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H)*0.46;

  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(wheelAngle);

  ctx.beginPath();
  ctx.arc(0,0,R*1.08,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,0.28)";
  ctx.fill();

  const grd = ctx.createLinearGradient(-R, -R, R, R);
  grd.addColorStop(0, "#8b6a00");
  grd.addColorStop(0.35, "#ffd36b");
  grd.addColorStop(0.65, "#f7b500");
  grd.addColorStop(1, "#4a3400");
  ctx.beginPath();
  ctx.arc(0,0,R*1.03,0,Math.PI*2);
  ctx.lineWidth = R*0.08;
  ctx.strokeStyle = grd;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0,0,R*0.94,0,Math.PI*2);
  ctx.fillStyle = "#0b0b10";
  ctx.fill();

  const total = Math.max(1, list.reduce((s,p)=>s+p.amount,0));
  let start = -Math.PI/2;

  for(let i=0;i<list.length;i++){
    const p = list[i];
    const frac = Math.max(0.001, p.amount/total);
    const ang = frac * Math.PI*2;

    const pal = pickPalette(p.id);
    const segGrd = ctx.createRadialGradient(0,0,R*0.18, 0,0,R*1.03);
    segGrd.addColorStop(0, pal.b);
    segGrd.addColorStop(0.62, pal.a);
    segGrd.addColorStop(1, pal.c);

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R*0.92, start, start+ang);
    ctx.closePath();
    ctx.fillStyle = segGrd;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(start)*R*0.92, Math.sin(start)*R*0.92);
    ctx.strokeStyle = "rgba(255, 208, 80, 0.14)";
    ctx.lineWidth = 2*dpr;
    ctx.stroke();

    const mid = start + ang/2;

    // ✅ 라벨(판에 붙어서 같이 도는 느낌)
    drawLabelRadial9OClock(p.id, p.amount, mid, ang, R);

    start += ang;
  }

  ctx.beginPath();
  ctx.arc(0,0,R*0.90,0,Math.PI*2);
  ctx.strokeStyle="rgba(255,255,255,0.06)";
  ctx.lineWidth=2*dpr;
  ctx.stroke();

  const cR = R*0.22;
  const ring = ctx.createLinearGradient(-cR, -cR, cR, cR);
  ring.addColorStop(0, "#3c2a00");
  ring.addColorStop(0.5, "#ffd36b");
  ring.addColorStop(1, "#5a3b00");

  ctx.beginPath();
  ctx.arc(0,0,cR*1.02,0,Math.PI*2);
  ctx.fillStyle="#000";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,0,cR*1.02,0,Math.PI*2);
  ctx.lineWidth = cR*0.22;
  ctx.strokeStyle = ring;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0,0,cR*0.78,0,Math.PI*2);
  ctx.fillStyle="#07070b";
  ctx.fill();

  ctx.font = `${Math.floor(cR*0.55)}px Cinzel`;
  ctx.fillStyle = "#ffd36b";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="rgba(255, 208, 80, 0.28)";
  ctx.shadowBlur=18*dpr;
  ctx.fillText("UNIQUE", 0, 0);
  ctx.shadowBlur=0;

  ctx.restore();
}

// ✅ “9시 기준 옆으로” + “판에 붙어서 같이 도는 느낌”
function drawLabelRadial9OClock(name, amt, midAngle, segAngle, R){
  if(segAngle < 0.10) return; // 너무 작은 조각은 숨김

  const label = String(name||"").trim();
  const amountText = `${amt}`;

  const scale = clamp(segAngle / 0.55, 0.55, 1.0);
  const nameSize = Math.floor(clamp(R*0.055, 12*dpr, 22*dpr) * scale);
  const amtSize  = Math.floor(clamp(R*0.050, 11*dpr, 20*dpr) * scale);
  const maxW = R * (0.34 * scale);

  ctx.save();

  // 조각의 중간각으로 회전 → 라벨이 “원판에 붙어서” 같이 돌아감
  ctx.rotate(midAngle);
  ctx.translate(R*0.58, 0);

  // 왼쪽 반쪽이면 뒤집어서(가독성)
  const flip = (midAngle > Math.PI/2 && midAngle < 3*Math.PI/2);
  if(flip){
    ctx.rotate(Math.PI);
    ctx.textAlign = "right";
  }else{
    ctx.textAlign = "left";
  }

  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 10*dpr;

  let t = label;
  ctx.font = `${nameSize}px Cinzel`;
  while(ctx.measureText(t).width > maxW && t.length>3) t = t.slice(0,-1);
  if(t !== label) t = t.slice(0, Math.max(2, t.length-1)) + "…";

  // 작은 조각이면 금액만
  if(segAngle < 0.18){
    ctx.font = `${amtSize}px Rajdhani`;
    ctx.fillStyle = "rgba(255,255,255,0.90)";
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 3*dpr;
    ctx.strokeText(amountText, 0, 0);
    ctx.fillText(amountText, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
    return;
  }

  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.strokeStyle = "rgba(0,0,0,0.38)";
  ctx.lineWidth = 3*dpr;
  ctx.strokeText(t, 0, -R*0.06*scale);
  ctx.fillText(t, 0, -R*0.06*scale);

  ctx.font = `${amtSize}px Rajdhani`;
  ctx.fillStyle = "rgba(255, 210, 130, 0.95)";
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 3*dpr;
  ctx.strokeText(amountText, 0, R*0.06*scale);
  ctx.fillText(amountText, 0, R*0.06*scale);

  ctx.shadowBlur = 0;
  ctx.restore();
}

function setBettingUI(isOpen){
  const pill = document.getElementById("betStatePill");
  const btnBet = document.getElementById("btnBet");

  pill.textContent = isOpen ? "BETTING OPEN" : "BETTING CLOSED";
  pill.classList.toggle("open", isOpen);
  pill.classList.toggle("closed", !isOpen);

  btnBet.disabled = !isOpen;
  btnBet.classList.toggle("is-open", isOpen);
  btnBet.classList.toggle("is-closed", !isOpen);
  btnBet.innerHTML = isOpen ? `UNIQUE  &nbsp; BET NOW` : `BETTING CLOSED`;
}

document.getElementById("btnBet").onclick = async ()=>{
  if(bettingLocked || showingWinner) return;
  if(betAmount <= 0) return;

  const w = getWallet();
  if(w < betAmount) return;

  const ts = Date.now();

  // ✅ 즉시 반영(내가 눌렀을 때 “안먹힘” 방지)
  setWallet(w - betAmount);

  const local = loadBets();
  local.push({ round: roundKey, id: MY_ID, amount: betAmount, ts });
  saveBets(local);

  pendingBets.push({ round: roundKey, id: MY_ID, amount: betAmount, ts });

  // ✅ 서버 모드면 서버에도 기록
  if(SB_ENABLED){
    const row = await sbInsertBet(roundKey, MY_ID, betAmount);
    if(!row){
      // 서버 실패면 롤백(안 보이거나 돈만 줄어드는 상황 방지)
      pendingBets = pendingBets.filter(b => b.ts !== ts);
      saveBets(loadBets().filter(b => !(b.round===roundKey && b.id===MY_ID && b.ts===ts)));
      setWallet(w);
    }else{
      pendingBets = pendingBets.filter(b => b.ts !== ts);
    }
  }

  refreshUI();
};

/* ==========================
   7) Round helpers
========================== */
function alignRoundStart(ms){
  return Math.floor(ms / (ROUND_SEC*1000)) * (ROUND_SEC*1000);
}
function initRound(){
  const now = Date.now();
  roundStartAt = alignRoundStart(now);
  roundEndAt = roundStartAt + ROUND_SEC*1000;
  roundKey = String(roundStartAt);
}
function fmtMMSS(sec){
  sec = Math.max(0, sec|0);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function getCurrentRoundBets(){
  // ✅ 서버 정상(LIVE)일 때: 서버 + 내 pending 합쳐서 표시
  if(SB_ENABLED && sbLiveOk){
    const sbNow = serverBetsCache.filter(b => b.round === roundKey);
    const pnNow = pendingBets.filter(b => b.round === roundKey);
    return [...sbNow, ...pnNow];
  }
  // ✅ 아니면 로컬(기존 방식)
  const bets = loadBets();
  return bets.filter(b => b.round === roundKey);
}

function getCurrentAggregatedPlayers(){
  const rb = getCurrentRoundBets();
  const company = { round: roundKey, id: "COMPANY", amount: 100, ts: Date.now() };
  return aggregateById([company, ...rb]);
}

/* ==========================
   8) UI refresh
========================== */
function refreshUI(){
  document.getElementById("myWallet").textContent = `${getWallet().toLocaleString()} UT`;

  const players = getCurrentAggregatedPlayers();
  const total = players.reduce((s,p)=>s+p.amount,0);
  document.getElementById("totalPool").textContent = `${total.toLocaleString()} UT`;

  const listEl = document.getElementById("playersList");
  listEl.innerHTML = "";
  players.forEach((p, i)=>{
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div class="nameWrap">
        <div class="dot" style="opacity:${i===0?1:0.85}"></div>
        <div class="nm" title="${p.id}">${p.id}</div>
      </div>
      <div class="amt">${p.amount.toLocaleString()}</div>
    `;
    listEl.appendChild(row);
  });
  document.getElementById("playersCount").textContent = `${players.length}`;

  const bets = getCurrentRoundBets().filter(b => b.id === MY_ID);
  const myTotal = bets.reduce((s,b)=>s+b.amount,0);
  document.getElementById("myTotalBet").textContent = `${myTotal.toLocaleString()} UT`;

  const myList = document.getElementById("myBetsList");
  myList.innerHTML = "";
  if(!bets.length){
    const row = document.createElement("div");
    row.className="item";
    row.innerHTML = `<div class="nm" style="opacity:.8;">(아직 베팅 없음)</div><div class="amt">—</div>`;
    myList.appendChild(row);
  }else{
    bets.slice(-6).reverse().forEach(b=>{
      const row = document.createElement("div");
      row.className="item";
      row.innerHTML = `
        <div class="nm" style="opacity:.9;">${new Date(b.ts).toLocaleTimeString()}</div>
        <div class="amt">${b.amount.toLocaleString()}</div>
      `;
      myList.appendChild(row);
    });
  }

  drawWheel(players);
}

/* ==========================
   9) Winner logic
========================== */
function pickWinner(players){
  const total = players.reduce((s,p)=>s+p.amount,0);
  if(total <= 0) return { id: "NO BETS", amount: 0, index: 0 };

  let seed = 0;
  for(let i=0;i<roundKey.length;i++) seed = (seed*31 + roundKey.charCodeAt(i)) >>> 0;
  seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
  const r = (seed >>> 0) / 4294967296;

  let acc = 0;
  for(let i=0;i<players.length;i++){
    acc += players[i].amount / total;
    if(r <= acc) return { ...players[i], index: i };
  }
  return { ...players[players.length-1], index: players.length-1 };
}

function computeStopAngle(players, winIndex){
  const total = Math.max(1, players.reduce((s,p)=>s+p.amount,0));
  let start = -Math.PI/2;
  for(let i=0;i<players.length;i++){
    const ang = Math.max(0.001, players[i].amount/total) * Math.PI*2;
    const mid = start + ang/2;
    if(i === winIndex) return (-Math.PI/2) - mid;
    start += ang;
  }
  return 0;
}

function showWinnerOverlay(name, amount){
  document.getElementById("winnerName").textContent = name;
  document.getElementById("winnerSub").textContent = amount ? `${amount.toLocaleString()} UT` : "—";
  document.getElementById("winnerOverlay").style.display = "flex";

  document.getElementById("tickerText").textContent =
    `UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎  ·  LAST WINNER: ${name} (${amount||0} UT) 🏆  ·  UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎`;
}
function hideWinnerOverlay(){
  document.getElementById("winnerOverlay").style.display = "none";
}

/* ==========================
   10) Main Loop
========================== */
function updateClockAndState(){
  const now = Date.now();

  if(!showingWinner && now >= roundEndAt){
    const players = getCurrentAggregatedPlayers();
    const win = pickWinner(players);

    wheelRunning = false;
    wheelAngle = computeStopAngle(players, win.index);

    showingWinner = true;
    winnerUntil = now + FREEZE_SEC*1000;
    showWinnerOverlay(win.id, win.amount);
  }

  let leftSec;
  if(showingWinner){
    leftSec = 0;
    if(now >= winnerUntil){
      hideWinnerOverlay();
      showingWinner = false;

      const start = alignRoundStart(now);
      roundStartAt = start;
      roundEndAt = start + ROUND_SEC*1000;
      roundKey = String(start);

      // ✅ 라운드 바뀌면 SB도 라운드 채널 재구독(안하면 서로 안보임)
      if(SB_ENABLED) sbResubscribeRound(roundKey);

      wheelRunning = true;
    }
  }else{
    leftSec = Math.ceil((roundEndAt - now)/1000);
  }

  const timeEl = document.getElementById("timeLeft");
  if(leftSec <= 60){
    timeEl.textContent = String(Math.max(0,leftSec));
    timeEl.className = "countBig countWarn";
    if(leftSec <= 10) timeEl.className = "countBig countFinal";
  }else{
    timeEl.textContent = fmtMMSS(leftSec);
    timeEl.className = "countBig";
  }

  bettingLocked = showingWinner || (leftSec <= LOCK_SEC);
  setBettingUI(!bettingLocked);

  if(!showingWinner && wheelRunning){
    wheelAngle += 0.0022;
  }

  refreshUI();
  requestAnimationFrame(updateClockAndState);
}

/* ==========================
   11) Theme Switch
========================== */
(function(){
  const KEY = "unique_bg_theme";
  const host = document.body;
  const wrap = document.getElementById("themeBar");
  if(!wrap) return;

  function setTheme(n){
    host.setAttribute("data-bg", String(n));
    localStorage.setItem(KEY, String(n));
    [...wrap.querySelectorAll("button[data-bg]")].forEach(b=>{
      b.classList.toggle("active", b.dataset.bg === String(n));
    });
  }

  wrap.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-bg]");
    if(!btn) return;
    setTheme(btn.dataset.bg);
  });

  setTheme(localStorage.getItem(KEY) ?? "0");
})();

/* init */
function init(){
  initRound();
  resizeCanvas();
  refreshUI();
  setBettingUI(true);

  // ✅ SB 켜져있으면 시작 라운드 구독
  if(SB_ENABLED){
    setSyncText(true);
    sbResubscribeRound(roundKey);
  }else{
    setSyncText(false);
  }

  requestAnimationFrame(updateClockAndState);
}
init();
</script>
