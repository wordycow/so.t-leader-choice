<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE: ROYAL ROULETTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050508;
      --panel-bg: rgba(12, 14, 20, 0.95);
      --gold-1: #ffd700;
      --gold-2: #d4af37;
      --gold-3: #fbf5b7;
      --danger: #ff0044;
      --accent-blue: #00f0ff;
      --wheel-bottom: 560px;
    }

    *{ box-sizing:border-box; }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 70% 40%, #150a20 0%, #000000 90%);
      color: #fff;
      font-family: 'Cinzel', serif;
      overflow: hidden;
      position: relative;
    }

    /* PC: 캔버스 고정 */
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: block; }

    /* 모바일: 화면이 아래로 길게 스크롤되게 (캔버스도 스크롤과 함께 내려감) */
    @media (max-width: 1023px) {
      body { overflow-y: auto; overflow-x: hidden; }
      canvas { position: absolute; }
    }

    /* =========================
       Top Marquee
       ========================= */
    .marquee-wrap {
      position: sticky;
      top: 0;
      width: 100%;
      height: 40px;
      background: rgba(0,0,0,0.95);
      border-bottom: 1px solid rgba(255,215,0,0.2);
      overflow: hidden;
      z-index: 200;
      display: flex;
      align-items: center;
    }
    .marquee-content { display: flex; animation: scroll 60s linear infinite; }
    .marquee-text {
      white-space: nowrap; font-weight: 700; color: var(--gold-2);
      font-size: 14px; letter-spacing: 2px;
      padding: 0 60px;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* =========================
       Music Bar (PC 기본: 좌상단 고정 / 모바일: BET NOW 밑으로 이동)
       ========================= */
    .music-bar {
      position: fixed;
      top: 52px; left: 20px;
      z-index: 250;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.7);
      min-width: 310px;
      max-width: calc(100vw - 40px);
    }
    .mb-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.07);
      color: #ddd;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: 0.15s;
      flex: 0 0 auto;
    }
    .mb-btn:hover { color: #fff; background: rgba(255,255,255,0.18); transform: scale(1.06); }

    .track-box{
      display:flex;
      flex-direction: column;
      gap: 2px;
      min-width: 120px;
      flex: 1 1 auto;
      overflow:hidden;
    }
    .track-title{
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 13px;
      color: var(--gold-1);
      text-shadow: 0 0 10px rgba(255,215,0,0.25);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-sub{
      font-family: monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
    }
    .vol-box{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
      min-width: 150px;
    }
    .vol-label{
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .vol-range{
      width: 110px;
    }

    /* 모바일에서는 음악바가 패널 안으로 들어가면 고정 해제 */
    @media (max-width: 1023px){
      .music-bar{
        position: relative;
        top: auto; left: auto;
        width: 100%;
        min-width: unset;
        border-radius: 16px;
        margin-top: 14px;
      }
    }

    /* =========================
       UI Panel
       ========================= */
    .ui-container {
      position: fixed;
      z-index: 100;
      top: 40px;
      bottom: 0;
      right: 0;
      width: 420px;
      background: var(--panel-bg);
      border-left: 1px solid rgba(255,215,0,0.25);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 80px rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
    }

    @media (max-width: 1023px) {
      .ui-container {
        position: relative;
        width: 100%;
        min-height: 100vh;
        top: auto; bottom: auto; right: auto; left: auto;
        border-left: none;
        border-top: 1px solid rgba(255,215,0,0.25);
        margin-top: var(--wheel-bottom);
        background: #050508;
      }
    }

    .hud-row {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label {
      font-size: 11px;
      color: #888;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .value-lg { font-size: 32px; font-weight: 900; color: var(--gold-1); }
    .timer { font-size: 26px; font-weight: 700; color: #fff; font-family: monospace; }

    .ctrl-area {
      padding: 22px;
      background: rgba(0,0,0,0.5);
    }

    .bet-inputs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    .btn-chip {
      background: linear-gradient(180deg, #2a2a35, #1a1a20);
      border: 1px solid #444;
      color: #ccc;
      border-radius: 10px;
      height: 50px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }
    .btn-chip:hover { color: #fff; border-color: var(--gold-2); background: #333; }

    .inp-amt {
      background: #000;
      border: 2px solid var(--gold-2);
      color: var(--gold-1);
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      border-radius: 10px;
      width: 100%;
      outline: none;
      height: 50px;
    }

    /* 좁은 모바일: 버튼 4개는 아래줄로 */
    @media (max-width: 420px){
      .bet-inputs{
        grid-template-columns: repeat(4, 1fr) !important;
        grid-template-areas:
          "bet bet bet bet"
          "min m100 p100 max";
      }
      #inpBet{ grid-area: bet; }
      #bMin{ grid-area: min; }
      #bM100{ grid-area: m100; }
      #bP100{ grid-area: p100; }
      #bMax{ grid-area: max; }
    }

    /* So.T Aurora Button(효과는 유지) */
    .action-btn.action-btn-sot{
      position: relative; overflow: hidden; border: 0; padding: 0;
      min-height: 60px; border-radius: 999px; width: 100%; cursor: pointer;
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1) inset;
      transform: translateZ(0); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .action-btn.action-btn-sot::before{
      content:""; position:absolute; inset:-10px;
      background: conic-gradient(from 180deg, rgba(255,215,0,0.95), rgba(168,85,247,0.75), rgba(0,247,255,0.75), rgba(255,215,0,0.95));
      filter: blur(16px); opacity: .45; animation: sotGlowSpin 3.2s linear infinite; pointer-events:none;
    }
    .action-btn.action-btn-sot::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.22) 28%, transparent 60%);
      transform: translateX(-140%); animation: sotShine 2.6s ease-in-out infinite; pointer-events:none; mix-blend-mode: screen; opacity: .9;
    }
    .unique-inner {
      position: relative; z-index: 2; display:flex; align-items:center; justify-content:center;
      gap:10px; width:100%; color: #fff; font-weight: 900; font-size: 20px; letter-spacing: 2px;
    }
    .unique-logo-text {
      font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(to bottom, #fff, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(255,215,0,0.6));
    }
    .action-btn.action-btn-sot:hover{ transform: translateY(-2px); box-shadow: 0 15px 40px rgba(255,215,0,0.12); }
    .action-btn.action-btn-sot:active{ transform: translateY(0) scale(0.995); }
    .action-btn.action-btn-sot:disabled { filter: grayscale(1) brightness(0.55); cursor: not-allowed; animation: none; }
    @keyframes sotGlowSpin{ 0%{ transform: rotate(0deg); } 100%{ transform: rotate(360deg); } }
    @keyframes sotShine{ 0%{ transform: translateX(-140%); } 45%{ transform: translateX(140%); } 100%{ transform: translateX(140%); } }

    .wallet-row{
      display:flex; justify-content:space-between; margin-top:14px;
      font-size:13px; color:#aaa; font-weight:700; letter-spacing:1px;
    }
    .wallet-row span:last-child{ color: var(--gold-1); font-size:16px; }

    .list-wrap { flex: 1; overflow-y: auto; padding: 15px; }
    .rank-item { display:flex; align-items:center; padding: 12px 15px; margin-bottom: 8px; background: rgba(255,255,255,0.04); border-radius: 12px; }
    .rank-item.me { background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent); border: 1px solid rgba(255,215,0,0.35); }
    .p-col { width: 12px; height: 12px; border-radius: 50%; margin-right: 15px; box-shadow: 0 0 10px currentColor; }
    .p-name { flex: 1; font-size: 15px; font-weight: 800; color: #e0e0e0; }
    .p-amt { font-size: 15px; color: var(--gold-1); font-weight: 900; }

    /* =========================
       Pointer (PC/모바일 동일: 상단 삼각 포인터)
       ========================= */
    .pointer-wrap {
      position: absolute;
      z-index: 60;
      filter: drop-shadow(0 0 20px rgba(255, 200, 80, 0.85));
      pointer-events:none;
    }
    .pointer-real{
      width: 46px; height: 26px;
      background: linear-gradient(180deg, #ffd700 0%, #d4af37 60%, #aa771c 100%);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      border-radius: 0 0 10px 10px;
    }

    /* =========================
       Countdown (숫자만 / 10~0 깜빡 / 럭셔리)
       ========================= */
    .countdown-box{
      position: absolute;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      z-index: 70;
    }
    .cd-num{
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: min(28vw, 220px);
      letter-spacing: 2px;
      background: linear-gradient(to bottom, #ffffff 0%, #ffd700 60%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255,215,0,0.35), 0 0 60px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity .15s ease, transform .15s ease;
    }
    .cd-num.on{ opacity:1; transform: scale(1); }
    .cd-num.blink{ animation: cdBlink .55s steps(1,end) infinite; }
    @keyframes cdBlink{ 50% { opacity: 0.25; } }

    /* =========================
       Result Modal
       ========================= */
    .modal-mask{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      z-index: 300;
      display: none;
      justify-content:center;
      align-items:center;
      backdrop-filter: blur(18px);
    }
    .modal-mask.on{ display:flex; }
    .modal-body{
      width: 92%;
      max-width: 520px;
      background: radial-gradient(circle, #2a1a3a 0%, #111 100%);
      border: 2px solid var(--gold-2);
      border-radius: 22px;
      padding: 34px 26px;
      text-align:center;
      box-shadow: 0 0 90px rgba(0,0,0,0.85);
    }
  </style>
</head>

<body>
  <div class="marquee-wrap">
    <div class="marquee-content">
      <span class="marquee-text" id="mqText1">💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎</span>
      <span class="marquee-text" id="mqText2">💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎</span>
    </div>
  </div>

  <canvas id="cvs"></canvas>
  <div id="pointer" class="pointer-wrap"><div class="pointer-real"></div></div>
  <div class="countdown-box"><div id="cdNum" class="cd-num"></div></div>

  <!-- 음악바(PC 기본 좌상단). 모바일에서는 JS로 아래 musicSlot로 이동 -->
  <div class="music-bar" id="musicBar">
    <button class="mb-btn" id="prevBtn" title="Previous">⏮</button>
    <button class="mb-btn" id="musicToggle" title="Play/Pause">▶</button>
    <button class="mb-btn" id="nextBtn" title="Next">⏭</button>

    <div class="track-box">
      <div class="track-title" id="trackTitle">ROYAL BGM</div>
      <div class="track-sub" id="trackSub">0/0</div>
    </div>

    <div class="vol-box">
      <span class="vol-label">VOL</span>
      <input class="vol-range" id="volRange" type="range" min="0" max="100" step="1" value="20" />
    </div>
  </div>

  <aside class="ui-container">
    <div class="hud-row">
      <div>
        <div class="label">TOTAL POOL</div>
        <div class="value-lg" id="poolDisp">0 UT</div>
      </div>
      <div style="text-align:right;">
        <div class="label">TIME LEFT</div>
        <div class="timer" id="timerDisp">--:--</div>
      </div>
    </div>

    <div class="ctrl-area">
      <div class="bet-inputs">
        <button class="btn-chip" id="bMin">MIN</button>
        <button class="btn-chip" id="bM100">-100</button>
        <input type="number" id="inpBet" class="inp-amt" value="100" readonly />
        <button class="btn-chip" id="bP100">+100</button>
        <button class="btn-chip" id="bMax">MAX</button>
      </div>

      <button id="bJoin" class="action-btn action-btn-sot" type="button">
        <span class="unique-inner" id="btnText">
          <span class="unique-logo-text">UNIQUE</span>&nbsp;BET NOW
        </span>
      </button>

      <!-- ✅ 모바일에서 음악바가 여기(BET NOW 밑)에 붙음 -->
      <div id="musicSlot"></div>

      <div class="wallet-row">
        <span>MY WALLET</span><span id="myBal">Loading...</span>
      </div>
    </div>

    <div class="list-wrap" id="pList">
      <div style="text-align:center; padding:30px; color:#555;">Waiting for bets...</div>
    </div>
  </aside>

  <div id="mdRes" class="modal-mask">
    <div class="modal-body">
      <h2 style="color:var(--gold-1); font-size:40px; margin: 0 0 10px; text-shadow:0 0 30px rgba(255,215,0,0.35);">WINNER</h2>
      <div id="resName" style="font-size:46px; font-weight:900; color:#fff; margin: 8px 0; text-shadow:0 6px 18px rgba(0,0,0,0.85);">-</div>
      <div id="resAmt" style="font-size:30px; color:var(--gold-3); font-weight:800;">-</div>
      <div style="margin-top:18px; color:#cfcfcf; letter-spacing:1px;">Next round starts soon...</div>
    </div>
  </div>

  <!-- ✅ playlist 파일 (이미 네가 만들어둔 거 사용) -->
  <script src="./roulette.playlist.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const toMoney = (n) => Number(n).toLocaleString();

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";
    const MIN_BET = 100;
    const ROUND_DURATION_SEC = 1200; // 20분
    const BET_LOCK_SEC = 60;         // 60초 남으면 베팅 종료
    const RESULT_FREEZE_MS = 30000;  // Winner 30초 정지

    let myId = "", myWallet = 0, myColor = "#ff0055";
    let roundKey = null;
    let participants = [], liveParticipants = [];
    let totalPool = 0;

    let rotation = 0;
    let wheelState = "SPINNING"; // SPINNING | STOPPED
    let isLocked = false;

    let serverOffset = 0;
    let nextRoundMs = 0;
    let isPC = window.innerWidth >= 1024;

    let lockedParticipants = null;
    let lockedRoundKey = null;
    let resultUntilMs = 0;
    let settledRoundKey = null;
    let lastSpoken = null;

    // ---------- YouTube Playlist ----------
    const ytPlaylist = (window.UNIQUE_YT_PLAYLIST && Array.isArray(window.UNIQUE_YT_PLAYLIST) && window.UNIQUE_YT_PLAYLIST.length)
      ? window.UNIQUE_YT_PLAYLIST
      : ['-jdZKf-xSpA']; // fallback

    let ytPlayer = null;
    let curVol = 20;

    function updateTrackUI(){
      if(!ytPlayer || !ytPlayer.getPlaylistIndex) return;
      const idx = ytPlayer.getPlaylistIndex();
      const len = ytPlaylist.length;
      $("trackTitle").innerText = `ROYAL BGM ${String(idx+1).padStart(2,'0')}`;
      $("trackSub").innerText = `${idx+1}/${len}`;
    }

    function updatePlayUI(isPlaying){
      $("musicToggle").innerText = isPlaying ? "⏸" : "▶";
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayerHidden', {
        height: '0', width: '0',
        playerVars: {
          autoplay: 1,
          controls: 0,
          loop: 1,
          playlist: ytPlaylist.join(',')
        },
        events: {
          'onReady': (e) => {
            e.target.setVolume(curVol);
            e.target.playVideo();
            updatePlayUI(true);
            updateTrackUI();
            setInterval(updateTrackUI, 800); // 가볍게 갱신
          },
          'onStateChange': (e) => {
            updatePlayUI(e.data === YT.PlayerState.PLAYING);
            updateTrackUI();
          }
        }
      });
    }

    // hidden player
    const hidden = document.createElement("div");
    hidden.id = "ytPlayerHidden";
    hidden.style.display = "none";
    document.body.appendChild(hidden);

    $("musicToggle").onclick = () => {
      if(!ytPlayer || !ytPlayer.getPlayerState) return;
      const st = ytPlayer.getPlayerState();
      if(st === YT.PlayerState.PLAYING){ ytPlayer.pauseVideo(); updatePlayUI(false); }
      else { ytPlayer.playVideo(); updatePlayUI(true); }
    };
    $("prevBtn").onclick = () => { if(ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo(); };
    $("nextBtn").onclick = () => { if(ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo(); };
    $("volRange").oninput = (e) => {
      curVol = Number(e.target.value);
      if(ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(curVol);
    };

    // 모바일 첫 클릭에 재생 보장(브라우저 정책)
    document.body.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
    }, { once: true });

    // ---------- Color Auto (ID 기반 고정 컬러) ----------
    const colors = ['#ff0055','#ffdd00','#00ffaa','#00ccff','#ff4400','#aa00ff','#ffffff','#ff00aa','#ccff00','#0055ff'];
    function hashColorForId(id){
      const s = String(id||"guest");
      let h = 0;
      for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
      return colors[h % colors.length];
    }

    // ---------- Layout (포인터/휠 위치 + 모바일 패널 시작점 자동 계산) ----------
    function updateLayoutMetrics() {
      isPC = window.innerWidth >= 1024;

      const ptr = $("pointer");
      const uiW = isPC ? 420 : 0;
      const w = window.innerWidth - uiW;
      const h = window.innerHeight;

      const cx = w / 2;
      const cy = isPC ? (h * 0.52) : (h * 0.46);

      let r = Math.min(w, h) * (isPC ? 0.47 : 0.54);

      // 상단 최소 여백(마퀴+포인터)
      const minTop = 110;
      if (cy - r < minTop) r = cy - minTop;

      // 포인터: 휠 상단 중앙
      ptr.style.left = (cx - 23) + "px";
      ptr.style.top  = (cy - r - 30) + "px";
      ptr.style.transform = "none";

      // 모바일에서 패널이 휠 아래부터 시작하게
      if(!isPC){
        const wheelBottom = Math.max(520, Math.floor(cy + r + 35));
        document.documentElement.style.setProperty("--wheel-bottom", wheelBottom + "px");
      }

      return { r, cx, cy, pointerAngle: -Math.PI / 2, drawW: w, drawH: h, uiW };
    }

    // ---------- Speed Schedule ----------
    // 0~30초: 정지(베팅 준비)
    // 이후 19분30초 = 4:30(1RPM) + 5:00(2RPM) + 5:00(3RPM) + 5:00(6RPM)
    function rpmByElapsed(elapsedSec){
      if(elapsedSec < 30) return 0;
      const t = elapsedSec - 30;
      if (t < 270) return 1;
      if (t < 270+300) return 2;
      if (t < 270+300+300) return 3;
      return 6;
    }

    // ---------- Draw ----------
    let lastTime = 0;
    function draw(ts){
      if(!lastTime) lastTime = ts;
      const dt = ts - lastTime;
      lastTime = ts;

      const cvs=$("cvs"), ctx=cvs.getContext("2d");
      const w=window.innerWidth, h=window.innerHeight;
      if(cvs.width!==w || cvs.height!==h){ cvs.width=w; cvs.height=h; }

      // background
      ctx.fillStyle = "#050508";
      ctx.fillRect(0, 0, w, h);

      const m = updateLayoutMetrics();
      const cx = m.cx, cy = m.cy, r = m.r;
      const uiW = m.uiW;

      // remain/elapsed
      let remain = 0;
      if(nextRoundMs){
        const now = Date.now() + serverOffset;
        remain = Math.max(0, Math.floor((nextRoundMs - now)/1000));
      }
      const elapsed = ROUND_DURATION_SEC - remain;

      // rotation update
      if(wheelState === "SPINNING"){
        const rpm = rpmByElapsed(elapsed);
        const radPerMs = (rpm * 2 * Math.PI) / 60000;
        rotation += radPerMs * dt;
      }

      // Rim
      const gradRim = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
      gradRim.addColorStop(0, '#fbf5b7');
      gradRim.addColorStop(0.3, '#d4af37');
      gradRim.addColorStop(0.5, '#ffd700');
      gradRim.addColorStop(0.8, '#aa771c');
      gradRim.addColorStop(1, '#fbf5b7');

      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,r+18,0,Math.PI*2);
      ctx.fillStyle=gradRim;
      ctx.shadowColor="rgba(0,0,0,0.85)";
      ctx.shadowBlur=30;
      ctx.fill();
      ctx.restore();

      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle='#110000';
      ctx.fill();

      // Slices
      const total = totalPool || 1;
      let startAng = rotation;

      if(participants.length>0){
        participants.forEach(p=>{
          const slice=(p.amount/total)*2*Math.PI;
          const endAng=startAng+slice;

          ctx.beginPath();
          ctx.moveTo(cx,cy);
          ctx.arc(cx,cy,r-5,startAng,endAng);
          ctx.fillStyle=p.color || "#777";
          ctx.fill();

          ctx.lineWidth=2;
          ctx.strokeStyle="rgba(255,255,255,0.14)";
          ctx.stroke();

          if(slice>0.035){
            const mid=startAng+slice/2;
            const tx=cx+Math.cos(mid)*(r*0.86);
            const ty=cy+Math.sin(mid)*(r*0.86);

            ctx.save();
            ctx.translate(tx,ty);
            ctx.rotate(mid + Math.PI/2);
            ctx.textAlign="center";
            ctx.textBaseline="middle";

            ctx.fillStyle="#fff";
            ctx.font="900 24px 'Cinzel', serif";
            ctx.shadowColor="rgba(0,0,0,1)";
            ctx.shadowBlur=6;

            let n = p.name || "";
            if(n.length > 12) n = n.slice(0,10)+"..";
            ctx.fillText(n, 0, -14);

            ctx.fillStyle="#ffd700";
            ctx.font="900 18px monospace";
            ctx.fillText(toMoney(p.amount), 0, 14);
            ctx.restore();
          }

          startAng=endAng;
        });
      }

      // Center cap
      const capR=Math.min(r*0.12, 140);
      const gradCap=ctx.createRadialGradient(cx,cy,capR*0.1, cx,cy,capR);
      gradCap.addColorStop(0,'#fff');
      gradCap.addColorStop(0.3,'#ffd700');
      gradCap.addColorStop(0.9,'#b8860b');
      gradCap.addColorStop(1,'#5e4b25');

      ctx.save();
      ctx.shadowColor="rgba(0,0,0,0.8)";
      ctx.shadowBlur=20;
      ctx.beginPath();
      ctx.arc(cx,cy,capR,0,Math.PI*2);
      ctx.fillStyle=gradCap;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.arc(0,0,capR*0.72,0,Math.PI*2);
      ctx.fillStyle="#1a0b0b";
      ctx.fill();
      ctx.strokeStyle="#ffd700";
      ctx.lineWidth=3;
      ctx.stroke();
      ctx.fillStyle="#ffd700";
      ctx.font="900 24px 'Cinzel'";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText("UNIQUE", 0, 2);
      ctx.restore();

      requestAnimationFrame(draw);
    }

    // ---------- API ----------
    async function api(act,p={}){
      const r = await fetch(GAS_URL+"?"+new URLSearchParams({action:act, ...p, _:Date.now()}));
      return await r.json();
    }

    function renderList(){
      const el=$("pList");
      el.innerHTML="";
      participants.forEach(p=>{
        el.innerHTML += `
          <div class="rank-item ${p.name===myId?'me':''}">
            <div class="p-col" style="background:${p.color};"></div>
            <div class="p-name">${p.name}</div>
            <div class="p-amt">${toMoney(p.amount)}</div>
          </div>`;
      });
      el.scrollTop = el.scrollHeight;
    }

    // ---------- Sync State ----------
    async function updateState(){
      try{
        const d = await api("getRouletteState");
        if(d.result!=="success") return;

        if(d.serverTs) serverOffset = d.serverTs - Date.now();
        if(d.nextRoundAtMs) nextRoundMs = d.nextRoundAtMs;

        const nk = String(d.roundKey || "");
        if(!roundKey) roundKey = nk;

        // 라운드가 바뀌어도, 결과 30초(정지) 중이면 화면 유지
        if(nk !== roundKey && Date.now() >= resultUntilMs){
          // 새 라운드 정상 진입
          lockedParticipants = null;
          lockedRoundKey = null;
          settledRoundKey = null;
          wheelState = "SPINNING";
          $("mdRes").classList.remove("on");
          lastSpoken = null;
          roundKey = nk;
        } else {
          roundKey = nk;
        }

        liveParticipants = (d.participants || []).map(p => ({
          name: p.name,
          amount: Number(p.amount),
          color: p.color
        }));

        const nowMs = Date.now();
        if(nowMs < resultUntilMs && lockedParticipants){
          participants = lockedParticipants;
        } else if(lockedRoundKey && lockedParticipants){
          // 베팅 종료 후에도 스냅샷 유지(전원 동일 화면)
          participants = lockedParticipants;
        } else {
          participants = liveParticipants;
        }

        totalPool = participants.reduce((a,c)=>a+c.amount,0);
        $("poolDisp").innerText = toMoney(totalPool)+" UT";
        renderList();

        const winTxt = d.lastWinner ? `🏆 LAST WINNER: ${d.lastWinner.name} (${toMoney(d.lastWinner.prize)} UT) 🏆` : "";
        $("mqText1").innerHTML = `💎 UNIQUE ROYAL CASINO - WHERE LEGENDS ARE BORN 💎 <span>${winTxt}</span>`;
        $("mqText2").innerHTML = $("mqText1").innerHTML;
      }catch(e){}
    }

    // ---------- Bet Lock + Countdown + Stop @ 0 ----------
    function speakKRNumber(n){
      const map = {5:"오",4:"사",3:"삼",2:"이",1:"일",0:"영"};
      if(map[n] == null) return;
      if(lastSpoken === n) return;
      lastSpoken = n;

      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(map[n]);
        u.lang = "ko-KR";
        u.rate = 1.0;
        u.pitch = 0.75;
        speechSynthesis.speak(u);
      }catch(_){}
    }

    function showResultModal(){
      $("mdRes").classList.add("on");
    }
    function hideResultModal(){
      $("mdRes").classList.remove("on");
    }

    function spinToWinnerInstant(winnerName){
      // lockedParticipants 기준으로 “즉시 정지”
      const idx = participants.findIndex(p => p.name === winnerName);
      if(idx < 0) return;

      const total = totalPool || 1;
      let sum = 0, mid = 0;

      for(let i=0;i<participants.length;i++){
        const s = (participants[i].amount/total)*2*Math.PI;
        if(i===idx){ mid = sum + s/2; break; }
        sum += s;
      }

      const m = updateLayoutMetrics();
      const dest = m.pointerAngle - mid;

      rotation = dest;
      wheelState = "STOPPED";
    }

    async function settleAtZero(){
      if(!lockedRoundKey) return;
      if(settledRoundKey === lockedRoundKey) return;

      for(let i=0;i<10;i++){
        try{
          const d = await api("getRouletteState");
          if(d.lastWinner && String(d.lastWinner.round) === String(lockedRoundKey)){
            const winnerName = d.lastWinner.name;

            // ✅ 참가자 스냅샷(전원 동일 화면)
            if(!lockedParticipants){
              lockedParticipants = (d.participants || []).map(p => ({
                name: p.name,
                amount: Number(p.amount),
                color: p.color
              }));
            }
            participants = lockedParticipants;
            totalPool = participants.reduce((a,c)=>a+c.amount,0);

            spinToWinnerInstant(winnerName);

            $("resName").innerText = winnerName;
            $("resAmt").innerText = toMoney(d.lastWinner.prize) + " UT";
            showResultModal();

            resultUntilMs = Date.now() + RESULT_FREEZE_MS;
            settledRoundKey = lockedRoundKey;
            return;
          }
        }catch(e){}
        await new Promise(r=>setTimeout(r,250));
      }
    }

    function startTimer(){
      setInterval(async ()=>{
        if(!nextRoundMs) return;

        const now = Date.now() + serverOffset;
        const remain = Math.max(0, Math.floor((nextRoundMs - now)/1000));

        // 타이머 표시
        const mm = Math.floor(remain/60);
        const ss = remain % 60;
        $("timerDisp").innerText = `${mm}:${ss<10?'0'+ss:ss}`;

        // ✅ 60초 남으면 베팅 종료 + 중앙 카운트다운(숫자만)
        if(remain <= BET_LOCK_SEC){
          isLocked = true;
          $("bJoin").disabled = true;
          $("btnText").innerText = "CLOSED";

          // 60초 진입 시점에 서버 기준 스냅샷 강제 확보(전원 동일화)
          if(!lockedRoundKey){
            lockedRoundKey = roundKey;
            try{
              const d = await api("getRouletteState");
              lockedParticipants = (d.participants || []).map(p => ({
                name: p.name,
                amount: Number(p.amount),
                color: p.color
              }));
              participants = lockedParticipants;
              totalPool = participants.reduce((a,c)=>a+c.amount,0);
              renderList();
            }catch(_){}
          }

          // 카운트다운
          const cd = $("cdNum");
          cd.innerText = String(remain);
          cd.classList.add("on");
          if(remain <= 10) cd.classList.add("blink");
          else cd.classList.remove("blink");

          // 5~0 음성
          if(remain <= 5) speakKRNumber(remain);

          // ✅ 0초에 즉시 정지 + Winner 30초
          if(remain === 0){
            await settleAtZero();
          }
        } else {
          // 베팅 오픈
          isLocked = false;
          $("bJoin").disabled = false;
          $("btnText").innerHTML = '<span class="unique-logo-text">UNIQUE</span>&nbsp;BET NOW';

          const cd = $("cdNum");
          cd.classList.remove("on","blink");

          // 결과 30초 끝나면 정상 복귀
          if(Date.now() >= resultUntilMs){
            if(wheelState === "STOPPED") wheelState = "SPINNING";
            hideResultModal();
            lockedParticipants = null;
            lockedRoundKey = null;
            settledRoundKey = null;
            lastSpoken = null;
          }
        }
      }, 250);
    }

    // ---------- Bet Buttons ----------
    const setB = v => $("inpBet").value = v;

    $("bMin").onclick = ()=> setB(MIN_BET);
    $("bMax").onclick = ()=> setB(Math.floor(myWallet/100)*100);

    $("bM100").onclick = ()=>{
      let v = Number($("inpBet").value) - 100;
      if(v < MIN_BET) v = MIN_BET;
      setB(v);
    };
    $("bP100").onclick = ()=>{
      let v = Number($("inpBet").value) + 100;
      if(v > myWallet) v = myWallet;
      setB(v);
    };

    $("bJoin").onclick = async ()=>{
      if(isLocked) return alert("Closed.");
      const amt = Number($("inpBet").value);
      if(amt > myWallet) return alert("No Money");

      const btn = $("bJoin");
      const bt = $("btnText");
      btn.disabled = true;
      bt.innerText = "...";

      try{
        const r = await api("rouletteResult", { type:"bet", id: myId, amount: amt, color: myColor });
        if(r.result === "success"){
          myWallet = r.newBalance;
          $("myBal").innerText = toMoney(myWallet) + " UT";
          updateState();
        } else {
          alert(r.msg || "fail");
        }
      }catch(e){}
      btn.disabled = false;
      bt.innerHTML = '<span class="unique-logo-text">UNIQUE</span>&nbsp;BET NOW';
    };

    // ---------- Init ----------
    window.onload = async ()=>{
      const p = new URLSearchParams(location.search);
      myId = (p.get("id") || "guest").trim();
      myColor = hashColorForId(myId);

      // PC는 음악바 그대로(좌상단), 모바일은 BET NOW 밑으로 이동
      if(window.innerWidth < 1024){
        const music = $("musicBar");
        const slot = $("musicSlot");
        if(music && slot) slot.appendChild(music);
      }

      try{
        const u = await api("getUserInfo", { id: myId });
        if(u.result === "success") myWallet = u.balance;
        $("myBal").innerText = toMoney(myWallet) + " UT";
      }catch(e){ $("myBal").innerText = "0 UT"; }

      updateState();
      setInterval(updateState, 2000);
      startTimer();
      requestAnimationFrame(draw);
      window.addEventListener("resize", ()=>{ lastTime=0; });
    };
  </script>
</body>
</html>
