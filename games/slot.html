<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE UNIQUE SLOT - V19 HARDCORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    /* === [V19: HARDCORE CYBERPUNK & ELECTRIC PSYCHEDELIC] === */
    :root {
      --electric-blue: #00f3ff;
      --toxic-green: #0aff00;
      --plasma-purple: #bd00ff;
      --high-voltage-gold: #ffd700;
      --bg-metal: #111216;
      --panel-metal: #1a1c24;
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background-color: #000;
      color: #e0e0e0; font-family: 'Rajdhani', sans-serif;
      overflow: hidden; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      /* 전체적인 빛 번짐 효과 */
      text-shadow: 0 0 2px rgba(255,255,255,0.1);
    }

    /* === 배경 및 효과 === */
    #game-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; z-index: -4;
      filter: brightness(0.4) contrast(1.2) sepia(0.3) hue-rotate(180deg);
      background-color: #050505; transition: background-image 0.2s;
    }
    
    /* 회로도 패턴 */
    .circuit-pattern {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
      background-image: radial-gradient(rgba(0, 243, 255, 0.15) 1px, transparent 1px);
      background-size: 20px 20px; opacity: 0.5;
    }

    /* CRT 스캔라인 효과 (레트로+사이버펑크) */
    .scanlines {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
      background-size: 100% 4px; pointer-events: none; opacity: 0.6;
    }

    #game-container {
      width: 100%; max-width: 550px; height: 100%; max-height: 100vh;
      display: flex; flex-direction: column;
      padding: 15px; position: relative; justify-content: center;
      background: radial-gradient(circle at center, rgba(20,25,35,0.8) 0%, rgba(0,0,0,0.95) 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    /* --- 1. 상단 섹션 --- */
    .top-section {
      flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; }

    .btn-go-main {
      background: linear-gradient(180deg, #222, #111);
      border: 1px solid var(--electric-blue); color: var(--electric-blue);
      padding: 8px 18px; border-radius: 4px;
      font-size: 0.9rem; font-weight: 900; text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      text-transform: uppercase; letter-spacing: 1px;
      transition: 0.1s; position: relative; overflow: hidden;
    }
    .btn-go-main::before {
      content:''; position: absolute; top:-50%; left:-50%; width:200%; height:200%;
      background: linear-gradient(45deg, transparent, rgba(0,243,255,0.3), transparent);
      animation: holographic 3s infinite linear; opacity: 0; transition: opacity 0.2s;
    }
    .btn-go-main:hover::before { opacity: 1; }
    .btn-go-main:active { transform: scale(0.98); background: #000; box-shadow: 0 0 5px var(--electric-blue); }

    .user-info {
      font-size: 1.1rem; font-weight: 900; color: var(--electric-blue);
      text-shadow: 0 0 8px var(--electric-blue);
      background: rgba(0,0,0,0.7); padding: 8px 15px; border: 1px solid var(--electric-blue);
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
      text-transform: uppercase;
    }

    /* 잭팟 패널 (고압 전류 느낌) */
    .jackpot-panel {
      background: linear-gradient(180deg, #2b0000, #1a0000);
      border: 2px solid var(--high-voltage-gold);
      padding: 15px; display: flex; align-items: center; justify-content: center; gap: 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255,0,0,0.3);
      position: relative; overflow: hidden;
      animation: electrical-pulse 2s infinite alternate;
    }
    @keyframes electrical-pulse { from { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); } to { box-shadow: 0 0 40px rgba(255, 215, 0, 0.7), 0 0 10px #fff; } }
    
    .jp-star {
      font-size: 3rem; color: var(--high-voltage-gold);
      text-shadow: 0 0 20px var(--high-voltage-gold), 0 0 5px #fff;
      animation: spinStarPsycho 1.5s infinite linear;
    }
    @keyframes spinStarPsycho { 0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); } 50% { transform: rotate(180deg) scale(1.2); filter: hue-rotate(180deg); } 100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); } }

    .jp-text-group { text-align: left; }
    .jp-label { font-size: 0.8rem; color: #ffaa00; letter-spacing: 3px; font-weight: 900; text-transform: uppercase; }
    .jp-amount {
      font-size: 2.6rem; font-weight: 900; color: #fff;
      text-shadow: 0 0 15px var(--high-voltage-gold); line-height: 1;
      font-family: 'Rajdhani', sans-serif;
    }

    /* --- 2. 슬롯 머신 (전기 파이프 프레임) --- */
    .machine-frame {
      flex: 0 0 auto; width: 100%;
      aspect-ratio: 5 / 4.5; max-height: 55vh;
      position: relative;
      background: #000;
      /* 복잡한 네온/전기 테두리 */
      border: 3px solid var(--plasma-purple);
      box-shadow: 
        0 0 10px var(--plasma-purple),
        0 0 20px var(--electric-blue),
        inset 0 0 30px #000;
      overflow: hidden; margin-bottom: 15px;
    }
    /* 전기 아크 효과 */
    .machine-frame::after {
      content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px dashed var(--electric-blue); z-index: 99; opacity: 0.7;
      animation: electric-arc 0.5s infinite linear; pointer-events: none;
    }
    @keyframes electric-arc { 0% { clip-path: inset(0 0 95% 0); } 50% { clip-path: inset(95% 0 0 0); } 100% { clip-path: inset(0 95% 0 0); } }

    #slot-canvas { width: 100%; height: 100%; display: block; filter: contrast(1.1) saturate(1.2); }
    .win-line {
      position: absolute; top: 50%; left: 0; width: 100%; height: 6px;
      background: #fff; box-shadow: 0 0 20px var(--high-voltage-gold), 0 0 10px var(--toxic-green);
      transform: translateY(-50%); display: none; z-index: 10; mix-blend-mode: screen;
    }

    /* --- 3. 컨트롤 덱 (인더스트리얼 메탈) --- */
    .control-deck {
      flex: 0 0 auto;
      background: linear-gradient(180deg, var(--panel-metal), #000);
      border-top: 2px solid #333;
      box-shadow: 0 -5px 20px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.1);
      padding: 20px; position: relative;
    }
    /* 상단 네온 바 */
    .deck-neon { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--electric-blue); box-shadow: 0 0 10px var(--electric-blue); }

    .info-lcd {
      background: #000; border: 2px solid #333;
      padding: 12px 15px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: inset 0 0 15px rgba(0,243,255,0.1);
      font-family: monospace; /* 디지털 느낌 */
    }
    .msg-area { font-size: 1.3rem; color: var(--electric-blue); font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 5px var(--electric-blue); }
    .msg-area.win { color: var(--toxic-green); text-shadow: 0 0 15px var(--toxic-green); animation: cyber-blink 0.3s infinite alternate; }
    @keyframes cyber-blink { from { opacity: 1; } to { opacity: 0.5; filter: hue-rotate(90deg); } }
    
    .wallet-area { text-align: right; }
    .wallet-lbl { font-size: 0.7rem; color: #666; font-weight: 900; display: block; }
    .wallet-val { font-size: 1.6rem; color: #fff; font-weight: 900; text-shadow: 0 0 5px #fff; }

    .btn-row-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; gap: 10px;
    }

    /* [핵심] 하드코어 버튼 스타일 (금속 질감 + 글리치) */
    .cyber-btn {
      border: none; outline: none; cursor: pointer;
      font-family: 'Rajdhani', sans-serif; font-weight: 900;
      color: #ccc;
      background: linear-gradient(180deg, #333, #1a1a1a); /* 금속 질감 */
      box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 5px 10px rgba(0,0,0,0.5);
      border-bottom: 3px solid #000;
      text-transform: uppercase;
      position: relative; overflow: hidden; transition: 0.1s;
      text-shadow: 0 1px 0 #000;
    }
    .cyber-btn:active { transform: translateY(3px); border-bottom: 1px solid #000; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

    /* 기능 버튼 (Sound/Auto) - 차가운 금속 */
    .btn-func {
      width: 75px; height: 55px; font-size: 0.8rem; line-height: 1.3;
      border: 1px solid #444;
    }
    .btn-func.active {
      color: #000; background: linear-gradient(180deg, var(--electric-blue), #007ea7);
      box-shadow: 0 0 15px var(--electric-blue); border-color: #fff; text-shadow: none;
    }

    /* 베팅 컨트롤 - 인더스트리얼 */
    .bet-control {
      display: flex; align-items: center; gap: 8px;
      background: #0a0a0a; padding: 5px; border: 2px solid #333;
      box-shadow: inset 0 0 10px #000;
    }
    .btn-step {
      width: 45px; height: 45px; font-size: 1.8rem;
      background: linear-gradient(180deg, #444, #222);
      border: 1px solid #555; color: #fff;
    }
    .bet-display { width: 90px; text-align: center; }
    .bet-lbl { font-size: 0.7rem; color: #555; }
    .bet-val { font-size: 1.5rem; color: var(--high-voltage-gold); font-weight: 900; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

    /* [핵심] 스핀 버튼 (과부하 걸린 원자로) */
    .spin-container { width: 100%; height: 75px; position: relative; }
    .btn-spin {
      width: 100%; height: 100%;
      /* 극도로 강렬한 그라데이션 */
      background: linear-gradient(90deg, #ff3300, #ffcc00, #ff00ff, #ff3300);
      background-size: 300% 300%;
      animation: hardcore-gradient 2s linear infinite;
      
      color: #fff; font-size: 2.5rem; font-weight: 900; letter-spacing: 8px;
      border: 2px solid rgba(255,255,255,0.5);
      text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 2px 5px #000;
      box-shadow: 0 0 30px rgba(255, 51, 0, 0.6), inset 0 0 20px rgba(255,255,0,0.5);
    }
    @keyframes hardcore-gradient { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    
    /* 클릭 시 글리치 효과 */
    .btn-spin:active { 
      animation: glitch-skew 0.2s infinite linear;
      filter: hue-rotate(90deg) contrast(1.5);
    }
    @keyframes glitch-skew {
      0% { transform: skewX(0deg); }
      20% { transform: skewX(-5deg); }
      40% { transform: skewX(5deg); }
      60% { transform: skewX(-2deg); }
      80% { transform: skewX(2deg); }
      100% { transform: skewX(0deg); }
    }

    /* 오버레이 */
    #jackpot-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000;
      display: none; justify-content: center; align-items: center; flex-direction: column;
      backdrop-filter: blur(5px);
    }
    #jackpot-overlay.show { display: flex; animation: jp-flash 0.5s; }
    @keyframes jp-flash { from { opacity: 0; filter: brightness(5); } to { opacity: 1; filter: brightness(1); } }

    .jp-title { font-size: 5rem; color: var(--high-voltage-gold); animation: pulse 0.2s infinite alternate; text-shadow: 0 0 50px var(--high-voltage-gold), 0 0 20px #fff; margin: 0; font-weight: 900; font-style: italic;}
    .jp-win { font-size: 4rem; color: #fff; text-shadow: 0 0 30px var(--electric-blue); margin-top: 20px; font-weight: 900;}
    .coin { position: absolute; width: 50px; height: 50px; background: gold; border-radius: 50%; animation: fall linear infinite; z-index: -1; border: 3px solid #fff; box-shadow: 0 0 20px gold;}
    
    #start-overlay {
      position: fixed; inset: 0; background: #000; z-index: 1900;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
    }

    @keyframes fall { to { transform: translateY(120vh) rotate(720deg); } }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); filter: brightness(1.2); } }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* 반응형 */
    @media (max-width: 400px) {
      .jp-amount { font-size: 2rem; }
      .jp-star { font-size: 2rem; }
      .btn-func { width: 65px; font-size: 0.75rem; }
      .bet-display { width: 70px; }
      .btn-step { width: 40px; height: 40px; font-size: 1.4rem; }
      .btn-spin { font-size: 2rem; }
    }
    @media (min-height: 800px) {
      #game-container { justify-content: center; }
      .machine-frame { max-height: 50vh; }
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <div id="game-bg"></div>

  <div id="jackpot-overlay">
    <h1 class="jp-title">⚡ JACKPOT ⚡</h1>

    <div style="color:var(--high-voltage-gold); font-size:1.2rem; animation:blink 0.8s infinite; font-weight:bold;">SYSTEM READY - TOUCH TO ENGAGE</div>
  </div>

  <div id="game-container">
    
    <div class="top-section">
      <div class="header-bar">

      </div>

  </div>

  <script>
    // ==========================================
    // Configuration
    // ==========================================
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
      imgObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/',
        bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
        symbols: [
          'star1.png','star2.png','star3.png',
          'pro1.png','pro2.png','pro3.png','pro4.png','pro5.png','pro6.png','pro7.png',
          'pro8.png','pro9.png','pro10.png'
        ]
      },
      soundObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
        spin: 'spinning-sound.MP3',
        stop: 'stop-stop-stop-sound.MP3',
        win: 'win-sound.MP3',
        lose: 'lose-sound.MP3',
        jackpot: 'jackpot-sound.MP3',
        btn: 'start-button-sound.MP3'
      },
      reels: 5,
      rows: 5  // 5x5 Grid
    };

    const SYMBOL_ALIAS = {
      "1":"star1","A":"star1","2":"star2","3":"star3","4":"pro1","5":"pro2","6":"pro3",
      "7":"pro4","8":"pro5","9":"pro6","10":"pro7","11":"pro8","J":"pro8","12":"pro9","Q":"pro9","13":"pro10","K":"pro10"
    };

    let state = {
      id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, jackpotPool: 0,
      bgIntervalId: null, bgIdx: 0, isGuest: false
    };

    let els = {};
    const audios = {};
    const SlotCanvasImages = {};

    // ==========================================
    // Canvas Engine (5x5, Top to Bottom)
    // ==========================================
    const SlotCanvas = (() => {
      const buffer = 3;
      let canvas, ctx;
      let dpr = 1;
      let cw = 0, ch = 0;
      let reelW = 0, sym = 0, xPad = 0, yPad = 0;
      let reels = [];
      let raf = null, last = 0, running = false;
      let onAllStopped = null, onReelStopped = null;

      const baseNames = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function easeOutBack(t){ const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
      function keyToBaseName(key){
        if (key == null) return randBase();
        const s = String(key).trim();
        if (SYMBOL_ALIAS[s]) return SYMBOL_ALIAS[s];
        if (baseNames.includes(s)) return s;
        if (s.endsWith(".png")) return s.replace(".png","");
        return randBase();
      }
      function randBase(){ return baseNames[(Math.random() * baseNames.length) | 0]; }

      function makeReel(i){
        return {
          i, symbols: [], offset: 0, speed: 0, mode: "idle",
          startAt: 0, stopAt: 0, final: null,
          decelStart: 0, decelDur: 600,
          speedStart: 0, speedEnd: 200,
          snapStart: 0, snapDur: 400, snapFrom: 0
        };
      }

      function fillReel(r){
        const need = CONFIG.rows + buffer * 2 + 5;
        r.symbols = [];
        for (let k=0;k<need;k++) r.symbols.push(randBase());
        r.offset = Math.random() * (sym || 1);
      }

      function resize(){
        if (!canvas) return;
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        const newW = Math.floor(rect.width * dpr);
        const newH = Math.floor(rect.height * dpr);
        if (newW === cw && newH === ch) return;
        const oldSym = sym || 1;
        cw = newW; ch = newH;
        canvas.width = cw; canvas.height = ch;
        reelW = cw / CONFIG.reels;
        sym = Math.floor(Math.min(reelW, ch / CONFIG.rows)); 
        xPad = Math.floor((reelW - sym) / 2);
        yPad = Math.floor((ch - sym * CONFIG.rows) / 2);
        reels.forEach(r => { r.offset = (r.offset / oldSym) * sym; });
      }

      function init(c, hooks={}){
        canvas = c;
        ctx = canvas.getContext("2d", { alpha: true });
        reels = [];
        for (let i=0;i<CONFIG.reels;i++) reels.push(makeReel(i));
        resize();
        reels.forEach(fillReel);
        onReelStopped = hooks.onReelStopped || null;
      }

      function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
      function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=null; }

      function startSpin(){
        const now = performance.now();
        reels.forEach((r, i) => {
          r.mode = "wait";
          r.startAt = now + i * 80; 
          r.stopAt = 0; r.final = null; r.speed = 0;
        });
        start();
      }

      function scheduleStop(keys, doneCb){
        const now = performance.now();
        onAllStopped = doneCb;
        for (let col=0; col<CONFIG.reels; col++){
          const sTop = keyToBaseName(keys[col]);
          const sMid = keyToBaseName(keys[col + 5]);
          const sBot = keyToBaseName(keys[col + 10]);
          reels[col].final = [randBase(), sTop, sMid, sBot, randBase()]; // 5 Rows
          reels[col].stopAt = now + 800 + col * 350; 
        }
      }

      function abortToIdle(){ reels.forEach(r => { r.mode = "idle"; r.speed = 0; r.final = null; }); }

      function update(dt, now){
        for (const r of reels){
          if (r.mode === "wait" && now >= r.startAt) { r.mode = "spin"; r.speed = 1500 + r.i * 200; }
          if (r.mode === "spin"){
            r.speed = Math.min(3500, r.speed + 2000 * dt);
            if (r.stopAt && now >= r.stopAt){
              r.mode = "decel"; r.decelStart = now; r.speedStart = r.speed; r.speedEnd = 200;
            }
          }
          if (r.mode === "decel"){
            const p = Math.min(1, (now - r.decelStart) / r.decelDur);
            r.speed = r.speedStart + (r.speedEnd - r.speedStart) * easeOutCubic(p);
            if (p >= 1){
              if (r.final){
                for(let k=0; k<CONFIG.rows; k++) r.symbols[buffer + k] = r.final[k];
              }
              r.mode = "snap"; r.snapStart = now; r.snapFrom = r.offset; r.speed = 0;
            }
          }
          if (r.mode === "spin" || r.mode === "decel"){
            r.offset += r.speed * dt;
            while (r.offset >= sym){
              r.offset -= sym;
              r.symbols.pop(); r.symbols.unshift(randBase()); 
            }
          }
          if (r.mode === "snap"){
            const p = Math.min(1, (now - r.snapStart) / r.snapDur);
            r.offset = r.snapFrom + (0 - r.snapFrom) * easeOutBack(p);
            if (p >= 1){
              r.offset = 0; r.mode = "stopped";
              if (typeof onReelStopped === "function") onReelStopped(r.i);
            }
          }
        }
      }

      function draw(){
        if (!ctx) return;
        ctx.clearRect(0,0,cw,ch);
        for (const r of reels){
          const rx = r.i * reelW;
          ctx.save(); ctx.beginPath(); ctx.rect(rx, 0, reelW, ch); ctx.clip();
          if (r.mode === "spin" && r.speed > 1800) ctx.filter = "blur(2px) brightness(1.2)"; else ctx.filter = "none";
          for (let i=0;i<r.symbols.length;i++){
            const base = r.symbols[i];
            const img = SlotCanvasImages[base];
            const x = rx + xPad;
            const y = yPad + ((i - buffer) * sym) + r.offset; 
            if (y > -sym && y < ch + sym){
              if (img && img.complete) ctx.drawImage(img, x, y, sym, sym);
              else { ctx.fillStyle = "#111"; ctx.fillRect(x, y, sym, sym); }
            }
          }
          ctx.restore();
          ctx.save(); ctx.strokeStyle = "rgba(0, 243, 255, 0.3)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, ch); ctx.stroke(); ctx.restore();
        }
      }

      function loop(now){
        const dt = Math.min(0.05, (now - last)/1000); last = now;
        update(dt, now); draw();
        if (reels.every(r => r.mode === "stopped" || r.mode === "idle") && onAllStopped){
          const cb = onAllStopped; onAllStopped = null; cb();
        }
        raf = requestAnimationFrame(loop);
      }
      return { init, resize, startSpin, scheduleStop, abortToIdle, stop };
    })();

    // ==========================================
    // App Logic
    // ==========================================
    async function init() {
      console.log("THE UNIQUE: V19 HARDCORE CYBERPUNK");
      els = {
        bg: document.getElementById('game-bg'), overlay: document.getElementById('start-overlay'),
        machineFrame: document.getElementById('machine-frame'), canvas: document.getElementById('slot-canvas'),
        spinBtn: document.getElementById('btn-spin'), autoBtn: document.getElementById('btn-auto'), soundBtn: document.getElementById('btn-sound'),
        walletSpan: document.getElementById('wallet-balance'), jackpotPool: document.getElementById('jackpot-pool'),
        betSpan: document.getElementById('current-bet'), statusMsg: document.getElementById('status-msg'),
        plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
        userId: document.getElementById('user-id'),
        jpOverlay: document.getElementById('jackpot-overlay'), jpAmount: document.getElementById('jp-ani-amount'), coinBox: document.getElementById('coin-container')
      };

      // 배경 이미지 즉시 로드
      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`;

      const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
      const paramId = new URLSearchParams(window.location.search).get('id');
      
      if (paramId) state.id = paramId;
      else if (localId) state.id = localId;
      else state.id = null;

      if (!state.id) {
        state.isGuest = true;
        els.userId.innerText = "GUEST";
        els.spinBtn.disabled = false;
        setStatus("GUEST MODE - SPIN TO LOGIN");
      } else {
        state.isGuest = false;
        els.userId.innerText = state.id;
        await syncUserData();
      }

      for(let k in CONFIG.soundObj){
        if(k!=='path') try{ audios[k] = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[k]); if(k==='spin') audios[k].loop=true; }catch(e){}
      }

      await preloadSymbolImages();

      SlotCanvas.init(els.canvas, {
        onReelStopped: () => {
          if (state.audioEnabled && audios.stop) {
            const s = audios.stop.cloneNode(); s.volume = 0.8; s.play().catch(()=>{});
          }
        }
      });

      window.addEventListener("resize", () => SlotCanvas.resize());
      new ResizeObserver(()=>SlotCanvas.resize()).observe(els.machineFrame);

      if(els.overlay) els.overlay.addEventListener('click', ()=>{ els.overlay.style.display='none'; toggleSound(true); });
      
      els.spinBtn.addEventListener('click', ()=>{ 
        if (state.isGuest) {
          window.location.href = "https://wordycow.github.io/so.t-leader-choice/the-unique-gate.html";
          return;
        }
        state.isAuto=false; updateAutoBtn(); onSpinClick(); 
      });

      els.plus.addEventListener('click', ()=>changeBet(5));
      els.minus.addEventListener('click', ()=>changeBet(-5));
      els.soundBtn.addEventListener('click', ()=>toggleSound(!state.audioEnabled));
      els.autoBtn.addEventListener('click', toggleAuto);
      els.jpOverlay.addEventListener('click', closeJackpot);

      updateUI();
    }

    async function preloadSymbolImages(){
      const bases = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));
      const jobs = bases.map(base => new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve([base, img]);
        img.onerror = () => resolve([base, null]);
        img.src = CONFIG.imgObj.path + base + ".png";
      }));
      const res = await Promise.all(jobs);
      for(const [b, i] of res) if(i) SlotCanvasImages[b] = i;
    }

    function toggleSound(st){
      state.audioEnabled = st;
      els.soundBtn.innerHTML = st ? "SOUND<br>ON" : "SOUND<br>OFF";
      els.soundBtn.classList.toggle("active", st);
      if(!st) Object.values(audios).forEach(a=>a.pause());
      else if(audios.btn) audios.btn.play().catch(()=>{});
    }

    function toggleAuto(){ 
      if(state.isGuest) return; 
      state.isAuto = !state.isAuto; updateAutoBtn(); 
      if(state.isAuto && !state.isSpinning) onSpinClick(); 
    }
    function updateAutoBtn(){ 
      els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; 
      els.autoBtn.classList.toggle("active", state.isAuto); 
    }

    function setStatus(msg, isWin){ 
      els.statusMsg.innerText = msg; 
      els.statusMsg.className = isWin ? "msg-area win" : "msg-area"; 
    }

    async function syncUserData(ani){
      if(!state.id) return;
      try {
        const res = await jsonpRequest('getSlotState', { id: state.id });
        if(res.ok){
          const nb = Number(res.user.balance);
          state.jackpotPool = Number(res.jackpotTotal);
          if(ani) animateValue(els.walletSpan, state.wallet, nb, 1000);
          else els.walletSpan.innerText = nb.toLocaleString();
          state.wallet = nb;
          updateUI();
          if(!ani) setStatus("SYSTEM READY");
          els.spinBtn.disabled = false;
        }
      } catch(e) { setStatus("NETWORK ERROR"); }
    }

    async function onSpinClick(){
      if(state.isSpinning) return;
      if(state.wallet < state.bet) { state.isAuto=false; updateAutoBtn(); alert("잔액 부족"); return; }

      state.isSpinning = true; els.spinBtn.disabled = true; setStatus("ENGAGING...");
      animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet;

      if(state.audioEnabled && audios.spin){ audios.spin.currentTime=0; audios.spin.volume=0.6; audios.spin.play().catch(()=>{}); }
      
      startBgEffect(150);
      SlotCanvas.startSpin();

      try {
        const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
        if(!res.ok) throw new Error();
        SlotCanvas.scheduleStop(res.spin.keys, () => handleSpinEnd(res));
      } catch(e) {
        if(state.audioEnabled) audios.spin.pause();
        SlotCanvas.abortToIdle();
        state.isSpinning = false; els.spinBtn.disabled = false;
        syncUserData();
      }
    }

    function handleSpinEnd(data){
      state.isSpinning = false; stopBgEffect();
      if(state.audioEnabled) audios.spin.pause();
      els.spinBtn.disabled = false;

      const spin = data.spin;
      let isWin = false;
      let msg = "TRY AGAIN";

      if(spin.kind !== "lose"){
        isWin = true;
        msg = `WIN: +${Number(spin.payout).toLocaleString()} UT`;
        if(spin.kind === "jackpot"){
          showJackpotOverlay(Number(spin.payout));
          if(state.audioEnabled) audios.jackpot.play().catch(()=>{});
        } else {
          if(state.audioEnabled) audios.win.play().catch(()=>{});
        }
      } else {
        if(state.audioEnabled) audios.lose.play().catch(()=>{});
      }

      setStatus(msg, isWin);
      
      const newBal = Number(data.user.balance);
      if(state.wallet !== newBal) animateValue(els.walletSpan, state.wallet, newBal, 1000);
      state.wallet = newBal;
      state.jackpotPool = Number(data.jackpotTotal);
      updateUI();

      if(state.isAuto){
        setTimeout(() => {
          if(state.isAuto && state.wallet >= state.bet) onSpinClick();
          else toggleAuto();
        }, 1500);
      }
    }

    function showJackpotOverlay(amt){
      els.jpOverlay.style.display = 'flex';
      els.jpOverlay.classList.add('show');
      animateValue(els.jpAmount, 0, amt, 3000);
      createCoins();
    }
    function closeJackpot(){
      els.jpOverlay.style.display = 'none';
      els.jpOverlay.classList.remove('show');
      els.coinBox.innerHTML = '';
    }
    function createCoins(){
      els.coinBox.innerHTML = '';
      for(let i=0;i<60;i++){
        const c = document.createElement('div');
        c.className = 'coin';
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (Math.random()*2+1)+'s';
        els.coinBox.appendChild(c);
      }
    }

    function startBgEffect(ms){
      clearInterval(state.bgIntervalId);
      state.bgIntervalId = setInterval(()=>{
        state.bgIdx = (state.bgIdx+1)%CONFIG.imgObj.bg.length;
        els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[state.bgIdx]}')`;
      }, ms);
    }
    function stopBgEffect(){
      clearInterval(state.bgIntervalId);
      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`;
    }

    function jsonpRequest(action, params){
      return new Promise((resolve, reject)=>{
        const cb = 'cb_'+Math.round(Math.random()*100000);
        window[cb] = (d) => { delete window[cb]; document.body.removeChild(s); resolve(d); };
        const s = document.createElement('script');
        params.action = action; params.callback = cb;
        s.src = `${CONFIG.API_URL}?${new URLSearchParams(params)}`;
        s.onerror = () => { delete window[cb]; document.body.removeChild(s); reject(); };
        document.body.appendChild(s);
      });
    }

    function animateValue(obj, start, end, duration){
      let s = null;
      const step = (t) => {
        if(!s) s = t;
        const p = Math.min((t-s)/duration, 1);
        obj.innerText = Math.floor(p*(end-start)+start).toLocaleString();
        if(p<1) requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
      };
      requestAnimationFrame(step);
    }

    function updateUI(){
      els.betSpan.innerText = state.bet;
      els.jackpotPool.innerText = Number(state.jackpotPool||0).toLocaleString();
      els.walletSpan.innerText = Number(state.wallet||0).toLocaleString();
    }
    function changeBet(d){
      if(state.isSpinning) return;
      const n = state.bet + d;
      if(n>=5 && n<=1000){ state.bet=n; updateUI(); }
    }

    window.onload = init;
  </script>
</body>
