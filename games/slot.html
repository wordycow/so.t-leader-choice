<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CSS 디자인 (여기에 다 넣었습니다)
           ========================================= */
        :root { --neon-pink: #ff0055; --neon-blue: #00eaff; --neon-gold: #ffd700; --dark-bg: #050510; }
        body { margin: 0; padding: 0; background-color: var(--dark-bg); color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #game-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: -3; filter: brightness(0.6); }
        /* 배경용 그리드 */
        .cyber-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(transparent 95%, var(--neon-blue) 96%, transparent 97%), linear-gradient(90deg, transparent 95%, var(--neon-pink) 96%, transparent 97%); background-size: 50px 50px; opacity: 0.15; transform: perspective(500px) rotateX(60deg); }
        
        /* 텍스트 스타일 */
        .gold-neon { color: var(--neon-gold); text-shadow: 0 0 5px var(--neon-gold), 0 0 15px var(--neon-gold); font-weight: 900; letter-spacing: 1px; }
        .gold-text { color: var(--neon-gold); font-weight: bold; }
        .cyber-text { color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-pink); }
        
        /* 시작 오버레이 */
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .neon-panel { background: rgba(20, 20, 30, 0.9); border: 3px solid var(--neon-blue); padding: 3rem; border-radius: 20px; text-align: center; box-shadow: 0 0 30px var(--neon-blue); }
        .blink-panel { animation: pulseBorder 2s infinite alternate; }
        @keyframes pulseBorder { from { border-color: var(--neon-blue); } to { border-color: var(--neon-pink); } }
        .blink { animation: blink 0.8s infinite alternate; margin-top: 20px; font-size: 1.5rem; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }

        /* 레이아웃 */
        #game-container { width: 100%; max-width: 650px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; box-sizing: border-box; position: relative; }
        
        /* 상단 */
        .top-section { margin-bottom: 5px; }
        .jackpot-display { background: linear-gradient(90deg, rgba(0,0,0,0.8), rgba(50,0,0,0.8), rgba(0,0,0,0.8)); border: 2px solid var(--neon-gold); border-radius: 10px; padding: 8px; text-align: center; margin-bottom: 5px; box-shadow: 0 0 20px var(--neon-gold); animation: pulseGold 2s infinite alternate; }
        @keyframes pulseGold { from { box-shadow: 0 0 10px var(--neon-gold); } to { box-shadow: 0 0 25px var(--neon-gold); } }
        .jackpot-label { display: block; font-size: 0.8rem; color: #ffaa00; letter-spacing: 2px; margin-bottom: 2px; }
        .jackpot-amount { font-size: 1.8rem; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 1px solid #333; }
        .info-box { font-size: 0.9rem; font-weight: 700; color: #aaa; }
        #user-id { color: var(--neon-blue); }
        #wallet-balance { font-size: 1.2rem; }

        /* 슬롯 머신 프레임 (투명) */
        .slot-machine-frame { flex-grow: 1; position: relative; background: rgba(0, 0, 0, 0.1); border-radius: 20px; padding: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        .frame-neon-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid var(--neon-pink); border-radius: 20px; box-shadow: 0 0 15px var(--neon-pink), inset 0 0 15px var(--neon-pink); pointer-events: none; z-index: 20; opacity: 0.6; }
        .slot-window { flex-grow: 1; position: relative; background: rgba(0, 0, 0, 0); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; overflow: hidden; }
        .reels-container { display: flex; width: 100%; height: 100%; }
        .reel { width: 20%; height: 100%; position: relative; border-right: 1px solid rgba(255,255,255,0.05); }
        .reel:last-child { border-right: none; }
        .reel-strip { width: 100%; position: absolute; top: 0; left: 0; will-change: transform; }
        
        /* 원통 효과 */
        .cylinder-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(0,0,0,0.8) 100%); }
        .symbol { width: 100%; aspect-ratio: 1/1; display: block; background-size: 85%; background-repeat: no-repeat; background-position: center; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
        .win-line { position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: var(--neon-gold); z-index: 20; transform: translateY(-50%); box-shadow: 0 0 15px var(--neon-gold); display: none; }

        /* 하단 및 컨트롤 */
        .bottom-section { margin-top: 5px; }
        .win-info-panel { background: rgba(0,0,0,0.8); margin-bottom: 5px; padding: 10px; border-radius: 15px; border: 2px solid var(--neon-blue); text-align: center; box-shadow: 0 0 15px var(--neon-blue); min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
        .win-label { color: #aaa; font-size: 0.9rem; font-weight: bold; }
        .win-amount { font-size: 1.6rem; }
        .control-panel { display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,35,0.9); padding: 10px 15px; border-radius: 20px; border: 1px solid var(--neon-purple); }
        .neon-btn-small, .neon-btn-medium, .neon-btn-large { background: linear-gradient(145deg, #2a2a3a, #1a1a2a); border: 2px solid; color: white; font-weight: bold; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 5px currentColor; }
        .neon-btn-small:active, .neon-btn-medium:active, .neon-btn-large:active { transform: scale(0.96); }
        .sound-btn { width: 35px; height: 35px; border-radius: 50%; border-color: #aaa; color: #aaa; }
        .sound-btn.active { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .bet-control { display: flex; align-items: center; gap: 5px; }
        .bet-btn { width: 40px; height: 40px; border-radius: 10px; border-color: var(--neon-blue); color: var(--neon-blue); font-size: 1.2rem; }
        .bet-display { background: #000; padding: 5px 10px; border-radius: 8px; border: 1px solid #333; text-align: center; min-width: 60px; }
        .bet-label { font-size: 0.6rem; color: #777; display: block; }
        #current-bet { font-size: 1.1rem; }
        .spin-control { display: flex; align-items: center; gap: 10px; }
        .auto-btn { width: 60px; height: 60px; border-radius: 12px; border-color: var(--neon-pink); color: var(--neon-pink); font-size: 0.8rem; text-align: center; line-height: 1.2; }
        .auto-btn.active { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }
        .spin-btn { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, var(--neon-gold), #ff8c00); border: 3px solid white; color: white; font-size: 1.4rem; font-weight: 900; box-shadow: 0 0 20px var(--neon-gold); text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .spin-btn:disabled { filter: grayscale(1); cursor: not-allowed; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }
    </style>
</head>
<body>

    <div id="game-bg"></div>
    <div class="cyber-grid"></div> 

    <div id="start-overlay">
        <div class="neon-panel blink-panel">
            <h1 class="cyber-text">CYBER SLOTS</h1>
            <p class="blink gold-text">TOUCH TO START</p>
        </div>
    </div>

    <div id="game-container">
        <div class="top-section">
            <div class="jackpot-display">
                <span class="jackpot-label">MEGA JACKPOT</span>
                <span class="jackpot-amount gold-neon" id="jackpot-pool">LOADING...</span>
            </div>
            <div class="top-bar">
                <div class="info-box player-info">ID: <span id="user-id">...</span></div>
                <button id="btn-sound" class="sound-btn neon-btn-small">🔊</button>
                <div class="info-box wallet-info">WALLET: <span id="wallet-balance" class="gold-neon">0</span> <span class="unit">UT</span></div>
            </div>
        </div>

        <div class="slot-machine-frame">
            <div class="frame-neon-border"></div>
            <div class="slot-window">
                <div class="reels-container" id="reels-container"></div>
                <div class="cylinder-overlay"></div>
                <div class="win-line"></div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="win-info-panel">
                <div class="win-label" id="win-label">READY</div>
                <div class="win-amount gold-neon" id="win-amount">GOOD LUCK!</div>
            </div>

            <div class="control-panel">
                <div class="bet-control">
                    <button id="btn-bet-minus" class="bet-btn neon-btn-small">-</button>
                    <div class="bet-display">
                        <span class="bet-label">BET</span>
                        <span id="current-bet" class="gold-text">10</span>
                    </div>
                    <button id="btn-bet-plus" class="bet-btn neon-btn-small">+</button>
                </div>
                
                <div class="spin-control">
                    <button id="btn-auto" class="auto-btn neon-btn-medium">AUTO<br>OFF</button>
                    <button id="btn-spin" class="spin-btn neon-btn-large">SPIN</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           JS 게임 로직 (여기에 다 넣었습니다)
           ========================================= */
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
            imgObj: {
                // 이미지는 절대 경로로 유지
                path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/', 
                bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
                symbols: ['star1.png', 'star2.png', 'star3.png', 'pro1.png', 'pro2.png', 'pro3.png', 'pro4.png', 'pro5.png', 'pro6.png', 'pro7.png', 'pro8.png', 'pro9.png', 'pro10.png']
            },
            soundObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
                spin: 'spinning-sound.MP3', stop: 'stop-stop-stop-sound.MP3', win: 'win-sound.MP3', lose: 'lose-sound.MP3', jackpot: 'jackpot-sound.MP3', btn: 'start-button-sound.MP3'
            },
            reels: 5, rows: 3, symbolHeight: 0, bgIntervalTime: 200, dummySymbolCount: 150 
        };

        let state = { id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: true, isAuto: false, bgIntervalId: null, jackpotPool: 0 };
        let els = {}; const audios = {};

        async function init() {
            console.log("SLOT ENGINE: ALL-IN-ONE (NO ERRORS)");
            els = {
                bg: document.getElementById('game-bg'), overlay: document.getElementById('start-overlay'),
                reelsContainer: document.getElementById('reels-container'), spinBtn: document.getElementById('btn-spin'),
                walletSpan: document.getElementById('wallet-balance'), betSpan: document.getElementById('current-bet'),
                winPanel: document.querySelector('.win-info-panel'), winLabel: document.getElementById('win-label'), winAmount: document.getElementById('win-amount'),
                plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
                userId: document.getElementById('user-id'), jackpotPool: document.getElementById('jackpot-pool'),
                gameContainer: document.getElementById('game-container'), btnSound: document.getElementById('btn-sound'), btnAuto: document.getElementById('btn-auto')
            };

            const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
            state.id = localId || new URLSearchParams(window.location.search).get('id');

            if (!state.id) {
                if(els.userId) els.userId.innerText = "GUEST";
                if(els.spinBtn) els.spinBtn.disabled = true;
                updateWinPanel("PLEASE LOGIN", "로그인 필요");
            } else {
                if(els.userId) els.userId.innerText = state.id;
                await syncUserData(); // 연결 기능 확실하게 포함
            }

            Object.keys(CONFIG.soundObj).forEach(key => {
                if (key !== 'path') { try { const audio = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[key]); if(key === 'spin') audio.loop = true; audios[key] = audio; } catch(e) {} }
            });

            createReels(); 

            if(els.overlay) els.overlay.addEventListener('click', unlockAudio);
            if(els.spinBtn) els.spinBtn.addEventListener('click', () => { state.isAuto = false; updateAutoBtn(); onSpinClick(); });
            if(els.plus) els.plus.addEventListener('click', () => changeBet(5));
            if(els.minus) els.minus.addEventListener('click', () => changeBet(-5));
            if(els.btnSound) els.btnSound.addEventListener('click', toggleSound);
            if(els.btnAuto) els.btnAuto.addEventListener('click', toggleAuto);
        }

        function toggleSound() { state.audioEnabled = !state.audioEnabled; if(els.btnSound) els.btnSound.classList.toggle("active", state.audioEnabled); }
        function toggleAuto() { state.isAuto = !state.isAuto; updateAutoBtn(); if (state.isAuto && !state.isSpinning) onSpinClick(); }
        function updateAutoBtn() { if(els.btnAuto) els.btnAuto.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; if(els.btnAuto) els.btnAuto.classList.toggle("active", state.isAuto); }
        function updateWinPanel(label, amount) { if (els.winLabel) els.winLabel.innerText = label; if (els.winAmount) els.winAmount.innerText = amount; }
        
        function animateValue(obj, start, end, duration) {
            if(!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
            };
            window.requestAnimationFrame(step);
        }

        async function syncUserData(animate = false) {
            if (!state.id) return;
            try {
                const res = await jsonpRequest('getSlotState', { id: state.id });
                if (res.ok) {
                    const newWallet = Number(res.user.balance);
                    state.jackpotPool = Number(res.jackpotTotal);
                    if (animate && state.wallet !== newWallet) animateValue(els.walletSpan, state.wallet, newWallet, 1000);
                    else if(els.walletSpan) els.walletSpan.innerText = newWallet.toLocaleString();
                    state.wallet = newWallet;
                    updateUI();
                    if(!animate) updateWinPanel("READY", "GOOD LUCK!");
                    if(els.spinBtn) els.spinBtn.disabled = false;
                } else {
                    updateWinPanel("ERROR", "USER NOT FOUND");
                    if(els.spinBtn) els.spinBtn.disabled = true;
                }
            } catch (e) {
                updateWinPanel("ERROR", "NETWORK FAIL");
            }
        }

        function jsonpRequest(action, params = {}) {
            return new Promise((resolve, reject) => {
                const callbackName = 'cb_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');
                const timeout = setTimeout(() => { cleanup(); reject(new Error("Timeout")); }, 15000); 
                window[callbackName] = function(data) { cleanup(); resolve(data); };
                function cleanup() { clearTimeout(timeout); if(document.body.contains(script)) document.body.removeChild(script); delete window[callbackName]; }
                params.action = action; params.callback = callbackName;
                script.src = `${CONFIG.API_URL}?${new URLSearchParams(params).toString()}`;
                document.body.appendChild(script);
            });
        }

        function createReels() {
            if(!els.reelsContainer) return;
            els.reelsContainer.innerHTML = '';
            for (let i = 0; i < CONFIG.reels; i++) {
                const reelDiv = document.createElement('div'); reelDiv.className = 'reel';
                const stripDiv = document.createElement('div'); stripDiv.className = 'reel-strip';
                let html = '';
                for(let j=0; j < CONFIG.dummySymbolCount; j++) html += `<div class="symbol" style="background-image: url('${CONFIG.imgObj.path}${getRandomSymbolName()}')"></div>`;
                stripDiv.innerHTML = html; reelDiv.appendChild(stripDiv); els.reelsContainer.appendChild(reelDiv);
            }
            setTimeout(() => { const firstSymbol = document.querySelector('.symbol'); if(firstSymbol) CONFIG.symbolHeight = firstSymbol.offsetHeight; }, 100);
        }

        function getRandomSymbolName() { return CONFIG.imgObj.symbols[Math.floor(Math.random() * CONFIG.imgObj.symbols.length)]; }

        async function onSpinClick() {
            if (state.isSpinning) return;
            if (state.wallet < state.bet) { state.isAuto = false; updateAutoBtn(); await syncUserData(); if(state.wallet < state.bet) { alert("잔액 부족 (UT)"); return; } }

            state.isSpinning = true; els.spinBtn.disabled = true; updateWinPanel("SPINNING...", `BET: ${state.bet}`);
            animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet; 

            if(state.audioEnabled) { audios.btn.play(); audios.spin.currentTime = 0; audios.spin.play(); }
            startBgEffect(); 

            const strips = document.querySelectorAll('.reel-strip');
            const symbolDom = document.querySelector('.symbol'); if(symbolDom) CONFIG.symbolHeight = symbolDom.offsetHeight;

            // [핵심] 리셋
            strips.forEach((strip) => { strip.style.transition = 'none'; strip.style.transform = 'translateY(0px)'; });
            void els.gameContainer.offsetWidth; 

            // [핵심] 순차 출발
            strips.forEach((strip, index) => {
                setTimeout(() => {
                    strip.style.transition = `transform 4s linear`; 
                    const targetY = -(CONFIG.symbolHeight * (CONFIG.dummySymbolCount - 20));
                    strip.style.transform = `translateY(${targetY}px)`; 
                }, index * 100);
            });

            try {
                const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
                if (!res.ok) throw new Error(res.error || "Spin Failed");
                stopReelsWithResult(res);
            } catch (err) {
                console.error(err); stopBgEffect(); audios.spin.pause(); state.isSpinning = false; els.spinBtn.disabled = false;
                updateWinPanel("ERROR", "TRY AGAIN"); state.isAuto = false; updateAutoBtn(); syncUserData(true);
            }
        }

        function stopReelsWithResult(data) {
            const serverKeys = data.spin.keys;
            const strips = document.querySelectorAll('.reel-strip');
            const STOP_INDEX = CONFIG.dummySymbolCount - 30;

            strips.forEach((strip, colIdx) => {
                const symbols = strip.querySelectorAll('.symbol');
                symbols[STOP_INDEX].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx]}.png')`;
                symbols[STOP_INDEX + 1].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 5]}.png')`;
                symbols[STOP_INDEX + 2].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 10]}.png')`;

                // [핵심] 순차 정지
                setTimeout(() => {
                    strip.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)'; 
                    const finalY = -(STOP_INDEX * CONFIG.symbolHeight);
                    strip.style.transform = `translateY(${finalY}px)`;
                    if(state.audioEnabled) { audios.stop.cloneNode().play(); }
                    if (colIdx === CONFIG.reels - 1) { els.gameContainer.classList.add('shake'); setTimeout(() => els.gameContainer.classList.remove('shake'), 500); }
                }, 1500 + (colIdx * 500)); 
            });

            setTimeout(() => { handleSpinEnd(data); }, 1500 + ((CONFIG.reels - 1) * 500) + 700);
        }

        function handleSpinEnd(data) {
            state.isSpinning = false; stopBgEffect(); els.spinBtn.disabled = false; audios.spin.pause();
            const spin = data.spin; const newWallet = data.user.balance; state.jackpotPool = data.jackpotTotal;

            if (newWallet > state.wallet) animateValue(els.walletSpan, state.wallet, newWallet, 1500); else els.walletSpan.innerText = newWallet.toLocaleString();
            state.wallet = newWallet;

            let sound = audios.lose; let labelText = "RESULT"; let amountText = "NO WIN";
            if (spin.kind !== "lose") {
                const payout = spin.payout;
                amountText = `+${payout.toLocaleString()} UT`;
                if (spin.kind === "jackpot") { labelText = "★ JACKPOT HIT! ★"; sound = audios.jackpot; }
                else { labelText = "BIG WIN!"; sound = audios.win; }
            }

            updateWinPanel(labelText, amountText);
            if (spin.payout > 0 && state.audioEnabled) { sound.currentTime = 0; sound.play(); }
            updateUI();

            if (state.isAuto) {
                setTimeout(() => { if (state.isAuto && state.wallet >= state.bet) onSpinClick(); else if (state.wallet < state.bet) { state.isAuto = false; updateAutoBtn(); alert("잔액 부족"); } }, 2000); 
            }
        }

        function startBgEffect() { let idx = 0; state.bgIntervalId = setInterval(() => { idx = (idx + 1) % CONFIG.imgObj.bg.length; if(els.bg) els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[idx]}')`; }, CONFIG.bgIntervalTime); }
        function stopBgEffect() { clearInterval(state.bgIntervalId); if(els.bg) els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`; }
        function unlockAudio() { if(els.overlay) els.overlay.style.display = 'none'; audios.btn.play().catch(()=>{}); }
        function updateUI() { if(els.betSpan) els.betSpan.innerText = state.bet.toLocaleString(); if(els.jackpotPool) els.jackpotPool.innerText = state.jackpotPool.toLocaleString(); }
        function changeBet(delta) { if(state.isSpinning) return; const newBet = state.bet + delta; if(newBet >= 5 && newBet <= 1000) { state.bet = newBet; updateUI(); } }

        window.onload = init;
    </script>
</body>
</html>
