<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE UNIQUE SLOT - V18</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    /* === [V18: BACKGROUND FIX & COMPACT HEIGHT] === */
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ff;
      --gold-start: #ffd700;
      --gold-end: #ff8c00;
      --bg-dark: #08080a;
      --glass: rgba(20, 25, 35, 0.9);
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg-dark);
      color: white; font-family: 'Rajdhani', sans-serif;
      overflow: hidden; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }

    /* 배경 설정 (CSS에서도 기본 이미지 설정) */
    #game-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; z-index: -2;
      filter: brightness(0.6);
      /* 자바스크립트 로딩 전에도 검은색 방지 */
      background-color: #1a1a1a; 
      transition: background-image 0.2s;
    }
    
    .cyber-grid {
      position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
      background: linear-gradient(transparent 95%, rgba(0, 243, 255, 0.08) 96%, transparent 97%),
                  linear-gradient(90deg, transparent 95%, rgba(255, 0, 255, 0.08) 96%, transparent 97%);
      background-size: 50px 50px;
      transform: perspective(600px) rotateX(60deg);
      animation: gridMove 15s linear infinite; z-index: -1;
    }
    @keyframes gridMove { 0% { transform: perspective(600px) rotateX(60deg) translateY(0); } 100% { transform: perspective(600px) rotateX(60deg) translateY(50px); } }

    #game-container {
      width: 100%; max-width: 550px; height: 100%; max-height: 100vh;
      display: flex; flex-direction: column;
      padding: 10px; position: relative;
      /* 화면이 너무 길어질 때를 대비해 중앙 정렬 */
      justify-content: center; 
    }

    /* --- 1. 상단 섹션 --- */
    .top-section {
      flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2px;
    }

    .btn-go-main {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: 1px solid #fff; color: #fff;
      padding: 5px 15px; border-radius: 20px;
      font-size: 0.9rem; font-weight: 800; text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
      transition: 0.1s; letter-spacing: 1px;
    }
    .btn-go-main:active { transform: scale(0.95); background: #0072ff; }

    .user-info {
      font-size: 1.1rem; font-weight: bold; color: #fff;
      text-shadow: 0 0 5px var(--neon-cyan);
      background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px;
      border: 1px solid #333;
    }

    .jackpot-panel {
      background: linear-gradient(180deg, rgba(20,0,0,0.9), rgba(60,0,0,0.95));
      border: 2px solid var(--gold-start); border-radius: 12px;
      padding: 10px; 
      display: flex; align-items: center; justify-content: center; gap: 15px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(0,0,0,0.8);
      position: relative; overflow: hidden;
    }
    
    .jp-star {
      font-size: 2.5rem; color: var(--gold-start);
      text-shadow: 0 0 15px var(--gold-start);
      animation: spinStar 3s infinite linear;
    }
    @keyframes spinStar { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }

    .jp-text-group { text-align: left; }
    .jp-label { font-size: 0.7rem; color: #ffaa00; letter-spacing: 2px; font-weight: 800; display: block; }
    .jp-amount {
      font-size: 2.2rem; font-weight: 900; color: #fff;
      text-shadow: 0 0 10px var(--gold-start);
      line-height: 1;
    }

    /* --- 2. 슬롯 머신 (높이 제한 수정) --- */
    .machine-frame {
      /* [중요 수정] flex: 1을 제거하고 aspect-ratio 사용 */
      flex: 0 0 auto; 
      width: 100%;
      /* 5x5 그리드이므로 거의 정사각형 비율 유지 -> 늘어짐 방지 */
      aspect-ratio: 1 / 0.9; 
      max-height: 50vh; /* 화면의 절반 이상 넘지 않도록 제한 */
      
      position: relative;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--neon-magenta);
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
      overflow: hidden; margin-bottom: 10px;
    }
    #slot-canvas { width: 100%; height: 100%; display: block; }
    .win-line {
      position: absolute; top: 50%; left: 0; width: 100%; height: 4px;
      background: rgba(255, 215, 0, 0.4); box-shadow: 0 0 20px var(--gold-start);
      transform: translateY(-50%); display: none; z-index: 10;
    }

    /* --- 3. 컨트롤 덱 --- */
    .control-deck {
      flex: 0 0 auto;
      background: #111;
      border-top: 3px solid var(--neon-cyan);
      border-radius: 20px 20px 0 0;
      padding: 15px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }

    .info-lcd {
      background: #000; border: 1px solid #333;
      border-radius: 8px; padding: 10px 15px;
      margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .msg-area { font-size: 1.2rem; color: #fff; font-weight: 700; letter-spacing: 1px; }
    .msg-area.win { color: var(--gold-start); text-shadow: 0 0 10px var(--gold-start); animation: blink 0.5s infinite; }
    
    .wallet-area { text-align: right; }
    .wallet-lbl { font-size: 0.7rem; color: #888; font-weight: 700; display: block; }
    .wallet-val { font-size: 1.6rem; color: var(--neon-cyan); font-weight: 700; text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); }

    .btn-row-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; gap: 8px;
    }

    .cyber-btn {
      border: none; outline: none; cursor: pointer;
      font-family: 'Rajdhani', sans-serif; font-weight: 800;
      border-radius: 8px;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.1s, filter 0.1s;
      position: relative; overflow: hidden;
    }
    .cyber-btn:active { transform: translateY(2px); filter: brightness(0.8); }

    .btn-func {
      width: 70px; height: 50px; font-size: 0.85rem; line-height: 1.2;
      background: linear-gradient(135deg, #2b1055, #7597de);
      border: 1px solid #5b6ea8;
    }
    .btn-func.active {
      background: linear-gradient(135deg, #00f260, #0575e6);
      box-shadow: 0 0 15px #0575e6; border-color: #fff;
    }

    .bet-control {
      display: flex; align-items: center; gap: 5px;
      background: #000; padding: 4px; border-radius: 10px; border: 1px solid #444;
    }
    .btn-step {
      width: 40px; height: 40px; font-size: 1.5rem;
      background: linear-gradient(180deg, #444, #222);
      border: 1px solid #666;
    }
    .bet-display { width: 80px; text-align: center; }
    .bet-lbl { font-size: 0.7rem; color: #666; }
    .bet-val { font-size: 1.4rem; color: var(--gold-start); font-weight: 700; }

    .spin-container { width: 100%; height: 70px; }
    .btn-spin {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #ff8c00, #ffd700, #ff0055);
      background-size: 200% 200%;
      animation: gradientMove 3s ease infinite;
      color: #fff; font-size: 2.2rem; font-weight: 900; letter-spacing: 5px;
      border: 2px solid #fff; border-radius: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
    }
    @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .btn-spin:active { transform: scale(0.98); }

    /* 오버레이 */
    #jackpot-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
      display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    #jackpot-overlay.show { display: flex; animation: fadeIn 0.3s; }
    .jp-title { font-size: 4rem; color: var(--gold-start); animation: pulse 0.3s infinite; text-shadow: 0 0 40px var(--gold-start); margin: 0;}
    .jp-win { font-size: 3.5rem; color: #fff; text-shadow: 0 0 20px var(--neon-cyan); margin-top: 15px; }
    .coin { position: absolute; width: 45px; height: 45px; background: gold; border-radius: 50%; animation: fall linear infinite; z-index: -1; border: 2px solid #fff; box-shadow: 0 0 10px gold;}
    
    #start-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 90;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
    }

    @keyframes fall { to { transform: translateY(120vh) rotate(360deg); } }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 400px) {
      .jp-amount { font-size: 1.8rem; }
      .jp-star { font-size: 1.8rem; }
      .btn-func { width: 60px; font-size: 0.7rem; }
      .bet-control { gap: 2px; }
      .bet-display { width: 60px; }
      .btn-step { width: 35px; height: 35px; }
      .btn-spin { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div id="game-bg"></div>
  <div class="cyber-grid"></div>

  <div id="jackpot-overlay">
    <h1 class="jp-title">JACKPOT!</h1>
    <div class="jp-win" id="jp-ani-amount">0</div>
    <div id="coin-container"></div>
  </div>

  <div id="start-overlay">
    <h1 style="font-size:3rem; color:white; text-shadow:0 0 20px var(--neon-cyan); margin:0;">UNIQUE</h1>
    <h2 style="font-size:1.5rem; color:var(--neon-magenta); letter-spacing:5px; margin:0 0 30px 0;">CYBER EDITION</h2>
    <div style="color:var(--gold-start); animation:blink 1s infinite;">TOUCH TO START</div>
  </div>

  <div id="game-container">
    
    <div class="top-section">
      <div class="header-bar">
        <a href="https://wordycow.github.io/so.t-leader-choice/the-unique-main.html" class="btn-go-main">GO MAIN</a>
        <div class="user-info" id="user-id">GUEST</div>
      </div>
      
      <div class="jackpot-panel">
        <div class="jp-star">★</div>
        <div class="jp-text-group">
          <span class="jp-label">MEGA JACKPOT POOL</span>
          <span class="jp-amount"><span id="jackpot-pool">...</span> UT</span>
        </div>
      </div>
    </div>

    <div class="machine-frame" id="machine-frame">
      <canvas id="slot-canvas"></canvas>
      <div class="win-line"></div>
    </div>

    <div class="control-deck">
      <div class="info-lcd">
        <div class="msg-area" id="status-msg">READY</div>
        <div class="wallet-area">
          <span class="wallet-lbl">MY WALLET</span>
          <span class="wallet-val" id="wallet-balance">0</span>
        </div>
      </div>

      <div class="btn-row-top">
        <button id="btn-sound" class="cyber-btn btn-func">SOUND<br>OFF</button>
        
        <div class="bet-control">
          <button id="btn-bet-minus" class="cyber-btn btn-step">-</button>
          <div class="bet-display">
            <div class="bet-lbl">BET</div>
            <div class="bet-val" id="current-bet">10</div>
          </div>
          <button id="btn-bet-plus" class="cyber-btn btn-step">+</button>
        </div>

        <button id="btn-auto" class="cyber-btn btn-func">AUTO<br>OFF</button>
      </div>

      <div class="spin-container">
        <button id="btn-spin" class="cyber-btn btn-spin">SPIN</button>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // Configuration
    // ==========================================
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
      imgObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/',
        bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
        symbols: [
          'star1.png','star2.png','star3.png',
          'pro1.png','pro2.png','pro3.png','pro4.png','pro5.png','pro6.png','pro7.png',
          'pro8.png','pro9.png','pro10.png'
        ]
      },
      soundObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
        spin: 'spinning-sound.MP3',
        stop: 'stop-stop-stop-sound.MP3',
        win: 'win-sound.MP3',
        lose: 'lose-sound.MP3',
        jackpot: 'jackpot-sound.MP3',
        btn: 'start-button-sound.MP3'
      },
      reels: 5,
      rows: 5  // 5x5 Grid
    };

    const SYMBOL_ALIAS = {
      "1":"star1","A":"star1","2":"star2","3":"star3","4":"pro1","5":"pro2","6":"pro3",
      "7":"pro4","8":"pro5","9":"pro6","10":"pro7","11":"pro8","J":"pro8","12":"pro9","Q":"pro9","13":"pro10","K":"pro10"
    };

    let state = {
      id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, jackpotPool: 0,
      bgIntervalId: null, bgIdx: 0, isGuest: false
    };

    let els = {};
    const audios = {};
    const SlotCanvasImages = {};

    // ==========================================
    // Canvas Engine (5x5, Top to Bottom)
    // ==========================================
    const SlotCanvas = (() => {
      const buffer = 3;
      let canvas, ctx;
      let dpr = 1;
      let cw = 0, ch = 0;
      let reelW = 0, sym = 0, xPad = 0, yPad = 0;
      let reels = [];
      let raf = null, last = 0, running = false;
      let onAllStopped = null, onReelStopped = null;

      const baseNames = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function easeOutBack(t){ const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
      function keyToBaseName(key){
        if (key == null) return randBase();
        const s = String(key).trim();
        if (SYMBOL_ALIAS[s]) return SYMBOL_ALIAS[s];
        if (baseNames.includes(s)) return s;
        if (s.endsWith(".png")) return s.replace(".png","");
        return randBase();
      }
      function randBase(){ return baseNames[(Math.random() * baseNames.length) | 0]; }

      function makeReel(i){
        return {
          i, symbols: [], offset: 0, speed: 0, mode: "idle",
          startAt: 0, stopAt: 0, final: null,
          decelStart: 0, decelDur: 600,
          speedStart: 0, speedEnd: 200,
          snapStart: 0, snapDur: 400, snapFrom: 0
        };
      }

      function fillReel(r){
        const need = CONFIG.rows + buffer * 2 + 5;
        r.symbols = [];
        for (let k=0;k<need;k++) r.symbols.push(randBase());
        r.offset = Math.random() * (sym || 1);
      }

      function resize(){
        if (!canvas) return;
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        const newW = Math.floor(rect.width * dpr);
        const newH = Math.floor(rect.height * dpr);
        if (newW === cw && newH === ch) return;
        const oldSym = sym || 1;
        cw = newW; ch = newH;
        canvas.width = cw; canvas.height = ch;
        reelW = cw / CONFIG.reels;
        // 5행이 다 들어가도록 계산 (화면 꽉 채우지 않고 비율 유지)
        sym = Math.floor(Math.min(reelW, ch / CONFIG.rows)); 
        xPad = Math.floor((reelW - sym) / 2);
        yPad = Math.floor((ch - sym * CONFIG.rows) / 2);
        reels.forEach(r => { r.offset = (r.offset / oldSym) * sym; });
      }

      function init(c, hooks={}){
        canvas = c;
        ctx = canvas.getContext("2d", { alpha: true });
        reels = [];
        for (let i=0;i<CONFIG.reels;i++) reels.push(makeReel(i));
        resize();
        reels.forEach(fillReel);
        onReelStopped = hooks.onReelStopped || null;
      }

      function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
      function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=null; }

      function startSpin(){
        const now = performance.now();
        reels.forEach((r, i) => {
          r.mode = "wait";
          r.startAt = now + i * 80; 
          r.stopAt = 0; r.final = null; r.speed = 0;
        });
        start();
      }

      function scheduleStop(keys, doneCb){
        const now = performance.now();
        onAllStopped = doneCb;
        for (let col=0; col<CONFIG.reels; col++){
          const sTop = keyToBaseName(keys[col]);
          const sMid = keyToBaseName(keys[col + 5]);
          const sBot = keyToBaseName(keys[col + 10]);
          reels[col].final = [randBase(), sTop, sMid, sBot, randBase()]; // 5 Rows
          reels[col].stopAt = now + 800 + col * 350; 
        }
      }

      function abortToIdle(){ reels.forEach(r => { r.mode = "idle"; r.speed = 0; r.final = null; }); }

      function update(dt, now){
        for (const r of reels){
          if (r.mode === "wait" && now >= r.startAt) { r.mode = "spin"; r.speed = 1500 + r.i * 200; }
          if (r.mode === "spin"){
            r.speed = Math.min(3500, r.speed + 2000 * dt);
            if (r.stopAt && now >= r.stopAt){
              r.mode = "decel"; r.decelStart = now; r.speedStart = r.speed; r.speedEnd = 200;
            }
          }
          if (r.mode === "decel"){
            const p = Math.min(1, (now - r.decelStart) / r.decelDur);
            r.speed = r.speedStart + (r.speedEnd - r.speedStart) * easeOutCubic(p);
            if (p >= 1){
              if (r.final){
                for(let k=0; k<CONFIG.rows; k++) r.symbols[buffer + k] = r.final[k];
              }
              r.mode = "snap"; r.snapStart = now; r.snapFrom = r.offset; r.speed = 0;
            }
          }
          if (r.mode === "spin" || r.mode === "decel"){
            r.offset += r.speed * dt;
            while (r.offset >= sym){
              r.offset -= sym;
              r.symbols.pop(); r.symbols.unshift(randBase()); 
            }
          }
          if (r.mode === "snap"){
            const p = Math.min(1, (now - r.snapStart) / r.snapDur);
            r.offset = r.snapFrom + (0 - r.snapFrom) * easeOutBack(p);
            if (p >= 1){
              r.offset = 0; r.mode = "stopped";
              if (typeof onReelStopped === "function") onReelStopped(r.i);
            }
          }
        }
      }

      function draw(){
        if (!ctx) return;
        ctx.clearRect(0,0,cw,ch);
        for (const r of reels){
          const rx = r.i * reelW;
          ctx.save(); ctx.beginPath(); ctx.rect(rx, 0, reelW, ch); ctx.clip();
          if (r.mode === "spin" && r.speed > 1800) ctx.filter = "blur(2px)"; else ctx.filter = "none";
          for (let i=0;i<r.symbols.length;i++){
            const base = r.symbols[i];
            const img = SlotCanvasImages[base];
            const x = rx + xPad;
            const y = yPad + ((i - buffer) * sym) + r.offset; 
            if (y > -sym && y < ch + sym){
              if (img && img.complete) ctx.drawImage(img, x, y, sym, sym);
              else { ctx.fillStyle = "#111"; ctx.fillRect(x, y, sym, sym); }
            }
          }
          ctx.restore();
          ctx.save(); ctx.strokeStyle = "rgba(0, 243, 255, 0.15)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, ch); ctx.stroke(); ctx.restore();
        }
      }

      function loop(now){
        const dt = Math.min(0.05, (now - last)/1000); last = now;
        update(dt, now); draw();
