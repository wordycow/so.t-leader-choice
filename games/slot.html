<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        /* === [THE UNIQUE: HYPER SPEED EDITION] === */
        :root {
            --gold: #ffcc00;
            --gold-glow: #ffaa00;
            --neon-blue: #00f7ff;
            --bg-dark: #050508;
            --panel-bg: rgba(20, 20, 25, 0.9);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: white; font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
        }

        #game-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            z-index: -2;
        }

        /* 그리드 배경 (속도감) */
        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(transparent 95%, rgba(0, 247, 255, 0.1) 96%, transparent 97%),
                linear-gradient(90deg, transparent 95%, rgba(0, 247, 255, 0.1) 96%, transparent 97%);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1; opacity: 0.3;
        }

        /* 메인 컨테이너 (화면 꽉 채움 & 잘림 방지) */
        #game-container {
            width: 100%; max-width: 600px; height: 100%; max-height: 100vh;
            display: flex; flex-direction: column; 
            padding: 10px; box-sizing: border-box;
        }

        /* --- 1. 상단 (지갑 초대형 확대) --- */
        .top-section { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 5px; }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5px;
        }
        .brand { font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px var(--neon-blue); letter-spacing: 2px; margin: 0; font-weight: 900; }
        .user-id { font-size: 1rem; color: #aaa; }

        /* 지갑 패널 (가장 중요) */
        .wallet-panel {
            background: linear-gradient(180deg, rgba(30,30,30,0.9), rgba(10,10,10,0.95));
            border: 2px solid var(--gold); border-radius: 12px;
            padding: 10px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
            display: flex; flex-direction: column; justify-content: center;
            min-height: 80px;
        }
        .wallet-label { font-size: 0.8rem; color: #888; letter-spacing: 4px; margin-bottom: -5px; }
        .wallet-amount { 
            font-size: 3.5rem; /* 글자 크기 대폭 확대 */
            font-weight: 900; color: #fff;
            text-shadow: 0 0 15px var(--gold), 0 0 30px var(--gold-glow);
            line-height: 1.1; margin: 0;
        }
        .unit { font-size: 1.2rem; color: var(--gold); margin-left: 5px; }
        .jackpot-ticker { font-size: 0.9rem; color: var(--gold); margin-top: 5px; animation: pulse 2s infinite; }

        /* --- 2. 슬롯 머신 (전기 흐르는 프레임) --- */
        .machine-frame {
            flex: 1; /* 남은 공간 모두 차지 */
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid var(--neon-blue); border-radius: 15px;
            overflow: hidden; 
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 50px #000;
            min-height: 200px; /* 최소 높이 보장 */
            margin: 5px 0;
        }
        
        /* 릴 컨테이너 */
        .reels-container { display: flex; width: 100%; height: 100%; }
        .reel { 
            width: 20%; height: 100%; 
            border-right: 1px solid rgba(255,255,255,0.1); 
            position: relative; overflow: hidden; 
        }
        .reel:last-child { border-right: none; }
        
        /* 릴 스트립 (움직이는 부분) */
        .reel-strip { width: 100%; position: absolute; top: 0; left: 0; will-change: transform; }

        /* [스피드 효과] 블러 처리된 회전 */
        .reel-strip.spinning {
            /* 위에서 아래로 무한 반복 */
            animation: spinBlur 0.2s linear infinite; 
            filter: blur(4px); /* 잔상 효과 */
        }
        @keyframes spinBlur {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* [타격감] 멈춤 효과 (바운스) */
        .reel-strip.stopping {
            animation: bounceStop 0.3s cubic-bezier(0.17, 0.67, 0.33, 1.45) forwards; /* 탄력 있는 정지 */
            filter: blur(0);
        }
        @keyframes bounceStop {
            0% { transform: translateY(-50%); } /* 위에서 */
            100% { transform: translateY(0); } /* 제자리로 쾅 */
        }

        .symbol { 
            width: 100%; aspect-ratio: 1/1; 
            background-size: 90%; background-repeat: no-repeat; background-position: center;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }
        
        /* 윈 라인 */
        .win-line { 
            position: absolute; top: 50%; left: 0; width: 100%; height: 4px; 
            background: var(--gold); box-shadow: 0 0 20px var(--gold);
            z-index: 20; transform: translateY(-50%); display: none; 
        }

        /* --- 3. 하단 컨트롤 (절대 안 잘림) --- */
        .bottom-section { flex: 0 0 auto; margin-top: 5px; }

        .msg-panel {
            background: rgba(0,0,0,0.8); border: 1px solid #444; border-radius: 8px;
            padding: 8px; margin-bottom: 5px; text-align: center;
            height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .msg-text { font-size: 1.2rem; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .msg-text.win { color: var(--gold); text-shadow: 0 0 10px var(--gold); font-size: 1.4rem; animation: pulse 0.5s infinite; }

        .control-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #151515; padding: 10px; border-radius: 15px;
            border-top: 2px solid var(--neon-blue);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        /* 버튼 스타일 */
        .btn-rect {
            background: #222; border: 1px solid #555; color: #ccc;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-family: 'Rajdhani', sans-serif; font-weight: bold;
        }
        .btn-rect:active { transform: scale(0.95); background: #333; }

        .btn-sound, .btn-auto { width: 55px; height: 55px; font-size: 0.75rem; flex-direction: column; line-height: 1.2; }
        .btn-sound.active { color: var(--neon-blue); border-color: var(--neon-blue); background: rgba(0,247,255,0.1); }
        .btn-auto.active { color: var(--gold); border-color: var(--gold); background: rgba(255,204,0,0.1); box-shadow: 0 0 10px var(--gold); }

        .bet-group { display: flex; align-items: center; gap: 5px; }
        .btn-bet { width: 45px; height: 45px; font-size: 1.5rem; }
        .bet-display {
            background: #000; border: 1px solid #444; width: 70px; height: 45px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 5px;
        }
        .bet-lbl { font-size: 0.6rem; color: #666; }
        .bet-val { font-size: 1.2rem; font-weight: bold; color: #fff; }

        .btn-spin {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #ffcc00, #ff9900);
            border: 4px solid #fff; color: #332200;
            font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 0 20px var(--gold); cursor: pointer;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
        .btn-spin:active { transform: scale(0.95); box-shadow: 0 0 10px var(--gold); }
        .btn-spin:disabled { filter: grayscale(1); opacity: 0.5; }

        /* --- 잭팟 오버레이 (영상 효과) --- */
        #jackpot-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 99999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        #jackpot-overlay.show { display: flex; animation: fadeIn 0.3s; }
        .jp-title { font-size: 4rem; color: var(--gold); font-weight: 900; text-shadow: 0 0 50px var(--gold); animation: pulse 0.3s infinite; margin: 0; }
        .jp-amount { font-size: 5rem; color: #fff; font-weight: 900; text-shadow: 0 0 30px var(--neon-blue); margin: 20px 0; }
        
        /* 코인 파티클 */
        .coin {
            position: absolute; width: 40px; height: 40px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border: 2px solid #fff; border-radius: 50%;
            box-shadow: 0 0 10px var(--gold);
            z-index: -1; animation: fall linear infinite;
        }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); } to { transform: translateY(110vh) rotate(720deg); } }
        @keyframes pulse { 50% { transform: scale(1.1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 시작 화면 */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* 모바일 대응 */
        @media (max-width: 400px) {
            .wallet-amount { font-size: 2.5rem; }
            .btn-spin { width: 70px; height: 70px; font-size: 1.3rem; }
            .btn-sound, .btn-auto { width: 45px; height: 45px; font-size: 0.65rem; }
            .bet-group { gap: 3px; }
            .btn-bet { width: 35px; height: 35px; }
            .bet-display { width: 55px; }
            .jp-title { font-size: 2.5rem; } .jp-amount { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="game-bg"></div>
    <div class="cyber-grid"></div>

    <div id="jackpot-overlay">
        <h1 class="jp-title">JACKPOT!</h1>
        <div class="jp-amount" id="jp-ani-amount">0</div>
        <div id="coin-container"></div>
        <div style="color:#aaa; margin-top:20px; animation:blink 1s infinite;">TAP TO CLOSE</div>
    </div>

    <div id="start-overlay">
        <h1 style="color:white; font-size: 2.5rem; text-shadow: 0 0 20px var(--neon-blue);">THE UNIQUE</h1>
        <div style="color:var(--gold); font-size:1.2rem; margin-top:20px; animation:pulse 1s infinite; cursor:pointer;">TOUCH TO START</div>
    </div>

    <div id="game-container">
        <div class="top-section">
            <div class="header-bar">
                <h2 class="brand">UNIQUE SLOT</h2>
                <span class="user-id" id="user-id">GUEST</span>
            </div>
            
            <div class="wallet-panel">
                <div class="wallet-label">BALANCE</div>
                <div class="wallet-amount"><span id="wallet-balance">0</span><span class="unit">UT</span></div>
                <div class="jackpot-ticker">MEGA JACKPOT: <span id="jackpot-pool">...</span></div>
            </div>
        </div>

        <div class="machine-frame" id="machine-frame">
            <div class="reels-container" id="reels-container"></div>
            <div style="position:absolute; width:100%; height:100%; pointer-events:none; background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.8) 100%); z-index:10;"></div>
            <div class="win-line"></div>
        </div>

        <div class="bottom-section">
            <div class="msg-panel">
                <div class="msg-text" id="status-msg">READY TO SPIN</div>
            </div>

            <div class="control-bar">
                <button id="btn-sound" class="btn-rect btn-sound">SOUND<br>OFF</button>
                <button id="btn-auto" class="btn-rect btn-auto">AUTO<br>OFF</button>

                <div class="bet-group">
                    <button id="btn-bet-minus" class="btn-rect btn-bet">-</button>
                    <div class="bet-display">
                        <span class="bet-lbl">BET</span>
                        <span class="bet-val" id="current-bet">10</span>
                    </div>
                    <button id="btn-bet-plus" class="btn-rect btn-bet">+</button>
                </div>

                <button id="btn-spin" class="btn-spin">SPIN</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
            imgObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/', 
                bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
                symbols: ['star1.png', 'star2.png', 'star3.png', 'pro1.png', 'pro2.png', 'pro3.png', 'pro4.png', 'pro5.png', 'pro6.png', 'pro7.png', 'pro8.png', 'pro9.png', 'pro10.png']
            },
            soundObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
                spin: 'spinning-sound.MP3', stop: 'stop-stop-stop-sound.MP3', win: 'win-sound.MP3', lose: 'lose-sound.MP3', jackpot: 'jackpot-sound.MP3', btn: 'start-button-sound.MP3'
            },
            reels: 5, rows: 3, symbolHeight: 0, 
            dummySymbolCount: 3 // 화면에 보일 개수 (실제 회전은 CSS로 처리)
        };

        let state = { id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, jackpotPool: 0 };
        let els = {}; const audios = {};

        async function init() {
            console.log("THE UNIQUE: SPEED V12");
            els = {
                bg: document.getElementById('game-bg'), overlay: document.getElementById('start-overlay'),
                reelsContainer: document.getElementById('reels-container'), machineFrame: document.getElementById('machine-frame'),
                spinBtn: document.getElementById('btn-spin'), autoBtn: document.getElementById('btn-auto'), soundBtn: document.getElementById('btn-sound'),
                walletSpan: document.getElementById('wallet-balance'), betSpan: document.getElementById('current-bet'),
                statusMsg: document.getElementById('status-msg'),
                plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
                userId: document.getElementById('user-id'), jackpotPool: document.getElementById('jackpot-pool'),
                jpOverlay: document.getElementById('jackpot-overlay'), jpAmount: document.getElementById('jp-ani-amount'), coinBox: document.getElementById('coin-container')
            };

            const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
            state.id = localId || new URLSearchParams(window.location.search).get('id');

            if (!state.id) {
                els.userId.innerText = "GUEST"; els.spinBtn.disabled = true;
                setStatus("LOGIN REQUIRED");
            } else {
                els.userId.innerText = state.id;
                await syncUserData();
            }

            Object.keys(CONFIG.soundObj).forEach(key => {
                if (key !== 'path') { 
                    try { 
                        const audio = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[key]); 
                        if(key === 'spin') audio.loop = true; 
                        audios[key] = audio; 
                    } catch(e) {} 
                }
            });

            createReels();

            if(els.overlay) els.overlay.addEventListener('click', () => { els.overlay.style.display = 'none'; toggleSound(true); });
            els.spinBtn.addEventListener('click', () => { state.isAuto = false; updateAutoBtn(); onSpinClick(); });
            els.plus.addEventListener('click', () => changeBet(5));
            els.minus.addEventListener('click', () => changeBet(-5));
            els.soundBtn.addEventListener('click', () => toggleSound(!state.audioEnabled));
            els.autoBtn.addEventListener('click', toggleAuto);
            els.jpOverlay.addEventListener('click', closeJackpot);
        }

        function toggleSound(forceState) {
            state.audioEnabled = forceState;
            els.soundBtn.innerHTML = state.audioEnabled ? "SOUND<br>ON" : "SOUND<br>OFF";
            els.soundBtn.classList.toggle("active", state.audioEnabled);
            if(state.audioEnabled && audios.btn) audios.btn.play().catch(()=>{});
        }

        function toggleAuto() { state.isAuto = !state.isAuto; updateAutoBtn(); if (state.isAuto && !state.isSpinning) onSpinClick(); }
        function updateAutoBtn() { els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; els.autoBtn.classList.toggle("active", state.isAuto); }
        function setStatus(msg, isWin = false) {
            els.statusMsg.innerText = msg;
            els.statusMsg.className = isWin ? "msg-text win" : "msg-text";
        }

        async function syncUserData(animate = false) {
            if (!state.id) return;
            try {
                const res = await jsonpRequest('getSlotState', { id: state.id });
                if (res.ok) {
                    const newWallet = Number(res.user.balance);
                    state.jackpotPool = Number(res.jackpotTotal);
                    if (animate) animateValue(els.walletSpan, state.wallet, newWallet, 1000);
                    else els.walletSpan.innerText = newWallet.toLocaleString();
                    state.wallet = newWallet;
                    updateUI();
                    if(!animate) setStatus("READY");
                    els.spinBtn.disabled = false;
                }
            } catch (e) { setStatus("NETWORK ERROR"); }
        }

        function createReels() {
            els.reelsContainer.innerHTML = '';
            for (let i = 0; i < CONFIG.reels; i++) {
                const reelDiv = document.createElement('div'); reelDiv.className = 'reel';
                const stripDiv = document.createElement('div'); stripDiv.className = 'reel-strip';
                // 화면에 보일 3개만 생성 (회전은 CSS 블러로 처리)
                let html = '';
                for(let j=0; j < 3; j++) html += `<div class="symbol" style="background-image: url('${CONFIG.imgObj.path}${getRandomSymbolName()}')"></div>`;
                stripDiv.innerHTML = html; reelDiv.appendChild(stripDiv); els.reelsContainer.appendChild(reelDiv);
            }
            setTimeout(() => { const sym = document.querySelector('.symbol'); if(sym) CONFIG.symbolHeight = sym.offsetHeight; }, 100);
        }
        function getRandomSymbolName() { return CONFIG.imgObj.symbols[Math.floor(Math.random() * CONFIG.imgObj.symbols.length)]; }

        /* === [핵심] 하이퍼 스피드 스핀 === */
        async function onSpinClick() {
            if (state.isSpinning) return;
            if (state.wallet < state.bet) { state.isAuto = false; updateAutoBtn(); alert("잔액 부족"); return; }

            state.isSpinning = true; els.spinBtn.disabled = true;
            setStatus("SPINNING...");
            animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet;

            if(state.audioEnabled) { audios.btn.play(); audios.spin.currentTime = 0; audios.spin.play(); }
            startBgEffect();

            const strips = document.querySelectorAll('.reel-strip');
            
            // 모든 릴 '즉시' 블러 회전 시작
            strips.forEach((strip, index) => {
                strip.classList.remove("stopping"); 
                // 아주 약간의 시차만 두고 다같이 돔
                setTimeout(() => {
                    strip.classList.add("spinning"); 
                }, index * 50);
            });

            try {
                const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
                if (!res.ok) throw new Error("Spin Failed");
                stopReelsWithResult(res);
            } catch (err) {
                stopBgEffect(); audios.spin.pause(); state.isSpinning = false; els.spinBtn.disabled = false;
                strips.forEach(s => s.classList.remove("spinning"));
                syncUserData();
            }
        }

        /* === [핵심] 스나이퍼 싱크 정지 === */
        function stopReelsWithResult(data) {
            const serverKeys = data.spin.keys;
            const strips = document.querySelectorAll('.reel-strip');
            
            strips.forEach((strip, colIdx) => {
                const symbols = strip.querySelectorAll('.symbol');
                
                // 정지 타이밍: 1번 릴부터 0.4초 간격 (빠른 호흡)
                const stopDelay = 600 + (colIdx * 400); 

                setTimeout(() => {
                    // 1. 회전 멈춤
                    strip.classList.remove("spinning");
                    
                    // 2. 결과 이미지 교체
                    symbols[0].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx]}.png')`;
                    symbols[1].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 5]}.png')`;
                    symbols[2].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 10]}.png')`;

                    // 3. 바운스 (탁! 꽂힘)
                    strip.classList.add("stopping");

                    // 4. 소리 싱크 (정확함)
                    if(state.audioEnabled) {
                        const stopSound = audios.stop.cloneNode();
                        stopSound.volume = 0.8;
                        stopSound.play();
                    }
                }, stopDelay);
            });

            // 전체 종료
            setTimeout(() => { handleSpinEnd(data); }, 600 + (4 * 400) + 500);
        }

        function handleSpinEnd(data) {
            state.isSpinning = false; stopBgEffect(); els.spinBtn.disabled = false; audios.spin.pause();
            
            const spin = data.spin;
            let sound = audios.lose; let msg = "TRY AGAIN"; let isWin = false;

            if (spin.kind !== "lose") {
                msg = `WIN! +${spin.payout.toLocaleString()} UT`;
                isWin = true;
                if (spin.kind === "jackpot") { 
                    msg = "★ JACKPOT ★"; sound = audios.jackpot; 
                    showJackpotOverlay(spin.payout); 
                }
                else { sound = audios.win; }
            }

            setStatus(msg, isWin);
            if (state.wallet !== data.user.balance) animateValue(els.walletSpan, state.wallet, data.user.balance, 1000);
            state.wallet = data.user.balance;
            state.jackpotPool = data.jackpotTotal;
            updateUI();

            if (isWin && state.audioEnabled) { sound.currentTime = 0; sound.play(); }

            if (state.isAuto) {
                setTimeout(() => { if (state.isAuto && state.wallet >= state.bet) onSpinClick(); else toggleAuto(); }, 1500); 
            }
        }

        function showJackpotOverlay(amount) {
            els.jpOverlay.style.display = 'flex';
            els.jpOverlay.classList.add('show');
            animateValue(els.jpAmount, 0, amount, 3000);
            createCoins();
        }
        function closeJackpot() {
            els.jpOverlay.style.display = 'none';
            els.jpOverlay.classList.remove('show');
            els.coinBox.innerHTML = '';
        }
        function createCoins() {
            for(let i=0; i<100; i++) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.style.left = Math.random() * 100 + 'vw';
                coin.style.animationDuration = (Math.random() * 2 + 1) + 's';
                coin.style.animationDelay = Math.random() + 's';
                els.coinBox.appendChild(coin);
            }
        }

        function startBgEffect() {
            let idx = 0;
            state.bgIntervalId = setInterval(() => {
                idx = (idx + 1) % CONFIG.imgObj.bg.length;
                els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[idx]}')`;
            }, 100); // 0.1초 (더 빠르게)
        }
        function stopBgEffect() { clearInterval(state.bgIntervalId); els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`; }
        function jsonpRequest(action, params = {}) {
            return new Promise((resolve, reject) => {
                const callbackName = 'cb_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');
                window[callbackName] = function(data) { delete window[callbackName]; document.body.removeChild(script); resolve(data); };
                params.action = action; params.callback = callbackName;
                script.src = `${CONFIG.API_URL}?${new URLSearchParams(params).toString()}`;
                document.body.appendChild(script);
            });
        }
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
            };
            window.requestAnimationFrame(step);
        }
        function updateUI() { els.betSpan.innerText = state.bet; els.jackpotPool.innerText = state.jackpotPool.toLocaleString(); }
        function changeBet(delta) { if(!state.isSpinning) { const n = state.bet + delta; if(n >= 5 && n <= 1000) { state.bet = n; updateUI(); } } }

        window.onload = init;
    </script>
</body>
</html>
