<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT - CASINO EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* === [V13: REAL CASINO MECHANICS] === */
        :root {
            --gold: #ffcc00;
            --gold-shine: #fff7cc;
            --neon-blue: #00f7ff;
            --dark-metal: #1a1a1a;
            --reel-bg: #e0e0e0; /* 리얼 슬롯은 릴 배경이 보통 흰색/회색 */
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: white; font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        #game-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2b0000 0%, #000000 90%); /* 강원랜드풍 붉은/검정 배경 */
            z-index: -2;
        }

        /* 메인 컨테이너 */
        #game-container {
            width: 100%; max-width: 600px; height: 100%; 
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; box-sizing: border-box;
        }

        /* --- 1. 상단 정보 (직관적) --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, #333, #111);
            border: 2px solid var(--gold); border-radius: 10px;
            padding: 10px 15px; margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .wallet-box { text-align: right; }
        .wallet-label { font-size: 0.8rem; color: #aaa; letter-spacing: 1px; display: block; }
        .wallet-amount { font-size: 2rem; color: var(--gold); font-weight: 900; text-shadow: 0 0 10px var(--gold); line-height: 1; }
        .brand-logo { font-size: 1.5rem; color: #fff; font-weight: 900; text-shadow: 0 0 10px var(--neon-blue); font-style: italic; }

        /* --- 2. 슬롯 머신 프레임 (리얼 메카닉) --- */
        .machine-body {
            flex: 1; position: relative;
            background: #000;
            border: 4px solid #444; border-radius: 10px;
            box-shadow: inset 0 0 20px #000, 0 0 30px rgba(255, 204, 0, 0.1);
            overflow: hidden;
            display: flex;
        }

        /* 릴 컨테이너 */
        .reel-col {
            width: 33.33%; height: 100%;
            border-right: 2px solid #222;
            position: relative;
            background: var(--reel-bg); /* 흰색 배경으로 리얼함 살림 */
            overflow: hidden;
        }
        .reel-col:last-child { border-right: none; }

        /* 릴 스트립 (이미지 통) */
        .reel-strip {
            width: 100%; 
            position: absolute; 
            top: 0; left: 0;
            /* 기본적으로 심볼 3개가 보이도록 배치 (중앙 정렬) */
            transform: translateY(0); 
        }

        /* === [핵심 애니메이션] === */
        
        /* 1. 스핀 시작 (백스핀 -> 가속) */
        .reel-strip.start-spin {
            animation: backSpinStart 0.4s ease-in forwards;
        }
        @keyframes backSpinStart {
            0% { transform: translateY(0); }
            40% { transform: translateY(-30px); } /* 위로 살짝 당김 (반동) */
            100% { transform: translateY(100%); } /* 아래로 쾅 출발 */
        }

        /* 2. 무한 회전 (블러 효과) */
        .reel-strip.spinning {
            /* 이미지를 반복시켜서 계속 도는 것처럼 보이게 함 */
            background-repeat: repeat-y;
            animation: spinLoop 0.3s linear infinite; /* 엄청 빠름 */
            filter: blur(2px); /* 속도감 잔상 */
        }
        @keyframes spinLoop {
            0% { transform: translateY(-100%); } /* 위에서 */
            100% { transform: translateY(0%); }   /* 아래로 (패턴 반복) */
        }

        /* 3. 정지 (쾅 -> 바운스) */
        .reel-strip.stopping {
            animation: hardStop 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; /* 탄성 있는 정지 */
            filter: blur(0);
        }
        @keyframes hardStop {
            0% { transform: translateY(-100%); } /* 위에서 꽂힘 */
            60% { transform: translateY(20px); } /* 바닥 뚫을 듯이 내려감 (오버슈트) */
            80% { transform: translateY(-10px); } /* 다시 튕김 */
            100% { transform: translateY(0); }    /* 정지 */
        }

        /* 심볼 스타일 */
        .symbol {
            width: 100%; aspect-ratio: 1/1;
            background-size: 80%; background-repeat: no-repeat; background-position: center;
            border-bottom: 1px solid rgba(0,0,0,0.1); /* 심볼 간 구분선 */
        }

        /* 승리 라인 (가운데) */
        .pay-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 4px;
            background: rgba(255, 0, 0, 0.6); z-index: 10;
            transform: translateY(-50%); box-shadow: 0 0 10px red;
            display: none;
        }

        /* --- 3. 하단 컨트롤 --- */
        .bottom-panel { margin-top: 10px; }

        .msg-display {
            background: #111; color: #fff; text-align: center;
            padding: 8px; border: 1px solid #444; border-radius: 5px;
            font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;
            height: 30px; display: flex; align-items: center; justify-content: center;
        }
        .msg-display.win { color: var(--gold); text-shadow: 0 0 10px var(--gold); animation: blink 0.5s infinite; }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, #333, #000);
            padding: 15px; border-radius: 15px; border-top: 2px solid #555;
        }

        /* 버튼 디자인 (물리 버튼 느낌) */
        .btn {
            background: radial-gradient(circle, #444, #222);
            border: 2px solid #666; color: #fff;
            border-radius: 50%; cursor: pointer;
            box-shadow: 0 5px 0 #000; transition: 0.1s;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Rajdhani', sans-serif; font-weight: bold;
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 0 0 #000; }
        .btn:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        .btn-small { width: 50px; height: 50px; font-size: 0.8rem; flex-direction: column; line-height: 1; }
        .btn-small.active { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

        .bet-ctrl { display: flex; align-items: center; gap: 5px; background: #111; padding: 5px 10px; border-radius: 20px; border: 1px solid #333; }
        .bet-val { font-size: 1.2rem; font-weight: bold; color: var(--gold); min-width: 40px; text-align: center; }
        .btn-mini { width: 30px; height: 30px; font-size: 1rem; background: #333; border-radius: 5px; border: 1px solid #555; color: #fff; }

        .btn-spin {
            width: 90px; height: 90px;
            background: radial-gradient(circle, #ff0000, #990000);
            border: 4px solid #ffaaaa; color: #fff;
            font-size: 1.5rem; text-shadow: 0 2px 2px #000;
        }

        /* 잭팟 오버레이 */
        #jp-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .jp-txt { font-size: 4rem; color: var(--gold); font-weight: 900; animation: pulse 0.3s infinite alternate; }
        .jp-money { font-size: 5rem; color: #fff; font-weight: bold; text-shadow: 0 0 20px var(--gold); margin-top: 20px; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div id="game-bg"></div>

    <div id="jp-overlay">
        <div class="jp-txt">JACKPOT!</div>
        <div class="jp-money" id="jp-display">0</div>
        <div style="color:#aaa; margin-top:30px;">TOUCH TO COLLECT</div>
    </div>

    <div id="game-container">
        <div class="top-bar">
            <div class="brand-logo">THE UNIQUE</div>
            <div class="wallet-box">
                <span class="wallet-label">CREDIT</span>
                <span class="wallet-amount" id="wallet">0</span>
            </div>
        </div>

        <div class="machine-body" id="machine">
            <div class="reel-col">
                <div class="reel-strip" id="reel-1"></div>
            </div>
            <div class="reel-col">
                <div class="reel-strip" id="reel-2"></div>
            </div>
            <div class="reel-col">
                <div class="reel-strip" id="reel-3"></div>
            </div>
            
            <div class="pay-line"></div>
        </div>

        <div class="bottom-panel">
            <div class="msg-display" id="msg-box">READY</div>

            <div class="controls">
                <button id="btn-sound" class="btn btn-small">SOUND<br>OFF</button>
                
                <div class="bet-ctrl">
                    <button id="btn-minus" class="btn-mini">-</button>
                    <div class="bet-val" id="bet-val">10</div>
                    <button id="btn-plus" class="btn-mini">+</button>
                </div>

                <button id="btn-auto" class="btn btn-small">AUTO<br>OFF</button>
                <button id="btn-spin" class="btn btn-spin">SPIN</button>
            </div>
        </div>
    </div>

    <script>
        /* === [V13 ENGINE] === */
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
            imgBase: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/',
            // 심볼 목록
            symbols: ['star1.png', 'star2.png', 'star3.png', 'pro1.png', 'pro2.png', 'pro3.png', 'pro4.png', 'pro5.png', 'pro6.png', 'pro7.png', 'pro8.png', 'pro9.png', 'pro10.png'],
            // 사운드 목록
            sounds: {
                spin: 'spinning-sound.MP3',
                stop: 'stop-stop-stop-sound.MP3',
                win: 'win-sound.MP3',
                jackpot: 'jackpot-sound.MP3',
                btn: 'start-button-sound.MP3'
            }
        };

        const STATE = {
            wallet: 0, bet: 10, id: null,
            spinning: false, auto: false, sound: false,
            reels: [null, null, null] // 릴 DOM 요소
        };

        const AUDIOS = {};

        // === 초기화 ===
        async function init() {
            console.log("ENGINE V13: CASINO MECHANICS");
            
            // DOM 연결
            STATE.reels = [
                document.getElementById('reel-1'),
                document.getElementById('reel-2'),
                document.getElementById('reel-3')
            ];

            // 사운드 로드
            const soundPath = 'https://wordycow.github.io/so.t-leader-choice/games/sounds/';
            for(let k in CONFIG.sounds) {
                AUDIOS[k] = new Audio(soundPath + CONFIG.sounds[k]);
                if(k==='spin') AUDIOS[k].loop = true;
            }

            // 사용자 ID 확인
            const urlParams = new URLSearchParams(window.location.search);
            STATE.id = urlParams.get('id') || localStorage.getItem('user_id');

            if(!STATE.id) {
                document.getElementById('msg-box').innerText = "LOGIN REQUIRED";
                document.getElementById('btn-spin').disabled = true;
            } else {
                // 초기 릴 세팅 (랜덤)
                STATE.reels.forEach(el => renderReelStatic(el));
                await updateServerData();
            }

            // 이벤트 리스너
            document.getElementById('btn-spin').onclick = startSpin;
            document.getElementById('btn-auto').onclick = toggleAuto;
            document.getElementById('btn-sound').onclick = toggleSound;
            document.getElementById('btn-plus').onclick = () => changeBet(5);
            document.getElementById('btn-minus').onclick = () => changeBet(-5);
            document.getElementById('jp-overlay').onclick = () => {
                document.getElementById('jp-overlay').style.display = 'none';
            };
        }

        // --- 릴 렌더링 (정지 상태) ---
        function renderReelStatic(el, topSymbol = null) {
            let html = '';
            // 릴 하나당 심볼 3개 표시 (위, 중간, 아래)
            // topSymbol이 주어지면 그걸 맨 위에, 아니면 랜덤
            const syms = [];
            for(let i=0; i<3; i++) {
                if(i===0 && topSymbol) syms.push(topSymbol);
                else syms.push(CONFIG.symbols[Math.floor(Math.random()*CONFIG.symbols.length)]);
            }
            
            // HTML 생성
            syms.forEach(s => {
                html += `<div class="symbol" style="background-image: url('${CONFIG.imgBase}${s}')"></div>`;
            });
            el.innerHTML = html;
            el.style.transform = 'translateY(0)';
            el.className = 'reel-strip'; // 클래스 초기화
        }

        // --- [핵심] 스핀 시작 ---
        async function startSpin() {
            if(STATE.spinning) return;
            if(STATE.wallet < STATE.bet) { STATE.auto = false; updateBtn(); alert("잔액 부족"); return; }

            STATE.spinning = true;
            document.getElementById('btn-spin').disabled = true;
            updateMsg("SPINNING...", false);
            
            // 돈 차감 (선반영)
            animateValue('wallet', STATE.wallet, STATE.wallet - STATE.bet, 500);
            STATE.wallet -= STATE.bet;

            // 사운드 재생
            if(STATE.sound) { AUDIOS.btn.play(); AUDIOS.spin.currentTime=0; AUDIOS.spin.play(); }

            // 1. 백스핀 & 가속 (Start Animation)
            STATE.reels.forEach((el, idx) => {
                // 기존 내용 유지하면서 애니메이션 클래스 부여
                // 시차를 둬서 다다닥 출발하는 느낌
                setTimeout(() => {
                    el.className = 'reel-strip start-spin';
                }, idx * 100); 
            });

            // 2. 0.4초 후 무한 스핀 모드 전환 (블러 효과)
            setTimeout(() => {
                STATE.reels.forEach(el => {
                    el.className = 'reel-strip spinning'; // CSS animation: spinLoop
                    // 스핀 중일 땐 심볼이 뭉개져 보이게 배경이미지 패턴으로 변경 (최적화 & 시각효과)
                    // 실제로는 CSS filter:blur가 핵심 역할
                });
            }, 500);

            // 3. 서버 결과 요청
            try {
                const res = await jsonpRequest('slotSpin', { id: STATE.id, bet: STATE.bet });
                if(!res.ok) throw new Error();
                // 결과 도착 -> 정지 시퀀스 실행
                stopSequence(res);
            } catch(e) {
                // 에러 시 비상 정지
                STATE.spinning = false;
                STATE.reels.forEach(el => el.className = 'reel-strip'); // 정지
                if(STATE.sound) AUDIOS.spin.pause();
                document.getElementById('btn-spin').disabled = false;
                updateServerData();
            }
        }

        // --- [핵심] 정지 시퀀스 (타격감) ---
        function stopSequence(data) {
            const keys = data.spin.keys; // 결과 심볼 키들
            // 슬롯머신은 릴 3개, 각 릴의 결과는 keys[0], keys[5], keys[10] (예시)
            // 서버 로직에 따라 다르겠지만, 보통 위에서부터 내려오므로
            // 화면에 보일 최종 심볼 3개를 세팅해야 함.
            
            // 이 코드는 3x5 배열 중 각 컬럼의 심볼을 가져옴 (0, 5, 10 인덱스 사용 가정)
            const finalSymbols = [
                [keys[0], keys[1], keys[2]], // Reel 1 (Top, Mid, Bot)
                [keys[5], keys[6], keys[7]], // Reel 2
                [keys[10], keys[11], keys[12]] // Reel 3
            ];

            // 순차 정지 (0.5초 간격)
            STATE.reels.forEach((el, idx) => {
                setTimeout(() => {
                    // 1. 스핀 모드 해제 및 결과 심볼 주입
                    el.className = 'reel-strip'; // 애니메이션 제거 (순간 멈춤)
                    
                    // 결과 심볼 3개를 HTML로 다시 그림
                    let html = '';
                    // 위에서 꽂히는 느낌을 위해:
                    // [결과1][결과2][결과3] 이렇게 배치하고
                    // translateY(-100%) 에서 0으로 꽂아버림
                    
                    // 실제로는 CSS animation 'hardStop'이 -100% -> 0%로 움직임
                    // 따라서 결과 이미지를 렌더링해두면 됨
                    finalSymbols[idx].forEach(k => {
                        html += `<div class="symbol" style="background-image: url('${CONFIG.imgBase}${k}.png')"></div>`;
                    });
                    el.innerHTML = html;

                    // 2. 정지 애니메이션 (쾅!) 적용
                    // void el.offsetWidth; // Reflow (애니메이션 리셋용)
                    el.className = 'reel-strip stopping';

                    // 3. 사운드 (탁!)
                    if(STATE.sound) {
                        const stopSnd = AUDIOS.stop.cloneNode();
                        stopSnd.volume = 0.8;
                        stopSnd.play();
                    }

                }, 600 + (idx * 600)); // 0.6초 간격 (기존보다 더 텀을 줌)
            });

            // 모든 릴 정지 후 결과 처리
            setTimeout(() => {
                finishSpin(data);
            }, 600 + (2 * 600) + 600);
        }

        function finishSpin(data) {
            STATE.spinning = false;
            if(STATE.sound) AUDIOS.spin.pause();
            document.getElementById('btn-spin').disabled = false;

            // 지갑 업데이트
            if(STATE.wallet !== data.user.balance) {
                animateValue('wallet', STATE.wallet, data.user.balance, 1000);
                STATE.wallet = data.user.balance;
            }

            // 결과 메시지
            const win = data.spin.payout > 0;
            if(win) {
                if(data.spin.kind === 'jackpot') {
                    showJackpot(data.spin.payout);
                    if(STATE.sound) AUDIOS.jackpot.play();
                } else {
                    updateMsg(`WIN! +${data.spin.payout}`, true);
                    if(STATE.sound) AUDIOS.win.play();
                }
            } else {
                updateMsg("TRY AGAIN", false);
            }

            // 오토 스핀
            if(STATE.auto) {
                setTimeout(() => {
                    if(STATE.auto && STATE.wallet >= STATE.bet) startSpin();
                    else STATE.auto = false; updateBtn();
                }, 1500);
            }
        }

        // --- 유틸리티 ---
        function updateServerData() {
            jsonpRequest('getSlotState', { id: STATE.id }).then(res => {
                if(res.ok) {
                    STATE.wallet = Number(res.user.balance);
                    document.getElementById('wallet').innerText = STATE.wallet.toLocaleString();
                    document.getElementById('msg-box').innerText = "READY";
                }
            });
        }

        function showJackpot(amt) {
            const el = document.getElementById('jp-overlay');
            el.style.display = 'flex';
            animateValue('jp-display', 0, amt, 3000);
        }

        function updateMsg(txt, isWin) {
            const el = document.getElementById('msg-box');
            el.innerText = txt;
            el.className = isWin ? "msg-display win" : "msg-display";
        }

        function toggleAuto() {
            STATE.auto = !STATE.auto;
            updateBtn();
            if(STATE.auto && !STATE.spinning) startSpin();
        }

        function updateBtn() {
            const btn = document.getElementById('btn-auto');
            btn.innerHTML = STATE.auto ? "AUTO<br>ON" : "AUTO<br>OFF";
            btn.classList.toggle('active', STATE.auto);
        }

        function toggleSound() {
            STATE.sound = !STATE.sound;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = STATE.sound ? "SOUND<br>ON" : "SOUND<br>OFF";
            btn.classList.toggle('active', STATE.sound);
        }

        function changeBet(d) {
            if(STATE.spinning) return;
            let n = STATE.bet + d;
            if(n >= 5 && n <= 1000) { STATE.bet = n; document.getElementById('bet-val').innerText = n; }
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerText = end.toLocaleString();
            };
            window.requestAnimationFrame(step);
        }

        function jsonpRequest(action, params) {
            return new Promise((resolve) => {
                const cb = 'cb_' + Math.round(Math.random()*100000);
                window[cb] = (data) => { delete window[cb]; document.body.removeChild(script); resolve(data); };
                const script = document.createElement('script');
                params.action = action; params.callback = cb;
                script.src = `${CONFIG.API_URL}?${new URLSearchParams(params)}`;
                document.body.appendChild(script);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
