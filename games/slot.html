<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>
  <link rel="stylesheet" href="slot/slot.css" />
</head>

<body>
  <div class="bg" id="bg"></div>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title-row">
          <div class="title">THE UNIQUE SLOT</div>

          <!-- MAIN으로 나가기 -->
          <a class="back-main" id="backMainBtn" href="../the-unique-main.html" aria-label="Back to Main">
            ← MAIN
          </a>
        </div>

        <div class="status-wrap">
          <div class="status-pill">
            <span id="apiDot" class="dot"></span>
            <span id="apiText">Connecting...</span>
          </div>

          <div class="status-pill" id="soundBtn">
            <span class="s-dot"></span>
            <span id="soundText">SOUND: ON</span>
          </div>
        </div>
      </div>

      <div class="layout">

        <!-- LEFT: INFO -->
        <div class="panel info-panel">
          <div class="player-box" id="playerBox">
            <div class="player-line">
              <span class="player-tag">PLAYER</span>
              <span class="player-val" id="playerName">Guest</span>
            </div>

            <div class="player-line">
              <span class="player-tag">UT</span>
              <span class="player-ut" id="playerUt">0</span>
            </div>
          </div>

          <div class="kpi">
            <div class="kpi-box">
              <span class="kpi-label">BET</span>
              <span class="kpi-val gold" id="betVal">10</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">JACKPOT</span>
              <span class="kpi-val" id="jpVal">0</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">WIN</span>
              <span class="kpi-val gold" id="winVal">0</span>
            </div>
          </div>

          <div class="log-box" id="log">Ready to Spin.</div>

          <div class="pay-head">
            <span>SYMBOL</span>
            <span>MATCH PAYOUT (DISPLAY)</span>
          </div>
          <div class="pay-container" id="payGrid"></div>
        </div>

        <!-- RIGHT: GAME -->
        <div class="panel slot-stage">
          <div class="screen-bezel">
            <div class="payline-highlight"></div>
            <div class="reels" id="reels"></div>
          </div>

          <div class="controls">
            <button class="spin-btn" id="spinBtn">SPIN</button>
            <div class="hint" id="hintText">가운데 라인 3칸(2~4번째)이 동일하면 승리!</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script defer src="slot/slot.config.js"></script>
  <script defer src="slot/slot.audio.js"></script>
  <script defer src="slot/slot.ui.js"></script>
  <script defer src="slot/slot.api.js"></script>
  <script defer src="slot/slot.game.js"></script>
  <script defer src="slot/slot.app.js"></script>
</body>
</html>
