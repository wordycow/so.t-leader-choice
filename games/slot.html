<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>THE UNIQUE SLOT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;padding:0;
      font-family:'Rajdhani',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
      color:#fff;
      min-height:100vh;
      overflow:hidden;
      display:flex;align-items:center;justify-content:center;

      background:
        radial-gradient(circle at 50% 20%, rgba(250,204,21,0.14) 0%, rgba(0,0,0,0) 40%),
        radial-gradient(circle at 50% 30%, #1a1f35 0%, #000000 70%);
    }
    body.flash{animation: bgflash 280ms ease-out;}
    @keyframes bgflash{0%{filter:brightness(1)}50%{filter:brightness(1.35)}100%{filter:brightness(1)}}

    .wrap{width:100%;max-width:1200px;height:95vh;max-height:860px;padding:10px;display:flex}
    .card{
      width:100%;height:100%;
      background: rgba(10, 12, 20, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      box-shadow: 0 0 60px rgba(0,0,0,0.9);
      overflow:hidden;
      display:flex;flex-direction:column;
      position:relative;
    }

    .top{
      padding:14px 22px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
    }
    .title{
      font-family:'Cinzel',serif;
      font-size:22px;
      letter-spacing:1px;
      color:#FACC15;
      text-shadow:0 0 12px rgba(250,204,21,0.55);
      user-select:none;
    }
    .back-main{
      font-size:12px;color:#cbd5e1;text-decoration:none;
      border:1px solid rgba(203,213,225,0.22);
      padding:6px 12px;border-radius:999px;
      background:rgba(2,6,23,0.25);
    }
    .back-main:hover{border-color:rgba(250,204,21,0.35);color:#FACC15}

    .layout{flex:1;display:flex;overflow:hidden}

    /* LEFT */
    .info-panel{
      flex:1;
      padding:18px;
      border-right:1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.18);
      display:flex;flex-direction:column;gap:14px;
      overflow:auto;
    }
    .status-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .status-box{
      background: rgba(15,23,42,0.95);
      border:1px solid rgba(148,163,184,0.18);
      border-radius:12px;
      padding:12px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.55);
      text-align:center;
    }
    .label{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px;letter-spacing:0.4px}
    .val{font-size:16px;font-weight:800;color:#fff}
    .val.gold{color:#FACC15}
    .val.red{color:#F87171}

    .bet-control{
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px;
      padding:10px 12px;
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
    }
    .bet-control .label{margin:0;min-width:46px}
    .bet-btn{
      width:34px;height:34px;border-radius:50%;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(51,65,85,0.75);
      color:#fff;font-weight:900;cursor:pointer;
      box-shadow:0 6px 14px rgba(0,0,0,0.35);
      transition: transform 0.08s ease;
    }
    .bet-btn:active{transform:scale(0.92)}
    .bet-amount{
      font-size:20px;font-weight:900;color:#FACC15;
      min-width:72px;text-align:center;
      text-shadow:0 0 10px rgba(250,204,21,0.25);
    }

    .hint{
      font-size:12px;color:#cbd5e1;text-align:center;
      padding:10px 12px;
      border-radius:12px;
      background: rgba(2,6,23,0.35);
      border:1px solid rgba(255,255,255,0.06);
    }

    .pay-grid{
      display:grid;grid-template-columns:repeat(2,1fr);
      gap:8px;max-height:280px;overflow:auto;
      padding-right:4px;
    }
    .pay-item{
      background: rgba(0,0,0,0.28);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:10px;
      padding:8px 10px;
      display:flex;align-items:center;gap:10px;
      font-size:12px;
    }
    .pay-img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,0.25))}
    .pay-name{flex:1;color:#e2e8f0}
    .pay-mul{color:#FACC15;font-weight:900}

    /* RIGHT */
    .slot-stage{
      flex:1.55;
      padding:18px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      position:relative;
    }
    .screen-bezel{
      width:100%;max-width:680px;
      aspect-ratio: 5 / 3.2;
      border-radius:16px;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(250,204,21,0.12), rgba(0,0,0,0) 45%),
        linear-gradient(180deg, #070b12, #000);
      border:1px solid rgba(250,204,21,0.14);
      box-shadow:
        inset 0 0 34px rgba(0,0,0,0.85),
        0 0 24px rgba(250,204,21,0.08);
      margin-bottom:16px;
    }
    .glass{
      position:absolute;inset:0;
      background: linear-gradient(115deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 30%, rgba(255,255,255,0.06));
      pointer-events:none;
      mix-blend-mode:screen;
      opacity:0.65;
    }

    .reels{display:grid;grid-template-columns:repeat(5,1fr);width:100%;height:100%}
    .reel-col{position:relative;overflow:hidden;border-right:1px solid rgba(255,255,255,0.10)}
    .reel-col:last-child{border-right:none}
    .reel-strip{position:absolute;top:0;left:0;width:100%;will-change:transform}
    .symbol{width:100%;height:33.333%;display:flex;align-items:center;justify-content:center;padding:10px}
    .symbol img{width:100%;height:100%;object-fit:contain;filter: drop-shadow(0 0 8px rgba(255,255,255,0.18));}

    @keyframes spinLoop{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
    .reel-strip.spinning{animation: spinLoop 0.35s linear infinite;}
    .reel-strip.spinning img{filter: blur(4px) drop-shadow(0 0 8px rgba(255,255,255,0.10))}

    .payline{
      position:absolute;top:33.33%;height:33.33%;width:100%;
      background: rgba(250,204,21,0.10);
      border-top:2px solid rgba(250,204,21,0.9);
      border-bottom:2px solid rgba(250,204,21,0.9);
      display:none;z-index:10;pointer-events:none;
    }
    .payline.show{display:block;animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:0.55}}

    .controls-row{width:100%;max-width:680px;display:flex;gap:10px;height:62px}
    .spin-btn{
      flex:2;border:none;border-radius:14px;
      font-size:24px;font-weight:900;color:#0b0b0b;
      background: linear-gradient(180deg, #FACC15 0%, #EAB308 100%);
      box-shadow: 0 6px 0 #854D0E, 0 18px 28px rgba(0,0,0,0.35);
      cursor:pointer;transition: transform 0.08s ease;
    }
    .spin-btn:active{transform:translateY(5px);box-shadow:none}
    .spin-btn:disabled{background:#475569;color:#94a3b8;box-shadow:none;cursor:not-allowed}

    .auto-btn{
      flex:1;border-radius:14px;
      border:1px solid rgba(148,163,184,0.25);
      background: rgba(30,41,59,0.65);
      color:#cbd5e1;font-weight:900;
      cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:12px;
      box-shadow: 0 14px 22px rgba(0,0,0,0.25);
    }
    .auto-btn.active{
      background: rgba(220,38,38,0.85);
      border-color: rgba(239,68,68,0.8);
      color:#fff;
      box-shadow: 0 0 14px rgba(239,68,68,0.35), 0 14px 22px rgba(0,0,0,0.25);
    }
    .auto-spinner{font-size:18px;margin-bottom:2px}
    .auto-btn.active .auto-spinner{animation:rotate 1s linear infinite}
    @keyframes rotate{100%{transform:rotate(360deg)}}

    @media (max-width: 900px){
      body{height:auto;display:block;overflow-y:auto}
      .wrap{padding:6px;height:auto;max-height:none}
      .card{height:auto;border-radius:0}
      .layout{flex-direction:column}
      .slot-stage{order:1;padding:14px 10px}
      .info-panel{order:2;border-right:none;border-top:1px solid rgba(255,255,255,0.1)}
      .controls-row{height:56px}
      .spin-btn{font-size:20px}
    }
  </style>

  <!-- ✅ 워커 주소: 여기만 맞으면 JS는 자동으로 따라감 -->
  <script>
    window.SLOT_API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";
  </script>
</head>

<body id="bg">
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title">THE UNIQUE SLOT</div>
        <a class="back-main" href="../the-unique-main.html">← MAIN</a>
      </div>

      <div class="layout">
        <div class="info-panel">
          <div class="status-row">
            <div class="status-box">
              <span class="label">PLAYER</span>
              <span class="val" id="playerName">-</span>
            </div>
            <div class="status-box">
              <span class="label">WALLET (UT)</span>
              <span class="val gold" id="walletUt">0</span>
            </div>
          </div>

          <div class="status-row">
            <div class="status-box">
              <span class="label">JACKPOT</span>
              <span class="val" id="jackpotVal">0</span>
            </div>
            <div class="status-box">
              <span class="label">THIS ROUND</span>
              <span class="val gold" id="roundVal">0</span>
            </div>
          </div>

          <div class="bet-control">
            <span class="label">BET</span>
            <button class="bet-btn" id="betMinus" type="button">-</button>
            <span class="bet-amount" id="betAmount">10</span>
            <button class="bet-btn" id="betPlus" type="button">+</button>
          </div>

          <div class="hint" id="hintText">로딩중...</div>

          <div class="pay-grid" id="payTable"></div>

          <div style="font-size:11px;color:#64748b;text-align:center;margin-top:10px;">
            가운데 줄(중앙 3칸) 3개 동일 = WIN
          </div>
        </div>

        <div class="slot-stage">
          <div class="screen-bezel">
            <div class="payline" id="payline"></div>
            <div class="reels" id="reels">
              <div class="reel-col"><div class="reel-strip" id="reel0"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel1"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel2"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel3"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel4"></div></div>
            </div>
            <div class="glass"></div>
          </div>

          <div class="controls-row">
            <button class="auto-btn" id="autoBtn" type="button">
              <div class="auto-spinner">↻</div>
              <span id="autoText">AUTO OFF</span>
            </button>
            <button class="spin-btn" id="spinBtn" type="button">SPIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ 순서 중요: 오디오 → 페이지 -->
  <script src="slot/slot.audio.js"></script>
  <script src="slot/slot.page.js"></script>
</body>
</html>
