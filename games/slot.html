<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      color:#e5e7eb;
      background:#020617;
      background-image:
        radial-gradient(circle at top, rgba(250,204,21,0.10), rgba(2,6,23,0.95) 55%),
        radial-gradient(circle at bottom, rgba(14,165,233,0.06), rgba(2,6,23,1) 60%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 14px;
    }
    .wrap{
      width:min(1180px, 100%);
      border-radius:24px;
      border:1px solid rgba(148,163,184,0.18);
      background:rgba(2,6,23,0.65);
      box-shadow:0 30px 90px rgba(0,0,0,0.75);
      padding:18px;
    }
    .top{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .title{
      font-family:"Cinzel",serif;
      letter-spacing:0.18em;
      color:#facc15;
      text-transform:uppercase;
      font-weight:700;
    }
    .top a{
      color:#e5e7eb; text-decoration:none;
      border:1px solid rgba(148,163,184,0.22);
      padding:8px 12px; border-radius:999px;
      background:rgba(15,23,42,0.65);
    }
    .grid{
      display:grid;
      grid-template-columns: 340px 1fr;
      gap:14px;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
    }
    .panel{
      border-radius:20px;
      border:1px solid rgba(148,163,184,0.18);
      background:rgba(15,23,42,0.55);
      padding:14px;
    }
    .statGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:12px;
    }
    .stat{
      border-radius:16px;
      border:1px solid rgba(148,163,184,0.16);
      background:rgba(2,6,23,0.45);
      padding:10px 12px;
    }
    .k{font-size:11px; opacity:.75}
    .v{font-weight:800; margin-top:4px}
    .v.gold{color:#facc15}
    .row{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      margin-top:10px;
    }
    .btn{
      border:0;
      cursor:pointer;
      border-radius:14px;
      padding:12px 14px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .btnSpin{
      flex:1;
      background:linear-gradient(180deg,#facc15,#d97706);
      color:#111827;
      box-shadow:0 18px 36px rgba(0,0,0,0.5);
    }
    .btnAuto{
      width:120px;
      background:rgba(2,6,23,0.45);
      border:1px solid rgba(148,163,184,0.22);
      color:#e5e7eb;
    }

    .note{
      margin-top:10px;
      font-size:12px;
      opacity:.8;
      min-height:18px;
    }

    .reelWrap{
      border-radius:20px;
      border:1px solid rgba(250,204,21,0.22);
      background:rgba(2,6,23,0.55);
      padding:14px;
    }
    .reels{
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:10px;
      padding:10px;
      border-radius:18px;
      border:1px solid rgba(148,163,184,0.16);
      background:rgba(0,0,0,0.18);
      min-height:330px;
    }
    .cell{
      border-radius:14px;
      border:1px solid rgba(148,163,184,0.14);
      background:rgba(15,23,42,0.45);
      display:flex; align-items:center; justify-content:center;
      font-weight:800;
      min-height:96px;
      position:relative;
      overflow:hidden;
    }
    .cell img{
      width:86%;
      max-height:86%;
      object-fit:contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.65));
    }
    .cell .fallback{
      font-size:12px; opacity:.9;
    }
    .paytable{
      margin-top:12px;
      border-top:1px solid rgba(148,163,184,0.14);
      padding-top:12px;
      max-height:280px;
      overflow:auto;
    }
    .ptItem{
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(148,163,184,0.12);
      background:rgba(2,6,23,0.35);
      margin-bottom:8px;
      font-size:12px;
    }
    .ptLeft{display:flex; gap:10px; align-items:center}
    .badge{
      width:26px; height:26px;
      border-radius:8px;
      border:1px solid rgba(250,204,21,0.22);
      display:flex; align-items:center; justify-content:center;
      color:#facc15;
      font-weight:900;
      background:rgba(15,23,42,0.45);
      flex:0 0 26px;
      font-size:11px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">THE UNIQUE SLOT</div>
      <a href="../the-unique-main.html">← MAIN</a>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="statGrid">
          <div class="stat">
            <div class="k">PLAYER</div>
            <div class="v" id="uiPlayer">-</div>
          </div>
          <div class="stat">
            <div class="k">WALLET (UT)</div>
            <div class="v gold" id="uiWallet">0</div>
          </div>
          <div class="stat">
            <div class="k">JACKPOT</div>
            <div class="v" id="uiJackpot">0</div>
          </div>
          <div class="stat">
            <div class="k">LAST RESULT</div>
            <div class="v" id="uiResult">0</div>
          </div>
        </div>

        <div class="stat" style="margin-bottom:10px;">
          <div class="k">BET</div>
          <div class="v gold" id="uiBet">10</div>
        </div>

        <div class="row">
          <button class="btn btnAuto" id="btnAuto">AUTO OFF</button>
          <button class="btn btnSpin" id="btnSpin">SPIN</button>
        </div>

        <div class="note" id="uiNote"></div>

        <div class="paytable" id="uiPaytable"></div>
      </div>

      <div class="reelWrap">
        <div class="reels" id="uiReels"></div>
      </div>
    </div>
  </div>

  <script src="./slot.page.js?v=20260110_1"></script>
</body>
</html>
