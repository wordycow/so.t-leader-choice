<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:#e5e7eb;
      background:#020617;
      background-image:
        radial-gradient(circle at top, rgba(148,163,184,.16), transparent 55%),
        radial-gradient(circle at 20% 90%, rgba(245,158,11,.12), transparent 45%);
      overflow-x:hidden;
    }

    .wrap{
      max-width: 1100px;
      margin: 64px auto 40px;
      padding: 0 16px;
    }

    .card{
      border-radius: 26px;
      background: rgba(15,23,42,.92);
      border: 1px solid rgba(245,158,11,.85);
      box-shadow: 0 0 26px rgba(245,158,11,.45), 0 30px 90px rgba(0,0,0,.92);
      padding: 22px 22px 18px;
      backdrop-filter: blur(12px);
      position:relative;
      overflow:hidden;
    }

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 14px;
    }
    .title{
      font-family: "Times New Roman", serif;
      letter-spacing:.16em;
      font-weight:800;
      text-transform:uppercase;
      color:#f8fafc;
      font-size: 22px;
      line-height:1.1;
    }
    .sub{
      margin-top:6px;
      font-size: 11px;
      color:#94a3b8;
      letter-spacing:.08em;
    }

    .status-wrap{display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
    .status-pill{
      display:flex;
      gap:8px;
      align-items:center;
      padding: 8px 10px;
      border-radius: 999px;
      border:1px solid rgba(148,163,184,.24);
      background: rgba(2,6,23,.45);
      color:#cbd5e1;
      font-size: 12px;
      white-space:nowrap;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background:#94a3b8;
      box-shadow:0 0 10px rgba(148,163,184,.35);
    }
    .dot.ok{
      background:#22c55e;
      box-shadow:0 0 14px rgba(34,197,94,.45);
    }

    .sound-btn{
      border-radius:999px;
      border:1px solid rgba(148,163,184,.24);
      background: rgba(2,6,23,.45);
      color:#cbd5e1;
      padding: 8px 10px;
      font-size:12px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .sound-btn .s-dot{
      width:10px;height:10px;border-radius:50%;
      background:#ef4444;
      box-shadow:0 0 12px rgba(239,68,68,.25);
    }
    .sound-btn.on .s-dot{
      background:#22c55e;
      box-shadow:0 0 14px rgba(34,197,94,.35);
    }

    .layout{
      display:grid;
      grid-template-columns: 1.15fr 1.85fr;
      gap: 18px;
      align-items: stretch;
    }

    .panel{
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.45);
      box-shadow: 0 14px 26px rgba(0,0,0,.6);
      padding: 14px;
      min-height: 260px;
    }

    .kpi{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .kpi .box{
      border-radius: 14px;
      background: rgba(15,23,42,.7);
      border: 1px solid rgba(148,163,184,.16);
      padding: 10px 12px;
    }
    .kpi .label{
      font-size: 11px;
      color:#94a3b8;
      margin-bottom:6px;
    }
    .kpi .val{
      font-size: 18px;
      font-weight: 900;
      color:#fff;
      letter-spacing:.02em;
    }
    .kpi .val.gold{ color:#fbbf24; text-shadow:0 0 12px rgba(251,191,36,.25); }

    .log{
      margin-top: 10px;
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(2,6,23,.35);
      border: 1px solid rgba(148,163,184,.14);
      color:#cbd5e1;
      font-size: 12px;
      line-height: 1.45;
      min-height: 110px;
      white-space:pre-line;
    }

    .slot-stage{
      display:flex;
      flex-direction:column;
      gap: 12px;
      height:100%;
    }

    .grid-wrap{
      flex: 1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius: 18px;
      background: rgba(15,23,42,.55);
      border: 1px solid rgba(148,163,184,.18);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
      padding: 16px;
      min-height: 360px;
      position:relative;
      overflow:hidden;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, 150px);
      grid-template-rows: repeat(3, 112px);
      gap: 14px;
    }

    .cell{
      border-radius: 18px;
      background: rgba(2,6,23,.55);
      border: 1px solid rgba(148,163,184,.16);
      box-shadow: 0 14px 28px rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .cell::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(circle at top, rgba(255,255,255,.09), transparent 55%);
      pointer-events:none;
    }

    .cell img{
      width: 92px;
      height: 92px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.70));
      transform: translateZ(0);
    }

    .payline{
      position:absolute;
      left: 16px; right: 16px;
      top: 50%;
      height: 124px;
      transform: translateY(-50%);
      border-radius: 22px;
      border: 1px solid rgba(251,191,36,.40);
      box-shadow: 0 0 26px rgba(251,191,36,.14);
      pointer-events:none;
    }

    .mid3{
      position:absolute;
      top: 50%;
      left: 50%;
      width: calc(150px * 3 + 14px * 2 + 30px);
      height: 124px;
      transform: translate(-50%, -50%);
      border-radius: 22px;
      border: 1px solid rgba(34,197,94,.35);
      box-shadow: 0 0 32px rgba(34,197,94,.12);
      pointer-events:none;
    }

    .spinning .cell img{
      filter: blur(2.2px) brightness(1.10) drop-shadow(0 12px 20px rgba(0,0,0,.75));
      transform: translateY(1px) scale(1.02);
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .btn{
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(148,163,184,.20);
      background: rgba(2,6,23,.35);
      color:#e5e7eb;
      font-weight: 1000;
      letter-spacing:.14em;
      cursor:pointer;
      box-shadow: 0 16px 30px rgba(0,0,0,.55);
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.06); border-color: rgba(248,250,252,.45); }
    .btn:active{ transform: translateY(0); }
    .btn.primary{
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color:#0b1120;
      border-color: rgba(245,158,11,.75);
    }
    .btn:disabled{
      cursor:not-allowed;
      opacity:.55;
      transform:none;
    }

    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
      .grid{ grid-template-columns: repeat(5, 120px); grid-template-rows: repeat(3, 96px); }
      .cell img{ width:78px;height:78px; }
      .mid3{ width: calc(120px * 3 + 14px * 2 + 30px); }
    }
    @media (max-width: 640px){
      .grid{ grid-template-columns: repeat(5, 92px); grid-template-rows: repeat(3, 78px); gap:10px; }
      .cell img{ width:62px;height:62px; }
      .mid3{ width: calc(92px * 3 + 10px * 2 + 30px); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="top">
        <div>
          <div class="title">THE UNIQUE SLOT</div>
          <div class="sub">3행 × 5열 · 가운데 3개 맞추기 · 총 10초 스핀(7초부터 릴 정지)</div>
        </div>

        <div class="status-wrap">
          <div class="status-pill">
            <span id="dot" class="dot"></span>
            <span id="apiText">API: 대기</span>
          </div>
          <button class="sound-btn on" id="soundBtn" type="button">
            <span class="s-dot"></span>
            <span id="soundText">SOUND: ON</span>
          </button>
        </div>
      </div>

      <div class="layout">
        <div class="panel">
          <div class="kpi">
            <div class="box">
              <div class="label">Bet (UT)</div>
              <div class="val gold"><span id="betVal">10</span> UT</div>
            </div>
            <div class="box">
              <div class="label">Jackpot (UT)</div>
              <div class="val"><span id="jpVal">0</span></div>
            </div>
            <div class="box">
              <div class="label">Last Win</div>
              <div class="val gold"><span id="winVal">0</span> UT</div>
            </div>
          </div>

          <div class="log" id="log">준비 중...</div>
        </div>

        <div class="panel slot-stage">
          <div class="grid-wrap" id="gridWrap">
            <div class="payline"></div>
            <div class="mid3"></div>
            <div class="grid" id="grid"></div>
          </div>

          <div class="controls">
            <button class="btn primary" id="spinBtn">SPIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/** =========================
 *  설정
 * ========================= */
const API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";

/** =========================
 *  MP3 (games/sounds/ 폴더)
 *  - GitHub Pages는 대소문자 엄격
 *  - .MP3가 없으면 .mp3로 fallback 시도
 * ========================= */
function mkAudio(file){
  const a = new Audio();
  a.preload = "auto";
  a.src = `sounds/${file}`;
  a.addEventListener("error", () => {
    const alt = file.replace(/\.MP3$/i, ".mp3");
    if(alt !== file) a.src = `sounds/${alt}`;
  }, { once:true });
  return a;
}

const SFX = {
  start: mkAudio("start-button-sound.MP3"),
  spin: mkAudio("spining-sound.MP3"),
  stop: mkAudio("stop-stop-stop-sound.MP3"),
  win: mkAudio("win-sound.MP3"),
  lose: mkAudio("lose-sound.MP3"),
  jackpot: mkAudio("jackpot-sound.MP3"),
};

SFX.spin.loop = true;
SFX.spin.volume = 0.9;
SFX.start.volume = 0.9;
SFX.stop.volume = 0.9;
SFX.win.volume = 1.0;
SFX.lose.volume = 1.0;
SFX.jackpot.volume = 1.0;

let SOUND_ON = true;
let AUDIO_UNLOCKED = false;

function playOne(aud){
  if(!SOUND_ON) return;
  try{
    aud.pause();
    aud.currentTime = 0;
    aud.play();
  }catch(e){}
}
function startSpinLoop(){
  if(!SOUND_ON) return;
  try{
    SFX.spin.currentTime = 0;
    SFX.spin.play();
  }catch(e){}
}
function stopSpinLoop(){
  try{
    SFX.spin.pause();
    SFX.spin.currentTime = 0;
  }catch(e){}
}
function stopAllSounds(){
  try{
    Object.values(SFX).forEach(a=>{
      a.pause();
      a.currentTime = 0;
    });
  }catch(e){}
}

function unlockAudio(){
  if(AUDIO_UNLOCKED) return;
  AUDIO_UNLOCKED = true;

  // 클릭 순간 "무음 재생"으로 오디오 권한 확보
  Object.values(SFX).forEach(a=>{
    try{
      const v = a.volume;
      a.volume = 0.001;
      a.play().then(()=>{
        a.pause();
        a.currentTime = 0;
        a.volume = v;
      }).catch(()=>{ a.volume = v; });
    }catch(e){}
  });
}

/** =========================
 *  심볼/이미지
 * ========================= */
const SYMBOLS = [
  "star1","star2","star3",
  "pro1","pro2","pro3","pro4","pro5","pro6","pro7","pro8","pro9","pro10"
];
const IMG = (id) => `img/slot/${id}.png`;

/** =========================
 *  DOM
 * ========================= */
const $ = (id) => document.getElementById(id);

const gridEl = $("grid");
const gridWrap = $("gridWrap");
const spinBtn = $("spinBtn");

const betVal = $("betVal");
const jpVal = $("jpVal");
const winVal = $("winVal");
const logEl = $("log");
const dot = $("dot");
const apiText = $("apiText");

const soundBtn = $("soundBtn");
const soundText = $("soundText");

function setLog(t){ logEl.textContent = t; }
function setApiStatus(ok){
  dot.classList.toggle("ok", !!ok);
  apiText.textContent = ok ? "API: 연결됨" : "API: 미연결";
}

/** =========================
 *  사운드 토글
 * ========================= */
soundBtn.addEventListener("click", () => {
  unlockAudio();
  SOUND_ON = !SOUND_ON;
  soundBtn.classList.toggle("on", SOUND_ON);
  soundText.textContent = SOUND_ON ? "SOUND: ON" : "SOUND: OFF";
  if(!SOUND_ON){
    stopSpinLoop();
    stopAllSounds();
  }
});

/** =========================
 *  player 처리 (missing_user 방지)
 * ========================= */
function getPlayer(){
  const qs = new URLSearchParams(location.search);
  const u =
    (qs.get("u") || qs.get("user") || qs.get("player") || qs.get("nickname") || "").trim();

  if(u){
    localStorage.setItem("slot_player", u);
    return u;
  }

  const saved = (localStorage.getItem("slot_player") || "").trim();
  if(saved) return saved;

  const p = prompt("닉네임(플레이어)을 입력하세요", "yusong");
  if(p && p.trim()){
    localStorage.setItem("slot_player", p.trim());
    return p.trim();
  }
  return "";
}

/** =========================
 *  API
 * ========================= */
async function api(path, opt){
  try{
    const res = await fetch(`${API_BASE}${path}`, {
      method: opt?.method || "GET",
      headers: { "Content-Type":"application/json" },
      body: opt?.body ? JSON.stringify(opt.body) : undefined
    });
    const js = await res.json().catch(()=>({ok:false,error:"bad_json"}));
    return js;
  }catch(e){
    return { ok:false, error:String(e?.message || e) };
  }
}

/** =========================
 *  그리드 (3x5)
 * ========================= */
const ROWS = 3, COLS = 5;
const cells = []; // [r][c]
function makeGrid(){
  gridEl.innerHTML = "";
  for(let r=0;r<ROWS;r++){
    cells[r] = [];
    for(let c=0;c<COLS;c++){
      const cell = document.createElement("div");
      cell.className = "cell";
      const img = document.createElement("img");
      img.alt = "symbol";
      img.src = IMG("star1");
      cell.appendChild(img);
      gridEl.appendChild(cell);
      cells[r][c] = { cell, img };
    }
  }
}
makeGrid();

/** =========================
 *  릴 스핀 (아래로 “휙휙”)
 * ========================= */
let perColRunning = [];
let timers = [];
let spinning = false;

function clearTimers(){
  timers.forEach(t=>clearTimeout(t));
  timers = [];
  for(let c=0;c<COLS;c++){
    if(perColRunning[c]) clearTimeout(perColRunning[c]);
    perColRunning[c] = null;
  }
}
function randSym(){
  return SYMBOLS[(Math.random()*SYMBOLS.length)|0];
}

/**
 * ✅ 아래로 흐르는 릴
 *  - r0(위)에 새 이미지가 들어오고
 *  - r0 -> r1 -> r2 로 내려감
 */
function startColSpin(col, speedMs){
  const tick = () => {
    const r0 = cells[0][col].img;
    const r1 = cells[1][col].img;
    const r2 = cells[2][col].img;

    const newTop = IMG(randSym());
    r2.src = r1.src;
    r1.src = r0.src;
    r0.src = newTop;

    perColRunning[col] = setTimeout(tick, speedMs);
  };
  perColRunning[col] = setTimeout(tick, speedMs);
}

function stopCol(col){
  if(perColRunning[col]) clearTimeout(perColRunning[col]);
  perColRunning[col] = null;
}

function setColToResult(col, grid){
  for(let r=0;r<ROWS;r++){
    const id = grid[r][col];
    cells[r][col].img.src = IMG(id);
  }
}

/** =========================
 *  초기 상태
 * ========================= */
(async function boot(){
  setLog("준비 중...");
  const st = await api("/slot/state");
  if(!st?.ok){
    setApiStatus(false);
    setLog(`API 연결 실패\n- ${st?.error || "unknown"}\n\n(Worker 도메인/API_BASE 확인)`);
    return;
  }
  setApiStatus(true);
  betVal.textContent = st.bet ?? 10;
  jpVal.textContent = st.jackpot ?? 0;
  setLog(`READY\n- player: ${getPlayer() || "(없음)"}\n- bet: ${st.bet ?? 10} UT`);
})();

/** =========================
 *  SPIN
 * ========================= */
spinBtn.addEventListener("click", async () => {
  if(spinning) return;

  unlockAudio();
  playOne(SFX.start);

  const player = getPlayer();
  if(!player){
    setLog("SPIN 실패\nmissing_user\n\n닉네임이 필요합니다. URL에 ?u=닉네임 붙이거나 새로고침 후 입력하세요.");
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  winVal.textContent = "0";
  gridWrap.classList.add("spinning");
  clearTimers();

  // ✅ 스핀 사운드: 스핀 진행 중 계속
  startSpinLoop();

  setLog("SPIN 요청 중...");
  const q = `?u=${encodeURIComponent(player)}&user=${encodeURIComponent(player)}&player=${encodeURIComponent(player)}&nickname=${encodeURIComponent(player)}`;
  const result = await api(`/slot/spin${q}`, {
    method:"POST",
    body:{ player, user:player, u:player, nickname:player }
  });

  if(!result?.ok){
    setApiStatus(false);
    stopSpinLoop();
    setLog(`SPIN 실패\n${result?.error || "unknown"}`);
    gridWrap.classList.remove("spinning");
    spinning = false;
    spinBtn.disabled = false;
    return;
  }
  setApiStatus(true);

  const finalGrid = result.grid;

  // ✅ 10초 스핀 / 7초부터 릴 하나씩 정지
  const TOTAL_SPIN_MS = 10000;
  const STOP_START_MS = 7000;
  const STOP_STEP_MS  = 650;

  setLog("SPIN! (10초)\n7초부터 릴이 하나씩 멈춥니다.");

  // 시작: 빠르게
  for(let c=0;c<COLS;c++) startColSpin(c, 55);

  const stopTimes = Array.from({length: COLS}, (_, i) => STOP_START_MS + i * STOP_STEP_MS);

  stopTimes.forEach((t, col) => {
    // 감속 2단 + 정지
    timers.push(setTimeout(() => {
      stopCol(col);
      startColSpin(col, 85);
    }, Math.max(0, t - 700)));

    timers.push(setTimeout(() => {
      stopCol(col);
      startColSpin(col, 120);
    }, Math.max(0, t - 350)));

    timers.push(setTimeout(() => {
      stopCol(col);
      setColToResult(col, finalGrid);
      playOne(SFX.stop);
    }, t));
  });

  timers.push(setTimeout(() => {
    gridWrap.classList.remove("spinning");
    stopSpinLoop();

    if(result.bet != null) betVal.textContent = result.bet;
    if(result.jackpot != null) jpVal.textContent = result.jackpot;

    const win = (result?.result?.win ?? "0");
    const winType = (result?.result?.winType ?? "none");
    const sym = (result?.result?.symbol ?? "-");
    const mul = (result?.result?.multiplier ?? 0);

    winVal.textContent = win;

    setLog(
`RESULT
- player: ${player}
- type: ${winType}
- symbol: ${sym}
- x${mul}
- win: ${win} UT
- jackpot: ${result.jackpot ?? jpVal.textContent} UT`
    );

    const isJackpot = String(winType).toLowerCase().includes("jackpot");
    const isWin = (String(win) !== "0" && winType !== "none");

    if(isJackpot) playOne(SFX.jackpot);
    else if(isWin) playOne(SFX.win);
    else playOne(SFX.lose);

    spinning = false;
    spinBtn.disabled = false;
  }, TOTAL_SPIN_MS));
});
</script>
</body>
</html>
