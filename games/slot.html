<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* === [THE UNIQUE STYLE] === */
        :root {
            --gold: #ffcc00;
            --gold-glow: #ffaa00;
            --neon-blue: #00f7ff;
            --glass-black: rgba(0, 0, 0, 0.6);
            --border-color: rgba(255, 204, 0, 0.3);
        }

        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: white; font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* 배경 */
        #game-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; z-index: -2;
            filter: brightness(0.5);
        }

        /* 메인 컨테이너 */
        #game-container {
            width: 100%; max-width: 600px; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; box-sizing: border-box;
        }

        /* --- 상단 영역 --- */
        .top-section { margin-bottom: 5px; }
        
        /* 로고 & 잭팟 */
        .header-panel {
            background: var(--glass-black);
            border: 2px solid var(--gold); border-radius: 15px;
            padding: 10px; text-align: center; margin-bottom: 5px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
        }
        .brand-name {
            font-size: 1.2rem; color: #fff; letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-blue); margin: 0;
        }
        .jackpot-val {
            font-size: 2.2rem; font-weight: 900; color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow); margin-top: 5px;
        }

        /* 정보창 (ID, 지갑) */
        .info-bar {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.5); border: 1px solid #444;
            padding: 8px 15px; border-radius: 10px;
        }
        .info-txt { font-size: 1rem; font-weight: bold; color: #ccc; }
        .money-txt { color: var(--gold); text-shadow: 0 0 5px var(--gold); }

        /* --- 슬롯 머신 (투명) --- */
        .machine-frame {
            flex-grow: 1; position: relative;
            background: rgba(0, 0, 0, 0.3); /* 반투명 */
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px;
            overflow: hidden; box-shadow: inset 0 0 30px #000;
            margin: 5px 0;
        }
        .reels-container { display: flex; width: 100%; height: 100%; }
        .reel { width: 20%; height: 100%; border-right: 1px solid rgba(255,255,255,0.1); position: relative; }
        .reel:last-child { border-right: none; }
        .reel-strip { width: 100%; position: absolute; top: 0; left: 0; will-change: transform; }
        
        .symbol {
            width: 100%; aspect-ratio: 1/1; display: block;
            background-size: 90%; background-repeat: no-repeat; background-position: center;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }
        
        /* 3D 원통 효과 */
        .overlay-grad {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.8) 100%);
        }
        .win-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
            background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);
            z-index: 20; transform: translateY(-50%); opacity: 0.3;
        }

        /* --- 하단 컨트롤 패널 --- */
        .bottom-section { margin-top: 5px; }

        .msg-panel {
            text-align: center; background: rgba(0,0,0,0.7);
            border: 1px solid var(--gold); border-radius: 10px;
            padding: 10px; margin-bottom: 8px; min-height: 50px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .msg-label { font-size: 0.8rem; color: #aaa; letter-spacing: 2px; }
        .msg-val { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .msg-val.win { color: var(--gold); text-shadow: 0 0 15px var(--gold); font-size: 1.8rem; }

        .control-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, #222, #111);
            border-top: 2px solid var(--gold); padding: 10px 15px;
            border-radius: 15px 15px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        /* 버튼 스타일 통일 */
        .btn-rect {
            background: #333; border: 1px solid #555; color: #ccc;
            font-family: 'Rajdhani', sans-serif; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-rect:active { transform: scale(0.95); background: #444; }

        /* 사운드 버튼 */
        .btn-sound { width: 60px; height: 50px; font-size: 0.8rem; flex-direction: column; line-height: 1.2; }
        .btn-sound.active { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0, 247, 255, 0.1); }

        /* 오토 버튼 */
        .btn-auto { width: 60px; height: 50px; font-size: 0.8rem; flex-direction: column; line-height: 1.2; }
        .btn-auto.active { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0, 247, 255, 0.1); box-shadow: 0 0 10px var(--neon-blue); }

        /* 베팅 그룹 */
        .bet-group { display: flex; align-items: center; gap: 5px; }
        .btn-bet { width: 40px; height: 40px; font-size: 1.2rem; background: #222; }
        .bet-display {
            background: #000; border: 1px solid var(--gold);
            width: 70px; height: 40px; border-radius: 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .bet-title { font-size: 0.6rem; color: #666; }
        .bet-num { font-size: 1.1rem; font-weight: bold; color: var(--gold); }

        /* 스핀 버튼 (제일 크게) */
        .btn-spin {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #ffcc00, #ff8800);
            border: 4px solid #fff; color: #4a3000;
            font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 0 20px var(--gold);
            cursor: pointer; transition: 0.1s;
        }
        .btn-spin:active { transform: scale(0.95); box-shadow: 0 0 10px var(--gold); }
        .btn-spin:disabled { filter: grayscale(1); cursor: not-allowed; }

        /* 오버레이 */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(10px);
        }
        .tap-msg {
            font-size: 1.5rem; color: var(--gold); font-weight: bold;
            animation: blink 1s infinite; cursor: pointer; margin-top: 20px;
        }
        @keyframes blink { 50% { opacity: 0.3; } }
        .shake-ani { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }

        /* 모바일 대응 */
        @media (max-width: 400px) {
            .control-bar { padding: 5px; gap: 5px; }
            .btn-sound, .btn-auto { width: 50px; height: 45px; font-size: 0.7rem; }
            .btn-spin { width: 70px; height: 70px; font-size: 1.2rem; }
            .bet-group { gap: 2px; }
            .btn-bet { width: 35px; height: 35px; }
            .bet-display { width: 55px; }
        }
    </style>
</head>
<body>

    <div id="game-bg"></div>

    <div id="start-overlay">
        <h1 style="color:white; font-size: 2rem; text-shadow: 0 0 10px var(--neon-blue);">THE UNIQUE</h1>
        <div class="tap-msg">TOUCH TO START</div>
    </div>

    <div id="game-container">
        <div class="top-section">
            <div class="header-panel">
                <h2 class="brand-name">THE UNIQUE SLOT</h2>
                <div class="jackpot-val" id="jackpot-pool">LOADING...</div>
            </div>
            <div class="info-bar">
                <div class="info-txt">ID: <span id="user-id" style="color:var(--neon-blue)">...</span></div>
                <div class="info-txt">WALLET: <span id="wallet-balance" class="money-txt">0</span></div>
            </div>
        </div>

        <div class="machine-frame" id="machine-frame">
            <div class="reels-container" id="reels-container"></div>
            <div class="overlay-grad"></div>
            <div class="win-line"></div>
        </div>

        <div class="bottom-section">
            <div class="msg-panel">
                <div class="msg-label" id="win-label">READY</div>
                <div class="msg-val" id="win-amount">GOOD LUCK!</div>
            </div>

            <div class="control-bar">
                <button id="btn-sound" class="btn-rect btn-sound">SOUND<br>OFF</button>
                
                <button id="btn-auto" class="btn-rect btn-auto">AUTO<br>OFF</button>

                <div class="bet-group">
                    <button id="btn-bet-minus" class="btn-rect btn-bet">-</button>
                    <div class="bet-display">
                        <span class="bet-title">BET</span>
                        <span class="bet-num" id="current-bet">10</span>
                    </div>
                    <button id="btn-bet-plus" class="btn-rect btn-bet">+</button>
                </div>

                <button id="btn-spin" class="btn-spin">SPIN</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
            imgObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/', 
                bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
                symbols: ['star1.png', 'star2.png', 'star3.png', 'pro1.png', 'pro2.png', 'pro3.png', 'pro4.png', 'pro5.png', 'pro6.png', 'pro7.png', 'pro8.png', 'pro9.png', 'pro10.png']
            },
            soundObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
                spin: 'spinning-sound.MP3', stop: 'stop-stop-stop-sound.MP3', win: 'win-sound.MP3', lose: 'lose-sound.MP3', jackpot: 'jackpot-sound.MP3', btn: 'start-button-sound.MP3'
            },
            reels: 5, rows: 3, symbolHeight: 0, 
            dummySymbolCount: 60 // 릴 길이
        };

        let state = { id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, bgIntervalId: null, jackpotPool: 0 };
        let els = {}; const audios = {};

        async function init() {
            console.log("THE UNIQUE SLOT: FINAL V10");
            els = {
                bg: document.getElementById('game-bg'), overlay: document.getElementById('start-overlay'),
                reelsContainer: document.getElementById('reels-container'), machineFrame: document.getElementById('machine-frame'),
                spinBtn: document.getElementById('btn-spin'), autoBtn: document.getElementById('btn-auto'), soundBtn: document.getElementById('btn-sound'),
                walletSpan: document.getElementById('wallet-balance'), betSpan: document.getElementById('current-bet'),
                winLabel: document.getElementById('win-label'), winAmount: document.getElementById('win-amount'),
                plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
                userId: document.getElementById('user-id'), jackpotPool: document.getElementById('jackpot-pool')
            };

            const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
            state.id = localId || new URLSearchParams(window.location.search).get('id');

            if (!state.id) {
                els.userId.innerText = "GUEST"; els.spinBtn.disabled = true;
                updateWinPanel("LOGIN REQUIRED", "로그인이 필요합니다");
            } else {
                els.userId.innerText = state.id;
                await syncUserData();
            }

            Object.keys(CONFIG.soundObj).forEach(key => {
                if (key !== 'path') { 
                    try { 
                        const audio = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[key]); 
                        if(key === 'spin') audio.loop = true; 
                        audios[key] = audio; 
                    } catch(e) {} 
                }
            });

            createReels();

            if(els.overlay) els.overlay.addEventListener('click', () => { els.overlay.style.display = 'none'; toggleSound(true); });
            els.spinBtn.addEventListener('click', () => { state.isAuto = false; updateAutoBtn(); onSpinClick(); });
            els.plus.addEventListener('click', () => changeBet(5));
            els.minus.addEventListener('click', () => changeBet(-5));
            els.soundBtn.addEventListener('click', () => toggleSound(!state.audioEnabled));
            els.autoBtn.addEventListener('click', toggleAuto);
        }

        function toggleSound(forceState) {
            state.audioEnabled = forceState;
            els.soundBtn.innerHTML = state.audioEnabled ? "SOUND<br>ON" : "SOUND<br>OFF";
            els.soundBtn.classList.toggle("active", state.audioEnabled);
            if(state.audioEnabled && audios.btn) audios.btn.play().catch(()=>{});
        }

        function toggleAuto() { state.isAuto = !state.isAuto; updateAutoBtn(); if (state.isAuto && !state.isSpinning) onSpinClick(); }
        function updateAutoBtn() { els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; els.autoBtn.classList.toggle("active", state.isAuto); }
        function updateWinPanel(label, amount, isWin = false) {
            els.winLabel.innerText = label; els.winAmount.innerText = amount;
            els.winAmount.className = isWin ? "msg-val win" : "msg-val";
        }

        async function syncUserData(animate = false) {
            if (!state.id) return;
            try {
                const res = await jsonpRequest('getSlotState', { id: state.id });
                if (res.ok) {
                    const newWallet = Number(res.user.balance);
                    state.jackpotPool = Number(res.jackpotTotal);
                    if (animate) animateValue(els.walletSpan, state.wallet, newWallet, 1000);
                    else els.walletSpan.innerText = newWallet.toLocaleString();
                    state.wallet = newWallet;
                    updateUI();
                    if(!animate) updateWinPanel("READY", "GOOD LUCK!");
                    els.spinBtn.disabled = false;
                }
            } catch (e) { updateWinPanel("ERROR", "NETWORK ERROR"); }
        }

        function createReels() {
            els.reelsContainer.innerHTML = '';
            for (let i = 0; i < CONFIG.reels; i++) {
                const reelDiv = document.createElement('div'); reelDiv.className = 'reel';
                const stripDiv = document.createElement('div'); stripDiv.className = 'reel-strip';
                let html = '';
                // 꽉 채워진 슬롯: 위쪽에 심볼을 잔뜩 만들어둠
                for(let j=0; j < CONFIG.dummySymbolCount; j++) html += `<div class="symbol" style="background-image: url('${CONFIG.imgObj.path}${getRandomSymbolName()}')"></div>`;
                stripDiv.innerHTML = html; reelDiv.appendChild(stripDiv); els.reelsContainer.appendChild(reelDiv);
            }
            setTimeout(() => { const sym = document.querySelector('.symbol'); if(sym) CONFIG.symbolHeight = sym.offsetHeight; }, 100);
        }
        function getRandomSymbolName() { return CONFIG.imgObj.symbols[Math.floor(Math.random() * CONFIG.imgObj.symbols.length)]; }

        /* === [핵심] 위에서 아래로 꽂히는 스핀 === */
        async function onSpinClick() {
            if (state.isSpinning) return;
            if (state.wallet < state.bet) { state.isAuto = false; updateAutoBtn(); alert("잔액 부족"); return; }

            state.isSpinning = true; els.spinBtn.disabled = true;
            updateWinPanel("SPINNING...", `BET: ${state.bet}`);
            animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet;

            if(state.audioEnabled) { audios.btn.play(); audios.spin.currentTime = 0; audios.spin.play(); }
            startBgEffect();

            const strips = document.querySelectorAll('.reel-strip');
            if(!CONFIG.symbolHeight) CONFIG.symbolHeight = document.querySelector('.symbol').offsetHeight;

            // 1. 리셋: 모든 릴을 '위쪽(-Y)'으로 올려보냄
            const startY = -(CONFIG.symbolHeight * (CONFIG.dummySymbolCount - 5)); 
            strips.forEach((strip) => {
                strip.style.transition = 'none';
                strip.style.transform = `translateY(${startY}px)`;
            });
            void els.reelsContainer.offsetWidth; // Reflow

            // 2. 출발: '아래쪽(0)'으로 빠르게 이동
            strips.forEach((strip, index) => {
                // 뒤로 갈수록 조금 더 늦게 출발하는 느낌 (폭포수)
                setTimeout(() => {
                    strip.style.transition = `transform 2.5s linear`; // 끊김 없이 쭉 내려감
                    strip.style.transform = `translateY(${-CONFIG.symbolHeight * 5}px)`; // 화면 근처까지 이동
                }, index * 100);
            });

            // 3. 서버 요청
            try {
                const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
                if (!res.ok) throw new Error("Spin Failed");
                stopReelsWithResult(res);
            } catch (err) {
                stopBgEffect(); audios.spin.pause(); state.isSpinning = false; els.spinBtn.disabled = false;
                syncUserData();
            }
        }

        /* === [핵심] 순차 정지 & 사운드 싱크 === */
        function stopReelsWithResult(data) {
            const serverKeys = data.spin.keys;
            const strips = document.querySelectorAll('.reel-strip');
            
            strips.forEach((strip, colIdx) => {
                const symbols = strip.querySelectorAll('.symbol');
                // 결과 심볼을 스트립 '맨 위(0,1,2)'에 심음
                symbols[0].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx]}.png')`;
                symbols[1].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 5]}.png')`;
                symbols[2].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 10]}.png')`;

                // 릴마다 0.4초 간격으로 탁! 탁! 탁!
                const stopDelay = 1500 + (colIdx * 400); 

                setTimeout(() => {
                    // 탁! 꽂히는 느낌 (바운스)
                    strip.style.transition = 'transform 0.4s cubic-bezier(0.1, 1, 0.1, 1)'; 
                    // 최종 위치는 0 (맨 위가 보임)
                    strip.style.transform = `translateY(0px)`;

                    // [싱크] 화면 멈춤과 동시에 소리
                    if(state.audioEnabled) {
                        const stopSound = audios.stop.cloneNode();
                        stopSound.volume = 0.8;
                        stopSound.play();
                    }
                    
                    // 마지막 릴 흔들림
                    if(colIdx === 4) {
                        els.machineFrame.classList.add('shake-ani');
                        setTimeout(()=>els.machineFrame.classList.remove('shake-ani'), 300);
                    }

                }, stopDelay);
            });

            // 전체 종료
            setTimeout(() => { handleSpinEnd(data); }, 1500 + (4 * 400) + 500);
        }

        function handleSpinEnd(data) {
            state.isSpinning = false; stopBgEffect(); els.spinBtn.disabled = false; audios.spin.pause();
            
            const spin = data.spin;
            let sound = audios.lose; let label = "TRY AGAIN"; let amount = "NO WIN"; let isWin = false;

            if (spin.kind !== "lose") {
                amount = `+${spin.payout.toLocaleString()} UT`;
                isWin = true;
                if (spin.kind === "jackpot") { label = "★ JACKPOT ★"; sound = audios.jackpot; }
                else { label = "BIG WIN!"; sound = audios.win; }
            }

            updateWinPanel(label, amount, isWin);
            if (state.wallet !== data.user.balance) animateValue(els.walletSpan, state.wallet, data.user.balance, 1000);
            state.wallet = data.user.balance;
            state.jackpotPool = data.jackpotTotal;
            updateUI();

            if (isWin && state.audioEnabled) { sound.currentTime = 0; sound.play(); }

            if (state.isAuto) {
                setTimeout(() => { if (state.isAuto && state.wallet >= state.bet) onSpinClick(); else toggleAuto(); }, 2000); 
            }
        }

        function startBgEffect() {
            let idx = 0;
            state.bgIntervalId = setInterval(() => {
                idx = (idx + 1) % CONFIG.imgObj.bg.length;
                els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[idx]}')`;
            }, 200);
        }
        function stopBgEffect() { clearInterval(state.bgIntervalId); els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`; }
        function jsonpRequest(action, params = {}) {
            return new Promise((resolve, reject) => {
                const callbackName = 'cb_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');
                window[callbackName] = function(data) { delete window[callbackName]; document.body.removeChild(script); resolve(data); };
                params.action = action; params.callback = callbackName;
                script.src = `${CONFIG.API_URL}?${new URLSearchParams(params).toString()}`;
                document.body.appendChild(script);
            });
        }
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
            };
            window.requestAnimationFrame(step);
        }
        function updateUI() { els.betSpan.innerText = state.bet; els.jackpotPool.innerText = state.jackpotPool.toLocaleString(); }
        function changeBet(delta) { if(!state.isSpinning) { const n = state.bet + delta; if(n >= 5 && n <= 1000) { state.bet = n; updateUI(); } } }

        window.onload = init;
    </script>
</body>
</html>
