<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>THE UNIQUE SLOT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ================= RESET & BASIC ================= */
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 30%, #1a1f35 0%, #000000 70%);
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      height: 100vh;
      overflow: hidden; /* 스크롤 방지 (게임 몰입감) */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================= LAYOUT WRAPPER ================= */
    .wrap {
      width: 100%;
      max-width: 1200px;
      height: 95vh;
      max-height: 850px; /* 높이 약간 증가 */
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 36, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 10px rgba(78, 205, 196, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ================= HEADER ================= */
    .top {
      flex: 0 0 auto;
      padding: 15px 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
    }
    .title-row { display: flex; align-items: center; gap: 15px; }
    .title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      color: #FACC15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
      letter-spacing: 1px;
    }
    .back-main {
      font-size: 12px;
      color: #94A3B8;
      text-decoration: none;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      transition: 0.2s;
    }
    .back-main:hover { color: #fff; border-color: #fff; }

    .status-wrap { display: flex; gap: 10px; }
    .status-pill {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer; /* 사운드 버튼 클릭 가능 표시 */
    }
    .dot, .s-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 5px #4ADE80; }
    .s-dot.off { background: #ef4444; box-shadow: 0 0 5px #ef4444; } /* 사운드 OFF 스타일 */
    
    /* ================= MAIN CONTENT ================= */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden; /* 내부 스크롤 제어 */
    }

    /* --- LEFT: INFO PANEL --- */
    .panel { padding: 20px; overflow-y: auto; }
    
    .info-panel {
      flex: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(0,0,0,0.2);
    }
    
    /* Player Info */
    .player-box {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .player-line:last-child { margin-bottom: 0; }
    .player-tag { font-size: 11px; color: #64748B; font-weight: 700; }
    .player-val { font-size: 14px; color: #fff; font-weight: 600; }
    .player-ut { font-size: 16px; color: #FACC15; font-weight: 700; text-shadow: 0 0 8px rgba(250,204,21,0.4); }

    /* KPI Stats */
    .kpi { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .kpi-box {
      background: #0f172a;
      padding: 8px 5px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .kpi-label { display: block; font-size: 10px; color: #94A3B8; margin-bottom: 2px; }
    .kpi-val { font-size: 15px; font-weight: 700; color: #E2E8F0; }
    .kpi-val.gold { color: #FACC15; }

    /* Log Box */
    .log-box {
      font-family: monospace;
      font-size: 11px;
      color: #38BDF8;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      border-radius: 6px;
      min-height: 32px;
      display: flex; align-items: center;
      border-left: 3px solid #38BDF8;
      white-space: pre-wrap; /* 줄바꿈 지원 */
    }

    /* Pay Grid (Table) - ✅ 크기 줄임 */
    .pay-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0; /* flex 자식 스크롤 필수 */
    }
    .pay-head {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #64748B; padding: 0 4px; margin-bottom: 4px; font-weight: 700;
    }
    .pay-container {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2열 배치 */
      gap: 6px;
      align-content: start;
      max-height: 200px; /* PC에서도 너무 크지 않게 제한 */
    }
    /* 스크롤바 커스텀 */
    .pay-container::-webkit-scrollbar { width: 4px; }
    .pay-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* Pay Item Style */
    .pay-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px;
      font-size: 11px; color: #cbd5e1;
    }
    .pay-img { width: 20px; height: 20px; object-fit: contain; }

    /* --- RIGHT: GAME STAGE --- */
    .slot-stage {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 30px;
    }

    /* Bezel (Machine Border) */
    .screen-bezel {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 5 / 3; /* 슬롯 비율 고정 (5열 3행) */
      background: #000;
      border-radius: 16px;
      border: 2px solid #334155;
      box-shadow: 
        0 0 0 4px #0f172a, 
        0 0 20px rgba(56, 189, 248, 0.3),
        inset 0 0 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .payline-highlight {
      position: absolute;
      top: 33.33%; height: 33.33%; width: 100%;
      background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.1), transparent);
      border-top: 1px solid rgba(250, 204, 21, 0.5);
      border-bottom: 1px solid rgba(250, 204, 21, 0.5);
      pointer-events: none;
      z-index: 10; /* 릴 위에 표시 */
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
      display: none; /* 기본 숨김, 결과 나올 때 표시 */
    }
    .payline-highlight.active { display: block; }

    /* Reels Grid */
    .reels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 100%;
      width: 100%;
      position: relative;
    }
    
    /* ✅ Reel Individual & Animation (핵심!) */
    .reel-col {
      border-right: 1px solid rgba(255,255,255,0.1);
      overflow: hidden; /* 넘치는 심볼 숨김 */
      position: relative;
      height: 100%;
    }
    .reel-col:last-child { border-right: none; }

    /* 실제 움직이는 긴 스트립 */
    .reel-strip {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0; left: 0; width: 100%;
      /* 초기 위치: 결과 심볼 3개가 정확히 보이도록 설정 (JS에서 계산) */
    }

    /* 회전 애니메이션 키프레임 */
    @keyframes spin {
      0% { transform: translateY(0); }
      100% { transform: translateY(calc(-100% + (100% / 3 * 3))); } /* 전체 높이 - 3칸 높이 만큼 이동 */
    }
    
    /* 애니메이션 적용 클래스 */
    .reel-strip.spinning {
      animation: spin 0.3s linear infinite; /* 빠르게 반복 회전 */
    }
    
    /* Symbol Image */
    .symbol {
      width: 100%;
      /* 부모(.screen-bezel) 높이의 1/3 */
      height: calc(100% / 3); 
      display: flex; 
      align-items: center; justify-content: center;
      padding: 10%; /* 이미지 패딩 */
    }
    .symbol img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    }
    /* 회전 중 흐림 효과 */
    .reel-strip.spinning .symbol img { filter: blur(2px); }


    /* Controls */
    .controls { width: 100%; max-width: 600px; text-align: center; }
    
    .spin-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      background: linear-gradient(180deg, #FACC15 0%, #EAB308 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 
        0 6px 0 #854D0E,
        0 15px 25px rgba(0,0,0,0.6);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .spin-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #854D0E, 0 5px 10px rgba(0,0,0,0.4);
    }
    .spin-btn:disabled {
      background: #334155; color: #64748B; box-shadow: none; transform: translateY(6px); cursor: not-allowed;
      filter: grayscale(0.5);
    }

    .hint { margin-top: 12px; font-size: 11px; color: #64748B; letter-spacing: 1px; }

    /* ================= MOBILE OPTIMIZATION ================= */
    @media (max-width: 900px) {
      body { height: auto; overflow-y: auto; display: block; }
      .wrap { height: auto; padding: 10px; max-height: none; }
      .card { height: auto; border-radius: 16px; }
      
      .layout { flex-direction: column; } /* 세로 배치 */
      
      /* 순서 변경: 게임 화면이 위로, 정보창이 아래로 */
      .slot-stage { order: 1; padding: 20px 15px; flex: none; }
      .info-panel { order: 2; border-right: none; border-top: 1px solid rgba(255,255,255,0.1); flex: none; }
      
      .top { padding: 12px 15px; }
      .title { font-size: 18px; }
      
      /* 모바일에서 슬롯 머신 크기 조절 */
      .screen-bezel { margin-bottom: 15px; }
      
      /* KPI 박스 모바일에서 강조 */
      .kpi { margin-bottom: 10px; }
      
      /* ✅ 페이테이블 모바일에서 크기 제한 (핵심) */
      .pay-wrapper { height: 150px; min-height: 150px; } /* 고정 높이 부여 */
      .pay-container { max-height: none; /* wrapper 높이 따름 */ }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title-row">
          <div class="title">UNIQUE SLOT</div>
          <a class="back-main" id="backMainBtn" href="../the-unique-main.html">← OUT</a>
        </div>

        <div class="status-wrap">
          <div class="status-pill">
            <span id="apiDot" class="dot"></span>
            <span id="apiText" style="display:none">Ready</span>
          </div>
          <div class="status-pill" id="soundBtn" onclick="toggleSound()">
            <span class="s-dot" id="soundDot"></span>
            <span id="soundText" style="display:none">ON</span>
            <span id="soundIcon">🔊</span>
          </div>
        </div>
      </div>

      <div class="layout">
        
        <div class="panel info-panel">
          
          <div class="kpi">
            <div class="kpi-box">
              <span class="kpi-label">BET</span>
              <span class="kpi-val" id="betVal">10</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">WIN</span>
              <span class="kpi-val gold" id="winVal">0</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">JACKPOT</span>
              <span class="kpi-val" id="jpVal">0</span>
            </div>
          </div>

          <div class="player-box" id="playerBox">
            <div class="player-line">
              <span class="player-tag">PLAYER</span>
              <span class="player-val" id="playerName">Guest</span>
            </div>
            <div class="player-line">
              <span class="player-tag">ASSET</span>
              <span class="player-ut" id="playerUt">0.00</span>
            </div>
          </div>
          
          <div class="log-box" id="log">Press SPIN to start.</div>

          <div class="pay-wrapper">
            <div class="pay-head">
              <span>SYMBOL</span>
              <span>PAYOUT (MATCH 3)</span>
            </div>
            <div class="pay-container" id="payGrid">
              </div>
          </div>
        </div>

        <div class="panel slot-stage">
          <div class="screen-bezel">
            <div class="payline-highlight" id="paylineHighlight"></div>
            <div class="reels" id="reels">
              <div class="reel-col"><div class="reel-strip" id="reel1"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel2"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel3"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel4"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel5"></div></div>
            </div>
          </div>

          <div class="controls">
            <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
            <div class="hint" id="hintText">Match 3 symbols on the center line!</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <audio id="audioSpin" src="slot/spin.mp3" preload="auto"></audio>
  <audio id="audioWin" src="slot/win.mp3" preload="auto"></audio>

  <script>
    // ================= CONFIG & DATA =================
    const CONFIG = {
      bet: 10,
      symbols: [
        { id: 1, name: "Grand Star", img: "../img/star1.png", payout: 500 },
        { id: 2, name: "Gold Shield", img: "../img/shield-gold.png", payout: 200 },
        { id: 3, name: "Silver Shield", img: "../img/shield-silver.png", payout: 100 },
        { id: 4, name: "Bronze Shield", img: "../img/shield-bronze.png", payout: 50 },
        { id: 5, name: "Blue Badge", img: "../img/badge-blue.png", payout: 20 },
        { id: 6, name: "Red Badge", img: "../img/badge-red.png", payout: 10 },
        { id: 7, name: "Green Badge", img: "../img/badge-green.png", payout: 5 }
      ],
      reelDelay: 300, // 각 릴 멈추는 간격 (ms)
      spinDuration: 1500 // 기본 회전 시간 (ms)
    };

    let gameState = {
      ut: 202.00,
      jackpot: 285,
      win: 0,
      isSpinning: false,
      soundOn: true
    };

    // DOM Elements
    const els = {
      ut: document.getElementById('playerUt'),
      bet: document.getElementById('betVal'),
      win: document.getElementById('winVal'),
      jp: document.getElementById('jpVal'),
      log: document.getElementById('log'),
      payGrid: document.getElementById('payGrid'),
      spinBtn: document.getElementById('spinBtn'),
      payline: document.getElementById('paylineHighlight'),
      soundDot: document.getElementById('soundDot'),
      soundIcon: document.getElementById('soundIcon'),
      reels: [
        document.getElementById('reel1'),
        document.getElementById('reel2'),
        document.getElementById('reel3'),
        document.getElementById('reel4'),
        document.getElementById('reel5')
      ]
    };

    const audio = {
      spin: document.getElementById('audioSpin'),
      win: document.getElementById('audioWin')
    };

    // ================= INIT =================
    function init() {
      updateUI();
      renderPayTable();
      // 초기 릴 채우기 (랜덤)
      els.reels.forEach(reel => {
        const initialSymbols = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
        renderReel(reel, initialSymbols);
      });
      log("Welcome! Press SPIN to start.");
    }

    // ================= ACTION: SPIN =================
    async function spin() {
      if (gameState.isSpinning || gameState.ut < CONFIG.bet) return;

      // 1. 상태 업데이트 및 UI 반영
      gameState.isSpinning = true;
      gameState.win = 0;
      gameState.ut -= CONFIG.bet;
      gameState.jackpot += CONFIG.bet * 0.1; // 잭팟 조금 증가
      updateUI();
      els.spinBtn.disabled = true;
      els.payline.classList.remove('active');
      log("Spinning...");

      // 2. 사운드 재생 & 애니메이션 시작
      playSound(audio.spin, true); // 반복 재생
      startAnimation();

      try {
        // 3. API 호출 (결과 요청) - 실제 서버 통신 부분
        // const result = await fakeApiCall(); // 실제로는 fetch() 사용
        const result = generateRandomResult(); // 테스트용 랜덤 결과 생성

        // 4. 결과 수신 후 릴 멈추기 (순차적)
        await stopAnimation(result.grid);

        // 5. 결과 처리 (승리/패배)
        handleResult(result);

      } catch (error) {
        log("Error: " + error.message);
        stopSound(audio.spin);
        els.reels.forEach(reel => reel.classList.remove('spinning')); // 강제 정지
      } finally {
        // 6. 상태 복구
        gameState.isSpinning = false;
        els.spinBtn.disabled = false;
      }
    }

    // ================= LOGIC: ANIMATION =================
    function startAnimation() {
      els.reels.forEach(reel => {
        // 애니메이션용 긴 스트립 생성 (심볼 반복)
        const animationSymbols = [];
        for (let i = 0; i < 10; i++) animationSymbols.push(getRandomSymbol());
        renderReel(reel, animationSymbols, true); // true: 애니메이션 모드
        
        // CSS 애니메이션 클래스 추가
        reel.classList.add('spinning');
      });
    }

    async function stopAnimation(resultGrid) {
      const baseDuration = CONFIG.spinDuration;
      const delay = CONFIG.reelDelay;

      // 각 릴을 순서대로 멈춤
      for (let i = 0; i < 5; i++) {
        await sleep(baseDuration + (i * delay)); // 딜레이 대기
        
        const reel = els.reels[i];
        const targetSymbols = [resultGrid[0][i], resultGrid[1][i], resultGrid[2][i]]; // 해당 릴의 결과 심볼 3개

        // 애니메이션 중지 및 결과 심볼로 교체
        reel.classList.remove('spinning');
        renderReel(reel, targetSymbols);
        
        // 쿵! 하는 효과음 (선택 사항)
        // if (gameState.soundOn) new Audio('slot/stop.mp3').play();
      }
      stopSound(audio.spin); // 스핀 사운드 정지
    }

    // 릴에 심볼 이미지 렌더링
    function renderReel(reelContainer, symbols, isAnimating = false) {
      reelContainer.innerHTML = '';
      symbols.forEach(symbol => {
        const el = document.createElement('div');
        el.className = 'symbol';
        el.innerHTML = `<img src="${symbol.img}" alt="${symbol.name}">`;
        reelContainer.appendChild(el);
      });

      // 위치 조정 (애니메이션 아닐 때는 정확히 가운데 정렬)
      if (!isAnimating) {
        // 3개의 심볼이 정확히 보이도록 위치 설정 (전체 높이의 -1/3 지점부터 시작)
        reelContainer.style.transform = `translateY(0)`; 
        // 실제로는 CSS에서 .symbol 높이를 33.33%로 잡았으므로 
        // 3개만 넣으면 딱 맞게 들어감. (스트립 방식이라 조정 불필요)
      }
    }

    // ================= LOGIC: RESULT =================
    function handleResult(result) {
        gameState.win = result.winAmount;
        gameState.ut += result.winAmount;
        
        if (result.winAmount > 0) {
            log(`🎉 WIN! +${result.winAmount.toFixed(2)} UT`);
            playSound(audio.win);
            els.payline.classList.add('active'); // 페이라인 강조
        } else {
            log("Try again!");
        }
        updateUI();
    }

    // (테스트용) 랜덤 결과 생성기
    function generateRandomResult() {
        const grid = [[], [], []];
        for(let i=0; i<5; i++) {
            grid[0].push(getRandomSymbol());
            grid[1].push(getRandomSymbol());
            grid[2].push(getRandomSymbol());
        }
        
        // 가운데 라인 승리 판별 (간단한 로직)
        const centerLine = grid[1];
        let winAmount = 0;
        const first = centerLine[0];
        let matchCount = 0;
        for(const sym of centerLine) {
            if(sym.id === first.id) matchCount++;
        }
        
        if (matchCount >= 3) { // 3개 이상 일치 시 승리 (테스트)
            winAmount = first.payout * (matchCount - 2); // 간단한 계산
        }

        return { grid, winAmount };
    }


    // ================= UI & UTIL =================
    function updateUI() {
      els.ut.textContent = gameState.ut.toFixed(2);
      els.bet.textContent = CONFIG.bet;
      els.win.textContent = gameState.win.toFixed(2);
      els.jp.textContent = gameState.jackpot.toFixed(0);
      
      if (gameState.win > 0) els.win.classList.add('gold');
      else els.win.classList.remove('gold');
    }

    function log(msg) {
      els.log.textContent = msg;
    }

    function renderPayTable() {
      els.payGrid.innerHTML = '';
      CONFIG.symbols.forEach(sym => {
        const item = document.createElement('div');
        item.className = 'pay-item';
        item.innerHTML = `
          <div style="display:flex;align-items:center;gap:5px;">
            <img src="${sym.img}" class="pay-img">
            <span>${sym.name}</span>
          </div>
          <span style="color:#FACC15;font-weight:700;">${sym.payout}</span>
        `;
        els.payGrid.appendChild(item);
      });
    }

    function toggleSound() {
      gameState.soundOn = !gameState.soundOn;
      els.soundDot.classList.toggle('off', !gameState.soundOn);
      els.soundIcon.textContent = gameState.soundOn ? '🔊' : '🔇';
      if (!gameState.soundOn) {
        stopSound(audio.spin);
        stopSound(audio.win);
      }
      log(`Sound: ${gameState.soundOn ? 'ON' : 'OFF'}`);
    }

    function playSound(audioEl, loop = false) {
      if (!gameState.soundOn) return;
      audioEl.currentTime = 0;
      audioEl.loop = loop;
      audioEl.play().catch(() => {}); // 자동재생 차단 방지
    }

    function stopSound(audioEl) {
      audioEl.pause();
      audioEl.currentTime = 0;
    }

    function getRandomSymbol() {
      return CONFIG.symbols[Math.floor(Math.random() * CONFIG.symbols.length)];
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Start
    init();

  </script>
</body>
</html>
