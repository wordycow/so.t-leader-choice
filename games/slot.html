<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>THE UNIQUE SLOT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ================= RESET & BASIC ================= */
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 30%, #1a1f35 0%, #000000 70%);
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      height: 100vh;
      overflow: hidden; /* 스크롤 방지 (게임 몰입감) */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================= LAYOUT WRAPPER ================= */
    .wrap {
      width: 100%;
      max-width: 1200px;
      height: 95vh;
      max-height: 800px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 36, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 10px rgba(78, 205, 196, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ================= HEADER ================= */
    .top {
      flex: 0 0 auto;
      padding: 15px 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
    }
    .title-row { display: flex; align-items: center; gap: 15px; }
    .title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      color: #FACC15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
      letter-spacing: 1px;
    }
    .back-main {
      font-size: 12px;
      color: #94A3B8;
      text-decoration: none;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      transition: 0.2s;
    }
    .back-main:hover { color: #fff; border-color: #fff; }

    .status-wrap { display: flex; gap: 10px; }
    .status-pill {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .dot, .s-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 5px #4ADE80; }
    
    /* ================= MAIN CONTENT ================= */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden; /* 내부 스크롤 제어 */
    }

    /* --- LEFT: INFO PANEL --- */
    .panel { padding: 20px; overflow-y: auto; }
    
    .info-panel {
      flex: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(0,0,0,0.2);
    }
    
    /* Player Info */
    .player-box {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .player-line:last-child { margin-bottom: 0; }
    .player-tag { font-size: 11px; color: #64748B; font-weight: 700; }
    .player-val { font-size: 14px; color: #fff; font-weight: 600; }
    .player-ut { font-size: 16px; color: #FACC15; font-weight: 700; text-shadow: 0 0 8px rgba(250,204,21,0.4); }

    /* KPI Stats */
    .kpi { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .kpi-box {
      background: #0f172a;
      padding: 8px 5px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .kpi-label { display: block; font-size: 10px; color: #94A3B8; margin-bottom: 2px; }
    .kpi-val { font-size: 15px; font-weight: 700; color: #E2E8F0; }
    .kpi-val.gold { color: #FACC15; }

    /* Log Box */
    .log-box {
      font-family: monospace;
      font-size: 11px;
      color: #38BDF8;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      border-radius: 6px;
      min-height: 32px;
      display: flex; align-items: center;
      border-left: 3px solid #38BDF8;
    }

    /* Pay Grid (Table) */
    .pay-head {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #64748B; padding: 0 4px; margin-bottom: 4px; font-weight: 700;
    }
    .pay-container {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2열 배치 */
      gap: 6px;
      align-content: start;
    }
    /* 스크롤바 커스텀 */
    .pay-container::-webkit-scrollbar { width: 4px; }
    .pay-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* --- RIGHT: GAME STAGE --- */
    .slot-stage {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 30px;
    }

    /* Bezel (Machine Border) */
    .screen-bezel {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 5 / 3; /* 슬롯 비율 고정 */
      background: #000;
      border-radius: 16px;
      border: 2px solid #334155;
      box-shadow: 
        0 0 0 4px #0f172a, 
        0 0 20px rgba(56, 189, 248, 0.3),
        inset 0 0 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .payline-highlight {
      position: absolute;
      top: 33.33%; height: 33.33%; width: 100%;
      background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.1), transparent);
      border-top: 1px solid rgba(250, 204, 21, 0.5);
      border-bottom: 1px solid rgba(250, 204, 21, 0.5);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
    }

    /* Reels Grid */
    .reels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 100%;
      width: 100%;
    }
    /* Reel Individual (JS에서 생성됨) */
    .reel-col {
      border-right: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      position: relative;
    }
    .reel-col:last-child { border-right: none; }
    
    /* Symbol Image */
    .symbol {
      width: 100%;
      height: 33.33%; /* 3칸이 보이도록 */
      display: flex; 
      align-items: center; justify-content: center;
      padding: 8px; /* 이미지 패딩 */
    }
    .symbol img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    }

    /* Controls */
    .controls { width: 100%; max-width: 600px; text-align: center; }
    
    .spin-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      background: linear-gradient(180deg, #FACC15 0%, #EAB308 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 
        0 6px 0 #854D0E,
        0 15px 25px rgba(0,0,0,0.6);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .spin-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #854D0E, 0 5px 10px rgba(0,0,0,0.4);
    }
    .spin-btn:disabled {
      background: #334155; color: #64748B; box-shadow: none; transform: translateY(6px); cursor: not-allowed;
    }

    .hint { margin-top: 12px; font-size: 11px; color: #64748B; letter-spacing: 1px; }

    /* ================= MOBILE OPTIMIZATION ================= */
    @media (max-width: 900px) {
      body { height: auto; overflow-y: auto; display: block; }
      .wrap { height: auto; padding: 10px; max-height: none; }
      .card { height: auto; border-radius: 16px; }
      
      .layout { flex-direction: column; } /* 세로 배치 */
      
      /* 순서 변경: 게임 화면이 위로, 정보창이 아래로 */
      .slot-stage { order: 1; padding: 20px 15px; flex: none; }
      .info-panel { order: 2; border-right: none; border-top: 1px solid rgba(255,255,255,0.1); flex: none; }
      
      .top { padding: 12px 15px; }
      .title { font-size: 18px; }
      
      /* 모바일에서 슬롯 머신 크기 조절 */
      .screen-bezel { margin-bottom: 15px; }
      
      /* KPI 박스 모바일에서 강조 */
      .kpi { margin-bottom: 10px; }
      
      /* 페이테이블은 모바일에서 작게 */
      .pay-container { max-height: 200px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title-row">
          <div class="title">UNIQUE SLOT</div>
          <a class="back-main" id="backMainBtn" href="../the-unique-main.html">← OUT</a>
        </div>

        <div class="status-wrap">
          <div class="status-pill">
            <span id="apiDot" class="dot"></span>
            <span id="apiText" style="display:none">Ready</span> </div>
          <div class="status-pill" id="soundBtn">
            <span class="s-dot"></span>
            <span id="soundText" style="display:none">ON</span> 🔊
          </div>
        </div>
      </div>

      <div class="layout">
        
        <div class="panel info-panel">
          
          <div class="kpi">
            <div class="kpi-box">
              <span class="kpi-label">BET</span>
              <span class="kpi-val" id="betVal">10</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">WIN</span>
              <span class="kpi-val gold" id="winVal">0</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">JACKPOT</span>
              <span class="kpi-val" id="jpVal">0</span>
            </div>
          </div>

          <div class="player-box" id="playerBox">
            <div class="player-line">
              <span class="player-tag">PLAYER</span>
              <span class="player-val" id="playerName">Guest</span>
            </div>
            <div class="player-line">
              <span class="player-tag">ASSET</span>
              <span class="player-ut" id="playerUt">0.00</span>
            </div>
          </div>
          
          <div class="log-box" id="log">Press SPIN to start.</div>

          <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
            <div class="pay-head">
              <span>SYMBOL</span>
              <span>PAYOUT</span>
            </div>
            <div class="pay-container" id="payGrid">
              </div>
          </div>
        </div>

        <div class="panel slot-stage">
          <div class="screen-bezel">
            <div class="payline-highlight"></div>
            <div class="reels" id="reels">
              </div>
          </div>

          <div class="controls">
            <button class="spin-btn" id="spinBtn">SPIN</button>
            <div class="hint" id="hintText">Match 3 symbols on the center line!</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script defer src="slot/slot.config.js"></script>
  <script defer src="slot/slot.audio.js"></script>
  <script defer src="slot/slot.ui.js"></script>
  <script defer src="slot/slot.api.js"></script>
  <script defer src="slot/slot.game.js"></script>
  <script defer src="slot/slot.app.js"></script>
</body>
</html>
