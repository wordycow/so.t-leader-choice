<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link rel="stylesheet" href="./slot/slot.css?v=CYBER_GOLD_V1">
</head>
<body>

    <div id="game-bg"></div>
    <div class="cyber-grid"></div> <div id="start-overlay">
        <div class="neon-panel blink-panel">
            <h1 class="cyber-text">CYBER SLOTS</h1>
            <p class="blink gold-text">TOUCH TO START</p>
        </div>
    </div>

    <div id="game-container">
        <div class="top-section">
            <div class="jackpot-display">
                <span class="jackpot-label">MEGA JACKPOT</span>
                <span class="jackpot-amount gold-neon" id="jackpot-pool">LOADING...</span>
            </div>
            <div class="top-bar">
                <div class="info-box player-info">ID: <span id="user-id">...</span></div>
                <button id="btn-sound" class="sound-btn neon-btn-small">🔊</button>
                <div class="info-box wallet-info">WALLET: <span id="wallet-balance" class="gold-neon">0</span> <span class="unit">UT</span></div>
            </div>
        </div>

        <div class="slot-machine-frame">
            <div class="frame-neon-border"></div>
            <div class="slot-window">
                <div class="reels-container" id="reels-container"></div>
                <div class="cylinder-overlay"></div>
                <div class="win-line"></div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="win-info-panel">
                <div class="win-label" id="win-label">READY</div>
                <div class="win-amount gold-neon" id="win-amount">GOOD LUCK!</div>
            </div>

            <div class="control-panel">
                <div class="bet-control">
                    <button id="btn-bet-minus" class="bet-btn neon-btn-small">-</button>
                    <div class="bet-display">
                        <span class="bet-label">BET</span>
                        <span id="current-bet" class="gold-text">10</span>
                    </div>
                    <button id="btn-bet-plus" class="bet-btn neon-btn-small">+</button>
                </div>
                
                <div class="spin-control">
                    <button id="btn-auto" class="auto-btn neon-btn-medium">AUTO<br>OFF</button>
                    <button id="btn-spin" class="spin-btn neon-btn-large">SPIN</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./slot/slot.game.js?v=CYBER_GOLD_V1"></script>
</body>
</html>
