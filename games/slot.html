<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link rel="stylesheet" href="./slot/slot.css?v=CYLINDER_V2">
</head>
<body>

    <div id="game-bg"></div>

    <div id="start-overlay">
        <div class="glass-panel">
            <h1>THE UNIQUE</h1>
            <p class="blink">TOUCH TO START</p>
        </div>
    </div>

    <div id="game-container">
        
        <div class="ticker-wrap">
            <div class="ticker">
                <span class="ticker-item">★ JACKPOT POOL: LOADING... ★ [NOTICE] 5연속 MEGA WIN 25배 지급! ★ THE UNIQUE SLOT OPEN ★</span>
            </div>
        </div>

        <div class="top-bar">
            <div class="info-box player-info">ID: <span id="user-id">GUEST</span></div>
            <div class="info-box wallet-info">WALLET: <span id="wallet-balance">0</span> <span class="unit">UT</span></div>
        </div>

        <div class="slot-machine-frame-outer">
            <div class="machine-decoration top"></div>
            
            <div class="slot-machine-frame-inner">
                <div class="reels-container" id="reels-container">
                    </div>

                <div class="cylinder-overlay"></div>
                
                <div class="win-line"></div>
            </div>

            <div class="machine-decoration bottom"></div>
        </div>

        <div class="win-info-panel">
            <div class="win-label" id="win-label">READY</div>
            <div class="win-amount" id="win-amount">GOOD LUCK!</div>
        </div>

        <div class="control-panel">
            <div class="bet-control-group">
                <button id="btn-bet-minus" class="bet-btn neon-btn">-</button>
                <div class="bet-display">
                    <span class="bet-label">BET</span>
                    <span id="current-bet">10</span>
                </div>
                <button id="btn-bet-plus" class="bet-btn neon-btn">+</button>
            </div>
            
            <div class="spin-control-group">
                <button id="btn-spin" class="spin-btn neon-spin-btn">SPIN</button>
            </div>
        </div>
    </div>

    <script src="./slot/slot.game.js?v=CYLINDER_V2"></script>
</body>
</html>
