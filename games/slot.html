<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE UNIQUE SLOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffcc00;
      --gold-glow: #ffaa00;
      --neon-blue: #00f7ff;
      --glass-black: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background-color: #050505;
      color: white; font-family: 'Rajdhani', sans-serif;
      overflow: hidden; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }

    #game-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; z-index: -2;
      filter: brightness(0.4);
    }

    #game-container {
      width: 100%; max-width: 600px; height: 100%;
      max-height: 100vh;
      display: flex; flex-direction: column;
      padding: 10px;
    }

    .top-section {
      flex: 0 0 auto;
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px;
    }

    .header-panel {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.05); border-bottom: 1px solid #333;
      padding: 5px 10px; border-radius: 10px;
    }
    .brand-name { font-size: 1rem; color: #888; letter-spacing: 1px; margin: 0; }
    .user-id { font-size: 1rem; color: var(--neon-blue); font-weight: bold; }

    .wallet-panel {
      background: linear-gradient(180deg, rgba(20,20,20,0.9), rgba(0,0,0,0.9));
      border: 2px solid var(--gold); border-radius: 12px;
      padding: 10px; text-align: center;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.15);
    }

    /* ✅ JP를 크게(지갑 위) */
    .jp-label { font-size: 0.75rem; color: #aaa; letter-spacing: 3px; margin: 0; }
    .jp-amount {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow), 0 0 18px rgba(255,170,0,0.35);
      margin: 2px 0 8px 0;
      line-height: 1;
    }

    .wallet-label { font-size: 0.75rem; color: #aaa; letter-spacing: 3px; margin: 0; }
    .wallet-amount {
      font-size: 2.6rem;
      font-weight: 900; color: #fff;
      text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold-glow);
      line-height: 1; margin: 6px 0 0 0;
    }

    .unit { font-size: 1rem; color: var(--gold); vertical-align: middle; margin-left: 4px; }

    .machine-frame {
      flex: 1 1 auto;
      position: relative;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--neon-blue); border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.2);
      min-height: 200px;
    }

    /* ✅ Canvas 슬롯 */
    #slot-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 유리 느낌 오버레이 */
    .glass-vignette {
      position:absolute; inset:0;
      pointer-events:none;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.82) 0%,
        rgba(0,0,0,0.05) 22%,
        rgba(0,0,0,0.05) 78%,
        rgba(0,0,0,0.82) 100%
      );
      z-index: 5;
    }

    .win-line {
      position: absolute; top: 50%; left: 0; width: 100%; height: 4px;
      background: rgba(255, 0, 0, 0.5); z-index: 20;
      transform: translateY(-50%); display: none;
    }

    .bottom-section {
      flex: 0 0 auto;
      margin-top: 10px;
    }

    .msg-panel {
      text-align: center; background: rgba(0,0,0,0.8);
      border: 1px solid #444; border-radius: 8px;
      padding: 8px; margin-bottom: 8px;
      display: flex; flex-direction: column; justify-content: center;
      height: 40px;
    }
    .msg-text { font-size: 1.2rem; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .msg-text.win { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

    .control-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #111; padding: 10px; border-radius: 15px;
      border-top: 2px solid var(--neon-blue);
    }

    .btn-rect {
      background: #222; border: 1px solid #555; color: #ccc;
      font-family: 'Rajdhani', sans-serif; font-weight: bold;
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-rect:active { transform: scale(0.95); background: #333; }

    .btn-sound, .btn-auto { width: 50px; height: 50px; font-size: 0.7rem; flex-direction: column; }
    .btn-sound.active { color: var(--neon-blue); border-color: var(--neon-blue); background: rgba(0,247,255,0.1); }
    .btn-auto.active  { color: var(--gold); border-color: var(--gold); background: rgba(255,204,0,0.1); }

    .bet-group { display: flex; align-items: center; gap: 5px; }
    .btn-bet { width: 40px; height: 40px; font-size: 1.2rem; }
    .bet-display {
      background: #000; border: 1px solid #444; width: 60px; height: 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 5px;
    }
    .bet-lbl { font-size: 0.6rem; color: #666; }
    .bet-val { font-size: 1rem; font-weight: bold; color: #fff; }

    .btn-spin {
      width: 75px; height: 75px; border-radius: 50%;
      background: radial-gradient(circle, #ffd700, #ff8800);
      border: 3px solid #fff; color: #000;
      font-size: 1.3rem; font-weight: 900;
      box-shadow: 0 0 15px var(--gold); cursor: pointer;
    }
    .btn-spin:active { transform: scale(0.95); }
    .btn-spin:disabled { filter: grayscale(1); opacity: 0.5; }

    #start-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 9000;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
    }

    #jackpot-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 10000;
      display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    #jackpot-overlay.show { display: flex; animation: fadeIn 0.5s; }
    .jp-title { font-size: 3rem; color: var(--gold); animation: pulse 0.5s infinite; }
    .jp-win-amount { font-size: 4rem; color: #fff; text-shadow: 0 0 20px var(--neon-blue); }

    .coin { position: absolute; width: 30px; height: 30px; background: gold; border-radius: 50%; animation: fall linear infinite; z-index: -1; }
    @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 50% { transform: scale(1.1); } }

    @media (max-width: 400px) {
      .wallet-amount { font-size: 2.2rem; }
      .jp-amount { font-size: 1.5rem; }
      .btn-spin { width: 65px; height: 65px; font-size: 1.1rem; }
      .btn-sound, .btn-auto { width: 45px; height: 45px; }
      .bet-group { gap: 2px; }
      .btn-bet { width: 35px; height: 35px; }
    }
  </style>
</head>
<body>

  <div id="game-bg"></div>

  <div id="jackpot-overlay">
    <h1 class="jp-title">★ JACKPOT ★</h1>
    <div class="jp-win-amount" id="jp-ani-amount">0</div>
    <div id="coin-container"></div>
  </div>

  <div id="start-overlay">
    <h1 style="color:white; font-size: 2rem;">THE UNIQUE</h1>
    <div style="color:var(--gold); margin-top:20px; animation:pulse 1s infinite;">TOUCH TO START</div>
  </div>

  <div id="game-container">
    <div class="top-section">
      <div class="header-panel">
        <h2 class="brand-name">THE UNIQUE SLOT</h2>
        <div class="user-id" id="user-id">GUEST</div>
      </div>

      <div class="wallet-panel">
        <div class="jp-label">JACKPOT POOL</div>
        <div class="jp-amount"><span id="jackpot-pool">...</span><span class="unit">UT</span></div>

        <div class="wallet-label">YOUR WALLET</div>
        <div class="wallet-amount"><span id="wallet-balance">0</span><span class="unit">UT</span></div>
      </div>
    </div>

    <div class="machine-frame" id="machine-frame">
      <canvas id="slot-canvas"></canvas>
      <div class="glass-vignette"></div>
      <div class="win-line"></div>
    </div>

    <div class="bottom-section">
      <div class="msg-panel">
        <div class="msg-text" id="status-msg">READY</div>
      </div>

      <div class="control-bar">
        <button id="btn-sound" class="btn-rect btn-sound">SOUND<br>OFF</button>
        <button id="btn-auto" class="btn-rect btn-auto">AUTO<br>OFF</button>

        <div class="bet-group">
          <button id="btn-bet-minus" class="btn-rect btn-bet">-</button>
          <div class="bet-display">
            <span class="bet-lbl">BET</span>
            <span class="bet-val" id="current-bet">10</span>
          </div>
          <button id="btn-bet-plus" class="btn-rect btn-bet">+</button>
        </div>

        <button id="btn-spin" class="btn-spin">SPIN</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
      imgObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/',
        bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
        symbols: [
          'star1.png','star2.png','star3.png',
          'pro1.png','pro2.png','pro3.png','pro4.png','pro5.png','pro6.png','pro7.png',
          'pro8.png','pro9.png','pro10.png'
        ]
      },
      soundObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
        spin: 'spinning-sound.MP3',
        stop: 'stop-stop-stop-sound.MP3',
        win: 'win-sound.MP3',
        lose: 'lose-sound.MP3',
        jackpot: 'jackpot-sound.MP3',
        btn: 'start-button-sound.MP3'
      },
      reels: 5,
      rows: 3
    };

    // ✅ 유송이 원하는 심볼 매핑 (서버가 A/J/Q/K/숫자를 보내도 이미지로 변환)
    const SYMBOL_ALIAS = {
      "1": "star1", "A": "star1",
      "2": "star2",
      "3": "star3",
      "4": "pro1",
      "5": "pro2",
      "6": "pro3",
      "7": "pro4",
      "8": "pro5",
      "9": "pro6",
      "10": "pro7",
      "11": "pro8", "J": "pro8",
      "12": "pro9", "Q": "pro9",
      "13": "pro10", "K": "pro10"
    };

    let state = {
      id: null,
      wallet: 0,
      bet: 10,
      isSpinning: false,
      audioEnabled: false,
      isAuto: false,
      jackpotPool: 0,
      bgIntervalId: null,
      bgIdx: 0,
      bgSpeed: 200
    };

    let els = {};
    const audios = {};

    // =========================
    // Canvas Reel Engine
    // =========================
    const SlotCanvas = (() => {
      const buffer = 3; // 위/아래 여유 심볼 수
      let canvas, ctx;
      let dpr = 1;
      let cw = 0, ch = 0;
      let reelW = 0, sym = 0, xPad = 0, yPad = 0;
      let reels = [];
      let raf = null;
      let last = 0;
      let running = false;

      let onAllStopped = null;
      let onReelDecelStart = null;
      let onReelStopped = null;

      const baseNames = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function easeOutBack(t){
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      function keyToBaseName(key){
        if (key == null) return randBase();
        const s = String(key).trim();
        if (SYMBOL_ALIAS[s]) return SYMBOL_ALIAS[s];
        // 서버가 이미 star1/pro3 같은 이름을 주는 경우
        if (baseNames.includes(s)) return s;
        // 혹시 star1.png 같이 오는 경우
        if (s.endsWith(".png")) return s.replace(".png","");
        return randBase();
      }

      function randBase(){
        return baseNames[(Math.random() * baseNames.length) | 0];
      }

      function makeReel(i){
        return {
          i,
          symbols: [],
          offset: 0,
          speed: 0,
          mode: "idle",   // idle | wait | spin | decel | snap | stopped
          startAt: 0,
          stopAt: 0,
          final: null,
          decelStart: 0,
          decelDur: 650,
          speedStart: 0,
          speedEnd: 120,
          snapStart: 0,
          snapDur: 380,
          snapFrom: 0
        };
      }

      function fillReel(r){
        // rows + buffer*2 + 여유 몇 개
        const need = CONFIG.rows + buffer * 2 + 6;
        r.symbols = [];
        for (let k=0;k<need;k++) r.symbols.push(randBase());
        r.offset = Math.random() * (sym || 1);
      }

      function resize(){
        if (!canvas) return;
        // devicePixelRatio 적용 (선명하게)
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

        const rect = canvas.getBoundingClientRect();
        const newW = Math.max(1, Math.floor(rect.width * dpr));
        const newH = Math.max(1, Math.floor(rect.height * dpr));

        if (newW === cw && newH === ch) return;

        // offset 스케일 유지
        const oldSym = sym || 1;

        cw = newW; ch = newH;
        canvas.width = cw;
        canvas.height = ch;

        reelW = cw / CONFIG.reels;

        // ✅ 심볼은 "정사각" + 3줄이 화면에 들어가게
        sym = Math.floor(Math.min(reelW, ch / CONFIG.rows));
        sym = Math.max(48, sym);

        xPad = Math.floor((reelW - sym) / 2);
        yPad = Math.floor((ch - sym * CONFIG.rows) / 2);

        // 기존 offset 비율 유지
        reels.forEach(r => {
          r.offset = (r.offset / oldSym) * sym;
        });
      }

      function init(c, hooks={}){
        canvas = c;
        ctx = canvas.getContext("2d", { alpha: true });

        reels = [];
        for (let i=0;i<CONFIG.reels;i++) reels.push(makeReel(i));

        resize();
        reels.forEach(fillReel);

        onReelDecelStart = hooks.onReelDecelStart || null;
        onReelStopped = hooks.onReelStopped || null;
      }

      function start(){
        if (running) return;
        running = true;
        last = performance.now();
        raf = requestAnimationFrame(loop);
      }

      function stop(){
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = null;
      }

      function startSpin(){
        const now = performance.now();
        reels.forEach((r, i) => {
          r.mode = "wait";
          r.startAt = now + i * 80; // 살짝 시차
          r.stopAt = 0;
          r.final = null;
          r.speed = 0;
          r.offset = Math.random() * sym;
        });
        start();
      }

      function scheduleStop(keys, doneCb){
        // keys: row-major (0~4 top row, 5~9 mid row, 10~14 bottom row)
        const now = performance.now();
        onAllStopped = doneCb || null;

        for (let col=0; col<CONFIG.reels; col++){
          const top = keyToBaseName(keys[col]);
          const mid = keyToBaseName(keys[col + CONFIG.reels]);
          const bot = keyToBaseName(keys[col + CONFIG.reels * 2]);

          reels[col].final = [top, mid, bot];
          reels[col].stopAt = now + 900 + col * 520; // ✅ 순차 정지 타이밍
        }
      }

      function abortToIdle(){
        reels.forEach(r => {
          r.mode = "idle";
          r.speed = 0;
          r.final = null;
        });
      }

      function update(dt, now){
        // dt: seconds
        for (const r of reels){
          if (r.mode === "wait"){
            if (now >= r.startAt){
              r.mode = "spin";
              r.speed = 900 + r.i * 120;
            }
          }

          if (r.mode === "spin"){
            // 스핀 중: 계속 랜덤으로 순환(진짜 위→아래로 흐름)
            const accel = 3200; // px/s^2
            const max = 2400 + r.i * 60;
            r.speed = Math.min(max, r.speed + accel * dt);

            // stopAt 도달하면 감속 시작
            if (r.stopAt && now >= r.stopAt){
              r.mode = "decel";
              r.decelStart = now;
              r.speedStart = r.speed;
              r.speedEnd = 140;

              if (typeof onReelDecelStart === "function") onReelDecelStart(r.i);
            }
          }

          if (r.mode === "decel"){
            const p = Math.min(1, (now - r.decelStart) / r.decelDur);
            r.speed = r.speedStart + (r.speedEnd - r.speedStart) * easeOutCubic(p);

            if (p >= 1){
              // ✅ 마지막 스냅(탁!)
              // 보이는 3줄(버퍼 위치)에 최종 심볼 세팅
              if (r.final){
                r.symbols[buffer + 0] = r.final[0];
                r.symbols[buffer + 1] = r.final[1];
                r.symbols[buffer + 2] = r.final[2];
              }

              r.mode = "snap";
              r.snapStart = now;
              r.snapFrom = r.offset;
              r.speed = 0;
            }
          }

          // 실제 이동(위→아래)
          if (r.mode === "spin" || r.mode === "decel"){
            r.offset += r.speed * dt;

            while (r.offset >= sym){
              r.offset -= sym;
              // 아래로 내려가는 느낌: 위에서 새 심볼 들어오고 아래로 빠짐
              r.symbols.pop();
              r.symbols.unshift(randBase());
            }
          }

          if (r.mode === "snap"){
            const p = Math.min(1, (now - r.snapStart) / r.snapDur);
            r.offset = r.snapFrom + (0 - r.snapFrom) * easeOutBack(p);

            if (p >= 1){
              r.offset = 0;
              r.mode = "stopped";

              if (typeof onReelStopped === "function") onReelStopped(r.i);
            }
          }
        }
      }

      function draw(){
        if (!ctx) return;
        ctx.clearRect(0,0,cw,ch);

        // 배경 어둡게(캔버스 내)
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#000";
        ctx.fillRect(0,0,cw,ch);
        ctx.restore();

        // 각 릴 그리기
        for (const r of reels){
          const rx = r.i * reelW;

          // 클립(릴 칸 별로 잘라서 그리기)
          ctx.save();
          ctx.beginPath();
          ctx.rect(rx, 0, reelW, ch);
          ctx.clip();

          // 속도에 따라 살짝 블러 느낌(가벼운 필터)
          // (filter는 브라우저/기기마다 비용이 있어서 "약하게"만)
          const fast = (r.mode === "spin" && r.speed > 1600);
          ctx.filter = fast ? "blur(1.5px)" : "none";

          // 심볼들 draw
          for (let i=0;i<r.symbols.length;i++){
            const base = r.symbols[i];
            const img = SlotCanvasImages[base]; // 아래에서 채움

            const x = rx + xPad;
            const y = yPad + ((i - buffer) * sym) - r.offset;

            // 화면 밖은 스킵
            if (y < -sym*2 || y > ch + sym*2) continue;

            if (img && img.complete){
              ctx.drawImage(img, x, y, sym, sym);
            } else {
              // 이미지 로딩 전 fallback
              ctx.save();
              ctx.globalAlpha = 0.18;
              ctx.fillStyle = "#fff";
              ctx.fillRect(x, y, sym, sym);
              ctx.restore();
            }
          }

          ctx.restore();

          // 릴 구분선(네온)
          ctx.save();
          ctx.globalAlpha = 0.25;
          ctx.strokeStyle = "#00f7ff";
          ctx.lineWidth = Math.max(1, Math.floor(2 * dpr));
          ctx.strokeRect(rx + 0.5, 0.5, reelW - 1, ch - 1);
          ctx.restore();
        }
      }

      function loop(now){
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;

        update(dt, now);
        draw();

        // 모든 릴 멈췄는지 체크
        const allStopped = reels.every(r => r.mode === "stopped" || r.mode === "idle");
        if (allStopped && onAllStopped){
          const cb = onAllStopped;
          onAllStopped = null;
          cb();
        }

        raf = requestAnimationFrame(loop);
      }

      return {
        init, resize, startSpin, scheduleStop, abortToIdle, stop
      };
    })();

    // ✅ 심볼 이미지 캐시(캔버스에서 사용)
    const SlotCanvasImages = {};

    // =========================
    // App
    // =========================
    async function init() {
      els = {
        bg: document.getElementById('game-bg'),
        overlay: document.getElementById('start-overlay'),
        machineFrame: document.getElementById('machine-frame'),
        canvas: document.getElementById('slot-canvas'),

        spinBtn: document.getElementById('btn-spin'),
        autoBtn: document.getElementById('btn-auto'),
        soundBtn: document.getElementById('btn-sound'),

        walletSpan: document.getElementById('wallet-balance'),
        jackpotPool: document.getElementById('jackpot-pool'),
        betSpan: document.getElementById('current-bet'),

        statusMsg: document.getElementById('status-msg'),
        plus: document.getElementById('btn-bet-plus'),
        minus: document.getElementById('btn-bet-minus'),
        userId: document.getElementById('user-id'),

        jpOverlay: document.getElementById('jackpot-overlay'),
        jpAmount: document.getElementById('jp-ani-amount'),
        coinBox: document.getElementById('coin-container'),
      };

      // 배경 초기
      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[0]}')`;

      // 로그인 ID
      const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
      state.id = localId || new URLSearchParams(window.location.search).get('id');

      if (!state.id) {
        els.userId.innerText = "GUEST";
        els.spinBtn.disabled = true;
        setStatus("로그인 필요");
      } else {
        els.userId.innerText = state.id;
        await syncUserData();
      }

      // 오디오 로드
      Object.keys(CONFIG.soundObj).forEach(key => {
        if (key !== 'path') {
          try {
            const audio = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[key]);
            if (key === 'spin') audio.loop = true;
            audios[key] = audio;
          } catch (e) {}
        }
      });

      // ✅ 심볼 이미지 프리로드(캔버스용)
      await preloadSymbolImages();

      // ✅ Canvas 엔진 초기화 + 리사이즈 감시
      SlotCanvas.init(els.canvas, {
        onReelDecelStart: (idx) => {
          // 멈출수록 배경 느려지게
          const ms = 220 + idx * 90;
          setBgSpeed(ms);
        },
        onReelStopped: () => {
          if (state.audioEnabled && audios.stop) {
            const s = audios.stop.cloneNode();
            s.volume = 0.85;
            s.play().catch(()=>{});
          }
        }
      });

      const ro = new ResizeObserver(() => SlotCanvas.resize());
      ro.observe(els.machineFrame);
      window.addEventListener("resize", () => SlotCanvas.resize());

      // UI 이벤트
      if (els.overlay) {
        els.overlay.addEventListener('click', () => {
          els.overlay.style.display = 'none';
          toggleSound(true);
        });
      }

      els.spinBtn.addEventListener('click', () => {
        state.isAuto = false;
        updateAutoBtn();
        onSpinClick();
      });

      els.plus.addEventListener('click', () => changeBet(5));
      els.minus.addEventListener('click', () => changeBet(-5));
      els.soundBtn.addEventListener('click', () => toggleSound(!state.audioEnabled));
      els.autoBtn.addEventListener('click', toggleAuto);

      els.jpOverlay.addEventListener('click', closeJackpot);

      updateUI();
    }

    async function preloadSymbolImages(){
      const bases = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));
      const jobs = bases.map(base => new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve([base, img]);
        img.onerror = () => resolve([base, null]);
        img.src = CONFIG.imgObj.path + base + ".png";
      }));

      const result = await Promise.all(jobs);
      for (const [base, img] of result){
        if (img) SlotCanvasImages[base] = img;
      }
    }

    function toggleSound(forceState) {
      state.audioEnabled = forceState;
      els.soundBtn.innerHTML = state.audioEnabled ? "SOUND<br>ON" : "SOUND<br>OFF";
      els.soundBtn.classList.toggle("active", state.audioEnabled);

      if (!state.audioEnabled){
        // ✅ 끄면 즉시 전부 정지
        Object.values(audios).forEach(a => { try { a.pause(); } catch(e){} });
      } else {
        if (audios.btn) audios.btn.play().catch(()=>{});
      }
    }

    function toggleAuto() {
      state.isAuto = !state.isAuto;
      updateAutoBtn();
      if (state.isAuto && !state.isSpinning) onSpinClick();
    }

    function updateAutoBtn() {
      els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF";
      els.autoBtn.classList.toggle("active", state.isAuto);
    }

    function setStatus(msg, isWin = false) {
      els.statusMsg.innerText = msg;
      els.statusMsg.className = isWin ? "msg-text win" : "msg-text";
    }

    async function syncUserData(animate = false) {
      if (!state.id) return;
      try {
        const res = await jsonpRequest('getSlotState', { id: state.id });
        if (res.ok) {
          const newWallet = Number(res.user.balance);
          state.jackpotPool = Number(res.jackpotTotal);

          if (animate) animateValue(els.walletSpan, state.wallet, newWallet, 1000);
          else els.walletSpan.innerText = newWallet.toLocaleString();

          state.wallet = newWallet;
          updateUI();

          if (!animate) setStatus("READY");
          els.spinBtn.disabled = false;
        }
      } catch (e) {
        setStatus("NETWORK ERROR");
      }
    }

    // ✅ 배경 전환 (스핀 중 0.2초 -> 멈출수록 느려짐)
    function startBgEffect(ms = 200) {
      state.bgSpeed = ms;
      clearInterval(state.bgIntervalId);

      state.bgIntervalId = setInterval(() => {
        state.bgIdx = (state.bgIdx + 1) % CONFIG.imgObj.bg.length;
        els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[state.bgIdx]}')`;
      }, ms);
    }

    function setBgSpeed(ms){
      if (!state.bgIntervalId) return;
      startBgEffect(ms);
    }

    function stopBgEffect() {
      clearInterval(state.bgIntervalId);
      state.bgIntervalId = null;
      state.bgIdx = 0;
      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`;
    }

    async function onSpinClick() {
      if (state.isSpinning) return;
      if (state.wallet < state.bet) {
        state.isAuto = false;
        updateAutoBtn();
        alert("잔액 부족");
        return;
      }

      state.isSpinning = true;
      els.spinBtn.disabled = true;
      setStatus("SPINNING...");

      // 베팅 차감 애니
      animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 450);
      state.wallet -= state.bet;

      // 사운드 & 배경 & 캔버스 스핀 시작
      if (state.audioEnabled) {
        try { audios.btn && audios.btn.play().catch(()=>{}); } catch(e){}
        try {
          if (audios.spin) { audios.spin.volume = 0.65; audios.spin.currentTime = 0; audios.spin.play().catch(()=>{}); }
        } catch(e){}
      }

      startBgEffect(200);
      SlotCanvas.startSpin();

      try {
        const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
        if (!res.ok) throw new Error("Spin Failed");

        // ✅ 서버 결과(15칸)를 릴별로 순차 정지시키고, 전부 멈추면 handleSpinEnd 실행
        SlotCanvas.scheduleStop(res.spin.keys, () => handleSpinEnd(res));
      } catch (err) {
        // 실패 시 정리
        stopBgEffect();
        try { audios.spin && audios.spin.pause(); } catch(e){}
        SlotCanvas.abortToIdle();
        state.isSpinning = false;
        els.spinBtn.disabled = false;
        syncUserData();
      }
    }

    function handleSpinEnd(data) {
      state.isSpinning = false;
      stopBgEffect();

      try { audios.spin && audios.spin.pause(); } catch(e){}
      els.spinBtn.disabled = false;

      const spin = data.spin;
      let sound = audios.lose;
      let msg = "TRY AGAIN";
      let isWin = false;

      if (spin.kind !== "lose") {
        msg = `WIN! +${Number(spin.payout).toLocaleString()} UT`;
        isWin = true;

        if (spin.kind === "jackpot") {
          msg = "★ JACKPOT ★";
          sound = audios.jackpot;
          showJackpotOverlay(Number(spin.payout));
        } else {
          sound = audios.win;
        }
      }

      setStatus(msg, isWin);

      // 지갑/잭팟 동기화
      const newBal = Number(data.user.balance);
      if (state.wallet !== newBal) animateValue(els.walletSpan, state.wallet, newBal, 900);
      state.wallet = newBal;

      state.jackpotPool = Number(data.jackpotTotal);
      updateUI();

      if (isWin && state.audioEnabled && sound) {
        try { sound.currentTime = 0; sound.play().catch(()=>{}); } catch(e){}
      } else if (!isWin && state.audioEnabled && audios.lose) {
        try { audios.lose.currentTime = 0; audios.lose.play().catch(()=>{}); } catch(e){}
      }

      if (state.isAuto) {
        setTimeout(() => {
          if (state.isAuto && state.wallet >= state.bet) onSpinClick();
          else toggleAuto();
        }, 1600);
      }
    }

    function showJackpotOverlay(amount) {
      els.jpOverlay.style.display = 'flex';
      els.jpOverlay.classList.add('show');
      animateValue(els.jpAmount, 0, amount, 2500);
      createCoins();
      if (state.audioEnabled && audios.jackpot){
        try { audios.jackpot.currentTime = 0; audios.jackpot.play().catch(()=>{}); } catch(e){}
      }
    }

    function closeJackpot() {
      els.jpOverlay.style.display = 'none';
      els.jpOverlay.classList.remove('show');
      els.coinBox.innerHTML = '';
    }

    function createCoins() {
      els.coinBox.innerHTML = '';
      for (let i=0; i<50; i++) {
        const coin = document.createElement('div');
        coin.className = 'coin';
        coin.style.left = Math.random() * 100 + 'vw';
        coin.style.animationDuration = (Math.random() * 2 + 1) + 's';
        els.coinBox.appendChild(coin);
      }
    }

    function jsonpRequest(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');

        const cleanup = () => {
          try { delete window[callbackName]; } catch(e){}
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        params.action = action;
        params.callback = callbackName;
        script.src = `${CONFIG.API_URL}?${new URLSearchParams(params).toString()}`;
        script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
        document.body.appendChild(script);
      });
    }

    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerText = Math.floor(progress * (end - start) + start).toLocaleString();
        if (progress < 1) window.requestAnimationFrame(step);
        else obj.innerText = end.toLocaleString();
      };
      window.requestAnimationFrame(step);
    }

    function updateUI() {
      els.betSpan.innerText = state.bet;
      els.jackpotPool.innerText = Number(state.jackpotPool || 0).toLocaleString();
      els.walletSpan.innerText = Number(state.wallet || 0).toLocaleString();
    }

    function changeBet(delta) {
      if (state.isSpinning) return;
      const n = state.bet + delta;
      if (n >= 5 && n <= 1000) {
        state.bet = n;
        updateUI();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
