<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <style>
    /* =========================================
       THE "CYBERPUNK NEON VAULT" - FINAL FIX
       Layout: Standard 5x3 Slot
       Style: Glassmorphism + Neon
    ========================================= */

    :root {
      --neon-blue: #00f2ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --neon-gold: #ffd700;
      --bg-dark: #05050c;
      --glass: rgba(13, 17, 34, 0.75);
      --glass-border: rgba(0, 242, 255, 0.2);

      /* Slot Dimensions (PC Default) */
      --cell-w: 130px;
      --cell-h: 110px;
      --gap: 10px;
      /* Reel Height = 3 visible symbols + gaps */
      --reel-h: calc(var(--cell-h) * 3 + var(--gap) * 2);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: #e0e0ff;
      background: var(--bg-dark);
      overflow-x: hidden; /* Prevent horizontal scroll */
    }

    /* === BACKGROUND === */
    .bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(circle at 50% 10%, rgba(188, 19, 254, 0.25), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 242, 255, 0.15), transparent 50%),
        linear-gradient(180deg, #0a0a16 0%, #000 100%);
    }
    .bg::before {
      content: ""; position: absolute; inset: 0;
      background-image: var(--bgimg, none);
      background-size: cover; background-position: center;
      filter: blur(15px) brightness(0.4) saturate(1.5);
      mix-blend-mode: overlay; opacity: 0.6;
      transition: opacity .5s, filter .5s;
    }
    .bg.flash::before { opacity: 0.9; filter: blur(5px) brightness(1.2); mix-blend-mode: screen; }

    .wrap {
      max-width: 1280px; margin: 0 auto; padding: 40px 20px;
      min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    }

    /* === MAIN CARD FRAME === */
    .card {
      border-radius: 30px;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 0 0 1px rgba(0,0,0, 0.5),
        0 0 0 3px var(--neon-purple), /* Neon Border */
        0 0 40px rgba(188, 19, 254, 0.4); /* Glow */
      padding: 30px;
      position: relative;
    }

    /* === HEADER === */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 242, 255, 0.2);
    }
    .title {
      font-family: "Times New Roman", serif;
      font-weight: 900; font-size: 36px; color: var(--neon-gold);
      text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-gold), 0 0 30px var(--neon-pink);
    }
    .status-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--neon-blue);
      background: rgba(0, 242, 255, 0.1);
      font-size: 12px; color: #fff;
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
    .dot.ok { background: #0f0; box-shadow: 0 0 8px #0f0; }

    /* === LAYOUT (GRID) === */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr; /* Left(Info) fixed, Right(Game) flex */
      gap: 30px;
      align-items: stretch;
    }

    /* === PANEL STYLES === */
    .panel {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    /* === LEFT PANEL (STATS & PAYTABLE) === */
    .kpi { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .kpi-box {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-radius: 10px;
      background: linear-gradient(90deg, rgba(0,242,255,0.05), transparent);
      border: 1px solid rgba(0,242,255,0.3);
    }
    .kpi-label { font-size: 11px; color: var(--neon-blue); letter-spacing: 1px; }
    .kpi-val { font-size: 18px; font-weight: 800; color: #fff; }
    .kpi-val.gold { color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold); }

    .log-box {
      font-family: "Courier New", monospace; font-size: 11px; color: var(--neon-blue);
      background: #000; padding: 10px; border-radius: 8px;
      min-height: 80px; margin-bottom: 20px; white-space: pre-line;
      border: 1px solid rgba(0,242,255,0.2);
    }

    /* PAYTABLE GRID (Fixed the huge image issue) */
    .pay-head {
      font-size: 13px; font-weight: 700; color: var(--neon-gold);
      margin-bottom: 10px; text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
    }
    .pay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 Columns */
      gap: 8px;
      max-height: 400px; overflow-y: auto; /* Scrollable if too long */
      padding-right: 5px;
    }
    .pay-grid::-webkit-scrollbar { width: 4px; }
    .pay-grid::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 2px; }

    .pay-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; transition: 0.2s;
    }
    .pay-card:hover {
      background: rgba(0,242,255,0.1); border-color: var(--neon-blue);
    }
    /* STRICT IMAGE SIZING */
    .pay-card img {
      width: 40px; height: 40px; /* Force small size */
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
    }
    .pay-text { font-size: 12px; color: #ccc; }
    .pay-mul { font-size: 14px; font-weight: 800; color: var(--neon-gold); }


    /* === RIGHT PANEL (GAME STAGE) === */
    .slot-stage {
      display: flex; flex-direction: column; gap: 20px;
    }

    /* THE SCREEN (Bezel & Grid) */
    .screen-bezel {
      flex: 1;
      background: #000;
      border: 4px solid #1a1a2e;
      border-radius: 20px;
      box-shadow:
        inset 0 0 50px rgba(188, 19, 254, 0.3), /* Inner Purple Glow */
        0 0 20px rgba(0, 242, 255, 0.2); /* Outer Blue Glow */
      padding: 20px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Scanline Overlay */
    .screen-bezel::after {
      content:""; position: absolute; inset:0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.3) 3px);
      pointer-events: none; z-index: 10;
    }

    /* REELS CONTAINER */
    .reels {
      display: grid;
      grid-template-columns: repeat(5, var(--cell-w)); /* 5 Cols */
      gap: var(--gap);
      z-index: 1;
    }

    .reel-col {
      width: var(--cell-w);
      height: var(--reel-h);
      background: rgba(20,20,30, 0.8);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    /* Reel Strip (Moving Part) */
    .reel-strip {
      display: flex; flex-direction: column; gap: var(--gap);
      will-change: transform; transform: translateY(0);
    }
    .symbol {
      width: var(--cell-w); height: var(--cell-h);
      display: flex; align-items: center; justify-content: center;
    }
    .symbol img {
      width: 80%; height: 80%; object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.3));
    }
    .spinning .symbol img {
      filter: blur(4px) brightness(1.2); transform: scaleY(1.1);
    }

    /* HIGHLIGHTS */
    .payline-highlight {
      position: absolute;
      top: 50%; left: 10px; right: 10px;
      height: calc(var(--cell-h) + 10px);
      transform: translateY(-50%);
      border: 2px solid var(--neon-gold);
      background: rgba(255, 215, 0, 0.1);
      border-radius: 15px;
      box-shadow: 0 0 20px var(--neon-gold), inset 0 0 20px var(--neon-gold);
      pointer-events: none; z-index: 5;
    }

    /* CONTROLS */
    .controls { text-align: center; }
    .spin-btn {
      width: 100%; max-width: 400px; height: 70px;
      border: none; border-radius: 12px;
      background: linear-gradient(180deg, #ffe000 0%, #ff9900 100%);
      color: #3d2200; font-size: 26px; font-weight: 900; letter-spacing: 2px;
      cursor: pointer; position: relative;
      box-shadow: 
        0 8px 0 #b36b00, /* 3D Depth */
        0 20px 30px rgba(0,0,0,0.6), /* Drop Shadow */
        0 0 20px var(--neon-gold); /* Glow */
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .spin-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b36b00, 0 5px 10px rgba(0,0,0,0.8);
    }
    .spin-btn:disabled {
      filter: grayscale(1); cursor: not-allowed; transform: translateY(6px);
      box-shadow: 0 2px 0 #333;
    }
    .sound-toggle {
      background: none; border: 1px solid #555; color: #888;
      border-radius: 20px; padding: 5px 10px; font-size: 11px; cursor: pointer;
      margin-top: 10px;
    }
    .sound-toggle.on { border-color: var(--neon-blue); color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }


    /* =============================================
       RESPONSIVE DESIGN (The "Popular" Method)
       Mobile: Reels on TOP, Paytable at BOTTOM
    ============================================= */
    @media (max-width: 900px) {
      .wrap { padding: 20px 10px; }
      .card { padding: 15px; border-radius: 20px; }
      .title { font-size: 24px; }
      
      .layout {
        display: flex; flex-direction: column; /* Stack Vertically */
      }

      /* ORDERING MAGIC */
      .slot-stage { order: 1; } /* Game First */
      .panel.info-panel { order: 2; margin-top: 20px; } /* Info Second */

      /* Info Panel Layout for Mobile */
      .kpi { flex-direction: row; justify-content: space-between; gap: 5px; }
      .kpi-box { flex: 1; flex-direction: column; padding: 8px 5px; }
      .kpi-label { font-size: 9px; }
      .kpi-val { font-size: 14px; }

      /* Mobile Paytable */
      .pay-grid { grid-template-columns: repeat(4, 1fr); max-height: 200px; } /* 4 Cols on mobile */
      .pay-card img { width: 30px; height: 30px; }
      .pay-mul { font-size: 11px; }

      /* Mobile Reels Scaling */
      :root {
        /* Use VW to fit 5 reels perfectly on screen */
        --cell-w: 17.5vw; 
        --cell-h: 14vw; 
        --gap: 1vw;
      }
      .screen-bezel { padding: 10px 5px; }
      .spin-btn { height: 60px; font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>

  <div class="wrap">
    <div class="card">
      
      <div class="top">
        <div class="title">THE UNIQUE</div>
        <div class="status-pill">
          <span id="apiDot" class="dot"></span>
          <span id="apiText">API Connecting...</span>
        </div>
      </div>

      <div class="layout">
        
        <div class="panel info-panel">
          <div class="kpi">
            <div class="kpi-box">
              <span class="kpi-label">BET</span>
              <span class="kpi-val gold" id="betVal">10</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">JACKPOT</span>
              <span class="kpi-val" id="jpVal">0</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">WIN</span>
              <span class="kpi-val gold" id="winVal">0</span>
            </div>
          </div>

          <div class="log-box" id="log">Welcome User.</div>

          <div class="pay-head">PAYTABLE (3 Matches)</div>
          <div class="pay-grid" id="payGrid">
            </div>
        </div>

        <div class="panel slot-stage">
          
          <div class="screen-bezel">
            <div class="payline-highlight"></div>
            <div class="reels" id="reels">
              </div>
          </div>

          <div class="controls">
            <button class="spin-btn" id="spinBtn">SPIN</button>
            <br>
            <button class="sound-toggle on" id="soundBtn">SOUND: ON</button>
          </div>

        </div>

      </div> </div>
  </div>

<script>
/** ================= CONFIG & DATA ================= */
const API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";
const SYMBOLS = [
  "star1","star2","star3",
  "pro1","pro2","pro3","pro4","pro5","pro6","pro7","pro8","pro9","pro10"
];
const IMG_PATH = (id) => `img/slot/${id}.png`;

// 족보 데이터
const PAYTABLE = [
  { id:"star1", label:"STAR I",  mul:"x1" },
  { id:"star2", label:"STAR II", mul:"x2" },
  { id:"star3", label:"STAR III",mul:"x3" },
  { id:"pro1",  label:"PRO I",   mul:"x4" },
  { id:"pro2",  label:"PRO II",  mul:"x5" },
  { id:"pro3",  label:"PRO III", mul:"x6" },
  { id:"pro4",  label:"PRO IV",  mul:"x7" },
  { id:"pro5",  label:"PRO V",   mul:"x8" },
  { id:"pro6",  label:"PRO VI",  mul:"x9" },
  { id:"pro7",  label:"PRO VII", mul:"x10" },
  { id:"pro8",  label:"PRO VIII",mul:"x12" },
  { id:"pro9",  label:"PRO IX",  mul:"x15" },
  { id:"pro10", label:"PRO X",   mul:"x20" }
];

/** ================= DOM ELEMENTS ================= */
const $ = (id) => document.getElementById(id);
const reelsEl = $("reels");
const spinBtn = $("spinBtn");
const logEl = $("log");
const betVal = $("betVal");
const jpVal = $("jpVal");
const winVal = $("winVal");
const soundBtn = $("soundBtn");

/** ================= SOUND SYSTEM ================= */
let SOUND_ON = true;
const SFX = {
  spin: new Audio("sounds/spining-sound.mp3"),
  stop: new Audio("sounds/stop-stop-stop-sound.mp3"),
  win: new Audio("sounds/win-sound.mp3"),
  lose: new Audio("sounds/lose-sound.mp3"),
  jackpot: new Audio("sounds/jackpot-sound.mp3")
};
// Configure Loop
SFX.spin.loop = true;

function playSound(name){
  if(!SOUND_ON) return;
  const audio = SFX[name];
  if(audio){
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }
}
function stopSound(name){
  const audio = SFX[name];
  if(audio){
    audio.pause();
    audio.currentTime = 0;
  }
}

soundBtn.onclick = () => {
  SOUND_ON = !SOUND_ON;
  soundBtn.textContent = SOUND_ON ? "SOUND: ON" : "SOUND: OFF";
  soundBtn.classList.toggle("on", SOUND_ON);
};

/** ================= INITIALIZATION ================= */
// 1. Build Paytable
const payGrid = $("payGrid");
PAYTABLE.forEach(item => {
  const card = document.createElement("div");
  card.className = "pay-card";
  card.innerHTML = `
    <img src="${IMG_PATH(item.id)}" alt="${item.label}">
    <div class="pay-text">${item.label}</div>
    <div class="pay-mul">${item.mul}</div>
  `;
  payGrid.appendChild(card);
});

// 2. Build Reels (5 Columns)
const NUM_REELS = 5;
const VISIBLE_ROWS = 3;
const REEL_BUFFER = 12; // Extra symbols for scrolling
const reels = []; // Stores objects { strip, offset, speed, running }

for(let i=0; i<NUM_REELS; i++){
  const col = document.createElement("div");
  col.className = "reel-col";
  
  const strip = document.createElement("div");
  strip.className = "reel-strip";
  
  // Fill Initial Symbols
  for(let j=0; j<REEL_BUFFER; j++){
    strip.appendChild(createSymbol(randomSym()));
  }
  // Append visible defaults (Stars)
  strip.appendChild(createSymbol("star1"));
  strip.appendChild(createSymbol("star1"));
  strip.appendChild(createSymbol("star1"));

  col.appendChild(strip);
  reelsEl.appendChild(col);
  
  reels.push({
    el: strip,
    offset: 0,
    speed: 0,
    running: false,
    symbolHeight: 0 // Calculated later
  });
}

function createSymbol(id){
  const div = document.createElement("div");
  div.className = "symbol";
  const img = document.createElement("img");
  img.src = IMG_PATH(id);
  div.appendChild(img);
  return div;
}

function randomSym(){
  return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
}

// Measure Symbol Height (Responsiveness)
function resizeReels(){
  const firstSym = reelsEl.querySelector(".symbol");
  if(firstSym){
    const h = firstSym.getBoundingClientRect().height;
    const gap = parseFloat(getComputedStyle(reelsEl).gap || "0"); // Grid gap isn't strip gap
    // Actually strip uses flex gap
    const style = getComputedStyle(document.querySelector(".reel-strip"));
    const flexGap = parseFloat(style.gap || "0");
    
    reels.forEach(r => {
      r.symbolHeight = h + flexGap;
      // Adjust offset to show last 3
      r.offset = -(r.symbolHeight * (REEL_BUFFER - 3)); // Approximate
      // Reset transform for clean look
      r.el.style.transform = `translateY(0px)`; 
    });
  }
}
window.addEventListener("resize", () => setTimeout(resizeReels, 200));
setTimeout(resizeReels, 100);

/** ================= GAME LOGIC (CLIENT SIDE) ================= */
// Smooth Animation Loop
function animateReels(){
  reels.forEach((r, idx) => {
    if(!r.running) return;
    
    r.offset += r.speed;
    r.el.style.transform = `translateY(${r.offset}px)`;
    
    // Loop Logic: When scrolled past one symbol height
    if(r.offset >= r.symbolHeight){
      r.offset -= r.symbolHeight;
      r.el.style.transform = `translateY(${r.offset}px)`;
      
      // Move last element to top (Infinite scroll illusion)
      const last = r.el.lastElementChild;
      r.el.removeChild(last);
      r.el.prepend(createSymbol(randomSym()));
    }
  });
  requestAnimationFrame(animateReels);
}
requestAnimationFrame(animateReels);


function startSpin(i, speed){
  reels[i].running = true;
  reels[i].speed = speed;
}

function stopSpin(i, finalSymbols){ // finalSymbols = [top, mid, bot]
  const r = reels[i];
  r.running = false;
  
  // Clear strip and rebuild for landing
  r.el.innerHTML = "";
  
  // 1. Buffer above (Moving out)
  for(let k=0; k<3; k++) r.el.appendChild(createSymbol(randomSym()));
  
  // 2. The Result Symbols
  r.el.appendChild(createSymbol(finalSymbols[0]));
  r.el.appendChild(createSymbol(finalSymbols[1]));
  r.el.appendChild(createSymbol(finalSymbols[2]));
  
  // 3. Buffer below
  for(let k=0; k<3; k++) r.el.appendChild(createSymbol(randomSym()));

  // Snap position
  const targetPos = -(r.symbolHeight * 3); // Position to show result
  r.el.style.transform = `translateY(${targetPos}px)`;
  
  // Add bounce effect class if desired
  playSound("stop");
}


/** ================= API & PLAYER ================= */
function getPlayer(){
  const qs = new URLSearchParams(location.search);
  let u = qs.get("user") || qs.get("u") || localStorage.getItem("slot_player");
  if(!u){
    u = prompt("Enter Nickname:", "Guest");
    if(u) localStorage.setItem("slot_player", u);
  }
  return u || "Guest";
}

async function fetchState(){
  try {
    const res = await fetch(`${API_BASE}/slot/state`);
    const data = await res.json();
    if(data.ok){
      $("apiDot").classList.add("ok");
      $("apiText").textContent = "Online";
      if(data.bet) betVal.textContent = data.bet;
      if(data.jackpot) jpVal.textContent = data.jackpot;
    }
  } catch(e){
    $("apiText").textContent = "Offline";
  }
}
fetchState();

/** ================= MAIN ACTION ================= */
spinBtn.onclick = async () => {
  const p = getPlayer();
  if(!p) return;

  // 1. UI LOCK
  spinBtn.disabled = true;
  winVal.textContent = "0";
  logEl.textContent = "Spinning...";
  
  // 2. VISUAL START
  reelsEl.classList.add("spinning");
  playSound("spin");
  
  // Start reels with slight delay for "wave" effect
  resizeReels(); // Ensure size is correct
  for(let i=0; i<NUM_REELS; i++){
    startSpin(i, 25 + i * 2); // Increasing speed
  }

  // 3. API CALL
  try {
    const res = await fetch(`${API_BASE}/slot/spin?u=${encodeURIComponent(p)}`, {
      method: "POST",
      body: JSON.stringify({ user: p })
    });
    const data = await res.json();

    if(!data.ok) throw new Error(data.error);

    // 4. STOP SEQUENCE (Wait 2s then stop one by one)
    setTimeout(() => {
      stopSound("spin");
      
      const grid = data.grid; // 3x5 matrix usually
      // Transpose logic if needed, but assuming grid[row][col]
      // We need col[i] = [row0, row1, row2]
      
      for(let i=0; i<NUM_REELS; i++){
        setTimeout(() => {
          stopSpin(i, [ grid[0][i], grid[1][i], grid[2][i] ]);
          
          // Last reel stopped?
          if(i === NUM_REELS - 1){
            reelsEl.classList.remove("spinning");
            spinBtn.disabled = false;
            
            // Show Result
            betVal.textContent = data.bet;
            jpVal.textContent = data.jackpot;
            winVal.textContent = data.result.win;
            logEl.textContent = `Result: ${data.result.winType}\nSymbol: ${data.result.symbol} (x${data.result.multiplier})`;
            
            if(String(data.result.winType).includes("jackpot")) playSound("jackpot");
            else if(data.result.win > 0) playSound("win");
            else playSound("lose");
          }
        }, 500 + (i * 400)); // Sequential stop
      }

    }, 2000); // Minimum spin time

  } catch(e) {
    alert("Error: " + e.message);
    spinBtn.disabled = false;
    stopSound("spin");
    reels.forEach(r => r.running = false);
  }
};
</script>
</body>
</html>
