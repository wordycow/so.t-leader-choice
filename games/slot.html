<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* === [디자인] 프리미엄 골드 & 글래스모피즘 === */
        :root {
            --gold-primary: #ffd700;
            --gold-shine: #fff2b3;
            --glass-bg: rgba(10, 10, 20, 0.45); /* 투명도 높임 */
            --glass-border: rgba(255, 215, 0, 0.3);
            --neon-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            --text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
        }

        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* 배경 */
        #game-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; z-index: -2;
            filter: brightness(0.7);
        }

        #game-container {
            width: 100%; max-width: 600px; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; box-sizing: border-box;
        }

        /* --- [공통] 유리 패널 스타일 (뒤가 다 비침) --- */
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* 1. 상단 정보 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; margin-bottom: 5px; gap: 8px;
        }
        .info-item {
            font-size: 0.9rem; font-weight: 700; color: #ccc; text-shadow: 1px 1px 2px black;
            display: flex; align-items: center; gap: 5px;
        }
        .gold-val { color: var(--gold-primary); font-size: 1.1rem; text-shadow: 0 0 5px var(--gold-primary); }

        /* 사운드 버튼 (세련되게 변경) */
        .sound-toggle {
            background: rgba(0,0,0,0.5); border: 1px solid #555;
            color: #888; font-size: 0.8rem; padding: 4px 10px;
            border-radius: 20px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .sound-toggle.active {
            border-color: var(--gold-primary); color: var(--gold-primary);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        /* 잭팟 디스플레이 */
        .jackpot-box {
            text-align: center; padding: 10px; margin-bottom: 5px;
            border-bottom: 2px solid var(--gold-primary);
        }
        .jackpot-label { font-size: 0.9rem; letter-spacing: 3px; color: #fff; text-shadow: var(--text-shadow); }
        .jackpot-val { 
            font-size: 2.2rem; font-weight: 900; color: var(--gold-primary);
            text-shadow: 0 0 10px var(--gold-primary), 2px 2px 0 #000;
        }

        /* 2. 슬롯 머신 프레임 (완전 투명) */
        .machine-frame {
            flex-grow: 1; position: relative;
            background: rgba(0,0,0,0.2); /* 투명도 극대화 */
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px; overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .reels-container { display: flex; width: 100%; height: 100%; }
        .reel { width: 20%; height: 100%; border-right: 1px solid rgba(255,255,255,0.05); position: relative; }
        .reel:last-child { border-right: none; }
        .reel-strip { width: 100%; position: absolute; top: 0; left: 0; will-change: transform; }
        
        /* 심볼 & 오버레이 */
        .symbol { 
            width: 100%; aspect-ratio: 1/1; 
            background-size: 85%; background-repeat: no-repeat; background-position: center; 
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }
        .shine-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.8) 100%);
        }

        /* 3. 하단 컨트롤 (통일된 디자인) */
        .bottom-area { margin-top: 5px; }
        
        .win-panel {
            text-align: center; padding: 10px; margin-bottom: 8px; min-height: 50px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .win-msg { font-size: 0.9rem; color: #aaa; letter-spacing: 1px; }
        .win-money { font-size: 1.6rem; color: #fff; font-weight: bold; text-shadow: 0 0 5px white; }
        .win-money.big { color: var(--gold-primary); text-shadow: 0 0 15px var(--gold-primary); font-size: 2rem; }

        .control-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; gap: 10px;
        }

        /* 버튼 공통 스타일 (고급 골드) */
        .btn-gold {
            background: linear-gradient(180deg, #2b2b2b, #1a1a1a);
            border: 1px solid #444; color: #ddd;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: all 0.1s;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Rajdhani', sans-serif; font-weight: bold;
        }
        .btn-gold:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 베팅 버튼 */
        .bet-group { display: flex; align-items: center; gap: 5px; }
        .btn-small { width: 40px; height: 40px; font-size: 1.2rem; }
        .bet-display {
            background: #000; border: 1px solid #333; color: var(--gold-primary);
            width: 70px; height: 40px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
        }
        .bet-label { font-size: 0.6rem; color: #666; line-height: 1; }
        .bet-val { font-size: 1.1rem; font-weight: bold; }

        /* 스핀 & 오토 버튼 (같은 모양, 다른 크기) */
        .action-group { display: flex; align-items: center; gap: 12px; }
        
        .btn-auto {
            width: 60px; height: 60px; border-radius: 50%; /* 원형 */
            font-size: 0.8rem; color: #aaa;
            border: 2px solid #444;
        }
        .btn-auto.active {
            border-color: #ff0055; color: #ff0055;
            box-shadow: 0 0 10px #ff0055;
            background: rgba(50, 10, 20, 0.8);
        }

        .btn-spin {
            width: 85px; height: 85px; border-radius: 50%; /* 원형 */
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border: 4px solid #fff; color: #3d2b00;
            font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), 0 5px 0 #8b6508;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .btn-spin:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }

        /* 오버레이 */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(10px);
        }
        .start-btn {
            font-size: 2rem; color: var(--gold-primary);
            animation: pulse 1s infinite alternate; cursor: pointer;
        }
        @keyframes pulse { from { opacity: 0.6; transform: scale(0.95); } to { opacity: 1; transform: scale(1.05); } }
        
        .shake-screen { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }

    </style>
</head>
<body>

    <div id="game-bg"></div>

    <div id="start-overlay">
        <h1 style="color:white; margin-bottom: 20px;">THE UNIQUE SLOTS</h1>
        <div class="start-btn">TAP TO START</div>
    </div>

    <div id="game-container">
        <div class="top-section">
            <div class="glass-panel jackpot-box">
                <div class="jackpot-label">MEGA JACKPOT</div>
                <div class="jackpot-val" id="jackpot-pool">...</div>
            </div>
            <div class="glass-panel top-bar">
                <div class="info-item">ID: <span id="user-id" style="color:#00eaff;">GUEST</span></div>
                <div id="btn-sound" class="sound-toggle">SOUND OFF</div>
                <div class="info-item">WALLET: <span id="wallet-balance" class="gold-val">0</span> UT</div>
            </div>
        </div>

        <div class="glass-panel machine-frame" id="slot-frame">
            <div class="reels-container" id="reels-container"></div>
            <div class="shine-overlay"></div>
        </div>

        <div class="bottom-area">
            <div class="glass-panel win-panel">
                <div class="win-msg" id="win-label">READY</div>
                <div class="win-money" id="win-amount">GOOD LUCK</div>
            </div>

            <div class="glass-panel control-bar">
                <button id="btn-auto" class="btn-gold btn-auto">AUTO<br>OFF</button>

                <div class="bet-group">
                    <button id="btn-bet-minus" class="btn-gold btn-small">-</button>
                    <div class="bet-display">
                        <span class="bet-label">BET</span>
                        <span class="bet-val" id="current-bet">10</span>
                    </div>
                    <button id="btn-bet-plus" class="btn-gold btn-small">+</button>
                </div>

                <button id="btn-spin" class="btn-spin">SPIN</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           [완벽한 싱크] JS 게임 로직
           ========================================= */
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
            imgObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/', 
                bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
                symbols: ['star1.png', 'star2.png', 'star3.png', 'pro1.png', 'pro2.png', 'pro3.png', 'pro4.png', 'pro5.png', 'pro6.png', 'pro7.png', 'pro8.png', 'pro9.png', 'pro10.png']
            },
            soundObj: {
                path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
                spin: 'spinning-sound.MP3', 
                stop: 'stop-stop-stop-sound.MP3', 
                win: 'win-sound.MP3', 
                lose: 'lose-sound.MP3', 
                jackpot: 'jackpot-sound.MP3', 
                btn: 'start-button-sound.MP3'
            },
            reels: 5, 
            symbolHeight: 0, 
            dummySymbolCount: 60, // 최적화된 릴 길이
            baseSpinDuration: 2000, // 기본 회전 시간 (ms)
            reelDelay: 400 // 릴 간 멈춤 간격 (ms) - 딱딱 끊어지는 맛
        };

        let state = { id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, bgIntervalId: null, jackpotPool: 0 };
        let els = {}; const audios = {};

        async function init() {
            console.log("SLOT ENGINE: SYNC FIXED");
            els = {
                bg: document.getElementById('game-bg'), overlay: document.getElementById('start-overlay'),
                reelsContainer: document.getElementById('reels-container'), slotFrame: document.getElementById('slot-frame'),
                spinBtn: document.getElementById('btn-spin'), autoBtn: document.getElementById('btn-auto'),
                walletSpan: document.getElementById('wallet-balance'), betSpan: document.getElementById('current-bet'),
                winLabel: document.getElementById('win-label'), winAmount: document.getElementById('win-amount'),
                plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
                userId: document.getElementById('user-id'), jackpotPool: document.getElementById('jackpot-pool'),
                btnSound: document.getElementById('btn-sound')
            };

            const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
            state.id = localId || new URLSearchParams(window.location.search).get('id');

            if (!state.id) {
                els.userId.innerText = "GUEST"; els.spinBtn.disabled = true;
                updateWinPanel("LOGIN REQUIRED", "로그인이 필요합니다");
            } else {
                els.userId.innerText = state.id;
                await syncUserData();
            }

            Object.keys(CONFIG.soundObj).forEach(key => {
                if (key !== 'path') { 
                    try { 
                        const audio = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[key]); 
                        if(key === 'spin') audio.loop = true; 
                        audios[key] = audio; 
                    } catch(e) {} 
                }
            });

            createReels();

            if(els.overlay) els.overlay.addEventListener('click', () => { els.overlay.style.display = 'none'; toggleSound(true); });
            els.spinBtn.addEventListener('click', () => { state.isAuto = false; updateAutoBtn(); onSpinClick(); });
            els.plus.addEventListener('click', () => changeBet(5));
            els.minus.addEventListener('click', () => changeBet(-5));
            els.btnSound.addEventListener('click', () => toggleSound(!state.audioEnabled));
            els.autoBtn.addEventListener('click', toggleAuto);
        }

        function toggleSound(forceState) {
            state.audioEnabled = forceState;
            els.btnSound.innerText = state.audioEnabled ? "SOUND ON" : "SOUND OFF";
            els.btnSound.classList.toggle("active", state.audioEnabled);
            // 소리 켜질 때 버튼음 살짝 재생 (피드백)
            if(state.audioEnabled && audios.btn) audios.btn.play().catch(()=>{});
        }

        function toggleAuto() { state.isAuto = !state.isAuto; updateAutoBtn(); if (state.isAuto && !state.isSpinning) onSpinClick(); }
        function updateAutoBtn() { els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; els.autoBtn.classList.toggle("active", state.isAuto); }
        function updateWinPanel(label, amount, isBig = false) {
            els.winLabel.innerText = label; els.winAmount.innerText = amount;
            els.winAmount.className = isBig ? "win-money big" : "win-money";
        }

        async function syncUserData(animate = false) {
            if (!state.id) return;
            try {
                const res = await jsonpRequest('getSlotState', { id: state.id });
                if (res.ok) {
                    const newWallet = Number(res.user.balance);
                    state.jackpotPool = Number(res.jackpotTotal);
                    if (animate) animateValue(els.walletSpan, state.wallet, newWallet, 1000);
                    else els.walletSpan.innerText = newWallet.toLocaleString();
                    state.wallet = newWallet;
                    updateUI();
                    if(!animate) updateWinPanel("READY", "GOOD LUCK!");
                    els.spinBtn.disabled = false;
                }
            } catch (e) { updateWinPanel("ERROR", "NETWORK ERROR"); }
        }

        function createReels() {
            els.reelsContainer.innerHTML = '';
            for (let i = 0; i < CONFIG.reels; i++) {
                const reelDiv = document.createElement('div'); reelDiv.className = 'reel';
                const stripDiv = document.createElement('div'); stripDiv.className = 'reel-strip';
                let html = '';
                for(let j=0; j < CONFIG.dummySymbolCount; j++) html += `<div class="symbol" style="background-image: url('${CONFIG.imgObj.path}${getRandomSymbolName()}')"></div>`;
                stripDiv.innerHTML = html; reelDiv.appendChild(stripDiv); els.reelsContainer.appendChild(reelDiv);
            }
            setTimeout(() => { const sym = document.querySelector('.symbol'); if(sym) CONFIG.symbolHeight = sym.offsetHeight; }, 100);
        }
        function getRandomSymbolName() { return CONFIG.imgObj.symbols[Math.floor(Math.random() * CONFIG.imgObj.symbols.length)]; }

        /* --- [핵심] 스핀 로직 --- */
        async function onSpinClick() {
            if (state.isSpinning) return;
            if (state.wallet < state.bet) { state.isAuto = false; updateAutoBtn(); alert("잔액 부족"); return; }

            state.isSpinning = true; els.spinBtn.disabled = true;
            updateWinPanel("SPINNING...", `BET: ${state.bet}`);
            animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet;

            if(state.audioEnabled) { audios.btn.play(); audios.spin.currentTime = 0; audios.spin.play(); }
            startBgEffect();

            const strips = document.querySelectorAll('.reel-strip');
            if(!CONFIG.symbolHeight) CONFIG.symbolHeight = document.querySelector('.symbol').offsetHeight;

            // 1. 리셋: 모든 릴을 시작 위치로 순간이동 (깜빡임 없음)
            const startY = 0; 
            const endY = -(CONFIG.symbolHeight * (CONFIG.dummySymbolCount - 5)); // 아래로 굴러갈 목표 지점

            strips.forEach((strip) => {
                strip.style.transition = 'none';
                strip.style.transform = `translateY(${startY}px)`;
            });
            void els.reelsContainer.offsetWidth; // Reflow Trigger

            // 2. 출발: 모든 릴이 부드럽게 굴러감
            strips.forEach((strip, index) => {
                const duration = 2 + (index * 0.2); // 뒤쪽 릴일수록 약간 더 오래 돔
                strip.style.transition = `transform ${duration}s linear`;
                // 시각적으로 무한히 도는 것처럼 보이게 아주 멀리 보냄
                strip.style.transform = `translateY(${endY}px)`;
            });

            // 3. 서버 결과 요청
            try {
                const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
                if (!res.ok) throw new Error("Spin Failed");
                stopReelsWithResult(res);
            } catch (err) {
                stopBgEffect(); audios.spin.pause(); state.isSpinning = false; els.spinBtn.disabled = false;
                syncUserData();
            }
        }

        /* --- [핵심] 멈춤 & 싱크 로직 --- */
        function stopReelsWithResult(data) {
            const serverKeys = data.spin.keys;
            const strips = document.querySelectorAll('.reel-strip');
            
            // 릴이 멈출 때 보여줄 심볼들을 '중간 어딘가'가 아니라
            // 현재 애니메이션이 진행 중인 먼 곳(endY) 근처의 특정 인덱스에 심어버림
            // 여기서는 편의상 리셋된 위치(0)에 심고, 다시 0으로 돌아오게 함 (가장 확실한 방법)

            strips.forEach((strip, colIdx) => {
                const symbols = strip.querySelectorAll('.symbol');
                // 결과 심볼을 스트립의 '맨 위(0,1,2)'에 배치
                symbols[0].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx]}.png')`;
                symbols[1].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 5]}.png')`;
                symbols[2].style.backgroundImage = `url('${CONFIG.imgObj.path}${serverKeys[colIdx + 10]}.png')`;

                // [싱크 맞추기]
                // 릴마다 멈추는 시간을 정확히 계산
                const stopTime = CONFIG.baseSpinDuration + (colIdx * CONFIG.reelDelay);

                setTimeout(() => {
                    // CSS Transition을 'ease-out'으로 바꿔서 탁! 서는 느낌을 줌
                    strip.style.transition = 'transform 0.4s cubic-bezier(0.1, 1, 0.1, 1)'; 
                    // 강제로 0 위치(결과 심볼이 있는 곳)로 이동시킴
                    strip.style.transform = `translateY(0px)`;

                    // [사운드 싱크] 화면이 멈추는 명령과 동시에 소리 재생
                    if(state.audioEnabled) {
                        const stopSound = audios.stop.cloneNode();
                        stopSound.volume = 0.8;
                        stopSound.play();
                    }
                    
                    // 마지막 릴 쉐이크
                    if(colIdx === 4) {
                        els.slotFrame.classList.add('shake-screen');
                        setTimeout(()=>els.slotFrame.classList.remove('shake-screen'), 300);
                    }

                }, stopTime);
            });

            // 모든 릴이 멈춘 후 결과창 표시
            const totalTime = CONFIG.baseSpinDuration + (4 * CONFIG.reelDelay) + 500;
            setTimeout(() => { handleSpinEnd(data); }, totalTime);
        }

        function handleSpinEnd(data) {
            state.isSpinning = false; stopBgEffect(); els.spinBtn.disabled = false; audios.spin.pause();
            
            const spin = data.spin;
            let sound = audios.lose; let label = "TRY AGAIN"; let amount = "NO WIN"; let isBig = false;

            if (spin.kind !== "lose") {
                amount = `+${spin.payout.toLocaleString()} UT`;
                if (spin.kind === "jackpot") { label = "★ JACKPOT ★"; sound = audios.jackpot; isBig = true; }
                else { label = "BIG WIN!"; sound = audios.win; isBig = true; }
            }

            updateWinPanel(label, amount, isBig);
            if (state.wallet !== data.user.balance) animateValue(els.walletSpan, state.wallet, data.user.balance, 1000);
            state.wallet = data.user.balance;
            state.jackpotPool = data.jackpotTotal;
            updateUI();

            if (spin.payout > 0 && state.audioEnabled) { sound.currentTime = 0; sound.play(); }

            if (state.isAuto) {
                setTimeout(() => { if (state.isAuto && state.wallet >= state.bet) onSpinClick(); else toggleAuto(); }, 2000); 
            }
        }

        function startBgEffect() {
            let idx = 0;
            state.bgIntervalId = setInterval(() => {
                idx = (idx + 1) % CONFIG.imgObj.bg.length;
                els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[idx]}')`;
            }, 200);
        }
        function stopBgEffect() { clearInterval(state.bgIntervalId); els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`; }
        function jsonpRequest(action, params = {}) {
            return new Promise((resolve, reject) => {
                const callbackName = 'cb_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');
                window[callbackName] = function(data) { delete window[callbackName]; document.body.removeChild(script); resolve(data); };
                params.action = action; params.callback = callbackName;
                script.src = `${CONFIG.API_URL}?${new URLSearchParams(params).toString()}`;
                document.body.appendChild(script);
            });
        }
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
            };
            window.requestAnimationFrame(step);
        }
        function updateUI() { els.betSpan.innerText = state.bet; els.jackpotPool.innerText = state.jackpotPool.toLocaleString(); }
        function changeBet(delta) { if(!state.isSpinning) { const n = state.bet + delta; if(n >= 5 && n <= 1000) { state.bet = n; updateUI(); } } }

        window.onload = init;
    </script>
</body>
</html>
