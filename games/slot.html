<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <style>
    /* =========================================
       THE "CYBERPUNK NEON VAULT" - V3
       - Fixed Audio (Restored makeAudio)
       - Detailed Paytable (1x ~ 5x Matches)
       - Popular 5x3 Layout
    ========================================= */

    :root {
      --neon-blue: #00f2ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --neon-gold: #ffd700;
      --bg-dark: #05050c;
      --glass: rgba(13, 17, 34, 0.75);
      --glass-border: rgba(0, 242, 255, 0.2);

      /* Slot Dimensions */
      --cell-w: 130px;
      --cell-h: 110px;
      --gap: 10px;
      --reel-h: calc(var(--cell-h) * 3 + var(--gap) * 2);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: #e0e0ff;
      background: var(--bg-dark);
      overflow-x: hidden;
    }

    /* === BACKGROUND === */
    .bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(circle at 50% 10%, rgba(188, 19, 254, 0.25), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 242, 255, 0.15), transparent 50%),
        linear-gradient(180deg, #0a0a16 0%, #000 100%);
    }
    .bg::before {
      content: ""; position: absolute; inset: 0;
      background-image: var(--bgimg, none);
      background-size: cover; background-position: center;
      filter: blur(15px) brightness(0.4) saturate(1.5);
      mix-blend-mode: overlay; opacity: 0.6;
      transition: opacity .5s, filter .5s;
    }
    .bg.flash::before { opacity: 0.9; filter: blur(5px) brightness(1.2); mix-blend-mode: screen; }

    .wrap {
      max-width: 1300px; margin: 0 auto; padding: 40px 20px;
      min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    }

    /* === MAIN CARD === */
    .card {
      border-radius: 30px;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 0 0 1px rgba(0,0,0, 0.5),
        0 0 0 3px var(--neon-purple),
        0 0 40px rgba(188, 19, 254, 0.4);
      padding: 30px; position: relative;
    }

    /* === HEADER === */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 242, 255, 0.2);
    }
    .title {
      font-family: "Times New Roman", serif;
      font-weight: 900; font-size: 32px; color: var(--neon-gold);
      text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-gold), 0 0 30px var(--neon-pink);
    }
    .status-wrap { display: flex; gap: 10px; }
    .status-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--neon-blue);
      background: rgba(0, 242, 255, 0.1);
      font-size: 11px; color: #fff; cursor: pointer; user-select: none;
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
    .dot.ok { background: #0f0; box-shadow: 0 0 8px #0f0; }
    .status-pill.off { border-color: #555; color: #888; box-shadow: none; }
    .status-pill.off .s-dot { background: #f00; box-shadow: 0 0 5px #f00; }
    .s-dot { width: 8px; height: 8px; border-radius: 50%; background: #0f0; box-shadow: 0 0 8px #0f0; }


    /* === LAYOUT === */
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr; /* Wider info panel for detailed paytable */
      gap: 30px; align-items: stretch;
    }

    .panel {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 20px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
      display: flex; flex-direction: column;
    }

    /* === LEFT PANEL (KPI & PAYTABLE) === */
    .kpi { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .kpi-box {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-radius: 10px;
      background: linear-gradient(90deg, rgba(0,242,255,0.05), transparent);
      border: 1px solid rgba(0,242,255,0.3);
    }
    .kpi-label { font-size: 10px; color: var(--neon-blue); letter-spacing: 1px; }
    .kpi-val { font-size: 16px; font-weight: 800; color: #fff; }
    .kpi-val.gold { color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold); }

    .log-box {
      font-family: "Courier New", monospace; font-size: 10px; color: var(--neon-blue);
      background: #000; padding: 10px; border-radius: 8px;
      min-height: 60px; margin-bottom: 15px; white-space: pre-line;
      border: 1px solid rgba(0,242,255,0.2);
    }

    /* === DETAILED PAYTABLE === */
    .pay-head {
      font-size: 12px; font-weight: 700; color: var(--neon-gold);
      margin-bottom: 8px; text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
      display: flex; justify-content: space-between;
    }
    .pay-container {
      flex: 1; overflow-y: auto; padding-right: 5px; max-height: 380px;
    }
    .pay-container::-webkit-scrollbar { width: 4px; }
    .pay-container::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 2px; }

    .pay-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 6px; margin-bottom: 6px;
      transition: 0.2s;
    }
    .pay-row:hover { background: rgba(0,242,255,0.1); border-color: var(--neon-blue); }
    
    .pay-img {
      width: 36px; height: 36px; object-fit: contain; flex-shrink: 0;
      filter: drop-shadow(0 0 3px rgba(255,255,255,0.4));
    }
    .pay-data { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .pay-name { font-size: 10px; color: #aaa; font-weight: bold; }
    
    /* Multiplier Grid inside Paytable Row */
    .pay-muls {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
      font-size: 9px; text-align: center;
    }
    .pay-muls span {
      background: rgba(0,0,0,0.3); border-radius: 3px; padding: 2px 0; color: #fff;
    }
    .pay-muls span.high { color: var(--neon-gold); font-weight: bold; }
    .pay-muls .lbl { font-size: 7px; color: #666; display: block; line-height: 1; margin-bottom: 1px; }


    /* === RIGHT PANEL (GAME) === */
    .slot-stage { gap: 20px; }

    .screen-bezel {
      flex: 1; background: #000;
      border: 4px solid #1a1a2e; border-radius: 20px;
      box-shadow: inset 0 0 50px rgba(188, 19, 254, 0.3), 0 0 20px rgba(0, 242, 255, 0.2);
      padding: 20px; position: relative;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      min-height: 300px;
    }
    .screen-bezel::after {
      content:""; position: absolute; inset:0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.3) 3px);
      pointer-events: none; z-index: 10;
    }

    .reels {
      display: grid; grid-template-columns: repeat(5, var(--cell-w)); gap: var(--gap); z-index: 1;
    }
    .reel-col {
      width: var(--cell-w); height: var(--reel-h);
      background: rgba(20,20,30, 0.8); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05); overflow: hidden; position: relative;
    }
    .reel-strip { display: flex; flex-direction: column; gap: var(--gap); will-change: transform; }
    .symbol {
      width: var(--cell-w); height: var(--cell-h);
      display: flex; align-items: center; justify-content: center;
    }
    .symbol img {
      width: 80%; height: 80%; object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.3));
    }
    .spinning .symbol img { filter: blur(4px) brightness(1.2); transform: scaleY(1.1); }

    .payline-highlight {
      position: absolute; top: 50%; left: 10px; right: 10px;
      height: calc(var(--cell-h) + 10px); transform: translateY(-50%);
      border: 2px solid var(--neon-gold); background: rgba(255, 215, 0, 0.1);
      border-radius: 15px; box-shadow: 0 0 20px var(--neon-gold);
      pointer-events: none; z-index: 5;
    }

    .controls { text-align: center; margin-top: auto; }
    .spin-btn {
      width: 100%; max-width: 400px; height: 70px;
      border: none; border-radius: 12px;
      background: linear-gradient(180deg, #ffe000 0%, #ff9900 100%);
      color: #3d2200; font-size: 26px; font-weight: 900; letter-spacing: 2px;
      cursor: pointer; box-shadow: 0 8px 0 #b36b00, 0 20px 30px rgba(0,0,0,0.6), 0 0 20px var(--neon-gold);
      transition: transform 0.1s;
    }
    .spin-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #b36b00; }
    .spin-btn:disabled { filter: grayscale(1); cursor: not-allowed; transform: translateY(6px); box-shadow: 0 2px 0 #333; }


    /* === RESPONSIVE === */
    @media (max-width: 980px) {
      .wrap { padding: 10px; }
      .layout { display: flex; flex-direction: column; }
      .slot-stage { order: 1; } /* Game Top */
      .info-panel { order: 2; height: auto; max-height: none; } /* Info Bottom */
      
      .kpi { flex-direction: row; gap: 5px; }
      .kpi-box { flex: 1; flex-direction: column; padding: 5px; }
      .kpi-label { font-size: 8px; }
      .kpi-val { font-size: 14px; }

      .pay-container { max-height: 250px; } /* Scroll on mobile */
      
      /* Scale Reels */
      :root { --cell-w: 17.5vw; --cell-h: 14vw; --gap: 1vw; }
      .spin-btn { height: 60px; font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title">THE UNIQUE</div>
        <div class="status-wrap">
           <div class="status-pill">
            <span id="apiDot" class="dot"></span>
            <span id="apiText">Connecting...</span>
          </div>
          <div class="status-pill" id="soundBtn">
            <span class="s-dot"></span>
            <span id="soundText">SOUND: ON</span>
          </div>
        </div>
      </div>

      <div class="layout">
        
        <div class="panel info-panel">
          <div class="kpi">
            <div class="kpi-box">
              <span class="kpi-label">BET</span>
              <span class="kpi-val gold" id="betVal">10</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">JACKPOT</span>
              <span class="kpi-val" id="jpVal">0</span>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">WIN</span>
              <span class="kpi-val gold" id="winVal">0</span>
            </div>
          </div>
          <div class="log-box" id="log">Ready to Spin.</div>

          <div class="pay-head">
            <span>SYMBOL</span>
            <span>MATCH PAYOUT (x1 ~ x5)</span>
          </div>
          <div class="pay-container" id="payGrid">
            </div>
        </div>

        <div class="panel slot-stage">
          <div class="screen-bezel">
            <div class="payline-highlight"></div>
            <div class="reels" id="reels"></div>
          </div>
          <div class="controls">
            <button class="spin-btn" id="spinBtn">SPIN</button>
          </div>
        </div>

      </div>
    </div>
  </div>

<script>
/** ================= CONFIG ================= */
const API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";
const IMG_PATH = (id) => `img/slot/${id}.png`;
const SYMBOLS = [
  "star1","star2","star3",
  "pro1","pro2","pro3","pro4","pro5","pro6","pro7","pro8","pro9","pro10"
];

// 족보 데이터 (5개~1개 매칭 룰 반영)
// API가 승리 금액을 결정하므로, 여기 숫자는 '연출용' 룰 설명입니다.
const PAYTABLE = [
  { id:"star1", name:"STAR I",  pays: [0.5, 2, 10, 50, 500] }, // x1, x2, x3, x4, x5
  { id:"star2", name:"STAR II", pays: [0.5, 2, 8, 40, 400] },
  { id:"star3", name:"STAR III",pays: [0.5, 2, 5, 25, 250] },
  { id:"pro1",  name:"PRO I",   pays: [0, 1, 4, 15, 100] },
  { id:"pro2",  name:"PRO II",  pays: [0, 1, 4, 12, 80] },
  { id:"pro3",  name:"PRO III", pays: [0, 1, 3, 10, 60] },
  { id:"pro4",  name:"PRO IV",  pays: [0, 0, 3, 8, 50] },
  { id:"pro5",  name:"PRO V",   pays: [0, 0, 2, 6, 40] },
  { id:"pro6",  name:"PRO VI",  pays: [0, 0, 2, 5, 30] },
  { id:"pro7",  name:"PRO VII", pays: [0, 0, 1, 4, 20] },
  { id:"pro8",  name:"PRO VIII",pays: [0, 0, 1, 3, 15] },
  { id:"pro9",  name:"PRO IX",  pays: [0, 0, 1, 2, 10] },
  { id:"pro10", name:"PRO X",   pays: [0, 0, 1, 1, 5] }
];

/** ================= SOUND (FIXED) ================= */
// 사용자 제공 원본 코드의 안전한 로딩 방식 복구
function makeAudio(candidates, {loop=false, volume=1}={}){
  let idx = 0;
  const a = new Audio(candidates[idx]);
  a.loop = loop;
  a.volume = volume;
  a.addEventListener("error", () => {
    if(idx < candidates.length - 1){
      idx++;
      a.src = candidates[idx];
      a.load();
    }
  });
  return a;
}

const SFX = {
  start: makeAudio(["sounds/start-button-sound.mp3","sounds/start-button-sound.MP3"], {volume:0.9}),
  spin:  makeAudio(["sounds/spining-sound.mp3","sounds/spining-sound.MP3"], {loop:true, volume:0.9}),
  stop:  makeAudio(["sounds/stop-stop-stop-sound.mp3","sounds/stop-stop-stop-sound.MP3"], {volume:0.9}),
  win:   makeAudio(["sounds/win-sound.mp3","sounds/win-sound.MP3"], {volume:1.0}),
  lose:  makeAudio(["sounds/lose-sound.mp3","sounds/lose-sound.MP3"], {volume:1.0}),
  jackpot: makeAudio(["sounds/jackpot-sound.mp3"], {volume:1.0}),
};

let SOUND_ON = true;
const soundBtn = document.getElementById("soundBtn");
const soundText = document.getElementById("soundText");

function toggleSound(){
  SOUND_ON = !SOUND_ON;
  soundBtn.classList.toggle("off", !SOUND_ON);
  soundText.textContent = SOUND_ON ? "SOUND: ON" : "SOUND: OFF";
  if(!SOUND_ON) stopSpinSound();
}
soundBtn.addEventListener("click", toggleSound);

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  // Unlock all sounds with silent play
  Object.values(SFX).forEach(a => {
    try {
      const v = a.volume; a.volume=0.001; 
      a.play().then(()=>{ a.pause(); a.currentTime=0; a.volume=v; }).catch(()=>{});
    } catch(e){}
  });
}

function playOne(key){
  if(!SOUND_ON) return;
  try {
    const a = SFX[key];
    a.currentTime = 0;
    a.play().catch(()=>{});
  } catch(e){}
}
function startSpinSound(){
  if(!SOUND_ON) return;
  try { SFX.spin.currentTime=0; SFX.spin.play().catch(()=>{}); } catch(e){}
}
function stopSpinSound(){
  try { SFX.spin.pause(); } catch(e){}
}

/** ================= INIT UI ================= */
// 1. Build Paytable (Detailed)
const payGrid = document.getElementById("payGrid");
PAYTABLE.forEach(p => {
  const row = document.createElement("div");
  row.className = "pay-row";
  
  // Image & Name
  row.innerHTML = `
    <img src="${IMG_PATH(p.id)}" class="pay-img">
    <div class="pay-data">
      <div class="pay-name">${p.name}</div>
      <div class="pay-muls">
        <div><span class="lbl">1x</span><span>${p.pays[0]||'-'}</span></div>
        <div><span class="lbl">2x</span><span>${p.pays[1]||'-'}</span></div>
        <div><span class="lbl">3x</span><span>${p.pays[2]}</span></div>
        <div><span class="lbl">4x</span><span>${p.pays[3]}</span></div>
        <div><span class="lbl">5x</span><span class="high">${p.pays[4]}</span></div>
      </div>
    </div>
  `;
  payGrid.appendChild(row);
});

// 2. Build Reels
const reelsEl = document.getElementById("reels");
const reels = [];
const NUM_REELS = 5;

function createSymbol(sym){
  const d = document.createElement("div");
  d.className = "symbol";
  const img = document.createElement("img");
  img.src = IMG_PATH(sym);
  d.appendChild(img);
  return d;
}

for(let i=0; i<NUM_REELS; i++){
  const col = document.createElement("div");
  col.className = "reel-col";
  const strip = document.createElement("div");
  strip.className = "reel-strip";
  
  // Init Content
  for(let k=0; k<12; k++) strip.appendChild(createSymbol(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]));
  strip.appendChild(createSymbol("star1"));
  strip.appendChild(createSymbol("star1"));
  strip.appendChild(createSymbol("star1"));
  
  col.appendChild(strip);
  reelsEl.appendChild(col);
  
  reels.push({ el: strip, offset:0, speed:0, running:false, h:0 });
}

// Measure sizes
function resize(){
  const sample = reelsEl.querySelector(".symbol");
  if(!sample) return;
  const h = sample.getBoundingClientRect().height;
  // Get gap from CSS
  const stripStyle = getComputedStyle(document.querySelector(".reel-strip"));
  const gap = parseFloat(stripStyle.gap || "0");
  
  reels.forEach(r => {
    r.h = h + gap;
    r.el.style.transform = `translateY(0px)`;
    r.offset = 0;
  });
}
window.addEventListener("resize", () => setTimeout(resize, 200));
setTimeout(resize, 100);

/** ================= GAME LOGIC ================= */
// Animation Loop
function animate(){
  reels.forEach(r => {
    if(!r.running) return;
    r.offset += r.speed;
    r.el.style.transform = `translateY(${r.offset}px)`;
    
    // Infinite Scroll Logic
    if(r.offset >= r.h){
      r.offset -= r.h;
      r.el.style.transform = `translateY(${r.offset}px)`;
      const last = r.el.lastElementChild;
      if(last) {
        r.el.removeChild(last);
        r.el.prepend(createSymbol(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]));
      }
    }
  });
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function stopReel(i, resultSyms){
  const r = reels[i];
  r.running = false;
  r.el.innerHTML = "";
  
  // Rebuild strip for result: Buffer - Result - Buffer
  for(let k=0; k<3; k++) r.el.appendChild(createSymbol(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]));
  r.el.appendChild(createSymbol(resultSyms[0]));
  r.el.appendChild(createSymbol(resultSyms[1]));
  r.el.appendChild(createSymbol(resultSyms[2]));
  for(let k=0; k<3; k++) r.el.appendChild(createSymbol(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]));
  
  // Position to show result (Index 3,4,5)
  const target = -(r.h * 3);
  r.el.style.transition = "none";
  r.el.style.transform = `translateY(${target + 20}px)`; // Bounce
  
  requestAnimationFrame(()=>{
    r.el.style.transition = "transform 0.2s ease-out";
    r.el.style.transform = `translateY(${target}px)`;
  });
}


/** ================= API & ACTIONS ================= */
const spinBtn = document.getElementById("spinBtn");
const betVal = document.getElementById("betVal");
const jpVal = document.getElementById("jpVal");
const winVal = document.getElementById("winVal");
const logEl = document.getElementById("log");
const apiDot = document.getElementById("apiDot");
const apiText = document.getElementById("apiText");

async function checkApi(){
  try{
    const res = await fetch(`${API_BASE}/slot/state`);
    const d = await res.json();
    if(d.ok){
      apiDot.classList.add("ok"); apiText.textContent = "Online";
      if(d.bet) betVal.textContent = d.bet;
      if(d.jackpot) jpVal.textContent = d.jackpot;
    }
  }catch(e){ apiText.textContent = "Offline"; }
}
checkApi();

function getPlayer(){
  const q = new URLSearchParams(location.search);
  let u = q.get("u") || localStorage.getItem("slot_player");
  if(!u){
    u = prompt("닉네임(Player)을 입력하세요", "Guest");
    if(u) localStorage.setItem("slot_player", u);
  }
  return u || "Guest";
}

spinBtn.onclick = async () => {
  unlockAudio();
  const player = getPlayer();
  
  spinBtn.disabled = true;
  winVal.textContent = "0";
  logEl.textContent = "Spinning...";
  reelsEl.classList.add("spinning");
  
  playOne("start");
  startSpinSound();
  
  // Start Visuals
  reels.forEach((r, i) => {
    r.running = true;
    r.speed = 25 + i * 2;
    r.el.style.transition = "none";
  });
  
  try {
    const res = await fetch(`${API_BASE}/slot/spin?u=${encodeURIComponent(player)}`, {
      method: "POST", body: JSON.stringify({user:player})
    });
    const data = await res.json();
    
    if(!data.ok) throw new Error(data.error || "Error");
    
    // Stop Sequence
    setTimeout(() => {
      stopSpinSound();
      
      const grid = data.grid; // [row][col] -> Need [col][row]
      
      for(let i=0; i<NUM_REELS; i++){
        setTimeout(() => {
          stopReel(i, [ grid[0][i], grid[1][i], grid[2][i] ]);
          playOne("stop");
          
          if(i === NUM_REELS - 1){
            // Finish
            reelsEl.classList.remove("spinning");
            spinBtn.disabled = false;
            
            betVal.textContent = data.bet;
            jpVal.textContent = data.jackpot;
            winVal.textContent = data.result.win;
            
            const winType = data.result.winType;
            logEl.textContent = `RESULT: ${winType}\nWIN: ${data.result.win}`;
            
            if(String(winType).toLowerCase().includes("jackpot")) playOne("jackpot");
            else if(data.result.win > 0) playOne("win");
            else playOne("lose");
          }
        }, 500 + i * 400);
      }
    }, 1500);
    
  } catch(e) {
    alert("Spin Error: " + e.message);
    spinBtn.disabled = false;
    stopSpinSound();
    reels.forEach(r => r.running = false);
  }
};
</script>
</body>
</html>
