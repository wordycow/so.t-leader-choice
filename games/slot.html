<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE UNIQUE SLOT - CYBERPUNK</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00f3ff;
      --neon-pink: #bc13fe;
      --gold: #ffd700;
      --gold-dim: #bfa406;
      --bg-dark: #050505;
      --panel-bg: rgba(20, 25, 30, 0.9);
      --border-glow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg-dark);
      color: white; font-family: 'Rajdhani', sans-serif;
      overflow: hidden; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }

    /* 배경 */
    #game-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #1a1f2c 0%, #000 90%);
      z-index: -2;
    }
    .grid-overlay {
      position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
      background: linear-gradient(transparent 95%, rgba(0, 243, 255, 0.1) 96%, transparent 97%),
                  linear-gradient(90deg, transparent 95%, rgba(188, 19, 254, 0.1) 96%, transparent 97%);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 20s linear infinite;
      z-index: -1;
    }
    @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(60px); } }

    /* 메인 컨테이너 */
    #game-container {
      width: 100%; max-width: 500px; height: 100%; max-height: 100vh;
      display: flex; flex-direction: column;
      padding: 15px; position: relative;
    }

    /* 1. 상단: 잭팟 풀 (크게 강조) */
    .top-section {
      flex: 0 0 auto; text-align: center; margin-bottom: 10px;
      text-shadow: 0 0 15px var(--gold);
    }
    .jp-label { font-size: 0.9rem; color: var(--neon-blue); letter-spacing: 4px; font-weight: 700; margin-bottom: -5px; }
    .jp-amount {
      font-size: 3rem; font-weight: 900; color: var(--gold);
      background: linear-gradient(180deg, #fff, var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
      line-height: 1;
    }

    /* 2. 슬롯 머신 프레임 */
    .machine-frame {
      flex: 1; position: relative;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--neon-pink);
      border-radius: 4px; /* 사이버펑크는 각진 느낌 */
      box-shadow: 0 0 20px rgba(188, 19, 254, 0.2), inset 0 0 30px #000;
      overflow: hidden; margin-bottom: 10px;
      /* 네온 코너 장식 */
      clip-path: polygon(
        0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 
        100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px)
      );
    }
    #slot-canvas { width: 100%; height: 100%; display: block; }
    .win-line {
      position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
      background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
      transform: translateY(-50%); display: none; z-index: 10;
    }

    /* 3. 하단 컨트롤 덱 (통합형) */
    .control-deck {
      flex: 0 0 auto;
      background: var(--panel-bg);
      border: 1px solid var(--neon-blue);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      position: relative;
    }
    /* 덱 상단 장식바 */
    .deck-top-bar {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 60%; height: 4px; background: var(--neon-blue);
      box-shadow: 0 0 10px var(--neon-blue); border-radius: 2px;
    }

    /* 정보창 (메시지 + 지갑) */
    .info-lcd {
      background: #000; border: 1px solid #333;
      border-radius: 4px; padding: 5px 10px;
      margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: inset 0 0 10px rgba(0,243,255,0.1);
    }
    .msg-area { font-size: 1rem; color: #fff; font-weight: 700; }
    .msg-area.win { color: var(--gold); text-shadow: 0 0 5px var(--gold); animation: blink 0.5s infinite; }
    
    .wallet-area { text-align: right; }
    .wallet-lbl { font-size: 0.6rem; color: #666; display: block; line-height: 1; }
    .wallet-val { font-size: 1.4rem; color: var(--neon-blue); font-weight: 700; text-shadow: 0 0 5px var(--neon-blue); }

    /* 버튼 그룹 */
    .btn-row-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; gap: 10px;
    }

    /* 버튼 스타일 (사이버펑크) */
    .cyber-btn {
      background: linear-gradient(180deg, #2a2a2a, #111);
      border: 1px solid #444; color: #888;
      border-radius: 6px; cursor: pointer;
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      transition: all 0.1s; position: relative; overflow: hidden;
    }
    .cyber-btn:active { transform: translateY(2px); background: #000; }
    .cyber-btn::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
      background: var(--neon-blue); opacity: 0.5;
    }

    /* 기능 버튼 (Sound, Auto) */
    .btn-func { width: 60px; height: 45px; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
    .btn-func.active { 
      color: #000; background: var(--neon-blue); border-color: var(--neon-blue); 
      box-shadow: 0 0 15px var(--neon-blue);
    }
    .btn-func.active::after { display: none; }

    /* 베팅 컨트롤 (중앙) */
    .bet-control {
      display: flex; align-items: center; gap: 5px;
      background: #000; padding: 3px; border-radius: 6px; border: 1px solid #333;
    }
    .btn-step { width: 35px; height: 35px; font-size: 1.2rem; color: #fff; background: #222; border: none; }
    .bet-display { width: 70px; text-align: center; }
    .bet-lbl { font-size: 0.6rem; color: #555; }
    .bet-val { font-size: 1.2rem; color: var(--gold); font-weight: 700; }

    /* 대망의 스핀 버튼 (와이드 바) */
    .spin-bar-container { position: relative; width: 100%; height: 60px; }
    .btn-spin {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #bfa406, #ffd700, #bfa406);
      border: none; border-radius: 8px;
      color: #000; font-size: 1.8rem; font-weight: 900; letter-spacing: 5px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-spin:active { transform: scale(0.98); background: linear-gradient(90deg, #8a7604, #bfa406); }
    .btn-spin:disabled { filter: grayscale(1); opacity: 0.3; cursor: not-allowed; }

    /* 오버레이 */
    #jackpot-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
      display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    #jackpot-overlay.show { display: flex; animation: fadeIn 0.3s; }
    .jp-title { font-size: 4rem; color: var(--gold); animation: pulse 0.3s infinite; text-shadow: 0 0 30px var(--gold); margin: 0;}
    .jp-win { font-size: 3rem; color: #fff; text-shadow: 0 0 20px var(--neon-blue); margin-top: 10px; }
    .coin { position: absolute; width: 40px; height: 40px; background: gold; border-radius: 50%; animation: fall linear infinite; z-index: -1; }
    
    #start-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 90;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
    }

    @keyframes fall { to { transform: translateY(120vh) rotate(360deg); } }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 400px) {
      .jp-amount { font-size: 2.2rem; }
      .btn-func { width: 50px; font-size: 0.7rem; }
      .bet-control { gap: 2px; }
      .bet-display { width: 50px; }
      .btn-step { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>

  <div id="game-bg"></div>
  <div class="grid-overlay"></div>

  <div id="jackpot-overlay">
    <h1 class="jp-title">JACKPOT!</h1>
    <div class="jp-win" id="jp-ani-amount">0</div>
    <div id="coin-container"></div>
  </div>

  <div id="start-overlay">
    <h1 style="font-size:3rem; color:white; text-shadow:0 0 20px var(--neon-blue); margin:0;">UNIQUE</h1>
    <h2 style="font-size:1.5rem; color:var(--neon-pink); letter-spacing:5px; margin:0 0 30px 0;">CYBER SLOTS</h2>
    <div style="color:var(--gold); animation:blink 1s infinite;">TOUCH TO START</div>
  </div>

  <div id="game-container">
    
    <div class="top-section">
      <div class="jp-label">MEGA JACKPOT</div>
      <div class="jp-amount"><span id="jackpot-pool">...</span></div>
    </div>

    <div class="machine-frame" id="machine-frame">
      <canvas id="slot-canvas"></canvas>
      <div class="win-line"></div>
    </div>

    <div class="control-deck">
      <div class="deck-top-bar"></div>

      <div class="info-lcd">
        <div class="msg-area" id="status-msg">READY</div>
        <div class="wallet-area">
          <span class="wallet-lbl">CREDIT</span>
          <span class="wallet-val" id="wallet-balance">0</span>
        </div>
      </div>

      <div class="btn-row-top">
        <button id="btn-sound" class="cyber-btn btn-func">SOUND<br>OFF</button>
        
        <div class="bet-control">
          <button id="btn-bet-minus" class="cyber-btn btn-step">-</button>
          <div class="bet-display">
            <div class="bet-lbl">BET</div>
            <div class="bet-val" id="current-bet">10</div>
          </div>
          <button id="btn-bet-plus" class="cyber-btn btn-step">+</button>
        </div>

        <button id="btn-auto" class="cyber-btn btn-func">AUTO<br>OFF</button>
      </div>

      <div class="spin-bar-container">
        <button id="btn-spin" class="btn-spin">SPIN</button>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // Configuration
    // ==========================================
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
      imgObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/',
        bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
        symbols: [
          'star1.png','star2.png','star3.png',
          'pro1.png','pro2.png','pro3.png','pro4.png','pro5.png','pro6.png','pro7.png',
          'pro8.png','pro9.png','pro10.png'
        ]
      },
      soundObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
        spin: 'spinning-sound.MP3',
        stop: 'stop-stop-stop-sound.MP3',
        win: 'win-sound.MP3',
        lose: 'lose-sound.MP3',
        jackpot: 'jackpot-sound.MP3',
        btn: 'start-button-sound.MP3'
      },
      reels: 5,
      rows: 3
    };

    const SYMBOL_ALIAS = {
      "1":"star1","A":"star1","2":"star2","3":"star3","4":"pro1","5":"pro2","6":"pro3",
      "7":"pro4","8":"pro5","9":"pro6","10":"pro7","11":"pro8","J":"pro8","12":"pro9","Q":"pro9","13":"pro10","K":"pro10"
    };

    let state = {
      id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, jackpotPool: 0,
      bgIntervalId: null, bgIdx: 0
    };

    let els = {};
    const audios = {};
    const SlotCanvasImages = {};

    // ==========================================
    // Canvas Engine (Direction: Top to Bottom)
    // ==========================================
    const SlotCanvas = (() => {
      const buffer = 3;
      let canvas, ctx;
      let dpr = 1;
      let cw = 0, ch = 0;
      let reelW = 0, sym = 0, xPad = 0, yPad = 0;
      let reels = [];
      let raf = null, last = 0, running = false;
      let onAllStopped = null, onReelStopped = null;

      const baseNames = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function easeOutBack(t){ const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
      function keyToBaseName(key){
        if (key == null) return randBase();
        const s = String(key).trim();
        if (SYMBOL_ALIAS[s]) return SYMBOL_ALIAS[s];
        if (baseNames.includes(s)) return s;
        if (s.endsWith(".png")) return s.replace(".png","");
        return randBase();
      }
      function randBase(){ return baseNames[(Math.random() * baseNames.length) | 0]; }

      function makeReel(i){
        return {
          i, symbols: [], offset: 0, speed: 0, mode: "idle",
          startAt: 0, stopAt: 0, final: null,
          decelStart: 0, decelDur: 600,
          speedStart: 0, speedEnd: 200,
          snapStart: 0, snapDur: 400, snapFrom: 0
        };
      }

      function fillReel(r){
        const need = CONFIG.rows + buffer * 2 + 5;
        r.symbols = [];
        for (let k=0;k<need;k++) r.symbols.push(randBase());
        r.offset = Math.random() * (sym || 1);
      }

      function resize(){
        if (!canvas) return;
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        const newW = Math.floor(rect.width * dpr);
        const newH = Math.floor(rect.height * dpr);
        if (newW === cw && newH === ch) return;
        const oldSym = sym || 1;
        cw = newW; ch = newH;
        canvas.width = cw; canvas.height = ch;
        reelW = cw / CONFIG.reels;
        sym = Math.floor(Math.min(reelW, ch / CONFIG.rows)); 
        xPad = Math.floor((reelW - sym) / 2);
        yPad = Math.floor((ch - sym * CONFIG.rows) / 2);
        reels.forEach(r => { r.offset = (r.offset / oldSym) * sym; });
      }

      function init(c, hooks={}){
        canvas = c;
        ctx = canvas.getContext("2d", { alpha: true });
        reels = [];
        for (let i=0;i<CONFIG.reels;i++) reels.push(makeReel(i));
        resize();
        reels.forEach(fillReel);
        onReelStopped = hooks.onReelStopped || null;
      }

      function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
      function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=null; }

      function startSpin(){
        const now = performance.now();
        reels.forEach((r, i) => {
          r.mode = "wait";
          r.startAt = now + i * 100; 
          r.stopAt = 0; r.final = null; r.speed = 0;
        });
        start();
      }

      function scheduleStop(keys, doneCb){
        const now = performance.now();
        onAllStopped = doneCb;
        for (let col=0; col<CONFIG.reels; col++){
          const top = keyToBaseName(keys[col]);
          const mid = keyToBaseName(keys[col + CONFIG.reels]);
          const bot = keyToBaseName(keys[col + CONFIG.reels * 2]);
          reels[col].final = [top, mid, bot];
          reels[col].stopAt = now + 800 + col * 400; // 순차 정지
        }
      }

      function abortToIdle(){ reels.forEach(r => { r.mode = "idle"; r.speed = 0; r.final = null; }); }

      function update(dt, now){
        for (const r of reels){
          if (r.mode === "wait" && now >= r.startAt) {
            r.mode = "spin";
            r.speed = 1500 + r.i * 200; // 초기 속도
          }
          if (r.mode === "spin"){
            r.speed = Math.min(3500, r.speed + 2000 * dt); // 가속
            if (r.stopAt && now >= r.stopAt){
              r.mode = "decel";
              r.decelStart = now;
              r.speedStart = r.speed;
              r.speedEnd = 200;
            }
          }
          if (r.mode === "decel"){
            const p = Math.min(1, (now - r.decelStart) / r.decelDur);
            r.speed = r.speedStart + (r.speedEnd - r.speedStart) * easeOutCubic(p);
            if (p >= 1){
              if (r.final){
                // 최종 심볼 배치 (버퍼 위치)
                r.symbols[buffer] = r.final[0];
                r.symbols[buffer+1] = r.final[1];
                r.symbols[buffer+2] = r.final[2];
              }
              r.mode = "snap";
              r.snapStart = now;
              r.snapFrom = r.offset; // 현재 어긋난 오프셋
              r.speed = 0;
            }
          }

          // === [핵심 변경] 위에서 아래로 흐름 (Offset 증가) ===
          if (r.mode === "spin" || r.mode === "decel"){
            r.offset += r.speed * dt; // 양수: 아래로 이동
            while (r.offset >= sym){
              r.offset -= sym;
              // 아래로 이동하므로 맨 아래 심볼 삭제, 맨 위에 새 심볼 추가
              r.symbols.pop(); 
              r.symbols.unshift(randBase()); 
            }
          }

          if (r.mode === "snap"){
            const p = Math.min(1, (now - r.snapStart) / r.snapDur);
            // Snap from current offset back to 0 (align to grid)
            r.offset = r.snapFrom + (0 - r.snapFrom) * easeOutBack(p);
            if (p >= 1){
              r.offset = 0;
              r.mode = "stopped";
              if (typeof onReelStopped === "function") onReelStopped(r.i);
            }
          }
        }
      }

      function draw(){
        if (!ctx) return;
        ctx.clearRect(0,0,cw,ch);
        
        for (const r of reels){
          const rx = r.i * reelW;
          ctx.save();
          ctx.beginPath();
          ctx.rect(rx, 0, reelW, ch);
          ctx.clip();

          // 블러 효과 (빠를 때만)
          if (r.mode === "spin" && r.speed > 1800) ctx.filter = "blur(2px)";
          else ctx.filter = "none";

          for (let i=0;i<r.symbols.length;i++){
            const base = r.symbols[i];
            const img = SlotCanvasImages[base];
            const x = rx + xPad;
            // Draw Position: Grid Y + Offset (Moves Down)
            const y = yPad + ((i - buffer) * sym) + r.offset; 

            if (y > -sym && y < ch + sym){
              if (img && img.complete) ctx.drawImage(img, x, y, sym, sym);
              else {
                ctx.fillStyle = "#111"; ctx.fillRect(x, y, sym, sym);
                ctx.fillStyle = "#fff"; ctx.fillText("?", x+sym/2, y+sym/2);
              }
            }
          }
          ctx.restore();
          
          // 네온 구분선
          ctx.save();
          ctx.strokeStyle = "rgba(0, 243, 255, 0.3)";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, ch); ctx.stroke();
          ctx.restore();
        }
      }

      function loop(now){
        const dt = Math.min(0.05, (now - last)/1000);
        last = now;
        update(dt, now);
        draw();
        if (reels.every(r => r.mode === "stopped" || r.mode === "idle") && onAllStopped){
          const cb = onAllStopped; onAllStopped = null; cb();
        }
        raf = requestAnimationFrame(loop);
      }

      return { init, resize, startSpin, scheduleStop, abortToIdle, stop };
    })();

    // ==========================================
    // Main App Logic
    // ==========================================
    async function init() {
      console.log("CYBERPUNK ENGINE V15");
      els = {
        bg: document.getElementById('game-bg'), overlay: document.getElementById('start-overlay'),
        machineFrame: document.getElementById('machine-frame'), canvas: document.getElementById('slot-canvas'),
        spinBtn: document.getElementById('btn-spin'), autoBtn: document.getElementById('btn-auto'), soundBtn: document.getElementById('btn-sound'),
        walletSpan: document.getElementById('wallet-balance'), jackpotPool: document.getElementById('jackpot-pool'),
        betSpan: document.getElementById('current-bet'), statusMsg: document.getElementById('status-msg'),
        plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
        userId: document.getElementById('user-id'),
        jpOverlay: document.getElementById('jackpot-overlay'), jpAmount: document.getElementById('jp-ani-amount'), coinBox: document.getElementById('coin-container')
      };

      const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
      state.id = localId || new URLSearchParams(window.location.search).get('id');

      if (!state.id) {
        // els.userId.innerText = "GUEST"; 
        els.spinBtn.disabled = true; setStatus("LOGIN REQUIRED");
      } else {
        await syncUserData();
      }

      // 사운드 로드
      for(let k in CONFIG.soundObj){
        if(k!=='path') try{ audios[k] = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[k]); if(k==='spin') audios[k].loop=true; }catch(e){}
      }

      await preloadSymbolImages();

      SlotCanvas.init(els.canvas, {
        onReelStopped: () => {
          if (state.audioEnabled && audios.stop) {
            const s = audios.stop.cloneNode(); s.volume = 0.8; s.play().catch(()=>{});
          }
        }
      });

      window.addEventListener("resize", () => SlotCanvas.resize());
      new ResizeObserver(()=>SlotCanvas.resize()).observe(els.machineFrame);

      if(els.overlay) els.overlay.addEventListener('click', ()=>{ els.overlay.style.display='none'; toggleSound(true); });
      els.spinBtn.addEventListener('click', ()=>{ state.isAuto=false; updateAutoBtn(); onSpinClick(); });
      els.plus.addEventListener('click', ()=>changeBet(5));
      els.minus.addEventListener('click', ()=>changeBet(-5));
      els.soundBtn.addEventListener('click', ()=>toggleSound(!state.audioEnabled));
      els.autoBtn.addEventListener('click', toggleAuto);
      els.jpOverlay.addEventListener('click', closeJackpot);

      updateUI();
    }

    async function preloadSymbolImages(){
      const bases = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));
      const jobs = bases.map(base => new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve([base, img]);
        img.onerror = () => resolve([base, null]);
        img.src = CONFIG.imgObj.path + base + ".png";
      }));
      const res = await Promise.all(jobs);
      for(const [b, i] of res) if(i) SlotCanvasImages[b] = i;
    }

    function toggleSound(st){
      state.audioEnabled = st;
      els.soundBtn.innerHTML = st ? "SOUND<br>ON" : "SOUND<br>OFF";
      els.soundBtn.classList.toggle("active", st);
      if(!st) Object.values(audios).forEach(a=>a.pause());
      else if(audios.btn) audios.btn.play().catch(()=>{});
    }

    function toggleAuto(){ state.isAuto = !state.isAuto; updateAutoBtn(); if(state.isAuto && !state.isSpinning) onSpinClick(); }
    function updateAutoBtn(){ 
      els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; 
      els.autoBtn.classList.toggle("active", state.isAuto); 
    }

    function setStatus(msg, isWin){ 
      els.statusMsg.innerText = msg; 
      els.statusMsg.className = isWin ? "msg-area win" : "msg-area"; 
    }

    async function syncUserData(ani){
      if(!state.id) return;
      try {
        const res = await jsonpRequest('getSlotState', { id: state.id });
        if(res.ok){
          const nb = Number(res.user.balance);
          state.jackpotPool = Number(res.jackpotTotal);
          if(ani) animateValue(els.walletSpan, state.wallet, nb, 1000);
          else els.walletSpan.innerText = nb.toLocaleString();
          state.wallet = nb;
          updateUI();
          if(!ani) setStatus("READY");
          els.spinBtn.disabled = false;
        }
      } catch(e) { setStatus("NETWORK ERROR"); }
    }

    async function onSpinClick(){
      if(state.isSpinning) return;
      if(state.wallet < state.bet) { state.isAuto=false; updateAutoBtn(); alert("잔액 부족"); return; }

      state.isSpinning = true; els.spinBtn.disabled = true; setStatus("SPINNING...");
      animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet;

      if(state.audioEnabled && audios.spin){ audios.spin.currentTime=0; audios.spin.volume=0.6; audios.spin.play().catch(()=>{}); }
      
      // 배경 번쩍임 시작
      startBgEffect(150);
      SlotCanvas.startSpin();

      try {
        const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
        if(!res.ok) throw new Error();
        SlotCanvas.scheduleStop(res.spin.keys, () => handleSpinEnd(res));
      } catch(e) {
        stopBgEffect();
        if(state.audioEnabled) audios.spin.pause();
        SlotCanvas.abortToIdle();
        state.isSpinning = false; els.spinBtn.disabled = false;
        syncUserData();
      }
    }

    function handleSpinEnd(data){
      state.isSpinning = false; stopBgEffect();
      if(state.audioEnabled) audios.spin.pause();
      els.spinBtn.disabled = false;

      const spin = data.spin;
      let isWin = false;
      let msg = "TRY AGAIN";

      if(spin.kind !== "lose"){
        isWin = true;
        msg = `WIN! +${Number(spin.payout).toLocaleString()} UT`;
        if(spin.kind === "jackpot"){
          showJackpotOverlay(Number(spin.payout));
          if(state.audioEnabled) audios.jackpot.play().catch(()=>{});
        } else {
          if(state.audioEnabled) audios.win.play().catch(()=>{});
        }
      } else {
        if(state.audioEnabled) audios.lose.play().catch(()=>{});
      }

      setStatus(msg, isWin);
      
      const newBal = Number(data.user.balance);
      if(state.wallet !== newBal) animateValue(els.walletSpan, state.wallet, newBal, 1000);
      state.wallet = newBal;
      state.jackpotPool = Number(data.jackpotTotal);
      updateUI();

      if(state.isAuto){
        setTimeout(() => {
          if(state.isAuto && state.wallet >= state.bet) onSpinClick();
          else toggleAuto();
        }, 1500);
      }
    }

    function showJackpotOverlay(amt){
      els.jpOverlay.style.display = 'flex';
      els.jpOverlay.classList.add('show');
      animateValue(els.jpAmount, 0, amt, 3000);
      createCoins();
    }
    function closeJackpot(){
      els.jpOverlay.style.display = 'none';
      els.jpOverlay.classList.remove('show');
      els.coinBox.innerHTML = '';
    }
    function createCoins(){
      els.coinBox.innerHTML = '';
      for(let i=0;i<60;i++){
        const c = document.createElement('div');
        c.className = 'coin';
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (Math.random()*2+1)+'s';
        els.coinBox.appendChild(c);
      }
    }

    function startBgEffect(ms){
      clearInterval(state.bgIntervalId);
      state.bgIntervalId = setInterval(()=>{
        state.bgIdx = (state.bgIdx+1)%CONFIG.imgObj.bg.length;
        els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[state.bgIdx]}')`;
      }, ms);
    }
    function stopBgEffect(){
      clearInterval(state.bgIntervalId);
      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`;
    }

    function jsonpRequest(action, params){
      return new Promise((resolve, reject)=>{
        const cb = 'cb_'+Math.round(Math.random()*100000);
        window[cb] = (d) => { delete window[cb]; document.body.removeChild(s); resolve(d); };
        const s = document.createElement('script');
        params.action = action; params.callback = cb;
        s.src = `${CONFIG.API_URL}?${new URLSearchParams(params)}`;
        s.onerror = () => { delete window[cb]; document.body.removeChild(s); reject(); };
        document.body.appendChild(s);
      });
    }

    function animateValue(obj, start, end, duration){
      let s = null;
      const step = (t) => {
        if(!s) s = t;
        const p = Math.min((t-s)/duration, 1);
        obj.innerText = Math.floor(p*(end-start)+start).toLocaleString();
        if(p<1) requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
      };
      requestAnimationFrame(step);
    }

    function updateUI(){
      els.betSpan.innerText = state.bet;
      els.jackpotPool.innerText = Number(state.jackpotPool||0).toLocaleString();
      els.walletSpan.innerText = Number(state.wallet||0).toLocaleString();
    }
    function changeBet(d){
      if(state.isSpinning) return;
      const n = state.bet + d;
      if(n>=5 && n<=1000){ state.bet=n; updateUI(); }
    }

    window.onload = init;
  </script>
</body>
</html>
