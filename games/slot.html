<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#020617;
      color:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      overflow:hidden;
    }

    /* ===== Background Slideshow ===== */
    .bg{
      position:fixed; inset:0; z-index:-2;
      background: radial-gradient(circle at top, rgba(15,23,42,0.35), rgba(2,6,23,0.92) 60%);
    }
    .bgSlide{
      position:fixed; inset:0; z-index:-3;
      background-size:cover;
      background-position:center;
      opacity:0;
      transition: opacity 900ms ease;
      filter: saturate(1.05) contrast(1.02);
    }
    .bgSlide.show{opacity:0.55}
    .vignette{
      position:fixed; inset:0; z-index:-1;
      background: radial-gradient(circle at center, rgba(0,0,0,0.00) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
      pointer-events:none;
    }

    .wrap{width:min(980px,100%); display:grid; grid-template-columns: 1fr; gap:14px;}

    .card{
      background: rgba(15,23,42,0.88);
      border:1px solid rgba(251,191,36,0.55);
      border-radius:22px;
      box-shadow: 0 0 34px rgba(251,191,36,0.12);
      padding:18px;
      backdrop-filter: blur(10px);
    }

    .top{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.08);
      margin-bottom:14px;
    }
    .title{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:0.08em;
      font-size:20px;
      color:#fff;
    }
    .sub{font-size:12px;color:#94a3b8;margin-top:2px}

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(30,41,59,0.82);
      border:1px solid rgba(255,255,255,0.10);
      font-size:12px;
      color:#cbd5e1;
      white-space:nowrap;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#64748b}
    .dot.ok{background:#22c55e}
    .dot.bad{background:#ef4444}

    .grid{
      display:grid;
      grid-template-columns: 1.15fr 1fr;
      gap:14px;
    }
    @media (max-width: 880px){ .grid{grid-template-columns:1fr} }

    .panel{
      background: rgba(2,6,23,0.30);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:14px;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
    }
    @media (max-width: 520px){ .stats{grid-template-columns:1fr} }
    .stat{
      background: rgba(30,41,59,0.62);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:16px;
      padding:12px;
    }
    .stat .k{font-size:11px;color:#94a3b8;font-weight:800; letter-spacing:0.02em}
    .stat .v{font-size:18px;font-weight:950;margin-top:6px;color:#fff}
    .stat .v.gold{color:#fbbf24}

    .log{
      margin-top:12px;
      min-height:64px;
      border-radius:16px;
      padding:12px;
      background: rgba(2,6,23,0.32);
      border:1px solid rgba(255,255,255,0.08);
      color:#cbd5e1;
      font-size:13px;
      line-height:1.48;
    }
    .log b{color:#fff}
    .badge{
      display:inline-flex; align-items:center;
      padding:4px 8px;
      border-radius:999px;
      background: rgba(251,191,36,0.14);
      border:1px solid rgba(251,191,36,0.42);
      color:#fbbf24;
      font-size:12px;
      font-weight:900;
      margin-left:8px;
    }

    /* ===== Slot ===== */
    .slotBox{display:flex; flex-direction:column; gap:12px;}
    .reels{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
      padding:12px;
      background: rgba(30,41,59,0.50);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:18px;
      position:relative;
      overflow:hidden;
    }
    .reels:before{
      content:"";
      position:absolute; inset:-30%;
      background: radial-gradient(circle at 20% 20%, rgba(251,191,36,0.10), transparent 45%),
                  radial-gradient(circle at 80% 60%, rgba(59,130,246,0.08), transparent 55%);
      pointer-events:none;
      filter: blur(2px);
    }
    .reel{
      height:126px;
      display:flex; align-items:center; justify-content:center;
      font-size:60px;
      font-weight:950;
      background: rgba(2,6,23,0.58);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:16px;
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .reelGlow{
      position:absolute; inset:0;
      box-shadow: inset 0 0 22px rgba(251,191,36,0.06);
      pointer-events:none;
    }

    .btnRow{display:flex; gap:10px}
    .btn{
      flex:1;
      border:none;
      cursor:pointer;
      padding:14px 12px;
      border-radius:14px;
      font-weight:950;
      letter-spacing:0.02em;
      transition: transform .08s ease, filter .2s ease, opacity .2s ease;
    }
    .btn:active{transform:scale(0.98)}
    .btn:disabled{opacity:0.55; cursor:not-allowed}
    .btnSpin{
      background:#fbbf24;
      color:#111827;
      filter: drop-shadow(0 10px 20px rgba(251,191,36,0.18));
    }
    .btnGhost{
      background: rgba(30,41,59,0.70);
      color:#e5e7eb;
      border:1px solid rgba(255,255,255,0.12);
    }

    .mini{
      min-height:44px;
      border-radius:16px;
      padding:12px;
      background: rgba(2,6,23,0.30);
      border:1px solid rgba(255,255,255,0.08);
      color:#cbd5e1;
      font-size:13px;
      line-height:1.45;
    }

    .toggles{
      display:flex; gap:10px;
    }
    .toggleBtn{
      flex:1;
      background: rgba(30,41,59,0.55);
      border:1px solid rgba(255,255,255,0.10);
      color:#e5e7eb;
      padding:12px;
      border-radius:14px;
      cursor:pointer;
      font-weight:900;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bgSlide" id="bgA"></div>
  <div class="bgSlide" id="bgB"></div>
  <div class="vignette"></div>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <div class="title">THE UNIQUE SLOT</div>
          <div class="sub">UT / USDT · Premium Game UI</div>
        </div>
        <div class="pill">
          <span class="dot" id="apiDot"></span>
          <span id="apiText">API 상태: 확인중…</span>
        </div>
      </div>

      <div class="grid">
        <!-- LEFT: 상태 -->
        <div class="panel">
          <div class="stats">
            <div class="stat">
              <div class="k">잔액</div>
              <div class="v" id="balText">0 UT</div>
            </div>
            <div class="stat">
              <div class="k">오늘 UT 정산가</div>
              <div class="v gold" id="rateText">0.00 USDT</div>
            </div>
            <div class="stat">
              <div class="k">Free Spin</div>
              <div class="v" id="fsText">0</div>
            </div>
          </div>

          <div style="height:10px"></div>

          <div class="stat">
            <div class="k">Jackpot Pool (USDT)</div>
            <div class="v" id="jackpotText">Loading…</div>
          </div>

          <div class="log" id="log">대기중…</div>
        </div>

        <!-- RIGHT: 슬롯 -->
        <div class="panel slotBox">
          <div class="reels">
            <div class="reel" id="r0">A<div class="reelGlow"></div></div>
            <div class="reel" id="r1">K<div class="reelGlow"></div></div>
            <div class="reel" id="r2">J<div class="reelGlow"></div></div>
          </div>

          <div class="btnRow">
            <button class="btn btnSpin" id="spinBtn">SPIN</button>
            <button class="btn btnGhost" id="syncBtn">SYNC</button>
          </div>

          <div class="toggles">
            <button class="toggleBtn" id="soundBtn">🔊 SOUND ON</button>
            <button class="toggleBtn" id="fxBtn">✨ FX ON</button>
          </div>

          <div class="mini" id="mini">
            Tip: 프리스핀은 “자주 터지게” 세팅 가능. (현재는 서버 룰 그대로)
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio (파일 경로 맞춰서 넣기) -->
  <audio id="sndWhoosh" src="snd/spin_whoosh.mp3" preload="auto"></audio>
  <audio id="sndTick"   src="snd/reel_tick.mp3"   preload="auto"></audio>
  <audio id="sndWin"    src="snd/win_coin.mp3"    preload="auto"></audio>
  <audio id="sndFs"     src="snd/fs_award.mp3"    preload="auto"></audio>

<script>
  // ===============================
  // CONFIG
  // ===============================
  const WORKER_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";
  const BALANCE_KEY = "myUtPoints";
  const DEFAULT_BAL = 1000;

  // 배경 슬라이드(네가 만든 PNG 파일명 넣기)
  const BG_IMAGES = [
    "img/slot/slide1.png",
    "img/slot/slide2.png",
    "img/slot/slide3.png"
  ];
  const BG_INTERVAL_MS = 9000;

  // 릴에 보여줄 심볼(서버 결과가 이것과 다르면 여기 맞춰)
  const SYMBOLS = ["A","K","J","🔥","👑"];

  // ===============================
  // STATE
  // ===============================
  let bet = 10;
  let freeSpins = 0;
  let spinning = false;

  let soundOn = true;
  let fxOn = true;

  const $ = (id) => document.getElementById(id);

  function getBal(){
    const v = Number(localStorage.getItem(BALANCE_KEY));
    return Number.isFinite(v) ? v : DEFAULT_BAL;
  }
  function setBal(v){
    localStorage.setItem(BALANCE_KEY, String(Math.max(0, Math.floor(v))));
    render();
  }

  function getRate(){
    const p = Number(localStorage.getItem("ut_settlement_price"));
    return (Number.isFinite(p) && p > 0) ? p : 0.02;
  }

  function render(){
    $("balText").textContent = `${getBal().toLocaleString()} UT`;
    $("rateText").textContent = `${getRate().toFixed(4)} USDT`;
    $("fsText").textContent = freeSpins.toLocaleString();
  }

  function setApi(ok, msg){
    const dot = $("apiDot");
    dot.classList.remove("ok","bad");
    dot.classList.add(ok ? "ok" : "bad");
    $("apiText").textContent = msg;
  }

  function log(html){ $("log").innerHTML = html; }
  function mini(html){ $("mini").innerHTML = html; }

  function play(id, volume=1){
    if(!soundOn) return;
    const a = $(id);
    if(!a) return;
    a.volume = Math.max(0, Math.min(1, volume));
    try{
      a.currentTime = 0;
      a.play().catch(()=>{});
    }catch(_){}
  }

  // 오디오 잠금 해제(모바일/크롬 정책)
  function unlockAudioOnce(){
    const f = () => {
      ["sndWhoosh","sndTick","sndWin","sndFs"].forEach(id=>{
        const a=$(id); if(!a) return;
        try{ a.volume=0; a.play().then(()=>{a.pause(); a.currentTime=0; a.volume=1;}).catch(()=>{}); }catch(_){}
      });
      window.removeEventListener("pointerdown", f);
    };
    window.addEventListener("pointerdown", f, { once:true });
  }

  // ===============================
  // Background Slideshow
  // ===============================
  let bgIdx = 0;
  let bgFlip = false;
  function setBg(url){
    const A = $("bgA"), B = $("bgB");
    const show = bgFlip ? A : B;
    const hide = bgFlip ? B : A;
    hide.classList.remove("show");
    show.style.backgroundImage = `url("${url}")`;
    requestAnimationFrame(()=> show.classList.add("show"));
    bgFlip = !bgFlip;
  }
  function startBg(){
    if(!BG_IMAGES.length) return;
    setBg(BG_IMAGES[0]);
    setInterval(()=>{
      bgIdx = (bgIdx + 1) % BG_IMAGES.length;
      setBg(BG_IMAGES[bgIdx]);
    }, BG_INTERVAL_MS);
  }

  // ===============================
  // API
  // ===============================
  async function apiGet(path){
    const res = await fetch(WORKER_BASE + path, { method:"GET" });
    return await res.json();
  }
  async function apiPost(path, body){
    const res = await fetch(WORKER_BASE + path, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body || {})
    });
    return await res.json();
  }

  async function sync(){
    try{
      setApi(true, "API 상태: 확인중…");
      const h = await apiGet("/health");
      if(!h || !h.ok) throw new Error("health fail");
      setApi(true, `API 상태: 연결됨 · v ${h.version}`);

      const st = await apiGet("/slot/state");
      if(st && st.ok){
        bet = Number(st.bet || 10);
        $("jackpotText").textContent = `${Number(st.jackpot || 0).toLocaleString()} USDT`;
      }else{
        $("jackpotText").textContent = "Error";
      }

      render();
      log(`준비완료. <b>SPIN</b>을 눌러 시작하세요. ${freeSpins>0?`<span class="badge">FREE x${freeSpins}</span>`:""}`);
    }catch(e){
      console.warn(e);
      setApi(false, "API 상태: 오류");
      $("jackpotText").textContent = "Error";
      log("API 연결 실패. 워커 주소/배포 상태 확인 필요.");
    }
  }

  // ===============================
  // Reel Animation (간단하지만 고급스럽게)
  // ===============================
  function randomSymbol(){ return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)] }

  async function animateSpin(durationMs=900){
    const t0 = performance.now();
    const r0=$("r0"), r1=$("r1"), r2=$("r2");
    return new Promise(resolve=>{
      function step(t){
        const p = Math.min(1, (t - t0) / durationMs);
        if(p < 1){
          if (Math.random() < 0.35) r0.firstChild.nodeValue = randomSymbol();
          if (Math.random() < 0.40) r1.firstChild.nodeValue = randomSymbol();
          if (Math.random() < 0.45) r2.firstChild.nodeValue = randomSymbol();
          requestAnimationFrame(step);
        } else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  function setReels(arr){
    $("r0").firstChild.nodeValue = arr[0] ?? "?";
    $("r1").firstChild.nodeValue = arr[1] ?? "?";
    $("r2").firstChild.nodeValue = arr[2] ?? "?";
  }

  // ===============================
  // SPIN
  // ===============================
  async function spin(){
    if(spinning) return;
    spinning = true;
    $("spinBtn").disabled = true;

    try{
      // 오디오
      play("sndWhoosh", 0.9);

      // 유료/프리 소비(게임 UI용 로컬 처리)
      const usingFree = freeSpins > 0;
      if(usingFree){
        freeSpins -= 1;
        mini(`FREE SPIN 사용! (남은 프리: <b>${freeSpins}</b>)`);
      }else{
        const bal = getBal();
        if(bal < bet){
          alert("잔액이 부족합니다.");
          return;
        }
        setBal(bal - bet);
        mini(`유료 SPIN! (-${bet} UT)`);
      }
      render();

      // 먼저 애니메이션(서버 응답 기다리는 동안)
      await animateSpin(850);

      // 서버 스핀
      const r = await apiPost("/slot/spin", {});
      if(!r || !r.ok) throw new Error(r?.error || "spin fail");

      // 릴 멈춤 타격감(틱 3번)
      play("sndTick", 0.8);
      setReels([r.reel?.[0], $("r1").firstChild.nodeValue, $("r2").firstChild.nodeValue]);
      await new Promise(res=>setTimeout(res, 120));

      play("sndTick", 0.85);
      setReels([r.reel?.[0], r.reel?.[1], $("r2").firstChild.nodeValue]);
      await new Promise(res=>setTimeout(res, 120));

      play("sndTick", 0.9);
      setReels(r.reel || ["?","?","?"]);

      // 풀 업데이트
      $("jackpotText").textContent = `${Number(r.jackpot || 0).toLocaleString()} USDT`;

      // 결과
      const win = Number(r.win || 0);
      let msg = `결과: <b>${(r.reel||[]).join(" ")}</b><br/>`;
      if(win > 0){
        play("sndWin", 0.9);
        msg += `🎉 당첨! <b>${win.toLocaleString()} USDT</b>`;
      }else{
        msg += `아쉽다… 다음 판에!`;
      }
      log(msg);

      // (옵션) 프리스핀 이벤트는 지금 서버/룰에 맞춰서 처리하게 되어있다면,
      // 여기에서 freeSpins 증가 로직을 붙이면 됨.

      render();

    }catch(e){
      console.error(e);
      log(`오류: ${String(e.message || e)}`);
    }finally{
      spinning = false;
      $("spinBtn").disabled = false;
    }
  }

  // ===============================
  // UI Toggle
  // ===============================
  $("soundBtn").addEventListener("click", ()=>{
    soundOn = !soundOn;
    $("soundBtn").textContent = soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
  });
  $("fxBtn").addEventListener("click", ()=>{
    fxOn = !fxOn;
    $("fxBtn").textContent = fxOn ? "✨ FX ON" : "🧊 FX OFF";
  });

  $("spinBtn").addEventListener("click", spin);
  $("syncBtn").addEventListener("click", sync);

  // INIT
  unlockAudioOnce();
  startBg();
  render();
  sync();
</script>
</body>
</html>
