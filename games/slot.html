<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>THE UNIQUE – SLOT v1</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:radial-gradient(circle at top,#1e1b4b,#020617 60%,#000);
  font-family:"Noto Sans KR",sans-serif;
  color:#e5e7eb;
}
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.machine{
  background:rgba(15,23,42,.85);
  border:2px solid #fbbf24;
  border-radius:20px;
  padding:20px;
  width:720px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.title{
  text-align:center;
  font-family:"Cinzel",serif;
  letter-spacing:.2em;
  color:#fbbf24;
  margin-bottom:14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  background:rgba(0,0,0,.4);
  padding:14px;
  border-radius:16px;
}
.cell{
  height:80px;
  border-radius:14px;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
}
.cell.win{
  box-shadow:0 0 20px rgba(251,191,36,.7);
  background:rgba(251,191,36,.12);
}
.hud{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.box{
  flex:1;
  background:rgba(0,0,0,.35);
  padding:10px;
  border-radius:12px;
  font-weight:900;
}
.btn{
  margin-top:14px;
  width:100%;
  height:52px;
  border-radius:16px;
  border:none;
  font-weight:1000;
  letter-spacing:.15em;
  cursor:pointer;
  background:linear-gradient(#fbbf24,#f59e0b);
  color:#0b1120;
}
.btn:disabled{opacity:.6}
.log{
  margin-top:10px;
  font-size:12px;
  color:#94a3b8;
}
.free{
  color:#60a5fa;
  font-weight:900;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="machine">
    <div class="title">THE UNIQUE SLOT</div>

    <div class="grid" id="grid"></div>

    <div class="hud">
      <div class="box">잔액<br><span id="balance">1000</span> UT</div>
      <div class="box">베팅<br>10 UT</div>
      <div class="box">Free Spin<br><span id="fs">0</span></div>
    </div>

    <button class="btn" id="spinBtn">SPIN</button>

    <div class="log" id="log">대기중…</div>
  </div>
</div>

<script>
/* ===== 슬롯 설정 ===== */
const SYMBOLS = ["⚔️","👑","🧙","🔥","💎"];
const PAY = {
  "⚔️":2,
  "👑":4,
  "🧙":6,
  "🔥":8,
  "💎":15
};

/* 확률 – 일부러 후하게 */
const WEIGHT = {
  "⚔️":30,
  "👑":25,
  "🧙":20,
  "🔥":15,
  "💎":10
};

let balance = 1000;
let bet = 10;
let freeSpin = 0;

const grid = document.getElementById("grid");
const log = document.getElementById("log");

/* 초기 셀 */
const cells=[];
for(let i=0;i<5;i++){
  const d=document.createElement("div");
  d.className="cell";
  d.textContent="❓";
  grid.appendChild(d);
  cells.push(d);
}

function weightedRandom(){
  const pool=[];
  for(const k in WEIGHT){
    for(let i=0;i<WEIGHT[k];i++) pool.push(k);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function spin(){
  if(balance<bet && freeSpin===0) return;

  if(freeSpin>0){
    freeSpin--;
    log.innerHTML=`🎁 Free Spin 사용!`;
  }else{
    balance-=bet;
  }

  document.getElementById("balance").textContent=balance;
  document.getElementById("fs").textContent=freeSpin;

  let result=[];
  cells.forEach(c=>{
    c.classList.remove("win");
    const s=weightedRandom();
    c.textContent=s;
    result.push(s);
  });

  let win=0;
  const counts={};
  result.forEach(s=>counts[s]=(counts[s]||0)+1);

  for(const s in counts){
    if(counts[s]>=3){
      win+=counts[s]*PAY[s];
      cells.forEach(c=>{
        if(c.textContent===s) c.classList.add("win");
      });
    }
    if(counts[s]===5 && s==="💎"){
      freeSpin+=5;
      log.innerHTML=`💎 JACKPOT! Free Spin +5`;
    }
  }

  if(win>0){
    balance+=win;
    log.innerHTML=`✨ ${win} UT 획득!`;
  }else{
    log.innerHTML=`😈 꽝… 다시 도전`;
  }

  document.getElementById("balance").textContent=balance;
  document.getElementById("fs").textContent=freeSpin;
}

document.getElementById("spinBtn").onclick=spin;
</script>
</body>
</html>
