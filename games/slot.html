<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>THE UNIQUE SLOT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* (중략) === 너가 올린 CSS 그대로 === */
  </style>

  <!-- ✅ 워커 주소는 "무조건" slot.api.js보다 먼저 -->
  <script>
    window.SLOT_API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";
    // 선택: 로컬에서 바꾸고 싶으면 localStorage도 가능
    // localStorage.setItem("unique_slot_api", window.SLOT_API_BASE);
  </script>

  <!-- ✅ 로드 순서 중요 -->
  <!-- slot.html이 /games/slot.html 이라면 아래 경로가 맞음:  /games/slot/xxx.js -->
  <script src="slot/slot.api.js"></script>
  <script src="slot/slot.audio.js"></script>
  <script src="slot/slot.page.js"></script>
</head>

<body id="bg">
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title">THE UNIQUE SLOT</div>
        <a class="back-main" href="../the-unique-main.html">← MAIN</a>
      </div>

      <div class="layout">
        <div class="info-panel">
          <div class="status-row">
            <div class="status-box">
              <span class="label">PLAYER</span>
              <span class="val" id="playerName">-</span>
            </div>
            <div class="status-box">
              <span class="label">WALLET (UT)</span>
              <span class="val gold" id="walletUt">0</span>
            </div>
          </div>

          <div class="status-row">
            <div class="status-box">
              <span class="label">JACKPOT</span>
              <span class="val" id="jackpotVal">0</span>
            </div>

            <!-- ✅ 라벨 바꾸고 싶으면 여기 텍스트만 -->
            <div class="status-box">
              <span class="label">WIN / BET</span>
              <span class="val gold" id="winVal">0</span>
            </div>
          </div>

          <div class="bet-control">
            <span class="label">BET</span>
            <button class="bet-btn" id="betMinus" type="button">-</button>
            <span class="bet-amount" id="betAmount">10</span>
            <button class="bet-btn" id="betPlus" type="button">+</button>
          </div>

          <div class="hint" id="hintText">로딩중...</div>
          <div class="pay-grid" id="payTable"></div>

          <div style="font-size:11px;color:#64748b;text-align:center;margin-top:10px;">
            가운데 줄(중앙 3칸) 3개 동일 = WIN
          </div>
        </div>

        <div class="slot-stage">
          <div class="screen-bezel">
            <div class="payline" id="payline"></div>
            <div class="reels" id="reels">
              <div class="reel-col"><div class="reel-strip" id="reel0"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel1"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel2"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel3"></div></div>
              <div class="reel-col"><div class="reel-strip" id="reel4"></div></div>
            </div>
            <div class="glass"></div>
          </div>

          <div class="controls-row">
            <button class="auto-btn" id="autoBtn" type="button">
              <div class="auto-spinner">↻</div>
              <span id="autoText">AUTO OFF</span>
            </button>
            <button class="spin-btn" id="spinBtn" type="button">SPIN</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
