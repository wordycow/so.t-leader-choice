<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:#e5e7eb;
      background:#020617;
      overflow-x:hidden;
    }

    .bg{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:-1;
      background:
        radial-gradient(circle at top, rgba(148,163,184,.18), transparent 55%),
        radial-gradient(circle at 20% 90%, rgba(245,158,11,.12), transparent 45%);
    }
    .bg::before{
      content:"";
      position:absolute; inset:-20px;
      background: url("img/slot/slide1.png") center/cover no-repeat;
      opacity:.18;
      filter: blur(2px) saturate(1.15);
      transform: scale(1.03);
    }
    .bg::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(2,6,23,.35), rgba(2,6,23,.95) 65%, rgba(2,6,23,1));
    }

    .wrap{
      max-width: 1140px;
      margin: 54px auto 44px;
      padding: 0 16px;
    }

    .card{
      border-radius: 26px;
      background: rgba(15,23,42,.92);
      border: 1px solid rgba(245,158,11,.85);
      box-shadow: 0 0 26px rgba(245,158,11,.45), 0 30px 90px rgba(0,0,0,.92);
      padding: 18px 18px 18px;
      backdrop-filter: blur(12px);
      position:relative;
      overflow:hidden;
    }

    .marquee{
      position:absolute;
      inset:0;
      opacity:.20;
      mix-blend-mode: screen;
      filter: saturate(1.25) contrast(1.05);
      pointer-events:none;
    }
    .marquee.hidden{display:none}

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 14px;
    }
    .title{
      font-family: "Times New Roman", serif;
      letter-spacing:.18em;
      font-weight:900;
      text-transform:uppercase;
      color:#f8fafc;
      font-size: 22px;
      line-height:1.1;
    }
    .sub{
      margin-top:6px;
      font-size: 11px;
      color:#94a3b8;
      letter-spacing:.08em;
    }

    .right-tools{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      display:flex;
      gap:8px;
      align-items:center;
      padding: 8px 10px;
      border-radius: 999px;
      border:1px solid rgba(148,163,184,.24);
      background: rgba(2,6,23,.45);
      color:#cbd5e1;
      font-size: 12px;
      white-space:nowrap;
      user-select:none;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background:#94a3b8;
      box-shadow:0 0 10px rgba(148,163,184,.35);
    }
    .dot.ok{
      background:#22c55e;
      box-shadow:0 0 14px rgba(34,197,94,.45);
    }

    .pill-btn{
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
    }
    .pill-btn:hover{ transform: translateY(-1px); filter: brightness(1.06); border-color: rgba(248,250,252,.45); }
    .pill-btn:active{ transform: translateY(0); }

    .sound-dot{
      width:10px;height:10px;border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 14px rgba(34,197,94,.45);
    }
    .sound-off .sound-dot{
      background:#ef4444;
      box-shadow:0 0 14px rgba(239,68,68,.45);
    }

    .layout{
      display:grid;
      grid-template-columns: 1.05fr 1.95fr;
      gap: 16px;
      align-items: stretch;
    }

    .panel{
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.45);
      box-shadow: 0 14px 26px rgba(0,0,0,.6);
      padding: 14px;
      min-height: 260px;
      position:relative;
      overflow:hidden;
    }

    .kpi{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .kpi .box{
      border-radius: 14px;
      background: rgba(15,23,42,.7);
      border: 1px solid rgba(148,163,184,.16);
      padding: 10px 12px;
    }
    .kpi .label{
      font-size: 11px;
      color:#94a3b8;
      margin-bottom:6px;
    }
    .kpi .val{
      font-size: 18px;
      font-weight: 900;
      color:#fff;
      letter-spacing:.02em;
    }
    .kpi .val.gold{
      color:#fbbf24;
      text-shadow:0 0 12px rgba(251,191,36,.25);
    }

    .log{
      margin-top: 10px;
      border-radius: 14px;
      padding: 12px 12px;
      background: rgba(2,6,23,.35);
      border: 1px solid rgba(148,163,184,.14);
      color:#cbd5e1;
      font-size: 12px;
      line-height: 1.45;
      min-height: 134px;
      white-space:pre-line;
    }

    .machine{
      height:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .reel-stage{
      flex: 1 1 auto;
      border-radius: 20px;
      background: rgba(15,23,42,.55);
      border: 1px solid rgba(148,163,184,.18);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
      padding: 14px;
      min-height: 420px;
      position:relative;
      overflow:hidden;
    }

    .payline{
      position:absolute;
      left: 14px; right: 14px;
      top: 50%;
      height: 150px;
      transform: translateY(-50%);
      border-radius: 18px;
      border: 1px solid rgba(251,191,36,.30);
      box-shadow: 0 0 26px rgba(251,191,36,.10);
      pointer-events:none;
    }
    .mid3{
      position:absolute;
      top: 50%;
      left: 50%;
      height: 150px;
      transform: translate(-50%, -50%);
      border-radius: 18px;
      border: 1px solid rgba(34,197,94,.30);
      box-shadow: 0 0 30px rgba(34,197,94,.10);
      pointer-events:none;
    }

    :root{
      --cell: 132px;
      --gap: 12px;
      --sym: 112px;
      --rowH: 132px;
    }

    .reels{
      height:100%;
      display:grid;
      grid-template-columns: repeat(5, var(--cell));
      gap: var(--gap);
      justify-content:center;
      align-content:center;
      padding: 6px;
    }

    .reel{
      width: var(--cell);
      height: calc(var(--rowH) * 3 + var(--gap) * 2);
      border-radius: 18px;
      background: rgba(2,6,23,.55);
      border: 1px solid rgba(148,163,184,.16);
      box-shadow: 0 10px 22px rgba(0,0,0,.55);
      overflow:hidden;
      position:relative;
    }
    .reel::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(circle at top, rgba(255,255,255,.08), transparent 60%);
      pointer-events:none;
    }

    .strip{
      position:absolute;
      top:0; left:0; right:0;
      will-change: transform;
    }

    .sym{
      height: var(--rowH);
      display:flex;
      align-items:center;
      justify-content:center;
      border-bottom: 1px solid rgba(148,163,184,.10);
    }
    .sym:last-child{border-bottom:0}

    .sym img{
      width: var(--sym);
      height: var(--sym);
      object-fit:contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.70));
      transform: translateZ(0);
    }

    .spinning .sym img{
      filter: blur(1.4px) brightness(1.08) drop-shadow(0 12px 18px rgba(0,0,0,.75));
    }

    .reel.lock{
      animation: lockPop .22s ease-out;
      border-color: rgba(251,191,36,.45);
      box-shadow: 0 0 28px rgba(251,191,36,.14), 0 10px 22px rgba(0,0,0,.55);
    }
    @keyframes lockPop{
      0%{ transform: scale(1); }
      60%{ transform: scale(1.02); }
      100%{ transform: scale(1); }
    }

    .flash-win{
      animation: winFlash .7s ease-in-out;
    }
    @keyframes winFlash{
      0%{ box-shadow: 0 0 0 rgba(34,197,94,0); }
      40%{ box-shadow: 0 0 70px rgba(34,197,94,.22), 0 30px 90px rgba(0,0,0,.92); }
      100%{ box-shadow: 0 0 0 rgba(34,197,94,0); }
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .btn{
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(148,163,184,.20);
      background: rgba(2,6,23,.35);
      color:#e5e7eb;
      font-weight: 950;
      letter-spacing:.12em;
      cursor:pointer;
      box-shadow: 0 16px 30px rgba(0,0,0,.55);
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
      user-select:none;
      text-transform:uppercase;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.06); border-color: rgba(248,250,252,.45); }
    .btn:active{ transform: translateY(0); }
    .btn.primary{
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color:#0b1120;
      border-color: rgba(245,158,11,.75);
    }
    .btn:disabled{
      cursor:not-allowed;
      opacity:.55;
      transform:none;
    }

    @media (max-width: 1020px){
      :root{ --cell: 118px; --sym: 102px; --rowH: 118px; --gap: 10px; }
      .layout{ grid-template-columns: 1fr; }
    }
    @media (max-width: 640px){
      :root{ --cell: 92px; --sym: 78px; --rowH: 92px; --gap: 8px; }
      .kpi{ grid-template-columns: 1fr; }
      .reel-stage{ min-height: 360px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">
    <div class="card" id="card">
      <img id="marquee" class="marquee" src="img/slot/slide1.png" alt="" onerror="this.classList.add('hidden')">

      <div class="top">
        <div>
          <div class="title">THE UNIQUE SLOT</div>
          <div class="sub">릴이 아래로 확 돌고, 딱 멈추는 “진짜 슬롯” + MP3 사운드</div>
        </div>

        <div class="right-tools">
          <div class="pill">
            <span id="dot" class="dot"></span>
            <span id="apiText">API: 대기</span>
          </div>

          <div id="soundPill" class="pill pill-btn">
            <span class="sound-dot"></span>
            <span id="soundText">SOUND: ON</span>
          </div>
        </div>
      </div>

      <div class="layout">
        <!-- 좌측 -->
        <div class="panel">
          <div class="kpi">
            <div class="box">
              <div class="label">Bet (UT)</div>
              <div class="val gold"><span id="betVal">10</span> UT</div>
            </div>
            <div class="box">
              <div class="label">Jackpot (UT)</div>
              <div class="val"><span id="jpVal">0</span></div>
            </div>
            <div class="box">
              <div class="label">Last Win</div>
              <div class="val gold"><span id="winVal">0</span> UT</div>
            </div>
          </div>

          <div class="log" id="log">불러오는 중...</div>
        </div>

        <!-- 우측 -->
        <div class="panel machine">
          <div class="reel-stage" id="stage">
            <div class="payline"></div>
            <div class="mid3" id="mid3"></div>
            <div class="reels" id="reels"></div>
          </div>

          <div class="controls">
            <button class="btn primary" id="spinBtn">SPIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/** =========================
 *  설정
 * ========================= */
const API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev"; // ✅ Worker 주소
const SOUND_BASE = "sounds/"; // ✅ games/sounds/ 폴더 기준 (slot.html과 같은 폴더 아래)

/** =========================
 *  심볼
 * ========================= */
const SYMBOLS = [
  "star1","star2","star3",
  "pro1","pro2","pro3","pro4","pro5","pro6","pro7","pro8","pro9","pro10"
];
const IMG = (id) => `img/slot/${id}.png`;

/** =========================
 *  DOM
 * ========================= */
const $ = (id) => document.getElementById(id);
const reelsEl = $("reels");
const stageEl = $("stage");
const spinBtn = $("spinBtn");
const betVal = $("betVal");
const jpVal = $("jpVal");
const winVal = $("winVal");
const logEl = $("log");
const dot = $("dot");
const apiText = $("apiText");
const cardEl = $("card");
const marquee = $("marquee");

/** =========================
 *  Player
 * ========================= */
function getPlayer(){
  const u = new URLSearchParams(location.search).get("u");
  if(u){ localStorage.setItem("unique_player", u); return u; }
  const saved = localStorage.getItem("unique_player");
  if(saved) return saved;
  localStorage.setItem("unique_player", "guest");
  return "guest";
}
const PLAYER = getPlayer();

/** =========================
 *  API
 * ========================= */
async function api(path, opt){
  const res = await fetch(`${API_BASE}${path}`, {
    method: opt?.method || "GET",
    headers: { "Content-Type":"application/json" },
    body: opt?.body ? JSON.stringify(opt.body) : undefined
  });
  return await res.json().catch(()=>({ok:false,error:"bad_json"}));
}
function setApiStatus(ok){
  dot.classList.toggle("ok", !!ok);
  apiText.textContent = ok ? "API: 연결됨" : "API: 미연결";
}
function setLog(t){ logEl.textContent = t; }

/** =========================
 *  MP3 사운드 (HTMLAudio)
 *  - GitHub Pages는 대소문자 엄격
 *  - .MP3 / .mp3 둘 다 자동 시도
 * ========================= */
let soundOn = (localStorage.getItem("slot_sound") ?? "on") === "on";
const soundPill = $("soundPill");
const soundText = $("soundText");
function renderSoundUI(){
  soundText.textContent = soundOn ? "SOUND: ON" : "SOUND: OFF";
  soundPill.classList.toggle("sound-off", !soundOn);
  localStorage.setItem("slot_sound", soundOn ? "on" : "off");
}
renderSoundUI();

function makeAudioSmart(filenameBase){
  // filenameBase: "start-button-sound" 같은 “확장자 없는” 이름
  const a = new Audio();
  a.preload = "auto";
  a.crossOrigin = "anonymous";

  const tryList = [
    `${SOUND_BASE}${filenameBase}.MP3`,
    `${SOUND_BASE}${filenameBase}.mp3`,
    `${SOUND_BASE}${filenameBase}` // 혹시 사용자가 확장자까지 파일명에 넣었을 때 대비
  ];

  let idx = 0;
  a.src = tryList[idx];

  a.addEventListener("error", () => {
    idx++;
    if(idx < tryList.length){
      a.src = tryList[idx];
      a.load();
    }
  });

  return a;
}

const SFX = {
  start:   makeAudioSmart("start-button-sound"),
  spin:    makeAudioSmart("spining-sound"),
  stop:    makeAudioSmart("stop-stop-stop-sound"),
  win:     makeAudioSmart("win-sound"),
  lose:    makeAudioSmart("lose-sound"),
  jackpot: makeAudioSmart("jackpot-sound"),
};

SFX.spin.loop = true;

// 볼륨(원하면 숫자만 바꿔)
SFX.start.volume = 0.9;
SFX.spin.volume = 0.65;
SFX.stop.volume = 0.85;
SFX.win.volume = 0.95;
SFX.lose.volume = 0.9;
SFX.jackpot.volume = 1.0;

let audioUnlocked = false;

// 첫 사용자 제스처에서 잠금 해제용
async function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    // 아주 짧게 재생했다가 멈추는 방식(브라우저 정책 대응)
    const a = SFX.start;
    a.currentTime = 0;
    const p = a.play();
    if(p) await p.catch(()=>{});
    a.pause();
    a.currentTime = 0;
  }catch(e){}
}

function stopAllSounds(){
  for(const k of Object.keys(SFX)){
    try{
      SFX[k].pause();
      SFX[k].currentTime = 0;
    }catch(e){}
  }
}

function playOne(a){
  if(!soundOn) return;
  unlockAudio();
  try{
    a.pause();
    a.currentTime = 0;
    const p = a.play();
    if(p) p.catch(()=>{});
  }catch(e){}
}

function startSpinLoop(){
  if(!soundOn) return;
  unlockAudio();
  try{
    const a = SFX.spin;
    // 이미 돌고 있으면 유지
    if(!a.paused) return;
    a.currentTime = 0;
    const p = a.play();
    if(p) p.catch(()=>{});
  }catch(e){}
}
function stopSpinLoop(){
  try{
    const a = SFX.spin;
    a.pause();
    a.currentTime = 0;
  }catch(e){}
}

// stop 사운드(릴 멈출 때 겹침 방지)
let stopCooldown = 0;
function playStop(){
  const now = performance.now();
  if(now < stopCooldown) return;
  stopCooldown = now + 110;
  playOne(SFX.stop);
}

soundPill.addEventListener("click", async () => {
  soundOn = !soundOn;
  renderSoundUI();
  if(!soundOn){
    stopAllSounds();
  }else{
    await unlockAudio();
  }
});

/** =========================
 *  Marquee (slide1~8)
 * ========================= */
let marqueeIdx = 1;
let marqueeTimer = null;
function startMarquee(){
  if(!marquee || marquee.classList.contains("hidden")) return;
  stopMarquee();
  marqueeTimer = setInterval(() => {
    marqueeIdx++;
    if(marqueeIdx > 8) marqueeIdx = 1;
    marquee.src = `img/slot/slide${marqueeIdx}.png`;
  }, 90);
}
function stopMarquee(){
  if(marqueeTimer) clearInterval(marqueeTimer);
  marqueeTimer = null;
  marqueeIdx = 1;
  if(marquee && !marquee.classList.contains("hidden")){
    marquee.src = "img/slot/slide1.png";
  }
}

/** =========================
 *  Reel Engine
 * ========================= */
const ROWS = 3, COLS = 5;
const BUFFER = 10;

const reels = [];
function randSym(){
  return SYMBOLS[(Math.random()*SYMBOLS.length)|0];
}
function setSym(imgEl, sym){
  imgEl.src = IMG(sym);
  imgEl.dataset.sym = sym;
}

function buildReels(){
  reelsEl.innerHTML = "";
  reels.length = 0;

  const mid3El = $("mid3");
  if(mid3El){
    mid3El.style.width = "calc(var(--cell) * 3 + var(--gap) * 2 + 18px)";
  }

  for(let c=0;c<COLS;c++){
    const reelEl = document.createElement("div");
    reelEl.className = "reel";

    const stripEl = document.createElement("div");
    stripEl.className = "strip";
    reelEl.appendChild(stripEl);

    const totalItems = ROWS + BUFFER;
    for(let i=0;i<totalItems;i++){
      const sym = document.createElement("div");
      sym.className = "sym";
      const img = document.createElement("img");
      img.alt = "symbol";
      setSym(img, randSym());
      sym.appendChild(img);
      stripEl.appendChild(sym);
    }

    reelsEl.appendChild(reelEl);

    reels.push({
      reelEl, stripEl,
      offset: 0,
      speed: 24 + c*2,
      timer: null,
      running: false
    });
  }
}
buildReels();

function getRowH(){
  const v = getComputedStyle(document.documentElement).getPropertyValue("--rowH").trim();
  const n = parseFloat(v.replace("px",""));
  return isNaN(n) ? 132 : n;
}

function startReel(reel, baseSpeed){
  reel.running = true;
  reel.speed = baseSpeed;
  const rowH = getRowH();

  const tick = () => {
    if(!reel.running) return;

    reel.offset += reel.speed; // 아래로 이동(+) => 아래로 굴러감
    reel.stripEl.style.transform = `translateY(${reel.offset}px)`;

    while(reel.offset >= rowH){
      reel.offset -= rowH;

      const last = reel.stripEl.lastElementChild;
      reel.stripEl.insertBefore(last, reel.stripEl.firstElementChild);

      const img = last.querySelector("img");
      setSym(img, randSym());

      reel.stripEl.style.transform = `translateY(${reel.offset}px)`;
    }

    reel.timer = requestAnimationFrame(tick);
  };

  reel.timer = requestAnimationFrame(tick);
}

function stopReelToResult(reel, col, finalGrid){
  reel.running = false;
  if(reel.timer) cancelAnimationFrame(reel.timer);
  reel.timer = null;

  reel.offset = 0;
  reel.stripEl.style.transform = `translateY(0px)`;

  const stripChildren = reel.stripEl.children;

  // 맨 위 3칸이 결과
  for(let r=0;r<ROWS;r++){
    const symDiv = stripChildren[r];
    const img = symDiv.querySelector("img");
    setSym(img, finalGrid[r][col]);
  }
  // 나머지 랜덤
  for(let i=ROWS;i<stripChildren.length;i++){
    const img = stripChildren[i].querySelector("img");
    setSym(img, randSym());
  }

  reel.reelEl.classList.remove("lock");
  void reel.reelEl.offsetWidth;
  reel.reelEl.classList.add("lock");
}

/** =========================
 *  상태 SYNC (자동)
 * ========================= */
async function sync(){
  setLog("SYNC 중...");
  const st = await api("/slot/state");
  if(!st?.ok){
    setApiStatus(false);
    setLog(`API 연결 실패\n${st?.error || "unknown"}`);
    return;
  }
  setApiStatus(true);

  betVal.textContent = (st.bet ?? 10);
  jpVal.textContent = (st.jackpot ?? 0);

  setLog(
`준비 완료
- Player: ${PLAYER}
- Jackpot: ${st.jackpot ?? 0} UT
- Version: ${st.version ?? "-"}`
  );
}
sync();

/** =========================
 *  SPIN
 * ========================= */
let spinning = false;

spinBtn.addEventListener("click", async () => {
  if(spinning) return;

  // 사용자 제스처로 오디오 언락
  await unlockAudio();

  spinning = true;
  spinBtn.disabled = true;
  winVal.textContent = "0";
  cardEl.classList.remove("flash-win");

  stageEl.classList.add("spinning");
  reels.forEach(r => r.reelEl.classList.remove("lock"));

  // ✅ 버튼 시작 사운드
  playOne(SFX.start);

  // ✅ 마퀴/스핀 루프 사운드
  startMarquee();
  startSpinLoop();

  // 릴 먼저 확 돌리고
  reels.forEach((reel, idx) => startReel(reel, 45 + idx*3));

  setLog("SPIN 요청 중...");
  const result = await api("/slot/spin", { method:"POST", body:{ player: PLAYER } });

  if(!result?.ok){
    setApiStatus(false);

    // 릴 중지
    stageEl.classList.remove("spinning");
    reels.forEach(reel => { reel.running=false; if(reel.timer) cancelAnimationFrame(reel.timer); reel.timer=null; });

    // ✅ 스핀 루프 중지 + 꽝(에러) 사운드
    stopSpinLoop();
    stopMarquee();
    playOne(SFX.lose);

    const err = result?.error || "unknown";
    setLog(`SPIN 실패\n${err}`);

    if(String(err).toLowerCase().includes("missing_user")){
      setLog(
`SPIN 실패
missing_user

해결:
1) ?u=닉네임 으로 접속하거나
2) 멤버홀 닉네임을 slot으로 넘겨주면 됨`
      );
    }

    spinning = false;
    spinBtn.disabled = false;
    return;
  }

  setApiStatus(true);

  const finalGrid = result.grid; // [3][5]
 // ✅ 원하는 타임라인: 총 10초 스핀, 7초부터 릴 1개씩 멈춤
const TOTAL_SPIN_MS = 10000;
const STOP_START_MS = 7000;   // 7초부터 멈추기 시작
const STOP_STEP_MS  = 650;    // 릴 간 멈춤 간격(원하면 500~800 사이로 조절)

// (선택) 멈추기 직전에 감속 느낌 주기
const SLOW1_BEFORE = 700; // 멈추기 0.7초 전 1차 감속
const SLOW2_BEFORE = 350; // 멈추기 0.35초 전 2차 감속

const stopTimes = Array.from({length: COLS}, (_, i) => STOP_START_MS + i * STOP_STEP_MS);

// ✅ 감속 → 정지(릴별)
stopTimes.forEach((t, col) => {
  // 1차 감속
  setTimeout(() => {
    if(reels[col] && reels[col].running) reels[col].speed = 14; // 느려짐
  }, Math.max(0, t - SLOW1_BEFORE));

  // 2차 감속
  setTimeout(() => {
    if(reels[col] && reels[col].running) reels[col].speed = 8; // 더 느려짐
  }, Math.max(0, t - SLOW2_BEFORE));

  // 최종 정지 + 결과 적용
  setTimeout(() => {
    stopReelToResult(reels[col], col, finalGrid);
    playStop();
  }, t);
});

// ✅ 마무리는 “무조건 10초”에 맞춰서 끝내기
setTimeout(() => {
  stageEl.classList.remove("spinning");
  stopSpinLoop();
  stopMarquee();

  if(result.bet != null) betVal.textContent = result.bet;
  if(result.jackpot != null) jpVal.textContent = result.jackpot;

  const win = (result?.result?.win ?? "0");
  const winType = (result?.result?.winType ?? "none");
  const sym = (result?.result?.symbol ?? "-");
  const mul = (result?.result?.multiplier ?? 0);

  winVal.textContent = win;

  setLog(
`RESULT
- type: ${winType}
- symbol: ${sym}
- x${mul}
- win: ${win} UT
- jackpot: ${result.jackpot ?? jpVal.textContent} UT`
  );

  const isJackpot = String(winType).toLowerCase().includes("jackpot");
  const isWin = (String(win) !== "0" && winType !== "none");

  if(isJackpot){
    cardEl.classList.add("flash-win");
    playOne(SFX.jackpot);
  } else if(isWin){
    cardEl.classList.add("flash-win");
    playOne(SFX.win);
  } else {
    playOne(SFX.lose);
  }

  spinning = false;
  spinBtn.disabled = false;
}, TOTAL_SPIN_MS);
});
</script>
</body>
</html>
