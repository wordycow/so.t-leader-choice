<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <style>
    /* =========================================
       THE "CYBERPUNK NEON VAULT" THEME
       CSS Overhaul by AI
    ========================================= */

    :root {
        /* Core Theme Colors (Neon & Metallic) */
        --neon-blue: #00f2ff;
        --neon-purple: #bc13fe;
        --neon-pink: #ff0055;
        --neon-gold: #ffd700;
        --metallic-dark: #1a1a2e;
        --bg-dark-deep: #05050c;

        /* Dimensions */
        --cell-w: 150px;
        --cell-h: 112px;
        --gap: 14px;
        --reel-h: calc(var(--cell-h) * 3 + var(--gap) * 2);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    /* Body Font & Color */
    body {
        font-family: "Montserrat", system-ui, -apple-system, sans-serif; /* 좀 더 모던한 폰트 권장 */
        color: #e0e0ff;
        background: var(--bg-dark-deep);
        overflow-x: hidden;
    }

    /* ================= Background ================= */
    .bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        /* Deep Cyberpunk Gradient Background */
        background:
            radial-gradient(circle at 50% 20%, rgba(188, 19, 254, 0.2), transparent 60%), /* Purple top glow */
            radial-gradient(circle at 20% 80%, rgba(0, 242, 255, 0.15), transparent 50%), /* Blue bottom-left glow */
            linear-gradient(180deg, #0a0a16 0%, #020205 100%); /* Base dark */
        overflow: hidden;
    }

    /* Background Image Overlay */
    .bg::before {
        content: "";
        position: absolute; inset: 0;
        background-image: var(--bgimg, none);
        background-size: cover;
        background-position: center;
        /* More dramatic blending */
        filter: blur(15px) brightness(0.4) saturate(1.5);
        mix-blend-mode: overlay;
        opacity: 0.6;
        transform: scale(1.1);
        transition: opacity .55s ease, filter .55s ease;
    }
    .bg.flash::before {
        opacity: 0.9;
        filter: blur(5px) brightness(1.2) saturate(2);
        mix-blend-mode: screen;
    }
    .bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.8) 90%);
        z-index: -1;
        pointer-events: none;
    }

    .wrap {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
    }

    /* ================= Main Machine Card (The Frame) ================= */
    .card {
        border-radius: 36px;
        /* Metallic body gradient */
        background: linear-gradient(160deg, #3a3a5e, #131324 40%, #0a0a12);
        position: relative;
        overflow: visible; /* Allow glows to spill out */
        padding: 30px;

        /* THE NEON BEZEL EFFECT - Layered shadows for depth and glow */
        border: none;
        box-shadow:
            /* Inner metallic rim */
            inset 0 2px 3px rgba(255,255,255,0.3),
            inset 0 -2px 5px rgba(0,0,0,0.8),
            /* The glowing strip */
            0 0 0 4px #000, /* Black insulator */
            0 0 0 8px var(--neon-purple), /* Main neon color */
            0 0 30px var(--neon-purple), /* Outer glow */
            0 0 60px var(--neon-blue); /* Secondary outer glow */
        transition: box-shadow 0.3s ease;
    }
    /* Slight pulsing glow */
    .card:hover {
         box-shadow:
            inset 0 2px 3px rgba(255,255,255,0.3),
            inset 0 -2px 5px rgba(0,0,0,0.8),
            0 0 0 4px #000,
            0 0 0 8px var(--neon-pink), /* Color shift on hover */
            0 0 40px var(--neon-pink),
            0 0 80px var(--neon-purple);
    }


    /* ================= Top Section (Title & Status) ================= */
    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(0, 242, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0, 242, 255, 0.1);
    }

    .title {
        font-family: "Times New Roman", serif; /* Keep original as requested, or suggest changing */
        letter-spacing: .1em;
        font-weight: 900;
        text-transform: uppercase;
        font-size: 32px;
        line-height: 1;
        /* Gold/Neon text effect */
        color: var(--neon-gold);
        text-shadow:
            0 0 5px var(--neon-gold),
            0 0 20px var(--neon-pink),
            2px 2px 2px rgba(0,0,0,0.8);
    }
    .sub {
        margin-top: 8px;
        font-size: 12px;
        color: var(--neon-blue);
        letter-spacing: .08em;
        opacity: 0.8;
        text-shadow: 0 0 5px var(--neon-blue);
    }

    .status-wrap { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }

    /* Glowing Pills */
    .status-pill, .sound-btn {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 14px;
        border-radius: 999px;
        /* Glassy neon look */
        border: 1px solid var(--neon-blue);
        background: rgba(0, 242, 255, 0.1);
        box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2), 0 0 10px rgba(0, 242, 255, 0.2);
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
        text-shadow: 0 0 5px var(--neon-blue);
        transition: all 0.3s ease;
    }
    .sound-btn { cursor: pointer; user-select: none; }
    .sound-btn:hover { background: rgba(0, 242, 255, 0.2); box-shadow: 0 0 15px var(--neon-blue); }

    .dot, .sound-btn .s-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #555;
        box-shadow: 0 0 5px #555;
        transition: all 0.3s ease;
    }
    .dot.ok, .sound-btn .s-dot {
        background: #0f0;
        box-shadow: 0 0 10px #0f0, 0 0 20px #0f0; /* Stronger green glow */
    }
    .sound-btn.off .s-dot {
        background: #f00;
        box-shadow: 0 0 10px #f00, 0 0 20px #f00; /* Stronger red glow */
        border-color: var(--neon-pink);
    }
    .sound-btn.off {
        border-color: var(--neon-pink);
        color: var(--neon-pink);
        text-shadow: 0 0 5px var(--neon-pink);
        box-shadow: inset 0 0 10px rgba(255, 0, 85, 0.2), 0 0 10px rgba(255, 0, 85, 0.2);
    }


    /* ================= Layout & Panels ================= */
    .layout {
        display: grid;
        grid-template-columns: 300px 1fr; /* Fixed width for left panel */
        gap: 25px;
        align-items: stretch;
    }

    .panel {
        border-radius: 24px;
        /* Darker, recessed panel look */
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(0, 242, 255, 0.15);
        box-shadow:
            inset 0 0 20px rgba(0,0,0,0.9), /* Deep inset shadow */
            0 5px 15px rgba(0,0,0,0.5);
        padding: 20px;
    }

    /* ================= Left Panel (KPI & Log) ================= */
    .kpi {
        display: flex;
        flex-direction: column; /* Stack vertically on the left */
        gap: 15px;
        margin-bottom: 20px;
    }
    .kpi .box {
        border-radius: 16px;
        /* Glowing digital readout look */
        background: linear-gradient(90deg, rgba(0, 242, 255, 0.05), transparent);
        border: 1px solid var(--neon-blue);
        box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.1);
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .kpi .label {
        font-size: 11px;
        color: var(--neon-blue);
        margin-bottom: 0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .kpi .val {
        font-size: 20px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    /* Gold value with strong glow */
    .kpi .val.gold {
        color: var(--neon-gold);
        text-shadow:
            0 0 10px var(--neon-gold),
            0 0 20px var(--neon-gold);
    }

    .log {
        border-radius: 16px;
        padding: 15px;
        /* Retro terminal look */
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(0, 242, 255, 0.3);
        color: var(--neon-blue);
        font-family: "Courier New", monospace; /* Terminal font */
        font-size: 11px;
        line-height: 1.5;
        min-height: 150px;
        white-space: pre-line;
        box-shadow: inset 0 0 15px rgba(0,0,0,1);
        text-shadow: 0 0 2px var(--neon-blue);
    }


    /* ================= Right Panel (Slot Stage) ================= */
    .slot-stage {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 100%;
        background: rgba(0,0,0,0.4); /* Slightly lighter than left panel */
        border-color: rgba(188, 19, 254, 0.3); /* Purple tint border */
    }

    /* The Screen Area */
    .grid-wrap {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        /* The main glowing screen */
        background: #000;
        border: 3px solid var(--neon-purple);
        box-shadow:
            inset 0 0 40px rgba(188, 19, 254, 0.5), /* Inner purple glow */
            0 0 20px rgba(188, 19, 254, 0.3); /* Outer halo */
        padding: 20px;
        position: relative;
        overflow: hidden;
    }
    /* Scanline effect overlay */
    .grid-wrap::after {
        content: ""; position: absolute; inset:0;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 4px);
        pointer-events: none; z-index: 10; opacity: 0.5;
    }

    /* Reels */
    .reels {
        display: grid;
        grid-template-columns: repeat(5, var(--cell-w));
        gap: var(--gap);
        align-items: center;
        justify-content: center;
        z-index: 2; /* Above paylines */
    }

    .reel-window {
        width: var(--cell-w);
        height: var(--reel-h);
        overflow: hidden;
        border-radius: 12px;
        border: none;
        /* Glassy dark window */
        background: rgba(0,0,0,0.7);
        box-shadow:
            inset 0 10px 20px rgba(255,255,255,0.1), /* Top reflection */
            inset 0 -10px 20px rgba(0,0,0,0.5); /* Bottom shadow */
        position: relative;
        /* Thin neon separator lines between reels */
        border-right: 1px solid rgba(0, 242, 255, 0.2);
        border-left: 1px solid rgba(0, 242, 255, 0.2);
    }

    .reel-strip {
        position: absolute; left: 0; top: 0;
        width: 100%; display: flex; flex-direction: column; gap: var(--gap);
        will-change: transform; transform: translateY(0px);
    }

    .reel-item {
        height: var(--cell-h);
        border-radius: 8px;
        background: transparent; /* Remove background specifically */
        border: none;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; position: relative;
    }
    .reel-item::after { display: none; } /* Remove old highlight */

    .reel-item img {
        width: 110px; /* Slightly larger */
        height: 110px;
        object-fit: contain;
        /* Glowing symbols */
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        transform: translateZ(0);
        transition: filter 0.3s ease;
    }

    .spinning .reel-item img {
        /* Motion blur with neon streaks */
        filter: blur(3px) brightness(1.3) drop-shadow(0 5px 20px rgba(0, 242, 255, 0.8));
        transform: scale(1.05);
    }

    .snap .reel-strip { transition: transform .14s cubic-bezier(0.175, 0.885, 0.32, 1.275); } /* Bouncier snap */

    /* Paylines & Highlight */
    .payline {
        /* Sharper, brighter laser line */
        border: 2px solid var(--neon-gold);
        box-shadow: 0 0 20px var(--neon-gold), inset 0 0 10px var(--neon-gold);
        background: rgba(255, 215, 0, 0.1);
        opacity: 0.6;
        z-index: 1;
    }

    .mid3 {
        /* Brighter central highlight area */
        border: 2px solid var(--neon-blue);
        box-shadow: 0 0 30px var(--neon-blue), inset 0 0 20px rgba(0, 242, 255, 0.3);
        background: radial-gradient(ellipse at center, rgba(0, 242, 255, 0.2) 0%, transparent 70%);
        z-index: 1;
    }

    /* ================= Controls (The BIG Button) ================= */
    .controls {
        display: grid; grid-template-columns: 1fr; gap: 10px;
        padding: 0 20px;
    }
    .btn {
        height: 68px; /* Taller button */
        border-radius: 18px;
        color: #fff;
        font-weight: 1000;
        font-size: 24px; /* Larger font */
        letter-spacing: .14em;
        cursor: pointer;
        user-select: none;
        transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        border: none;
    }

    /* 3D Neon Spin Button */
    .btn.primary {
        /* Gold to Orange Gradient */
        background: linear-gradient(to bottom, #ffec00 0%, #ffa600 100%);
        color: #3a2300; /* Dark text for contrast */
        text-shadow: 1px 1px 1px rgba(255,255,255,0.7);

        /* 3D Depth and Glow */
        box-shadow:
            0 8px 0 #b37700, /* The dark 3D side */
            0 15px 25px rgba(0,0,0,0.7), /* Drop shadow */
            0 0 30px var(--neon-gold), /* Gold glow */
            inset 0 2px 3px rgba(255,255,255,0.6); /* Top shine */
    }
    .btn.primary::before {
        content:""; position: absolute; inset: 4px; border: 2px solid rgba(255,255,255,0.4); border-radius: 14px; pointer-events: none;
    }

    .btn:hover {
        filter: brightness(1.15);
        transform: translateY(-2px);
        box-shadow: 0 10px 0 #b37700, 0 20px 35px rgba(0,0,0,0.8), 0 0 50px var(--neon-gold);
    }
    .btn:active {
        /* Press down effect */
        transform: translateY(6px);
        box-shadow: 0 2px 0 #b37700, 0 5px 10px rgba(0,0,0,0.9), 0 0 20px var(--neon-gold);
    }
    .btn:disabled {
        filter: grayscale(0.8) brightness(0.6);
        cursor: not-allowed;
        transform: translateY(6px);
        box-shadow: 0 2px 0 #333, 0 5px 10px rgba(0,0,0,0.9);
        color: #777;
    }

    /* ================= Responsive ================= */
    @media (max-width: 980px) {
        :root { --cell-w: 120px; --cell-h: 96px; --gap: 12px; }
        .layout { grid-template-columns: 1fr; /* Stack panels */ }
        .kpi { flex-direction: row; /* Horizontal KPI on mobile */ }
        .kpi .box { flex: 1; flex-direction: column; align-items: flex-start; gap: 5px; }
        .kpi .val { font-size: 16px; }
        .reel-item img { width: 90px; height: 90px; }
        .card { padding: 20px; }
        .btn { height: 60px; font-size: 20px; }
    }
    @media (max-width: 640px) {
        :root { --cell-w: 90px; --cell-h: 78px; --gap: 8px; }
        .reel-item img { width: 70px; height: 70px; }
        .title { font-size: 24px; }
        .kpi .label { font-size: 9px; }
    }
</style>
</head>

<body>
  <div class="bg" id="bg"><div class="bg-vignette"></div></div>

  <div class="wrap">
    <div class="card" id="card">
      <div class="top">
        <div>
          <div class="title">THE UNIQUE SLOT</div>
          <div class="sub">PC: 5릴×3행 · Mobile: 3열×5행 · 총 10초 스핀 · 7초부터 순차 정지</div>
        </div>

        <div class="status-wrap">
          <div class="status-pill">
            <span id="dot" class="dot"></span>
            <span id="apiText">API: 대기</span>
          </div>
          <button class="sound-btn" id="soundBtn" type="button">
            <span class="s-dot"></span>
            <span id="soundText">SOUND: ON</span>
          </button>
        </div>
      </div>

      <div class="layout">
        <!-- 좌측 -->
        <div class="panel">
          <div class="kpi">
            <div class="box">
              <div class="label">Bet (UT)</div>
              <div class="val gold"><span id="betVal">10</span> UT</div>
            </div>
            <div class="box">
              <div class="label">Jackpot (UT)</div>
              <div class="val"><span id="jpVal">0</span></div>
            </div>
            <div class="box">
              <div class="label">Last Win</div>
              <div class="val gold"><span id="winVal">0</span> UT</div>
            </div>
          </div>

          <div class="log" id="log">READY</div>
        </div>

        <!-- 우측 -->
        <div class="panel slot-stage">
          <div class="grid-wrap" id="gridWrap">
            <div class="payline"></div>
            <div class="mid3"></div>
            <div class="reels" id="reels"></div>
          </div>

          <div class="controls">
            <button class="btn primary" id="spinBtn">SPIN</button>
          </div>

          <!-- ✅ 하단 족보(페이테이블) -->
          <div class="panel paytable" id="paytable">
            <div class="pay-title">
              <div class="h">PAYTABLE</div>
              <div class="hint">3개 일치 기준(서버 룰에 따라 실제 배당은 변경 가능)</div>
            </div>
            <div class="pay-grid" id="payGrid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/** =========================
 *  설정
 * ========================= */
const API_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";

/** =========================
 *  slides (games/img/slot/slide1.png ~ slide8.png)
 * ========================= */
const SLIDES = Array.from({length:8}, (_,i)=> `img/slot/slide${i+1}.png`);
const bgEl = document.getElementById("bg");
function setRandomSlide(flash=true){
  const pick = SLIDES[(Math.random()*SLIDES.length)|0];
  bgEl.style.setProperty("--bgimg", `url("${pick}")`);
  if(flash){
    bgEl.classList.add("flash");
    setTimeout(()=>bgEl.classList.remove("flash"), 420);
  }
}

/** =========================
 *  심볼/이미지 (games/img/slot/*.png)
 * ========================= */
const SYMBOLS = [
  "star1","star2","star3",
  "pro1","pro2","pro3","pro4","pro5","pro6","pro7","pro8","pro9","pro10"
];
const IMG = (id) => `img/slot/${id}.png`;

/** =========================
 *  페이테이블(족보) - “이미지처럼” 카드로 렌더
 *  (실제 배당은 API 룰이 최종이니 여기 숫자는 연출용)
 * ========================= */
const PAYTABLE = [
  { id:"star1", label:"STAR I",  mul:"x1" },
  { id:"star2", label:"STAR II", mul:"x2" },
  { id:"star3", label:"STAR III",mul:"x3" },
  { id:"pro1",  label:"PRO I",   mul:"x4" },
  { id:"pro2",  label:"PRO II",  mul:"x5" },
  { id:"pro3",  label:"PRO III", mul:"x6" },
  { id:"pro4",  label:"PRO IV",  mul:"x7" },
  { id:"pro5",  label:"PRO V",   mul:"x8" },
  { id:"pro6",  label:"PRO VI",  mul:"x9" },
  { id:"pro7",  label:"PRO VII", mul:"x10" },
  { id:"pro8",  label:"PRO VIII",mul:"x12" },
  { id:"pro9",  label:"PRO IX",  mul:"x15" },
  { id:"pro10", label:"PRO X",   mul:"x20" }
];

function renderPaytable(){
  const grid = document.getElementById("payGrid");
  grid.innerHTML = "";
  PAYTABLE.forEach(p=>{
    const card = document.createElement("div");
    card.className = "pay-card";
    const img = document.createElement("img");
    img.src = IMG(p.id);
    img.alt = p.label;

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = p.label;

    const mul = document.createElement("div");
    mul.className = "mul";
    mul.textContent = p.mul;

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(mul);
    grid.appendChild(card);
  });
}
renderPaytable();

/** =========================
 *  DOM
 * ========================= */
const $ = (id) => document.getElementById(id);
const reelsEl = $("reels");
const gridWrap = $("gridWrap");
const spinBtn = $("spinBtn");

const betVal = $("betVal");
const jpVal = $("jpVal");
const winVal = $("winVal");
const logEl = $("log");
const dot = $("dot");
const apiText = $("apiText");

const soundBtn = $("soundBtn");
const soundText = $("soundText");

function setLog(t){ logEl.textContent = t; }
function setApiStatus(ok){
  dot.classList.toggle("ok", !!ok);
  apiText.textContent = ok ? "API: 연결됨" : "API: 미연결";
}

/** =========================
 *  닉네임 연동 강화
 *  - URL ?u= 우선
 *  - 없으면 localStorage 여러 키 탐색
 * ========================= */
const PLAYER_KEYS = [
  "slot_player",
  "nickname","user","player","guest","username",
  "so_t_nickname","soTNickname","sot_nickname",
  "so.t_nickname","the_unique_nickname","unique_nickname"
];

function readPlayerFromStorage(){
  for(const k of PLAYER_KEYS){
    const v = (localStorage.getItem(k) || "").trim();
    if(v) return v;
  }
  return "";
}
function savePlayerAllKeys(v){
  try{
    localStorage.setItem("slot_player", v);
    // 기존 시스템이 쓰는 키도 같이 채워주기 (연동 체감 ↑)
    localStorage.setItem("nickname", v);
    localStorage.setItem("user", v);
    localStorage.setItem("player", v);
  }catch(e){}
}

function getPlayer(askIfMissing=false){
  const qs = new URLSearchParams(location.search);
  const u = (qs.get("u") || qs.get("user") || qs.get("player") || qs.get("nickname") || "").trim();
  if(u){
    savePlayerAllKeys(u);
    return u;
  }

  const saved = readPlayerFromStorage();
  if(saved) return saved;

  if(!askIfMissing) return "";
  const p = prompt("닉네임(플레이어)을 입력하세요", "yusong");
  if(p && p.trim()){
    savePlayerAllKeys(p.trim());
    return p.trim();
  }
  return "";
}

/** =========================
 *  API
 * ========================= */
async function api(path, opt){
  try{
    const res = await fetch(`${API_BASE}${path}`, {
      method: opt?.method || "GET",
      headers: { "Content-Type":"application/json" },
      body: opt?.body ? JSON.stringify(opt.body) : undefined
    });
    return await res.json().catch(()=>({ok:false,error:"bad_json"}));
  }catch(e){
    return { ok:false, error:String(e?.message || e) };
  }
}

/** =========================
 *  사운드 (mp3/MP3 fallback)
 * ========================= */
function makeAudio(candidates, {loop=false, volume=1}={}){
  let idx = 0;
  const a = new Audio(candidates[idx]);
  a.preload = "auto";
  a.loop = loop;
  a.volume = volume;
  a.addEventListener("error", () => {
    if(idx < candidates.length - 1){
      idx++;
      a.src = candidates[idx];
      a.load();
    }
  });
  return a;
}

const SFX = {
  start: makeAudio(["sounds/start-button-sound.mp3","sounds/start-button-sound.MP3"], {volume:0.9}),
  spin:  makeAudio(["sounds/spining-sound.mp3","sounds/spining-sound.MP3"], {loop:true, volume:0.9}),
  stop:  makeAudio(["sounds/stop-stop-stop-sound.mp3","sounds/stop-stop-stop-sound.MP3"], {volume:0.9}),
  win:   makeAudio(["sounds/win-sound.mp3","sounds/win-sound.MP3"], {volume:1.0}),
  lose:  makeAudio(["sounds/lose-sound.mp3","sounds/lose-sound.MP3"], {volume:1.0}),
  jackpot: makeAudio(["sounds/jackpot-sound.mp3","sounds/jackpot-sound.MP3"], {volume:1.0}),
};

let SOUND_ON = (localStorage.getItem("slot_sound") ?? "on") !== "off";
function renderSound(){
  soundBtn.classList.toggle("off", !SOUND_ON);
  soundText.textContent = SOUND_ON ? "SOUND: ON" : "SOUND: OFF";
  localStorage.setItem("slot_sound", SOUND_ON ? "on" : "off");
  if(!SOUND_ON) stopSpinLoop();
}
renderSound();

soundBtn.addEventListener("click", () => {
  SOUND_ON = !SOUND_ON;
  renderSound();
});

let AUDIO_UNLOCKED = false;
function unlockAudio(){
  if(AUDIO_UNLOCKED) return;
  AUDIO_UNLOCKED = true;
  Object.values(SFX).forEach(a=>{
    try{
      const v = a.volume;
      a.volume = 0.001;
      a.play().then(()=>{
        a.pause(); a.currentTime = 0; a.volume = v;
      }).catch(()=>{ a.volume = v; });
    }catch(e){}
  });
}
function playOne(aud){
  if(!SOUND_ON) return;
  try{ aud.pause(); aud.currentTime = 0; aud.play(); }catch(e){}
}
function startSpinLoop(){
  if(!SOUND_ON) return;
  try{ SFX.spin.currentTime = 0; SFX.spin.play(); }catch(e){}
}
function stopSpinLoop(){
  try{ SFX.spin.pause(); SFX.spin.currentTime = 0; }catch(e){}
}

/** =========================
 *  Reel UI 만들기
 *  - PC: 5개의 “세로 릴”
 *  - Mobile: 5개의 “가로 릴”(= 3열×5행)
 * ========================= */
const REELS = 5;
const BUFFER = 14;

function randSym(){
  return SYMBOLS[(Math.random()*SYMBOLS.length)|0];
}
function makeItem(sym){
  const div = document.createElement("div");
  div.className = "reel-item";
  const img = document.createElement("img");
  img.alt = sym;
  img.src = IMG(sym);
  div.appendChild(img);
  return div;
}

const reels = []; // {window, strip, raf, running, offset, speed, stepPx, axis}

function isMobileLayout(){
  return window.matchMedia("(max-width: 640px)").matches;
}

function buildReels(){
  reelsEl.innerHTML = "";
  reels.length = 0;

  const axis = isMobileLayout() ? "x" : "y"; // 모바일은 가로 스트립, PC는 세로 스트립

  for(let i=0;i<REELS;i++){
    const win = document.createElement("div");
    win.className = "reel-window";

    const strip = document.createElement("div");
    strip.className = "reel-strip";

    for(let k=0;k<BUFFER;k++){
      strip.appendChild(makeItem(randSym()));
    }
    // 보이는 3개 초기(연출)
    strip.appendChild(makeItem("star1"));
    strip.appendChild(makeItem("star1"));
    strip.appendChild(makeItem("star1"));

    win.appendChild(strip);
    reelsEl.appendChild(win);

    reels.push({
      window: win,
      strip,
      raf: null,
      running: false,
      offset: 0,
      speed: 0,
      stepPx: null,
      axis
    });
  }

  // stepPx 측정
  requestAnimationFrame(() => {
    const firstStrip = reels[0]?.strip;
    const firstItem = firstStrip?.querySelector(".reel-item");
    if(!firstItem) return;

    const rect = firstItem.getBoundingClientRect();
    const gap = parseFloat(getComputedStyle(firstStrip).gap || "0") || 0;

    const step = (axis === "y" ? rect.height : rect.width) + gap;
    reels.forEach(r => r.stepPx = step);
  });
}
buildReels();

// 화면 크기 변화 시 재구성
let lastMobile = isMobileLayout();
window.addEventListener("resize", () => {
  const now = isMobileLayout();
  if(now !== lastMobile){
    lastMobile = now;
    buildReels();
  }
});

/** =========================
 *  Reel 애니메이션
 * ========================= */
function startReel(i, speed){
  const r = reels[i];
  if(!r || !r.stepPx) return;

  r.running = true;
  r.speed = speed;

  const tick = () => {
    if(!r.running) return;

    r.offset += r.speed;

    if(r.axis === "y"){
      r.strip.style.transform = `translateY(${r.offset}px)`;
    }else{
      r.strip.style.transform = `translateX(${r.offset}px)`;
    }

    while(r.offset >= r.stepPx){
      r.offset -= r.stepPx;

      if(r.axis === "y"){
        r.strip.style.transform = `translateY(${r.offset}px)`;
      }else{
        r.strip.style.transform = `translateX(${r.offset}px)`;
      }

      const last = r.strip.lastElementChild;
      if(last) r.strip.removeChild(last);
      r.strip.prepend(makeItem(randSym()));
    }

    r.raf = requestAnimationFrame(tick);
  };

  r.raf = requestAnimationFrame(tick);
}

function stopReel(i){
  const r = reels[i];
  if(!r) return;
  r.running = false;
  if(r.raf) cancelAnimationFrame(r.raf);
  r.raf = null;
}

function snapReelToResult(i, three){
  const r = reels[i];
  if(!r) return;

  stopReel(i);

  gridWrap.classList.add("snap");
  r.strip.innerHTML = "";

  for(let k=0;k<6;k++) r.strip.appendChild(makeItem(randSym()));
  // PC: top/mid/bot, Mobile: left/mid/right (같은 배열 사용)
  r.strip.appendChild(makeItem(three[0]));
  r.strip.appendChild(makeItem(three[1]));
  r.strip.appendChild(makeItem(three[2]));
  for(let k=0;k<6;k++) r.strip.appendChild(makeItem(randSym()));

  const step = r.stepPx || 0;
  const base = -(step * 6);

  r.offset = base + 18;
  if(r.axis === "y"){
    r.strip.style.transform = `translateY(${r.offset}px)`;
  }else{
    r.strip.style.transform = `translateX(${r.offset}px)`;
  }

  requestAnimationFrame(() => {
    r.offset = base;
    if(r.axis === "y"){
      r.strip.style.transform = `translateY(${r.offset}px)`;
    }else{
      r.strip.style.transform = `translateX(${r.offset}px)`;
    }
    setTimeout(()=>gridWrap.classList.remove("snap"), 180);
  });
}

/** =========================
 *  BOOT
 * ========================= */
(async function boot(){
  setRandomSlide(false);

  setLog("READY");
  const st = await api("/slot/state");
  if(!st?.ok){
    setApiStatus(false);
    setLog(`API 연결 실패\n${st?.error || "unknown"}\n\nAPI_BASE 확인 필요`);
    return;
  }

  setApiStatus(true);
  betVal.textContent = st.bet ?? 10;
  jpVal.textContent = st.jackpot ?? 0;

  const p = getPlayer(false);
  setLog(
`READY
player: ${p ? p : "(자동 연동 대기)"}`
  );
})();

/** =========================
 *  SPIN (10초 고정 / 7초부터 릴 순차 정지)
 * ========================= */
let spinning = false;
let timers = [];
function clearTimers(){
  timers.forEach(t=>clearTimeout(t));
  timers = [];
}

spinBtn.addEventListener("click", async () => {
  unlockAudio();
  if(spinning) return;

  const player = getPlayer(true);
  if(!player){
    setLog("닉네임이 필요합니다.\nURL: ?u=닉네임  또는 저장된 닉네임 연동");
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  winVal.textContent = "0";

  setRandomSlide(true);
  playOne(SFX.start);

  gridWrap.classList.add("spinning");
  clearTimers();

  // 서버에서 결과 먼저 확보
  setLog("SPIN...");
  const q = `?u=${encodeURIComponent(player)}&user=${encodeURIComponent(player)}&player=${encodeURIComponent(player)}&nickname=${encodeURIComponent(player)}`;
  const result = await api(`/slot/spin${q}`, {
    method:"POST",
    body:{ player, user:player, u:player, nickname:player }
  });

  if(!result?.ok){
    setApiStatus(false);
    gridWrap.classList.remove("spinning");
    stopSpinLoop();
    setLog(`SPIN 실패\n${result?.error || "unknown"}`);
    spinning = false;
    spinBtn.disabled = false;
    return;
  }

  setApiStatus(true);

  // 스핀 시작
  startSpinLoop();
  setLog("SPIN! (10s)\n7초부터 릴이 하나씩 멈춥니다.");

  // 빠르게 시작
  for(let i=0;i<REELS;i++){
    startReel(i, 22 + i*1.4);
  }

  const TOTAL_SPIN_MS = 10000;
  const STOP_START_MS = 7000;
  const STOP_STEP_MS  = 650;

  const finalGrid = result.grid; // [3][5]

  for(let i=0;i<REELS;i++){
    const stopAt = STOP_START_MS + i * STOP_STEP_MS;

    timers.push(setTimeout(() => {
      reels[i].speed = Math.max(10, reels[i].speed * 0.60);
    }, Math.max(0, stopAt - 650)));

    timers.push(setTimeout(() => {
      reels[i].speed = Math.max(6, reels[i].speed * 0.55);
    }, Math.max(0, stopAt - 300)));

    timers.push(setTimeout(() => {
      // ✅ PC: 릴 i = 열 i (top/mid/bot)
      // ✅ Mobile: 릴 i = “행”처럼 보이지만, 데이터는 동일하게 열 i를 사용 (3열×5행으로 자연스럽게 transpose됨)
      snapReelToResult(i, [finalGrid[0][i], finalGrid[1][i], finalGrid[2][i]]);
      playOne(SFX.stop);
    }, stopAt));
  }

  timers.push(setTimeout(() => {
    gridWrap.classList.remove("spinning");
    stopSpinLoop();

    if(result.bet != null) betVal.textContent = result.bet;
    if(result.jackpot != null) jpVal.textContent = result.jackpot;

    const win = (result?.result?.win ?? "0");
    const winType = (result?.result?.winType ?? "none");
    const sym = (result?.result?.symbol ?? "-");
    const mul = (result?.result?.multiplier ?? 0);

    winVal.textContent = win;

    setLog(
`RESULT
player: ${player}
type: ${winType}
symbol: ${sym}
x${mul}
win: ${win} UT
jackpot: ${result.jackpot ?? jpVal.textContent} UT`
    );

    const isJackpot = String(winType).toLowerCase().includes("jackpot");
    const isWin = (String(win) !== "0" && winType !== "none");

    if(isJackpot) playOne(SFX.jackpot);
    else if(isWin) playOne(SFX.win);
    else playOne(SFX.lose);

    spinning = false;
    spinBtn.disabled = false;
  }, TOTAL_SPIN_MS));
});
