<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THE UNIQUE SLOT</title>

  <link rel="stylesheet" href="./slot/slot.css?v=20260112_2" />
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <a class="toplink" href="../main.html">MAIN</a>
      <div class="title">THE UNIQUE SLOT</div>
    </header>

    <!-- ✅ SLOT STAGE -->
    <section id="stageCard" class="card">
      <div class="cardHead">
        <div class="cardTitle">SLOT</div>
        <div class="cardHint">가운데 줄 기준: 2연속=EVEN / 3연속↑=WIN / 5연속=MEGA</div>
      </div>

      <div id="slotStage" class="stage">
        <img id="slotBgImg" class="stageBg" alt="" />
        <div id="slotGrid" class="grid" data-slot-grid="1"></div>
      </div>
    </section>

    <!-- ✅ PAYTABLE (슬롯 아래) -->
    <section id="paytableCard" class="card">
      <div class="cardHead">
        <div class="cardTitle">PAY TABLE</div>

        <!-- ✅ JS가 확실히 찾도록: id + data-action -->
        <button id="btnPayToggle" class="btn tiny" type="button" data-action="pay-toggle">
          접기/펼치기
        </button>
      </div>

      <!-- paytable 내용 -->
      <div id="payWrap" class="payWrap" data-paytable-body="1"></div>

      <div class="ruleLine">
        룰(가운데 줄 기준): 2연속=EVEN(±0) / 3연속↑=WIN / 5연속=MEGA (JACKPOT은 운영자 수동)
      </div>
    </section>

    <!-- ✅ PANEL -->
    <section id="panelCard" class="card">
      <div class="kv">
        <div class="k">PLAYER</div><div id="playerName" class="v">-</div>
        <div class="k">WALLET (UT)</div><div id="walletUt" class="v">0</div>
        <div class="k">JACKPOT POOL</div><div id="jackpotPool" class="v">0</div>
        <div class="k">LAST RESULT</div><div id="lastResult" class="v">READY</div>
      </div>

      <div class="betRow">
        <div class="k">BET</div>
        <div class="betCtl">
          <div id="betUt" class="betVal">10</div>

          <!-- ✅ JS가 확실히 찾도록: id + data-action -->
          <button id="betMinus" class="btn tiny" type="button" data-action="bet-minus">-5</button>
          <button id="betPlus"  class="btn tiny" type="button" data-action="bet-plus">+5</button>
        </div>
      </div>

      <div class="btnRow">
        <button id="autoBtn" class="btn tiny" type="button">AUTO OFF</button>
        <button id="soundBtn" class="btn tiny" type="button">SOUND ON</button>

        <!-- ✅ JS가 확실히 찾도록: id + data-action -->
        <button id="spinBtn" class="btn" type="button" data-action="spin">SPIN</button>
      </div>
    </section>

    <!-- ✅ 로그인 오버레이 (JS가 찾는 id로 맞춤) -->
    <div id="needLogin" class="overlay hidden">
      <div class="overlayCard">
        <div class="overlayTitle">로그인 정보가 없습니다</div>
        <div class="overlayText">
          URL에 <b>?id=아이디</b>를 붙이거나 MAIN에서 로그인 후 들어오세요.<br/>
          예: <code>.../games/slot.html?id=wordycow</code>
        </div>
        <a class="overlayLink" href="../main.html">← MAIN</a>
      </div>
    </div>
  </div>

  <!-- ✅ 로더 순서 고정 + defer (권장) -->
  <script defer src="./slot/slot.config.js?v=20260112_2"></script>
  <script defer src="./slot/slot.api.js?v=20260112_2"></script>
  <script defer src="./slot/slot.ui.js?v=20260112_2"></script>

  <!-- ✅ 안정화 먼저면 game/audio는 잠깐 빼도 됨 (원하면 다시 붙이자) -->
  <!-- <script defer src="./slot/slot.game.js?v=20260112_2"></script> -->
  <!-- <script defer src="./slot/slot.audio.js?v=20260112_2"></script> -->

  <script defer src="./slot/slot.app.js?v=20260112_2"></script>
  <script defer src="./slot/slot.page.js?v=20260112_2"></script>
</body>
</html>
