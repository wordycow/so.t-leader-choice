<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE UNIQUE SLOT</title>
    <link rel="stylesheet" href="./slot/slot.css">
</head>
<body>

    <div id="game-bg"></div>

    <div id="start-overlay">
        <div class="glass-panel">
            <h1>THE UNIQUE</h1>
            <p>TOUCH TO START</p>
        </div>
    </div>

    <div id="game-container">
        
        <div class="ticker-wrap">
            <div class="ticker">
                <span class="ticker-item">★ JACKPOT POOL: 1,240,000 UT ★ [NOTICE] 5연속 MEGA WIN 25배 지급! ★ THE UNIQUE SLOT OPEN ★</span>
            </div>
        </div>

        <div class="top-bar">
            <div class="info-box">ID: <span id="user-id">GUEST</span></div>
            <div class="info-box">WALLET: <span id="wallet-balance">0</span> UT</div>
        </div>

        <div class="slot-machine-frame">
    <div class="reels-container" id="reels-container">
        </div>
    <div class="win-line"></div>
</div>

<div class="slot-machine-frame">
    <div class="reels-container" id="reels-container">
        </div>
    <div class="reel-overlay-shadow"></div>
    <div class="win-line"></div>
</div>

        <div class="control-panel">
            <div class="bet-control">
                <button id="btn-bet-minus">-</button>
                <div class="bet-display">BET: <span id="current-bet">5</span></div>
                <button id="btn-bet-plus">+</button>
            </div>
            
            <div class="action-control">
                <button id="btn-spin" class="spin-btn">SPIN</button>
            </div>
        </div>
        
        <div id="message-area">READY</div>
    </div>

    <script src="./slot/slot.game.js?v=FINAL"></script>
</body>
</html>
