<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMEI 상담원</title>
  <style>
    :root{ --upbit-blue:#093687; --line:#e2e8f0; --muted:#64748b; --shadow:0 10px 25px rgba(2,6,23,.08); }
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    .top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
    .top b{color:var(--upbit-blue)}
    .btn{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:800}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .card{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .bd{padding:14px}
    .chatlog{height:65vh;overflow:auto;padding:12px;background:#fff}
    .msg{margin:10px 0;display:flex;gap:10px;align-items:flex-start}
    .av{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(9,54,135,.08);color:var(--upbit-blue);font-weight:900;border:1px solid rgba(9,54,135,.18)}
    .bubble{border:1px solid var(--line);border-radius:16px;padding:10px 12px;max-width:78%;box-shadow:0 6px 18px rgba(2,6,23,.06)}
    .bar{border-top:1px solid var(--line);padding:10px;display:flex;gap:10px}
    .input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;outline:none}
    .primary{background:var(--upbit-blue);color:#fff;border-color:transparent}
  </style>
</head>
<body>
  <div class="top">
    <b>IMEI 상담원 (Trading Assistant)</b>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn" href="/">메인 대시보드</a>
      <span id="st" style="color:var(--muted);font-weight:900">IMEI: -</span>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="hd">
        <div style="font-weight:900;color:var(--upbit-blue)">채팅</div>
        <div style="color:var(--muted);font-size:12px">http://localhost:5001/api/imei/chat</div>
      </div>
      <div class="chatlog" id="log"></div>
      <div class="bar">
        <input class="input" id="inp" placeholder="예: '오늘 시스템 상태 요약해줘'" />
        <button class="btn primary" id="go">전송</button>
      </div>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const st = document.getElementById("st");
    const inp = document.getElementById("inp");

    function add(who, text){
      const row = document.createElement("div");
      row.className = "msg";
      const av = document.createElement("div");
      av.className = "av";
      av.textContent = who === "me" ? "ME" : "AI";
      const b = document.createElement("div");
      b.className = "bubble";
      b.innerText = text;

      if(who === "me"){
        row.style.justifyContent = "flex-end";
        row.appendChild(b);
        row.appendChild(av);
      }else{
        row.appendChild(av);
        row.appendChild(b);
      }
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    async function ping(){
      try{
        const r = await fetch("http://localhost:5001/health");
        st.textContent = r.ok ? "IMEI: ONLINE" : "IMEI: OFFLINE";
      }catch{ st.textContent = "IMEI: OFFLINE"; }
    }

    async function send(){
      const msg = inp.value.trim();
      if(!msg) return;
      inp.value = "";
      add("me", msg);
      try{
        const res = await fetch("http://localhost:5001/api/imei/chat", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ message: msg, user_id:"user_1", include_trading_status:true })
        });
        const data = await res.json();
        add("ai", data.assistant_message || "(no message)");
      }catch(e){
        add("ai", "오류: " + e.message);
      }
    }

    document.getElementById("go").onclick = send;
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") send(); });

    add("ai", "안녕하세요 유송. 저는 IMEI 상담원입니다. 무엇을 도와드릴까요?");
    ping(); setInterval(ping, 4000);
  </script>
</body>
</html>
