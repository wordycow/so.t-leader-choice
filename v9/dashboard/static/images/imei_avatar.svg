<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1261c4" opacity="0.1"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#1261c4"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="75" r="4" fill="white"/>
  <circle cx="110" cy="75" r="4" fill="white"/>
  
  <!-- Smile -->
  <path d="M 85 85 Q 100 95 115 85" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="40" ry="35" fill="#1261c4"/>
  
  <!-- AI Symbol (brain-like pattern) -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="-15" r="3" fill="white" opacity="0.6"/>
    <circle cx="-8" cy="-10" r="2" fill="white" opacity="0.6"/>
    <circle cx="8" cy="-10" r="2" fill="white" opacity="0.6"/>
    <circle cx="-5" cy="-5" r="2" fill="white" opacity="0.6"/>
    <circle cx="5" cy="-5" r="2" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Animated particles -->
  <circle cx="60" cy="60" r="2" fill="#1261c4" opacity="0.4">
    <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="60" r="2" fill="#1261c4" opacity="0.4">
    <animate attributeName="cy" values="60;40;60" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="120" r="2" fill="#1261c4" opacity="0.4">
    <animate attributeName="cy" values="120;140;120" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="120" r="2" fill="#1261c4" opacity="0.4">
    <animate attributeName="cy" values="120;140;120" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
