<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>so.t – Up Coin</title>

  <style>
    :root{
      --bg:#070b18; --panel:#0b1226; --line:#223054; --text:#eaf0ff; --muted:#9fb0d6;
      --gold:#f7c948; --good:#3ddc97; --bad:#ff5c7a; --blue:#4da3ff; --purple:#a78bfa;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --r:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(circle at 20% 0%, rgba(77,163,255,0.12), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(247,201,72,0.10), transparent 35%),
                  var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:1100px; margin:0 auto; padding:18px}
    .top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
    .brand{display:flex; flex-direction:column; gap:6px;}
    .brand h1{margin:0; font-size:18px; letter-spacing:0.4px}
    .brand .sub{color:var(--muted); font-size:12px}
    .brand .hint{color:rgba(159,176,214,0.85); font-size:12px; line-height:1.35}
    .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end;}
    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      box-shadow: var(--shadow);
      white-space:nowrap;
    }
    .btn:hover{border-color:#2f4477}
    .btn.primary{border-color: rgba(77,163,255,0.45); background: rgba(77,163,255,0.12);}

    .select{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      outline:none;
      min-width:160px;
      box-shadow: var(--shadow);
    }

    .panel{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border-radius: var(--r);
      padding:14px;
      box-shadow: var(--shadow);
      margin-bottom:12px;
    }

    .banner{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
      padding:10px 12px;
      border:1px solid rgba(34,48,84,0.9);
      background: rgba(0,0,0,0.22);
      border-radius:14px;
      margin-bottom:10px;
    }
    .banner .left{display:flex; flex-direction:column; gap:4px}
    .banner .t{font-size:12px; color:rgba(234,240,255,0.95); font-weight:800}
    .banner .d{font-size:12px; color:var(--muted)}
    .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0}
    .tab{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--muted);
      padding:8px 10px;
      border-radius:999px;
      cursor:pointer;
      font-size:12px;
      user-select:none;
    }
    .tab.active{
      color:var(--text);
      border-color:#37519a;
      background: rgba(77,163,255,0.12);
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
      margin-top:12px;
    }
    .card{
      grid-column: span 6;
      border:1px solid var(--line);
      background: rgba(0,0,0,0.18);
      border-radius: var(--r);
      padding:12px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    @media (max-width:880px){ .card{grid-column: span 12;} }
    .card:before{
      content:"";
      position:absolute; inset:-40% -30%;
      background: radial-gradient(circle at 30% 30%, rgba(247,201,72,0.10), transparent 35%),
                  radial-gradient(circle at 70% 60%, rgba(77,163,255,0.10), transparent 38%);
      transform: rotate(8deg);
      pointer-events:none;
    }
    .card > *{position:relative}
    .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
    .title{display:flex; flex-direction:column; gap:4px;}
    .title .ticker{font-size:16px; font-weight:900; letter-spacing:0.3px}
    .title .market{font-size:12px; color:var(--muted)}
    .chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
    .chip{
      font-size:11px;
      padding:6px 8px;
      border-radius:999px;
      background: rgba(255,255,255,0.04);
      border:1px solid var(--line);
      color:var(--muted);
      white-space:nowrap;
    }
    .chip.good{color:var(--good); border-color: rgba(61,220,151,0.35); background: rgba(61,220,151,0.10)}
    .chip.bad{color:var(--bad); border-color: rgba(255,92,122,0.35); background: rgba(255,92,122,0.10)}
    .chip.gold{color:var(--gold); border-color: rgba(247,201,72,0.35); background: rgba(247,201,72,0.10)}
    .chip.purple{color:var(--purple); border-color: rgba(167,139,250,0.35); background: rgba(167,139,250,0.10)}
    .chip.ok{color:var(--good); border-color: rgba(61,220,151,0.45); background: rgba(61,220,151,0.14); font-weight:900}
    .chip.wait{color:rgba(234,240,255,0.85); border-color: rgba(159,176,214,0.35); background: rgba(159,176,214,0.10); font-weight:900}
    .chip.soon{color:var(--gold); border-color: rgba(247,201,72,0.45); background: rgba(247,201,72,0.14); font-weight:900}

    .meta{
      margin-top:10px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:10px;
    }
    .kv{
      grid-column: span 6;
      padding:10px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    @media (max-width:880px){ .kv{grid-column: span 12;} }
    .kv .k{font-size:11px; color:var(--muted)}
    .kv .v{margin-top:6px; font-size:14px; font-weight:800}
    .kv .v small{font-size:12px; color:var(--muted); font-weight:700}

    .cardActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
    .miniBtn{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      cursor:pointer;
      font-size:12px;
      box-shadow: var(--shadow);
    }
    .miniBtn:hover{border-color:#2f4477}
    .miniBtn.copy{border-color: rgba(247,201,72,0.45); background: rgba(247,201,72,0.10)}
    .miniBtn.go{border-color: rgba(77,163,255,0.45); background: rgba(77,163,255,0.10)}
    .miniBtn:disabled{opacity:0.45; cursor:not-allowed}

    .footnote{color:var(--muted); font-size:12px; line-height:1.5;}
    .loading{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px;}
    .dot{
      width:8px; height:8px; border-radius:50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(247,201,72,0.15);
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse{
      0%{transform:scale(0.9); opacity:0.7}
      50%{transform:scale(1.2); opacity:1}
      100%{transform:scale(0.9); opacity:0.7}
    }
    .warn{
      border-left:4px solid rgba(255,92,122,0.6);
      padding:10px 12px;
      background: rgba(255,92,122,0.08);
      border-radius:14px;
      margin-top:10px;
      color: #ffd6de;
      font-size:12px;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>so.t – Up Coin</h1>
        <div class="sub" id="subLine">데이터 로딩중…</div>
        <div class="hint">
          • <b>현재가(실시간)</b>는 업비트 ticker로 <b>15초마다</b> 갱신됨<br/>
          • 손절/익절은 “스냅샷 기준 가이드”라 실시간가와 차이 날 수 있음 (차이 크면 경고 표시)
        </div>
      </div>
      <div class="bar">
        <select class="select" id="timingMode">
          <option value="AUTO">타이밍: AUTO(추천)</option>
          <option value="DAY">타이밍: 주간(09~11)</option>
          <option value="NIGHT">타이밍: 야간(20~01)</option>
          <option value="ALL">타이밍: 제한없음</option>
        </select>

        <select class="select" id="viewCount">
          <option value="6">보기: 6개</option>
          <option value="12">보기: 12개</option>
          <option value="20" selected>보기: 20개</option>
          <option value="50">보기: 50개</option>
        </select>

        <select class="select" id="personSelect"></select>
        <button class="btn primary" id="btnRefresh">새로고침</button>
      </div>
    </div>

    <div class="panel">
      <div class="loading" id="loading">
        <div class="dot"></div>
        <div>오늘의 픽을 가져오는 중…</div>
      </div>

      <div class="banner" id="banner" style="display:none">
        <div class="left">
          <div class="t" id="bannerTitle">타이밍 안내</div>
          <div class="d" id="bannerDesc">-</div>
        </div>
        <div class="chips" id="bannerChips"></div>
      </div>

      <div class="tabs" id="tabs"></div>
      <div class="grid" id="cards"></div>

      <div class="warn">
        <b>주의</b>: 정보 제공/학습용. 수익 보장 없음. 단타/잡코인은 손실 위험이 큼. 본인 책임.
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbz6shTLVydPvqNk69Ug2NsvyyIGeUvcM1b04aOn_KT32Wil2DWSMXaD7GkMncfVlEkv/exec";
    const $ = (id) => document.getElementById(id);

    const WINDOWS = {
      DAYTRADE: [
        { start: "09:15", end: "11:30" },
        { start: "20:30", end: "01:30" }
      ],
      SWING: [
        { start: "10:00", end: "16:00" },
        { start: "20:00", end: "00:30" }
      ],
      COLLECT: [
        { start: "09:00", end: "12:00" }
      ]
    };

    let state = { status:null, picks:null, personId:null, category:"ALL" };
    let liveTimer = null;

    // -------------------------
    // ✅ 업비트 호가 단위 기반 표시(소수점 문제 해결 핵심)
    // -------------------------
    function tickSizeKRW(price){
      const p = Number(price || 0);
      if (p >= 2000000) return 1000;
      if (p >= 1000000) return 500;
      if (p >= 500000)  return 100;
      if (p >= 100000)  return 50;
      if (p >= 10000)   return 10;
      if (p >= 1000)    return 1;
      if (p >= 100)     return 1;    // 100~999는 1원 단위
      if (p >= 10)      return 0.1;  // 10~99.9는 0.1원
      if (p >= 1)       return 0.01; // 1~9.99는 0.01원
      return 0.001;
    }

    function decimalsByTick(tick){
      if (tick >= 1) return 0;
      if (tick >= 0.1) return 1;
      if (tick >= 0.01) return 2;
      if (tick >= 0.001) return 3;
      return 4;
    }

    function formatKRWAuto(val, refPriceForTick){
      const tick = tickSizeKRW(refPriceForTick ?? val);
      const dec = decimalsByTick(tick);
      const n = Number(val || 0);
      return new Intl.NumberFormat("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
    }

    // -------------------------
    function marketToTicker(market){
      if(!market) return "";
      const parts = String(market).split("-");
      return parts.length === 2 ? parts[1] : market;
    }
    function upbitLink(market){
      return "https://upbit.com/exchange?code=CRIX.UPBIT." + encodeURIComponent(market);
    }

    // JSONP
    function jsonp(url, timeoutMs = 12000){
      return new Promise((resolve, reject) => {
        const cbName = "__cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, timeoutMs);

        function cleanup(){
          clearTimeout(timer);
          try { delete window[cbName]; } catch(e) {}
          script.remove();
        }

        window[cbName] = (data) => { cleanup(); resolve(data); };
        const glue = url.includes("?") ? "&" : "?";
        script.src = url + glue + "callback=" + cbName;
        script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
        document.head.appendChild(script);
      });
    }

    async function apiGet(action, params = {}){
      const qs = new URLSearchParams({ action, ...params, _: Date.now() }).toString();
      return await jsonp(API_BASE + "?" + qs);
    }

    function uniqPeople(items){
      const map = new Map();
      for(const it of items){
        const pid = String(it["person_id"] ?? "");
        const name = String(it["name"] ?? pid);
        if(pid && !map.has(pid)) map.set(pid, { person_id: pid, name });
      }
      return Array.from(map.values());
    }

    function setSubLine(){
      const last = state.status?.last_refresh || state.picks?.asof || "";
      const n = state.picks?.items?.length ?? 0;
      $("subLine").textContent = `Last refresh(시트): ${last} | Picks: ${n} | 실시간 가격: 15초 자동 갱신`;
    }

    function renderPersonSelect(){
      const sel = $("personSelect");
      sel.innerHTML = "";
      const people = uniqPeople(state.picks?.items || []);
      if(!people.length){
        const opt = document.createElement("option");
        opt.value = ""; opt.textContent = "인원 없음";
        sel.appendChild(opt);
        return;
      }
      if(!state.personId) state.personId = people[0].person_id;

      for(const p of people){
        const opt = document.createElement("option");
        opt.value = p.person_id;
        opt.textContent = `${p.name} (${p.person_id})`;
        if(p.person_id === state.personId) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.onchange = () => { state.personId = sel.value; renderAll(); startLiveLoop(true); };
    }

    function renderTabs(){
      const tabs = $("tabs");
      const cats = ["ALL","COLLECT","SWING","DAYTRADE"];
      tabs.innerHTML = "";
      for(const c of cats){
        const el = document.createElement("div");
        el.className = "tab" + (state.category === c ? " active" : "");
        el.textContent = c;
        el.onclick = () => { state.category = c; renderAll(); startLiveLoop(true); };
        tabs.appendChild(el);
      }
    }

    function holdGuide(cat){
      if(cat === "COLLECT") return "30~180일";
      if(cat === "SWING") return "3~21일";
      return "당일~48h";
    }

    // 시간/타이밍
    function kstNow(){
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (9 * 3600000));
    }
    function hhmm(d){
      const h = String(d.getHours()).padStart(2,"0");
      const m = String(d.getMinutes()).padStart(2,"0");
      return `${h}:${m}`;
    }
    function parseHHMM(s){
      const [h,m] = String(s).split(":").map(Number);
      return (h*60 + m) % 1440;
    }
    function minutesOfDay(d){ return d.getHours()*60 + d.getMinutes(); }
    function inWindow(nowMin, startMin, endMin){
      if(endMin >= startMin) return nowMin >= startMin && nowMin <= endMin;
      return (nowMin >= startMin) || (nowMin <= endMin);
    }
    function nextStartDelta(nowMin, startMin){
      if(startMin >= nowMin) return startMin - nowMin;
      return (1440 - nowMin) + startMin;
    }

    function getWindowsByCat(cat){
      const mode = $("timingMode").value;
      if(mode === "ALL") return [{start:"00:00", end:"23:59"}];
      if(mode === "DAY") return [{start:"09:15", end:"11:30"}];
      if(mode === "NIGHT") return [{start:"20:30", end:"01:30"}];

      if(cat === "COLLECT") return WINDOWS.COLLECT;
      if(cat === "SWING") return WINDOWS.SWING;
      return WINDOWS.DAYTRADE;
    }

    function timeAdvice(cat){
      const now = kstNow();
      const nowMin = minutesOfDay(now);
      const wins = getWindowsByCat(cat);

      let isOk = false;
      let bestDelta = 999999;
      let bestStart = null;

      for(const w of wins){
        const s = parseHHMM(w.start);
        const e = parseHHMM(w.end);
        if(inWindow(nowMin, s, e)) isOk = true;
        const d = nextStartDelta(nowMin, s);
        if(d < bestDelta){ bestDelta = d; bestStart = w.start; }
      }

      const windowStr = wins.map(w => `${w.start}~${w.end}`).join(" / ");
      if(isOk) return { cls:"ok", label:"지금 OK", windowStr, next:`진행중`, nextIn:`-` };
      if(bestDelta <= 90) return { cls:"soon", label:"곧 진입", windowStr, next:`${bestStart}`, nextIn:`${bestDelta}분 후` };
      return { cls:"wait", label:"대기", windowStr, next:`${bestStart}`, nextIn:`${bestDelta}분 후` };
    }

    function filterPicks(){
      const items = state.picks?.items || [];
      const maxN = Number($("viewCount").value || 20);

      const filtered = items
        .filter(it => String(it["person_id"]) === String(state.personId))
        .filter(it => state.category === "ALL" ? true : String(it["category"]) === state.category)
        .sort((a,b) => Number(b["score"]||0) - Number(a["score"]||0));

      return filtered.slice(0, maxN);
    }

    function chipForCategory(cat){
      if(cat === "COLLECT") return `<span class="chip gold">COLLECT</span>`;
      if(cat === "SWING") return `<span class="chip good">SWING</span>`;
      return `<span class="chip">DAYTRADE</span>`;
    }

    function renderBanner(){
      const b = $("banner");
      b.style.display = "flex";

      const cat = (state.category === "ALL") ? "DAYTRADE" : state.category;
      const adv = timeAdvice(cat === "COLLECT" || cat === "SWING" ? cat : "DAYTRADE");

      $("bannerTitle").textContent = `타이밍: ${$("timingMode").options[$("timingMode").selectedIndex].text}`;
      $("bannerDesc").textContent =
        `현재(KST ${hhmm(kstNow())}) 기준: ${adv.label} · 다음 추천 시작: ${adv.next} (${adv.nextIn}) · 권장 시간대: ${adv.windowStr}`;

      $("bannerChips").innerHTML = `
        <span class="chip ${adv.cls}">${adv.label}</span>
        <span class="chip purple">KST ${hhmm(kstNow())}</span>
        <span class="chip">다음: ${adv.next} (${adv.nextIn})</span>
      `;
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        alert("매수 가이드 복사 완료 ✅");
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        alert("매수 가이드 복사 완료 ✅");
      }
    }

    function buildGuideText(it){
      const cat = String(it["category"]||"DAYTRADE");
      const adv = timeAdvice(cat);
      const market = String(it["market"]||"");
      const ticker = marketToTicker(market);

      const snapPrice = Number(it["price"]||0);
      const livePrice = Number(it.__live_price || 0) || snapPrice;

      const posKRW = Number(it["final_pos_krw"]||0);
      const stop = Number(it["stop_price"]||0);
      const tp1 = Number(it["tp1_price"]||0);
      const tp2 = Number(it["tp2_price"]||0);

      return [
        `so.t 매수 가이드`,
        `- 코인: ${ticker} (${market}) [${cat}]`,
        `- 현재가(실시간): ${formatKRWAuto(livePrice, livePrice)} KRW`,
        `- 스냅샷가(시트): ${formatKRWAuto(snapPrice, snapPrice)} KRW`,
        `- 추천 매수금: ${new Intl.NumberFormat("ko-KR").format(Math.floor(posKRW))} KRW`,
        `- 손절: ${formatKRWAuto(stop, snapPrice)} KRW`,
        `- 익절: TP1 ${formatKRWAuto(tp1, snapPrice)} / TP2 ${formatKRWAuto(tp2, snapPrice)} KRW`,
        `- 권장 보유: ${holdGuide(cat)}`,
        `- 진입 타이밍: ${adv.label} / 권장시간대: ${adv.windowStr} / 다음: ${adv.next} (${adv.nextIn})`,
        ``,
        `운영 규칙(간단):`,
        `1) 손절가 터치 = 즉시 종료`,
        `2) TP1 도달 시 일부 익절 + 나머지 본절(또는 약익절)로 스탑 올리기`,
        `3) DAYTRADE는 6시간 내 TP1 못가면 힘 약함 → 절반/전량 정리 고려`
      ].join("\n");
    }

    function renderCards(){
      const wrap = $("cards");
      wrap.innerHTML = "";
      const items = filterPicks();

      renderBanner();

      if(!items.length){
        wrap.innerHTML = `<div class="card" style="grid-column: span 12;">
          <div class="title">
            <div class="ticker">표시할 픽이 없음</div>
            <div class="market">Picks 시트/필터/인원 선택을 확인해줘.</div>
          </div>
        </div>`;
        return;
      }

      items.forEach((it, i) => {
        const market = String(it["market"]||"");
        const ticker = marketToTicker(market);

        const snapPrice = Number(it["price"]||0);
        const stop = Number(it["stop_price"]||0);
        const tp1 = Number(it["tp1_price"]||0);
        const tp2 = Number(it["tp2_price"]||0);

        const posKRW = Number(it["final_pos_krw"]||0);
        const pos = Number(it["pos_in_30d_range"]||0);
        const volRatio = Number(it["vol_ratio_24h_to_avg7"]||0);
        const pumpDays = Number(it["last_pump_days_ago"]||0);
        const score = Number(it["score"]||0);
        const cat = String(it["category"]||"DAYTRADE");

        const displayRank = i + 1;
        const riskChip = (pos <= 0.35) ? `<span class="chip good">바닥권</span>` : `<span class="chip bad">상단권</span>`;
        const volChip = (volRatio >= 1.2) ? `<span class="chip good">수급↑</span>` : `<span class="chip">수급</span>`;
        const adv = timeAdvice(cat);

        const card = document.createElement("div");
        card.className = "card";
        card.dataset.market = market;
        card.dataset.stop = String(stop);

        card.innerHTML = `
          <div class="row">
            <div class="title">
              <div class="ticker">#${displayRank} ${ticker} <small style="font-weight:800;color:#9fb0d6">(${cat})</small></div>
              <div class="market"><a href="${upbitLink(market)}" target="_blank" rel="noopener">${market}</a></div>
            </div>
            <div class="chips" data-chips>
              ${chipForCategory(cat)}
              <span class="chip ${adv.cls}">${adv.label}</span>
              ${riskChip}
              ${volChip}
              <span class="chip">펌프:${pumpDays}d</span>
              <span class="chip">score:${score.toFixed(3)}</span>
            </div>
          </div>

          <div class="meta">
            <div class="kv">
              <div class="k">현재가(실시간)</div>
              <div class="v" data-liveprice>— <small>KRW</small></div>
              <div class="k" style="margin-top:6px">스냅샷가(시트)</div>
              <div class="v"><small>${formatKRWAuto(snapPrice, snapPrice)} KRW</small></div>
            </div>

            <div class="kv"><div class="k">추천 매수 금액</div><div class="v">${new Intl.NumberFormat("ko-KR").format(Math.floor(posKRW))} <small>KRW</small></div></div>
            <div class="kv"><div class="k">손절(Stop)</div><div class="v" data-stop>${formatKRWAuto(stop, snapPrice)} <small>KRW</small></div></div>
            <div class="kv"><div class="k">익절(TP1 / TP2)</div><div class="v">${formatKRWAuto(tp1, snapPrice)} <small>KRW</small> · ${formatKRWAuto(tp2, snapPrice)} <small>KRW</small></div></div>

            <div class="kv"><div class="k">추천 진입 시간대(KST)</div><div class="v">${adv.windowStr}<br/><small>다음: ${adv.next} (${adv.nextIn})</small></div></div>
            <div class="kv"><div class="k">권장 보유</div><div class="v">${holdGuide(cat)}<br/><small>DAYTRADE는 6시간 내 TP1 실패 시 정리 고려</small></div></div>
          </div>

          <div class="cardActions">
            <button class="miniBtn go" data-go="${market}">업비트 열기</button>
            <button class="miniBtn copy" data-copy="1">매수 가이드 복사</button>
          </div>
        `;

        card.querySelector('[data-go]').onclick = () => window.open(upbitLink(market), "_blank", "noopener");
        card.querySelector('[data-copy]').onclick = () => copyText(buildGuideText(it));

        wrap.appendChild(card);
      });
    }

    function renderAll(){
      setSubLine();
      renderTabs();
      renderCards();
      $("loading").style.display = "none";
    }

    async function loadAll(){
      $("loading").style.display = "flex";
      const [status, picks] = await Promise.all([ apiGet("status"), apiGet("picks") ]);
      if(!status.ok) throw new Error("status error: " + (status.error || "unknown"));
      if(!picks.ok) throw new Error("picks error: " + (picks.error || "unknown"));

      state.status = status;
      state.picks = picks;

      renderPersonSelect();
      renderAll();
      startLiveLoop(true);
    }

    // -------------------------
    // ✅ 실시간 가격 갱신 + 손절 터치 경고
    // -------------------------
    function visibleMarkets(){
      const cards = Array.from(document.querySelectorAll(".card[data-market]"));
      return cards.map(c => c.dataset.market).filter(Boolean);
    }

    async function updateLiveOnce(){
      const markets = visibleMarkets();
      if(!markets.length) return;

      const res = await apiGet("live", { markets: markets.join(",") });
      if(!res.ok) return;

      const map = new Map();
      (res.items || []).forEach(x => map.set(String(x.market), Number(x.trade_price)));

      // ✅ state에도 live price 저장(매수 가이드 복사에 반영)
      const allItems = state.picks?.items || [];
      for(const it of allItems){
        const m = String(it["market"] || "");
        if(map.has(m)) it.__live_price = map.get(m);
      }

      const cards = Array.from(document.querySelectorAll(".card[data-market]"));
      for(const c of cards){
        const m = c.dataset.market;
        const live = map.get(m);
        if(!live) continue;

        const stop = Number(c.dataset.stop || 0);

        const el = c.querySelector("[data-liveprice]");
        if(el) el.innerHTML = `${formatKRWAuto(live, live)} <small>KRW</small>`;

        // 손절 터치/근접 경고 (실시간가 <= 손절가)
        const chips = c.querySelector("[data-chips]");
        const existed = chips.querySelector("[data-stopwarn]");
        if(existed) existed.remove();

        const btnGo = c.querySelector('[data-go]');
        const btnCopy = c.querySelector('[data-copy]');

        if(stop > 0 && live <= stop){
          const warn = document.createElement("span");
          warn.className = "chip bad";
          warn.dataset.stopwarn = "1";
          warn.textContent = "손절 터치";
          chips.prepend(warn);

          // ✅ 이 상태는 “진입 금지”가 맞아서 버튼도 잠깐 막아버림(원하면 제거 가능)
          if(btnGo) btnGo.disabled = true;
          if(btnCopy) btnCopy.disabled = true;
        }else{
          if(btnGo) btnGo.disabled = false;
          if(btnCopy) btnCopy.disabled = false;
        }
      }
    }

    function startLiveLoop(immediate=false){
      if(liveTimer) clearInterval(liveTimer);
      if(immediate) updateLiveOnce().catch(()=>{});
      liveTimer = setInterval(() => updateLiveOnce().catch(()=>{}), 15000);
    }

    // UI events
    $("btnRefresh").onclick = async () => {
      try{ await loadAll(); }
      catch(e){ alert("새로고침 실패: " + e.message); }
    };
    $("timingMode").onchange = () => { renderAll(); startLiveLoop(true); };
    $("viewCount").onchange = () => { renderAll(); startLiveLoop(true); };

    (async function init(){
      try{ await loadAll(); }
      catch(e){
        $("loading").style.display = "none";
        $("subLine").textContent = "로드 실패: " + e.message;
        alert("로드 실패: " + e.message + "\n\nApps Script WebApp 배포/권한(Anyone) 확인.");
      }
    })();
  </script>
</body>
</html>
