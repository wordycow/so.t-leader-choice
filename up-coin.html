<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>so.t – Up Coin</title>
  <meta name="description" content="so.t Daily Picks – 업비트 공개 데이터 기반 추천/관리 화면" />

  <style>
    :root{
      --bg:#070b18; --panel:#0b1226; --line:#223054; --text:#eaf0ff; --muted:#9fb0d6;
      --gold:#f7c948; --good:#3ddc97; --bad:#ff5c7a; --blue:#4da3ff;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --r:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(circle at 20% 0%, rgba(77,163,255,0.12), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(247,201,72,0.10), transparent 35%),
                  var(--bg);
      color:var(--text);
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:1100px; margin:0 auto; padding:18px}
    .top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
    .brand{display:flex; flex-direction:column; gap:4px;}
    .brand h1{margin:0; font-size:18px; letter-spacing:0.4px}
    .brand .sub{color:var(--muted); font-size:12px}
    .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end;}
    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .btn:hover{border-color:#2f4477}
    .select{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      outline:none;
      min-width:180px;
      box-shadow: var(--shadow);
    }
    .panel{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border-radius: var(--r);
      padding:14px;
      box-shadow: var(--shadow);
      margin-bottom:12px;
    }
    .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0}
    .tab{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--muted);
      padding:8px 10px;
      border-radius:999px;
      cursor:pointer;
      font-size:12px;
      user-select:none;
    }
    .tab.active{
      color:var(--text);
      border-color:#37519a;
      background: rgba(77,163,255,0.12);
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
      margin-top:12px;
    }
    .card{
      grid-column: span 6;
      border:1px solid var(--line);
      background: rgba(0,0,0,0.18);
      border-radius: var(--r);
      padding:12px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    @media (max-width:880px){ .card{grid-column: span 12;} }
    .card:before{
      content:"";
      position:absolute; inset:-40% -30%;
      background: radial-gradient(circle at 30% 30%, rgba(247,201,72,0.10), transparent 35%),
                  radial-gradient(circle at 70% 60%, rgba(77,163,255,0.10), transparent 38%);
      transform: rotate(8deg);
      pointer-events:none;
    }
    .card > *{position:relative}
    .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .title{display:flex; flex-direction:column; gap:4px;}
    .title .ticker{font-size:16px; font-weight:700; letter-spacing:0.3px}
    .title .market{font-size:12px; color:var(--muted)}
    .chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
    .chip{
      font-size:11px;
      padding:6px 8px;
      border-radius:999px;
      background: rgba(255,255,255,0.04);
      border:1px solid var(--line);
      color:var(--muted);
    }
    .chip.good{color:var(--good); border-color: rgba(61,220,151,0.35); background: rgba(61,220,151,0.10)}
    .chip.bad{color:var(--bad); border-color: rgba(255,92,122,0.35); background: rgba(255,92,122,0.10)}
    .chip.gold{color:var(--gold); border-color: rgba(247,201,72,0.35); background: rgba(247,201,72,0.10)}
    .chip.blue{color:var(--blue); border-color: rgba(77,163,255,0.35); background: rgba(77,163,255,0.10)}
    .meta{
      margin-top:10px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:10px;
    }
    .kv{
      grid-column: span 6;
      padding:10px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    @media (max-width:880px){ .kv{grid-column: span 12;} }
    .kv .k{font-size:11px; color:var(--muted)}
    .kv .v{margin-top:6px; font-size:14px; font-weight:650}
    .kv .v small{font-size:12px; color:var(--muted); font-weight:500}
    .footnote{color:var(--muted); font-size:12px; line-height:1.5;}
    .loading{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px;}
    .dot{
      width:8px; height:8px; border-radius:50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(247,201,72,0.15);
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse{
      0%{transform:scale(0.9); opacity:0.7}
      50%{transform:scale(1.2); opacity:1}
      100%{transform:scale(0.9); opacity:0.7}
    }
    .warn{
      border-left:4px solid rgba(255,92,122,0.6);
      padding:10px 12px;
      background: rgba(255,92,122,0.08);
      border-radius:14px;
      margin-top:10px;
      color: #ffd6de;
      font-size:12px;
      line-height:1.5;
    }

    /* Gate (접근 제한) */
    .gate{
      position:fixed; inset:0;
      display:none;
      align-items:center; justify-content:center;
      background: rgba(0,0,0,0.65);
      z-index:9999;
      padding:18px;
    }
    .gateBox{
      width: min(520px, 100%);
      border:1px solid var(--line);
      background: rgba(11,18,38,0.96);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding:16px;
    }
    .gateTitle{font-size:16px; font-weight:800; margin:0 0 6px}
    .gateDesc{font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:10px}
    .gateRow{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap}
    .gateMsg{margin-top:10px; font-size:12px; color:#ffd6de; line-height:1.5}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>so.t – Up Coin</h1>
        <div class="sub" id="subLine">데이터 로딩중…</div>
      </div>
      <div class="bar">
        <select class="select" id="limitSelect" title="표시 개수">
          <option value="AUTO">표시: 자동(DAYTRADE=6)</option>
          <option value="6">표시: 6</option>
          <option value="12">표시: 12</option>
          <option value="20">표시: 20</option>
          <option value="50">표시: 50</option>
          <option value="ALL">표시: 전체</option>
        </select>
        <select class="select" id="personSelect"></select>
        <button class="btn" id="btnRefresh">새로고침</button>
      </div>
    </div>

    <div class="panel">
      <div class="loading" id="loading">
        <div class="dot"></div>
        <div>오늘의 픽을 가져오는 중…</div>
      </div>

      <div class="tabs" id="tabs"></div>
      <div class="grid" id="cards"></div>

      <div class="warn">
        <b>주의</b>: 이 페이지는 정보 제공/학습용. 수익 보장 없음. 단타/잡코인은 손실 위험이 큼. 본인 책임.
      </div>

      <div class="footnote" style="margin-top:10px">
        • COLLECT = 모으기(코어) / SWING = 중장기(스윙) / DAYTRADE = 데일리 트레이딩<br/>
        • 추천금액(final_pos_krw)은 “손절폭 + 유동성(거래대금)” 기반 가이드.
      </div>
    </div>
  </div>

  <!-- Gate UI -->
  <div class="gate" id="gate">
    <div class="gateBox">
      <div class="gateTitle">접근 확인</div>
      <div class="gateDesc">
        rank-hall.json 기준 <b>STAR1 / STAR2 / STAR3 / PRO1 이상</b>만 접근 가능.<br/>
        (MEMBER는 차단)
      </div>
      <input class="select" id="gateInput" style="width:100%; min-width:unset" placeholder="닉네임 또는 ID 입력" />
      <div class="gateRow">
        <button class="btn" id="gateBtn">입장</button>
        <button class="btn" id="gateReset">초기화</button>
      </div>
      <div class="gateMsg" id="gateMsg"></div>
    </div>
  </div>

  <script>
    // ✅ 네 WebApp exec 주소
    const API_BASE = "https://script.google.com/macros/s/AKfycbz6shTLVydPvqNk69Ug2NsvyyIGeUvcM1b04aOn_KT32Wil2DWSMXaD7GkMncfVlEkv/exec";

    // ✅ 같은 폴더(/so.t-leader-choice/)에 rank-hall.json이 있으니 상대경로로 OK
    const RANK_JSON_URL = "./rank-hall.json";

    const fmtKRW = new Intl.NumberFormat("ko-KR");
    const $ = (id) => document.getElementById(id);

    // ✅ 기본 탭을 DAYTRADE로 시작
    let state = {
      status:null, picks:null, personId:null,
      category:"DAYTRADE",
      limitMode:"AUTO",
      viewer:{ key:"", tier:"", allowed:false }
    };

    function marketToTicker(market){
      if(!market) return "";
      const parts = String(market).split("-");
      return parts.length === 2 ? parts[1] : market;
    }
    function upbitLink(market){
      return "https://upbit.com/exchange?code=CRIX.UPBIT." + encodeURIComponent(market);
    }

    function holdGuide(cat){
      if(cat === "COLLECT") return "30~180일";
      if(cat === "SWING") return "3~21일";
      return "당일~48h";
    }

    // JSONP only (CORS 회피)
    function jsonp(url, timeoutMs = 12000){
      return new Promise((resolve, reject) => {
        const cbName = "__cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, timeoutMs);

        function cleanup(){
          clearTimeout(timer);
          try { delete window[cbName]; } catch(e) {}
          script.remove();
        }

        window[cbName] = (data) => { cleanup(); resolve(data); };
        const glue = url.includes("?") ? "&" : "?";
        script.src = url + glue + "callback=" + cbName;
        script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
        document.head.appendChild(script);
      });
    }

    async function apiGet(action, params = {}){
      const qs = new URLSearchParams({ action, ...params, _: Date.now() }).toString(); // 캐시 방지
      const url = API_BASE + "?" + qs;
      return await jsonp(url);
    }

    function uniqPeople(items){
      const map = new Map();
      for(const it of items){
        const pid = String(it["person_id"] ?? "");
        const name = String(it["name"] ?? pid);
        if(pid && !map.has(pid)) map.set(pid, { person_id: pid, name });
      }
      return Array.from(map.values());
    }

    function setSubLine(extra=""){
      const last = state.status?.last_refresh || state.picks?.asof || "";
      const total = state.picks?.items?.length ?? 0;
      const filtered = filterPicksRaw().length;
      const tier = state.viewer?.tier ? ` | Tier:${state.viewer.tier}` : "";
      $("subLine").textContent = `Last refresh: ${last} | Total:${total} | View:${filtered}${tier}${extra ? " | " + extra : ""}`;
    }

    function renderPersonSelect(){
      const sel = $("personSelect");
      sel.innerHTML = "";
      const people = uniqPeople(state.picks?.items || []);
      if(!people.length){
        const opt = document.createElement("option");
        opt.value = ""; opt.textContent = "인원 없음";
        sel.appendChild(opt);
        return;
      }
      if(!state.personId) state.personId = people[0].person_id;

      for(const p of people){
        const opt = document.createElement("option");
        opt.value = p.person_id;
        opt.textContent = `${p.name} (${p.person_id})`;
        if(p.person_id === state.personId) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.onchange = () => { state.personId = sel.value; renderAll(); };
    }

    function renderTabs(){
      const tabs = $("tabs");
      const cats = ["ALL","COLLECT","SWING","DAYTRADE"];
      tabs.innerHTML = "";
      for(const c of cats){
        const el = document.createElement("div");
        el.className = "tab" + (state.category === c ? " active" : "");
        el.textContent = c;
        el.onclick = () => { state.category = c; renderAll(); };
        tabs.appendChild(el);
      }
    }

    function chipForCategory(cat){
      if(cat === "COLLECT") return `<span class="chip gold">COLLECT</span>`;
      if(cat === "SWING") return `<span class="chip good">SWING</span>`;
      return `<span class="chip">DAYTRADE</span>`;
    }

    function filterPicksRaw(){
      const items = state.picks?.items || [];
      return items
        .filter(it => String(it["person_id"]) === String(state.personId))
        .filter(it => state.category === "ALL" ? true : String(it["category"]) === state.category)
        .sort((a,b) => Number(b["score"]||0) - Number(a["score"]||0)); // 점수 높은게 위
    }

    function applyLimit(arr){
      const mode = state.limitMode || "AUTO";
      if(mode === "ALL") return arr;

      if(mode === "AUTO"){
        // DAYTRADE는 기본 6개, 나머진 전체
        if(state.category === "DAYTRADE") return arr.slice(0, 6);
        return arr;
      }

      const n = Number(mode);
      if(!Number.isFinite(n) || n <= 0) return arr;
      return arr.slice(0, n);
    }

    function filterPicks(){
      return applyLimit(filterPicksRaw());
    }

    function renderCards(){
      const wrap = $("cards");
      wrap.innerHTML = "";
      const items = filterPicks();

      if(!items.length){
        wrap.innerHTML = `<div class="card" style="grid-column: span 12;">
          <div class="title">
            <div class="ticker">표시할 픽이 없음</div>
            <div class="market">데이터 생성/필터 조건을 확인해줘.</div>
          </div>
        </div>`;
        return;
      }

      items.forEach((it, i) => {
        const market = it["market"];
        const ticker = marketToTicker(market);
        const price = Number(it["price"]||0);
        const posKRW = Number(it["final_pos_krw"]||0);
        const stop = Number(it["stop_price"]||0);
        const tp1 = Number(it["tp1_price"]||0);
        const tp2 = Number(it["tp2_price"]||0);
        const pos = Number(it["pos_in_30d_range"]||0);
        const volRatio = Number(it["vol_ratio_24h_to_avg7"]||0);
        const pumpDays = Number(it["last_pump_days_ago"]||0);
        const score = Number(it["score"]||0);
        const cat = String(it["category"]||"DAYTRADE");

        // 카테고리 탭에서는 1~n 로컬 등수로 표시
        const displayRank = (state.category === "ALL")
          ? (Number(it["rank"] || (i+1)))
          : (i+1);

        const riskChip = (pos <= 0.35) ? `<span class="chip good">바닥권</span>` : `<span class="chip bad">상단권</span>`;
        const volChip = (volRatio >= 1.2) ? `<span class="chip good">수급↑</span>` : `<span class="chip">수급</span>`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <div class="title">
              <div class="ticker">#${displayRank} ${ticker} <small style="font-weight:600;color:#9fb0d6">(${cat})</small></div>
              <div class="market"><a href="${upbitLink(market)}" target="_blank" rel="noopener">${market}</a></div>
            </div>
            <div class="chips">
              ${chipForCategory(cat)}
              <span class="chip">보유:${holdGuide(cat)}</span>
              ${riskChip}
              ${volChip}
              <span class="chip">펌프:${pumpDays}d</span>
              <span class="chip">score:${score.toFixed(3)}</span>
            </div>
          </div>

          <div class="meta">
            <div class="kv"><div class="k">현재가</div><div class="v">${fmtKRW.format(price)} <small>KRW</small></div></div>
            <div class="kv"><div class="k">추천 매수 금액</div><div class="v">${fmtKRW.format(Math.floor(posKRW))} <small>KRW</small></div></div>
            <div class="kv"><div class="k">손절(Stop)</div><div class="v">${fmtKRW.format(Math.floor(stop))} <small>KRW</small></div></div>
            <div class="kv"><div class="k">익절(TP1 / TP2)</div><div class="v">${fmtKRW.format(Math.floor(tp1))} <small>KRW</small> · ${fmtKRW.format(Math.floor(tp2))} <small>KRW</small></div></div>
            <div class="kv"><div class="k">30D 위치</div><div class="v">${(pos*100).toFixed(1)}% <small>(낮을수록 바닥권)</small></div></div>
            <div class="kv"><div class="k">24h/avg7</div><div class="v">${volRatio.toFixed(2)} <small>(높을수록 수급↑)</small></div></div>
          </div>
        `;
        wrap.appendChild(card);
      });
    }

    function renderAll(){
      setSubLine();
      renderTabs();
      renderCards();
      $("loading").style.display = "none";
    }

    async function loadAll(){
      $("loading").style.display = "flex";
      const [status, picks] = await Promise.all([ apiGet("status"), apiGet("picks") ]);
      if(!status.ok) throw new Error("status error: " + (status.error || "unknown"));
      if(!picks.ok) throw new Error("picks error: " + (picks.error || "unknown"));
      state.status = status;
      state.picks = picks;
      renderPersonSelect();
      renderAll();
    }

    $("btnRefresh").onclick = async () => {
      try{ await loadAll(); }
      catch(e){ alert("새로고침 실패: " + e.message); }
    };

    $("limitSelect").onchange = () => {
      state.limitMode = $("limitSelect").value;
      renderAll();
    };

    // -------------------------
    // Gate (rank-hall.json)
    // -------------------------
    function norm(s){ return String(s ?? "").trim(); }
    function normUpper(s){ return norm(s).toUpperCase().replace(/\s+/g,""); }

    function tierOk(tierRaw){
      const t = normUpper(tierRaw);
      if(!t) return false;
      if(t.includes("MEMBER")) return false;
      if(t === "ADMIN" || t === "STAFF") return true;

      // STAR1~ / PRO1~
      const m1 = t.match(/^STAR(\d+)$/);
      if(m1) return Number(m1[1]) >= 1;

      const m2 = t.match(/^PRO(\d+)$/);
      if(m2) return Number(m2[1]) >= 1;

      // 혹시 "STAR_1" 같은 형태 대비
      const t2 = t.replace(/[_-]/g,"");
      const m3 = t2.match(/^STAR(\d+)$/);
      if(m3) return Number(m3[1]) >= 1;
      const m4 = t2.match(/^PRO(\d+)$/);
      if(m4) return Number(m4[1]) >= 1;

      return false;
    }

    function getUserList(data){
      if(Array.isArray(data)) return data;
      if(data && Array.isArray(data.items)) return data.items;
      if(data && Array.isArray(data.members)) return data.members;
      if(data && Array.isArray(data.users)) return data.users;
      if(data && typeof data === "object"){
        for(const k of Object.keys(data)){
          if(Array.isArray(data[k])) return data[k];
        }
      }
      return [];
    }

    function readTier(u){
      const keys = ["tier","rank","grade","level","role","position","title","rank_name","tier_name"];
      for(const k of keys){
        if(u && u[k] != null && String(u[k]).trim() !== "") return String(u[k]);
      }
      return "";
    }

    function matchUser(u, key){
      const k = normUpper(key);
      if(!k) return false;
      const fields = ["person_id","id","uid","user_id","member_id","name","nick","nickname","phone","email"];
      for(const f of fields){
        const v = normUpper(u?.[f]);
        if(v && v === k) return true;
      }
      // 약하게도 한 번(부분일치)
      for(const f of fields){
        const v = normUpper(u?.[f]);
        if(v && v.includes(k)) return true;
      }
      return false;
    }

    async function fetchRankHall(){
      const res = await fetch(RANK_JSON_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("rank-hall.json 로드 실패");
      return await res.json();
    }

    async function verifyAccess(viewerKey){
      const data = await fetchRankHall();
      const list = getUserList(data);
      const found = list.find(u => matchUser(u, viewerKey));
      if(!found){
        return { ok:false, msg:"rank-hall.json에서 사용자를 못 찾음. 입력값(닉/ID) 확인해줘." };
      }
      const tier = readTier(found);
      if(!tierOk(tier)){
        return { ok:false, tier, msg:`접근 불가 등급: ${tier} (STAR1/PRO1 이상만 가능)` };
      }
      return { ok:true, tier };
    }

    function showGate(msg=""){
      $("gate").style.display = "flex";
      $("gateMsg").textContent = msg;
      $("gateInput").focus();
    }
    function hideGate(){
      $("gate").style.display = "none";
      $("gateMsg").textContent = "";
    }

    $("gateReset").onclick = () => {
      localStorage.removeItem("upcoin_viewer_key");
      localStorage.removeItem("upcoin_viewer_tier");
      state.viewer = {key:"", tier:"", allowed:false};
      showGate("초기화 완료. 다시 입력해줘.");
    };

    $("gateBtn").onclick = async () => {
      try{
        const key = $("gateInput").value;
        if(!norm(key)) return $("gateMsg").textContent = "닉네임 또는 ID를 입력해줘.";
        $("gateMsg").textContent = "확인 중…";
        const v = await verifyAccess(key);
        if(!v.ok) return $("gateMsg").textContent = v.msg || "접근 불가";

        state.viewer = { key, tier: v.tier, allowed:true };
        localStorage.setItem("upcoin_viewer_key", key);
        localStorage.setItem("upcoin_viewer_tier", v.tier);
        hideGate();
        await boot();
      } catch(e){
        $("gateMsg").textContent = "확인 실패: " + e.message;
      }
    };

    async function boot(){
      try{
        await loadAll();
      } catch(e){
        $("loading").style.display = "none";
        $("subLine").textContent = "로드 실패: " + e.message;
        alert("로드 실패: " + e.message + "\n\nApps Script status/picks가 ok인지 확인해줘.");
      }
    }

    (async function init(){
      // limit 기본 AUTO
      $("limitSelect").value = "AUTO";
      state.limitMode = "AUTO";

      // Gate: 저장된 키로 자동 시도
      const savedKey = localStorage.getItem("upcoin_viewer_key") || "";
      if(savedKey){
        try{
          const v = await verifyAccess(savedKey);
          if(v.ok){
            state.viewer = { key: savedKey, tier: v.tier, allowed:true };
            await boot();
            return;
          }
          showGate("저장된 키가 유효하지 않음. 다시 입력해줘.");
          return;
        } catch(e){
          showGate("접근 확인 실패. 다시 입력해줘.");
          return;
        }
      }

      // 처음이면 입력 받기
      showGate("닉네임 또는 ID를 입력해줘.");
    })();
  </script>
</body>
</html>
