<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>so.t – Up Coin</title>
  <meta name="description" content="so.t Daily Picks – Upbit 공개 데이터 + 실시간 ticker 기반 NOW 진입 후보" />

  <style>
    :root{
      --bg:#070b18; --panel:#0b1226; --line:#223054; --text:#eaf0ff; --muted:#9fb0d6;
      --gold:#f7c948; --good:#3ddc97; --bad:#ff5c7a; --blue:#4da3ff; --purple:#a78bfa;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --r:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(circle at 20% 0%, rgba(77,163,255,0.12), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(247,201,72,0.10), transparent 35%),
                  var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:1160px; margin:0 auto; padding:18px}
    .top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
    .brand{display:flex; flex-direction:column; gap:6px;}
    .brand h1{margin:0; font-size:18px; letter-spacing:0.4px}
    .brand .sub{color:var(--muted); font-size:12px; line-height:1.35}
    .brand .hint{color:rgba(159,176,214,0.85); font-size:12px; line-height:1.45}

    .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end;}
    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      box-shadow: var(--shadow);
      white-space:nowrap;
      font-weight:900;
    }
    .btn:hover{border-color:#2f4477}
    .btn.primary{border-color: rgba(77,163,255,0.55); background: rgba(77,163,255,0.12);}
    .btn.bad{border-color: rgba(255,92,122,0.65); background: rgba(255,92,122,0.12);}
    .select{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      outline:none;
      min-width:150px;
      box-shadow: var(--shadow);
      font-weight:900;
    }

    .panel{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border-radius: var(--r);
      padding:14px;
      box-shadow: var(--shadow);
      margin-bottom:12px;
    }

    .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 0}
    .tab{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--muted);
      padding:8px 10px;
      border-radius:999px;
      cursor:pointer;
      font-size:12px;
      user-select:none;
      font-weight:900;
    }
    .tab.active{
      color:var(--text);
      border-color:#37519a;
      background: rgba(77,163,255,0.12);
    }

    .banner{
      display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; justify-content:space-between;
      padding:12px 12px;
      border:1px solid rgba(34,48,84,0.9);
      background: rgba(0,0,0,0.22);
      border-radius:14px;
      margin-top:10px;
    }
    .banner .left{display:flex; flex-direction:column; gap:4px}
    .banner .t{font-size:12px; color:rgba(234,240,255,0.95); font-weight:900}
    .banner .d{font-size:12px; color:var(--muted); line-height:1.45}
    .banner .right{display:flex; flex-direction:column; gap:8px; align-items:flex-end; max-width:520px}

    .chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
    .chip{
      font-size:11px;
      padding:6px 8px;
      border-radius:999px;
      background: rgba(255,255,255,0.04);
      border:1px solid var(--line);
      color:var(--muted);
      white-space:nowrap;
      font-weight:900;
    }
    .chip.good{color:var(--good); border-color: rgba(61,220,151,0.45); background: rgba(61,220,151,0.12)}
    .chip.bad{color:var(--bad); border-color: rgba(255,92,122,0.45); background: rgba(255,92,122,0.12)}
    .chip.gold{color:var(--gold); border-color: rgba(247,201,72,0.45); background: rgba(247,201,72,0.12)}
    .chip.blue{color:var(--blue); border-color: rgba(77,163,255,0.45); background: rgba(77,163,255,0.12)}
    .chip.purple{color:var(--purple); border-color: rgba(167,139,250,0.45); background: rgba(167,139,250,0.12)}
    .chip.ok{color:var(--good); border-color: rgba(61,220,151,0.65); background: rgba(61,220,151,0.18)}
    .chip.wait{color:rgba(234,240,255,0.85); border-color: rgba(159,176,214,0.35); background: rgba(159,176,214,0.10)}
    .chip.soon{color:var(--gold); border-color: rgba(247,201,72,0.65); background: rgba(247,201,72,0.18)}

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
      margin-top:12px;
    }
    .card{
      grid-column: span 6;
      border:1px solid var(--line);
      background: rgba(0,0,0,0.18);
      border-radius: var(--r);
      padding:12px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    @media (max-width:880px){ .card{grid-column: span 12;} }
    .card:before{
      content:"";
      position:absolute; inset:-40% -30%;
      background: radial-gradient(circle at 30% 30%, rgba(247,201,72,0.10), transparent 35%),
                  radial-gradient(circle at 70% 60%, rgba(77,163,255,0.10), transparent 38%);
      transform: rotate(8deg);
      pointer-events:none;
    }
    .card > *{position:relative}

    .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
    .title{display:flex; flex-direction:column; gap:4px;}
    .title .ticker{font-size:16px; font-weight:1000; letter-spacing:0.3px}
    .title .market{font-size:12px; color:var(--muted)}

    .meta{
      margin-top:10px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:10px;
    }
    .kv{
      grid-column: span 6;
      padding:10px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    @media (max-width:880px){ .kv{grid-column: span 12;} }
    .kv .k{font-size:11px; color:var(--muted)}
    .kv .v{margin-top:6px; font-size:14px; font-weight:1000}
    .kv .v small{font-size:12px; color:var(--muted); font-weight:900}

    .cardActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
    .miniBtn{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      cursor:pointer;
      font-size:12px;
      box-shadow: var(--shadow);
      font-weight:1000;
    }
    .miniBtn:hover{border-color:#2f4477}
    .miniBtn.copy{border-color: rgba(247,201,72,0.65); background: rgba(247,201,72,0.12)}
    .miniBtn.go{border-color: rgba(77,163,255,0.65); background: rgba(77,163,255,0.12)}

    .loading{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px;}
    .dot{
      width:8px; height:8px; border-radius:50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(247,201,72,0.15);
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse{
      0%{transform:scale(0.9); opacity:0.7}
      50%{transform:scale(1.2); opacity:1}
      100%{transform:scale(0.9); opacity:0.7}
    }

    .warn{
      border-left:4px solid rgba(255,92,122,0.6);
      padding:10px 12px;
      background: rgba(255,92,122,0.08);
      border-radius:14px;
      margin-top:10px;
      color: #ffd6de;
      font-size:12px;
      line-height:1.55;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>so.t – Up Coin</h1>
        <div class="sub" id="subLine">로딩중…</div>
        <div class="hint">
          • <b>현재가(실시간)</b>는 업비트 ticker를 15초마다 갱신<br/>
          • <b>시트 손절선</b>은 “스냅샷가 기준 손절”이므로, 현재가가 크게 움직이면 손절선이 위에 보일 수 있음(=이미 손절 구간)<br/>
          • 그래서 “지금 진입” 기준으로는 <b>현재가 기준 손절(재산출)</b>도 같이 보여줌
        </div>
      </div>

      <div class="bar">
        <select class="select" id="timingMode">
          <option value="AUTO" selected>타이밍: AUTO(추천)</option>
          <option value="DAY">타이밍: 주간(09~11)</option>
          <option value="NIGHT">타이밍: 야간(20~01)</option>
          <option value="ALL">타이밍: 제한없음</option>
        </select>

        <select class="select" id="viewCount">
          <option value="6" selected>노출: 6개</option>
          <option value="12">노출: 12개</option>
          <option value="20">노출: 20개</option>
        </select>

        <select class="select" id="showMode">
          <option value="NOW" selected>모드: NOW만</option>
          <option value="ALL">모드: 전체</option>
        </select>

        <select class="select" id="personSelect"></select>

        <button class="btn primary" id="btnRefresh">새로고침</button>
        <button class="btn" id="btnRotate">로테이션: ON</button>
        <button class="btn" id="btnSound">알림: ON</button>
      </div>
    </div>

    <div class="panel">
      <div class="loading" id="loading">
        <div class="dot"></div>
        <div>픽 로딩중…</div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="banner" id="banner" style="display:none">
        <div class="left">
          <div class="t" id="bannerTitle">지금 당장 진입 후보</div>
          <div class="d" id="bannerDesc">-</div>
        </div>
        <div class="right">
          <div class="chips" id="bannerChips"></div>
          <div class="chips" id="bannerNow"></div>
        </div>
      </div>

      <div class="grid" id="cards"></div>

      <div class="warn">
        <b>주의</b>: 정보 제공/학습용. 수익 보장 없음. 단타는 손실 위험이 큼. 본인 책임.<br/>
        NOW 판정 = (DAYTRADE일 때 시간창 OK) + (추격금지) + (현재가 기준 손절 여유 확보)
      </div>
    </div>
  </div>

  <script>
    // ✅ 네 WebApp exec 주소
    const API_BASE = "https://script.google.com/macros/s/AKfycbz6shTLVydPvqNk69Ug2NsvyyIGeUvcM1b04aOn_KT32Wil2DWSMXaD7GkMncfVlEkv/exec";

    // ====== 옵션 ======
    const LIVE_INTERVAL_MS = 15000;

    // “추격금지” (지금 진입 기준)
    const ENTRY_BAND_PCT = 0.0035;      // 스냅샷가 대비 +0.35% 이상이면 과열/추격으로 NOW 제외
    const MIN_STOP_BUFFER_PCT = 0.002;  // 현재가 기준 손절까지 최소 0.2% 여유 없으면 NOW 제외
    const TP1_CHASE_BLOCK = true;       // TP1 이상이면 진입금지(추격금지)
    const STRUCT_BREAK_BLOCK = true;    // 현재가가 "시트 손절선" 아래면 구조 붕괴로 NOW 금지(다음 코인 추천)

    // DAYTRADE 추천 시간대
    const WINDOWS = {
      DAYTRADE: [
        { start: "09:15", end: "11:30" },
        { start: "20:30", end: "01:30" }
      ]
    };

    const $ = (id) => document.getElementById(id);

    let state = { status:null, picks:null, personId:null, category:"ALL" };
    let liveTimer = null;

    let rotateOn = true;
    let soundOn = true;

    // 화면에 유지할 “활성 후보”
    let activeMarkets = [];
    let poolCursor = 0;

    // ====== 표시 유틸 ======
    function tickSizeKRW(price){
      const p = Number(price || 0);
      if (p >= 2000000) return 1000;
      if (p >= 1000000) return 500;
      if (p >= 500000)  return 100;
      if (p >= 100000)  return 50;
      if (p >= 10000)   return 10;
      if (p >= 1000)    return 1;
      if (p >= 100)     return 1;
      if (p >= 10)      return 0.1;
      if (p >= 1)       return 0.01;
      return 0.001;
    }
    function decimalsByTick(tick){
      if (tick >= 1) return 0;
      if (tick >= 0.1) return 1;
      if (tick >= 0.01) return 2;
      if (tick >= 0.001) return 3;
      return 4;
    }
    function fmtAuto(val, ref){
      const tick = tickSizeKRW(ref ?? val);
      const dec = decimalsByTick(tick);
      const n = Number(val || 0);
      return new Intl.NumberFormat("ko-KR", { minimumFractionDigits:dec, maximumFractionDigits:dec }).format(n);
    }

    function marketToTicker(market){
      const parts = String(market||"").split("-");
      return parts.length===2 ? parts[1] : String(market||"");
    }
    function upbitLink(market){
      return "https://upbit.com/exchange?code=CRIX.UPBIT." + encodeURIComponent(market);
    }

    // ====== JSONP ======
    function jsonp(url, timeoutMs = 12000){
      return new Promise((resolve, reject) => {
        const cbName = "__cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, timeoutMs);

        function cleanup(){
          clearTimeout(timer);
          try { delete window[cbName]; } catch(e) {}
          script.remove();
        }

        window[cbName] = (data) => { cleanup(); resolve(data); };
        const glue = url.includes("?") ? "&" : "?";
        script.src = url + glue + "callback=" + cbName;
        script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
        document.head.appendChild(script);
      });
    }

    async function apiGet(action, params = {}){
      const qs = new URLSearchParams({ action, ...params, _: Date.now() }).toString();
      const url = API_BASE + "?" + qs;
      return await jsonp(url);
    }

    // ====== KST / 타이밍 ======
    function kstNow(){
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (9 * 3600000));
    }
    function hhmm(d){
      const h = String(d.getHours()).padStart(2,"0");
      const m = String(d.getMinutes()).padStart(2,"0");
      return `${h}:${m}`;
    }
    function parseHHMM(s){
      const [h,m] = String(s).split(":").map(Number);
      return (h*60 + m) % 1440;
    }
    function minutesOfDay(d){ return d.getHours()*60 + d.getMinutes(); }
    function inWindow(nowMin, startMin, endMin){
      if(endMin >= startMin) return nowMin >= startMin && nowMin <= endMin;
      return (nowMin >= startMin) || (nowMin <= endMin);
    }
    function nextStartDelta(nowMin, startMin){
      if(startMin >= nowMin) return startMin - nowMin;
      return (1440 - nowMin) + startMin;
    }
    function getDaytradeWindows(){
      const mode = $("timingMode").value;
      if(mode === "ALL") return [{start:"00:00", end:"23:59"}];
      if(mode === "DAY") return [{start:"09:15", end:"11:30"}];
      if(mode === "NIGHT") return [{start:"20:30", end:"01:30"}];
      return WINDOWS.DAYTRADE; // AUTO
    }
    function timingAdvice(){
      const now = kstNow();
      const nowMin = minutesOfDay(now);
      const wins = getDaytradeWindows();

      let isOk = false;
      let bestDelta = 999999;
      let bestStart = null;

      for(const w of wins){
        const s = parseHHMM(w.start);
        const e = parseHHMM(w.end);
        if(inWindow(nowMin, s, e)) isOk = true;
        const d = nextStartDelta(nowMin, s);
        if(d < bestDelta){ bestDelta = d; bestStart = w.start; }
      }

      const windowStr = wins.map(w => `${w.start}~${w.end}`).join(" / ");
      if(isOk) return { ok:true, cls:"ok", label:"지금 OK", windowStr, next:"진행중", nextIn:"-" };
      if(bestDelta <= 90) return { ok:false, cls:"soon", label:"곧 진입", windowStr, next:bestStart, nextIn:`${bestDelta}분 후` };
      return { ok:false, cls:"wait", label:"대기", windowStr, next:bestStart, nextIn:`${bestDelta}분 후` };
    }

    // ====== People / Tabs ======
    function uniqPeople(items){
      const map = new Map();
      for(const it of items){
        const pid = String(it["person_id"] ?? "");
        const name = String(it["name"] ?? pid);
        if(pid && !map.has(pid)) map.set(pid, { person_id: pid, name });
      }
      return Array.from(map.values());
    }

    function setSubLine(){
      const last = state.status?.last_refresh || state.picks?.asof || "";
      const n = state.picks?.items?.length ?? 0;
      $("subLine").textContent = `시트 갱신: ${last} | Picks: ${n} | LIVE: ${LIVE_INTERVAL_MS/1000}s`;
    }

    function renderPersonSelect(){
      const sel = $("personSelect");
      sel.innerHTML = "";
      const people = uniqPeople(state.picks?.items || []);
      if(!people.length){
        const opt = document.createElement("option");
        opt.value = ""; opt.textContent = "인원 없음";
        sel.appendChild(opt);
        return;
      }
      if(!state.personId) state.personId = people[0].person_id;

      for(const p of people){
        const opt = document.createElement("option");
        opt.value = p.person_id;
        opt.textContent = `${p.name} (${p.person_id})`;
        if(p.person_id === state.personId) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.onchange = () => { state.personId = sel.value; initRotationPool(); startLiveLoop(true); };
    }

    function renderTabs(){
      const tabs = $("tabs");
      const cats = ["ALL","COLLECT","SWING","DAYTRADE"];
      tabs.innerHTML = "";
      for(const c of cats){
        const el = document.createElement("div");
        el.className = "tab" + (state.category === c ? " active" : "");
        el.textContent = c;
        el.onclick = () => { state.category = c; initRotationPool(); startLiveLoop(true); };
        tabs.appendChild(el);
      }
    }

    // ====== Picks pool ======
    function picksByFilter(){
      const items = state.picks?.items || [];
      return items
        .filter(it => String(it["person_id"]) === String(state.personId))
        .filter(it => state.category === "ALL" ? true : String(it["category"]||"") === state.category)
        .sort((a,b)=>Number(b["score"]||0)-Number(a["score"]||0));
    }

    function initRotationPool(){
      activeMarkets = [];
      poolCursor = 0;

      const pool = picksByFilter();
      const maxN = Number($("viewCount").value || 6);

      while(activeMarkets.length < maxN && poolCursor < pool.length){
        const m = String(pool[poolCursor]["market"]||"");
        if(m && !activeMarkets.includes(m)) activeMarkets.push(m);
        poolCursor++;
      }
    }

    function getPickByMarket(market){
      const items = state.picks?.items || [];
      return items.find(it =>
        String(it["person_id"]) === String(state.personId) &&
        String(it["market"]||"") === String(market)
      );
    }

    // ====== NOW 판정 ======
    function deriveStopPct(snapshotPrice, sheetStop){
      const snap = Number(snapshotPrice||0);
      const st = Number(sheetStop||0);
      if(!snap || !st) return 0.03;
      let pct = 1 - (st / snap);
      // 너무 이상한 값 방지
      pct = Math.max(0.005, Math.min(0.15, pct));
      return pct;
    }

    function classifyEntry(it, livePrice){
      const cat = String(it["category"]||"DAYTRADE");
      const snap = Number(it["price"]||0);
      const stopSheet = Number(it["stop_price"]||0);
      const tp1  = Number(it["tp1_price"]||0);
      const tp2  = Number(it["tp2_price"]||0);

      if(!livePrice || !snap) return { badge:"WAIT", cls:"wait", reason:"price missing" };

      // DAYTRADE 시간창 체크(타 카테고리는 시간 제한 없음)
      const timing = timingAdvice();
      const timingOk = (cat !== "DAYTRADE") ? true : timing.ok;

      // 추격금지
      if(TP1_CHASE_BLOCK && tp1 && livePrice >= tp1) return { badge:"OUT(추격)", cls:"bad", reason:">= TP1" };
      if(tp2 && livePrice >= tp2) return { badge:"OUT(늦음)", cls:"bad", reason:">= TP2" };

      // 구조 붕괴: “시트 기준 손절선” 아래로 이미 내려간 경우
      if(STRUCT_BREAK_BLOCK && stopSheet && livePrice < stopSheet) {
        return { badge:"OUT(구조)", cls:"bad", reason:"below sheet stop" };
      }

      if(!timingOk) return { badge:"WAIT(시간)", cls:"wait", reason:"timing not ok" };

      // 과열(스냅샷가 대비 너무 위)
      if(snap && livePrice > snap * (1 + ENTRY_BAND_PCT)) return { badge:"WAIT(과열)", cls:"wait", reason:"too high vs snapshot" };

      // “지금 진입” 기준 손절선(재산출)
      const stopPct = deriveStopPct(snap, stopSheet);
      const stopEntry = livePrice * (1 - stopPct);

      // 손절 여유
      const bufferPct = (livePrice - stopEntry) / Math.max(1e-9, livePrice);
      if(bufferPct < MIN_STOP_BUFFER_PCT) return { badge:"WAIT(여유↓)", cls:"wait", reason:"stop buffer low" };

      return { badge:"NOW(진입)", cls:"good", reason:"ok" };
    }

    // ====== 가이드 복사 ======
    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        alert("가이드 복사 완료 ✅");
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        alert("가이드 복사 완료 ✅");
      }
    }

    function buildGuideText(it, livePrice){
      const cat = String(it["category"]||"DAYTRADE");
      const market = String(it["market"]||"");
      const ticker = marketToTicker(market);

      const snap = Number(it["price"]||0);
      const stopSheet = Number(it["stop_price"]||0);
      const tp1  = Number(it["tp1_price"]||0);
      const tp2  = Number(it["tp2_price"]||0);
      const posKRW = Number(it["final_pos_krw"]||0);

      const stopPct = deriveStopPct(snap, stopSheet);
      const stopEntry = Number(livePrice||0) * (1 - stopPct);

      return [
        `so.t 매수 가이드`,
        `- 코인: ${ticker} (${market}) [${cat}]`,
        `- 현재가(실시간): ${fmtAuto(livePrice, livePrice)} KRW`,
        `- 스냅샷가(시트): ${fmtAuto(snap, snap)} KRW`,
        `- 추천 매수금: ${new Intl.NumberFormat("ko-KR").format(Math.floor(posKRW))} KRW`,
        ``,
        `손절/익절`,
        `- 손절(시트 기준): ${fmtAuto(stopSheet, snap)} KRW (스냅샷 기준 손절선)`,
        `- 손절(현재가 기준 재산출): ${fmtAuto(stopEntry, livePrice)} KRW (지금 진입 가정)`,
        `- TP1/TP2: ${fmtAuto(tp1, snap)} / ${fmtAuto(tp2, snap)} KRW`,
        ``,
        `규칙(단순 버전)`,
        `1) NOW(진입)일 때만 진입`,
        `2) 손절선 터치 = 즉시 종료`,
        `3) TP1 도달 = 일부 익절 + 나머지 스탑 올리기`,
        `4) 추격금지: TP1 위에서는 새 진입 금지`,
      ].join("\n");
    }

    // ====== Live ======
    async function fetchLive(markets){
      if(!markets.length) return new Map();
      const res = await apiGet("live", { markets: markets.join(",") });
      const map = new Map();
      if(!res || !res.ok) return map;
      (res.items || []).forEach(x => map.set(String(x.market), Number(x.trade_price)));
      return map;
    }

    function beep(){
      if(!soundOn) return;
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        o.connect(g); g.connect(ctx.destination);
        g.gain.value = 0.08;
        o.start();
        setTimeout(()=>{ o.stop(); ctx.close(); }, 120);
      }catch(e){}
    }

    function nextMarketFromPool(excludeSet){
      const pool = picksByFilter(); // 현재 탭(카테고리) 기준 후보 풀
      while(poolCursor < pool.length){
        const m = String(pool[poolCursor]["market"]||"");
        poolCursor++;
        if(!m) continue;
        if(excludeSet.has(m)) continue;
        return m;
      }
      return null;
    }

    function rotateIfNeeded(liveMap){
      if(!rotateOn) return;
      const poolSet = new Set(activeMarkets);

      for(let i=0; i<activeMarkets.length; i++){
        const m = activeMarkets[i];
        const it = getPickByMarket(m);
        if(!it) continue;
        const live = liveMap.get(m) ?? Number(it["price"]||0);
        const cls = classifyEntry(it, live);

        // OUT이면 무조건 교체(“지금 살 수 있는 코인”만 남기려고)
        if(String(cls.badge||"").startsWith("OUT")){
          const next = nextMarketFromPool(poolSet);
          if(next){
            poolSet.delete(m);
            activeMarkets[i] = next;
            poolSet.add(next);
            beep();
          }
        }
      }
    }

    // ====== Render ======
    function renderBanner(nowList){
      const timing = timingAdvice();
      const b = $("banner");
      b.style.display = "flex";

      const cat = state.category;
      const catLabel = (cat==="ALL") ? "ALL" : cat;

      $("bannerTitle").textContent = `${catLabel}: 지금 당장 진입 후보(NOW)`;
      const timeLine = `KST ${hhmm(kstNow())}`;
      const timingLine = `DAYTRADE 타이밍: ${timing.label} · 권장: ${timing.windowStr} · 다음: ${timing.next} (${timing.nextIn})`;

      $("bannerDesc").textContent = (cat==="DAYTRADE" || cat==="ALL")
        ? `${timeLine} · ${timingLine}`
        : `${timeLine} · (SWING/COLLECT는 시간 제한 없이 NOW 판정)`;

      $("bannerChips").innerHTML = `
        <span class="chip purple">${timeLine}</span>
        <span class="chip">LIVE ${LIVE_INTERVAL_MS/1000}s</span>
        <span class="chip ${timing.cls}">${timing.label}</span>
      `;

      if(!nowList.length){
        $("bannerNow").innerHTML = `<span class="chip wait">NOW 후보 없음 → OUT/WAIT는 자동으로 다음 코인으로 교체 중</span>`;
      }else{
        $("bannerNow").innerHTML = nowList.slice(0,3).map(x =>
          `<span class="chip ok">NOW: ${x.ticker} @ ${fmtAuto(x.live, x.live)}</span>`
        ).join("");
      }
    }

    function renderCards(liveMap){
      const wrap = $("cards");
      wrap.innerHTML = "";

      if(!activeMarkets.length) initRotationPool();

      const showMode = $("showMode").value; // NOW / ALL
      const maxN = Number($("viewCount").value || 6);

      const cardsData = [];
      for(const m of activeMarkets.slice(0, maxN)){
        const it = getPickByMarket(m);
        if(!it) continue;
        const live = liveMap.get(m) ?? Number(it["price"]||0);
        const entry = classifyEntry(it, live);
        cardsData.push({ it, market:m, live, entry });
      }

      const nowList = cardsData
        .filter(x => String(x.entry.badge||"").startsWith("NOW"))
        .sort((a,b)=>Number(b.it["score"]||0)-Number(a.it["score"]||0))
        .map(x => ({ market:x.market, ticker:marketToTicker(x.market), live:x.live }));

      renderBanner(nowList);

      let finalCards = cardsData;
      if(showMode === "NOW") finalCards = cardsData.filter(x => String(x.entry.badge||"").startsWith("NOW"));

      if(!finalCards.length){
        const empty = document.createElement("div");
        empty.className = "card";
        empty.style.gridColumn = "span 12";
        empty.innerHTML = `
          <div class="title">
            <div class="ticker">NOW 후보 없음</div>
            <div class="market">모드=전체로 바꾸면 WAIT/OUT 이유가 보이고, 로테이션 ON이면 OUT은 자동으로 교체됨.</div>
          </div>
        `;
        wrap.appendChild(empty);
        return;
      }

      finalCards.forEach((x, idx) => {
        const it = x.it;
        const market = x.market;
        const ticker = marketToTicker(market);

        const cat = String(it["category"]||"");
        const score = Number(it["score"]||0);

        const snap = Number(it["price"]||0);
        const stopSheet = Number(it["stop_price"]||0);
        const tp1  = Number(it["tp1_price"]||0);
        const tp2  = Number(it["tp2_price"]||0);
        const posKRW = Number(it["final_pos_krw"]||0);

        const stopPct = deriveStopPct(snap, stopSheet);
        const stopEntry = x.live * (1 - stopPct);

        const entry = x.entry;
        const badge = entry.badge || "WAIT";

        const badgeChip =
          badge.startsWith("NOW") ? `<span class="chip ok">${badge}</span>` :
          badge.startsWith("WAIT") ? `<span class="chip wait">${badge}</span>` :
          `<span class="chip bad">${badge}</span>`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <div class="title">
              <div class="ticker">#${idx+1} ${ticker} <small style="font-weight:1000;color:#9fb0d6">(${cat})</small></div>
              <div class="market"><a href="${upbitLink(market)}" target="_blank" rel="noopener">${market}</a></div>
            </div>
            <div class="chips">
              ${badgeChip}
              <span class="chip">score:${score.toFixed(3)}</span>
            </div>
          </div>

          <div class="meta">
            <div class="kv">
              <div class="k">현재가(실시간)</div>
              <div class="v">${fmtAuto(x.live, x.live)} <small>KRW</small></div>
              <div class="k" style="margin-top:6px">스냅샷가(시트)</div>
              <div class="v"><small>${fmtAuto(snap, snap)} KRW</small></div>
            </div>

            <div class="kv"><div class="k">추천 매수 금액</div><div class="v">${new Intl.NumberFormat("ko-KR").format(Math.floor(posKRW))} <small>KRW</small></div></div>

            <div class="kv">
              <div class="k">손절(시트 기준)</div>
              <div class="v">${fmtAuto(stopSheet, snap)} <small>KRW</small></div>
              <div class="k" style="margin-top:6px">손절(현재가 기준 재산출)</div>
              <div class="v"><small>${fmtAuto(stopEntry, x.live)} KRW</small></div>
            </div>

            <div class="kv"><div class="k">익절(TP1 / TP2)</div><div class="v">${fmtAuto(tp1, snap)} <small>KRW</small> · ${fmtAuto(tp2, snap)} <small>KRW</small></div></div>

            <div class="kv" style="grid-column: span 12">
              <div class="k">진입 판정</div>
              <div class="v">${badge} <small>(${entry.reason})</small></div>
            </div>
          </div>

          <div class="cardActions">
            <button class="miniBtn go" data-go="${market}">업비트 열기</button>
            <button class="miniBtn copy" data-copy="${market}">매수 가이드 복사</button>
          </div>
        `;

        card.querySelector("[data-go]").onclick = () => window.open(upbitLink(market), "_blank", "noopener");
        card.querySelector("[data-copy]").onclick = () => copyText(buildGuideText(it, x.live));
        wrap.appendChild(card);
      });
    }

    // ====== Live Loop ======
    async function liveTick(){
      const maxN = Number($("viewCount").value || 6);
      if(!activeMarkets.length) initRotationPool();

      // 1차 live
      const m1 = activeMarkets.slice(0, maxN);
      const live1 = await fetchLive(m1);

      // OUT 교체
      rotateIfNeeded(live1);

      // 2차 live(교체된 종목 반영)
      const m2 = activeMarkets.slice(0, maxN);
      const live2 = await fetchLive(m2);

      renderCards(live2);
      $("loading").style.display = "none";
    }

    function startLiveLoop(immediate=false){
      if(liveTimer) clearInterval(liveTimer);
      if(immediate) liveTick().catch(()=>{});
      liveTimer = setInterval(()=>liveTick().catch(()=>{}), LIVE_INTERVAL_MS);
    }

    // ====== Load ======
    async function loadAll(){
      $("loading").style.display = "flex";

      const [status, picks] = await Promise.all([ apiGet("status"), apiGet("picks") ]);
      if(!status.ok) throw new Error("status error: " + (status.error || "unknown"));
      if(!picks.ok) throw new Error("picks error: " + (picks.error || "unknown"));

      state.status = status;
      state.picks = picks;

      setSubLine();
      renderTabs();
      renderPersonSelect();
      initRotationPool();

      startLiveLoop(true);
    }

    // ====== UI events ======
    $("btnRefresh").onclick = async () => {
      try{ await loadAll(); }
      catch(e){ alert("새로고침 실패: " + e.message); }
    };
    $("timingMode").onchange = () => startLiveLoop(true);
    $("viewCount").onchange = () => { initRotationPool(); startLiveLoop(true); };
    $("showMode").onchange = () => startLiveLoop(true);

    $("btnRotate").onclick = () => {
      rotateOn = !rotateOn;
      $("btnRotate").textContent = `로테이션: ${rotateOn ? "ON" : "OFF"}`;
      $("btnRotate").className = rotateOn ? "btn" : "btn bad";
    };

    $("btnSound").onclick = () => {
      soundOn = !soundOn;
      $("btnSound").textContent = `알림: ${soundOn ? "ON" : "OFF"}`;
      $("btnSound").className = soundOn ? "btn" : "btn bad";
    };

    (async function init(){
      try{ await loadAll(); }
      catch(e){
        $("loading").style.display = "none";
        $("subLine").textContent = "로드 실패: " + e.message;
        alert("로드 실패: " + e.message + "\n\nApps Script에 action=live가 있어야 실시간이 됩니다.");
      }
    })();
  </script>
</body>
</html>
