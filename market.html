<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNIQUE 마켓</title>

  <!-- favicon 404 제거 -->
  <link rel="icon" href="data:,">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Pretendard",sans-serif;
      color:#e5e7eb;
      background:#0b1220 url("img/bg-market.jpg") center/cover fixed no-repeat;
      position:relative;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background: radial-gradient(circle at top,
        rgba(2,6,23,.12),
        rgba(2,6,23,.48) 65%,
        rgba(2,6,23,.58)
      );
      z-index:-1;
    }

    .wrap{max-width:1200px;margin:0 auto;padding:16px;position:relative;z-index:1}
    .topbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .brand{font-weight:900;letter-spacing:.12em;font-size:18px}
    .who{opacity:.9;font-size:12px;margin-top:4px}

    .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{cursor:pointer}
    .btn{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.12);
      color:#e5e7eb;font-weight:800
    }
    .btn.primary{background:rgba(255,255,255,.18)}
    .btn.danger{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.45)}

    .pill{
      padding:8px 12px;border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      font-size:12px;
      margin-bottom:12px;
      display:none;
      white-space:pre-line;
    }

    .stack{display:flex;flex-direction:column;gap:12px}
    .card{
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      padding:14px;
      backdrop-filter: blur(6px);
    }

    .muted{opacity:.85;font-size:12px}
    input,textarea{
      width:100%;padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      color:#e5e7eb;outline:none
    }
    textarea{min-height:110px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}

    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .thumb{width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#0a1020;position:relative}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .x{
      position:absolute;top:6px;right:6px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;border-radius:10px;padding:2px 6px;font-size:11px
    }

    .feedWrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .feed{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
      min-height:240px;
    }
    @media(max-width:1100px){.feed{grid-template-columns: repeat(3, minmax(0,1fr));}}
    @media(max-width:900px){.feed{grid-template-columns: repeat(2, minmax(0,1fr));}}
    @media(max-width:620px){.feed{grid-template-columns: 1fr;}}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">UNIQUE 마켓</div>
      <div id="who" class="who">로그인 확인 중...</div>
    </div>
    <div class="btns">
      <button class="btn danger" id="btnExit">나가기</button>
      <button class="btn primary" id="btnLogin">구글 로그인</button>
      <button class="btn" id="btnReset" title="로그인 꼬였을 때 초기화">초기화</button>
    </div>
  </div>

  <div id="status" class="pill"></div>

  <div class="stack">
    <div class="card">
      <div style="font-weight:900;margin-bottom:8px;">등록</div>
      <div class="muted" style="margin-bottom:10px;">이미지 1~3장 (JPG/PNG/GIF). (파일 선택은 로그인 전에도 가능)</div>

      <div class="row">
        <div>
          <div class="muted" style="margin:0 0 6px;">제목</div>
          <input id="fTitle" placeholder="예: 미개봉 단백질 2통" />
        </div>
        <div>
          <div class="muted" style="margin:0 0 6px;">수량</div>
          <input id="fQty" type="number" placeholder="예: 2" />
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div>
          <div class="muted" style="margin:0 0 6px;">연락처</div>
          <input id="fContact" placeholder="예: 010-xxxx-xxxx / 오픈채팅 링크" />
        </div>
        <div>
          <div class="muted" style="margin:0 0 6px;">지역</div>
          <input id="fRegion" placeholder="예: 서울 강남 / 부산 해운대" />
        </div>
      </div>

      <div style="margin-top:10px;">
        <div class="muted" style="margin:0 0 6px;">설명</div>
        <textarea id="fDesc" placeholder="상태/사용감/전달 방식 등"></textarea>
      </div>

      <div style="margin-top:10px;">
        <div class="muted" style="margin:0 0 6px;">이미지(최대 3개)</div>
        <input id="fImages" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
        <div id="imgPreview" class="thumbs"></div>
      </div>

      <div class="btns" style="margin-top:10px;">
        <button class="btn primary" id="btnSave">등록하기</button>
      </div>

      <div id="loginNote" class="muted" style="margin-top:8px;">로그인 확인 중...</div>
    </div>

    <div class="card">
      <div class="feedWrap">
        <div style="font-weight:900;">게시글</div>
        <button class="btn" id="btnRefresh">새로고침</button>
      </div>
      <div id="feed" class="feed"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const BUCKET = "market";
  const REDIRECT_TO = location.origin + location.pathname;

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");

  function setStatus(msg, isErr=false){
    if (!msg){ statusEl.style.display="none"; return; }
    statusEl.style.display="";
    statusEl.textContent = msg;
    statusEl.style.borderColor = isErr ? "rgba(248,113,113,.6)" : "rgba(255,255,255,.18)";
    statusEl.style.background = isErr ? "rgba(127,29,29,.25)" : "rgba(0,0,0,.18)";
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function cleanUrl(removeCode=true){
    const u = new URL(location.href);
    u.searchParams.delete("autologin");
    if (removeCode){
      u.searchParams.delete("code");
      u.searchParams.delete("state");
    }
    history.replaceState({}, document.title, u.pathname + u.search);
  }

  if (!window.supabase){
    $("who").textContent = "supabase-js 로드 실패";
    $("loginNote").textContent = "광고차단/네트워크로 CDN이 막혔습니다.";
    setStatus("supabase-js 로드 실패", true);
    return;
  }

  // ✅ fetch 자체가 멈추는 경우를 막기 위해 20초 타임아웃 fetch 적용
  function fetchWithTimeout(input, init = {}) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 20000);
    return fetch(input, { ...init, signal: controller.signal })
      .finally(() => clearTimeout(t));
  }

  // ✅ 우리가 code 교환을 직접 제어해서, 실패 이유를 화면에 보여준다
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { fetch: fetchWithTimeout },
    auth: { flowType:"pkce", detectSessionInUrl:false, persistSession:true, autoRefreshToken:true }
  });

  let session = null;
  let user = null;

  function setLoggedOutUI(){
    $("who").textContent = "로그인 필요";
    $("loginNote").textContent = "등록하려면 상단 ‘구글 로그인’을 누르세요.";
  }
  function setLoggedInUI(){
    const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
    const email = user.email || "";
    $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;
    $("loginNote").textContent = "로그인 완료 ✅ 등록 가능합니다.";
  }

  $("btnExit").addEventListener("click", () => location.replace("the-unique-gate.html"));

  $("btnReset").addEventListener("click", () => {
    try{
      for (let i = localStorage.length - 1; i >= 0; i--){
        const k = localStorage.key(i);
        if (k && k.startsWith("sb-")) localStorage.removeItem(k);
      }
      sessionStorage.clear();
    }catch(e){}
    location.replace("market.html?autologin=1");
  });

  $("btnLogin").addEventListener("click", async () => {
    setStatus("구글 로그인 이동 중...");
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: REDIRECT_TO }
    });
    if (error) setStatus("구글 로그인 시작 실패: " + error.message, true);
  });

  async function exchangeIfCode(){
    const u = new URL(location.href);
    const code = u.searchParams.get("code");
    if (!code) return true;

    setStatus("로그인 처리 중... (코드 교환)", false);

    // ✅ 강제 실패시키지 않고, 진행 안내만 띄움
    const slowHint = setTimeout(() => {
      setStatus(
        "로그인 교환이 지연되고 있어요.\n" +
        "보통 ‘확장프로그램/회사망’이 supabase.co 요청을 막을 때 이런 증상이 납니다.\n" +
        "→ 시크릿 창(확장 OFF)에서 다시 시도해보세요.\n" +
        "그래도 안 되면 상단 ‘초기화’ 후 재로그인.",
        true
      );
    }, 6000);

    try{
      const { data, error } = await sb.auth.exchangeCodeForSession(code);
      clearTimeout(slowHint);

      if (error) throw error;
      if (data?.session) {
        session = data.session;
        user = data.session.user;
      }
      cleanUrl(true);
      setStatus("");
      return true;
    } catch(e){
      clearTimeout(slowHint);
      console.error(e);
      setStatus(
        "로그인 코드 교환 실패 ❌\n" +
        "에러: " + (e?.message || e) + "\n\n" +
        "해결:\n" +
        "1) 상단 ‘초기화’ 누르고 재시도\n" +
        "2) 시크릿 창(확장 OFF)에서 재시도",
        true
      );
      return false;
    }
  }

  async function getSessionFast(){
    const end = Date.now() + 2500;
    while (Date.now() < end){
      const { data } = await sb.auth.getSession();
      if (data.session) return data.session;
      await sleep(200);
    }
    return null;
  }

  async function requireLogin(){
    $("who").textContent = "로그인 확인 중...";
    $("loginNote").textContent = "로그인 확인 중...";

    const okExchange = await exchangeIfCode();
    if (!okExchange){
      setLoggedOutUI();
      return false;
    }

    const s = await getSessionFast();
    if (!s){
      setLoggedOutUI();
      setStatus(""); // 조용히
      return false;
    }

    session = s;
    user = s.user;
    setLoggedInUI();
    setStatus("");
    return true;
  }

  // ===== 이미지 프리뷰(로그인과 무관) =====
  let selectedFiles = [];
  let previewUrls = [];

  function clearPreviews(){
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = [];
    $("fImages").value = "";
    $("imgPreview").innerHTML = "";
  }
  function renderPreviews(){
    const box = $("imgPreview");
    box.innerHTML = "";
    selectedFiles.slice(0,3).forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      previewUrls.push(url);
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<img src="${url}" alt=""><button class="x" type="button">X</button>`;
      d.querySelector(".x").onclick = () => { selectedFiles.splice(idx, 1); renderPreviews(); };
      box.appendChild(d);
    });
  }
  $("fImages").addEventListener("change", (e) => {
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = Array.from(e.target.files || []).slice(0,3);
    renderPreviews();
  });

  function toPublicUrl(path){ return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }
  function fileExt(file){
    const n = file.name || "";
    const dot = n.lastIndexOf(".");
    return dot >= 0 ? n.slice(dot+1).toLowerCase() : "png";
  }
  function safeName(s){ return (s||"").toString().trim(); }

  async function uploadImages(postId){
    if (!selectedFiles.length) return [];
    setStatus("이미지 업로드 중...");
    const urls = [];
    for (let i=0; i<Math.min(3, selectedFiles.length); i++){
      const f = selectedFiles[i];
      const ext = fileExt(f);
      const path = `posts/${postId}/${Date.now()}_${i}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, f, { upsert:false, contentType:f.type });
      if (error) throw new Error("이미지 업로드 실패: " + error.message);
      urls.push(toPublicUrl(path));
    }
    return urls;
  }

  async function createPost(){
    const title = safeName($("fTitle").value);
    if (!title) return setStatus("제목은 필수입니다.", true);

    if (!user){
      setStatus("등록하려면 로그인이 필요합니다. 상단 ‘구글 로그인’을 누르세요.", true);
      return;
    }

    // 여기부터는 DB/RLS 설정에 따라 실패할 수 있음(실패 메시지 그대로 표시됨)
    setStatus("등록 중...");
    try{
      const qty = $("fQty").value ? parseInt($("fQty").value, 10) : null;
      const contact = safeName($("fContact").value);
      const region = safeName($("fRegion").value);
      const description = safeName($("fDesc").value);
      const owner_name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "";

      const { data, error } = await sb
        .from("market_posts")
        .insert({ owner: user.id, owner_name, title, qty, contact, region, description, images: [] })
        .select("id")
        .single();

      if (error) return setStatus("등록 실패: " + error.message, true);

      const urls = await uploadImages(data.id);
      if (urls.length) {
        const { error: e2 } = await sb.from("market_posts").update({ images: urls }).eq("id", data.id);
        if (e2) return setStatus("DB 업데이트 실패: " + e2.message, true);
      }

      setStatus("등록 완료!");
      clearPreviews();
      $("fTitle").value=""; $("fQty").value=""; $("fContact").value=""; $("fRegion").value=""; $("fDesc").value="";
    } catch(e){
      setStatus("등록 중 오류: " + (e?.message || e), true);
    }
  }

  $("btnSave").addEventListener("click", () => createPost());
  $("btnRefresh").addEventListener("click", () => location.reload());

  (async () => { await requireLogin(); })();
})();
</script>
</body>
</html>
