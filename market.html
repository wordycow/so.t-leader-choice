<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNIQUE 마켓</title>

  <!-- favicon 404 제거 -->
  <link rel="icon" href="data:,">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Pretendard",sans-serif;
      color:#e5e7eb;
      background:#0b1220 url("img/bg-market.jpg") center/cover fixed no-repeat;
      position:relative;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background: radial-gradient(circle at top,
        rgba(2,6,23,.12),
        rgba(2,6,23,.48) 65%,
        rgba(2,6,23,.58)
      );
      z-index:-1;
    }

    .wrap{max-width:1200px;margin:0 auto;padding:16px;position:relative;z-index:1}
    .topbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .brand{font-weight:900;letter-spacing:.12em;font-size:18px}
    .who{opacity:.9;font-size:12px;margin-top:4px}

    .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{cursor:pointer}
    .btn{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.12);
      color:#e5e7eb;font-weight:800
    }
    .btn.primary{background:rgba(255,255,255,.18)}
    .btn.danger{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.45)}

    .pill{
      padding:8px 12px;border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      font-size:12px;
      margin-bottom:12px;
      display:none;
      white-space:pre-line;
    }

    .stack{display:flex;flex-direction:column;gap:12px}
    .card{
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      padding:14px;
      backdrop-filter: blur(6px);
    }

    .muted{opacity:.85;font-size:12px}
    input,textarea{
      width:100%;padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      color:#e5e7eb;outline:none
    }
    textarea{min-height:110px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}

    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .thumb{width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#0a1020;position:relative}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .x{
      position:absolute;top:6px;right:6px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;border-radius:10px;padding:2px 6px;font-size:11px
    }

    .feedWrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .feed{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
      min-height:240px;
    }
    @media(max-width:1100px){.feed{grid-template-columns: repeat(3, minmax(0,1fr));}}
    @media(max-width:900px){.feed{grid-template-columns: repeat(2, minmax(0,1fr));}}
    @media(max-width:620px){.feed{grid-template-columns: 1fr;}}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">UNIQUE 마켓</div>
      <div id="who" class="who">로그인 확인 중...</div>
    </div>
    <div class="btns">
      <button class="btn danger" id="btnExit">나가기</button>
      <button class="btn primary" id="btnLogin">구글 로그인</button>
      <button class="btn" id="btnReset" title="로그인 꼬였을 때 초기화">초기화</button>
    </div>
  </div>

  <div id="status" class="pill"></div>

  <div class="stack">
    <div class="card">
      <div style="font-weight:900;margin-bottom:8px;">등록</div>
      <div class="muted" style="margin-bottom:10px;">이미지 1~3장 (JPG/PNG/GIF). (파일 선택은 로그인 전에도 가능)</div>

      <div class="row">
        <div>
          <div class="muted" style="margin:0 0 6px;">제목</div>
          <input id="fTitle" placeholder="예: 미개봉 단백질 2통" />
        </div>
        <div>
          <div class="muted" style="margin:0 0 6px;">수량</div>
          <input id="fQty" type="number" placeholder="예: 2" />
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div>
          <div class="muted" style="margin:0 0 6px;">연락처</div>
          <input id="fContact" placeholder="예: 010-xxxx-xxxx / 오픈채팅 링크" />
        </div>
        <div>
          <div class="muted" style="margin:0 0 6px;">지역</div>
          <input id="fRegion" placeholder="예: 서울 강남 / 부산 해운대" />
        </div>
      </div>

      <div style="margin-top:10px;">
        <div class="muted" style="margin:0 0 6px;">설명</div>
        <textarea id="fDesc" placeholder="상태/사용감/전달 방식 등"></textarea>
      </div>

      <div style="margin-top:10px;">
        <div class="muted" style="margin:0 0 6px;">이미지(최대 3개)</div>
        <input id="fImages" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
        <div id="imgPreview" class="thumbs"></div>
      </div>

      <div class="btns" style="margin-top:10px;">
        <button class="btn primary" id="btnSave">등록하기</button>
      </div>

      <div id="loginNote" class="muted" style="margin-top:8px;">로그인 확인 중...</div>
    </div>

    <div class="card">
      <div class="feedWrap">
        <div style="font-weight:900;">게시글</div>
        <button class="btn" id="btnRefresh">새로고침</button>
      </div>
      <div id="feed" class="feed"></div>
    </div>
  </div>
</div>
<script>
(() => {
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const BUCKET = "market";
  const REDIRECT_TO = location.origin + location.pathname;

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");

  function setStatus(msg, isErr=false){
    if (!msg){ statusEl.style.display="none"; return; }
    statusEl.style.display="";
    statusEl.textContent = msg;
    statusEl.style.borderColor = isErr ? "rgba(248,113,113,.6)" : "rgba(255,255,255,.18)";
    statusEl.style.background = isErr ? "rgba(127,29,29,.25)" : "rgba(0,0,0,.18)";
  }

  // ✅ hash + query 정리 (access_token 숨김)
  function cleanUrlAll(){
    const u = new URL(location.href);
    u.searchParams.delete("autologin");
    u.searchParams.delete("code");
    u.searchParams.delete("state");
    history.replaceState({}, document.title, u.pathname + u.search); // hash 제거됨
  }

  function autologinOn(){
    return new URL(location.href).searchParams.get("autologin") === "1";
  }

  // ✅ 페이지에서 JS 에러가 나면 바로 화면에 표시
  window.addEventListener("error", (e) => {
    setStatus("JS 오류: " + (e?.message || e), true);
  });
  window.addEventListener("unhandledrejection", (e) => {
    setStatus("Promise 오류: " + (e?.reason?.message || e?.reason || e), true);
  });

  if (!window.supabase){
    $("who").textContent = "supabase-js 로드 실패";
    $("loginNote").textContent = "CDN(광고차단/네트워크) 문제";
    setStatus("supabase-js 로드 실패", true);
    return;
  }

  // ✅ implicit + 우리가 URL hash를 직접 흡수
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      flowType: "implicit",
      detectSessionInUrl: false,
      persistSession: true,
      autoRefreshToken: true
    }
  });

  let session = null;
  let user = null;

  function setLoggedOutUI(){
    $("who").textContent = "로그인 필요";
    $("loginNote").textContent = "파일 선택은 가능. 등록하려면 상단 ‘구글 로그인’을 누르세요.";
  }
  function setLoggedInUI(){
    const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
    const email = user.email || "";
    $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;
    $("loginNote").textContent = "로그인 완료 ✅ 등록 가능합니다.";
  }

  $("btnExit").onclick = () => location.replace("the-unique-gate.html");

  $("btnReset").onclick = () => {
    try{
      for (let i = localStorage.length - 1; i >= 0; i--){
        const k = localStorage.key(i);
        if (k && k.startsWith("sb-")) localStorage.removeItem(k);
      }
      sessionStorage.clear();
    }catch(e){}
    location.replace("market.html?autologin=1");
  };

  $("btnLogin").onclick = async () => {
    setStatus("구글 로그인 이동 중...");
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: REDIRECT_TO }
    });
    if (error) setStatus("구글 로그인 시작 실패: " + error.message, true);
  };

  // ✅ 핵심: #access_token 을 세션으로 “흡수”
  async function importSessionFromHash(){
    const hash = (location.hash || "").replace(/^#/, "");
    if (!hash) return null;

    // access_token 또는 에러가 있는 해시만 처리
    if (!hash.includes("access_token=") && !hash.includes("error=")) return null;

    setStatus("로그인 토큰 처리 중...");

    // 1) 있으면 Supabase 공식 함수로 처리
    if (typeof sb.auth.getSessionFromUrl === "function") {
      const { data, error } = await sb.auth.getSessionFromUrl({ storeSession: true });
      if (error) throw error;
      if (data?.session) {
        cleanUrlAll();           // ✅ 토큰 숨김
        setStatus("");
        return data.session;
      }
    }

    // 2) fallback: 직접 파싱해서 setSession
    const p = new URLSearchParams(hash);
    const access_token = p.get("access_token");
    const refresh_token = p.get("refresh_token");
    const err = p.get("error");
    const errDesc = p.get("error_description");

    if (err) {
      throw new Error(errDesc || err);
    }
    if (!access_token) return null;

    // refresh_token 없으면 setSession이 실패할 수 있어서, 없으면 에러로 명확히 처리
    if (!refresh_token) {
      throw new Error("refresh_token이 없습니다(implicit 설정/응답 확인 필요). 초기화 후 재로그인 해보세요.");
    }

    const { data, error } = await sb.auth.setSession({ access_token, refresh_token });
    if (error) throw error;

    cleanUrlAll();               // ✅ 토큰 숨김
    setStatus("");
    return data.session || null;
  }

  async function requireLogin(){
    $("who").textContent = "로그인 확인 중...";
    $("loginNote").textContent = "로그인 확인 중...";

    // code= 로 들어온 경우는 여기선 쓰지 않음(implicit만)
    const u = new URL(location.href);
    if (u.searchParams.get("code")) {
      setStatus("code 방식(PKCE)로 돌아왔습니다. 상단 ‘초기화’ 후 다시 로그인하세요.", true);
      setLoggedOutUI();
      return false;
    }

    // 1) 해시 토큰이 있으면 먼저 흡수
    try {
      const sHash = await importSessionFromHash();
      if (sHash) {
        session = sHash;
        user = sHash.user;
        setLoggedInUI();
        return true;
      }
    } catch (e) {
      setStatus("로그인 토큰 처리 실패: " + (e?.message || e), true);
      setLoggedOutUI();
      return false;
    }

    // 2) 저장된 세션 확인
    const { data, error } = await sb.auth.getSession();
    if (error) {
      setStatus("세션 확인 오류: " + error.message, true);
      setLoggedOutUI();
      return false;
    }

    if (!data.session) {
      setStatus("");
      setLoggedOutUI();
      if (autologinOn()) $("btnLogin").click();
      return false;
    }

    session = data.session;
    user = session.user;
    setStatus("");
    cleanUrlAll();
    setLoggedInUI();
    return true;
  }

  // ✅ 세션 생기는 순간 UI 즉시 갱신
  sb.auth.onAuthStateChange((_ev, s) => {
    if (s?.user) {
      session = s;
      user = s.user;
      cleanUrlAll();
      setStatus("");
      setLoggedInUI();
    }
  });

  // ====== (아래는 일단 로그인부터 잡는 게 우선이라, 게시글/등록은 그대로 유지 가능) ======
  $("btnSave").onclick = async () => {
    if (!user) return setStatus("등록하려면 로그인이 필요합니다.", true);
    setStatus("지금은 로그인만 먼저 안정화 중입니다. (다음 단계에서 등록/피드 연결 확정)", false);
  };
  $("btnRefresh").onclick = () => location.reload();

  // Boot
  (async () => {
    await requireLogin();
  })();
})();
</script>
</body>
</html>
