<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNIQUE 마켓</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Pretendard",sans-serif;background:#0b1220;color:#e5e7eb}
    a{color:inherit}
    .wrap{max-width:1200px;margin:0 auto;padding:16px}
    .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
    .brand{font-weight:900;letter-spacing:.12em}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);font-size:12px}
    .btns{display:flex;gap:8px;flex-wrap:wrap}
    button{cursor:pointer}
    .btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e5e7eb;font-weight:800}
    .btn.primary{background:rgba(255,255,255,.12)}
    .btn.danger{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.4)}
    .grid{display:grid;grid-template-columns: 1fr 1fr;gap:12px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .card{border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);padding:12px}
    .muted{opacity:.75;font-size:12px}
    input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:#e5e7eb;outline:none}
    textarea{min-height:84px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:620px){.row{grid-template-columns:1fr}}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:#0a1020;position:relative}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:2px 6px;font-size:11px}
    .feed{display:grid;grid-template-columns: repeat(3, minmax(0,1fr));gap:12px}
    @media(max-width:980px){.feed{grid-template-columns: repeat(2, minmax(0,1fr));}}
    @media(max-width:620px){.feed{grid-template-columns: 1fr;}}
    .post{border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);overflow:hidden}
    .postTop{padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .postTitle{font-weight:900}
    .postMeta{font-size:12px;opacity:.8;margin-top:6px;line-height:1.4}
    .postImg{width:100%;aspect-ratio:16/9;background:#0a1020;display:block;object-fit:cover}
    .postBtns{display:flex;gap:6px;flex-wrap:wrap}
    .chip{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);margin-right:6px}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">UNIQUE 마켓</div>
      <div id="who" class="muted">로딩 중...</div>
    </div>
    <div class="btns">
      <button class="btn" id="btnMain">UNIQUE MAIN</button>
      <button class="btn danger" id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div id="status" class="pill" style="display:none;"></div>

  <div id="viewList">
    <div class="grid">
      <!-- 작성/수정 -->
      <div class="card">
        <div style="font-weight:900;margin-bottom:8px;">등록 / 수정</div>
        <div class="muted" style="margin-bottom:10px;">이미지 1~3장 (JPG/PNG/GIF). 새 이미지 선택 시 기존 이미지는 교체됩니다.</div>

        <div class="row">
          <div>
            <div class="muted" style="margin:0 0 6px;">제목</div>
            <input id="fTitle" placeholder="예: 미개봉 단백질 2통" />
          </div>
          <div>
            <div class="muted" style="margin:0 0 6px;">수량</div>
            <input id="fQty" type="number" placeholder="예: 2" />
          </div>
        </div>

        <div class="row" style="margin-top:10px;">
          <div>
            <div class="muted" style="margin:0 0 6px;">연락처</div>
            <input id="fContact" placeholder="예: 010-xxxx-xxxx / 오픈채팅 링크" />
          </div>
          <div>
            <div class="muted" style="margin:0 0 6px;">지역</div>
            <input id="fRegion" placeholder="예: 서울 강남 / 부산 해운대" />
          </div>
        </div>

        <div style="margin-top:10px;">
          <div class="muted" style="margin:0 0 6px;">설명</div>
          <textarea id="fDesc" placeholder="상태/사용감/전달 방식 등"></textarea>
        </div>

        <div style="margin-top:10px;">
          <div class="muted" style="margin:0 0 6px;">이미지(최대 3개)</div>
          <input id="fImages" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
          <div id="imgPreview" class="thumbs"></div>
        </div>

        <div class="btns" style="margin-top:10px;">
          <button class="btn primary" id="btnSave">등록하기</button>
        </div>
      </div>

      <!-- 리스트 -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="font-weight:900;">게시글</div>
          <button class="btn" id="btnRefresh">새로고침</button>
        </div>
        <div style="height:10px"></div>
        <div id="feed" class="feed"></div>
      </div>
    </div>
  </div>
</div>
<script>
  // ===== Supabase 설정 =====
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const BUCKET = "market";

  // ✅ 리다이렉트는 market.html (쿼리 없이)로 고정
  const REDIRECT_TO = location.origin + location.pathname;

  // ✅ PKCE 권장 (code=... 처리)
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      flowType: "pkce",
      detectSessionInUrl: true,
      persistSession: true,
      autoRefreshToken: true
    }
  });

  const $ = (id) => document.getElementById(id);
  const show = (el, on) => el.style.display = on ? "" : "none";

  const stateEl = $("status");
  function setStatus(msg, isErr=false){
    if (!msg){ show(stateEl,false); return; }
    show(stateEl,true);
    stateEl.textContent = msg;
    stateEl.style.borderColor = isErr ? "rgba(248,113,113,.6)" : "rgba(255,255,255,.16)";
    stateEl.style.background = isErr ? "rgba(127,29,29,.25)" : "rgba(255,255,255,.05)";
  }

  let session = null;
  let user = null;

  function autologinOn(){
    return new URL(location.href).searchParams.get("autologin") === "1";
  }

  function cleanUrl(){
    const u = new URL(location.href);
    // autologin 제거
    if (u.searchParams.get("autologin") === "1") u.searchParams.delete("autologin");
    // OAuth code/state 제거
    if (u.searchParams.has("code")) u.searchParams.delete("code");
    if (u.searchParams.has("state")) u.searchParams.delete("state");
    // hash(#access_token...) 제거
    history.replaceState({}, document.title, u.pathname + u.search);
  }

  function setFormEnabled(on){
    const ids = ["fTitle","fQty","fContact","fRegion","fDesc","fImages","btnSave","btnRefresh"];
    ids.forEach(id => {
      const el = $(id);
      if (el) el.disabled = !on;
    });
  }

  // ✅ 상단 버튼: 로그아웃 대신 "나가기"로 처리(게이트로 이동)
  const btnMain = $("btnMain");
  if (btnMain) btnMain.addEventListener("click", () => location.href = "the-unique-main.html");

  const btnExit = $("btnExit") || $("btnLogout"); // 기존 id 둘다 대응
  if (btnExit){
    btnExit.textContent = "나가기";
    btnExit.addEventListener("click", () => location.replace("the-unique-gate.html"));
  }

  // ✅ 수동 로그인 버튼(필요할 때만 보이게)
  const btnsBox = document.querySelector(".btns");
  const loginBtn = document.createElement("button");
  loginBtn.className = "btn primary";
  loginBtn.id = "btnLogin";
  loginBtn.textContent = "구글 로그인";
  loginBtn.style.display = "none";
  btnsBox && btnsBox.prepend(loginBtn);

  function showLoginBtn(on){
    loginBtn.style.display = on ? "" : "none";
  }

  async function startOAuth(){
    setStatus("구글 로그인으로 이동 중...");
    const { data, error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: REDIRECT_TO,
        skipBrowserRedirect: true
      }
    });

    if (error){
      setStatus("구글 로그인 시작 실패: " + error.message, true);
      showLoginBtn(true);
      return;
    }

    if (data?.url){
      location.assign(data.url);
    } else {
      setStatus("구글 로그인 URL 생성 실패", true);
      showLoginBtn(true);
    }
  }

  loginBtn.addEventListener("click", () => startOAuth());

  async function exchangeCodeIfExists(){
    const u = new URL(location.href);
    const code = u.searchParams.get("code");
    if (!code) return null;

    setStatus("로그인 처리 중...");
    const { data, error } = await sb.auth.exchangeCodeForSession(code);
    if (error){
      setStatus("로그인 처리 실패: " + error.message, true);
      return null;
    }
    return data.session || null;
  }

  async function getSessionStable(maxMs=8000){
    const start = Date.now();
    while (Date.now() - start < maxMs){
      const { data } = await sb.auth.getSession();
      if (data.session) return data.session;
      await new Promise(r => setTimeout(r, 200));
    }
    return null;
  }

  async function requireLogin(){
    setFormEnabled(false);
    showLoginBtn(false);

    // 1) OAuth 돌아온 경우(code=...)면 먼저 교환
    session = await exchangeCodeIfExists();

    // 2) 그래도 없으면 저장된 세션 확인
    if (!session){
      session = await getSessionStable(1500);
    }

    // 3) 세션 없으면 autologin 처리 or gate로
    if (!session){
      $("who").textContent = "로그인 필요";

      if (autologinOn()){
        // 무한 루프 방지(탭 당 1회 자동 시도)
        if (sessionStorage.getItem("market_oauth_started") !== "1"){
          sessionStorage.setItem("market_oauth_started", "1");
          await startOAuth();
        } else {
          setStatus("로그인이 아직 완료되지 않았습니다. 상단 '구글 로그인'을 눌러주세요.", true);
          showLoginBtn(true);
        }
        return false;
      }

      location.replace("the-unique-gate.html");
      return false;
    }

    // ✅ 로그인 성공
    sessionStorage.removeItem("market_oauth_started");
    cleanUrl();

    user = session.user;
    const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
    const email = user.email || "";
    $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;

    setStatus("");
    setFormEnabled(true);
    return true;
  }

  // ===== 업로드/등록 =====
  let selectedFiles = [];
  let previewUrls = [];

  function toPublicUrl(path){
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  function fileExt(file){
    const n = file.name || "";
    const dot = n.lastIndexOf(".");
    return dot >= 0 ? n.slice(dot+1).toLowerCase() : "png";
  }
  function escapeHtml(s){
    return (s||"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }
  function safeName(s){ return (s||"").toString().trim(); }

  function clearPreviews(){
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = [];
    $("fImages").value = "";
    $("imgPreview").innerHTML = "";
  }

  function renderPreviews(){
    const box = $("imgPreview");
    box.innerHTML = "";
    selectedFiles.slice(0,3).forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      previewUrls.push(url);
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<img src="${url}" alt=""><button class="x" type="button">X</button>`;
      d.querySelector(".x").onclick = () => {
        selectedFiles.splice(idx, 1);
        renderPreviews();
      };
      box.appendChild(d);
    });
  }

  $("fImages").addEventListener("change", (e) => {
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = Array.from(e.target.files || []).slice(0,3);
    renderPreviews();
  });

  async function uploadImages(postId){
    if (!selectedFiles.length) return [];
    setStatus("이미지 업로드 중...");
    const urls = [];

    for (let i=0; i<Math.min(3, selectedFiles.length); i++){
      const f = selectedFiles[i];
      const ext = fileExt(f);
      const path = `posts/${postId}/${Date.now()}_${i}.${ext}`;

      const { error } = await sb.storage.from(BUCKET).upload(path, f, {
        upsert: false,
        contentType: f.type
      });
      if (error) throw new Error("이미지 업로드 실패: " + error.message);
      urls.push(toPublicUrl(path));
    }
    return urls;
  }

  async function createPost(){
    const title = safeName($("fTitle").value);
    if (!title) { setStatus("제목은 필수입니다.", true); return; }
    if (!user) { setStatus("로그인이 아직 완료되지 않았습니다. 상단 '구글 로그인'을 먼저 눌러주세요.", true); showLoginBtn(true); return; }

    const qty = $("fQty").value ? parseInt($("fQty").value, 10) : null;
    const contact = safeName($("fContact").value);
    const region = safeName($("fRegion").value);
    const description = safeName($("fDesc").value);

    setStatus("등록 중...");
    const owner_name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "";

    const { data, error } = await sb
      .from("market_posts")
      .insert({ owner: user.id, owner_name, title, qty, contact, region, description, images: [] })
      .select("id")
      .single();

    if (error) { setStatus("등록 실패: " + error.message, true); return; }

    try{
      const urls = await uploadImages(data.id);
      if (urls.length) {
        const { error: e2 } = await sb.from("market_posts").update({ images: urls }).eq("id", data.id);
        if (e2) throw new Error("DB 업데이트 실패: " + e2.message);
      }
      setStatus("등록 완료!");
      clearPreviews();
      $("fTitle").value=""; $("fQty").value=""; $("fContact").value=""; $("fRegion").value=""; $("fDesc").value="";
      await renderFeed();
    } catch(e){
      setStatus(e.message, true);
    }
  }

  $("btnSave").addEventListener("click", () => createPost());

  async function loadPosts(){
    setStatus("불러오는 중...");
    const { data, error } = await sb
      .from("market_posts")
      .select("*")
      .order("created_at", { ascending:false });

    if (error) { setStatus("불러오기 실패: " + error.message, true); return []; }
    setStatus("");
    return data || [];
  }

  function postCardHtml(p){
    const imgs = Array.isArray(p.images) ? p.images : [];
    const cover = imgs[0] || "";
    return `
      <div class="post">
        ${cover ? `<img class="postImg" src="${cover}" alt="">` : `<div class="postImg"></div>`}
        <div class="postTop">
          <div>
            <div class="postTitle">${escapeHtml(p.title)}</div>
            <div class="postMeta">
              <span class="chip">수량 ${p.qty ?? "-"}</span>
              <span class="chip">${escapeHtml(p.region || "-")}</span><br>
              <span class="muted">연락: ${escapeHtml(p.contact || "-")}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function renderFeed(){
    const posts = await loadPosts();
    $("feed").innerHTML = posts.map(postCardHtml).join("") || `<div class="muted">아직 글이 없습니다.</div>`;
  }

  $("btnRefresh").addEventListener("click", () => renderFeed());

  // ✅ 로그인 완료 이벤트도 잡아줌(세션 늦게 생기는 케이스)
  sb.auth.onAuthStateChange((_event, s) => {
    if (s?.user) {
      session = s;
      user = s.user;
      cleanUrl();
      const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
      const email = user.email || "";
      $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;
      setStatus("");
      setFormEnabled(true);
      renderFeed();
    }
  });

  // Boot
  (async () => {
    const ok = await requireLogin();
    if (!ok) return;
    await renderFeed();
  })();

  async function getSessionStable(maxMs=8000){
    const start = Date.now();
    while (Date.now() - start < maxMs){
      const { data } = await sb.auth.getSession();
      if (data.session) return data.session;
      await new Promise(r => setTimeout(r, 200));
    }
    return null;
  }

  async function requireLogin(){
    setFormEnabled(false);
    showLoginBtn(false);

    // 1) OAuth 돌아온 경우(code=...)면 먼저 교환
    session = await exchangeCodeIfExists();

    // 2) 그래도 없으면 저장된 세션 확인
    if (!session){
      session = await getSessionStable(1500);
    }

    // 3) 세션 없으면 autologin 처리 or gate로
    if (!session){
      $("who").textContent = "로그인 필요";

      if (autologinOn()){
        // 무한 루프 방지(탭 당 1회 자동 시도)
        if (sessionStorage.getItem("market_oauth_started") !== "1"){
          sessionStorage.setItem("market_oauth_started", "1");
          await startOAuth();
        } else {
          setStatus("로그인이 아직 완료되지 않았습니다. 상단 '구글 로그인'을 눌러주세요.", true);
          showLoginBtn(true);
        }
        return false;
      }

      location.replace("the-unique-gate.html");
      return false;
    }

    // ✅ 로그인 성공
    sessionStorage.removeItem("market_oauth_started");
    cleanUrl();

    user = session.user;
    const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
    const email = user.email || "";
    $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;

    setStatus("");
    setFormEnabled(true);
    return true;
  }

  // ===== 업로드/등록 =====
  let selectedFiles = [];
  let previewUrls = [];

  function toPublicUrl(path){
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  function fileExt(file){
    const n = file.name || "";
    const dot = n.lastIndexOf(".");
    return dot >= 0 ? n.slice(dot+1).toLowerCase() : "png";
  }
  function escapeHtml(s){
    return (s||"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }
  function safeName(s){ return (s||"").toString().trim(); }

  function clearPreviews(){
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = [];
    $("fImages").value = "";
    $("imgPreview").innerHTML = "";
  }

  function renderPreviews(){
    const box = $("imgPreview");
    box.innerHTML = "";
    selectedFiles.slice(0,3).forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      previewUrls.push(url);
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<img src="${url}" alt=""><button class="x" type="button">X</button>`;
      d.querySelector(".x").onclick = () => {
        selectedFiles.splice(idx, 1);
        renderPreviews();
      };
      box.appendChild(d);
    });
  }

  $("fImages").addEventListener("change", (e) => {
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = Array.from(e.target.files || []).slice(0,3);
    renderPreviews();
  });

  async function uploadImages(postId){
    if (!selectedFiles.length) return [];
    setStatus("이미지 업로드 중...");
    const urls = [];

    for (let i=0; i<Math.min(3, selectedFiles.length); i++){
      const f = selectedFiles[i];
      const ext = fileExt(f);
      const path = `posts/${postId}/${Date.now()}_${i}.${ext}`;

      const { error } = await sb.storage.from(BUCKET).upload(path, f, {
        upsert: false,
        contentType: f.type
      });
      if (error) throw new Error("이미지 업로드 실패: " + error.message);
      urls.push(toPublicUrl(path));
    }
    return urls;
  }

  async function createPost(){
    const title = safeName($("fTitle").value);
    if (!title) { setStatus("제목은 필수입니다.", true); return; }
    if (!user) { setStatus("로그인이 아직 완료되지 않았습니다. 상단 '구글 로그인'을 먼저 눌러주세요.", true); showLoginBtn(true); return; }

    const qty = $("fQty").value ? parseInt($("fQty").value, 10) : null;
    const contact = safeName($("fContact").value);
    const region = safeName($("fRegion").value);
    const description = safeName($("fDesc").value);

    setStatus("등록 중...");
    const owner_name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "";

    const { data, error } = await sb
      .from("market_posts")
      .insert({ owner: user.id, owner_name, title, qty, contact, region, description, images: [] })
      .select("id")
      .single();

    if (error) { setStatus("등록 실패: " + error.message, true); return; }

    try{
      const urls = await uploadImages(data.id);
      if (urls.length) {
        const { error: e2 } = await sb.from("market_posts").update({ images: urls }).eq("id", data.id);
        if (e2) throw new Error("DB 업데이트 실패: " + e2.message);
      }
      setStatus("등록 완료!");
      clearPreviews();
      $("fTitle").value=""; $("fQty").value=""; $("fContact").value=""; $("fRegion").value=""; $("fDesc").value="";
      await renderFeed();
    } catch(e){
      setStatus(e.message, true);
    }
  }

  $("btnSave").addEventListener("click", () => createPost());

  async function loadPosts(){
    setStatus("불러오는 중...");
    const { data, error } = await sb
      .from("market_posts")
      .select("*")
      .order("created_at", { ascending:false });

    if (error) { setStatus("불러오기 실패: " + error.message, true); return []; }
    setStatus("");
    return data || [];
  }

  function postCardHtml(p){
    const imgs = Array.isArray(p.images) ? p.images : [];
    const cover = imgs[0] || "";
    return `
      <div class="post">
        ${cover ? `<img class="postImg" src="${cover}" alt="">` : `<div class="postImg"></div>`}
        <div class="postTop">
          <div>
            <div class="postTitle">${escapeHtml(p.title)}</div>
            <div class="postMeta">
              <span class="chip">수량 ${p.qty ?? "-"}</span>
              <span class="chip">${escapeHtml(p.region || "-")}</span><br>
              <span class="muted">연락: ${escapeHtml(p.contact || "-")}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function renderFeed(){
    const posts = await loadPosts();
    $("feed").innerHTML = posts.map(postCardHtml).join("") || `<div class="muted">아직 글이 없습니다.</div>`;
  }

  $("btnRefresh").addEventListener("click", () => renderFeed());

  // ✅ 로그인 완료 이벤트도 잡아줌(세션 늦게 생기는 케이스)
  sb.auth.onAuthStateChange((_event, s) => {
    if (s?.user) {
      session = s;
      user = s.user;
      cleanUrl();
      const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
      const email = user.email || "";
      $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;
      setStatus("");
      setFormEnabled(true);
      renderFeed();
    }
  });

  // Boot
  (async () => {
    const ok = await requireLogin();
    if (!ok) return;
    await renderFeed();
  })();
</script>
</body>
</html>
