<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNIQUE 마켓</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Pretendard",sans-serif;
      color:#e5e7eb;
      background:#0b1220 url("img/bg-market.jpg") center/cover fixed no-repeat;
      position:relative;
    }
    /* ✅ 배경 더 밝게(오버레이 약하게) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background: radial-gradient(circle at top,
        rgba(2,6,23,.18),
        rgba(2,6,23,.55) 65%,
        rgba(2,6,23,.65)
      );
      z-index:-1;
    }

    .wrap{max-width:1200px;margin:0 auto;padding:16px;position:relative;z-index:1}
    .topbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .brand{font-weight:900;letter-spacing:.12em;font-size:18px}
    .who{opacity:.85;font-size:12px;margin-top:4px}

    .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{cursor:pointer}
    .btn{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.10);
      color:#e5e7eb;font-weight:800
    }
    .btn.primary{background:rgba(255,255,255,.16)}
    .btn.danger{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.45)}

    .pill{
      padding:8px 12px;border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      font-size:12px;
      margin-bottom:12px;
      display:none;
      white-space:pre-line;
    }

    .stack{display:flex;flex-direction:column;gap:12px}
    .card{
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      padding:14px;
      backdrop-filter: blur(6px);
    }

    .muted{opacity:.8;font-size:12px}
    input,textarea{
      width:100%;padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      color:#e5e7eb;outline:none
    }
    textarea{min-height:110px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}

    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .thumb{width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#0a1020;position:relative}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .x{
      position:absolute;top:6px;right:6px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;border-radius:10px;padding:2px 6px;font-size:11px
    }

    .feedWrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .feed{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
      min-height:360px;
    }
    @media(max-width:1100px){.feed{grid-template-columns: repeat(3, minmax(0,1fr));}}
    @media(max-width:900px){.feed{grid-template-columns: repeat(2, minmax(0,1fr));}}
    @media(max-width:620px){.feed{grid-template-columns: 1fr;}}

    .post{border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);overflow:hidden}
    .postTop{padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .postTitle{font-weight:900}
    .postMeta{font-size:12px;opacity:.82;margin-top:6px;line-height:1.45}
    .postImg{width:100%;aspect-ratio:16/9;background:#0a1020;display:block;object-fit:cover}
    .chip{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);margin-right:6px}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">UNIQUE 마켓</div>
      <div id="who" class="who">로그인 확인 중...</div>
    </div>
    <div class="btns">
      <button class="btn danger" id="btnExit">나가기</button>
      <!-- ✅ 로그인 버튼 항상 보이게 -->
      <button class="btn primary" id="btnLogin">구글 로그인</button>
    </div>
  </div>

  <div id="status" class="pill"></div>

  <div class="stack">
    <div class="card">
      <div style="font-weight:900;margin-bottom:8px;">등록</div>
      <div class="muted" style="margin-bottom:10px;">이미지 1~3장 (JPG/PNG/GIF).</div>

      <div class="row">
        <div>
          <div class="muted" style="margin:0 0 6px;">제목</div>
          <input id="fTitle" placeholder="예: 미개봉 단백질 2통" />
        </div>
        <div>
          <div class="muted" style="margin:0 0 6px;">수량</div>
          <input id="fQty" type="number" placeholder="예: 2" />
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div>
          <div class="muted" style="margin:0 0 6px;">연락처</div>
          <input id="fContact" placeholder="예: 010-xxxx-xxxx / 오픈채팅 링크" />
        </div>
        <div>
          <div class="muted" style="margin:0 0 6px;">지역</div>
          <input id="fRegion" placeholder="예: 서울 강남 / 부산 해운대" />
        </div>
      </div>

      <div style="margin-top:10px;">
        <div class="muted" style="margin:0 0 6px;">설명</div>
        <textarea id="fDesc" placeholder="상태/사용감/전달 방식 등"></textarea>
      </div>

      <div style="margin-top:10px;">
        <div class="muted" style="margin:0 0 6px;">이미지(최대 3개)</div>
        <input id="fImages" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
        <div id="imgPreview" class="thumbs"></div>
      </div>

      <div class="btns" style="margin-top:10px;">
        <!-- ✅ disabled 제거: 눌렀을 때 로그인 유도 -->
        <button class="btn primary" id="btnSave">등록하기</button>
      </div>

      <!-- ✅ 문구를 “고정 텍스트”가 아니라 “상태 텍스트”로 -->
      <div id="loginNote" class="muted" style="margin-top:8px;">
        로그인 확인 중...
      </div>
    </div>

    <div class="card">
      <div class="feedWrap">
        <div style="font-weight:900;">게시글</div>
        <button class="btn" id="btnRefresh">새로고침</button>
      </div>
      <div id="feed" class="feed"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const BUCKET = "market";
  const REDIRECT_TO = location.origin + location.pathname; // .../market.html

  const $ = (id) => document.getElementById(id);

  const statusEl = $("status");
  function setStatus(msg, isErr=false){
    if (!msg){ statusEl.style.display="none"; return; }
    statusEl.style.display="";
    statusEl.textContent = msg;
    statusEl.style.borderColor = isErr ? "rgba(248,113,113,.6)" : "rgba(255,255,255,.18)";
    statusEl.style.background = isErr ? "rgba(127,29,29,.25)" : "rgba(0,0,0,.18)";
  }

  function autologinOn(){
    return new URL(location.href).searchParams.get("autologin") === "1";
  }
  function cleanUrl(){
    const u = new URL(location.href);
    u.searchParams.delete("autologin");
    u.searchParams.delete("code");
    u.searchParams.delete("state");
    history.replaceState({}, document.title, u.pathname + u.search);
  }

  if (!window.supabase){
    $("who").textContent = "supabase-js 로드 실패";
    $("loginNote").textContent = "CDN 로딩이 막혔습니다(광고차단/네트워크 확인).";
    setStatus("supabase-js 로드 실패", true);
    return;
  }

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { flowType:"pkce", detectSessionInUrl:true, persistSession:true, autoRefreshToken:true }
  });

  let session = null;
  let user = null;

  function setLoggedOutUI(){
    $("who").textContent = "로그인 필요";
    $("loginNote").textContent = "등록하려면 상단 ‘구글 로그인’을 눌러주세요.";
  }
  function setLoggedInUI(){
    const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
    const email = user.email || "";
    $("who").textContent = `로그인: ${name || email || user.id.slice(0,8)}`;
    $("loginNote").textContent = "로그인 완료 ✅ 등록 가능합니다.";
  }

  $("btnExit").addEventListener("click", () => location.replace("the-unique-gate.html"));
  $("btnLogin").addEventListener("click", () => startOAuth());

  async function startOAuth(){
    setStatus("구글 로그인 이동 중...");
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: REDIRECT_TO }
    });
    if (error){
      setStatus("구글 로그인 시작 실패: " + error.message, true);
    }
  }

  // ✅ 로그인 확인은 “2초 내 결론”
  async function requireLoginFast(){
    $("who").textContent = "로그인 확인 중...";
    $("loginNote").textContent = "로그인 확인 중...";

    // OAuth 리다이렉트 직후 세션이 늦게 잡히는 경우도 있어서 짧게 폴링
    const start = Date.now();
    while (Date.now() - start < 2000){
      try{
        const { data } = await sb.auth.getSession();
        if (data.session){
          session = data.session;
          user = session.user;
          cleanUrl();
          setStatus("");
          setLoggedInUI();
          return true;
        }
      } catch(e) {
        console.error(e);
        setStatus("세션 확인 오류: " + (e?.message || e), true);
        break;
      }
      await new Promise(r => setTimeout(r, 200));
    }

    // ✅ 여기까지 왔으면 “로그인 안 된 상태”로 확정
    setStatus("");
    setLoggedOutUI();

    // autologin=1이면 1회 자동 시작
    if (autologinOn() && sessionStorage.getItem("market_oauth_started") !== "1"){
      sessionStorage.setItem("market_oauth_started","1");
      await startOAuth();
    }

    return false;
  }

  // auth 이벤트로도 즉시 반영
  sb.auth.onAuthStateChange((_ev, s) => {
    if (s?.user) {
      session = s;
      user = s.user;
      sessionStorage.removeItem("market_oauth_started");
      cleanUrl();
      setStatus("");
      setLoggedInUI();
      renderFeed();
    }
  });

  // ===== 이미지 프리뷰 =====
  let selectedFiles = [];
  let previewUrls = [];

  function clearPreviews(){
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = [];
    $("fImages").value = "";
    $("imgPreview").innerHTML = "";
  }

  function renderPreviews(){
    const box = $("imgPreview");
    box.innerHTML = "";
    selectedFiles.slice(0,3).forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      previewUrls.push(url);
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<img src="${url}" alt=""><button class="x" type="button">X</button>`;
      d.querySelector(".x").onclick = () => { selectedFiles.splice(idx, 1); renderPreviews(); };
      box.appendChild(d);
    });
  }

  $("fImages").addEventListener("change", (e) => {
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = Array.from(e.target.files || []).slice(0,3);
    renderPreviews();
  });

  function toPublicUrl(path){ return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }
  function fileExt(file){
    const n = file.name || "";
    const dot = n.lastIndexOf(".");
    return dot >= 0 ? n.slice(dot+1).toLowerCase() : "png";
  }
  function safeName(s){ return (s||"").toString().trim(); }
  function escapeHtml(s){
    return (s||"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  async function uploadImages(postId){
    if (!selectedFiles.length) return [];
    setStatus("이미지 업로드 중...");
    const urls = [];
    for (let i=0; i<Math.min(3, selectedFiles.length); i++){
      const f = selectedFiles[i];
      const ext = fileExt(f);
      const path = `posts/${postId}/${Date.now()}_${i}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, f, { upsert:false, contentType:f.type });
      if (error) throw new Error("이미지 업로드 실패: " + error.message);
      urls.push(toPublicUrl(path));
    }
    return urls;
  }

  async function createPost(){
    const title = safeName($("fTitle").value);
    if (!title) return setStatus("제목은 필수입니다.", true);

    if (!user){
      setStatus("등록하려면 로그인이 필요합니다. 상단 ‘구글 로그인’을 누르세요.", true);
      return;
    }

    const qty = $("fQty").value ? parseInt($("fQty").value, 10) : null;
    const contact = safeName($("fContact").value);
    const region = safeName($("fRegion").value);
    const description = safeName($("fDesc").value);
    const owner_name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "";

    setStatus("등록 중...");
    const { data, error } = await sb
      .from("market_posts")
      .insert({ owner: user.id, owner_name, title, qty, contact, region, description, images: [] })
      .select("id")
      .single();

    if (error) return setStatus("등록 실패: " + error.message, true);

    try{
      const urls = await uploadImages(data.id);
      if (urls.length) {
        const { error: e2 } = await sb.from("market_posts").update({ images: urls }).eq("id", data.id);
        if (e2) throw new Error("DB 업데이트 실패: " + e2.message);
      }
      setStatus("등록 완료!");
      clearPreviews();
      $("fTitle").value=""; $("fQty").value=""; $("fContact").value=""; $("fRegion").value=""; $("fDesc").value="";
      await renderFeed();
    } catch(e){
      setStatus(e.message, true);
    }
  }

  async function loadPosts(){
    setStatus("게시글 불러오는 중...");
    const { data, error } = await sb.from("market_posts").select("*").order("created_at", { ascending:false });
    if (error) { setStatus("불러오기 실패: " + error.message, true); return []; }
    return data || [];
  }

  function postCardHtml(p){
    const imgs = Array.isArray(p.images) ? p.images : [];
    const cover = imgs[0] || "";
    return `
      <div class="post">
        ${cover ? `<img class="postImg" src="${cover}" alt="">` : `<div class="postImg"></div>`}
        <div class="postTop">
          <div>
            <div class="postTitle">${escapeHtml(p.title)}</div>
            <div class="postMeta">
              <span class="chip">수량 ${p.qty ?? "-"}</span>
              <span class="chip">${escapeHtml(p.region || "-")}</span><br>
              <span class="muted">연락: ${escapeHtml(p.contact || "-")}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function renderFeed(){
    const posts = await loadPosts();
    $("feed").innerHTML = posts.map(postCardHtml).join("") || `<div class="muted">아직 글이 없습니다.</div>`;
    setStatus("");
  }

  $("btnSave").addEventListener("click", () => createPost());
  $("btnRefresh").addEventListener("click", () => renderFeed());

  (async () => {
    await requireLoginFast();
    await renderFeed();
  })();
})();
</script>
</body>
</html>
