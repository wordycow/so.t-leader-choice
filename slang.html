<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>슬랭 사전 - THE UNIQUE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --text-dark: #1e293b;
      --text-gray: #64748b;
      --border: #e2e8f0;
      --shadow: rgba(0,0,0,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #1a1a2e url('img/slang-background.png') center/cover no-repeat fixed;
      min-height: 100vh;
      color: var(--text-dark);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.6s ease;
    }

    .header-title {
      font-size: 48px;
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.9);
      font-weight: 500;
    }

    .search-box {
      background: var(--bg-white);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px var(--shadow);
      margin-bottom: 30px;
      animation: fadeInUp 0.6s ease 0.1s both;
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 18px 60px 18px 24px;
      font-size: 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    .results-container {
      background: var(--bg-white);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px var(--shadow);
      animation: fadeInUp 0.6s ease 0.2s both;
    }

    .result-item {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      animation: slideInUp 0.4s ease;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-word {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .result-pronunciation {
      font-size: 16px;
      color: var(--text-gray);
      margin-bottom: 12px;
    }

    .result-meaning {
      font-size: 18px;
      line-height: 1.8;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .result-example {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-gray);
      background: var(--bg-light);
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .suggestion-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .suggestion-title {
      font-size: 18px;
      font-weight: 700;
      color: #856404;
      margin-bottom: 12px;
    }

    .suggestion-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .suggestion-item {
      background: white;
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid var(--primary);
    }

    .suggestion-item:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-gray);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-text {
      font-size: 20px;
      font-weight: 600;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .header-title {
        font-size: 36px;
      }

      .result-word {
        font-size: 24px;
      }

      .search-box, .results-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title">💬 슬랭 사전</h1>
      <p class="header-subtitle">최신 인터넷 신조어를 쉽게 찾아보세요</p>
    </div>

    <div class="search-box">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="검색할 단어를 입력하세요 (예: ㅇㅈ, TMI, 억텐)" autocomplete="off">
        <button class="search-btn" onclick="searchSlang()">검색</button>
      </div>
    </div>

    <div class="results-container" id="resultsContainer">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">검색어를 입력해주세요</div>
      </div>
    </div>
  </div>

  <script>
    // 슬랭 사전 데이터베이스
    const SLANG_DATABASE = [
      {
        word: 'ㅇㅈ',
        pronunciation: '인정',
        meaning: '누군가의 의견이나 생각에 동의할 때 사용하는 표현',
        example: '친구: "오늘 날씨 완전 좋다!" / 나: "ㅇㅈ"',
        tags: ['초성', '줄임말', '인정']
      },
      {
        word: 'TMI',
        pronunciation: '티엠아이',
        meaning: 'Too Much Information의 약자로, 굳이 알 필요 없는 과도한 정보를 말할 때 사용',
        example: 'TMI인데, 나 오늘 아침에 바나나 우유 마셨어',
        tags: ['영어', '약자', 'tmi', '정보']
      },
      {
        word: '억텐',
        pronunciation: '억지텐션',
        meaning: '억지로 텐션을 올리는 것. 흥분되지 않은 상황에서 분위기를 띄우려고 노력하는 모습',
        example: '회식 자리에서 억텐 떨다가 너무 힘들었어',
        tags: ['억지', '텐션', '분위기']
      },
      {
        word: '갓벽',
        pronunciation: '갓벽',
        meaning: 'God + 완벽의 합성어로, 신처럼 완벽하다는 의미',
        example: '이번 공연 갓벽했어!',
        tags: ['god', '완벽', '칭찬']
      },
      {
        word: '레알',
        pronunciation: '레알',
        meaning: '스페인어 Real에서 유래. "진짜"라는 뜻',
        example: '레알 맛있다 이거',
        tags: ['진짜', 'real', '스페인어']
      },
      {
        word: '별다줄',
        pronunciation: '별다줄',
        meaning: '별걸 다 줄인다의 줄임말. 무엇이든 줄여서 말하는 현상을 비꼬는 표현',
        example: '요즘 애들은 별다줄이야',
        tags: ['줄임말', '비판', '신조어']
      },
      {
        word: 'MBTI',
        pronunciation: '엠비티아이',
        meaning: 'Myers-Briggs Type Indicator의 약자로, 성격 유형 검사',
        example: '너 MBTI 뭐야? 나는 ENFP야',
        tags: ['성격', '검사', '약자']
      },
      {
        word: '낄끼빠빠',
        pronunciation: '낄끼빠빠',
        meaning: '낄 때 끼고 빠질 때 빠지라는 뜻. 상황 파악을 잘하라는 의미',
        example: '분위기 파악 좀 하고 낄끼빠빠 해',
        tags: ['행동', '조언', '상황파악']
      },
      {
        word: '오운완',
        pronunciation: '오운완',
        meaning: '오늘 운동 완료의 줄임말',
        example: '헬스장 다녀왔어. 오운완!',
        tags: ['운동', '줄임말', '완료']
      },
      {
        word: '킹받네',
        pronunciation: '킹받네',
        meaning: '"엄청 빡치네"의 의미. King + 받네의 합성어',
        example: '버스 놓쳤어. 킹받네',
        tags: ['화남', 'king', '감정']
      },
      {
        word: '어쩔티비',
        pronunciation: '어쩔티비',
        meaning: '"어쩔 TV", "어쩌라고"의 변형. 상대의 말에 무관심하거나 도발적으로 응수할 때',
        example: '친구: "너 숙제 안 했지?" / 나: "어쩔티비"',
        tags: ['도발', '무관심', '유행어']
      },
      {
        word: '스불재',
        pronunciation: '스불재',
        meaning: '스스로 불러온 재앙의 줄임말',
        example: '시험공부 안 하고 놀다가 망했어. 완전 스불재야',
        tags: ['자업자득', '후회', '줄임말']
      },
      {
        word: '갑분싸',
        pronunciation: '갑분싸',
        meaning: '갑자기 분위기 싸해짐의 줄임말',
        example: '다들 웃다가 그 얘기 나오니까 갑분싸 됐어',
        tags: ['분위기', '급변', '싸함']
      },
      {
        word: 'JMT',
        pronunciation: '존맛탱',
        meaning: '존나 맛있다의 약자. 매우 맛있다는 의미',
        example: '이 떡볶이 JMT다!',
        tags: ['맛', '음식', '약자']
      },
      {
        word: '극혐',
        pronunciation: '극혐',
        meaning: '극도로 혐오스럽다의 줄임말',
        example: '길에 침 뱉는 사람들 극혐이야',
        tags: ['혐오', '싫음', '감정']
      },
      {
        word: '노답',
        pronunciation: '노답',
        meaning: '답이 없다의 줄임말. 해결책이 없는 상황',
        example: '이 문제는 진짜 노답이야',
        tags: ['답없음', '절망', '포기']
      },
      {
        word: '핵인싸',
        pronunciation: '핵인싸',
        meaning: '핵(엄청) + 인사이더의 합성어. 매우 사교적이고 인기 많은 사람',
        example: '민수는 핵인싸라 친구가 진짜 많아',
        tags: ['인기', '사교적', 'insider']
      },
      {
        word: '아싸',
        pronunciation: '아싸',
        meaning: '아웃사이더의 줄임말. 사교성이 부족하거나 혼자 있는 것을 선호하는 사람',
        example: '나는 아싸라서 혼자 밥 먹는 게 편해',
        tags: ['외로움', 'outsider', '혼자']
      },
      {
        word: '취저',
        pronunciation: '취저',
        meaning: '취향 저격의 줄임말. 자신의 취향에 완벽하게 맞는 것',
        example: '이 노래 완전 취저야!',
        tags: ['취향', '좋아함', '선호']
      },
      {
        word: '팩트폭행',
        pronunciation: '팩트폭행',
        meaning: '사실(Fact)로 상대방을 공격하는 것',
        example: '친구가 나한테 팩트폭행 해서 할 말이 없었어',
        tags: ['사실', '공격', 'fact']
      },
      {
        word: '머선129',
        pronunciation: '머선일이구',
        meaning: '"무슨 일이야?"의 사투리 발음을 숫자로 표현',
        example: '친구: "나 내일 이사 가" / 나: "머선129"',
        tags: ['의문', '놀람', '사투리']
      },
      {
        word: '웅앵웅',
        pronunciation: '웅앵웅',
        meaning: '변명하거나 불만을 표현할 때 사용하는 의성어',
        example: '숙제 해갔는데 집에 두고 왔어... 웅앵웅',
        tags: ['불만', '변명', '의성어']
      },
      {
        word: '안물안궁',
        pronunciation: '안물안궁',
        meaning: '안 물어봤고 안 궁금해의 줄임말',
        example: '나 어제 영화 봤는데— / 안물안궁',
        tags: ['무관심', '거부', '차갑']
      },
      {
        word: '이불킥',
        pronunciation: '이불킥',
        meaning: '과거의 부끄러운 기억을 떠올리며 이불을 차는 행동',
        example: '어제 했던 말 생각나서 이불킥 중이야',
        tags: ['부끄러움', '후회', '행동']
      },
      {
        word: '고나리',
        pronunciation: '고나리',
        meaning: '고생했다는 뜻. 주로 수고했다는 의미로 사용',
        example: '오늘 발표 고나리~',
        tags: ['수고', '칭찬', '격려']
      },
      {
        word: '갠톡',
        pronunciation: '갠톡',
        meaning: '개인 톡(카카오톡)의 줄임말',
        example: '그 얘기는 갠톡으로 할게',
        tags: ['메신저', '개인', '카톡']
      },
      {
        word: '강퇴',
        pronunciation: '강퇴',
        meaning: '강제 퇴장의 줄임말. 단체에서 쫓아내는 것',
        example: '규칙 어겨서 강퇴당했어',
        tags: ['퇴출', '강제', '제재']
      },
      {
        word: '갓생',
        pronunciation: '갓생',
        meaning: 'God + 인생의 합성어. 신처럼 완벽한 하루를 보내는 것',
        example: '오늘 운동하고 공부하고 책 읽었어. 갓생살았다!',
        tags: ['완벽', '생산적', 'god']
      }
    ];

    // 검색 입력 시 엔터키 처리
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchSlang();
      }
    });

    // 검색 함수
    function searchSlang() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      
      if (!query) {
        showEmptyState();
        return;
      }

      // 정확한 매치 찾기
      const exactMatches = SLANG_DATABASE.filter(item => 
        item.word.toLowerCase() === query
      );

      // 부분 매치 찾기 (단어나 태그에 포함)
      const partialMatches = SLANG_DATABASE.filter(item => 
        item.word.toLowerCase().includes(query) ||
        item.tags.some(tag => tag.includes(query)) ||
        item.meaning.toLowerCase().includes(query)
      );

      // 중복 제거
      const allMatches = [...new Set([...exactMatches, ...partialMatches])];

      if (allMatches.length > 0) {
        displayResults(allMatches);
      } else {
        displaySuggestions(query);
      }
    }

    // 결과 표시
    function displayResults(matches) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      matches.forEach((item, index) => {
        const resultItem = document.createElement('div');
        resultItem.className = 'result-item';
        resultItem.style.animationDelay = `${index * 0.1}s`;
        
        resultItem.innerHTML = `
          <div class="result-word">${item.word}</div>
          <div class="result-pronunciation">[${item.pronunciation}]</div>
          <div class="result-meaning">${item.meaning}</div>
          <div class="result-example">💬 예시: ${item.example}</div>
        `;
        
        container.appendChild(resultItem);
      });
    }

    // 제안 표시 (검색 결과 없을 때)
    function displaySuggestions(query) {
      const container = document.getElementById('resultsContainer');
      
      // 유사한 단어 찾기 (첫 글자가 같거나 발음이 비슷한 것)
      const suggestions = SLANG_DATABASE.filter(item => {
        const firstChar = query[0];
        return item.word[0] === firstChar || 
               item.pronunciation.includes(query) ||
               levenshteinDistance(item.word.toLowerCase(), query) <= 2;
      }).slice(0, 10);

      container.innerHTML = `
        <div class="suggestion-box">
          <div class="suggestion-title">🤔 "${query}"에 대한 정확한 결과가 없습니다</div>
          ${suggestions.length > 0 ? `
            <div style="margin-bottom: 16px; color: #856404;">혹시 이런 단어를 찾으셨나요?</div>
            <div class="suggestion-list">
              ${suggestions.map(item => `
                <div class="suggestion-item" onclick="selectSuggestion('${item.word}')">
                  ${item.word}
                </div>
              `).join('')}
            </div>
          ` : `
            <div style="color: #856404;">비슷한 단어를 찾지 못했습니다. 다른 검색어를 시도해보세요.</div>
          `}
        </div>
        <div class="empty-state">
          <div class="empty-icon">💡</div>
          <div class="empty-text">인기 검색어: ㅇㅈ, TMI, 억텐, 갓벽, 킹받네</div>
        </div>
      `;
    }

    // 제안 단어 선택
    function selectSuggestion(word) {
      document.getElementById('searchInput').value = word;
      searchSlang();
    }

    // 빈 상태 표시
    function showEmptyState() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-text">검색어를 입력해주세요</div>
        </div>
      `;
    }

    // 레벤슈타인 거리 계산 (유사도 측정)
    function levenshteinDistance(str1, str2) {
      const len1 = str1.length;
      const len2 = str2.length;
      const matrix = [];

      for (let i = 0; i <= len1; i++) {
        matrix[i] = [i];
      }

      for (let j = 0; j <= len2; j++) {
        matrix[0][j] = j;
      }

      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      return matrix[len1][len2];
    }
  </script>
