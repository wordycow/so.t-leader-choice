<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>오늘의 최신뉴스 - THE UNIQUE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- ✨ THE UNIQUE LEGENDARY DESIGN SYSTEM v4.0 -->
  <link rel="stylesheet" href="css/the-unique-core.css">
  
  <!-- 🎯 HOVER VISIBILITY ENHANCEMENT v4.1 -->
  <link rel="stylesheet" href="css/hover-visibility-enhanced.css">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --accent: #fbbf24;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      min-height: 100vh;
      color: var(--text);
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 헤더 */
    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.6s ease;
    }

    .header-title {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      text-shadow: 0 0 20px rgba(59,130,246,0.5);
    }

    .header-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, rgba(59,130,246,0.8), rgba(251,191,36,0.8));
      border: 1px solid rgba(251,191,36,0.5);
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3);
    }

    .btn-back:hover {
      background: linear-gradient(135deg, rgba(59,130,246,1), rgba(251,191,36,1));
      border-color: rgba(251,191,36,0.8);
      transform: translateX(-4px) translateY(-2px);
      box-shadow: 0 6px 16px rgba(59,130,246,0.5);
    }

    /* 카테고리 버튼 */
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
      animation: fadeInUp 0.6s ease 0.2s both;
    }

    .category-btn {
      padding: 30px;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      border: 2px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .category-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      transition: left 0.5s ease;
    }

    .category-btn:hover::before {
      left: 100%;
    }

    .category-btn:hover {
      border-color: var(--primary);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(59,130,246,0.3);
    }

    .category-btn.loading {
      pointer-events: none;
      opacity: 0.6;
    }

    .category-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .category-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .category-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 뉴스 결과 */
    .news-results {
      display: none;
      animation: fadeInUp 0.6s ease;
    }

    .news-results.show {
      display: block;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }

    .results-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .results-count {
      font-size: 14px;
      color: var(--text-muted);
    }

    .btn-reset {
      padding: 12px 24px;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-reset:hover {
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      border-color: var(--primary);
      color: white;
    }

    .news-grid {
      display: grid;
      gap: 25px;
    }

    .news-card {
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      transition: all 0.3s ease;
      animation: slideIn 0.5s ease;
    }

    .news-card:hover {
      border-color: var(--primary);
      transform: translateX(10px);
      box-shadow: 0 10px 40px rgba(59,130,246,0.2);
    }

    .news-number {
      display: inline-block;
      width: 36px;
      height: 36px;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .news-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .news-source {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .news-snippet {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .news-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .news-link:hover {
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      transform: translateY(-2px);
    }

    /* 로딩 */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-content {
      text-align: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      color: var(--text);
      font-weight: 600;
    }

    /* 애니메이션 */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .header-title {
        font-size: 32px;
      }

      .categories {
        grid-template-columns: 1fr;
      }

      .results-header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }

    .error-message {
      background: #0a0e27 url('img/news-background.png') center/cover no-repeat fixed;
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 20px;
      color: var(--danger);
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="the-unique-main.html" class="btn-back">
      ← 돌아가기
    </a>

    <div class="header">
      <h1 class="header-title">오늘의 최신뉴스</h1>
      <p class="header-subtitle">실시간으로 업데이트되는 주요 뉴스를 확인하세요</p>
    </div>

    <!-- 카테고리 선택 -->
    <div class="categories" id="categories">
      <div class="category-btn" onclick="fetchNews('coin')">
        <div class="category-icon">₿</div>
        <div class="category-name">코인 뉴스</div>
        <div class="category-desc">비트코인, 이더리움 등 암호화폐 최신 동향</div>
      </div>

      <div class="category-btn" onclick="fetchNews('ai')">
        <div class="category-icon">🤖</div>
        <div class="category-name">AI 뉴스</div>
        <div class="category-desc">인공지능, 머신러닝 기술 트렌드</div>
      </div>

      <div class="category-btn" onclick="fetchNews('biotech')">
        <div class="category-icon">🧬</div>
        <div class="category-name">생명공학 뉴스</div>
        <div class="category-desc">바이오, 제약, 헬스케어 혁신</div>
      </div>

      <div class="category-btn" onclick="fetchNews('realestate')">
        <div class="category-icon">🏢</div>
        <div class="category-name">부동산 뉴스</div>
        <div class="category-desc">주택, 건설, 부동산 시장 분석</div>
      </div>
    </div>

    <!-- 뉴스 결과 -->
    <div class="news-results" id="newsResults">
      <div class="results-header">
        <div>
          <h2 class="results-title" id="resultsTitle">코인 뉴스</h2>
          <p class="results-count" id="resultsCount">3개의 최신 뉴스</p>
        </div>
        <button class="btn-reset" onclick="resetNews()">
          다른 주제 보기
        </button>
      </div>

      <div class="news-grid" id="newsGrid">
        <!-- 뉴스 카드들이 여기에 추가됩니다 -->
      </div>
    </div>

    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-content">
        <div class="spinner"></div>
        <div class="loading-text">최신 뉴스를 가져오는 중...</div>
      </div>
    </div>
  </div>

  <script>
    // 카테고리 정보
    const CATEGORIES = {
      coin: {
        name: '코인 뉴스',
        icon: '₿',
        keywords: '암호화폐 비트코인 이더리움 블록체인'
      },
      ai: {
        name: 'AI 뉴스',
        icon: '🤖',
        keywords: '인공지능 AI ChatGPT 머신러닝'
      },
      biotech: {
        name: '생명공학 뉴스',
        icon: '🧬',
        keywords: '바이오 제약 헬스케어 생명공학'
      },
      realestate: {
        name: '부동산 뉴스',
        icon: '🏢',
        keywords: '부동산 주택 아파트 건설'
      }
    };

    // 뉴스 가져오기 (실제로는 서버 API 호출)
    async function fetchNews(category) {
      const categoryInfo = CATEGORIES[category];
      
      // 로딩 표시
      document.getElementById('loadingOverlay').classList.add('show');
      
      try {
        // 실제로는 서버에 요청을 보내야 합니다
        // 여기서는 시뮬레이션을 위한 더미 데이터를 사용합니다
        
        // 서버 API 엔드포인트 (구현 필요)
        // const response = await fetch(`/api/news?category=${category}`);
        // const data = await response.json();
        
        // 시뮬레이션: 2초 대기
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // 더미 데이터 (실제로는 서버에서 받아온 데이터)
        const dummyNews = generateDummyNews(category, categoryInfo);
        
        displayNews(categoryInfo.name, dummyNews);
      } catch (error) {
        console.error('뉴스 가져오기 실패:', error);
        showError();
      } finally {
        document.getElementById('loadingOverlay').classList.remove('show');
      }
    }

    // 더미 뉴스 생성 (개발용)
    function generateDummyNews(category, categoryInfo) {
      const templates = {
        coin: [
          {
            title: '비트코인, 6만 달러 돌파 후 상승세 지속',
            source: '코인데스크',
            snippet: '비트코인이 6만 달러를 돌파하며 강력한 상승세를 이어가고 있습니다. 전문가들은 기관 투자자들의 유입이 주요 원인이라고 분석했습니다.',
            link: 'https://www.coindesk.com/price/bitcoin/'
          },
          {
            title: '이더리움 2.0 업그레이드 완료, 스테이킹 급증',
            source: '블록미디어',
            snippet: '이더리움 네트워크의 주요 업그레이드가 성공적으로 완료되면서 스테이킹 참여자가 급증하고 있습니다.',
            link: 'https://ethereum.org/en/roadmap/'
          },
          {
            title: 'SEC, 비트코인 ETF 승인 검토 중',
            source: '더블록',
            snippet: '미국 증권거래위원회가 여러 비트코인 현물 ETF 신청을 검토하고 있어 시장의 관심이 집중되고 있습니다.',
            link: 'https://www.sec.gov/spotlight/cryptocurrency-enforcement-framework'
          }
        ],
        ai: [
          {
            title: 'OpenAI, GPT-5 개발 중단 발표',
            source: 'TechCrunch',
            snippet: 'OpenAI가 GPT-5 개발을 일시 중단하고 현재 모델의 안정성 개선에 집중한다고 발표했습니다.',
            link: 'https://openai.com/blog'
          },
          {
            title: 'Google, 차세대 AI 칩 TPU v6 공개',
            source: 'VentureBeat',
            snippet: 'Google이 AI 연산 성능을 10배 향상시킨 차세대 TPU v6 칩을 공개하며 AI 인프라 경쟁에 박차를 가했습니다.',
            link: 'https://cloud.google.com/tpu'
          },
          {
            title: 'AI 규제법안, 국회 본회의 통과',
            source: '디지털타임스',
            snippet: '인공지능 개발과 활용에 대한 규제 법안이 국회 본회의를 통과하며 AI 산업에 새로운 전환점이 마련되었습니다.',
            link: 'https://www.dt.co.kr/'
          }
        ],
        biotech: [
          {
            title: '삼성바이오로직스, 4공장 건설 착공',
            source: '매일경제',
            snippet: '삼성바이오로직스가 세계 최대 규모의 4공장 건설에 착공하며 바이오 생산 능력을 대폭 확대합니다.',
            link: 'https://www.samsungbiologics.com/'
          },
          {
            title: '알츠하이머 신약, FDA 승인 획득',
            source: '헬스조선',
            snippet: '국내 제약사가 개발한 알츠하이머 신약이 FDA 승인을 받으며 글로벌 시장 진출의 발판을 마련했습니다.',
            link: 'https://health.chosun.com/'
          },
          {
            title: 'mRNA 기술, 암 치료에 적용 성공',
            source: '메디컬타임스',
            snippet: 'mRNA 백신 기술을 암 치료에 적용한 임상시험에서 긍정적인 결과가 나오며 의학계의 주목을 받고 있습니다.',
            link: 'https://www.medicaltimes.com/'
          }
        ],
        realestate: [
          {
            title: '서울 아파트 매매가, 3개월 연속 상승',
            source: '한국경제',
            snippet: '서울 지역 아파트 매매가격이 3개월 연속 상승세를 보이며 부동산 시장 회복 신호로 해석되고 있습니다.',
            link: 'https://www.hankyung.com/realestate'
          },
          {
            title: '정부, 3기 신도시 본격 착공',
            source: '연합뉴스',
            snippet: '정부가 주택 공급 확대를 위한 3기 신도시 개발에 본격 착수하며 30만 가구 공급 계획을 밝혔습니다.',
            link: 'https://www.yna.co.kr/'
          },
          {
            title: '전세가율 70% 돌파, 매매 전환 증가',
            source: '서울경제',
            snippet: '주요 지역의 전세가율이 70%를 넘어서며 전세에서 매매로 전환하는 수요가 증가하고 있습니다.',
            link: 'https://www.sedaily.com/'
          }
        ]
      };

      return templates[category] || [];
    }

    // 뉴스 표시
    function displayNews(categoryName, newsData) {
      const resultsTitle = document.getElementById('resultsTitle');
      const resultsCount = document.getElementById('resultsCount');
      const newsGrid = document.getElementById('newsGrid');
      const newsResults = document.getElementById('newsResults');

      resultsTitle.textContent = categoryName;
      resultsCount.textContent = `${newsData.length}개의 최신 뉴스`;

      newsGrid.innerHTML = '';

      newsData.forEach((news, index) => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.style.animationDelay = `${index * 0.1}s`;
        
        card.innerHTML = `
          <div class="news-number">${index + 1}</div>
          <h3 class="news-title">${news.title}</h3>
          <div class="news-source">${news.source}</div>
          <p class="news-snippet">${news.snippet}</p>
          <a href="${news.link}" class="news-link" target="_blank" rel="noopener noreferrer">
            기사 읽기 →
          </a>
        `;

        newsGrid.appendChild(card);
      });

      document.getElementById('categories').style.display = 'none';
      newsResults.classList.add('show');
    }

    // 에러 표시
    function showError() {
      const newsGrid = document.getElementById('newsGrid');
      newsGrid.innerHTML = `
        <div class="error-message">
          ⚠️ 뉴스를 가져오는 중 오류가 발생했습니다.<br>
          잠시 후 다시 시도해주세요.
        </div>
      `;
      document.getElementById('newsResults').classList.add('show');
    }

    // 리셋
    function resetNews() {
      document.getElementById('categories').style.display = 'grid';
      document.getElementById('newsResults').classList.remove('show');
      document.getElementById('newsGrid').innerHTML = '';
    }
  </script>
  
  <!-- ✨ THE UNIQUE LEGENDARY CORE FRAMEWORK v4.0 -->
  <script src="js/the-unique-core.js"></script>
</body>
</html>
