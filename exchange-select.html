<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪙 거래소 트렌드 선택</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --upbit-blue: #0062df;
      --bithumb-orange: #ff6b00;
      --dark-bg: #0f1419;
      --card-bg: #1a1f2e;
      --text-primary: #ffffff;
      --text-secondary: #8b95a1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0f1419 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .container {
      max-width: 900px;
      width: 100%;
      padding: 40px 20px;
      text-align: center;
    }

    .header {
      margin-bottom: 50px;
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--upbit-blue), var(--bithumb-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }

    .subtitle {
      font-size: 20px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .exchange-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      margin-bottom: 40px;
    }

    .exchange-card {
      background: var(--card-bg);
      border-radius: 25px;
      padding: 50px 30px;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .exchange-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .exchange-card.upbit {
      border-color: var(--upbit-blue);
    }

    .exchange-card.upbit::before {
      background: radial-gradient(circle at center, rgba(0, 98, 223, 0.2), transparent);
    }

    .exchange-card.upbit:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 20px 60px rgba(0, 98, 223, 0.5);
      border-color: var(--upbit-blue);
    }

    .exchange-card.bithumb {
      border-color: var(--bithumb-orange);
    }

    .exchange-card.bithumb::before {
      background: radial-gradient(circle at center, rgba(255, 107, 0, 0.2), transparent);
    }

    .exchange-card.bithumb:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 20px 60px rgba(255, 107, 0, 0.5);
      border-color: var(--bithumb-orange);
    }

    .exchange-card:hover::before {
      opacity: 1;
    }

    .exchange-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .exchange-card.upbit .exchange-icon {
      animation-delay: 0s;
    }

    .exchange-card.bithumb .exchange-icon {
      animation-delay: 0.5s;
    }

    .exchange-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .exchange-card.upbit .exchange-name {
      color: var(--upbit-blue);
    }

    .exchange-card.bithumb .exchange-name {
      color: var(--bithumb-orange);
    }

    .exchange-description {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #3182f6;
      border-radius: 15px;
      color: #3182f6;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 0 20px rgba(49, 130, 246, 0.3);
    }

    .home-btn:hover {
      background: rgba(49, 130, 246, 0.2);
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .main-title {
        font-size: 36px;
      }

      .exchange-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .exchange-icon {
        font-size: 60px;
      }

      .exchange-name {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <!-- 홈 버튼 -->
  <a href="the-unique-main.html" class="home-btn">
    🏠 <span>HOME</span>
  </a>

  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1 class="main-title">🪙 거래소 선택</h1>
      <p class="subtitle">실시간 암호화폐 트렌드를 확인할 거래소를 선택하세요</p>
    </div>

    <!-- 거래소 선택 -->
    <div class="exchange-grid">
      <!-- 업비트 -->
      <div class="exchange-card upbit" onclick="window.location.href='upbit-trend.html'">
        <div class="exchange-icon">🔵</div>
        <h2 class="exchange-name">UPBIT</h2>
        <p class="exchange-description">
          국내 최대 거래소<br>
          실시간 시세 및 거래량<br>
          TOP 10 코인 트렌드
        </p>
      </div>

      <!-- 빗썸 -->
      <div class="exchange-card bithumb" onclick="window.location.href='bithumb-trend.html'">
        <div class="exchange-icon">🟠</div>
        <h2 class="exchange-name">BITHUMB</h2>
        <p class="exchange-description">
          국내 대표 거래소<br>
          실시간 시세 및 거래량<br>
          TOP 10 코인 트렌드
        </p>
      </div>
    </div>
  </div>
</body>
</html>
