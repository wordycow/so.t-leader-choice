<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>LeeMay Training Center</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Arial, "Apple SD Gothic Neo", sans-serif;
      background:#0b1120;
      color:#e5e7eb;
      background-image: radial-gradient(circle at top, rgba(148,163,184,0.14), transparent 55%);
      background-attachment: fixed;
    }
    .topbar{
      height:56px; display:flex; align-items:center; justify-content:space-between;
      padding:0 16px;
      border-bottom:1px solid rgba(148,163,184,0.12);
      background: rgba(2,6,23,0.35);
      backdrop-filter: blur(10px);
      position:sticky; top:0; z-index:10;
    }
    .brand{font-weight:800; letter-spacing:0.4px}
    .right{display:flex; gap:10px; align-items:center}
    .pill{
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(148,163,184,0.18);
      background: rgba(15,23,42,0.6);
      color:#cbd5e1; font-size:12px;
    }

    .wrap{
      max-width: 1280px;
      margin: 18px auto;
      padding: 0 16px 18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.4fr 1fr;
      gap:14px;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns: 1fr; }
    }

    .card{
      border:1px solid rgba(148,163,184,0.16);
      background: rgba(15,23,42,0.58);
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.25);
      overflow:hidden;
    }
    .card-h{
      padding: 14px 14px 10px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(148,163,184,0.12);
    }
    .card-h .title{font-weight:800}
    .card-b{padding:14px}

    /* chat */
    .chat-list{
      height: 460px;
      overflow:auto;
      padding-right: 4px;
    }
    .msg{
      display:flex;
      margin: 10px 0;
    }
    .msg.user{justify-content:flex-end}
    .bubble{
      max-width: 82%;
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid rgba(148,163,184,0.14);
      background: rgba(2,6,23,0.35);
      white-space: pre-wrap;
      line-height:1.35;
    }
    .msg.user .bubble{
      background: rgba(37,99,235,0.18);
      border-color: rgba(37,99,235,0.30);
    }
    .meta{
      margin-top:6px; font-size:12px; color:#94a3b8;
    }
    .composer{
      display:flex; gap:10px; margin-top:12px;
    }
    .composer input{
      flex:1;
      height:44px;
      padding: 0 12px;
      border-radius: 12px;
      border:1px solid rgba(148,163,184,0.18);
      background: rgba(2,6,23,0.35);
      color:#e5e7eb;
      outline:none;
    }
    .btn{
      height:44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.18);
      background: rgba(30,41,59,0.65);
      color:#e5e7eb;
      cursor:pointer;
      font-weight:700;
    }
    .btn:hover{filter: brightness(1.08)}
    .btn.primary{
      background: rgba(37,99,235,0.75);
      border-color: rgba(37,99,235,0.65);
    }
    .btn.danger{
      background: rgba(220,38,38,0.70);
      border-color: rgba(220,38,38,0.55);
    }

    /* right side */
    .imgbox{
      width:100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(148,163,184,0.14);
      background: rgba(2,6,23,0.35);
    }
    .imgbox img{width:100%;height:100%;object-fit:cover;display:block}
    .row{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-top:12px;
    }
    .row .label{
      font-size:12px;
      color:#94a3b8;
    }
    .keyline{
      display:flex; gap:10px; align-items:center;
    }
    .keyline input{
      width: 160px;
      height: 38px;
      padding: 0 10px;
      border-radius: 12px;
      border:1px solid rgba(148,163,184,0.18);
      background: rgba(2,6,23,0.35);
      color:#e5e7eb;
      outline:none;
    }
    .toast{
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: rgba(2,6,23,0.85);
      border: 1px solid rgba(148,163,184,0.18);
      padding: 10px 12px;
      border-radius: 12px;
      color:#e5e7eb;
      font-size: 13px;
      display:none;
      max-width: 320px;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">LeeMay Training Center</div>
    <div class="right">
      <div id="healthPill" class="pill">health: ...</div>
      <div class="pill">API: same-origin</div>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <!-- Chat Card -->
      <div class="card">
        <div class="card-h">
          <div class="title">CHAT</div>
          <div class="pill" id="emotionPill">emotion: calm</div>
        </div>
        <div class="card-b">
          <div id="chatList" class="chat-list"></div>

          <div class="composer">
            <input id="chatInput" placeholder="채팅 입력 후 Enter..." autocomplete="off" />
            <button id="sendBtn" class="btn primary">SEND</button>
          </div>
          <div class="meta">채팅치면 이미지 카드가 바뀌어야 정상.</div>
        </div>
      </div>

      <!-- Image + OPS Restart Card -->
      <div class="card">
        <div class="card-h">
          <div class="title">IMAGE + OPS</div>
          <div class="pill">/api/chat · /api/ops/api/restart</div>
        </div>
        <div class="card-b">
          <div class="imgbox">
            <img id="emotionImg" alt="emotion image" />
          </div>

          <div class="row">
            <div class="label">OPS KEY</div>
            <div class="keyline">
              <input id="opsKey" placeholder="ex) 1106" />
              <button id="saveKeyBtn" class="btn">키 저장</button>
            </div>
          </div>

          <div class="row">
            <button id="restartBtn" class="btn danger">OPS RESTART</button>
            <button id="reloadHistoryBtn" class="btn">히스토리 새로고침</button>
          </div>

          <div class="meta">
            OPS RESTART 누르면 서버가 잠깐 끊겼다가 /health가 다시 살아나야 정상.
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const $ = (id)=>document.getElementById(id);

    function toast(msg){
      const t = $("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(()=> t.style.display="none", 2200);
    }

    function getOpsKey(){
      return localStorage.getItem("ops_key") || "";
    }

    function setOpsKey(v){
      localStorage.setItem("ops_key", v || "");
    }

    function addMsg(role, text, ts){
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;

      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = text || "";
      wrap.appendChild(b);

      $("chatList").appendChild(wrap);
      $("chatList").scrollTop = $("chatList").scrollHeight;
    }

    async function loadHistory(){
      try{
        const r = await fetch("/api/chat/history?limit=80");
        const j = await r.json();
        $("chatList").innerHTML = "";
        if(j.ok && Array.isArray(j.items)){
          j.items.forEach(it=>{
            addMsg(it.role, it.text, it.ts);
          });

          // 마지막 assistant가 있으면 이미지 반영
          const lastA = [...j.items].reverse().find(x=>x.role==="assistant" && x.image_url);
          if(lastA){
            $("emotionImg").src = lastA.image_url;
            $("emotionPill").textContent = "emotion: " + (lastA.emotion || "calm");
          } else {
            // 기본 이미지
            $("emotionImg").src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMGIxMTIwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iNjAiIGZpbGw9IiNlNWU3ZWIiPkxFRU1BWTwvdGV4dD48L3N2Zz4=";
          }
        }
      }catch(e){
        toast("history 로드 실패: " + e);
      }
    }

    async function sendChat(){
      const input = $("chatInput");
      const msg = (input.value || "").trim();
      if(!msg) return;

      input.value = "";
      addMsg("user", msg);

      // 로딩 placeholder
      addMsg("assistant", "…");

      try{
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({message: msg})
        });
        const j = await r.json();

        // 마지막 assistant bubble 교체
        const list = $("chatList");
        const last = list.lastElementChild;
        if(last && last.classList.contains("assistant")){
          last.querySelector(".bubble").textContent = j.response || "(empty)";
        }

        $("emotionPill").textContent = "emotion: " + (j.emotion || "calm");
        if(j.image_url) $("emotionImg").src = j.image_url;

      }catch(e){
        toast("chat 실패: " + e);
      }
    }

    async function checkHealth(){
      try{
        const r = await fetch("/health", {cache:"no-store"});
        const j = await r.json();
        $("healthPill").textContent = j.ok ? `health: OK (uptime ${j.uptime}s)` : "health: BAD";
      }catch(e){
        $("healthPill").textContent = "health: DOWN";
      }
    }

    async function restartOps(){
      const key = getOpsKey();
      if(!key){
        toast("OPS KEY부터 저장해");
        return;
      }
      if(!confirm("OPS API 재기동 한다?")) return;

      toast("restart 요청 보냄...");
      try{
        await fetch("/api/ops/api/restart", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-OPS-KEY": key
          },
          body: JSON.stringify({})
        });
      }catch(e){
        // 재기동이면 여기서 끊겨도 정상
      }

      // health polling (재기동 확인)
      const start = Date.now();
      while(Date.now() - start < 60000){
        await new Promise(res=>setTimeout(res, 900));
        try{
          const r = await fetch("/health", {cache:"no-store"});
          const j = await r.json();
          if(j.ok){
            toast("RESTART OK: health 복구됨");
            await checkHealth();
            return;
          }
        }catch(e){}
      }
      toast("RESTART 확인 실패(60s timeout)");
    }

    // init
    $("opsKey").value = getOpsKey();

    $("saveKeyBtn").addEventListener("click", ()=>{
      setOpsKey($("opsKey").value.trim());
      toast("OPS KEY 저장됨");
    });

    $("sendBtn").addEventListener("click", sendChat);
    $("chatInput").addEventListener("keydown", (e)=>{
      if(e.key === "Enter") sendChat();
    });

    $("restartBtn").addEventListener("click", restartOps);
    $("reloadHistoryBtn").addEventListener("click", loadHistory);

    loadHistory();
    checkHealth();
    setInterval(checkHealth, 2500);
  </script>
</body>
</html>
