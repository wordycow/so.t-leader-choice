<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee May OPS Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .status-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-weight: 600;
            color: #555;
        }
        
        .status-value {
            font-weight: 700;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .status-ok {
            background: #d4edda;
            color: #155724;
        }
        
        .status-warn {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-fail {
            background: #f8d7da;
            color: #721c24;
        }
        
        .grade-display {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .grade-display h2 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .grade-display p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        
        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Lee May OPS</h1>
        <p class="subtitle">Control Center Dashboard</p>
        
        <div id="alert" class="alert"></div>
        
        <div class="grade-display" id="gradeDisplay">
            <h2 id="grade">--</h2>
            <p id="note">시스템 상태를 확인하는 중...</p>
        </div>
        
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">포트 5001 (API)</span>
                <span class="status-value" id="port5001">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">포트 5000 (Trading)</span>
                <span class="status-value" id="port5000">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">포트 11434 (Ollama)</span>
                <span class="status-value" id="port11434">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">Cloudflare Tunnel</span>
                <span class="status-value" id="cloudflared">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">Ollama External</span>
                <span class="status-value" id="ollama">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">마지막 업데이트</span>
                <span class="status-value" id="timestamp" style="background: #e9ecef; color: #495057;">--</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="controlStart()">
                🚀 CONTROL 시작
            </button>
            <button class="btn btn-success" onclick="botsStart()">
                🤖 BOTS 시작
            </button>
            <button class="btn btn-danger" onclick="botsStop()">
                🛑 BOTS 정지
            </button>
            <button class="btn btn-info" onclick="refreshStatus()">
                🔄 상태 새로고침
            </button>
        </div>
        
        <div class="footer">
            <p>Lee May Training Center · Port 5001</p>
            <p style="margin-top: 5px;">
                <a href="/dashboard" style="color: #667eea; text-decoration: none;">📊 Dashboard</a> ·
                <a href="/health" style="color: #667eea; text-decoration: none;">💚 Health</a>
            </p>
        </div>
    </div>
    
    <script>
        // API Base URL
        const API_BASE = window.location.origin;
        
        // Show alert
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => {
                alert.className = 'alert';
            }, 5000);
        }
        
        // Refresh status
        async function refreshStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/ops/status`);
                const data = await response.json();
                
                // Update grade
                document.getElementById('grade').textContent = data.grade;
                document.getElementById('note').textContent = data.note;
                
                // Update grade display color
                const gradeDisplay = document.getElementById('gradeDisplay');
                if (data.grade === 'OK') {
                    gradeDisplay.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                } else if (data.grade === 'WARN') {
                    gradeDisplay.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
                } else {
                    gradeDisplay.style.background = 'linear-gradient(135deg, #eb3349 0%, #f45c43 100%)';
                }
                
                // Update ports
                document.getElementById('port5001').textContent = data.ports['5001'] ? '✓ OPEN' : '✗ CLOSED';
                document.getElementById('port5001').className = `status-value ${data.ports['5001'] ? 'status-ok' : 'status-fail'}`;
                
                document.getElementById('port5000').textContent = data.ports['5000'] ? '✓ OPEN' : '✗ CLOSED';
                document.getElementById('port5000').className = `status-value ${data.ports['5000'] ? 'status-ok' : 'status-fail'}`;
                
                document.getElementById('port11434').textContent = data.ports['11434'] ? '✓ OPEN' : '✗ CLOSED';
                document.getElementById('port11434').className = `status-value ${data.ports['11434'] ? 'status-ok' : 'status-fail'}`;
                
                // Update processes
                document.getElementById('cloudflared').textContent = data.process.cloudflared ? '✓ RUNNING' : '✗ STOPPED';
                document.getElementById('cloudflared').className = `status-value ${data.process.cloudflared ? 'status-ok' : 'status-fail'}`;
                
                document.getElementById('ollama').textContent = data.process.ollama ? '✓ CONNECTED' : '✗ DISCONNECTED';
                document.getElementById('ollama').className = `status-value ${data.process.ollama ? 'status-ok' : 'status-fail'}`;
                
                // Update timestamp
                const timestamp = new Date(data.timestamp).toLocaleString('ko-KR');
                document.getElementById('timestamp').textContent = timestamp;
                
            } catch (error) {
                console.error('Status refresh error:', error);
                showAlert('상태 조회 실패: ' + error.message, 'error');
            }
        }
        
        // Control start
        async function controlStart() {
            try {
                const response = await fetch(`${API_BASE}/api/ops/control/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.ok) {
                    showAlert('✅ CONTROL 시작 명령이 실행되었습니다.', 'success');
                    setTimeout(refreshStatus, 2000);
                } else {
                    showAlert('❌ CONTROL 시작 실패: ' + data.msg, 'error');
                }
            } catch (error) {
                console.error('Control start error:', error);
                showAlert('❌ 요청 실패: ' + error.message, 'error');
            }
        }
        
        // Bots start
        async function botsStart() {
            try {
                const response = await fetch(`${API_BASE}/api/ops/bots/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.ok) {
                    showAlert('✅ BOTS 시작 명령이 실행되었습니다.', 'success');
                    setTimeout(refreshStatus, 2000);
                } else {
                    showAlert('❌ BOTS 시작 실패: ' + data.msg, 'error');
                }
            } catch (error) {
                console.error('Bots start error:', error);
                showAlert('❌ 요청 실패: ' + error.message, 'error');
            }
        }
        
        // Bots stop
        async function botsStop() {
            try {
                const response = await fetch(`${API_BASE}/api/ops/bots/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.ok) {
                    showAlert('✅ BOTS 정지 명령이 실행되었습니다.', 'success');
                    setTimeout(refreshStatus, 2000);
                } else {
                    showAlert('❌ BOTS 정지 실패: ' + data.msg, 'error');
                }
            } catch (error) {
                console.error('Bots stop error:', error);
                showAlert('❌ 요청 실패: ' + error.message, 'error');
            }
        }
        
        // Auto refresh every 10 seconds
        setInterval(refreshStatus, 10000);
        
        // Initial load
        refreshStatus();
    </script>
</body>
</html>
