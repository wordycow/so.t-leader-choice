<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lee May Training Center 🤖</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-healthy {
      background: #4CAF50;
      color: white;
    }

    .status-degraded {
      background: #FF9800;
      color: white;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 300px 1fr 450px;
      gap: 20px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }

    /* 왼쪽: 봇 관리 */
    .bot-item {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .bot-item h3 {
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }

    .status-dot.online {
      background: #4CAF50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 중앙: 능력치 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      border-radius: 12px;
      color: white;
    }

    .stat-card h3 {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .stat-bar {
      background: rgba(255,255,255,0.3);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .stat-fill {
      height: 100%;
      background: white;
      border-radius: 4px;
      transition: width 0.5s;
    }

    .stat-value {
      font-size: 12px;
      opacity: 0.9;
    }

    .system-info {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 14px;
    }

    .system-info div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    /* 오른쪽: Lee May 채팅 */
    .emotion-display {
      background: #f8f9fa;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .emotion-image {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #667eea;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .emotion-image:hover {
      transform: scale(1.1);
    }

    .emotion-label {
      margin-top: 10px;
      font-size: 14px;
      color: #6c757d;
      font-weight: 500;
    }

    .chat-box {
      height: 300px;
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      text-align: right;
    }

    .message.leemay {
      text-align: left;
    }

    .message-bubble {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.user .message-bubble {
      background: #667eea;
      color: white;
    }

    .message.leemay .message-bubble {
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .chat-input button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 유튜브 학습 섹션 */
    .youtube-section {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
    }

    .youtube-section h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #333;
    }

    .youtube-input {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .youtube-input input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    .youtube-input button {
      padding: 8px 16px;
      background: #FF0000;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .knowledge-list {
      max-height: 150px;
      overflow-y: auto;
      font-size: 12px;
      color: #666;
    }

    .knowledge-item {
      padding: 6px;
      background: white;
      border-radius: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>🤖 Lee May Training Center</h1>
      <div class="status-badge status-healthy" id="systemHealth">시스템 정상</div>
    </div>

    <!-- 메인 그리드 -->
    <div class="main-grid">
      <!-- 왼쪽: 봇 관리 -->
      <div class="panel">
        <h2>🤖 봇 관리</h2>
        
        <div class="bot-item">
          <h3>
            <span class="status-dot" id="dot-leemay_api"></span>
            Lee May API
          </h3>
          <p style="font-size: 12px; color: #666;" id="info-leemay_api">상태 확인 중...</p>
        </div>

        <div class="bot-item">
          <h3>
            <span class="status-dot" id="dot-ollama_tunnel"></span>
            Ollama Tunnel
          </h3>
          <p style="font-size: 12px; color: #666;" id="info-ollama_tunnel">상태 확인 중...</p>
        </div>

        <div class="bot-item">
          <h3>
            <span class="status-dot" id="dot-youtube_learner"></span>
            YouTube Learner
          </h3>
          <p style="font-size: 12px; color: #666;" id="info-youtube_learner">대기 중</p>
        </div>
      </div>

      <!-- 중앙: 능력치 -->
      <div class="panel">
        <h2>📊 능력치</h2>
        
        <h3 style="font-size: 16px; margin-bottom: 12px;">🌸 Lee May</h3>
        <div class="stats-grid">
          <div class="stat-card">
            <h3>감정 표현력</h3>
            <div class="stat-bar"><div class="stat-fill" id="stat-emotion" style="width: 0%"></div></div>
            <div class="stat-value" id="val-emotion">0%</div>
          </div>
          <div class="stat-card">
            <h3>대화 이해도</h3>
            <div class="stat-bar"><div class="stat-fill" id="stat-understanding" style="width: 0%"></div></div>
            <div class="stat-value" id="val-understanding">0%</div>
          </div>
          <div class="stat-card">
            <h3>기억력</h3>
            <div class="stat-bar"><div class="stat-fill" id="stat-memory" style="width: 0%"></div></div>
            <div class="stat-value" id="val-memory">0%</div>
          </div>
          <div class="stat-card">
            <h3>유머 감각</h3>
            <div class="stat-bar"><div class="stat-fill" id="stat-humor" style="width: 0%"></div></div>
            <div class="stat-value" id="val-humor">0%</div>
          </div>
        </div>

        <!-- 시스템 정보 -->
        <div class="system-info">
          <h3 style="margin-bottom: 12px;">⚙️ 시스템</h3>
          <div>
            <span>CPU:</span>
            <span id="system-cpu">--%</span>
          </div>
          <div>
            <span>메모리:</span>
            <span id="system-memory">--%</span>
          </div>
          <div>
            <span>디스크:</span>
            <span id="system-disk">--%</span>
          </div>
        </div>
      </div>

      <!-- 오른쪽: Lee May 채팅 -->
      <div class="panel">
        <h2>💬 Lee May Chat</h2>
        
        <!-- 감정 이미지 -->
        <div class="emotion-display">
          <img src="/image/neutral" alt="emotion" class="emotion-image" id="emotionImage" onerror="this.style.display='none'">
          <div class="emotion-label" id="emotionLabel">중립 (Neutral)</div>
        </div>
        
        <!-- 채팅 영역 -->
        <div class="chat-box" id="chatBox">
          <div class="message leemay">
            <div class="message-bubble">안녕! 나는 Lee May야! 😊 무엇을 도와줄까?</div>
          </div>
        </div>
        
        <!-- 입력 영역 -->
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()">전송</button>
        </div>

        <!-- 유튜브 학습 -->
        <div class="youtube-section">
          <h3>📺 유튜브 학습</h3>
          <div class="youtube-input">
            <input type="text" id="youtubeUrl" placeholder="유튜브 URL 입력">
            <button onclick="learnFromYoutube()">학습</button>
          </div>
          <div class="knowledge-list" id="knowledgeList">
            <div style="text-align: center; color: #999; padding: 12px;">학습한 영상이 없습니다</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // API 주소 동적 설정
    const API_BASE = window.location.origin;
    console.log('🌐 API Base URL:', API_BASE);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 봇 상태 업데이트
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateBotStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/bots/status`);
        const status = await res.json();
        
        for (const [botName, info] of Object.entries(status)) {
          const dot = document.getElementById(`dot-${botName}`);
          const infoText = document.getElementById(`info-${botName}`);
          
          if (dot && infoText) {
            if (info.running) {
              dot.classList.add('online');
              infoText.textContent = `실행 중 (PID: ${info.pid || 'N/A'})`;
            } else {
              dot.classList.remove('online');
              infoText.textContent = '중지됨';
            }
          }
        }
      } catch (e) {
        console.error('❌ 봇 상태 업데이트 실패:', e);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 시스템 정보 업데이트
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateSystemInfo() {
      try {
        const res = await fetch(`${API_BASE}/api/system/status`);
        const info = await res.json();
        
        if (info.error) {
          console.error('시스템 정보 오류:', info.error);
          return;
        }
        
        document.getElementById('system-cpu').textContent = info.cpu.toFixed(1) + '%';
        document.getElementById('system-memory').textContent = info.memory.toFixed(1) + '%';
        document.getElementById('system-disk').textContent = info.disk.toFixed(1) + '%';
      } catch (e) {
        console.error('❌ 시스템 정보 업데이트 실패:', e);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 능력치 업데이트
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        const data = await res.json();
        
        if (data.leemay) {
          const stats = data.leemay;
          updateStat('emotion', stats.emotion_expression);
          updateStat('understanding', stats.conversation_understanding);
          updateStat('memory', stats.memory);
          updateStat('humor', stats.humor);
        }
      } catch (e) {
        console.error('❌ 능력치 업데이트 실패:', e);
      }
    }

    function updateStat(name, value) {
      const fill = document.getElementById(`stat-${name}`);
      const val = document.getElementById(`val-${name}`);
      if (fill) fill.style.width = value + '%';
      if (val) val.textContent = value + '%';
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 채팅
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      
      if (!message) return;
      
      const chatBox = document.getElementById('chatBox');
      
      // 사용자 메시지 추가
      chatBox.innerHTML += `
        <div class="message user">
          <div class="message-bubble">${message}</div>
        </div>
      `;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
      
      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: message,
            user_id: 'web_user'
          })
        });
        const data = await res.json();
        
        // Lee May 응답 추가
        chatBox.innerHTML += `
          <div class="message leemay">
            <div class="message-bubble">${data.response}</div>
          </div>
        `;
        
        // 감정 이미지 업데이트
        if (data.emotion) {
          document.getElementById('emotionImage').src = `${API_BASE}/image/${data.emotion}`;
          document.getElementById('emotionImage').style.display = 'block';
          document.getElementById('emotionLabel').textContent = `${data.emotion} (${data.confidence ? data.confidence.toFixed(0) : 0}% 신뢰도)`;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        chatBox.innerHTML += `
          <div class="message leemay">
            <div class="message-bubble" style="color: red;">오류 발생: ${e.message}</div>
          </div>
        `;
        console.error('❌ 채팅 오류:', e);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 유튜브 학습
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function learnFromYoutube() {
      const input = document.getElementById('youtubeUrl');
      const url = input.value.trim();
      
      if (!url) {
        alert('유튜브 URL을 입력하세요');
        return;
      }
      
      try {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `
          <div class="message leemay">
            <div class="message-bubble">📺 유튜브 영상을 분석하고 있어요... 잠시만 기다려주세요!</div>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
        
        const res = await fetch(`${API_BASE}/api/learning/youtube`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        const data = await res.json();
        
        if (data.success) {
          chatBox.innerHTML += `
            <div class="message leemay">
              <div class="message-bubble">
                ✅ 학습 완료!<br>
                언어: ${data.language}<br>
                텍스트 길이: ${data.length}자<br>
                이제 이 영상에 대해 물어보세요!
              </div>
            </div>
          `;
          
          // 지식 목록 갱신
          loadKnowledgeList();
          input.value = '';
        } else {
          chatBox.innerHTML += `
            <div class="message leemay">
              <div class="message-bubble" style="color: red;">
                ❌ 학습 실패: ${data.error}
              </div>
            </div>
          `;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        console.error('❌ 유튜브 학습 오류:', e);
        alert('학습 실패: ' + e.message);
      }
    }

    async function loadKnowledgeList() {
      try {
        const res = await fetch(`${API_BASE}/api/knowledge/list`);
        const data = await res.json();
        
        const listEl = document.getElementById('knowledgeList');
        
        if (data.count === 0) {
          listEl.innerHTML = '<div style="text-align: center; color: #999; padding: 12px;">학습한 영상이 없습니다</div>';
        } else {
          listEl.innerHTML = data.knowledge.map(item => `
            <div class="knowledge-item">
              📹 ${item.video_id} (${item.language}, ${item.length}자)
            </div>
          `).join('');
        }
      } catch (e) {
        console.error('❌ 지식 목록 로드 실패:', e);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 시스템 진단
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateSystemHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/system/diagnose`);
        const diagnosis = await res.json();
        
        const badge = document.getElementById('systemHealth');
        if (diagnosis.health === 'healthy') {
          badge.className = 'status-badge status-healthy';
          badge.textContent = '시스템 정상';
        } else {
          badge.className = 'status-badge status-degraded';
          badge.textContent = '시스템 저하';
        }
      } catch (e) {
        const badge = document.getElementById('systemHealth');
        badge.className = 'status-badge status-degraded';
        badge.textContent = '시스템 오류';
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 자동 업데이트 (실패 시 간격 조정)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let updateInterval = 5000;
    let consecutiveFailures = 0;
    const MAX_FAILURES = 3;
    const MAX_INTERVAL = 30000;
    
    async function safeUpdate() {
      try {
        await Promise.all([
          updateBotStatus(),
          updateSystemInfo(),
          updateStats(),
          updateSystemHealth()
        ]);
        
        consecutiveFailures = 0;
        updateInterval = 5000;
      } catch (e) {
        console.error('⚠️  업데이트 실패:', e);
        consecutiveFailures++;
        
        if (consecutiveFailures >= MAX_FAILURES) {
          updateInterval = Math.min(updateInterval * 2, MAX_INTERVAL);
          console.warn(`🚨 ${consecutiveFailures}회 연속 실패 - 업데이트 간격을 ${updateInterval/1000}초로 증가`);
        }
      }
    }
    
    function scheduleUpdate() {
      safeUpdate().then(() => {
        setTimeout(scheduleUpdate, updateInterval);
      });
    }
    
    // 초기 로드
    safeUpdate();
    scheduleUpdate();
    loadKnowledgeList();
  </script>
</body>
</html>
