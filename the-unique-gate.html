<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – Gate</title>

  <!-- 공유 썸네일 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Unique – 초대 전용 게이트">
  <meta property="og:description" content="Invitation-only access for action takers.">
  <meta property="og:url" content="https://wordycow.github.io/so.t-leader-choice/the-unique-gate.html">
  <meta property="og:image" content="https://wordycow.github.io/so.t-leader-choice/img/the-unique-gate-preview.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Unique – 초대 전용 게이트">
  <meta name="twitter:description" content="Invitation-only access for action takers.">
  <meta name="twitter:image" content="https://wordycow.github.io/so.t-leader-choice/img/the-unique-gate-preview.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- THE UNIQUE 타이틀용 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;           /* ✅ 오른쪽 바트 '날개 잘림' 가능 */
      pointer-events: none;       /* ✅ 클릭 방해 X */
      z-index: 0;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      z-index: 10;
    }

    .gate-card {
      position: relative;
      border-radius: 26px;
      padding: 28px 26px 22px;

      background: radial-gradient(circle at top, rgba(248,181,84,0.15), rgba(15,23,42,0.96));
      border: 1px solid rgba(250, 204, 21, 0.95);
      box-shadow:
        0 0 20px rgba(250, 204, 21, 0.75),
        0 28px 70px rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      overflow: visible;
      z-index: 20;
     }

    .gate-inner { position: relative; z-index: 1; }

    .gate-title-wrap { text-align: center; margin-bottom: 22px; }

    .gate-title {
      font-family: "Cinzel", "Times New Roman", serif;
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 8px;

      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 10px rgba(250, 204, 21, 0.9),
        0 4px 18px rgba(0,0,0,1);
    }

    .gate-subtitle-en {
      font-size: 11px;
      color: #f9fafb;
      opacity: 0.9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow:
        0 1px 3px rgba(0,0,0,0.9),
        0 0 6px rgba(0,0,0,0.6);
    }

    .form-body { max-width: 360px; margin: 0 auto; }
    .gate-input-wrap { margin-bottom: 10px; }

    .gate-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.90), rgba(3,7,18,0.96));
      color: #f9fafb;
      font-size: 13px;
      outline: none;
      box-shadow:
        0 4px 14px rgba(0,0,0,0.75) inset,
        0 0 0 1px rgba(0,0,0,0.55);
    }

    .gate-input::placeholder { color: #6b7280; }

    .gate-input:focus {
      border-color: rgba(248,181,84,0.95);
      box-shadow:
        0 0 0 1px rgba(248,181,84,0.6),
        0 6px 22px rgba(0,0,0,0.9) inset;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .btn-primary {
      background: radial-gradient(circle at top, #f97316, #7f1d1d);
      border-color: rgba(248,181,84,0.95);
      color: #fef2f2;
      box-shadow:
        0 10px 26px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 16px 38px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-ghost {
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-color: rgba(55,65,81,1);
      color: #e5e7eb;
      box-shadow: 0 8px 22px rgba(0,0,0,0.9);
    }

    .btn-ghost:hover {
      background: rgba(15,23,42,1);
      border-color: rgba(148,163,184,0.9);
    }

    .divider {
      margin: 14px 0 6px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.75;
      user-select: none;
    }

    .btn-social {
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-color: rgba(148,163,184,0.35);
      color: #e5e7eb;
      box-shadow: 0 8px 22px rgba(0,0,0,0.9);
      letter-spacing: 0.10em;
    }
    .btn-social:hover {
      border-color: rgba(248,181,84,0.75);
      transform: translateY(-1px);
    }

    .btn-kakao {
      background: radial-gradient(circle at top, rgba(254,229,0,0.95), rgba(202,138,4,0.55));
      border-color: rgba(254,229,0,0.95);
      color: #111827;
      box-shadow: 0 10px 26px rgba(0,0,0,1);
      letter-spacing: 0.08em;
    }
    .btn-kakao:hover { transform: translateY(-1px); }

    .status {
      min-height: 18px;
      font-size: 11px;
      text-align: center;
      margin-top: 2px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .status-error { color: #fecaca; }

    /* =========================================================
       ✅ 마녀 & 박쥐 (달 기준으로 재배치 + 위아래로만 움직임)
       - 마녀: 성 왼쪽 / 더 작게
       - 박쥐: 더 크게 / 오른쪽 끝에 붙어서 살짝 잘리게 / 위아래만
       ========================================================= */
    :root{
      /* 박쥐 */
      --bat-top: 5vh;
      --bat-right: 0vw;                 /* 오른쪽으로 더 붙이면 -10vw */
      --bat-width: clamp(320px, 38vw, 720px);
      --bat-bob: 16px;

      /* 마녀 */
      --witch-top: 30vh;
      --witch-right: 23vw;               /* 값 ↑ = 더 왼쪽(성 왼쪽으로) */
      --witch-width: clamp(30px, 2.2vw, 44px);
      --witch-bob: 10px;
    }

    .spirit{
      position:absolute;
      pointer-events:none;
      z-index: 1; /* 배경 위, 카드 아래 */
    }
    .spirit img{
      display:block;
      width:100%;
      height:auto;
      filter: drop-shadow(0 0 10px rgba(250,204,21,0.45));
    }

    /* 위아래만 */
    @keyframes floatY {
      from { transform: translateY(calc(-1 * var(--bob))); }
      to   { transform: translateY(var(--bob)); }
    }

    .spirit-bat{
      top: var(--bat-top);
      right: var(--bat-right);
      width: var(--bat-width);
      --bob: var(--bat-bob);
      animation: floatY 2.2s ease-in-out infinite alternate;
      opacity: .95;
    }

    .spirit-witch{
      top: var(--witch-top);
      right: var(--witch-right);
      width: var(--witch-width);
      --bob: var(--witch-bob);
      animation: floatY 3.2s ease-in-out infinite alternate;
    }

    @media (max-width: 768px) {
      :root{
        --bat-top: 10vh;
        --bat-right: -18vw;
        --bat-width: 72vw;

        --witch-top: 18vh;
        --witch-right: 34vw;
        --witch-width: 12vw;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-gate-clean.jpg" class="scene-bg" alt="The Unique Gate background">

    <!-- ✅ 여기로 옮김: 달/성(배경) 기준으로 딱 맞음 -->
    <div class="spirit spirit-witch"><img src="img/witch-float.png" alt=""></div>
    <div class="spirit spirit-bat"><img src="img/bat-float.png" alt=""></div>
  </div>

  <div class="page-wrap">
    <main class="gate-card">
      <div class="gate-inner">
        <div class="gate-title-wrap">
          <div class="gate-title">THE UNIQUE</div>
          <div class="gate-subtitle-en">Invitation-only access for action takers</div>
        </div>

        <form id="gate-form" class="form-body">
          <div class="gate-input-wrap">
            <input id="login-id" class="gate-input" type="text" autocomplete="off" placeholder="아이디" />
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">로그인</button>
            <a href="the-unique-signup.html" class="btn btn-ghost">회원가입</a>
          </div>

          <div id="status" class="status"></div>

          <div class="divider">OR</div>

          <div class="btn-row" style="margin-top:10px;">
            <button type="button" id="btnGoogle" class="btn btn-social">Google로 로그인</button>
            <button type="button" id="btnDiscord" class="btn btn-social">Discord로 로그인</button>
            <button type="button" id="btnKakao" class="btn btn-kakao">Kakao로 로그인</button>
            <button type="button" id="btnLogout" class="btn btn-ghost" style="display:none;">소셜 로그아웃</button>
          </div>

          <div id="oauth-status" class="status"></div>
        </form>
      </div>
    </main>
  </div>

  <!-- 1) 시트 콜백 -->
  <script>
    let allowedIds = null;
    let memberInfoById = {};
    let sheetError = false;

    function handleSheetResponse(resp) {
      try {
        const rows = resp.table.rows || [];
        const ids = [];

        rows.forEach((row) => {
          const cells = row.c || [];
          const tsCell   = cells[5] || cells[0];
          const idCell   = cells[1];
          const nameCell = cells[2];
          const teamCell = cells[4];
          if (!idCell || idCell.v == null) return;

          const rawId = String(idCell.v).trim();
          if (!rawId || rawId === "아이디") return;

          const idLower = rawId.toLowerCase();
          ids.push(idLower);

          const name = nameCell && nameCell.v ? String(nameCell.v).trim() : "";
          const team = teamCell && teamCell.v ? String(teamCell.v).trim() : "";
          const joinedAt = tsCell && tsCell.v ? String(tsCell.v).trim() : "";

          memberInfoById[idLower] = { id: rawId, name, team, joinedAt };
        });

        allowedIds = new Set(ids);
      } catch (e) {
        console.error("시트 파싱 오류:", e);
        sheetError = true;
      }
    }
  </script>

  <!-- 2) 시트 로드 -->
  <script src="https://docs.google.com/spreadsheets/d/1SUXCiLg7sbZ_2OxanCEgVwgk3dJhZLhyX0-lltTxBnM/gviz/tq?sheet=Form_Responses&tqx=responseHandler:handleSheetResponse"></script>

  <!-- 3) 로그인 처리 -->
  <script>
    const form = document.getElementById("gate-form");
    const idInput = document.getElementById("login-id");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const id = (idInput.value || "").trim();
      statusEl.textContent = "";
      statusEl.className = "status";

      if (!id) { statusEl.textContent = "아이디를 입력해 주세요."; statusEl.classList.add("status-error"); return; }
      if (sheetError) { statusEl.textContent = "회원 확인 중 오류가 발생했습니다."; statusEl.classList.add("status-error"); return; }
      if (!allowedIds) { statusEl.textContent = "회원 정보 불러오는 중입니다. 잠시 후 다시 시도해 주세요."; return; }

      const normalized = id.toLowerCase();
      if (allowedIds.has(normalized)) {
        const info = memberInfoById[normalized] || {};
        localStorage.setItem("uniqueCurrentUser", JSON.stringify({
          id: normalized, name: info.name || "", team: info.team || "", joinedAt: info.joinedAt || ""
        }));
        window.location.href = "the-unique-main.html";
      } else {
        statusEl.textContent = "등록되지 않은 아이디입니다.";
        statusEl.classList.add("status-error");
      }
    });
  </script>

  <!-- 4) Supabase OAuth 로그인 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";

    const SITE_BASE = "https://wordycow.github.io/so.t-leader-choice";
    const GATE_URL = SITE_BASE + "/the-unique-gate.html";
    const MAIN_URL = SITE_BASE + "/the-unique-main.html";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { flowType: "pkce", detectSessionInUrl: true }
    });

    const oauthStatusEl = document.getElementById("oauth-status");
    const btnLogout = document.getElementById("btnLogout");
    const btnGoogle = document.getElementById("btnGoogle");
    const btnDiscord = document.getElementById("btnDiscord");
    const btnKakao = document.getElementById("btnKakao");

    function sayOAuth(msg, isErr = false) {
      if (!oauthStatusEl) return;
      oauthStatusEl.textContent = msg || "";
      oauthStatusEl.className = "status" + (isErr ? " status-error" : "");
    }

    async function handleOAuthCallback() {
      const url = new URL(window.location.href);
      const err = url.searchParams.get("error_description") || url.searchParams.get("error");
      if (err) { sayOAuth("소셜 로그인 오류: " + err, true); return; }

      const code = url.searchParams.get("code");
      if (code) {
        sayOAuth("소셜 로그인 처리 중...");
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) { sayOAuth("세션 처리 실패: " + error.message, true); return; }
        url.searchParams.delete("code");
        url.searchParams.delete("state");
        window.history.replaceState({}, document.title, url.pathname);
      }
    }

    async function renderOAuthState() {
      const { data } = await sb.auth.getSession();
      const sess = data?.session;

      if (!sess) {
        if (btnLogout) btnLogout.style.display = "none";
        sayOAuth("");
        return;
      }

      const user = sess.user || {};
      const name = user.user_metadata?.full_name || user.user_metadata?.name || "";
      const email = user.email || "";
      const provider = user.app_metadata?.provider || "";

      localStorage.setItem("uniqueOAuthUser", JSON.stringify({
        uid: user.id, provider, email, name, loggedInAt: new Date().toISOString()
      }));

      if (btnLogout) btnLogout.style.display = "inline-flex";
      sayOAuth(`소셜 로그인 완료 ✅ ${name || email || (provider ? provider.toUpperCase() : "USER")}`);
    }

    async function maybeAutoContinue() {
      const current = localStorage.getItem("uniqueCurrentUser");
      if (!current) return;
      const { data } = await sb.auth.getSession();
      if (data?.session) window.location.href = MAIN_URL;
    }

    async function signIn(provider) {
      sayOAuth("소셜 로그인 창 여는 중...");
      const { error } = await sb.auth.signInWithOAuth({
        provider,
        options: { redirectTo: GATE_URL }
      });
      if (error) sayOAuth("로그인 시작 실패: " + error.message, true);
    }

    btnGoogle?.addEventListener("click", () => signIn("google"));
    btnDiscord?.addEventListener("click", () => signIn("discord"));
    btnKakao?.addEventListener("click", () => signIn("kakao"));

    btnLogout?.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("uniqueOAuthUser");
      sayOAuth("소셜 로그아웃 완료");
      if (btnLogout) btnLogout.style.display = "none";
    });

    (async () => {
      await handleOAuthCallback();
      await renderOAuthState();
      await maybeAutoContinue();
      sb.auth.onAuthStateChange(async () => {
        await renderOAuthState();
        await maybeAutoContinue();
      });
    })();
  </script>
</body>
</html>
