<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – Gate</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Unique – 초대 전용 게이트">
  <meta property="og:description" content="Invitation-only access for action takers.">
  <meta property="og:url" content="https://wordycow.github.io/so.t-leader-choice/the-unique-gate.html">
  <meta property="og:image" content="https://wordycow.github.io/so.t-leader-choice/img/the-unique-gate-preview.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Unique – 초대 전용 게이트">
  <meta name="twitter:description" content="Invitation-only access for action takers.">
  <meta name="twitter:image" content="https://wordycow.github.io/so.t-leader-choice/img/the-unique-gate-preview.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      z-index: 10;
    }

    .gate-card {
      position: relative;
      border-radius: 26px;
      padding: 28px 26px 22px;

      background: radial-gradient(circle at top, rgba(248,181,84,0.15), rgba(15,23,42,0.96));
      border: 1px solid rgba(250, 204, 21, 0.95);
      box-shadow:
        0 0 20px rgba(250, 204, 21, 0.75),
        0 28px 70px rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      overflow: visible;
      z-index: 20;
     }

    .gate-inner { position: relative; z-index: 1; }

    .gate-title-wrap { text-align: center; margin-bottom: 22px; }

    .gate-title {
      font-family: "Cinzel", "Times New Roman", serif;
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 8px;

      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 10px rgba(250, 204, 21, 0.9),
        0 4px 18px rgba(0,0,0,1);
    }

    .gate-subtitle-en {
      font-size: 11px;
      color: #f9fafb;
      opacity: 0.9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow:
        0 1px 3px rgba(0,0,0,0.9),
        0 0 6px rgba(0,0,0,0.6);
    }

    .form-body { max-width: 360px; margin: 0 auto; }
    .gate-input-wrap { margin-bottom: 10px; }

    .gate-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.90), rgba(3,7,18,0.96));
      color: #f9fafb;
      font-size: 13px;
      outline: none;
      box-shadow:
        0 4px 14px rgba(0,0,0,0.75) inset,
        0 0 0 1px rgba(0,0,0,0.55);
    }

    .gate-input::placeholder { color: #6b7280; }

    .gate-input:focus {
      border-color: rgba(248,181,84,0.95);
      box-shadow:
        0 0 0 1px rgba(248,181,84,0.6),
        0 6px 22px rgba(0,0,0,0.9) inset;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .btn-primary {
      background: radial-gradient(circle at top, #f97316, #7f1d1d);
      border-color: rgba(248,181,84,0.95);
      color: #fef2f2;
      box-shadow:
        0 10px 26px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 16px 38px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-ghost {
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-color: rgba(55,65,81,1);
      color: #e5e7eb;
      box-shadow: 0 8px 22px rgba(0,0,0,0.9);
    }

    .btn-ghost:hover {
      background: rgba(15,23,42,1);
      border-color: rgba(148,163,184,0.9);
    }

    .status {
      min-height: 18px;
      font-size: 11px;
      text-align: center;
      margin-top: 2px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .status-error { color: #fecaca; }

    .divider-amp{
      margin: 10px 0 10px;
      text-align:center;
      font-family:"Cinzel","Times New Roman",serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.35em;
      line-height: 1;

      color:transparent;
      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip:text;
      background-clip:text;

      text-shadow: 0 0 12px rgba(250,204,21,0.75), 0 6px 18px rgba(0,0,0,1);
      user-select:none;
    }

    :root{
      --bat-top: -8vh;
      --bat-right: 0vw;
      --bat-width: clamp(320px, 55vw, 900px);
      --bat-bob: 20px;

      --witch-top: 28vh;
      --witch-right: 20vw;
      --witch-width: clamp(18px, 7vw, 44px);
      --witch-bob: 6px;
    }
    .spirit{
      position:absolute;
      pointer-events:none;
      z-index: 1;
    }
    .spirit img{
      display:block;
      width:100%;
      height:auto;
      filter:none;
    }

    @keyframes floatY {
      from { transform: translateY(calc(-1 * var(--bob))); }
      to   { transform: translateY(var(--bob)); }
    }

    .spirit-bat{
      top: var(--bat-top);
      right: var(--bat-right);
      width: var(--bat-width);
      --bob: var(--bat-bob);
      animation: floatY 2.2s ease-in-out infinite alternate;
      opacity: .95;
    }

    .spirit-witch{
      top: var(--witch-top);
      right: var(--witch-right);
      width: var(--witch-width);
      --bob: var(--witch-bob);
      animation: floatY 3.2s ease-in-out infinite alternate;
    }

    .btn-with-icon{ gap:10px; justify-content:center; }
    .btn-with-icon svg{ width:18px; height:18px; flex:0 0 18px; display:block; }
    .btn-with-icon span{ line-height:1; }

    .btn-market{
      background: radial-gradient(circle at top, rgba(250,204,21,0.95), rgba(202,138,4,0.55));
      color:#111827;
      border: 1px solid rgba(250,204,21,0.95);
      box-shadow: 0 12px 28px rgba(0,0,0,0.95);
      letter-spacing: 0.16em;
      font-weight: 900;
    }
    .btn-market span{
      font-family:"Cinzel","Times New Roman",serif;
      font-weight:900;
      letter-spacing:0.24em;
      text-transform:uppercase;
    }

    @media (max-width: 768px) {
      .gate-card { padding: 24px 20px 18px; border-radius: 22px; }
      .gate-title { font-size: 32px; letter-spacing: 0.22em; }
      .form-body { max-width: 100%; }

      :root{
        --bat-top: 10vh;
        --bat-right: -22vw;
        --bat-width: 85vw;

        --witch-top: 18vh;
        --witch-right: 34vw;
        --witch-width: 12vw;
      }

      .divider-amp{
        margin: 8px 0 8px;
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-gate-clean.jpg" class="scene-bg" alt="The Unique Gate background">
    <div class="spirit spirit-witch"><img src="img/witch-float.png" alt=""></div>
    <div class="spirit spirit-bat"><img src="img/bat-float.png" alt=""></div>
  </div>

  <div class="page-wrap">
    <main class="gate-card">
      <div class="gate-inner">
        <div class="gate-title-wrap">
          <div class="gate-title">THE UNIQUE</div>
          <div class="gate-subtitle-en">Invitation-only access for action takers</div>
        </div>

        <form id="gate-form" class="form-body">
          <div class="gate-input-wrap">
            <input id="login-id" class="gate-input" type="text" autocomplete="off" placeholder="아이디" />
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary" id="login-btn">로그인</button>

            <!-- 세션스토리지에 return을 저장하므로, signup 다녀와도 return 유지됨 -->
            <a id="signup-link" href="the-unique-signup.html?return=the-unique-gate.html" class="btn btn-ghost">회원가입</a>
          </div>

          <div id="status" class="status"></div>

          <div class="divider-amp">&amp;</div>

          <div class="btn-row" style="margin-top:10px;">
            <a class="btn btn-market btn-with-icon" href="market.html?autologin=1">
              <svg viewBox="0 0 533.5 544.3" aria-hidden="true">
                <path fill="#4285F4" d="M533.5 278.4c0-18.5-1.5-37-4.7-55.2H272.1v104.6h146.9c-6.3 33.8-25 62.5-53.3 81.7v67h86.2c50.5-46.5 81.6-115.2 81.6-198.1z"/>
                <path fill="#34A853" d="M272.1 544.3c72.6 0 133.6-24.1 178.2-65.6l-86.2-67c-24 16.1-54.7 25.6-92 25.6-70.7 0-130.6-47.7-152.1-111.7H30.9v70.3c44.4 88.3 135.7 149.1 241.2 149.1z"/>
                <path fill="#FBBC05" d="M120 325.6c-10.8-32.3-10.8-67.3 0-99.6V155.7H30.9c-40.6 80.9-40.6 177.9 0 258.8L120 325.6z"/>
                <path fill="#EA4335" d="M272.1 107.7c39.5-.6 77.6 13.9 106.7 40.8l79.6-79.6C410.3 24.1 344.7-1.5 272.1 0 166.6 0 75.3 60.8 30.9 149.1l89.1 70.3c21.4-64 81.4-111.7 152.1-111.7z"/>
              </svg>
              <span>UNIQUE MARKET</span>
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
  // ✅ 구글 Apps Script 웹앱 (가입/조회가 여기로 붙음)
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

  // ✅ 로그인 성공 시 기본 이동 페이지
  const MAIN_PAGE = "the-unique-main.html";

  // ✅ return 저장 키 & TTL (stale return 때문에 promo로 끌려가는 것 방지)
  const RETURN_KEY = "unique_return_to";
  const RETURN_TTL_MS = 30 * 60 * 1000; // 30분

  // ✅ 인앱 브라우저 감지(카톡/텔레그램/인스타 등)
  function isInAppBrowser(){
    const ua = navigator.userAgent || "";
    return /KAKAOTALK|Instagram|FBAN|FBAV|Line|NAVER|DaumApps|Whale|Telegram|TikTok/i.test(ua);
  }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // ✅ status
  function setStatus(msg, isError=false){
    const el = document.getElementById("status");
    if (!el) return;
    el.textContent = msg || "";
    el.className = "status" + (isError ? " status-error" : "");
  }

  // ✅ 안전한 return 경로만 허용
  function safeReturnPath(p){
    p = String(p || "").trim();
    if (!p) return "";
    if (/^[a-zA-Z]+:\/\//.test(p)) return "";   // 외부URL 차단
    if (p.includes("..")) return "";            // 경로탈출 차단
    // 기본: *.html(쿼리 허용)
    if (!/^[a-z0-9\-_/]+\.html(\?.*)?$/i.test(p)) return "";
    return p;
  }

  function setReturnTarget(path){
    const p = safeReturnPath(path);
    if (!p) return;
    sessionStorage.setItem(RETURN_KEY, JSON.stringify({ p, ts: Date.now() }));
  }

  function getReturnTarget(){
    // 1) URL return 우선
    const qs = new URLSearchParams(location.search);
    const qret = safeReturnPath(qs.get("return"));
    if (qret) {
      setReturnTarget(qret);
      return qret;
    }

    // 2) sessionStorage return (TTL 내만)
    const raw = sessionStorage.getItem(RETURN_KEY);
    if (raw) {
      try{
        const o = JSON.parse(raw);
        const p = safeReturnPath(o && o.p);
        const ts = Number(o && o.ts) || 0;
        if (p && ts && (Date.now() - ts) <= RETURN_TTL_MS) return p;
      }catch(e){}
      // 만료/깨짐이면 삭제
      sessionStorage.removeItem(RETURN_KEY);
    }

    return MAIN_PAGE;
  }

  function clearLocalSessionAll(){
    const keys = [
      "uniqueCurrentUser",
      "unique_user_id",
      "user_id",
      "uid",
      "id",
      "unique_user_name",
      "unique_user_nick",
      "myUtPoints"
    ];
    keys.forEach(k => localStorage.removeItem(k));

    Object.keys(localStorage)
      .filter(k => k.startsWith("myNickname_"))
      .forEach(k => localStorage.removeItem(k));

    sessionStorage.removeItem(RETURN_KEY);
  }

  // ✅ JSONP 1회 호출
  function apiOnceJSONP(action, params = {}, timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);

      params.action = action;
      params.callback = cb;
      params._t = Date.now();

      const qs = new URLSearchParams(params).toString();
      const s = document.createElement("script");
      const joiner = GOOGLE_SCRIPT_URL.includes("?") ? "&" : "?";
      s.src = GOOGLE_SCRIPT_URL + joiner + qs;

      const t = setTimeout(() => {
        cleanup();
        reject(new Error("API timeout"));
      }, timeoutMs);

      window[cb] = (data) => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error("API load failed")); };

      function cleanup() {
        clearTimeout(t);
        try { delete window[cb]; } catch(e){}
        try { s.remove(); } catch(e){}
      }

      document.body.appendChild(s);
    });
  }

  // ✅ JSONP 재시도
  async function apiJSONP(action, params = {}) {
    let lastErr = null;
    const tries = 3;

    for (let i = 1; i <= tries; i++){
      try{
        const timeoutMs = (i === 1) ? 16000 : 24000;
        return await apiOnceJSONP(action, params, timeoutMs);
      } catch(e){
        lastErr = e;
        await sleep(350 * i);
      }
    }
    throw lastErr || new Error("API failed");
  }

  function pick(obj, keys){
    for (const k of keys){
      if (obj && obj[k] != null && String(obj[k]).trim() !== "") return obj[k];
    }
    return "";
  }

  function normalizeUser(u, fallbackId){
    const rawId = String(pick(u, ["id","ID","userId","userid","아이디"]) || fallbackId || "").trim();
    const idLower = rawId.toLowerCase();

    return {
      id: idLower,
      name: String(pick(u, ["name","이름","성명","fullName"]) || "").trim(),
      nickname: String(pick(u, ["nickname","닉네임","별명"]) || "").trim(),
      phone: String(pick(u, ["phone","전화번호","핸드폰","휴대폰"]) || "").trim(),
      team: String(pick(u, ["team","소속","추천인","리더","sponsor"]) || "").trim(),
      joinedAt: String(pick(u, ["joinedAt","joinAt","timestamp","타임스탬프"]) || "").trim(),
      balance: Number(pick(u, ["balance","ut","points","포인트"]) || 0)
    };
  }

  function saveUserToLocal(u){
    const idLower = String(u.id || "").toLowerCase().trim();

    localStorage.setItem("uniqueCurrentUser", JSON.stringify({
      id: idLower,
      name: u.name || "",
      phone: u.phone || "",
      team: u.team || "",
      joinedAt: u.joinedAt || "",
      nickname: u.nickname || "",
      balance: Number(u.balance || 0)
    }));

    // ✅ 다른 페이지(slot 등)에서 찾는 키들도 같이 저장 (호환용)
    localStorage.setItem("unique_user_id", idLower);
    localStorage.setItem("user_id", idLower);
    localStorage.setItem("uid", idLower);
    localStorage.setItem("id", idLower);

    localStorage.setItem("unique_user_name", u.name || "");
    localStorage.setItem("unique_user_nick", u.nickname || "");

    localStorage.setItem("myUtPoints", String(Number(u.balance || 0)));

    if (String(u.nickname || "").trim()) {
      localStorage.setItem("myNickname_" + idLower, String(u.nickname || "").trim());
    } else {
      localStorage.removeItem("myNickname_" + idLower);
    }
  }

  function extractUser(resp){
    if (!resp) return null;
    if (resp.user) return resp.user;
    if (resp.data) return resp.data;
    if (resp.row)  return resp.row;
    if (resp.result && resp.result.user) return resp.result.user;

    const hasAny =
      (resp.id || resp.ID || resp.아이디 || resp.name || resp.이름 || resp.phone || resp.전화번호 || resp.team || resp.소속);
    return hasAny ? resp : null;
  }

  function isOk(resp){
    if (!resp) return false;
    if (resp.ok === true) return true;
    if (resp.success === true) return true;
    if (String(resp.status || "").toLowerCase() === "ok") return true;
    if (String(resp.result || "").toLowerCase() === "ok") return true;
    if (resp.found === true || resp.exists === true) return true;
    return false;
  }

  // ✅ 서버가 대소문자 구분해도 통과시키기 위해 3번 조회
  async function getUserByIdRobust(rawId){
    const base = String(rawId || "").trim();
    if (!base) return null;

    const candidates = [];
    for (const v of [base, base.toLowerCase(), base.toUpperCase()]){
      if (v && !candidates.includes(v)) candidates.push(v);
    }

    let lastResp = null;
    for (const idTry of candidates){
      const r = await apiJSONP("getUser", { id: idTry });
      lastResp = r;
      const u0 = extractUser(r);
      if (isOk(r) && u0) return normalizeUser(u0, idTry);
    }

    const u1 = extractUser(lastResp);
    if (isOk(lastResp) && u1) return normalizeUser(u1, base);

    return null;
  }

  const form = document.getElementById("gate-form");
  const idInput = document.getElementById("login-id");
  const loginBtn = document.getElementById("login-btn");

  // ✅ 인앱 브라우저 경고
  if (isInAppBrowser()){
    setStatus("⚠️ 카톡/인스타/텔레그램 내장 브라우저에서는 오류가 날 수 있습니다. 크롬/사파리로 열어서 시도하세요.", true);
  }

  // ✅ 초기 파라미터 처리: return 저장 + signup/로그아웃 문구 + 아이디 프리필
  (function initFromQuery(){
    const qs = new URLSearchParams(location.search);

    // return 저장(핵심)
    const ret = safeReturnPath(qs.get("return"));
    if (ret) setReturnTarget(ret);

    // 로그인 완료/가입 완료 문구
    const preId = (qs.get("id") || qs.get("userid") || qs.get("user") || "").trim();
    const signup = qs.get("signup");
    const logout = qs.get("logout");

    if (preId && idInput) idInput.value = preId;

    if (logout === "1"){
      // 🔥 로그아웃으로 게이트 들어오면: 세션/리턴값 싹 정리
      clearLocalSessionAll();
      setStatus("✅ 로그아웃되었습니다. 아이디를 입력해 로그인하세요.");
      history.replaceState(null, "", "the-unique-gate.html"); // URL 깔끔하게
      return;
    }

    if (signup === "1"){
      setStatus("✅ 회원가입 완료! 아이디 확인 후 로그인하세요.");
    } else if (preId){
      setStatus("아이디 확인 후 로그인하세요.");
    } else {
      // return만 있고 다른 이벤트 없으면 굳이 메시지 안띄움(깔끔)
    }

    // 옵션: ?autologin=1&id=xxx 이면 자동 로그인
    const auto = qs.get("autologin");
    if (auto === "1" && preId){
      setTimeout(() => form && form.dispatchEvent(new Event("submit", { cancelable: true })), 200);
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const raw = (idInput.value || "").trim();
    if (!raw) { setStatus("아이디를 입력해 주세요.", true); return; }

    setStatus("회원 확인 중...");
    if (loginBtn) loginBtn.disabled = true;

    try {
      const user = await getUserByIdRobust(raw);

      if (!user || !user.id) {
        setStatus("등록되지 않은 아이디입니다. (대소문자/띄어쓰기 확인)", true);
        if (loginBtn) loginBtn.disabled = false;
        return;
      }

      saveUserToLocal(user);

      // ✅ 로그인 후 이동 대상: return 우선, 없으면 MAIN_PAGE
      let dest = getReturnTarget();

      // dest가 gate 자체면 루프 방지
      const destLower = String(dest || "").toLowerCase();
      if (destLower.startsWith("the-unique-gate.html")) dest = MAIN_PAGE;

      // 🔥 한 번 쓰고 삭제(다음에 promo로 끌려가는 문제 방지)
      sessionStorage.removeItem(RETURN_KEY);

      // 뒤로가기로 게이트가 남지 않게 replace 사용
      location.replace(dest);

    } catch (err) {
      console.error(err);
      const msg = String(err && err.message ? err.message : err);

      if (msg.includes("timeout")) {
        setStatus("네트워크 지연으로 응답이 늦습니다. 다시 시도해 주세요.", true);
      } else if (msg.includes("load failed")) {
        setStatus("script.google.com 연결이 차단됐을 수 있습니다. (광고차단/보안DNS/인앱브라우저 확인)", true);
      } else {
        setStatus("서버 통신 중 오류가 발생했습니다. (잠시 후 다시 시도)", true);
      }

      if (loginBtn) loginBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
