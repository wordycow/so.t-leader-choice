<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – Gate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }
    body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; color:#f9fafb; background:#000; }

    .scene{ position:fixed; inset:0; overflow:hidden; }
    .scene-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

    .page-wrap{
      position:absolute; inset:0;
      display:flex; justify-content:center; align-items:center;
      padding:24px 12px;
      z-index:10;
    }

    .gate-card{
      position:relative; border-radius:26px; padding:28px 26px 22px;
      background: radial-gradient(circle at top, rgba(248,181,84,0.15), rgba(15,23,42,0.96));
      border:1px solid rgba(250,204,21,0.95);
      box-shadow: 0 0 20px rgba(250,204,21,0.75), 0 28px 70px rgba(0,0,0,0.95);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index:20;
    }

    .gate-title-wrap{ text-align:center; margin-bottom:18px; }
    .gate-title{
      font-family:"Cinzel","Times New Roman",serif; font-weight:700; font-size:40px;
      letter-spacing:0.24em; text-transform:uppercase; margin-bottom:8px;
      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow: 0 0 10px rgba(250,204,21,0.9), 0 4px 18px rgba(0,0,0,1);
    }
    .gate-subtitle-en{ font-size:11px; opacity:.9; letter-spacing:.12em; text-transform:uppercase; }

    .form-body{ max-width:360px; margin:0 auto; }

    .gate-input{
      width:100%; padding:11px 14px; border-radius:999px;
      border:1px solid rgba(55,65,81,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.90), rgba(3,7,18,0.96));
      color:#f9fafb; font-size:13px; outline:none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.75) inset, 0 0 0 1px rgba(0,0,0,0.55);
      margin-bottom:10px;
    }

    .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:10px; margin-bottom:2px; }

    .btn{
      width:100%; min-height:42px; padding:10px 10px; border-radius:999px;
      border:1px solid transparent; font-size:13px; font-weight:900;
      letter-spacing:0.12em; text-transform:uppercase; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
    }

    .btn-primary{
      background: radial-gradient(circle at top, #f97316, #7f1d1d);
      border-color: rgba(248,181,84,0.95); color:#fef2f2;
      box-shadow: 0 10px 26px rgba(0,0,0,1), 0 0 0 1px rgba(0,0,0,0.5) inset;
    }

    .btn-ghost{
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-color: rgba(55,65,81,1); color:#e5e7eb;
      box-shadow: 0 8px 22px rgba(0,0,0,0.9);
    }

    .divider-amp{
      margin: 6px 0 8px;
      text-align:center;
      font-family:"Cinzel","Times New Roman",serif;
      font-size:22px; font-weight:800; letter-spacing:0.35em;
      color:transparent;
      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip:text; background-clip:text;
      text-shadow: 0 0 12px rgba(250,204,21,0.75), 0 6px 18px rgba(0,0,0,1);
      user-select:none;
    }

    .btn-with-icon{ gap:10px; justify-content:center; }
    .btn-with-icon svg{ width:18px; height:18px; flex:0 0 18px; display:block; }
    .btn-with-icon span{ line-height:1; }

    .btn-market{
      background: radial-gradient(circle at top, rgba(250,204,21,0.95), rgba(202,138,4,0.55));
      color:#111827; border-color: rgba(250,204,21,0.95);
      box-shadow: 0 12px 28px rgba(0,0,0,0.95);
      letter-spacing: 0.16em; font-weight: 900;
    }
    .btn-market span{
      font-family:"Cinzel","Times New Roman",serif;
      font-weight:900;
      letter-spacing:0.24em;
      text-transform:uppercase;
    }

    .status{ min-height:18px; font-size:11px; text-align:center; margin-top:6px; opacity:.85; }
    .status-error{ color:#fecaca; opacity:1; }

    /* =========================
       ✅ 마녀/박쥐: 달(오른쪽 위) 기준으로 고정 + 왔다리갔다리
       - 카드 안이 아니라 "화면 전체(page-wrap)" 기준
       ========================= */
   .spirit{
  position:absolute;
  pointer-events:none;
  z-index:12; /* 카드보다 아래 */
}
.spirit img{
  display:block;
  width:100%;
  height:auto;
  filter: drop-shadow(0 0 10px rgba(250,204,21,0.45));
}

/* ✅ 위아래만 */
@keyframes bobY {
  from { transform: translateY(-10px); }
  to   { transform: translateY(14px); }
}
@keyframes bobY2 {
  from { transform: translateY(10px); }
  to   { transform: translateY(-14px); }
}

/* ✅ 박쥐 무리 - 오른쪽(화면 끝에 붙어서 잘리게) */
.spirit-bat-right{
  top: 7vh;
  right: -6vw;                 /* ✅ 더 붙이고 싶으면 -10vw */
  width: clamp(280px, 30vw, 560px);
  animation: bobY 2.4s ease-in-out infinite alternate;
  opacity: .95;
}

/* ✅ 박쥐 무리 - 왼쪽(성 기준 왼쪽에 한 무리) */
.spirit-bat-left{
  top: 9vh;
  right: 18vw;                 /* ✅ 성 중심 기준 왼쪽으로 */
  width: clamp(220px, 24vw, 460px);
  animation: bobY2 2.8s ease-in-out infinite alternate;
  opacity: .92;
}
/* 왼쪽 무리는 좌우 반전해서 ‘양쪽으로 갈라진’ 느낌 */
.spirit-bat-left img{
  transform: scaleX(-1);
  transform-origin: center;
}

/* ✅ 마녀: 성 왼쪽 / 지금보다 작게 */
.spirit-witch{
  top: 14vh;
  right: 16vw;                 /* ✅ 성의 왼쪽 라인 쪽 */
  width: clamp(30px, 3.2vw, 68px);
  animation: bobY 3.6s ease-in-out infinite alternate;
}

/* 모바일 보정(선택) */
@media (max-width:768px){
  .spirit-bat-right{ top: 6vh; right: -18vw; width: 78vw; }
  .spirit-bat-left { top: 8vh; right: 28vw; width: 60vw; }
  .spirit-witch    { top: 12vh; right: 26vw; width: 16vw; }
}
    }
  </style>
</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-gate-clean.jpg" class="scene-bg" alt="bg">
  </div>

  <div class="page-wrap">
    <!-- ✅ 달 근처(오른쪽 위) 마녀/박쥐: 카드 밖(화면 기준) -->
    <div class="spirit spirit-bat"><img src="img/bat-float.png" alt=""></div>
    <div class="spirit spirit-witch"><img src="img/witch-float.png" alt=""></div>

    <main class="gate-card">
      <div class="gate-title-wrap">
        <div class="gate-title">THE UNIQUE</div>
        <div class="gate-subtitle-en">INVITATION-ONLY ACCESS FOR ACTION TAKERS</div>
      </div>

      <form id="gate-form" class="form-body">
        <input id="login-id" class="gate-input" type="text" autocomplete="off" placeholder="아이디" />

        <div class="btn-row">
          <button type="submit" class="btn btn-primary">로그인</button>
          <a href="the-unique-signup.html" class="btn btn-ghost">회원가입</a>
        </div>

        <div id="status" class="status"></div>

        <div class="divider-amp">&amp;</div>

        <a class="btn btn-market btn-with-icon" href="market.html?autologin=1">
          <svg viewBox="0 0 533.5 544.3" aria-hidden="true">
            <path fill="#4285F4" d="M533.5 278.4c0-18.5-1.5-37-4.7-55.2H272.1v104.6h146.9c-6.3 33.8-25 62.5-53.3 81.7v67h86.2c50.5-46.5 81.6-115.2 81.6-198.1z"/>
            <path fill="#34A853" d="M272.1 544.3c72.6 0 133.6-24.1 178.2-65.6l-86.2-67c-24 16.1-54.7 25.6-92 25.6-70.7 0-130.6-47.7-152.1-111.7H30.9v70.3c44.4 88.3 135.7 149.1 241.2 149.1z"/>
            <path fill="#FBBC05" d="M120 325.6c-10.8-32.3-10.8-67.3 0-99.6V155.7H30.9c-40.6 80.9-40.6 177.9 0 258.8L120 325.6z"/>
            <path fill="#EA4335" d="M272.1 107.7c39.5-.6 77.6 13.9 106.7 40.8l79.6-79.6C410.3 24.1 344.7-1.5 272.1 0 166.6 0 75.3 60.8 30.9 149.1l89.1 70.3c21.4-64 81.4-111.7 152.1-111.7z"/>
          </svg>
          <span>UNIQUE MARKET</span>
        </a>
      </form>
    </main>
  </div>

  <!-- ✅ 구글시트는 아이디 로그인할 때만 로드 -->
  <script>
    let allowedIds = null;
    let memberInfoById = {};
    let sheetError = false;
    let _sheetPromise = null;

    function handleSheetResponse(resp) {
      try {
        const rows = resp.table.rows || [];
        const ids = [];

        rows.forEach((row) => {
          const cells = row.c || [];
          const tsCell   = cells[5] || cells[0];
          const idCell   = cells[1];
          const nameCell = cells[2];
          const teamCell = cells[4];
          if (!idCell || idCell.v == null) return;

          const rawId = String(idCell.v).trim();
          if (!rawId || rawId === "아이디") return;

          const idLower = rawId.toLowerCase();
          ids.push(idLower);

          const name = nameCell && nameCell.v ? String(nameCell.v).trim() : "";
          const team = teamCell && teamCell.v ? String(teamCell.v).trim() : "";
          const joinedAt = tsCell && tsCell.v ? String(tsCell.v).trim() : "";

          memberInfoById[idLower] = { id: rawId, name, team, joinedAt };
        });

        allowedIds = new Set(ids);
      } catch (e) { sheetError = true; }
    }

    function loadSheetOnce() {
      if (_sheetPromise) return _sheetPromise;
      _sheetPromise = new Promise((resolve) => {
        const SSID = "1SUXCiLg7sbZ_2OxanCEgVwgk3dJhZLhyX0-lltTxBnM";
        const GID  = "160409301";
        const url  = `https://docs.google.com/spreadsheets/d/${SSID}/gviz/tq?gid=${GID}&tqx=responseHandler:handleSheetResponse&cb=${Date.now()}`;
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => resolve();
        s.onerror = () => { sheetError = true; resolve(); };
        document.head.appendChild(s);
        setTimeout(() => resolve(), 1800);
      });
      return _sheetPromise;
    }

    const form = document.getElementById("gate-form");
    const idInput = document.getElementById("login-id");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = (idInput.value || "").trim();
      statusEl.textContent = "";
      statusEl.className = "status";

      if (!id) { statusEl.textContent = "아이디를 입력해 주세요."; statusEl.classList.add("status-error"); return; }
      if (!allowedIds && !sheetError) { statusEl.textContent = "회원 정보 불러오는 중..."; await loadSheetOnce(); }
      if (sheetError || !allowedIds) { statusEl.textContent = "시트 로딩 실패(공유 설정 확인)"; statusEl.classList.add("status-error"); return; }

      const normalized = id.toLowerCase();
      if (allowedIds.has(normalized)) {
        const info = memberInfoById[normalized] || {};
        localStorage.setItem("uniqueCurrentUser", JSON.stringify({
          id: normalized, name: info.name || "", team: info.team || "", joinedAt: info.joinedAt || "", via:"sheet-id"
        }));
        location.href = "the-unique-main.html";
      } else {
        statusEl.textContent = "등록되지 않은 아이디입니다.";
        statusEl.classList.add("status-error");
      }
    });
  </script>
</body>
</html>
