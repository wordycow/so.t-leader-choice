<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – Member Hall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- THE UNIQUE 타이틀용 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:#f9fafb;
      background-color:#0B1120;
      background-image:radial-gradient(circle at top, rgba(148,163,184,0.18), transparent 55%);
      background-attachment:fixed;
    }

    .scene{position:fixed; inset:0; overflow:hidden; pointer-events:none;}
    .scene-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; mix-blend-mode:screen;}

    .page-wrap{
      position:relative;
      z-index:10;
      max-width:1200px;
      margin:72px auto 40px;
      padding:0 16px;
      width:100%;
    }

    .main-card{
      position:relative;
      width:100%;
      max-width:920px;
      margin:0 auto;
      border-radius:26px;
      padding:28px 32px 26px;

      background:#1e2848;
      border:1px solid rgba(245,158,11,0.95);
      box-shadow:
        0 0 24px rgba(245,158,11,0.65),
        0 35px 90px rgba(0,0,0,0.95);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .main-inner{position:relative; z-index:1;}
    .title-wrap{text-align:center; margin-bottom:22px;}

    .title-en{
      font-family:"Cinzel","Times New Roman",serif;
      font-weight:700;
      font-size:32px;
      letter-spacing:.24em;
      text-transform:uppercase;
      margin-bottom:6px;
      color:#FACC15;
      text-shadow: 0 0 16px rgba(245,158,11,0.9), 0 4px 18px rgba(0,0,0,0.95);
    }
    .subtitle-en{
      font-size:11px;
      color:#94A3B8;
      letter-spacing:.12em;
      text-transform:none;
    }

    /* ───── 상단 Discord / YouTube 아이콘 (오른쪽) ───── */
    .top-sns-icons{
      position:absolute;
      top:68px;
      right:46px;
      display:flex;
      align-items:center;
      gap:6px;
      z-index:5;

      /* ✅ 뒤 캡슐(배경/테두리/그림자) 제거 */
      background:transparent;
      border:none;
      padding:0;
      box-shadow:none;
    }
    .top-sns-icons a{display:block; line-height:0; text-decoration:none;}
    .top-sns-icons img{display:block; width:42px; height:42px;}

    /* ───── UNIQUE MARKET 버튼 (왼쪽 / 대칭 위치, PC만) ───── */
    .top-market-btn{
      position:absolute;
      top:68px;
      left:46px;
      z-index:6;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:6px 12px;
      border-radius:999px;
      border:1px solid rgba(245,158,11,0.55);
      background: rgba(30,40,72,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      font-family:"Cinzel","Times New Roman",serif;
      font-weight:700;
      letter-spacing:0.18em;
      text-transform:uppercase;

      color:#FACC15;
      text-decoration:none;
      text-shadow: 0 0 10px rgba(245,158,11,0.75), 0 4px 14px rgba(0,0,0,0.85);

      transition: transform .12s ease, filter .12s ease, background .12s ease;
    }
    .top-market-btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.08);
      background: rgba(245,158,11,0.10);
    }

    /* ───── 주간 강의 스케줄 ───── */
    .top-schedule-panel{
      margin:10px 0 18px;
      border-radius:18px;
      padding:10px 14px 12px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.96), rgba(15,23,42,0.99));
      box-shadow:
        0 0 0 1px rgba(30,64,118,0.85),
        0 12px 26px rgba(0,0,0,0.9);
    }
    .top-schedule-header{
      font-size:13px;
      font-weight:600;
      color:#e5e7eb;
      margin-bottom:6px;
    }
    .top-schedule-grid{
      display:grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap:8px;
      font-size:11px;
      min-height:110px; /* ✅ 비어도 영역 안 사라지게 */
    }
    .top-schedule-day{
      background: rgba(15,23,42,0.98);
      border-radius:12px;
      border:1px solid rgba(51,65,85,0.9);
      padding:6px 7px;
    }
    .top-schedule-day-name{
      font-weight:600;
      color:#facc15;
      margin-bottom:4px;
      word-break:keep-all;
    }
    .top-schedule-item{margin-bottom:5px;}
    .top-schedule-time{
      font-weight:600;
      color:#e5e7eb;
      word-break:keep-all;
      line-height:1.25;
    }
    .top-schedule-title{
      color:#c4b5fd;
      word-break:keep-all;
      line-height:1.38;
    }
    .top-schedule-empty{
      font-size:11px;
      color:#9ca3af;
      margin-bottom:6px;
    }
    .top-schedule-empty-day{
      font-size:11px;
      color:#9ca3af;
      margin-top:6px;
    }

    /* ───── 메인 레이아웃 ───── */
    .layout{
      display:grid;
      grid-template-columns:minmax(0, 2.4fr) minmax(0, 3fr);
      gap:24px;
      align-items:stretch;
    }

    /* ✅ 왼쪽/오른쪽 블럭 높이 맞추기 (버튼 추가로 커져도 같이 늘어남) */
.member-panel,
.goal-panel{
  height: 100%;
  min-height: 0;
}

/* ✅ 오른쪽 내부 카드가 남는 공간까지 꽉 채우기 */
.next-goal-card{
  flex: 1 1 auto;
  min-height: 0;
}

    /* ───── 회원 정보 + 직급 ───── */
    .member-panel{
      border-radius:22px;
      padding:16px 18px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.98), rgba(15,23,42,0.99));
      box-shadow:
        0 0 0 1px rgba(30,64,118,0.85),
        0 12px 28px rgba(0,0,0,0.9);
      display:flex;
      flex-direction:column;
    }
    .member-hello{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;}
    .member-name{font-size:20px;font-weight:700;margin-bottom:4px;color:#fff;}
    .member-id{display:none;}
    .member-meta{font-size:12px;color:#94A3B8;margin-bottom:6px;}

    .rank-badge-box{
      margin-top:16px;
      padding:20px 26px 20px;
      border-radius:22px;
      background: radial-gradient(circle at top, #1D2953, #0B1120);
      border:1px solid rgba(148,163,184,0.9);
      box-shadow:
        0 0 0 1px rgba(15,23,42,1),
        0 16px 32px rgba(15,23,42,0.9);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .rank-road{display:flex;align-items:center;gap:12px;}
    .rank-slot{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .rank-slot-next{margin-top:12px;}
    .rank-icon{
      max-height:130px;height:auto;width:auto;border-radius:12px;object-fit:contain;background:transparent;
      --rank-scale:1;
      transform:scale(var(--rank-scale));
      transform-origin:center bottom;
    }
    .rank-icon-next{opacity:1;}
    .rank-arrow{
      font-size:22px;color:#F59E0B;text-shadow:0 0 10px rgba(245,158,11,0.7);
      margin:0 -4px;
    }
    .rank-mini-label{font-size:11px;color:#E5E7EB;opacity:.95;}

    /* ───── 목표 + 마녀 ───── */
    .goal-panel{
      border-radius:22px;
      padding:16px 18px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.96), rgba(15,23,42,0.98));
      box-shadow:
        0 0 0 1px rgba(30,64,118,0.75),
        0 12px 28px rgba(0,0,0,0.9);
      display:flex;
      flex-direction:column;
    }
    .goal-header{margin-bottom:6px;}
    .goal-header-text{font-size:14px;font-weight:700;color:#E5E7EB;}
    .goal-header-text span{color:#FACC15;font-weight:800;margin-left:4px;}

    .next-goal-card{
      flex:1 1 auto;
      border-radius:18px;
      padding:18px 24px 18px;
      background:url("img/next-goal-bg.jpg") center center/cover no-repeat;
      border:1px solid #F59E0B;
      box-shadow:
        0 0 0 1px rgba(15,23,42,1),
        0 10px 24px rgba(0,0,0,0.9);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .next-goal-top{
      display:flex;
      justify-content:center;
      margin-top:40px;
      margin-bottom:32px;
    }
    .goal-me-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
    .goal-witch{
      max-height:200px;height:auto;width:auto;display:block;
      animation: witchFloat 4s ease-in-out infinite alternate;
      filter:
        drop-shadow(0 0 10px rgba(245,158,11,0.9))
        drop-shadow(0 6px 14px rgba(0,0,0,0.8));
    }
    .goal-me-label{display:none;}

    .next-goal-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
    .goal-side{display:flex;flex-direction:column;gap:4px;flex:1;}
    .goal-label{
      font-size:14px;color:#FACC15;
      text-shadow:0 0 8px rgba(245,158,11,0.8), 0 2px 10px rgba(0,0,0,0.9);
    }
    .goal-count{
      font-size:72px;font-weight:800;color:#FACC15;
      text-shadow:0 0 12px rgba(245,158,11,0.9), 0 0 22px rgba(0,0,0,0.9);
      line-height:1;
    }
    .goal-left{align-items:flex-start;}
    .goal-right{align-items:flex-end;}
    .goal-left .goal-count,.goal-left .goal-label{text-align:left;}
    .goal-right .goal-count,.goal-right .goal-label{text-align:right;}

    /* eBook 패널 */
    .ebook-panel{
      margin-top:18px;
      border-radius:18px;
      padding:12px 16px 16px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.98), rgba(15,23,42,0.99));
      box-shadow:
        0 0 0 1px rgba(30,64,118,0.85),
        0 10px 24px rgba(0,0,0,0.9);
    }
    .ebook-panel .section-title{margin-bottom:8px;font-size:13px;font-weight:600;color:#E5E7EB;}
    .ebook-list{display:flex;flex-wrap:wrap;gap:10px;}
    .ebook-card{
      border-radius:16px;
      padding:14px;
      background: linear-gradient(135deg, #111827, #020617);
      display:flex;
      gap:14px;
      align-items:stretch;
      text-decoration:none;
      color:#E5E7EB;
      box-shadow:
        0 0 0 1px rgba(30,64,118,0.9),
        0 14px 26px rgba(0,0,0,0.9);
      min-height:120px;
      flex:1 1 calc(50% - 10px);
      min-width:0;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .ebook-card:hover{
      transform:translateY(-1px);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.95),
        0 0 0 1px rgba(248,250,252,0.6);
      background: linear-gradient(135deg, #1E293B, #020617);
    }
    .ebook-thumb{width:96px;height:96px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#020617;}
    .ebook-thumb img{width:100%;height:100%;object-fit:cover;}
    .ebook-meta-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;}
    .ebook-meta-desc{font-size:11px;color:#CBD5F5;opacity:.9;}
    .ebook-meta-cta{margin-top:4px;font-size:11px;color:#FACC15;}
    .ebook-admin-link-wrap{margin-top:6px;text-align:right;}
    .ebook-admin-link{font-size:11px;color:#9CA3AF;text-decoration:none;opacity:.75;}
    .ebook-admin-link:hover{opacity:1;color:#FACC15;}

    /* 버튼 */
    .member-actions{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
    .action-btn{
      width:100%;
      padding:9px 10px;
      border-radius:999px;
      border:1px solid #F59E0B;
      font-size:11px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      background: radial-gradient(circle at top, #1D2953, #0B1120);
      color:#fff;
      box-shadow: 0 8px 18px rgba(0,0,0,0.9), 0 0 0 1px rgba(15,23,42,0.9) inset;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .action-btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.06);
      box-shadow: 0 14px 26px rgba(0,0,0,1), 0 0 0 1px rgba(245,158,11,0.85) inset;
    }
    .action-badge{
      min-width:16px;height:16px;border-radius:999px;
      background:#EF4444;color:#FEF2F2;font-size:10px;
      display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
    }
    .action-badge.hidden{display:none;}
    .action-btn-sot{padding:9px 10px;}
    .sot-logo-text{
      font-family:"Cinzel","Times New Roman",serif;
      font-size:16px;
      letter-spacing:.15em;
      color:#FACC15;
    }

    .logout-row{margin-top:10px;text-align:right;}
    .logout-btn{
      width:100%;
      padding:10px 10px;
      border-radius:999px;
      border:none;
      font-size:13px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      cursor:pointer;
      background: linear-gradient(180deg, #B91C1C, #7F1D1D);
      color:#FEF2F2;
      box-shadow: 0 10px 24px rgba(0,0,0,0.9), 0 0 0 1px rgba(127,29,29,0.9) inset;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .logout-btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.05);
      box-shadow: 0 16px 32px rgba(0,0,0,1), 0 0 0 1px rgba(248,250,252,0.8) inset;
    }

    .promo-section{display:none;}
    .footer-note{
      margin-top:12px;
      font-size:11px;
      color:#9CA3AF;
      text-align:right;
      max-width:920px;
      margin-left:auto;
      margin-right:auto;
      opacity:.85;
    }

    @keyframes witchFloat{
      0%   { transform: translateY(-10px); }
      50%  { transform: translateY(10px); }
      100% { transform: translateY(-10px); }
    }

    @media (max-width: 900px){
      .top-schedule-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 768px){
      .page-wrap{ margin-top:40px; }
      .main-card{ padding:24px 18px 20px; border-radius:22px; }
      .title-en{ font-size:28px; letter-spacing:0.22em; }
      .layout{ grid-template-columns: minmax(0,1fr); gap:18px; }
      .ebook-list{ flex-direction:column; }
      .ebook-card{ flex:1 1 100%; }

      /* 모바일: market 버튼 숨김 */
      .top-market-btn{ display:none; }

      /* 모바일 SNS 배치: 유튜브 왼쪽 / 디스코드 오른쪽 */
      .top-sns-icons{
        top:54px !important;
        left:24px !important;
        right:24px !important;
        height:48px;
      }
      .top-sns-icons a{ position:absolute; top:0; }
      .top-sns-icons .sns-youtube{ left:0; display:block !important; }
      .top-sns-icons .sns-discord{ right:0; }
      .top-sns-icons img{ width:48px !important; height:48px !important; }
    }

    @media (min-width: 901px){
      .main-card{ max-width:1120px; }
      .top-schedule-panel{ padding:14px 18px 16px; }
      .top-schedule-header{ font-size:14px; margin-bottom:10px; }
      .top-schedule-grid{ gap:10px; font-size:12px; }
      .top-schedule-day{ padding:10px 10px; }
      .top-schedule-item{ margin-bottom:9px; }
    }
/* ✅ LINKON 버튼: 버튼 크기는 So.T와 동일하게 고정, 로고만 키움 */
.action-btn.linkon-btn{
  /* 버튼 높이(패딩) 고정 = So.T 느낌 유지 */
  padding: 6px 10px;          /* ✅ action-btn 기본과 동일 */
  gap: 10px;                  /* 로고/텍스트 간격 */

  border: 1px solid rgba(164,212,186,0.55);
  background: linear-gradient(180deg, #055430 0%, #024B2A 100%);
  box-shadow:
    0 10px 24px rgba(0,0,0,0.9),
    0 0 0 1px rgba(164,212,186,0.18) inset;

  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.action-btn.linkon-btn:hover{
  transform: translateY(-1px);
  filter: brightness(1.06);
  background: linear-gradient(180deg, #066038 0%, #024B2A 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,1),
    0 0 0 1px rgba(164,212,186,0.35) inset;
}

/* ✅ 로고만 크게(=글씨만 키운 효과) */
.action-btn.linkon-btn .linkon-logo{
  height: 32px;        /* ✅ 여기만 키우면 “글씨만 커진 느낌” */
  width: auto;
  display:block;
  object-fit: contain;
}
/* ✅ UNIQUE 금고 버튼: 럭셔리 골드 + Cinzel(UNIQUE MARKET 톤) */
.action-btn.action-btn-unique{
  font-family:"Cinzel","Times New Roman",serif;  /* ✅ 마켓과 동일 계열 */
  font-weight:800;
  letter-spacing:0.18em;
  text-transform:uppercase;

  border: 1px solid rgba(245,158,11,0.95);
  background:
    radial-gradient(circle at top, rgba(255,215,120,0.20), rgba(30,40,72,0.92)),
    linear-gradient(180deg, rgba(245,158,11,0.18), rgba(124,45,18,0.18));
  color:#FACC15;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.92),
    0 0 0 1px rgba(245,158,11,0.45) inset,
    0 0 18px rgba(245,158,11,0.25);
}

.action-btn.action-btn-unique:hover{
  transform: translateY(-1px);
  filter: brightness(1.06);
  box-shadow:
    0 16px 32px rgba(0,0,0,1),
    0 0 0 1px rgba(245,158,11,0.75) inset,
    0 0 24px rgba(245,158,11,0.35);
}

/* ✅ N 배지도 골드 버튼에 맞게 살짝 고급톤 */
.action-btn.action-btn-unique .action-badge{
  background: #EF4444;
  box-shadow: 0 8px 18px rgba(0,0,0,0.85);
}


  </style>
</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-main.jpg" class="scene-bg" alt="The Unique main background" />
  </div>

  <div class="page-wrap">
    <main class="main-card">

      <!-- ✅ 왼쪽(대칭) UNIQUE MARKET -->
      <a class="top-market-btn" href="market.html" target="_blank" rel="noopener noreferrer">UNIQUE MARKET</a>

      <!-- 오른쪽 Discord / YouTube -->
      <div class="top-sns-icons">
        <a class="sns-discord" href="https://discord.gg/3cUN7QXMSY" target="_blank" rel="noopener noreferrer">
          <img src="img/discord-round.png" alt="Discord" />
        </a>
        <a class="sns-youtube" href="https://www.youtube.com/@%EC%8F%98%ED%8B%B0So.T" target="_blank" rel="noopener noreferrer">
          <img src="img/youtube-round.png" alt="YouTube" />
        </a>
      </div>

      <div class="main-inner">
        <div class="title-wrap">
          <div class="title-en">THE UNIQUE</div>
          <div class="subtitle-en">운동과 공부는 버릴게 없다!</div>
        </div>

        <section class="top-schedule-panel">
          <div class="top-schedule-header">이번 주 강의 스케쥴</div>
          <div id="top-schedule-empty" class="top-schedule-empty">주간 스케쥴을 불러오는 중입니다...</div>
          <div id="top-schedule-grid" class="top-schedule-grid"></div>
        </section>

        <section class="layout">
          <div class="member-panel">
            <div class="member-hello" id="member-hello">오늘도 성장하러 오셨군요.</div>
            <div id="member-name" class="member-name">회원 이름</div>
            <div id="member-id" class="member-id">userid</div>
            <div id="member-team" class="member-meta">소속: -</div>

            <div class="rank-badge-box">
              <div class="rank-road">
                <div class="rank-slot">
                  <img id="member-rank-img" class="rank-icon" src="img/member.png" alt="현재 직급 배지" />
                  <div id="member-rank-mini" class="rank-mini-label">현재 직급: 정회원</div>
                </div>

  <script>
    function handleScheduleSheet(resp) {
      try {
        const rows = resp.table.rows || [];
        const byDay = {};
        const dayLabelByCol = {};
        let currentPeriod = "";

        rows.forEach((row) => {
          const cells = row.c || [];
          const values = cells.map(c => (c && c.v != null) ? String(c.v).trim() : "");

          for (let j = 1; j < values.length; j++) {
            const v = values[j];
            if (v && v.includes("요일")) dayLabelByCol[j] = v;
          }

          const v0 = values[0];
          if (!v0) return;

          if (v0.includes("오전") || v0.includes("오후")) { currentPeriod = v0; return; }
          if (!v0.endsWith("시")) return;

          const timeLabel = currentPeriod ? (currentPeriod + " " + v0) : v0;

          for (let j = 1; j < values.length; j++) {
            const title = values[j];
            const dayLabel = dayLabelByCol[j];
            if (!dayLabel) continue;
            if (!byDay[dayLabel]) byDay[dayLabel] = [];
            if (title) byDay[dayLabel].push({ time: timeLabel, title: title });
          }
        });

        const gridEl  = document.getElementById("top-schedule-grid");
        const emptyEl = document.getElementById("top-schedule-empty");
        if (!gridEl || !emptyEl) return;

        gridEl.innerHTML = "";
        emptyEl.style.display = "none";

        const dayOrder = ["월요일","화요일","수요일","목요일","금요일","토요일","일요일"];

        // ✅ 항상 7일 보여주기(비어도 - 표시)
        dayOrder.forEach(dayLabel => {
          const dayDiv = document.createElement("div");
          dayDiv.className = "top-schedule-day";

          const nameDiv = document.createElement("div");
          nameDiv.className = "top-schedule-day-name";
          nameDiv.textContent = dayLabel;
          dayDiv.appendChild(nameDiv);

          const items = byDay[dayLabel] || [];
          if (!items.length){
            const none = document.createElement("div");
            none.className = "top-schedule-empty-day";
            none.textContent = "-";
            dayDiv.appendChild(none);
          } else {
            items.forEach(item => {
              const itemDiv = document.createElement("div");
              itemDiv.className = "top-schedule-item";
              itemDiv.innerHTML =
                '<div class="top-schedule-time">'  + item.time  + '</div>' +
                '<div class="top-schedule-title">' + item.title + '</div>';
              dayDiv.appendChild(itemDiv);
            });
          }

          gridEl.appendChild(dayDiv);
        });

      } catch (e) {
        console.error("schedule sheet parse error:", e);
        const emptyEl = document.getElementById("top-schedule-empty");
        if (emptyEl) {
          emptyEl.textContent = "스케쥴 정보를 불러오는 중 오류가 발생했습니다.";
          emptyEl.style.display = "block";
        }
      }
    }
  </script>

    // ✅ rank code 정규화 (PRO2/STAR1/프로II/스타Ⅰ 등 → Pro2 / Star1 / Member)
function romanToInt(roman){
  if (!roman) return NaN;
  const s = String(roman).toUpperCase();
  const map = {I:1, V:5, X:10, L:50, C:100, D:500, M:1000};
  let total = 0;
  for (let i=0; i<s.length; i++){
    const v = map[s[i]] || 0;
    const next = map[s[i+1]] || 0;
    total += (v < next) ? -v : v;
  }
  return total;
}

function normalizeRankCode(raw){
  let t = (raw || "").toString().trim();
  if (!t) return "";

  const uMap = {"Ⅰ":"I","Ⅱ":"II","Ⅲ":"III","Ⅳ":"IV","Ⅴ":"V","Ⅵ":"VI","Ⅶ":"VII","Ⅷ":"VIII","Ⅸ":"IX","Ⅹ":"X"};
  t = t.replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/g, ch => uMap[ch] || ch);
  t = t.replace(/\s+/g, ""); // 공백 제거

  // 한글 접두어 지원
  if (t.startsWith("스타")) t = "STAR" + t.slice(2);
  if (t.startsWith("프로")) t = "PRO" + t.slice(2);

  const u = t.toUpperCase();

  if (u === "MEMBER" || u === "MEM" || u === "정회원" || u === "회원" || u === "일반") return "Member";
  if (u === "-" || u === "NONE") return "";

  function suffixNum(s){
    s = (s || "").replace(/^[-_]+/, "");
    if (!s) return "";
    if (/^\d+$/.test(s)) return String(parseInt(s, 10));
    const n = romanToInt(s);
    if (Number.isFinite(n) && n > 0) return String(n);
    return s;
  }

  if (u.startsWith("STAR")) return "Star" + suffixNum(u.slice(4));
  if (u.startsWith("PRO"))  return "Pro"  + suffixNum(u.slice(3));

  // 이미 Star1/Pro2 형태면 유지
  if (/^Star\d+$/i.test(t)) return "Star" + t.replace(/^\D+/, "");
  if (/^Pro\d+$/i.test(t))  return "Pro" + t.replace(/^\D+/, "");

  return t;
}

function getRankCode(rec){
  return normalizeRankCode(rec.rank || rec.rankCode || rec.level || rec.title || "");
}

    function pickMyRankRecord(list, id, name, team, joinedAt){
  const myId = String(id || "").toLowerCase().trim();
  if (myId){
    const byId = list.filter(m => String(m.id || "").toLowerCase().trim() === myId);
    if (byId.length) return byId[0];
  }

  let byName = list.filter(m => getName(m) === name);
  if (!byName.length) return null;
  if (byName.length === 1) return byName[0];

  let candidates = byName;
  if (team){
    const byTeam = byName.filter(m => getTeam(m) === team);
    if (byTeam.length === 1) return byTeam[0];
    if (byTeam.length > 1) candidates = byTeam;
  }
  if (joinedAt){
    const joined = String(joinedAt).trim();
    const byJoin = candidates.filter(m => getJoin(m) === joined);
    if (byJoin.length === 1) return byJoin[0];
    if (byJoin.length > 1) candidates = byJoin;
  }
  return candidates[0];
}
