<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – 프로모션 & 금고</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* 메인 배경 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000;
      display: flex;
      align-items: flex-start; /* 위에서부터 열리도록 */
      justify-content: center;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-wrap {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      width: 100%;
      margin: 40px auto 40px;
      padding: 24px 16px 32px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .card {
      background: rgba(15,23,42,0.96);
      border-radius: 24px;
      border: 1px solid rgba(245,158,11,0.95);
      box-shadow:
        0 0 24px rgba(245,158,11,0.55),
        0 30px 80px rgba(0,0,0,0.9);
      padding: 18px 20px 20px;
    }

    /* PC에서 카드 축소 */
    @media (min-width: 1024px) {
      .card {
        transform: scale(0.7);
        transform-origin: top center;
      }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 12px;
      border-radius: 18px;
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.35);
      box-shadow:
        0 8px 18px rgba(0,0,0,0.9),
        0 0 0 1px rgba(15,23,42,0.9) inset;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .btn-close {
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(2,6,23,0.55);
      color: #f9fafb;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-close:hover { filter: brightness(1.05); }

    /* 탭 */
    .tab-bar {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(2,6,23,0.45);
      border: 1px solid rgba(148,163,184,0.35);
    }

    .tab {
      flex: 1;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.55);
      color: #e5e7eb;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .tab.is-active {
      border-color: rgba(245,158,11,0.95);
      box-shadow: 0 0 18px rgba(245,158,11,0.35);
      background: rgba(245,158,11,0.12);
      color: #fff;
    }

    .section { margin-top: 14px; }
    .hidden { display: none; }

    /* 프로모션 */
    .promo-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 0;
    }

    .promo-item {
      background: rgba(15,23,42,0.98);
      border-radius: 16px;
      padding: 12px 12px 14px;
      border: 1px solid rgba(148,163,184,0.85);
      box-shadow: 0 12px 28px rgba(0,0,0,0.9);
    }

    .promo-caption {
      font-size: 12px;
      color: #E5E7EB;
      margin-bottom: 8px;
    }

    .promo-img-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
    }

    .promo-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* 금고 */
    .vault-top {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 900px) {
      .vault-top { grid-template-columns: 1fr 1fr; }
    }

    .vault-card {
      background: rgba(15,23,42,0.98);
      border-radius: 16px;
      padding: 14px 14px 14px;
      border: 1px solid rgba(148,163,184,0.75);
      box-shadow: 0 12px 28px rgba(0,0,0,0.9);
    }

    .vault-label {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .vault-value {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .vault-sub {
      margin-top: 8px;
      font-size: 11px;
      color: #9CA3AF;
    }

    .progress {
      margin-top: 10px;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(148,163,184,0.18);
      border: 1px solid rgba(148,163,184,0.25);
    }

    .bar {
      height: 100%;
      width: 0%;
      background: rgba(245,158,11,0.85);
    }

    .vault-section-title {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 900;
      color: #e5e7eb;
    }

    .vault-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 900px) {
      .vault-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    .vault-item {
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 14px;
      padding: 12px;
    }

    .vault-item .k {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .vault-item .v {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }

    .ledger-wrap {
      margin-top: 10px;
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 14px;
      overflow: hidden;
    }

    table.ledger {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .ledger th, .ledger td {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(148,163,184,0.25);
      text-align: left;
      vertical-align: top;
    }

    .ledger th {
      background: rgba(15,23,42,0.65);
      color: #e5e7eb;
      font-weight: 900;
    }

    .ledger td { color: #e5e7eb; }
    .ledger tr:last-child td { border-bottom: none; }
    .right { text-align: right; }

    .vault-note {
      margin-top: 12px;
      font-size: 12px;
      color: #cbd5e1;
      opacity: 0.95;
    }

    .meta {
      margin-top: 10px;
      font-size: 11px;
      color: #9CA3AF;
      text-align: right;
    }

    @media (max-width: 768px) {
      .page-wrap { margin: 16px auto 24px; }
      .card { padding: 16px 14px 18px; transform: none; }
      .title { font-size: 20px; }
      .vault-value { font-size: 20px; }
    }
  </style>
</head>

<body>
  <!-- 배경 이미지 -->
  <div class="scene">
    <img src="img/bg-unique-main.jpg" class="scene-bg" alt="Background" />
  </div>

  <div class="page-wrap">
    <div class="card">
      <div class="top-bar">
        <div>
          <div class="title">프로모션 & 금고</div>
          <div class="subtitle">진행 중 프로모션 / 공동기금(금고) 현황</div>
        </div>
        <button class="btn-close" onclick="closePage()">창 닫기 ✕</button>
      </div>

      <div class="tab-bar" role="tablist" aria-label="프로모션과 금고 탭">
        <button class="tab is-active" id="tab-promo" role="tab" aria-selected="true" onclick="showTab('promo')">프로모션</button>
        <button class="tab" id="tab-vault" role="tab" aria-selected="false" onclick="showTab('vault')">금고</button>
      </div>

      <!-- 프로모션 -->
      <section id="section-promo" class="section" role="tabpanel" aria-labelledby="tab-promo">
        <div id="promo-grid" class="promo-grid"></div>
      </section>

      <!-- 금고 -->
      <section id="section-vault" class="section hidden" role="tabpanel" aria-labelledby="tab-vault">
        <div class="vault-top">
          <div class="vault-card">
            <div class="vault-label">공동기금 잔액</div>
            <div class="vault-value" id="vault-total">-</div>
            <div class="vault-sub" id="vault-updated">-</div>
          </div>

          <div class="vault-card">
            <div class="vault-label">이번 달 목표</div>
            <div class="vault-value" id="vault-goal">-</div>
            <div class="progress"><div class="bar" id="vault-bar"></div></div>
            <div class="vault-sub" id="vault-progress">-</div>
          </div>
        </div>

        <div class="vault-section-title">구성</div>
        <div id="vault-breakdown" class="vault-grid"></div>

        <div class="vault-section-title">최근 내역</div>
        <div class="ledger-wrap">
          <table class="ledger" aria-label="공동기금 최근 내역">
            <thead>
              <tr>
                <th style="width:110px;">날짜</th>
                <th style="width:70px;">구분</th>
                <th class="right" style="width:120px;">금액</th>
                <th>메모</th>
              </tr>
            </thead>
            <tbody id="vault-ledger"></tbody>
          </table>
        </div>

        <div class="vault-note">
          ※ 공동기금 숫자는 이 파일 하단의 <b>VAULT</b> 값만 수정하면 자동 반영됩니다.
        </div>
      </section>

      <div class="meta">The Unique · so.t 멤버용 프로모션 & 금고</div>
    </div>
  </div>

  <script>
    function closePage() {
      // 창 닫기가 안 먹히는 경우(일반 탭) 대비: 뒤로가기 fallback
      window.close();
      setTimeout(() => {
        try { history.back(); } catch (e) {}
      }, 120);
    }

    // ✅ 프로모션 이미지 목록
    const PROMOS = [
      {
        id: "sot-pro2-pro6",
        title: "so.t 직급 로드맵 – Pro2 ~ Pro6",
        image: "img/promo/sot-promo-pro2-pro6.jpg"
      }
    ];

    // ✅ 금고(공동기금) 데이터: 여기 숫자만 바꾸면 화면이 바뀜
    const VAULT = {
      currency: "USDT",
      total: 0,                 // <-- 공동기금 잔액
      goal: 0,                  // <-- 이번 달 목표 (없으면 0)
      updated: "2025-12-19",     // <-- 마지막 업데이트 날짜

      breakdown: [
        { label: "이번 달 적립", value: 0 },
        { label: "이번 달 사용", value: 0 },
        { label: "예비/대기", value: 0 }
      ],

      ledger: [
        // 예시:
        // { date: "2025-12-19", type: "입금", amount: 200, memo: "12월 공동기금 적립" },
      ]
    };

    const nf = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 2 });
    const fmt = (n) => (typeof n === "number" && isFinite(n)) ? nf.format(n) : "-";

    function renderPromos() {
      const grid = document.getElementById("promo-grid");
      grid.innerHTML = "";

      if (!Array.isArray(PROMOS) || PROMOS.length === 0) {
        const empty = document.createElement("div");
        empty.textContent = "등록된 프로모션이 없습니다.";
        empty.style.fontSize = "13px";
        empty.style.color = "#E5E7EB";
        grid.appendChild(empty);
        return;
      }

      PROMOS.forEach((p) => {
        const item = document.createElement("div");
        item.className = "promo-item";

        if (p.title) {
          const cap = document.createElement("div");
          cap.className = "promo-caption";
          cap.textContent = p.title;
          item.appendChild(cap);
        }

        const wrap = document.createElement("div");
        wrap.className = "promo-img-wrap";

        const img = document.createElement("img");
        img.src = p.image;
        img.alt = p.title || "프로모션 이미지";

        wrap.appendChild(img);
        item.appendChild(wrap);
        grid.appendChild(item);
      });
    }

    function renderVault() {
      // 상단 요약
      document.getElementById("vault-total").textContent =
        `${fmt(VAULT.total)} ${VAULT.currency}`;

      document.getElementById("vault-updated").textContent =
        `마지막 업데이트: ${VAULT.updated || "-"}`;

      document.getElementById("vault-goal").textContent =
        VAULT.goal > 0 ? `${fmt(VAULT.goal)} ${VAULT.currency}` : `-`;

      let ratio = 0;
      if (VAULT.goal > 0) ratio = Math.max(0, Math.min(1, VAULT.total / VAULT.goal));
      const pct = VAULT.goal > 0 ? Math.round(ratio * 1000) / 10 : null;

      document.getElementById("vault-bar").style.width =
        VAULT.goal > 0 ? `${pct}%` : "0%";

      document.getElementById("vault-progress").textContent =
        VAULT.goal > 0 ? `진행률: ${pct}%` : `진행률: -`;

      // breakdown
      const bd = document.getElementById("vault-breakdown");
      bd.innerHTML = "";
      (VAULT.breakdown || []).forEach((b) => {
        const div = document.createElement("div");
        div.className = "vault-item";
        div.innerHTML = `
          <div class="k">${b.label || "-"}</div>
          <div class="v">${fmt(b.value)} ${VAULT.currency}</div>
        `;
        bd.appendChild(div);
      });

      // ledger
      const tbody = document.getElementById("vault-ledger");
      tbody.innerHTML = "";
      const rows = Array.isArray(VAULT.ledger) ? VAULT.ledger : [];

      if (rows.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="4" style="color:#9CA3AF;">등록된 내역이 없습니다.</td>`;
        tbody.appendChild(tr);
      } else {
        rows.forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.date || "-"}</td>
            <td>${r.type || "-"}</td>
            <td class="right">${fmt(r.amount)} ${VAULT.currency}</td>
            <td>${r.memo || "-"}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    function setTabActive(promoActive) {
      const tabPromo = document.getElementById("tab-promo");
      const tabVault = document.getElementById("tab-vault");
      const secPromo = document.getElementById("section-promo");
      const secVault = document.getElementById("section-vault");

      tabPromo.classList.toggle("is-active", promoActive);
      tabVault.classList.toggle("is-active", !promoActive);
      tabPromo.setAttribute("aria-selected", promoActive ? "true" : "false");
      tabVault.setAttribute("aria-selected", promoActive ? "false" : "true");

      secPromo.classList.toggle("hidden", !promoActive);
      secVault.classList.toggle("hidden", promoActive);
    }

    function showTab(which, opts = { pushHash: true }) {
      const promoActive = (which !== "vault");
      setTabActive(promoActive);

      if (opts.pushHash) {
        if (!promoActive) {
          location.hash = "vault";
        } else {
          history.replaceState(null, "", location.pathname + location.search);
        }
      }
    }

    // 초기 렌더
    document.addEventListener("DOMContentLoaded", () => {
      renderPromos();
      renderVault();

      const hash = (location.hash || "").replace("#", "");
      if (hash === "vault") showTab("vault", { pushHash: false });
      else showTab("promo", { pushHash: false });
    });

    // 해시로 탭 전환 지원
    window.addEventListener("hashchange", () => {
      const hash = (location.hash || "").replace("#", "");
      if (hash === "vault") showTab("vault", { pushHash: false });
      else showTab("promo", { pushHash: false });
    });
  </script>
</body>
</html>
