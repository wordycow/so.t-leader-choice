<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE TREASURE BOX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* --- 기본 스타일 --- */
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }
    :root{ --gold: #fbbf24; --panel-light: #1e293b; --text-main: #f9fafb; --text-sub: #94a3b8; }
    body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; color: var(--text-main); background: #000; display:flex; justify-content:center; align-items:flex-start; }
    
    .scene{ position:fixed; inset:0; overflow:hidden; z-index:-1; }
    .scene-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity: 0.6; }
    
    .page-wrap{ position:relative; z-index:10; max-width:700px; width:100%; margin:40px auto; padding:20px; }
    
    .card{ background: rgba(15, 23, 42, 0.95); border-radius: 24px; border: 1px solid var(--gold); box-shadow: 0 0 30px rgba(251, 191, 36, 0.15); padding: 30px 24px; }
    
    /* 상단 바 */
    .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
    .title{ font-size:22px; font-weight:700; color: #fff; font-family: "Cinzel", serif; letter-spacing: 0.05em; }
    .user-info { font-size: 13px; color: var(--gold); font-weight: 600; margin-top: 4px; }
    .btn-close{ background: var(--panel-light); border: 1px solid var(--text-sub); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }

    /* 탭 메뉴 */
    .tab-menu { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .tab-btn { flex: 1; padding: 12px; background: var(--panel-light); border: 1px solid rgba(255,255,255,0.1); color: var(--text-sub); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s; }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    
    .section { display: none; animation: fadeIn 0.3s; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

    /* 박스 스타일 */
    .info-box { background: var(--panel-light); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; position: relative; }
    .gold-box { border-color: var(--gold); background: rgba(251, 191, 36, 0.05); }
    
    .label { font-size: 12px; color: var(--text-sub); font-weight: 700; margin-bottom: 8px; display: block; }
    .value { font-size: 28px; font-weight: 900; color: #fff; }
    .sub-text { font-size: 11px; color: var(--text-sub); margin-top: 4px; }
    
    .btn-copy { position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fbbf24; padding:6px 12px; border-radius:8px; font-size:11px; cursor:pointer; }

    /* 잔액 표시 (NEW) */
    .balance-badge { position:absolute; top:20px; right:20px; background: rgba(251, 191, 36, 0.2); color: #fbbf24; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--gold); }

    /* 입력 폼 */
    .input-group { margin-bottom: 12px; }
    .input-field { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 13px; }
    .input-field:focus { border-color: var(--gold); outline: none; }
    
    .action-btn { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; transition: transform 0.1s; }
    .action-btn:active { transform: scale(0.98); }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }

    /* 랭킹 리스트 */
    .ranking-list { margin-top:10px; max-height: 200px; overflow-y: auto; }
    .rank-item { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; }
    .rank-badge { display:inline-flex; width:20px; height:20px; align-items:center; justify-content:center; font-weight:bold; margin-right:8px; border-radius: 50%; font-size: 11px; background: #334155; color: #fff; }
    .rank-1 { background: #FFD700; color: #000; } .rank-2 { background: #C0C0C0; color: #000; } .rank-3 { background: #CD7F32; color: #000; }

    @media (max-width: 480px) { .page-wrap { padding: 15px; margin-top: 20px; } .title { font-size: 18px; } }
  </style>
</head>

<body>

  <div class="scene">
    <img src="img/bg-unique-promo.jpg" class="scene-bg" alt="Background" onerror="this.style.display='none'" />
  </div>

  <div class="page-wrap">
    <div class="card">
      
      <div class="top-bar">
        <div>
          <div class="title">THE UNIQUE TREASURE BOX</div>
          <div class="user-info" id="user-display">User</div>
        </div>
        <button class="btn-close" onclick="window.close()">닫기 ✕</button>
      </div>

      <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('home')">🏠 홈 & 기금</button>
        <button class="tab-btn" onclick="switchTab('loan')">🏦 대출 (Loan)</button>
        <button class="tab-btn" onclick="switchTab('settle')">💸 정산 신청</button>
      </div>

      <div id="tab-home" class="section active">
        <div class="info-box">
          <button class="btn-copy" onclick="copyVaultAddress()">주소 복사</button>
          <div class="label">공동기금 (REAL USDT)</div>
          <div class="value" id="vault-balance-num">Loading...</div>
          <div class="sub-text">TRC20 Network</div>
        </div>

        <div class="info-box gold-box">
          <div class="label" style="color:#fbbf24; margin-bottom:12px;">🏆 기금 후원하기 (명예의 전당 등록)</div>
          <div class="input-group">
            <input id="donate-name" class="input-field" placeholder="후원자 성함 (랭킹 표시용)" />
          </div>
          <div class="input-group">
            <input id="donate-txid" class="input-field" placeholder="TXID (이체 확인증)" />
          </div>
          <button class="action-btn btn-gold" onclick="submitDonation()">후원 내역 제출</button>
        </div>

        <div class="info-box">
          <div class="label">💖 명예의 전당 (Top Donors)</div>
          <div id="donation-ranking" class="ranking-list">
             <div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">데이터 로딩 중...</div>
          </div>
        </div>
      </div>

      <div id="tab-loan" class="section">
        <div class="info-box gold-box">
          <div class="label" style="font-size:15px; color:#fbbf24;">💰 USDT 비즈니스 론</div>
          <p style="font-size:11px; color:#cbd5e1; margin-bottom:15px; line-height:1.5;">
            고직급자 전용 사업자금 융통 상품입니다.<br>
            - 상환 기한: 14일 이내 (수수료 +10 USDT)<br>
            <span style="color:#f87171;">※ TRC20 지갑 주소 필수</span>
          </p>
          
          <div class="input-group">
            <input id="usdt-loan-amount" type="number" class="input-field" placeholder="신청 금액 (USDT)" />
          </div>
          <div class="input-group">
            <input id="usdt-loan-address" type="text" class="input-field" placeholder="받으실 지갑 주소 (TRC20)" />
          </div>
          <div class="input-group">
            <input id="usdt-loan-reason" type="text" class="input-field" placeholder="사용 목적 및 직급" />
          </div>
          <button class="action-btn btn-danger" onclick="requestUsdtLoan()">USDT 대출 심사 신청</button>
        </div>
      </div>

      <div id="tab-settle" class="section">
        <div class="info-box gold-box">
          
          <div class="balance-badge">현재 보유: <span id="my-balance-display">0</span> UT</div>

          <div class="label" style="color:#fbbf24;">💸 정산 신청 (Exchange)</div>
          <p style="font-size:11px; color:#cbd5e1; margin-bottom:15px;">
            보유한 UT를 현금 또는 USDT로 정산 신청합니다.<br>
            (최소 10 UT 이상, <b>소수점 불가</b>)
          </p>
          
          <div class="input-group">
            <input id="ex-amount" type="number" step="1" class="input-field" placeholder="신청 수량 (정수만 입력)" oninput="this.value = this.value.replace(/[^0-9]/g, '');" />
          </div>
          
          <div class="input-group">
            <input id="ex-address" type="text" class="input-field" placeholder="받으실 USDT 주소 (TRC20)" />
          </div>

          <button class="action-btn btn-gold" onclick="requestExchange()">정산 신청하기 (즉시차감)</button>
        </div>
      </div>

    </div>
  </div>

<script>
  // [Supabase 설정]
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let myUsername = "";
  let myCurrentBalance = 0;
  const VAULT_TRON_ADDRESS = "TLb5D3uDQjPQt6CzATM21t21etxGsSvtbt";
  const WORKER_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";

  // 1. 초기화 (자동 로그인)
  document.addEventListener('DOMContentLoaded', async () => {
    const rawUser = localStorage.getItem('uniqueCurrentUser');
    if (!rawUser) {
        alert("로그인 정보가 없습니다. 메인 화면에서 접속해주세요.");
        window.close();
        return;
    }
    
    try {
        const userObj = JSON.parse(rawUser);
        myUsername = userObj.id || userObj.name || "Unknown";
        document.getElementById("user-display").textContent = `[${myUsername}]`;
        document.getElementById("donate-name").value = myUsername; 
        
        fetchVault();
        fetchRanking();
        fetchMyBalance(); // 잔액 불러오기
    } catch(e) {
        console.error(e);
    }
  });

  // 2. 탭 전환
  function switchTab(tabName) {
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    event.target.classList.add('active');
    
    if (tabName === 'settle') {
      fetchMyBalance(); // 정산 탭 열 때 잔액 갱신
    }
  }

  // 3. 잔액 조회 (Main 페이지와 동기화)
  async function fetchMyBalance() {
    // 1차: 로컬 스토리지 값으로 즉시 표시
    const localBal = localStorage.getItem('myUtPoints');
    if(localBal) {
      myCurrentBalance = parseFloat(localBal);
      document.getElementById('my-balance-display').textContent = Math.floor(myCurrentBalance).toLocaleString();
    }

    // 2차: DB에서 정확한 값 가져오기
    const { data: profile } = await db.from('profiles').select('balance').eq('username', myUsername).single();
    if (profile) {
      myCurrentBalance = profile.balance;
      document.getElementById('my-balance-display').textContent = Math.floor(myCurrentBalance).toLocaleString();
      // 로컬 스토리지도 업데이트 (메인 페이지 싱크를 위해)
      localStorage.setItem('myUtPoints', myCurrentBalance);
    }
  }

  // 4. 공동기금 잔액 조회
  async function fetchVault(){
    const api = WORKER_BASE + `/vault?address=${encodeURIComponent(VAULT_TRON_ADDRESS)}`;
    try {
      const res = await fetch(api); const data = await res.json();
      if(data.ok) {
        document.getElementById("vault-balance-num").textContent = parseFloat(String(data.balance).replace(/,/g,"")).toLocaleString() + " USDT";
      }
    } catch(e){
        document.getElementById("vault-balance-num").textContent = "Error";
    }
  }

  // 5. 주소 복사
  function copyVaultAddress(){ 
      navigator.clipboard.writeText(VAULT_TRON_ADDRESS).then(()=>alert("기금 지갑 주소가 복사되었습니다.")).catch(()=>{}); 
  }

  // 6. 후원 제출
  async function submitDonation() {
    const name = document.getElementById("donate-name").value.trim();
    const txid = document.getElementById("donate-txid").value.trim();

    if(!name || !txid) return alert("이름과 TXID를 모두 입력해주세요.");

    const { data: existing } = await db.from('transactions').select('txid').eq('txid', txid).single();
    if (existing) return alert("이미 제출된 TXID입니다.");

    let amount = 100; 
    if(txid.startsWith("c9f6")) amount = 360;
    if(txid.startsWith("eece")) amount = 350;

    await db.from('transactions').insert([{
      username: myUsername,
      donor_name: name,
      type: 'donation_verify',
      amount: amount,
      description: `[후원] ${name} / ${amount} USDT`,
      txid: txid
    }]);

    const { data: profile } = await db.from('profiles').select('donation_total').eq('username', myUsername).single();
    const current = profile ? (profile.donation_total || 0) : 0;
    await db.from('profiles').update({ donation_total: current + amount }).eq('username', myUsername);

    alert(`감사합니다! 후원 내역이 접수되었습니다.`);
    document.getElementById("donate-txid").value = "";
    fetchRanking();
  }

  // 7. 랭킹 불러오기
  async function fetchRanking() {
    const container = document.getElementById("donation-ranking");
    const { data: list } = await db.from('transactions')
      .select('donor_name, amount, created_at')
      .eq('type', 'donation_verify')
      .order('amount', {ascending:false})
      .limit(10);

    if (!list || list.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">아직 후원 내역이 없습니다.</div>';
      return;
    }

    container.innerHTML = list.map((item, idx) => {
      let badge = `<span class="rank-badge">${idx+1}</span>`;
      if(idx===0) badge = `<span class="rank-badge rank-1">${idx+1}</span>`;
      if(idx===1) badge = `<span class="rank-badge rank-2">${idx+1}</span>`;
      if(idx===2) badge = `<span class="rank-badge rank-3">${idx+1}</span>`;
      
      return `
        <div class="rank-item">
          <div style="display:flex; align-items:center;">
            ${badge}
            <span style="font-weight:bold; color:#fff;">${item.donor_name}</span>
          </div>
          <div style="color:#fbbf24; font-weight:bold;">${item.amount.toLocaleString()} USDT</div>
        </div>
      `;
    }).join('');
  }

  // 8. 대출 신청
  async function requestUsdtLoan() {
    const amt = document.getElementById("usdt-loan-amount").value;
    const addr = document.getElementById("usdt-loan-address").value;
    const reason = document.getElementById("usdt-loan-reason").value;
    
    if(!amt || !addr || !reason) return alert("모든 항목을 입력해주세요.");
    
    await db.from('transactions').insert([{
        username: myUsername,
        type: 'out',
        amount: parseFloat(amt),
        description: `[대출신청] ${amt} USDT / ${reason}`
    }]);
    
    alert("대출 심사가 접수되었습니다.");
    document.getElementById("usdt-loan-amount").value = "";
    document.getElementById("usdt-loan-reason").value = "";
  }

  // 9. [수정] 정산 신청 (정수 제한, 주소 필수)
  async function requestExchange() {
    const amtInput = document.getElementById("ex-amount").value;
    const addrInput = document.getElementById("ex-address").value.trim();

    // 1. 주소 확인
    if(!addrInput) {
      return alert("정산받으실 USDT 지갑 주소를 입력해주세요.");
    }
    
    // 2. 정수 확인
    if(amtInput.includes('.')) {
        return alert("정산은 소수점 단위로 할 수 없습니다.\n정수로 입력해주세요.");
    }
    const amt = parseInt(amtInput, 10);

    // 3. 최소 수량 및 잔액 확인
    if(!amt || amt < 10) return alert("최소 10 UT 이상 신청 가능합니다.");
    if(amt > myCurrentBalance) return alert("보유 잔액이 부족합니다.");

    if(confirm(`${amt} UT를 정산 신청하시겠습니까?\n(즉시 차감됩니다)`)) {
        // 잔액 차감 업데이트
        await db.from('profiles').update({ balance: myCurrentBalance - amt }).eq('username', myUsername);
        
        // 내역 기록 (주소 포함)
        await db.from('transactions').insert([{
            username: myUsername,
            type: 'out',
            amount: amt,
            description: `[정산신청] ${amt} UT / 주소: ${addrInput}`
        }]);
        
        alert("정산 신청이 완료되었습니다.\n관리자 확인 후 입금됩니다.");
        document.getElementById("ex-amount").value = "";
        
        // UI 갱신
        fetchMyBalance();
    }
  }
</script>
</body>
</html>
