<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – 프로모션 & 금고</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .scene { position: fixed; inset: 0; overflow: hidden; z-index: -1; }
    .scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .page-wrap {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      width: 100%;
      margin: 40px auto;
      padding: 24px 16px 32px;
    }

    .card {
      background: rgba(15,23,42,0.96);
      border-radius: 24px;
      border: 1px solid rgba(245,158,11,0.95);
      box-shadow: 0 0 24px rgba(245,158,11,0.55), 0 30px 80px rgba(0,0,0,0.9);
      padding: 18px 20px 20px;
    }

    @media (min-width: 1024px) {
      .card { transform: scale(0.7); transform-origin: top center; }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 12px;
      border-radius: 18px;
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.35);
      box-shadow: 0 8px 18px rgba(0,0,0,0.9), 0 0 0 1px rgba(15,23,42,0.9) inset;
    }

    .title { font-size: 24px; font-weight: 800; line-height: 1.15; }
    .subtitle { margin-top: 6px; font-size: 13px; color: #cbd5e1; line-height: 1.35; }

    .btn-close {
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(2,6,23,0.55);
      color: #f9fafb;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-close:hover { filter: brightness(1.05); }

    .tab-bar {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(2,6,23,0.45);
      border: 1px solid rgba(148,163,184,0.35);
    }
    .tab {
      flex: 1;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.55);
      color: #e5e7eb;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
    }
    .tab.is-active {
      border-color: rgba(245,158,11,0.95);
      box-shadow: 0 0 18px rgba(245,158,11,0.35);
      background: rgba(245,158,11,0.12);
      color: #fff;
    }

    .section { margin-top: 14px; }
    .hidden { display: none; }

    /* 프로모션 */
    .promo-grid { display: flex; flex-direction: column; gap: 16px; }
    .promo-item {
      background: rgba(15,23,42,0.98);
      border-radius: 16px;
      padding: 12px 12px 14px;
      border: 1px solid rgba(148,163,184,0.85);
      box-shadow: 0 12px 28px rgba(0,0,0,0.9);
    }
    .promo-caption { font-size: 12px; color: #E5E7EB; margin-bottom: 8px; }
    .promo-img-wrap { width: 100%; border-radius: 12px; overflow: hidden; background: #020617; }
    .promo-img-wrap img { width: 100%; height: auto; display: block; object-fit: contain; }

    /* 금고 */
    .vault-card {
      background: rgba(15,23,42,0.98);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(148,163,184,0.75);
      box-shadow: 0 12px 28px rgba(0,0,0,0.9);
    }
    .vault-label { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; font-weight: 700; }
    .vault-value { font-size: 28px; font-weight: 900; }
    .vault-sub { margin-top: 10px; font-size: 12px; color: #9CA3AF; line-height: 1.4; }

    .vault-actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mini-btn {
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(2,6,23,0.55);
      color: #f9fafb;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }
    .mini-btn:hover { filter: brightness(1.06); }

    .mini-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(2,6,23,0.35);
      color: #e5e7eb;
      text-decoration: none;
      font-weight: 800;
      font-size: 12px;
    }
    .mini-link:hover { filter: brightness(1.06); }

    .vault-error {
      margin-top: 10px;
      font-size: 12px;
      color: #fecaca;
      background: rgba(127,29,29,0.25);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 12px;
      padding: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .meta { margin-top: 10px; font-size: 11px; color: #9CA3AF; text-align: right; }

    @media (max-width: 768px) {
      .page-wrap { margin: 16px auto 24px; }
      .card { padding: 16px 14px 18px; transform: none; }
      .title { font-size: 20px; }
      .vault-value { font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-main.jpg" class="scene-bg" alt="Promotion background" />
  </div>

  <div class="page-wrap">
    <div class="card">
      <div class="top-bar">
        <div>
          <div class="title">프로모션 & 금고</div>
          <div class="subtitle">진행 중 프로모션 / 공동기금(USDT) 잔액 투명 공개</div>
        </div>
        <button class="btn-close" onclick="closePage()">창 닫기 ✕</button>
      </div>

      <div class="tab-bar" role="tablist" aria-label="프로모션과 금고 탭">
        <button class="tab is-active" id="tab-promo" role="tab" aria-selected="true" onclick="showTab('promo')">프로모션</button>
        <button class="tab" id="tab-vault" role="tab" aria-selected="false" onclick="showTab('vault')">금고</button>
      </div>

      <!-- 프로모션 -->
      <section id="section-promo" class="section" role="tabpanel" aria-labelledby="tab-promo">
        <div id="promo-grid" class="promo-grid"></div>
      </section>

      <!-- 금고 -->
      <section id="section-vault" class="section hidden" role="tabpanel" aria-labelledby="tab-vault">
        <div class="vault-card">
          <div class="vault-label">공동기금 잔액 (USDT · TRC20)</div>
          <div class="vault-value" id="vault-balance">금고 탭을 눌러 조회</div>

          <div class="vault-sub">
            조회 주소: <span id="vault-address">-</span>
          </div>

          <div class="vault-actions">
            <button class="mini-btn" onclick="copyVaultAddress()">주소 복사</button>
            <a class="mini-link" id="vault-link-address" href="#" target="_blank" rel="noopener">TRONSCAN에서 주소 보기</a>
            <a class="mini-link" id="vault-link-usdt" href="#" target="_blank" rel="noopener">USDT 컨트랙트 보기</a>
            <button class="mini-btn" onclick="refreshVault()">새로고침</button>
            <button class="mini-btn" onclick="setApiKey()">API Key 설정(선택)</button>
          </div>

          <div class="vault-sub" id="vault-updated">조회시간: -</div>
          <div class="vault-error" id="vault-error"></div>
        </div>
      </section>

      <div class="meta">The Unique · so.t 멤버용 프로모션 & 금고</div>
    </div>
  </div>

  <script>
    function closePage() {
      window.close();
      setTimeout(() => { try { history.back(); } catch (e) {} }, 120);
    }

    function setTabActive(promoActive) {
      const tabPromo = document.getElementById("tab-promo");
      const tabVault = document.getElementById("tab-vault");
      const secPromo = document.getElementById("section-promo");
      const secVault = document.getElementById("section-vault");

      tabPromo.classList.toggle("is-active", promoActive);
      tabVault.classList.toggle("is-active", !promoActive);
      tabPromo.setAttribute("aria-selected", promoActive ? "true" : "false");
      tabVault.setAttribute("aria-selected", promoActive ? "false" : "true");

      secPromo.classList.toggle("hidden", !promoActive);
      secVault.classList.toggle("hidden", promoActive);
    }

    function showTab(which, opts = { pushHash: true }) {
      const promoActive = (which !== "vault");
      setTabActive(promoActive);

      if (opts.pushHash) {
        if (!promoActive) location.hash = "vault";
        else history.replaceState(null, "", location.pathname + location.search);
      }

      // ✅ 금고 탭 눌렀을 때만 조회 (불필요한 호출 줄임)
      if (!promoActive) refreshVault();
    }

    // ✅ 프로모션 이미지 목록
    const PROMOS = [
      { title: "현재 진행 중인 so.t 프로모션 안내", image: "img/promo/sot-promo-pro2-pro6.jpg" }
    ];

    function renderPromos() {
      const grid = document.getElementById("promo-grid");
      grid.innerHTML = "";

      if (!Array.isArray(PROMOS) || PROMOS.length === 0) {
        const empty = document.createElement("div");
        empty.textContent = "등록된 프로모션이 없습니다.";
        empty.style.fontSize = "13px";
        empty.style.color = "#E5E7EB";
        grid.appendChild(empty);
        return;
      }

      PROMOS.forEach((p) => {
        const item = document.createElement("div");
        item.className = "promo-item";

        if (p.title) {
          const cap = document.createElement("div");
          cap.className = "promo-caption";
          cap.textContent = p.title;
          item.appendChild(cap);
        }

        const wrap = document.createElement("div");
        wrap.className = "promo-img-wrap";

        const img = document.createElement("img");
        img.src = p.image;
        img.alt = p.title || "프로모션 이미지";

        wrap.appendChild(img);
        item.appendChild(wrap);
        grid.appendChild(item);
      });
    }

    /* =========================
       금고(USDT 잔액) 설정
       ========================= */

    // ✅ 너가 준 주소 반영 완료
    const VAULT_TRON_ADDRESS = "TLb5D3uDQjPQt6CzATM21t21etxGsSvtbt";

    // ✅ USDT(TRC20) 컨트랙트
    const USDT_TRC20_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

    // ✅ Tronscan API (공식 문서 기반)
    const TOKEN_LIST_ENDPOINTS = [
      "https://apilist.tronscanapi.com/api/account/tokens",
      "https://apilist.tronscan.org/api/account/tokens"
    ];

    // ✅ (선택) API Key: 브라우저 로컬 저장
    const API_KEY_STORAGE = "tronscan_api_key";

    function getApiKey() {
      try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) { return ""; }
    }

    function setApiKey() {
      const current = getApiKey();
      const next = prompt(
        "TRONSCAN API Key를 입력하세요. (헤더: TRON-PRO-API-KEY)\n※ 이 값은 현재 브라우저에만 저장됩니다.",
        current || ""
      );
      if (next === null) return;
      try { localStorage.setItem(API_KEY_STORAGE, next.trim()); } catch (e) {}
      refreshVault();
    }

    function buildTronscanAddressUrl(addr) { return `https://tronscan.org/#/address/${addr}`; }
    function buildTronscanTokenUrl(contract) { return `https://tronscan.org/#/token20/${contract}`; }

    function groupThousands(intStr) {
      const s = intStr.replace(/^0+(?=\d)/, "");
      return s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function formatWithDecimals(balanceStr, decimals) {
      if (!balanceStr) return "0";
      const neg = balanceStr.startsWith("-");
      let s = neg ? balanceStr.slice(1) : balanceStr;
      s = s.replace(/\D/g, "") || "0";

      if (decimals <= 0) return (neg ? "-" : "") + groupThousands(s);

      while (s.length <= decimals) s = "0" + s;

      const intPart = s.slice(0, s.length - decimals) || "0";
      let fracPart = s.slice(s.length - decimals) || "";
      fracPart = fracPart.replace(/0+$/, "");

      const out = fracPart ? `${groupThousands(intPart)}.${fracPart}` : groupThousands(intPart);
      return neg ? "-" + out : out;
    }

    function setVaultError(msg) {
      const el = document.getElementById("vault-error");
      if (!msg) {
        el.style.display = "none";
        el.textContent = "";
        return;
      }
      el.style.display = "block";
      el.textContent = msg;
    }

    async function fetchJsonWithFallback(urls, options) {
      let lastErr = null;
      for (const url of urls) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) {
            const text = await res.text().catch(() => "");
            throw new Error(`HTTP ${res.status} ${res.statusText}\n${text.slice(0, 200)}`);
          }
          return await res.json();
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("요청 실패");
    }

    async function fetchUsdtBalance(address) {
      const params = new URLSearchParams({
        address,
        start: "0",
        limit: "200",
        hidden: "0",
        show: "0"
      });

      const urls = TOKEN_LIST_ENDPOINTS.map(base => `${base}?${params.toString()}`);

      const apiKey = getApiKey();
      const headers = apiKey ? { "TRON-PRO-API-KEY": apiKey } : {}; // 문서/가이드에 나온 헤더명 :contentReference[oaicite:1]{index=1}

      const json = await fetchJsonWithFallback(urls, { method: "GET", headers, cache: "no-store" });
      const list = Array.isArray(json?.data) ? json.data : [];

      let usdt = list.find(t => String(t?.tokenType).toLowerCase() === "trc20" && String(t?.tokenId) === USDT_TRC20_CONTRACT);
      if (!usdt) usdt = list.find(t => String(t?.tokenType).toLowerCase() === "trc20" && String(t?.tokenAbbr).toUpperCase() === "USDT");

      const rawBalance = usdt?.balance ?? "0";
      const decimals = parseInt(usdt?.tokenDecimal ?? "6", 10) || 6;

      return { rawBalance, decimals };
    }

    async function refreshVault() {
      const addr = VAULT_TRON_ADDRESS.trim();
      const balanceEl = document.getElementById("vault-balance");

      setVaultError("");

      document.getElementById("vault-address").textContent = addr;
      document.getElementById("vault-link-address").href = buildTronscanAddressUrl(addr);
      document.getElementById("vault-link-usdt").href = buildTronscanTokenUrl(USDT_TRC20_CONTRACT);

      balanceEl.textContent = "불러오는 중…";

      try {
        const { rawBalance, decimals } = await fetchUsdtBalance(addr);
        const pretty = formatWithDecimals(String(rawBalance), decimals);
        balanceEl.textContent = `${pretty} USDT`;
        document.getElementById("vault-updated").textContent = `조회시간: ${new Date().toLocaleString("ko-KR")}`;
      } catch (e) {
        balanceEl.textContent = "조회 실패";
        setVaultError(
          "Tronscan API가 레이트리밋/차단일 수 있어.\n" +
          "- 새로고침을 너무 자주 누르지 말고\n" +
          "- 필요하면 'API Key 설정(선택)'으로 키를 넣어줘(현재 브라우저에만 저장)\n\n" +
          String(e?.message || e)
        );
      }
    }

    function copyVaultAddress() {
      const addr = VAULT_TRON_ADDRESS.trim();
      if (!addr) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(addr).catch(() => {});
      } else {
        const ta = document.createElement("textarea");
        ta.value = addr;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderPromos();

      const hash = (location.hash || "").replace("#", "");
      if (hash === "vault") showTab("vault", { pushHash: false });
      else showTab("promo", { pushHash: false });
    });

    window.addEventListener("hashchange", () => {
      const hash = (location.hash || "").replace("#", "");
      if (hash === "vault") showTab("vault", { pushHash: false });
      else showTab("promo", { pushHash: false });
    });
  </script>
</body>
</html>
