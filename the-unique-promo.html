<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique 금고</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .scene { position: fixed; inset: 0; overflow: hidden; z-index: -1; }
    .scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .page-wrap { position: relative; z-index: 10; max-width: 1100px; width: 100%; margin: 40px auto; padding: 24px 16px 32px; }
    .card {
      background: rgba(15,23,42,0.96);
      border-radius: 24px;
      border: 1px solid rgba(245,158,11,0.95);
      box-shadow: 0 0 24px rgba(245,158,11,0.55), 0 30px 80px rgba(0,0,0,0.9);
      padding: 18px 20px 20px;
    }
    @media (min-width: 1024px) { .card { transform: scale(0.7); transform-origin: top center; } }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 14px 12px; border-radius: 18px;
      background: rgba(2,6,23,0.55); border: 1px solid rgba(148,163,184,0.35);
      box-shadow: 0 8px 18px rgba(0,0,0,0.9), 0 0 0 1px rgba(15,23,42,0.9) inset;
    }
    .title { font-size: 24px; font-weight: 800; line-height: 1.15; }
    .subtitle { margin-top: 6px; font-size: 13px; color: #cbd5e1; line-height: 1.35; }
    .btn-close {
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(2,6,23,0.55);
      color: #f9fafb;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .tab-bar {
      margin-top: 14px; display: flex; gap: 8px; padding: 8px;
      border-radius: 16px; background: rgba(2,6,23,0.45);
      border: 1px solid rgba(148,163,184,0.35);
    }
    .tab {
      flex: 1; border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.55);
      color: #e5e7eb; padding: 10px 12px;
      border-radius: 12px; cursor: pointer;
      font-weight: 800;
    }
    .tab.is-active {
      border-color: rgba(245,158,11,0.95);
      box-shadow: 0 0 18px rgba(245,158,11,0.35);
      background: rgba(245,158,11,0.12);
      color: #fff;
    }

    .section { margin-top: 14px; }
    .hidden { display: none; }

    /* 프로모션 */
    .promo-grid { display: flex; flex-direction: column; gap: 16px; }
    .promo-item {
      background: rgba(15,23,42,0.98);
      border-radius: 16px;
      padding: 12px 12px 14px;
      border: 1px solid rgba(148,163,184,0.85);
      box-shadow: 0 12px 28px rgba(0,0,0,0.9);
    }
    .promo-caption { font-size: 12px; color: #E5E7EB; margin-bottom: 8px; }
    .promo-img-wrap { width: 100%; border-radius: 12px; overflow: hidden; background: #020617; }
    .promo-img-wrap img { width: 100%; height: auto; display: block; object-fit: contain; }

    /* 금고 */
    .vault-card {
      background: rgba(15,23,42,0.98);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(148,163,184,0.75);
      box-shadow: 0 12px 28px rgba(0,0,0,0.9);
    }
    .vault-label { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; font-weight: 700; }
    .vault-value { font-size: 28px; font-weight: 900; }
    .vault-sub { margin-top: 10px; font-size: 12px; color: #9CA3AF; line-height: 1.4; }

    .vault-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .mini-btn {
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(2,6,23,0.55);
      color: #f9fafb;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }
    .mini-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(2,6,23,0.35);
      color: #e5e7eb; text-decoration: none;
      font-weight: 800; font-size: 12px;
    }

    .vault-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 900px) {
      .vault-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
    .vault-item {
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 14px;
      padding: 12px;
    }
    .vault-item .k { font-size: 12px; color: #cbd5e1; font-weight: 900; margin-bottom: 6px; }
    .vault-item .v { font-size: 16px; font-weight: 900; color: #fff; }

    .ledger-wrap {
      margin-top: 12px;
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 14px;
      overflow: hidden;
    }
    table.ledger { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ledger th, .ledger td {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(148,163,184,0.25);
      text-align: left;
      vertical-align: top;
    }
    .ledger th { background: rgba(15,23,42,0.65); color: #e5e7eb; font-weight: 900; }
    .ledger td { color: #e5e7eb; }
    .ledger tr:last-child td { border-bottom: none; }
    .right { text-align: right; }

    .tag-in { color: #86efac; font-weight: 900; }
    .tag-out { color: #fca5a5; font-weight: 900; }
    .muted { color: #9CA3AF; }

    .vault-error {
      margin-top: 10px;
      font-size: 12px;
      color: #fecaca;
      background: rgba(127,29,29,0.25);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 12px;
      padding: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .meta { margin-top: 10px; font-size: 11px; color: #9CA3AF; text-align: right; }

    @media (max-width: 768px) {
      .page-wrap { margin: 16px auto 24px; }
      .card { padding: 16px 14px 18px; transform: none; }
      .title { font-size: 20px; }
      .vault-value { font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-main.jpg" class="scene-bg" alt="Background" />
  </div>

  <div class="page-wrap">
    <div class="card">
      <div class="top-bar">
        <div>
          <div class="title">프로모션 & 금고</div>
          <div class="subtitle">공동기금(USDT) 잔액 + 입금/출금 + 최근 내역 투명 공개</div>
        </div>
        <button class="btn-close" onclick="closePage()">창 닫기 ✕</button>
      </div>

      <div class="tab-bar" role="tablist">
        <button class="tab is-active" id="tab-promo" role="tab" aria-selected="true" onclick="showTab('promo')">프로모션</button>
        <button class="tab" id="tab-vault" role="tab" aria-selected="false" onclick="showTab('vault')">금고</button>
      </div>

      <!-- 프로모션 -->
      <section id="section-promo" class="section" role="tabpanel" aria-labelledby="tab-promo">
        <div id="promo-grid" class="promo-grid"></div>
      </section>

      <!-- 금고 -->
      <section id="section-vault" class="section hidden" role="tabpanel" aria-labelledby="tab-vault">
        <div class="vault-card">
          <div class="vault-label">공동기금 잔액 (USDT · TRC20)</div>
          <div class="vault-value" id="vault-balance">불러오는 중…</div>

          <div class="vault-sub">
            조회 주소: <span id="vault-address">-</span>
          </div>

          <div class="vault-actions">
            <button class="mini-btn" onclick="copyVaultAddress()">주소 복사</button>
            <a class="mini-link" id="vault-link-address" href="#" target="_blank" rel="noopener">TRONSCAN에서 주소 보기</a>
            <a class="mini-link" id="vault-link-usdt" href="#" target="_blank" rel="noopener">USDT 컨트랙트 보기</a>
            <button class="mini-btn" onclick="refreshVault()">새로고침</button>
          </div>

          <div class="vault-grid">
            <div class="vault-item">
              <div class="k">최근 30일 들어온 돈</div>
              <div class="v" id="vault-in">-</div>
            </div>
            <div class="vault-item">
              <div class="k">최근 30일 나간 돈</div>
              <div class="v" id="vault-out">-</div>
            </div>
            <div class="vault-item">
              <div class="k">최근 30일 순증감</div>
              <div class="v" id="vault-net">-</div>
            </div>
          </div>

          <div class="vault-sub" id="vault-updated">조회시간: -</div>
          <div class="vault-error" id="vault-error"></div>

          <div class="ledger-wrap">
            <table class="ledger" aria-label="USDT 최근 내역">
              <thead>
                <tr>
                  <th style="width:150px;">시간</th>
                  <th style="width:70px;">구분</th>
                  <th class="right" style="width:140px;">금액</th>
                  <th style="width:170px;">상대</th>
                  <th>TX</th>
                </tr>
              </thead>
              <tbody id="vault-ledger"></tbody>
            </table>
          </div>

          <div class="vault-sub muted" style="margin-top:10px;">
            ※ 표는 USDT(TRC20) 기준 “최근 50건”만 표시. 전체는 TRONSCAN 링크에서 확인.
          </div>
        </div>
      </section>

      <div class="meta">The Unique · so.t 멤버용 프로모션 & 금고</div>
    </div>
  </div>

  <script>
    function closePage() { window.close(); setTimeout(() => { try { history.back(); } catch (e) {} }, 120); }

    function setTabActive(promoActive) {
      const tabPromo = document.getElementById("tab-promo");
      const tabVault = document.getElementById("tab-vault");
      const secPromo = document.getElementById("section-promo");
      const secVault = document.getElementById("section-vault");

      tabPromo.classList.toggle("is-active", promoActive);
      tabVault.classList.toggle("is-active", !promoActive);
      tabPromo.setAttribute("aria-selected", promoActive ? "true" : "false");
      tabVault.setAttribute("aria-selected", promoActive ? "false" : "true");

      secPromo.classList.toggle("hidden", !promoActive);
      secVault.classList.toggle("hidden", promoActive);
    }

    function showTab(which, opts = { pushHash: true }) {
      const promoActive = (which !== "vault");
      setTabActive(promoActive);

      if (opts.pushHash) {
        if (!promoActive) location.hash = "vault";
        else history.replaceState(null, "", location.pathname + location.search);
      }

      if (!promoActive) refreshVault();
    }

    // 프로모션 이미지
    const PROMOS = [{ title: "현재 진행 중인 so.t 프로모션 안내", image: "img/promo/sot-promo-pro2-pro6.jpg" }];

    function renderPromos() {
      const grid = document.getElementById("promo-grid");
      grid.innerHTML = "";
      PROMOS.forEach((p) => {
        const item = document.createElement("div");
        item.className = "promo-item";
        const cap = document.createElement("div");
        cap.className = "promo-caption";
        cap.textContent = p.title || "";
        const wrap = document.createElement("div");
        wrap.className = "promo-img-wrap";
        const img = document.createElement("img");
        img.src = p.image;
        img.alt = p.title || "프로모션";
        wrap.appendChild(img);
        item.appendChild(cap);
        item.appendChild(wrap);
        grid.appendChild(item);
      });
    }

    // ===== 금고 설정 =====
    const VAULT_TRON_ADDRESS = "TLb5D3uDQjPQt6CzATM21t21etxGsSvtbt";
    const USDT_TRC20_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const VAULT_PROXY_BASE = "https://the-unique-vault-api.wordycow0001.workers.dev";

    function buildTronscanAddressUrl(addr) { return `https://tronscan.org/#/address/${addr}`; }
    function buildTronscanTokenUrl(contract) { return `https://tronscan.org/#/token20/${contract}`; }
    function buildTronscanTxUrl(txid) { return `https://tronscan.org/#/transaction/${txid}`; }

    function setVaultError(msg) {
      const el = document.getElementById("vault-error");
      if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
      el.style.display = "block";
      el.textContent = msg;
    }

    function shortAddr(a) {
      if (!a) return "-";
      if (a.length <= 12) return a;
      return a.slice(0, 6) + "…" + a.slice(-4);
    }

    function copyVaultAddress() {
      const addr = VAULT_TRON_ADDRESS.trim();
      if (!addr) return;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(addr).catch(() => {});
    }

    function renderLedger(transfers) {
      const tbody = document.getElementById("vault-ledger");
      tbody.innerHTML = "";

      if (!Array.isArray(transfers) || transfers.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="5" class="muted">내역이 없습니다.</td>`;
        tbody.appendChild(tr);
        return;
      }

      transfers.forEach(t => {
        const dt = t.ts ? new Date(t.ts).toLocaleString("ko-KR") : "-";
        const dir = t.direction === "IN" ? `<span class="tag-in">입금</span>` :
                    t.direction === "OUT" ? `<span class="tag-out">출금</span>` : `<span class="muted">-</span>`;

        const counterparty = (t.direction === "IN") ? t.from : (t.direction === "OUT") ? t.to : "-";
        const txLink = t.txid ? `<a class="mini-link" href="${buildTronscanTxUrl(t.txid)}" target="_blank" rel="noopener">보기</a>` : "-";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${dt}</td>
          <td>${dir}</td>
          <td class="right">${t.amount} USDT</td>
          <td title="${counterparty}">${shortAddr(counterparty)}</td>
          <td>${txLink}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function refreshVault() {
      setVaultError("");

      document.getElementById("vault-address").textContent = VAULT_TRON_ADDRESS;
      document.getElementById("vault-link-address").href = buildTronscanAddressUrl(VAULT_TRON_ADDRESS);
      document.getElementById("vault-link-usdt").href = buildTronscanTokenUrl(USDT_TRC20_CONTRACT);

      const balanceEl = document.getElementById("vault-balance");
      balanceEl.textContent = "불러오는 중…";

      if (!VAULT_PROXY_BASE || VAULT_PROXY_BASE.includes("YOUR_WORKER_SUBDOMAIN")) {
        balanceEl.textContent = "설정 필요";
        setVaultError("VAULT_PROXY_BASE에 Cloudflare Worker URL을 넣어줘야 동작합니다.\n예) https://xxx.workers.dev");
        return;
      }

      try {
        const api = `${VAULT_PROXY_BASE.replace(/\/$/, "")}/vault?address=${encodeURIComponent(VAULT_TRON_ADDRESS)}`;
        const res = await fetch(api, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById("vault-balance").textContent = `${data.balance} USDT`;
        document.getElementById("vault-in").textContent = `${data.inflow30d} USDT`;
        document.getElementById("vault-out").textContent = `${data.outflow30d} USDT`;
        document.getElementById("vault-net").textContent = `${data.net30d} USDT`;

        document.getElementById("vault-updated").textContent =
          `조회시간: ${new Date().toLocaleString("ko-KR")}`;

        renderLedger(data.transfers || []);
      } catch (e) {
        balanceEl.textContent = "조회 실패";
        setVaultError(String(e?.message || e));
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderPromos();
      const hash = (location.hash || "").replace("#", "");
      if (hash === "vault") showTab("vault", { pushHash: false });
      else showTab("promo", { pushHash: false });
    });

    window.addEventListener("hashchange", () => {
      const hash = (location.hash || "").replace("#", "");
      if (hash === "vault") showTab("vault", { pushHash: false });
      else showTab("promo", { pushHash: false });
    });
  </script>
</body>
</html>
