<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emei - 살아있는 AI 스트리머</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0e27;
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
    }

    /* JAI 프로필 섹션 */
    .jai-profile-section {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 배경 애니메이션 */
    .jai-profile-section::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* JAI 아바타 컨테이너 */
    .jai-avatar-container {
      position: relative;
      width: 500px;
      height: 500px;
      z-index: 1;
    }

    /* JAI 얼굴 이미지 */
    .jai-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 0 60px rgba(139, 92, 246, 0.4),
        0 0 120px rgba(139, 92, 246, 0.2);
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .jai-face.active {
      opacity: 1;
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* 말할 때 애니메이션 */
    .jai-avatar-container.talking .jai-face {
      animation: talking 0.3s ease-in-out infinite;
    }

    @keyframes talking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* 반짝이는 효과 */
    .jai-avatar-container::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid transparent;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: none;
      opacity: 0;
    }

    .jai-avatar-container.talking::after {
      animation: pulse-ring 1s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      opacity: 1;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      100% {
        transform: scale(1.1);
        box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
      }
    }

    /* JAI 상태 */
    .jai-status {
      margin-top: 40px;
      text-align: center;
      z-index: 1;
    }

    .jai-status h1 {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .jai-status .subtitle {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 12px;
    }

    /* 채팅 섹션 */
    .chat-section {
      background: #1a1d3a;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      height: 100vh;
      overflow: hidden;
    }

    .chat-header {
      padding: 24px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-header h2 {
      font-size: 24px;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: calc(100vh - 200px);
    }
    
    /* 스크롤바 스타일 */
    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }
    
    .chat-messages::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.5);
      border-radius: 4px;
    }
    
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }

    .message-bubble {
      max-width: 85%;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      line-height: 1.8;
      font-size: 17px;
      word-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-bubble {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .chat-input {
      padding: 20px 24px;
      background: rgba(0, 0, 0, 0.5);
      border-top: 2px solid rgba(139, 92, 246, 0.3);
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
    }

    .input-wrapper input {
      flex: 1;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }

    .input-wrapper input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: #8b5cf6;
    }

    .btn-send {
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }
    
    /* 학습 표시 */
    .learning-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    
    .learning-icon {
      width: 12px;
      height: 12px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- JAI 프로필 -->
    <div class="jai-profile-section">
      <div class="jai-avatar-container" id="jaiAvatar">
        <!-- 3개의 표정 이미지 -->
        <img src="/static/images/emei-beautiful-v1.jpg?v=1" class="jai-face active" id="facePrimary" alt="Emei">
      </div>
      
      <div class="jai-status">
        <h1>이메이 (Emei)</h1>
        <p class="subtitle">살아있는 AI 스트리머 💜</p>
      </div>
    </div>

    <!-- 채팅 -->
    <div class="chat-section">
      <div class="chat-header">
        <h2>실시간 대화 💬</h2>
        <p>대화하면서 이메이가 학습하고 성장해요! 🧠✨</p>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message">
          <div class="message-avatar">J</div>
          <div>
            <div class="message-bubble">
              안녕하세요! 이메이예요 💜<br><br>
              함께 대화하면서 제가 학습하고 성장할게요!<br>
              질문이 많을수록 저는 더 똑똑해져요 🧠✨<br><br>
              편하게 물어보세요~
            </div>
          </div>
        </div>
      </div>

      <div class="chat-input">
        <div class="input-wrapper">
          <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." maxlength="500">
          <button class="btn-send" id="sendBtn">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const jaiAvatar = document.getElementById('jaiAvatar');
    const facePrimary = document.getElementById('facePrimary');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // 표정 애니메이션 (CSS 기반, 이미지 교체 없음)
    function showExpression(type) {
      if (type === 'thinking') {
        jaiAvatar.classList.add('thinking');
        setTimeout(() => jaiAvatar.classList.remove('thinking'), 1000);
      } else if (type === 'talking') {
        jaiAvatar.classList.add('talking');
      } else {
        jaiAvatar.classList.remove('talking', 'thinking');
      }
    }

    // 자연스러운 호흡 (5초마다 살짝 커졌다 작아짐)
    setInterval(() => {
      if (!jaiAvatar.classList.contains('talking')) {
        showExpression('thinking');
      }
    }, 5000);

    // 메시지 전송
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      messageInput.value = '';

      // 말하는 애니메이션
      showExpression('talking');
      
      const typingId = addTypingIndicator();

      try {
        const response = await fetch('/api/ai-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        removeTypingIndicator(typingId);
        
        if (data.success) {
          // 학습 여부 확인 (답변에 "학습" 키워드가 있거나, learned 플래그가 있으면)
          const isLearning = data.learned || false;
          addMessage(data.reply, 'ai', isLearning);
        } else {
          addMessage('죄송해요, 답변 생성 중 오류가 발생했어요 😢', 'ai');
        }
      } catch (error) {
        removeTypingIndicator(typingId);
        addMessage('연결에 문제가 발생했어요!', 'ai');
      } finally {
        showExpression('idle');
      }
    }

    function addMessage(text, type, isLearning = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = type === 'ai' ? 'E' : 'U';
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      
      // 학습 표시
      if (isLearning && type === 'ai') {
        const learningBadge = document.createElement('span');
        learningBadge.className = 'learning-badge';
        learningBadge.innerHTML = '<div class="learning-icon"></div>학습 완료!';
        bubble.appendChild(document.createElement('br'));
        bubble.appendChild(learningBadge);
      }
      
      const wrapper = document.createElement('div');
      wrapper.appendChild(bubble);
      
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(wrapper);
      chatMessages.appendChild(messageDiv);
      
      // 스크롤을 맨 아래로
      setTimeout(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 100);
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typing-indicator';
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = 'J';
      
      const dots = document.createElement('div');
      dots.className = 'typing-indicator';
      dots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(dots);
      chatMessages.appendChild(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      return 'typing-indicator';
    }

    function removeTypingIndicator(id) {
      const indicator = document.getElementById(id);
      if (indicator) indicator.remove();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
