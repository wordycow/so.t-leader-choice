<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이메이 학습 통계</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .stat-card h2 {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .stat-card .number {
      font-size: 48px;
      font-weight: 700;
      color: #fbbf24;
    }

    .questions-list {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .questions-list h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .question-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      border-left: 4px solid #fbbf24;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .question-meta {
      font-size: 14px;
      opacity: 0.7;
      display: flex;
      gap: 20px;
    }

    .loading {
      text-align: center;
      padding: 60px;
      font-size: 24px;
    }

    .refresh-btn {
      display: block;
      margin: 30px auto;
      padding: 15px 40px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 이메이 학습 통계</h1>
    <p class="subtitle">실시간으로 학습하고 성장하는 AI</p>

    <div class="stats-grid">
      <div class="stat-card">
        <h2>총 학습 질문 수</h2>
        <div class="number" id="totalLearned">0</div>
      </div>
      <div class="stat-card">
        <h2>오늘 학습한 질문</h2>
        <div class="number" id="todayLearned">0</div>
      </div>
      <div class="stat-card">
        <h2>전체 답변 횟수</h2>
        <div class="number" id="totalAnswers">0</div>
      </div>
    </div>

    <div class="questions-list">
      <h2>📊 자주 묻는 질문 TOP 10</h2>
      <div id="topQuestions" class="loading">
        데이터 로딩 중...
      </div>
    </div>

    <button class="refresh-btn" onclick="loadStats()">🔄 새로고침</button>
  </div>

  <script>
    async function loadStats() {
      try {
        const response = await fetch('/api/learning-stats');
        const data = await response.json();

        if (data.success) {
          document.getElementById('totalLearned').textContent = data.total_learned;
          
          // 전체 답변 횟수 계산
          const totalAnswers = data.top_questions.reduce((sum, q) => sum + q.usage_count, 0);
          document.getElementById('totalAnswers').textContent = totalAnswers;

          // TOP 질문 표시
          const topQuestionsDiv = document.getElementById('topQuestions');
          if (data.top_questions.length === 0) {
            topQuestionsDiv.innerHTML = '<p style="text-align: center; opacity: 0.7;">아직 학습된 질문이 없습니다.</p>';
          } else {
            topQuestionsDiv.innerHTML = data.top_questions.map((q, index) => `
              <div class="question-item">
                <div class="question-text">${index + 1}. ${q.question}</div>
                <div class="question-meta">
                  <span>📈 ${q.usage_count}회 답변</span>
                  <span>📅 ${new Date(q.learned_at).toLocaleDateString('ko-KR')}</span>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (error) {
        console.error('통계 로드 실패:', error);
        document.getElementById('topQuestions').innerHTML = '<p style="text-align: center; color: #ff6b6b;">통계 로드 실패</p>';
      }
    }

    // 페이지 로드 시 통계 로드
    loadStats();

    // 30초마다 자동 새로고침
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
