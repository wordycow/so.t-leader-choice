<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 관리자 대시보드 - Upbit AI Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e4e4e7;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding: 20px;
      background: rgba(30, 30, 45, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #fbbf24 0%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logout-btn {
      padding: 10px 20px;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #ef4444;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(30, 30, 45, 0.8);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(251, 191, 36, 0.5);
    }

    .stat-label {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #fbbf24;
    }

    .stat-sub {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .users-table {
      background: rgba(30, 30, 45, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .table-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-title {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
    }

    .refresh-btn {
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: #10b981;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(20, 20, 30, 0.5);
    }

    th {
      padding: 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }

    tbody tr {
      transition: background 0.2s;
    }

    tbody tr:hover {
      background: rgba(251, 191, 36, 0.05);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-running {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .status-stopped {
      background: rgba(107, 114, 128, 0.2);
      color: #9ca3af;
      border: 1px solid #6b7280;
    }

    .tier-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .tier-1month {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }

    .tier-6months {
      background: rgba(168, 85, 247, 0.2);
      color: #a855f7;
    }

    .tier-lifetime {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
    }

    .tier-free {
      background: rgba(107, 114, 128, 0.2);
      color: #9ca3af;
    }

    .profit-positive {
      color: #10b981;
      font-weight: 600;
    }

    .profit-negative {
      color: #ef4444;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      margin-right: 6px;
    }

    .btn-activate {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .btn-activate:hover {
      background: #10b981;
      color: white;
    }

    .btn-deactivate {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    .btn-deactivate:hover {
      background: #ef4444;
      color: white;
    }

    .btn-detail {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
      border: 1px solid #3b82f6;
    }

    .btn-detail:hover {
      background: #3b82f6;
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>🔧 관리자 대시보드</h1>
      <button class="logout-btn" onclick="logout()">🚪 로그아웃</button>
    </div>

    <!-- 통계 카드 -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">📊 총 사용자</div>
        <div class="stat-value" id="totalUsers">-</div>
        <div class="stat-sub">등록된 전체 사용자</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">🚀 실행 중인 봇</div>
        <div class="stat-value" id="runningBots">-</div>
        <div class="stat-sub">현재 활성 상태</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">💰 구독 활성</div>
        <div class="stat-value" id="activeSubscriptions">-</div>
        <div class="stat-sub">유료 구독자</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">📈 총 수익률</div>
        <div class="stat-value" id="totalProfit">-</div>
        <div class="stat-sub">전체 사용자 평균</div>
      </div>
    </div>

    <!-- 사용자 테이블 -->
    <div class="users-table">
      <div class="table-header">
        <div class="table-title">👥 사용자 목록</div>
        <button class="refresh-btn" onclick="loadUsers()">🔄 새로고침</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>사용자명</th>
            <th>봇 상태</th>
            <th>시드 금액</th>
            <th>현재 잔고</th>
            <th>수익률</th>
            <th>구독 상태</th>
            <th>만료일</th>
            <th>가입일</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="10" class="loading">
              <div>⏳ 사용자 데이터를 불러오는 중...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 페이지 로드 시 데이터 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      loadUsers();
      // 10초마다 자동 새로고침
      setInterval(loadUsers, 10000);
    });

    // 사용자 목록 불러오기
    async function loadUsers() {
      try {
        const response = await fetch('/api/admin/users');
        if (!response.ok) {
          throw new Error('관리자 권한이 없습니다');
        }

        const data = await response.json();
        
        // 통계 업데이트
        document.getElementById('totalUsers').textContent = data.stats.total_users;
        document.getElementById('runningBots').textContent = data.stats.running_bots;
        document.getElementById('activeSubscriptions').textContent = data.stats.active_subscriptions;
        
        const avgProfit = data.stats.average_profit_rate;
        const profitEl = document.getElementById('totalProfit');
        profitEl.textContent = avgProfit >= 0 ? `+${avgProfit.toFixed(2)}%` : `${avgProfit.toFixed(2)}%`;
        profitEl.style.color = avgProfit >= 0 ? '#10b981' : '#ef4444';

        // 사용자 테이블 업데이트
        const tbody = document.getElementById('usersTableBody');
        
        if (data.users.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="10" class="empty-state">
                <div class="empty-icon">📭</div>
                <div>등록된 사용자가 없습니다</div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = data.users.map(user => `
          <tr>
            <td>${user.user_id}</td>
            <td><strong>${user.username || 'Guest'}</strong></td>
            <td>
              <span class="status-badge ${user.bot_running ? 'status-running' : 'status-stopped'}">
                ${user.bot_running ? '🟢 실행 중' : '⚪ 정지'}
              </span>
            </td>
            <td>${formatNumber(user.seed_amount)}원</td>
            <td>${formatNumber(user.current_balance)}원</td>
            <td class="${user.profit_rate >= 0 ? 'profit-positive' : 'profit-negative'}">
              ${user.profit_rate >= 0 ? '+' : ''}${user.profit_rate.toFixed(2)}%
            </td>
            <td>
              <span class="tier-badge tier-${getTierClass(user.subscription_tier)}">
                ${getTierName(user.subscription_tier)}
              </span>
            </td>
            <td>${formatDate(user.expires_at)}</td>
            <td>${formatDate(user.created_at)}</td>
            <td>
              <button class="action-btn btn-detail" onclick="viewDetail('${user.user_id}')">
                📋 상세
              </button>
              ${user.subscription_active ? 
                `<button class="action-btn btn-deactivate" onclick="deactivateSubscription('${user.user_id}')">
                  ❌ 비활성화
                </button>` :
                `<button class="action-btn btn-activate" onclick="activateSubscription('${user.user_id}')">
                  ✅ 활성화
                </button>`
              }
            </td>
          </tr>
        `).join('');

      } catch (error) {
        console.error('데이터 로드 실패:', error);
        document.getElementById('usersTableBody').innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; color: #ef4444; padding: 40px;">
              ❌ ${error.message}
            </td>
          </tr>
        `;
      }
    }

    // 숫자 포맷팅
    function formatNumber(num) {
      return Number(num).toLocaleString('ko-KR');
    }

    // 날짜 포맷팅
    function formatDate(dateStr) {
      if (!dateStr || dateStr === 'None' || dateStr === 'null') return '-';
      const date = new Date(dateStr);
      return date.toLocaleDateString('ko-KR', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit' 
      });
    }

    // 구독 등급 클래스
    function getTierClass(tier) {
      if (!tier || tier === 'free') return 'free';
      if (tier === '1month') return '1month';
      if (tier === '6months') return '6months';
      if (tier === 'lifetime') return 'lifetime';
      return 'free';
    }

    // 구독 등급 이름
    function getTierName(tier) {
      const names = {
        'free': '무료',
        '1month': '1개월',
        '6months': '6개월',
        'lifetime': '평생'
      };
      return names[tier] || '무료';
    }

    // 사용자 상세 보기
    function viewDetail(userId) {
      alert(`사용자 ${userId} 상세 페이지 (구현 예정)`);
    }

    // 구독 활성화
    async function activateSubscription(userId) {
      if (!confirm('이 사용자의 구독을 활성화하시겠습니까?')) return;
      
      try {
        const response = await fetch('/api/admin/subscription/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });

        if (response.ok) {
          alert('✅ 구독이 활성화되었습니다');
          loadUsers();
        } else {
          throw new Error('활성화 실패');
        }
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    // 구독 비활성화
    async function deactivateSubscription(userId) {
      if (!confirm('이 사용자의 구독을 비활성화하시겠습니까?')) return;
      
      try {
        const response = await fetch('/api/admin/subscription/deactivate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });

        if (response.ok) {
          alert('✅ 구독이 비활성화되었습니다');
          loadUsers();
        } else {
          throw new Error('비활성화 실패');
        }
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    // 로그아웃
    function logout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        window.location.href = '/logout';
      }
    }
  </script>
</body>
</html>
