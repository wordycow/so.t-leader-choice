<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 이메이 AI 트레이딩 - 통합 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
      gap: 0;
    }

    /* 왼쪽: 트레이딩 대시보드 */
    .dashboard-section {
      background: rgba(255, 255, 255, 0.95);
      color: #1F2937;
      overflow-y: auto;
      padding: 20px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .dashboard-header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-label {
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .positive { color: #22C55E; }
    .negative { color: #F23645; }

    /* 오른쪽: 이메이 채팅 */
    .chat-section {
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
      display: flex;
      flex-direction: column;
      border-left: 2px solid rgba(255,255,255,0.1);
      height: 100vh;
    }

    .chat-header {
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border-bottom: 2px solid rgba(139, 92, 246, 0.3);
      text-align: center;
    }

    /* 이메이 아바타 호버 효과 */
    #emeiAvatar:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.7);
    }

    #emeiAvatar.talking {
      animation: avatarTalking 0.5s ease-in-out infinite;
    }

    @keyframes avatarTalking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .chat-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .chat-header p {
      font-size: 13px;
      opacity: 0.8;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.5);
      border-radius: 3px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }

    .message-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.3);
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .message.user .message-bubble {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .chat-input {
      padding: 16px;
      background: rgba(0,0,0,0.5);
      border-top: 2px solid rgba(139, 92, 246, 0.3);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .input-wrapper input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .btn-send {
      padding: 12px 20px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s;
    }

    .btn-send:hover {
      transform: translateY(-2px);
    }

    .learning-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    .learning-icon {
      width: 10px;
      height: 10px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .typing-indicator {
      display: flex;
      gap: 3px;
      padding: 8px 12px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* 반응형 */
    @media (max-width: 1024px) {
      .main-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 50vh;
      }

      .chat-section {
        border-left: none;
        border-top: 2px solid rgba(255,255,255,0.1);
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- 왼쪽: 트레이딩 대시보드 -->
    <div class="dashboard-section">
      <div class="dashboard-header">
        <h1>🤖 Upbit AI Trading Bot</h1>
        <div style="text-align: right;">
          <div style="font-size: 12px; color: #6B7280;">v8.0 ULTIMATE</div>
          <div style="font-size: 14px; font-weight: 600; color: #1F2937;">with Emei AI</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">💰 현재 잔고</div>
          <div class="stat-value" id="balance">0원</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">💎 투자금</div>
          <div class="stat-value" id="invested">0원</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">📈 총 수익</div>
          <div class="stat-value" id="profit">+0원</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">📊 수익률</div>
          <div class="stat-value" id="profitRate">+0.00%</div>
        </div>
      </div>

      <div class="stat-card" style="margin-bottom: 20px;">
        <div class="stat-label">🪙 보유 코인 (<span id="holdingsCount">0</span>개)</div>
        <div id="holdingsList" style="margin-top: 12px; font-size: 14px; color: #6B7280;">
          로딩 중...
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">📝 봇 로그</div>
        <div id="botLogs" style="margin-top: 12px; font-size: 13px; color: #6B7280; max-height: 300px; overflow-y: auto;">
          봇 시작 대기 중...
        </div>
      </div>
    </div>

    <!-- 오른쪽: 이메이 채팅 -->
    <div class="chat-section">
      <div class="chat-header">
        <!-- 이메이 아바타 -->
        <div style="text-align: center; margin-bottom: 12px;">
          <img src="/static/images/emei-beautiful-v1.jpg?v=2" 
               id="emeiAvatar"
               style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(139, 92, 246, 0.7); object-fit: cover; box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5); transition: all 0.3s ease;"
               alt="Emei">
        </div>
        <h2>💬 이메이 (Emei)</h2>
        <p>실시간 매매 상담 & 학습 AI</p>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message">
          <div class="message-avatar">E</div>
          <div class="message-bubble">
            안녕하세요! 이메이예요 💜<br><br>
            실시간 매매 상황 보면서<br>
            편하게 질문하세요!<br><br>
            제가 학습하고 답변드릴게요 🧠✨
          </div>
        </div>
      </div>

      <div class="chat-input">
        <div class="input-wrapper">
          <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." maxlength="500">
          <button class="btn-send" id="sendBtn">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // 채팅 기능
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      messageInput.value = '';

      // 이메이 아바타 대화 중 애니메이션
      const avatar = document.getElementById('emeiAvatar');
      if (avatar) avatar.classList.add('talking');

      const typingId = addTypingIndicator();

      try {
        const response = await fetch('/api/ai-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        removeTypingIndicator(typingId);

        // 이메이 아바타 대화 종료
        const avatar = document.getElementById('emeiAvatar');
        if (avatar) avatar.classList.remove('talking');

        if (data.success) {
          const isLearning = data.learned || false;
          addMessage(data.reply, 'ai', isLearning);
        } else {
          addMessage('죄송해요, 답변 생성 중 오류가 발생했어요 😢', 'ai');
        }
      } catch (error) {
        removeTypingIndicator(typingId);

        // 이메이 아바타 대화 종료 (오류 시)
        const avatar = document.getElementById('emeiAvatar');
        if (avatar) avatar.classList.remove('talking');

        addMessage('연결에 문제가 발생했어요!', 'ai');
      }
    }

    function addMessage(text, type, isLearning = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = type === 'ai' ? 'E' : 'U';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;

      if (isLearning && type === 'ai') {
        const learningBadge = document.createElement('span');
        learningBadge.className = 'learning-badge';
        learningBadge.innerHTML = '<div class="learning-icon"></div>학습 완료!';
        bubble.appendChild(document.createElement('br'));
        bubble.appendChild(learningBadge);
      }

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      chatMessages.appendChild(messageDiv);

      setTimeout(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 100);
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = 'E';

      const dots = document.createElement('div');
      dots.className = 'typing-indicator';
      dots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

      typingDiv.appendChild(avatar);
      typingDiv.appendChild(dots);
      chatMessages.appendChild(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      return 'typing-indicator';
    }

    function removeTypingIndicator(id) {
      const indicator = document.getElementById(id);
      if (indicator) indicator.remove();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // 대시보드 업데이트
    async function updateDashboard() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();

        // 잔고 업데이트 (current_krw 사용)
        const balance = data.current_krw || 0;
        document.getElementById('balance').textContent = balance.toLocaleString() + '원';
        
        // 투자금 (보유 코인 투자액)
        const invested = data.holdings ? data.holdings.reduce((sum, h) => sum + (h.avg_price * h.amount), 0) : 0;
        document.getElementById('invested').textContent = invested.toLocaleString() + '원';
        
        // 총 수익 (total_profit 사용)
        const profitEl = document.getElementById('profit');
        const profit = data.total_profit || 0;
        profitEl.textContent = (profit >= 0 ? '+' : '') + profit.toLocaleString() + '원';
        profitEl.className = 'stat-value ' + (profit >= 0 ? 'positive' : 'negative');

        // 수익률 (profit_rate 사용)
        const rateEl = document.getElementById('profitRate');
        const rate = data.profit_rate || 0;
        rateEl.textContent = (rate >= 0 ? '+' : '') + rate.toFixed(2) + '%';
        rateEl.className = 'stat-value ' + (rate >= 0 ? 'positive' : 'negative');

        // 보유 코인 개수
        const holdingsCount = data.holdings ? data.holdings.length : 0;
        document.getElementById('holdingsCount').textContent = holdingsCount;

        // 보유 코인 목록
        const holdingsList = document.getElementById('holdingsList');
        if (data.holdings && data.holdings.length > 0) {
          holdingsList.innerHTML = data.holdings.map(h => 
            `<div style="margin-bottom: 8px;">
              <strong>${h.coin_name || h.ticker.replace('KRW-', '')}</strong>: ${h.amount.toFixed(4)}개 
              (${h.profit_rate >= 0 ? '+' : ''}${h.profit_rate.toFixed(2)}%)
            </div>`
          ).join('');
        } else {
          holdingsList.textContent = '보유 중인 코인이 없습니다.';
        }

        // 봇 로그 (최근 거래)
        const botLogs = document.getElementById('botLogs');
        if (data.recent_trades && data.recent_trades.length > 0) {
          botLogs.innerHTML = data.recent_trades.slice(-5).reverse().map(t => 
            `<div style="margin-bottom: 6px; padding: 6px; background: rgba(0,0,0,0.05); border-radius: 4px;">
              <strong>${t.type === 'buy' ? '🟢 매수' : '🔴 매도'}</strong> ${t.ticker.replace('KRW-', '')} 
              ${(t.profit_rate || 0).toFixed(2)}%
            </div>`
          ).join('');
        } else {
          botLogs.textContent = data.running ? '거래 대기 중...' : '봇 시작 대기 중...';
        }
      } catch (error) {
        console.error('대시보드 업데이트 실패:', error);
      }
    }

    // 5초마다 업데이트
    setInterval(updateDashboard, 5000);
    updateDashboard();
  </script>
</body>
</html>
