<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emei - AI 트레이딩 스트리머</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    /* 전체 레이아웃 */
    .app-container {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
      gap: 0;
    }

    /* 왼쪽: JAI 프로필 영역 */
    .jai-profile-section {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 배경 애니메이션 */
    .jai-profile-section::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* JAI 대형 이미지 */
    .jai-avatar-large {
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 0 60px rgba(139, 92, 246, 0.4),
        0 0 120px rgba(139, 92, 246, 0.2),
        inset 0 0 80px rgba(139, 92, 246, 0.1);
      background: url('/static/images/emei-beautiful-v1.jpg?v=1') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
      overflow: hidden;
    }
    
    /* 이미지 로드 실패 시 폴백 */
    .jai-avatar-large::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      z-index: -1;
    }

    .jai-avatar-large.talking {
      animation: avatarPulse 1s ease-in-out infinite;
      border-color: #10b981;
      box-shadow: 
        0 0 80px rgba(16, 185, 129, 0.6),
        0 0 140px rgba(16, 185, 129, 0.3);
    }

    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .jai-avatar-large .avatar-text {
      font-size: 120px;
      font-weight: 900;
      background: linear-gradient(45deg, #fff, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 10px;
      display: none; /* 실제 이미지 사용 시 숨김 */
    }

    /* JAI 상태 정보 */
    .jai-status {
      margin-top: 40px;
      text-align: center;
      z-index: 1;
    }

    .jai-status h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .jai-status .subtitle {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 24px;
    }

    .jai-status .status-badges {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .badge.online {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #10b981;
    }

    /* 오른쪽: 채팅 영역 */
    .chat-section {
      background: #1a1d3a;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 채팅 헤더 */
    .chat-header {
      padding: 24px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-header h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .chat-header p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    /* 메시지 영역 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: messageSlide 0.3s ease;
    }

    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      line-height: 1.6;
    }

    .message.user .message-bubble {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .message-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 4px;
    }

    /* 입력 영역 */
    .chat-input {
      padding: 24px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
    }

    .input-wrapper input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-send {
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-send:active {
      transform: translateY(0);
    }

    /* 로딩 애니메이션 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

    /* 반응형 */
    @media (max-width: 1024px) {
      .app-container {
        grid-template-columns: 1fr;
        grid-template-rows: 400px 1fr;
      }

      .jai-avatar-large {
        width: 300px;
        height: 300px;
      }

      .jai-avatar-large .avatar-text {
        font-size: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 왼쪽: JAI 프로필 -->
    <div class="jai-profile-section">
      <div class="jai-avatar-large" id="jaiAvatar">
        <img src="https://www.genspark.ai/api/files/s/TFDijPJY" alt="JAI Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
      </div>
      
      <div class="jai-status">
        <h1>이메이 (Emei)</h1>
        <p class="subtitle">AI 트레이딩 스트리머 💜</p>
        <div class="status-badges">
          <div class="badge online">● 온라인</div>
          <div class="badge">🎓 연세대 경영학과</div>
          <div class="badge">📊 투자 어시스턴트</div>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 채팅 -->
    <div class="chat-section">
      <div class="chat-header">
        <h2>실시간 대화</h2>
        <p>자이와 함께 코인 투자 상담을 시작하세요!</p>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- 환영 메시지 -->
        <div class="message">
          <div class="message-avatar">J</div>
          <div>
            <div class="message-bubble">
              안녕하세요! 자이예요 💕<br><br>
              코인 투자 상담 받아주세요!<br>
              여러분의 돈버는걸 도와드릴게요!
            </div>
            <div class="message-time">방금 전</div>
          </div>
        </div>
      </div>

      <div class="chat-input">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="나는 어떻게가? 있나?"
            maxlength="500"
          />
          <button class="btn-send" id="sendBtn">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const jaiAvatar = document.getElementById('jaiAvatar');

    // 메시지 전송
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      // 사용자 메시지 표시
      addMessage(message, 'user');
      messageInput.value = '';

      // 타이핑 인디케이터 표시
      const typingId = addTypingIndicator();
      
      // JAI 아바타 애니메이션
      jaiAvatar.classList.add('talking');

      try {
        const response = await fetch('/api/ai-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        
        // 타이핑 인디케이터 제거
        removeTypingIndicator(typingId);
        
        // JAI 응답 표시
        if (data.success) {
          addMessage(data.reply, 'ai');
        } else {
          addMessage('죄송해요, 답변 생성 중 오류가 발생했어요 😢', 'ai');
        }
      } catch (error) {
        removeTypingIndicator(typingId);
        addMessage('연결에 문제가 발생했어요. 다시 시도해주세요!', 'ai');
      } finally {
        jaiAvatar.classList.remove('talking');
      }
    }

    // 메시지 추가
    function addMessage(text, type) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = type === 'ai' ? 'J' : 'U';
      
      const contentDiv = document.createElement('div');
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      
      const time = document.createElement('div');
      time.className = 'message-time';
      time.textContent = new Date().toLocaleTimeString('ko-KR', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      contentDiv.appendChild(bubble);
      contentDiv.appendChild(time);
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(contentDiv);
      
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 타이핑 인디케이터
    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typing-indicator';
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = 'J';
      
      const dots = document.createElement('div');
      dots.className = 'typing-indicator';
      dots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(dots);
      chatMessages.appendChild(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      return 'typing-indicator';
    }

    function removeTypingIndicator(id) {
      const indicator = document.getElementById(id);
      if (indicator) indicator.remove();
    }

    // 이벤트 리스너
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
