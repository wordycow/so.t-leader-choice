<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>THE UNIQUE: COMPANY ROULETTE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* =========================================
           CSS STYLES (다크 테마 & 반응형)
           ========================================= */
        :root {
            --bg-color: #120c1f;
            --gold: #ffd700;
            --company-color: #ff0055; /* Company 전용 색상 */
            --panel-bg: rgba(255, 255, 255, 0.08);
            --text-gray: #aaa;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* --- 상단 헤더 --- */
        .header {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
            flex-shrink: 0;
        }
        .title {
            margin: 0;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 900;
        }

        /* --- 메인 게임 컨테이너 --- */
        .game-container {
            flex: 1;
            display: flex;
            width: 100%;
            max-width: 900px;
            padding: 10px;
            box-sizing: border-box;
            gap: 20px;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. 왼쪽: 룰렛 휠 */
        .roulette-section {
            position: relative;
            width: 360px;
            height: 360px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.6));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-origin: center;
        }
        /* 룰렛 화살표 (Pointer) */
        .pointer {
            position: absolute;
            top: 50%;
            left: -18px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            z-index: 10;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 30px solid #fff;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        /* 2. 오른쪽: 정보창 & 리스트 */
        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 400px;
            gap: 15px;
            min-width: 280px;
        }

        /* 정보 카드 (타이머, 총액) */
        .status-card {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .label { font-size: 0.85rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        .total-amount { font-size: 2rem; font-weight: 800; color: var(--gold); margin: 5px 0 10px 0; }
        .timer { color: #ff4757; font-weight: bold; font-size: 1.4rem; font-family: monospace; }
        .message { font-size: 0.9rem; margin-top: 5px; height: 20px; color: #ffdd59; font-weight: bold; }

        /* 참여자 리스트 (스크롤) */
        .list-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 10px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        .list-header {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        
        /* 스크롤바 커스텀 */
        .list-panel::-webkit-scrollbar { width: 6px; }
        .list-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        /* 리스트 아이템 */
        .p-row {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .p-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 12px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .p-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .p-money { font-weight: bold; color: #eee; font-family: monospace; font-size: 1.1em;}

        /* --- 하단 컨트롤 패널 --- */
        .controls {
            width: 100%;
            max-width: 900px;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 25px 25px 0 0;
            border-top: 2px solid #333;
            box-sizing: border-box;
            flex-shrink: 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .bet-box { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .btn-bet {
            padding: 10px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-bet:hover { background: #555; transform: translateY(-2px); }
        .btn-bet:active { transform: translateY(0); }
        
        .input-bet {
            width: 110px;
            background: #000;
            border: 1px solid #555;
            color: var(--gold);
            text-align: center;
            font-size: 1.3rem;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-join {
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            text-transform: uppercase;
            transition: 0.1s;
        }
        .btn-join:active { transform: translateY(4px); box-shadow: none; }
        .btn-join:disabled { filter: grayscale(1); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.5; }

        /* --- 모바일 반응형 --- */
        @media (max-width: 768px) {
            .game-container { flex-direction: column; overflow-y: auto; padding-bottom: 0; }
            .roulette-section { width: 280px; height: 280px; margin-bottom: 10px; }
            .info-section { width: 100%; min-width: auto; }
            .list-panel { max-height: 200px; }
            .title { font-size: 1.4rem; }
            .controls { padding: 15px; }
            .btn-join { font-size: 1.1rem; padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">THE UNIQUE CASINO</h1>
    </div>

    <div class="game-container">
        <div class="roulette-section">
            <div class="pointer"></div>
            <canvas id="canvas" width="600" height="600"></canvas>
        </div>

        <div class="info-section">
            <div class="status-card">
                <div class="label">TOTAL EQUITY (총 판돈)</div>
                <div class="total-amount" id="poolDisplay">0 UT</div>
                <div class="timer" id="timerDisplay">30:00</div>
                <div class="message" id="statusMsg"></div>
            </div>

            <div class="list-panel">
                <div class="list-header">실시간 지분 현황 (Live Equity)</div>
                <div id="participantList">
                    </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-box">
            <button class="btn-bet" onclick="changeBet(-10)">-10</button>
            <input type="number" id="betInput" class="input-bet" value="10" readonly>
            <button class="btn-bet" onclick="changeBet(10)">+10</button>
            <button class="btn-bet" style="color:var(--gold)" onclick="setMaxBet()">MAX</button>
        </div>
        <button id="joinBtn" class="btn-join" onclick="joinGame()">참여하기 (BET)</button>
    </div>

    <script>
        /* =========================================
           GAME LOGIC (게임 로직)
           ========================================= */
        
        // --- 설정값 (Config) ---
        const HOUSE_NAME = "Company";       // 본사 이름
        const HOUSE_COLOR = "#ff0055";      // 본사 색상 (형광 핑크/레드)
        const HOUSE_BET = 100;              // 본사 기본 시드
        const ROUND_TIME_SEC = 30 * 60;     // 30분 = 1800초 (테스트시 줄여서 사용 가능)
        const TEST_TIME_SEC = 20;           // (개발용 테스트 시간: 20초) -> 실제 배포시 위 값 사용

        // --- 전역 변수 ---
        let gameState = {
            participants: [],
            totalPool: 0,
            timeLeft: TEST_TIME_SEC, // *테스트를 위해 짧게 설정함*
            isRunning: false,
            isSpinning: false
        };

        let myWallet = 10000; // 내 지갑 (가상)
        let timerInterval = null;
        let animationFrame = null;
        let rotationAngle = 0;

        // 색상 팔레트 (유저용)
        const userColors = [
            '#3498db', '#2ecc71', '#9b59b6', '#f1c40f', 
            '#e67e22', '#1abc9c', '#34495e', '#d35400', '#7f8c8d'
        ];

        // --- 초기화 (Init) ---
        window.onload = function() {
            initGame();
            renderLoop(); // 캔버스 그리기 시작
        };

        function initGame() {
            // 게임 리셋
            gameState.participants = [];
            gameState.totalPool = 0;
            gameState.timeLeft = TEST_TIME_SEC; // 리셋시 시간 재설정
            gameState.isRunning = true;
            gameState.isSpinning = false;

            // 1. Company 자동 참가 (무조건 1번)
            addParticipant(HOUSE_NAME, HOUSE_BET, HOUSE_COLOR, true);

            // 타이머 시작
            startTimer();
            updateUI();
            logMsg("새 라운드가 시작되었습니다.");
        }

        // --- 기능 함수 ---

        function addParticipant(name, amount, color, isHouse = false) {
            gameState.participants.push({
                name: name,
                amount: amount,
                color: color,
                isHouse: isHouse
            });
            calculatePool();
        }

        function calculatePool() {
            gameState.totalPool = gameState.participants.reduce((sum, p) => sum + p.amount, 0);
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            
            const btn = document.getElementById('joinBtn');
            const msgObj = document.getElementById('statusMsg');

            timerInterval = setInterval(() => {
                if(!gameState.isRunning) return;

                gameState.timeLeft--;

                // 시간 포맷 (MM:SS)
                const min = Math.floor(gameState.timeLeft / 60);
                const sec = gameState.timeLeft % 60;
                document.getElementById('timerDisplay').innerText = 
                    `${min}:${sec < 10 ? '0' + sec : sec}`;

                // 상태 처리
                if (gameState.timeLeft <= 5 && gameState.timeLeft > 0) {
                    // 마감 임박
                    btn.disabled = true;
                    btn.innerText = "마감 임박 (CLOSING...)";
                    btn.style.background = "#555";
                    msgObj.innerText = "🚨 배팅 마감 직전!";
                    msgObj.style.color = "#ff4757";
                } 
                else if (gameState.timeLeft <= 0) {
                    // 종료 -> 스핀 시작
                    clearInterval(timerInterval);
                    startSpinning();
                } 
                else {
                    // 진행 중
                    btn.disabled = false;
                    btn.innerText = "참여하기 (BET)";
                    btn.style.background = ""; // 기본 그라데이션 복구
                    msgObj.innerText = "";
                }
            }, 1000);
        }

        // --- 유저 인터랙션 ---
        
        function changeBet(val) {
            const input = document.getElementById('betInput');
            let current = parseInt(input.value) || 0;
            current += val;
            if(current < 10) current = 10;
            input.value = current;
        }

        function setMaxBet() {
            document.getElementById('betInput').value = myWallet;
        }

        function joinGame() {
            const amount = parseInt(document.getElementById('betInput').value);
            
            if(amount > myWallet) {
                alert("잔액이 부족합니다! (보유: " + myWallet + ")");
                return;
            }
            if(!gameState.isRunning || gameState.timeLeft <= 5) {
                alert("지금은 참여할 수 없습니다.");
                return;
            }

            // 내 돈 차감
            myWallet -= amount;

            // 유저 추가 (색상은 순서대로 순환)
            const colorIdx = (gameState.participants.length - 1) % userColors.length;
            addParticipant("나 (Player)", amount, userColors[colorIdx]);
            
            updateUI();
        }

        function logMsg(text) {
            document.getElementById('statusMsg').innerText = text;
        }

        // --- UI 업데이트 ---
        function updateUI() {
            // 1. 총 상금 표시
            document.getElementById('poolDisplay').innerText = gameState.totalPool.toLocaleString() + " UT";

            // 2. 리스트 갱신 (오른쪽 패널)
            const listEl = document.getElementById('participantList');
            listEl.innerHTML = ""; // 초기화

            gameState.participants.forEach(p => {
                const row = document.createElement('div');
                row.className = 'p-row';
                
                // Company 이름 강조
                const nameStyle = p.isHouse ? `color:${HOUSE_COLOR}; font-weight:bold;` : "";
                
                row.innerHTML = `
                    <div class="p-color" style="background-color: ${p.color}"></div>
                    <div class="p-name" style="${nameStyle}">${p.name}</div>
                    <div class="p-money">${p.amount.toLocaleString()}</div>
                `;
                listEl.appendChild(row);
            });

            // 스크롤 맨 아래로
            listEl.scrollTop = listEl.scrollHeight;
        }

        // --- 스핀 및 결과 처리 ---

        function startSpinning() {
            gameState.isRunning = false;
            gameState.isSpinning = true;
            
            const btn = document.getElementById('joinBtn');
            btn.innerText = "추첨 진행 중...";
            logMsg("🎰 결과 추첨 중입니다! 🎰");

            // 3초 뒤 결과 발표
            setTimeout(determineWinner, 3000);
        }

        function determineWinner() {
            // 승자 결정 (가중치 랜덤)
            const randomPoint = Math.random() * gameState.totalPool;
            let currentStack = 0;
            let winner = null;

            for(let p of gameState.participants) {
                currentStack += p.amount;
                if(randomPoint <= currentStack) {
                    winner = p;
                    break;
                }
            }

            // 배분 계산
            const winPrize = Math.floor(gameState.totalPool * 0.9);
            const companyFee = Math.floor(gameState.totalPool * 0.1);

            // 결과 알림
            alert(`🎉 [${winner.name}] 님 당첨! 🎉\n\n💰 획득 상금: ${winPrize.toLocaleString()} UT\n🏢 Company 수익: ${companyFee.toLocaleString()} UT`);

            // (선택사항) 여기서 서버로 데이터 전송 로직이 들어가면 됩니다.
            
            // 다음 판 자동 시작
            initGame();
        }

        // --- 캔버스 렌더링 (60FPS) ---
        function renderLoop() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = width / 2 - 10; // 여백 10

            // 화면 지우기
            ctx.clearRect(0, 0, width, height);

            // 회전 각도 업데이트
            if (gameState.isSpinning) {
                rotationAngle += 0.3; // 결과 발표땐 빠르게
            } else {
                rotationAngle += 0.002; // 평소엔 아주 천천히 (대기모드)
            }

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotationAngle);

            // 파이 차트 그리기
            let startAngle = 0;

            if(gameState.participants.length > 0) {
                gameState.participants.forEach(p => {
                    // 내 지분율(각도) 계산
                    const sliceAngle = (p.amount / gameState.totalPool) * 2 * Math.PI;
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0); // 중심점
                    ctx.arc(0, 0, radius, startAngle, startAngle + sliceAngle);
                    ctx.closePath();
                    
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // 경계선 (미세하게)
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(0,0,0,0.1)";
                    ctx.stroke();

                    startAngle += sliceAngle;
                });
            } else {
                // 로딩/초기 상태 (검은 원)
                ctx.beginPath();
                ctx.arc(0,0, radius, 0, Math.PI*2);
                ctx.fillStyle = "#222";
                ctx.fill();
            }

            ctx.restore();

            // 반복
            animationFrame = requestAnimationFrame(renderLoop);
        }

    </script>
</body>
</html>
