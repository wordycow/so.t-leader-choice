<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>so.t 직급구매 페이지</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#0f1730; --text:#e7ecff; --muted:#aab4da;
      --outline:#8050F0;

      --pro1:#B08000; --star3:#F06020; --star2:#F0F000; --s1top:#A090F0; --s1bot:#F0B070; --none:#FFFFFF;
      --w1:#F0F000; --w2:#A090F0; --w3:#F0B070; --w4:#FFFFFF;
      --shadow: 0 14px 32px rgba(0,0,0,.55);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(128,80,240,.22), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(240,176,112,.12), transparent 55%),
        var(--bg);
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:28px 16px 80px; }
    header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .title h1{ margin:0; font-size:22px; letter-spacing:-0.2px; }
    .title p{ margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }

    .pillrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
    .pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid rgba(38,51,87,.9); background: rgba(17,26,51,.55); border-radius:999px; font-size:12px; color:var(--muted); }
    .dot{ width:9px; height:9px; border-radius:999px; display:inline-block; }
    .dot.w1{ background:var(--w1); } .dot.w2{ background:var(--w2); } .dot.w3{ background:var(--w3); } .dot.w4{ background:var(--w4); border:1px solid rgba(38,51,87,.65); }

    .panel{ background: linear-gradient(180deg, rgba(17,26,51,.85), rgba(15,23,48,.75)); border:1px solid rgba(38,51,87,.9); border-radius:16px; padding:14px; box-shadow: 0 12px 35px rgba(0,0,0,.35); }
    select, input, textarea, button{ font:inherit; }
    select, input, textarea{ width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(38,51,87,.9); background: rgba(9,13,28,.65); color:var(--text); outline:none; }
    .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .control{ flex:1; min-width:220px; }
    .label{ font-size:12px; color:var(--muted); margin:0 0 6px; }
    .btn{ cursor:pointer; padding:10px 12px; border-radius:12px; border:1px solid rgba(128,80,240,.65); background: rgba(128,80,240,.18); color:var(--text); font-weight:900; }
    .btn:hover{ background: rgba(128,80,240,.28); }
    .btn.ghost{ border:1px solid rgba(38,51,87,.9); background: rgba(17,26,51,.35); color:var(--muted); }
    .btn.ghost:hover{ background: rgba(17,26,51,.55); color:var(--text); }

    .grid{ margin-top:14px; display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 640px){ .grid{ grid-template-columns: 1fr; } }

    .card{
      border:2px solid var(--outline);
      border-radius:16px; padding:12px;
      display:flex; flex-direction:column; gap:10px; min-height:140px;
      box-shadow: var(--shadow);
      color:#0b1020;
    }
    .topline{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .name{ font-weight:900; font-size:14px; display:flex; align-items:center; gap:8px; color:#0b1020; }
    .r-dot{ width:10px; height:10px; border-radius:999px; display:inline-block; border:1px solid rgba(0,0,0,.18); }
    .meta{ color: rgba(11,16,32,.85); font-size:12px; line-height:1.4; }
    .meta b{ color:#0b1020; }

    .badge{
      font-size:11px; padding:6px 9px; border-radius:999px;
      border:1px solid rgba(0,0,0,.25);
      color:#0b1020; background: rgba(255,255,255,.35);
      display:inline-flex; align-items:center; gap:7px;
      font-weight:900;
    }
    .badge .bdot{ width:8px; height:8px; border-radius:999px; display:inline-block; border:1px solid rgba(0,0,0,.18); }
    .badge.week1{ background: rgba(240,240,0,.65); } .badge.week1 .bdot{ background:var(--w1); }
    .badge.week2{ background: rgba(160,144,240,.65); } .badge.week2 .bdot{ background:var(--w2); }
    .badge.week3{ background: rgba(240,176,112,.70); } .badge.week3 .bdot{ background:var(--w3); }
    .badge.week4{ background: rgba(255,255,255,.65); } .badge.week4 .bdot{ background:var(--w4); }

    .rank-PRO1{ background: linear-gradient(180deg, rgba(176,128,0,.95), rgba(176,128,0,.55)); } .rank-PRO1 .r-dot{ background:var(--pro1); }
    .rank-STAR3{ background: linear-gradient(180deg, rgba(240,96,32,.92), rgba(240,96,32,.55)); } .rank-STAR3 .r-dot{ background:var(--star3); }
    .rank-STAR2{ background: linear-gradient(180deg, rgba(240,240,0,.82), rgba(240,240,0,.50)); } .rank-STAR2 .r-dot{ background:var(--star2); }
    .rank-STAR1_TOP{ background: linear-gradient(180deg, rgba(160,144,240,.92), rgba(160,144,240,.55)); } .rank-STAR1_TOP .r-dot{ background:var(--s1top); }
    .rank-STAR1_BOTTOM{ background: linear-gradient(180deg, rgba(240,176,112,.92), rgba(240,176,112,.55)); } .rank-STAR1_BOTTOM .r-dot{ background:var(--s1bot); }
    .rank-NONE{ background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.55)); } .rank-NONE .r-dot{ background:var(--none); }

    .footnote{ margin-top:12px; color:var(--muted); font-size:12px; line-height:1.5; }
    .statusline{ margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>so.t 직급구매 페이지</h1>
        <p>
          결제는 <b>원화 입금</b>으로 진행합니다. 구매 신청(예약) 후 입금하면 관리자 5명이 관리자 페이지에서 입금확정 처리합니다.
        </p>
        <div class="pillrow">
          <span class="pill"><span class="dot w1"></span><b style="color:#fff;">1주차</b>: Pro1 / Star3 / Star2</span>
          <span class="pill"><span class="dot w2"></span><b style="color:#fff;">2주차</b>: Star1(상위)</span>
          <span class="pill"><span class="dot w3"></span><b style="color:#fff;">3주차</b>: Star1(하위)</span>
          <span class="pill"><span class="dot w4"></span><b style="color:#fff;">4주차</b>: 무직급(할인)</span>
        </div>
      </div>

      <div class="panel" style="min-width:280px">
        <div class="label">안내(입금 정보)</div>
        <div class="meta" id="depositInfo" style="color:var(--muted)"></div>
        <div style="height:1px; background:rgba(38,51,87,.9); opacity:.8; margin:6px 0;"></div>
        <button class="btn ghost" id="refreshBtn">새로고침</button>
      </div>
    </header>

    <section class="panel">
      <div class="controls">
        <div class="control">
          <div class="label">회차(Pro1 트리) 선택</div>
          <select id="treeSelect"></select>
        </div>
        <div class="control">
          <div class="label">현재 오픈 주차</div>
          <input id="currentWeek" readonly />
        </div>
        <div class="control">
          <div class="label">필터</div>
          <select id="weekFilter">
            <option value="all_all" selected>전체(1~4주차 전부 표시)</option>
            <option value="all_open">전체(오픈된 것만)</option>
            <option value="1">1주차만</option>
            <option value="2">2주차만</option>
            <option value="3">3주차만</option>
            <option value="4">4주차만</option>
          </select>
        </div>
      </div>

      <div class="statusline">
        <div id="statusText">로딩중...</div>
        <div class="mono" id="clock"></div>
      </div>

      <div class="grid" id="slotGrid"></div>

      <div class="footnote">
        • Star1은 연결자(소개자)가 있으면 판매 확정 시 <b>30만원</b>이 연결자에게 지급됩니다(입금확정 기준).
      </div>
    </section>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const el = (id) => document.getElementById(id);
    const treeSelect = el("treeSelect");
    const weekFilter = el("weekFilter");
    const currentWeek = el("currentWeek");
    const slotGrid = el("slotGrid");
    const statusText = el("statusText");

    let trees = [];
    let slots = [];
    let selectedTree = null;

    function won(n){ try { return (n||0).toLocaleString("ko-KR") + "원"; } catch { return n + "원"; } }
    function weekCls(w){ return w===1?"week1":w===2?"week2":w===3?"week3":"week4"; }
    function weekLabel(w){ return w + "주차"; }
    function nowClock(){ el("clock").textContent = new Date().toLocaleString("ko-KR"); }

    function safeRankClass(code){
      const c = String(code || "NONE").toUpperCase().replace(/[^A-Z0-9_]/g, "");
      return "rank-" + c;
    }

    async function loadDepositConfig(){
      const { data, error } = await supabase
        .from("deposit_config")
        .select("bank, account, holder, note, updated_at")
        .eq("id", 1)
        .maybeSingle();

      const d = (!error && data) ? data : { bank:"은행명", account:"000-0000-0000", holder:"예금주", note:"예약 후 입금 → 관리자 입금확정 처리" };

      el("depositInfo").innerHTML = `
        <div><b style="color:var(--text)">${d.bank}</b></div>
        <div class="mono">${d.account}</div>
        <div>예금주: <b style="color:var(--text)">${d.holder}</b></div>
        <div style="margin-top:6px; color:var(--muted); font-size:12px;">${d.note || ""}</div>
      `;
    }

    async function loadTrees(){
      const { data, error } = await supabase
        .from("trees")
        .select("id,name,current_week,is_active,is_archived")
        .or("is_archived.is.null,is_archived.eq.false")
        .order("id", { ascending: false });

      if (error) throw error;
      trees = data || [];

      treeSelect.innerHTML = trees.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
      selectedTree = trees[0] || null;
      if (!selectedTree) {
        statusText.textContent = "트리가 없습니다.";
        return;
      }
      treeSelect.value = String(selectedTree.id);
      currentWeek.value = `${selectedTree.current_week}주차 오픈`;
    }

    async function loadSlots(){
      if (!selectedTree) return;

      const { data, error } = await supabase
        .from("slots")
        .select(`
          id, tree_id, position_key, status,
          slot_templates:template_id (code,title,price_krw,maintain_accounts,sale_week,referral_commission_krw,sort_order),
          trees:tree_id (current_week)
        `)
        .eq("tree_id", selectedTree.id)
        .eq("status", "available")
        .order("id", { ascending: true });

      if (error) throw error;

      const raw = data || [];
      slots = raw;

      const openWeek = (raw[0]?.trees?.current_week ?? selectedTree.current_week ?? 1);

      // 필터
      const wf = weekFilter.value;
      let view = slots;
      if (wf === "all_open") view = slots.filter(s => openWeek >= (s.slot_templates?.sale_week ?? 99));
      else if (wf === "all_all") view = slots;
      else view = slots.filter(s => (s.slot_templates?.sale_week ?? 0) === Number(wf));

      renderSlots(view);
      statusText.textContent = `표시 ${view.length}개 / 전체(available) ${slots.length}개`;
    }

    function renderSlots(list){
      if (!list.length) {
        slotGrid.innerHTML = `<div class="panel" style="grid-column:1/-1;">표시할 슬롯이 없습니다.</div>`;
        return;
      }

      slotGrid.innerHTML = list.map(s => {
        const t = s.slot_templates || {};
        const w = t.sale_week || 0;
        const cls = safeRankClass(t.code);
        return `
          <div class="card ${cls}">
            <div class="topline">
              <div class="name"><span class="r-dot"></span>${t.title || "-"}</div>
              <span class="badge ${weekCls(w)}"><span class="bdot"></span>${weekLabel(w)}</span>
            </div>
            <div class="meta">
              가격: <b>${won(t.price_krw)}</b><br>
              유지: <b>${t.maintain_accounts}계정</b><br>
              슬롯: <span class="mono">${s.position_key}</span>
            </div>
            <div style="margin-top:auto; display:flex; justify-content:flex-end;">
              <button class="btn ghost" disabled>고객 예약은 기존 로직 유지</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function init(){
      nowClock(); setInterval(nowClock, 1000 * 10);

      el("refreshBtn").addEventListener("click", async () => {
        await loadDepositConfig();
        await loadTrees();
        await loadSlots();
      });

      treeSelect.addEventListener("change", async () => {
        const id = Number(treeSelect.value);
        selectedTree = trees.find(t => t.id === id) || null;
        currentWeek.value = selectedTree ? `${selectedTree.current_week}주차 오픈` : "";
        await loadSlots();
      });

      weekFilter.addEventListener("change", loadSlots);

      await loadDepositConfig();
      await loadTrees();
      await loadSlots();
    }

    init();
  </script>
</body>
</html>
